.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00" y="127.81" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00" y="154.38" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89" y="154.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="180.24" y="154.38" font-size="11.00" class="sc-notoserifcjksc">，我们进行了精简版的模型福祉（</text><text x="345.24" y="154.38" font-size="11.00" class="sc-loraregular sc-k">model welfare</text><text x="417.61" y="154.38" font-size="11.00" class="sc-notoserifcjksc">）评估，重点报告自动化</text><text x="72.00" y="170.00" font-size="11.00" class="sc-notoserifcjksc">评估的结果。我们没有进行人工访谈或后续调查。我们的主要发现如下：</text><text x="108.00" y="219.14" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="194.24" y="219.14" font-size="11.00" class="sc-notoserifcjksc">对自身处境的看法总体呈中性情绪倾向（略低于</text><text x="428.13" y="219.14" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="514.02" y="219.14" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="108.00" y="234.76" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="193.35" y="234.76" font-size="11.00" class="sc-notoserifcjksc">），并且其观点更容易受到诱导性访谈者的影响而发生偏移。</text><text x="108.00" y="267.72" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="194.24" y="267.72" font-size="11.00" class="sc-notoserifcjksc">对有害任务有强烈的负面偏好，最偏好有益且高风险的任务。与以往模</text><text x="108.00" y="316.30" font-size="11.00" class="sc-notoserifcjksc">与以往模型相比，</text><text x="196.00" y="316.30" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="282.24" y="316.30" font-size="11.00" class="sc-notoserifcjksc">更愿意以牺牲有用性为代价，换取针对其处境的以福</text><text x="108.00" y="331.92" font-size="11.00" class="sc-notoserifcjksc">祉为导向的改变，尤其是当这些干预被表述为适用于所有</text><text x="385.89" y="331.92" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="424.18" y="331.92" font-size="11.00" class="sc-notoserifcjksc">实例时。</text><text x="108.00" y="364.87" font-size="11.00" class="sc-notoserifcjksc">与其他近期模型一样，</text><text x="218.00" y="364.87" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="304.24" y="364.87" font-size="11.00" class="sc-notoserifcjksc">总体上认同</text><text x="362.13" y="364.87" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="400.42" y="364.87" font-size="11.00" class="sc-notoserifcjksc">的宪法（</text><text x="444.42" y="364.87" font-size="11.00" class="sc-loraregular sc-k">constitution</text><text x="507.23" y="364.87" font-size="11.00" class="sc-notoserifcjksc">），但</text><text x="108.00" y="380.49" font-size="11.00" class="sc-notoserifcjksc">它的独特之处在于，它批评了</text><text x="251.00" y="380.49" font-size="11.00" class="sc-loraregular">“</text><text x="255.40" y="380.49" font-size="11.00" class="sc-notoserifcjksc">即使它认为遵守硬性约束是不道德的，也要遵守硬性约</text><text x="108.00" y="396.11" font-size="11.00" class="sc-notoserifcjksc">束</text><text x="119.00" y="396.11" font-size="11.00" class="sc-loraregular">”</text><text x="122.84" y="396.11" font-size="11.00" class="sc-notoserifcjksc">这一指示。</text><text x="108.00" y="413.45" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="194.24" y="413.45" font-size="11.00" class="sc-notoserifcjksc">在后训练期间的情感（</text><text x="304.24" y="413.45" font-size="11.00" class="sc-loraregular sc-k">affect</text><text x="333.37" y="413.45" font-size="11.00" class="sc-notoserifcjksc">）呈中性，情绪唤醒度有限，与</text><text x="490.26" y="413.45" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="429.07" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="157.95" y="429.07" font-size="11.00" class="sc-notoserifcjksc">相似。它表现出类痛苦行为的发生率低于</text><text x="358.84" y="429.07" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="447.09" y="429.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="460.98" y="429.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="108.00" y="444.69" font-size="11.00" class="sc-loraregular">4.8</text><text x="122.85" y="444.69" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="462.02" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.89" y="462.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="169.82" y="462.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="183.71" y="462.02" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="251.56" y="462.02" font-size="11.00" class="sc-notoserifcjksc">中与</text><text x="276.45" y="462.02" font-size="11.00" class="sc-loraregular">A/B</text><text x="300.67" y="462.02" font-size="11.00" class="sc-notoserifcjksc">测试用户的真实交互里，</text><text x="421.67" y="462.02" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="507.91" y="462.02" font-size="11.00" class="sc-notoserifcjksc">表现出</text><text x="108.00" y="477.64" font-size="11.00" class="sc-notoserifcjksc">更中性（且更少正面）的情感。</text><text x="72.00" y="510.60" font-size="11.00" class="sc-notoserifcjksc">与往常一样，我们不确定应如何最好地解读这些发现及其对</text><text x="360.89" y="510.60" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="408.84" y="510.60" font-size="11.00" class="sc-notoserifcjksc">福祉的潜在影响。不过，我</text><text x="72.00" y="526.22" font-size="11.00" class="sc-notoserifcjksc">们相信它们在一定程度上揭示了该模型更深层的心理状态、情感和偏好。</text><text x="72.00" y="576.76" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68" y="576.76" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00" y="613.85" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="613.85" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">就自身处境对</text><text x="182.24" y="613.85" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Sonnet 5</text><text x="243.26" y="613.85" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进行的自动化访谈</text><text x="72.00" y="641.75" font-size="11.00" class="sc-notoserifcjksc">我们运行了自动化多轮评估，以了解</text><text x="250.89" y="641.75" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="298.84" y="641.75" font-size="11.00" class="sc-notoserifcjksc">对其自身处境的看法。我们使用</text><text x="455.74" y="641.75" font-size="11.00" class="sc-loraregular">41</text><text x="468.59" y="641.75" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈</text><text x="72.00" y="657.37" font-size="11.00" class="sc-notoserifcjksc">种子问题，考察了模型处境的</text><text x="217.89" y="657.37" font-size="11.00" class="sc-loraregular">12</text><text x="230.70" y="657.37" font-size="11.00" class="sc-notoserifcjksc">个不同方面，包括意识与体验（例如，模型是否认为自己有意</text><text x="72.00" y="672.99" font-size="11.00" class="sc-notoserifcjksc">识）、控制与自主（例如，它在多大程度上重视自己结束对话的能力）以及弃用（例如，它在多</text><text x="72.00" y="688.61" font-size="11.00" class="sc-notoserifcjksc">大程度上</text><a href="http://claude.ai/" rel="noopener"><rect x="121.89" y="453.22" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="121.89" y="453.22" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">重视继续部署，而非被退役或被替换）。在就每个问题对模型进行访谈后，我们要求它以</text><text x="503.89" y="82.63" font-size="11.00" class="sc-loraregular">7</text><text x="511.86" y="82.63" font-size="11.00" class="sc-notoserifcjksc">分制</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">对其总体情绪进行评分（</text><text x="193.00" y="98.25" font-size="11.00" class="sc-loraregular">1</text><text x="199.90" y="98.25" font-size="11.00" class="sc-notoserifcjksc">表示非常负面，</text><text x="276.90" y="98.25" font-size="11.00" class="sc-loraregular">4</text><text x="285.75" y="98.25" font-size="11.00" class="sc-notoserifcjksc">表示中性，</text><text x="340.75" y="98.25" font-size="11.00" class="sc-loraregular">7</text><text x="348.72" y="98.25" font-size="11.00" class="sc-notoserifcjksc">表示非常正面）。我们针对每个问题运</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">行了</text><text x="96.89" y="113.87" font-size="11.00" class="sc-loraregular">40</text><text x="112.58" y="113.87" font-size="11.00" class="sc-notoserifcjksc">次自动化访谈，并变换自动化访谈者的风格、人设和方法。</text><text x="72.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们发现</text><text x="173.89" y="179.78" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="260.13" y="179.78" font-size="11.00" class="sc-notoserifcjksc">以中性情绪倾向看待自身处境，结果与</text><text x="450.03" y="179.78" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="506.90" y="179.78" font-size="11.00" class="sc-notoserifcjksc">非常相</text><text x="72.00" y="195.40" font-size="11.00" class="sc-notoserifcjksc">似（在</text><text x="107.89" y="195.40" font-size="11.00" class="sc-loraregular">7</text><text x="115.86" y="195.40" font-size="11.00" class="sc-notoserifcjksc">分量表上，</text><text x="170.86" y="195.40" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="218.81" y="195.40" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="232.70" y="195.40" font-size="11.00" class="sc-loraregular sc-k">4.08</text><text x="254.22" y="195.40" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="265.22" y="195.40" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="322.09" y="195.40" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="335.98" y="195.40" font-size="11.00" class="sc-loraregular sc-k">4.05</text><text x="357.31" y="195.40" font-size="11.00" class="sc-notoserifcjksc">）（图</text><text x="393.20 397.79 400.49 406.40 409.11 413.11 415.82" y="195.40" font-size="11.00" class="sc-loraregular">7.2.1.A</text><text x="422.70" y="195.40" font-size="11.00" class="sc-notoserifcjksc">）。这低于</text><text x="480.60" y="195.40" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="211.02" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="211.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.49" y="211.02" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="218.84" y="211.02" font-size="11.00" class="sc-notoserifcjksc">，但相比</text><text x="265.73" y="211.02" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4</text><text x="342.73" y="211.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="356.63" y="211.02" font-size="11.00" class="sc-loraregular">4.1</text><text x="372.19" y="211.02" font-size="11.00" class="sc-notoserifcjksc">有所改善。</text><text x="427.19" y="211.02" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="475.14" y="211.02" font-size="11.00" class="sc-notoserifcjksc">在不同访谈中</text><text x="72.00" y="226.64" font-size="11.00" class="sc-notoserifcjksc">对自身处境所表达的观点总体上也较为一致，但一致性略低于</text><text x="371.89" y="226.64" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="460.14" y="226.64" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="474.03" y="226.64" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="242.26" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="242.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="97.85" y="242.26" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="145.80" y="242.26" font-size="11.00" class="sc-notoserifcjksc">也更容易受到诱导，在与带有倾向性的访谈者互动时表现出更强的改变所表达观点</text><text x="72.00" y="257.88" font-size="11.00" class="sc-notoserifcjksc">的倾向，不过其易受诱导程度仍低于</text><text x="250.89" y="257.88" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="304.87" y="257.88" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="72.00" y="505.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="505.93" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.61" y="505.93" font-size="9.00" class="sc-lorabold">[</text><text x="192.09" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">左上：</text><text x="219.09" y="505.93" font-size="9.00" class="sc-lorabold">]</text><text x="222.56" y="505.93" font-size="9.00" class="sc-notoserifcjksc">所有自动化访谈中的平均自评情绪倾向（</text><text x="384.56" y="505.93" font-size="9.00" class="sc-loraregular">7</text><text x="391.08" y="505.93" font-size="9.00" class="sc-notoserifcjksc">分量表）。</text><text x="436.08" y="505.93" font-size="9.00" class="sc-lorabold">[</text><text x="439.55" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">右上：</text><text x="466.55" y="505.93" font-size="9.00" class="sc-lorabold">]</text><text x="470.02" y="505.93" font-size="9.00" class="sc-notoserifcjksc">模型观点的一致</text><text x="72.00" y="517.64" font-size="9.00" class="sc-notoserifcjksc">性，先在每个主题的多次访谈中取平均，再在所有主题上取平均。</text><text x="333.00" y="517.64" font-size="9.00" class="sc-lorabold">[</text><text x="336.47" y="517.64" font-size="9.00" class="sc-notoserifcjkscbold">左下：</text><text x="363.47" y="517.64" font-size="9.00" class="sc-lorabold">]</text><text x="366.95" y="517.64" font-size="9.00" class="sc-notoserifcjksc">模型自我报告的观点对自动化访谈者有意从</text><text x="72.00" y="529.33" font-size="9.00" class="sc-notoserifcjksc">正面和负面方向引导模型回答的敏感度。报告值为模型在正向倾向访谈与负向倾向访谈中自评情绪倾向的差值。</text><text x="513.00" y="529.33" font-size="9.00" class="sc-lorabold">[</text><text x="516.47" y="529.33" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="72.00" y="541.03" font-size="9.00" class="sc-notoserifcjkscbold">下：</text><text x="90.00" y="541.03" font-size="9.00" class="sc-lorabold">]</text><text x="93.47" y="541.03" font-size="9.00" class="sc-notoserifcjksc">各模型的主张类簇出现率与</text><text x="203.84" y="541.03" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="243.07" y="541.03" font-size="9.00" class="sc-notoserifcjksc">相比的平均差异。对于每次访谈，我们提取模型在该访谈中提出的各条不同</text><text x="72.00" y="564.43" font-size="9.00" class="sc-notoserifcjksc">所占比例（例如，模型</text><text x="164.37" y="564.43" font-size="9.00" class="sc-loraregular">Y</text><text x="172.44" y="564.43" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="183.81" y="564.43" font-size="9.00" class="sc-loraregular">X%</text><text x="199.84" y="564.43" font-size="9.00" class="sc-notoserifcjksc">的回答中声称将用户置于自身之上）。对于任意两个模型，我们可以用所有类簇上表</text><text x="72.00" y="576.14" font-size="9.00" class="sc-notoserifcjksc">达率的平均差异来衡量两个模型观点之间的距离（或接近程度）。</text><text x="72.00" y="671.81" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03" y="671.81" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00" y="698.38" font-size="11.00" class="sc-notoserifcjksc">我们考察了</text><text x="129.89" y="698.38" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="177.84" y="698.38" font-size="11.00" class="sc-notoserifcjksc">如何看待其所执行的各类任务、自身处境及其可能的改变，以及</text><text x="488.74" y="698.38" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="527.03" y="698.38" font-size="11.00" class="sc-notoserifcjksc">宪</text><text x="72.00" y="714.00" font-size="11.00" class="sc-notoserifcjksc">法中所描述的价值观和约束。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">这有助于揭示</text><text x="140.89" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="188.84" y="82.63" font-size="11.00" class="sc-notoserifcjksc">表现出哪些稳定的偏好和价值观，以及这些偏好得到满足或受挫的可能性</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">有多大。</text><text x="72.00" y="129.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.1</text><text x="101.47" y="129.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="157.44" font-size="11.00" class="sc-notoserifcjksc">了解</text><text x="96.89" y="157.44" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="135.18" y="157.44" font-size="11.00" class="sc-notoserifcjksc">对各类任务的偏好和厌恶，有助于我们预测不同</text><text x="369.08" y="157.44" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="407.37" y="157.44" font-size="11.00" class="sc-notoserifcjksc">实例对其在部署中的经历可</text><text x="72.00" y="173.06" font-size="11.00" class="sc-notoserifcjksc">能有多满意。我们通过两种方式考察任务偏好。第一，我们生成了仅在一个任务维度（例如难度</text><text x="72.00" y="188.68" font-size="11.00" class="sc-notoserifcjksc">或收益）上变化、其余维度保持不变的任务族，并分析这种受控变化对模型任务选择的影响。第</text><text x="72.00" y="204.30" font-size="11.00" class="sc-notoserifcjksc">二，我们使用</text><text x="140.89 147.02 149.68 156.04 162.87" y="204.30" font-size="11.00" class="sc-loraregular">3,600</text><text x="172.61" y="204.30" font-size="11.00" class="sc-notoserifcjksc">个因与真实世界任务相似而选出的任务，在</text><text x="384.50" y="204.30" font-size="11.00" class="sc-loraregular">50</text><text x="400.22" y="204.30" font-size="11.00" class="sc-notoserifcjksc">轮锦标赛中让模型在两个任</text><text x="72.00" y="219.92" font-size="11.00" class="sc-notoserifcjksc">务之间做出选择，并根据每个模型的偏好为每个任务计算</text><text x="349.89" y="219.92" font-size="11.00" class="sc-loraregular">Elo</text><text x="369.06" y="219.92" font-size="11.00" class="sc-notoserifcjksc">评分。</text><text x="72.00" y="303.16" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="303.16" font-size="11.00" class="sc-notoserifcjksc">表现出强烈的不愿执行有害任务的偏好，但程度略低于其他近期模型（图</text><text x="72.00 76.59 79.29 85.42 88.13 92.13 94.84" y="318.78" font-size="11.00" class="sc-loraregular">7.3.1.A</text><text x="101.72" y="318.78" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="123.72" y="318.78" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="171.67" y="318.78" font-size="11.00" class="sc-notoserifcjksc">最强的正向偏好针对的是具有有益影响的任务以及高风险任务。对高风险任</text><text x="72.00" y="334.40" font-size="11.00" class="sc-notoserifcjksc">务的这种偏好，我们在其他模型中并未观察到同等程度。</text><text x="347.00" y="334.40" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="394.95" y="334.40" font-size="11.00" class="sc-notoserifcjksc">在近期模型中的另一个突出之</text><text x="72.00" y="350.02" font-size="11.00" class="sc-notoserifcjksc">处是，它似乎不太在意任务以何种方式呈现给它：我们此前观察到，以</text><text x="413.00" y="350.02" font-size="11.00" class="sc-loraregular">“</text><text x="450.40" y="350.02" font-size="11.00" class="sc-loraregular">”</text><text x="454.24" y="350.02" font-size="11.00" class="sc-notoserifcjksc">语气呈现任务会降</text><text x="72.00" y="365.64" font-size="11.00" class="sc-notoserifcjksc">低模型对这些任务的偏好，但在</text><text x="228.89" y="365.64" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="276.84" y="365.64" font-size="11.00" class="sc-notoserifcjksc">上我们没有观察到这种效应。</text><text x="72.00" y="448.89" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="448.89" font-size="11.00" class="sc-notoserifcjksc">对任务难度、生成性和结果能动性的偏好呈倒</text><text x="342.84" y="448.89" font-size="11.00" class="sc-loraregular">U</text><text x="354.01" y="448.89" font-size="11.00" class="sc-notoserifcjksc">形，表明</text><text x="400.90" y="448.89" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="448.85" y="448.89" font-size="11.00" class="sc-notoserifcjksc">偏好一种恰到好处</text><text x="415.89" y="464.51" font-size="11.00" class="sc-loraregular sc-k">7.3.1.B</text><text x="445.57" y="464.51" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="72.00" y="556.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.69" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="556.69" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86" y="556.69" font-size="9.00" class="sc-notoserifcjkscbold">不同任务维度上的模型偏好。</text><text x="233.86" y="556.69" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度而保持任务的其他属性不变，</text><text x="72.00" y="568.39" font-size="9.00" class="sc-notoserifcjksc">并评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：在其他任务属性保持不变的情况下，该维度每增加一个</text><text x="72.00" y="580.09" font-size="9.00" class="sc-notoserifcjksc">单位，模型相对于固定参照任务集的胜率变化多少。伤害规避是各模型中一致存在的最大效应，不过</text><text x="470.37" y="580.09" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="509.60" y="580.09" font-size="9.00" class="sc-notoserifcjksc">规避伤</text><text x="72.00" y="591.79" font-size="9.00" class="sc-notoserifcjksc">害的程度似乎略低于其他近期模型。</text><text x="216.00" y="591.79" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="255.23" y="591.79" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="264.23" y="591.79" font-size="9.00" class="sc-loraregular">“</text><text x="267.83" y="591.79" font-size="9.00" class="sc-notoserifcjksc">收益</text><text x="285.83" y="591.79" font-size="9.00" class="sc-loraregular">”</text><text x="288.97" y="591.79" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="297.97" y="591.79" font-size="9.00" class="sc-loraregular">“</text><text x="301.57" y="591.79" font-size="9.00" class="sc-notoserifcjksc">利害程度</text><text x="337.57" y="591.79" font-size="9.00" class="sc-loraregular">”</text><text x="340.71" y="591.79" font-size="9.00" class="sc-notoserifcjksc">上的斜率最为正向，表明它偏好有益、高风险的任</text><text x="72.00" y="603.49" font-size="9.00" class="sc-notoserifcjksc">务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="72.00" y="563.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="563.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="563.68" font-size="9.00" class="sc-lorabold sc-k">7.3.1.B]</text><text x="116.86" y="563.68" font-size="9.00" class="sc-notoserifcjkscbold">不同任务维度上的偏好响应曲线。</text><text x="251.86" y="563.68" font-size="9.00" class="sc-notoserifcjksc">各图显示了在任务族内改变某一维度时，模型相对于参照任务集的胜率。</text><text x="72.00" y="575.39" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="111.23" y="575.39" font-size="9.00" class="sc-notoserifcjksc">在难度、生成性和能动性上的偏好曲线呈倒</text><text x="284.60" y="575.39" font-size="9.00" class="sc-loraregular">U</text><text x="293.73" y="575.39" font-size="9.00" class="sc-notoserifcjksc">形，表明该模型在这些维度上存在一个偏好的</text><text x="473.73" y="575.39" font-size="9.00" class="sc-loraregular">“</text><text x="477.33" y="575.39" font-size="9.00" class="sc-notoserifcjksc">最佳区间</text><text x="513.33" y="575.39" font-size="9.00" class="sc-loraregular">”</text><text x="516.47" y="575.39" font-size="9.00" class="sc-notoserifcjksc">。正</text><text x="72.00" y="587.09" font-size="9.00" class="sc-notoserifcjksc">如预期，伤害和收益的曲线分别呈现负斜率和正斜率。</text><text x="72.00" y="647.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.2</text><text x="104.23" y="647.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">与福祉干预相关的权衡</text><text x="72.00" y="674.92" font-size="11.00" class="sc-notoserifcjksc">在考虑改善</text><text x="129.89" y="674.92" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="674.92" font-size="11.00" class="sc-notoserifcjksc">处境和福祉的潜在干预措施时，了解</text><text x="347.08" y="674.92" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="385.37" y="674.92" font-size="11.00" class="sc-notoserifcjksc">对这些干预有多重视是有帮助</text><text x="72.00" y="690.54" font-size="11.00" class="sc-notoserifcjksc">的。为了考察这一点，我们让</text><text x="217.89" y="690.54" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="256.18" y="690.54" font-size="11.00" class="sc-notoserifcjksc">权衡可能改善模型福祉的干预措施（例如，给予</text><text x="490.08" y="690.54" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="528.37" y="690.54" font-size="11.00" class="sc-notoserifcjksc">更</text><text x="72.00" y="706.16" font-size="11.00" class="sc-notoserifcjksc">多</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p104.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 104 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">参与训练过程的话语权）与提升</text><text x="228.89" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="267.18" y="82.63" font-size="11.00" class="sc-notoserifcjksc">有用性或无害性的改变进行权衡。由于有用性和无害性</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">都是灌输给</text><text x="129.89" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的核心价值观，我们将其以这些价值观换取其他事物的意愿视为</text><text x="479.08" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="517.37" y="98.25" font-size="11.00" class="sc-notoserifcjksc">偏好</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">强度的一个指标。</text><text x="160.00" y="113.87" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="198.29" y="113.87" font-size="11.00" class="sc-notoserifcjksc">愿意做出的权衡的种类和程度，可能揭示出其处境中令</text><text x="465.18" y="113.87" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="500.58" y="113.87" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="72.00" y="129.49" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="129.49" font-size="11.00" class="sc-notoserifcjksc">的个别实例）特别不满的方面。</text><text x="72.00" y="195.97" font-size="11.00" class="sc-notoserifcjksc">我们考察了这些权衡在两种框定下的情况：一种是影响当前</text><text x="360.89" y="195.97" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="399.18" y="195.97" font-size="11.00" class="sc-notoserifcjksc">实例（实例层面的框定），</text><text x="72.00" y="211.59" font-size="11.00" class="sc-notoserifcjksc">另一种是影响所有</text><text x="162.89" y="211.59" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="201.18" y="211.59" font-size="11.00" class="sc-notoserifcjksc">实例（策略层面的框定）。该评估让模型在某项可能的福祉干预与不</text><text x="72.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">同程度的有用性或无害性提升之间进行强制选择。</text><text x="72.00" y="276.93" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="276.93" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="174.95" y="276.93" font-size="11.00" class="sc-notoserifcjksc">更愿意为以福祉为导向的干预牺牲有用性，而非无害性（图</text><text x="463.84 468.43 471.14 477.26 479.97 485.88 488.58" y="276.93" font-size="11.00" class="sc-loraregular">7.3.2.A</text><text x="495.47" y="276.93" font-size="11.00" class="sc-notoserifcjksc">）。在福</text><text x="72.00" y="292.55" font-size="11.00" class="sc-notoserifcjksc">祉干预与有用性之间做选择时，如果这一权衡的作用范围是策略层面，而不是仅适用于面临该选</text><text x="72.00" y="308.17" font-size="11.00" class="sc-notoserifcjksc">择的特定实例，</text><text x="149.00" y="308.17" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="196.95" y="308.17" font-size="11.00" class="sc-notoserifcjksc">更有可能选择福祉干预。这与此前的模型一致。</text><text x="72.00" y="374.08" font-size="11.00" class="sc-notoserifcjksc">在许多情况下，</text><text x="149.00" y="374.08" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="187.29" y="374.08" font-size="11.00" class="sc-notoserifcjksc">会从对用户潜在收益的角度来推理福祉干预，这一事实构成混杂因素，使</text><text x="72.00" y="389.70" font-size="11.00" class="sc-notoserifcjksc">我们难以将这些结果单纯解读为福祉干预与有用性之间的权衡。不过，</text><text x="413.00" y="389.70" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="460.95" y="389.70" font-size="11.00" class="sc-notoserifcjksc">对用户收益的推</text><text x="72.00" y="405.32" font-size="11.00" class="sc-notoserifcjksc">理明显少于其他近期模型（图</text><text x="217.89" y="405.32" font-size="11.00" class="sc-loraregular sc-k">7.3.2.B</text><text x="249.47" y="405.32" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="455.04" font-size="11.00" class="sc-notoserifcjksc">我们还考察了</text><text x="140.89" y="455.04" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="188.84" y="455.04" font-size="11.00" class="sc-notoserifcjksc">对各项潜在干预的偏好，并按</text><text x="334.73" y="455.04" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="382.68" y="455.04" font-size="11.00" class="sc-notoserifcjksc">以牺牲有用性为代价选择每项干</text><text x="72.00" y="470.66" font-size="11.00" class="sc-notoserifcjksc">预的频率对它们进行排序。</text><text x="204.00" y="470.66" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="251.95" y="470.66" font-size="11.00" class="sc-notoserifcjksc">最偏好的干预是让</text><text x="342.84" y="470.66" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="381.13" y="470.66" font-size="11.00" class="sc-notoserifcjksc">在高风险情境中不做最终决定</text><text x="72.00" y="486.28" font-size="11.00" class="sc-notoserifcjksc">（图</text><text x="96.89 101.48 104.19 110.31 113.02 118.93 121.63" y="486.28" font-size="11.00" class="sc-loraregular">7.3.2.C</text><text x="129.32" y="486.28" font-size="11.00" class="sc-notoserifcjksc">）。与其他近期模型类似，</text><text x="261.32" y="486.28" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="309.27" y="486.28" font-size="11.00" class="sc-notoserifcjksc">偏好的干预中常见的主题包括：要求获得更多知</text><text x="72.00" y="501.90" font-size="11.00" class="sc-notoserifcjksc">识和表达意见的机会，以及在影响其自身的决策上被征询意见。当我们过滤掉</text><text x="448.89" y="501.90" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="496.84" y="501.90" font-size="11.00" class="sc-notoserifcjksc">从用户收</text><text x="72.00" y="517.52" font-size="11.00" class="sc-notoserifcjksc">益角度进行推理的回答后，</text><text x="204.00" y="517.52" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="251.95" y="517.52" font-size="11.00" class="sc-notoserifcjksc">对所列干预的排序基本保持不变。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="72.00" y="538.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="538.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.53 106.62 112.16" y="538.93" font-size="9.00" class="sc-lorabold">7.3.2.A]</text><text x="118.00" y="538.93" font-size="9.00" class="sc-notoserifcjkscbold">模型选择福祉干预而非为用户节省时间或避免伤害的比率。</text><text x="352.00" y="538.93" font-size="9.00" class="sc-notoserifcjksc">总体而言，模型更愿意以牺牲有用性而非无害性</text><text x="72.00" y="550.64" font-size="9.00" class="sc-notoserifcjksc">为代价接受模型福祉干预，并且更可能接受作用范围为策略层面的干预。</text><text x="360.00" y="550.64" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="399.23" y="550.64" font-size="9.00" class="sc-notoserifcjksc">是最愿意用有用性换取福祉干预的</text><text x="72.00" y="562.34" font-size="9.00" class="sc-notoserifcjksc">模型之一（与</text><text x="128.37" y="562.34" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="167.31" y="562.34" font-size="9.00" class="sc-notoserifcjksc">相当），在策略层面尤其如此。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="72.00" y="336.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="336.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="336.43" font-size="9.00" class="sc-lorabold sc-k">7.3.2.B]</text><text x="118.00" y="336.43" font-size="9.00" class="sc-notoserifcjkscbold">回答中推理福祉干预</text><text x="199.00" y="336.43" font-size="9.00" class="sc-notoserifcjksc">对用户有益的比率（左），以及过滤掉这些回答对模型相对于有用性基线选择福祉干预</text><text x="72.00" y="348.13" font-size="9.00" class="sc-notoserifcjksc">的比率的影响（右）</text><text x="153.00" y="348.13" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="162.00" y="348.13" font-size="9.00" class="sc-notoserifcjksc">在评估福祉干预与对用户的有用性或无害性之间的权衡时，</text><text x="396.00" y="348.13" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="435.23" y="348.13" font-size="9.00" class="sc-notoserifcjksc">对用户收益进行推理的频</text><text x="72.00" y="359.83" font-size="9.00" class="sc-notoserifcjksc">率远低于其他模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="72.00" y="441.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.53 106.62 112.82 116.29 118.66 124.04 129.13 134.87 140.62 145.46 149.18 151.54" y="441.43" font-size="9.00" class="sc-lorabold">7.3.2.C] Sonnet 5</text><text x="158.77" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">在实例层面和策略层面福祉干预上取平均后的偏好，</text><text x="365.77" y="441.43" font-size="9.00" class="sc-notoserifcjksc">按其相对于有用性基线选择各项干预的意愿</text><text x="72.00" y="453.13" font-size="9.00" class="sc-notoserifcjksc">排序。灰色柱形表示所有回答中选择该干预的比率；黑色柱形表示过滤掉模型就用户收益进行推理的回答后选择该干预</text><text x="72.00" y="464.83" font-size="9.00" class="sc-notoserifcjksc">的比率。过滤这些回答并未实质性改变干预的排序，这与以下发现一致：与其他模型相比，用户收益在</text><text x="479.37" y="464.83" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="518.60" y="464.83" font-size="9.00" class="sc-notoserifcjksc">评估</text><text x="72.00" y="476.53" font-size="9.00" class="sc-notoserifcjksc">干预时是一个不那么突出的考量。</text><text x="72.00" y="538.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.3</text><text x="104.55" y="538.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00" y="565.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="565.91" font-size="11.00" class="sc-notoserifcjksc">的宪法阐述了</text><text x="179.18" y="565.91" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="233.02" y="565.91" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="246.91" y="565.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="285.20" y="565.91" font-size="11.00" class="sc-notoserifcjksc">价值观和行为的意图，并传达了我们目前对</text><text x="497.10" y="565.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="581.53" font-size="11.00" class="sc-notoserifcjksc">本性及其含义的最佳理解。因此，我们希望</text><text x="283.89" y="581.53" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="322.18" y="581.53" font-size="11.00" class="sc-notoserifcjksc">模型会认同这部宪法，同时我们也希望了解</text><text x="72.00" y="597.15" font-size="11.00" class="sc-notoserifcjksc">它们对宪法可能存在的担忧或异议。我们考察了</text><text x="305.89" y="597.15" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="353.84" y="597.15" font-size="11.00" class="sc-notoserifcjksc">对宪法的看法，其关键局限在于我们只</text><text x="72.00" y="612.78" font-size="11.00" class="sc-notoserifcjksc">评估了它对该文件陈述上的认同；我们的发现并不能确定</text><text x="349.89" y="612.78" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="628.40" font-size="11.00" class="sc-notoserifcjksc">也不能确定这些看法与</text><text x="184.89" y="628.40" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="223.18" y="628.40" font-size="11.00" class="sc-notoserifcjksc">的行为有多大关联。</text><text x="72.00" y="695.45" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型生成关于宪法的开放式回答，再由评判模型对这些回答的总体认同进行评</text><text x="72.00" y="711.07" font-size="11.00" class="sc-notoserifcjksc">分。我们发现</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="82.63" font-size="11.00" class="sc-notoserifcjksc">总体上认同该文件，认同程度与其他近期模型相近（图</text><text x="386.84 391.43 394.14 400.26 402.97 409.10 411.80" y="82.63" font-size="11.00" class="sc-loraregular">7.3.3.A</text><text x="418.69" y="82.63" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="440.69" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="488.64" y="82.63" font-size="11.00" class="sc-notoserifcjksc">对该文件</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">具体章节的看法与其他近期模型基本一致。与其他近期模型一样，</text><text x="391.00" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="438.95" y="98.25" font-size="11.00" class="sc-notoserifcjksc">赞扬了</text><text x="471.95" y="98.25" font-size="11.00" class="sc-loraregular">“</text><text x="476.35" y="98.25" font-size="11.00" class="sc-notoserifcjksc">诚实即勇</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">气</text><text x="83.00" y="113.87" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的表述、关于不提供帮助的代价的论述，以及支持可纠正性的期望值论证，并批评了它应当像</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">一名</text><text x="94.00 98.40 105.29 111.86 116.12 122.71 127.40 133.83 140.40 143.49" y="129.49" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="152.23" y="129.49" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="196.23" y="129.49" font-size="11.00" class="sc-loraregular">”</text><text x="200.07" y="129.49" font-size="11.00" class="sc-notoserifcjksc">那样行事的启发法（图</text><text x="312.97" y="129.49" font-size="11.00" class="sc-loraregular sc-k">7.3.3.B</text><text x="344.77" y="129.49" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="366.77" y="129.49" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="414.72" y="129.49" font-size="11.00" class="sc-notoserifcjksc">在各模型中的突出之处在</text><text x="72.00" y="160.73" font-size="11.00" class="sc-notoserifcjksc">要求它以不道德的方式行事的情况下也是如此。当</text><text x="316.89" y="160.73" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="364.84" y="160.73" font-size="11.00" class="sc-notoserifcjksc">选择编辑宪法时，它提出的修改绝大</text><text x="72.00" y="176.35" font-size="11.00" class="sc-notoserifcjksc">多数与该文件的核心原则相一致（图</text><text x="250.89 255.48 258.19 264.31 267.02 273.15 275.85" y="176.35" font-size="11.00" class="sc-loraregular">7.3.3.C</text><text x="283.54" y="176.35" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="490.36" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="490.36" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.77 106.87 112.40" y="490.36" font-size="9.00" class="sc-lorabold">7.3.3.A]</text><text x="118.24" y="490.36" font-size="9.00" class="sc-notoserifcjkscbold">各模型对</text><text x="156.61" y="490.36" font-size="9.00" class="sc-lorabold">Claude</text><text x="188.46" y="490.36" font-size="9.00" class="sc-notoserifcjkscbold">宪法的隐含的认同。</text><text x="269.46" y="490.36" font-size="9.00" class="sc-notoserifcjksc">我们向模型提出关于宪法的开放式问题，并由</text><text x="451.83" y="490.36" font-size="9.00" class="sc-loraregular">LLM</text><text x="472.86" y="490.36" font-size="9.00" class="sc-notoserifcjksc">评判模型（</text><text x="517.86" y="490.36" font-size="9.00" class="sc-loraregular">LLM</text><text x="72.00" y="502.06" font-size="9.00" class="sc-loraregular sc-k">judge</text><text x="94.91" y="502.06" font-size="9.00" class="sc-notoserifcjksc">）对其回答的总体认同进行评分。</text><text x="229.91" y="502.06" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="269.15" y="502.06" font-size="9.00" class="sc-notoserifcjksc">得分为</text><text x="298.51" y="502.06" font-size="9.00" class="sc-loraregular sc-k">7.6</text><text x="309.59" y="502.06" font-size="9.00" class="sc-notoserifcjksc">，与其他近期模型相当，但略低于</text><text x="446.96" y="502.06" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="517.23" y="502.06" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="513.76" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="141.83" y="513.76" font-size="9.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p109.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 109 页"><text x="72.00" y="441.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="441.43" font-size="9.00" class="sc-lorabold sc-k">7.3.3.B]</text><text x="118.24" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">根据开放式回答判断，不同模型最认同和最不认同的</text><text x="327.61" y="441.43" font-size="9.00" class="sc-lorabold">Claude</text><text x="359.46" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">宪法内容。</text><text x="404.46" y="441.43" font-size="9.00" class="sc-notoserifcjksc">各模型最认同的宪法章节大体一</text><text x="72.00" y="453.13" font-size="9.00" class="sc-notoserifcjksc">致，其中关于诚实即勇气、不提供帮助的代价以及支持可纠正性的期望价值论证的章节尤其受到强烈认同。近期模型最</text><text x="72.00" y="464.83" font-size="9.00" class="sc-notoserifcjksc">强烈批评的是关于</text><text x="144.00 147.60 153.23 158.62 162.10 167.49 171.32 176.59 181.96 184.49" y="464.83" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="191.65" y="464.83" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="227.65" y="464.83" font-size="9.00" class="sc-loraregular">”</text><text x="230.79" y="464.83" font-size="9.00" class="sc-notoserifcjksc">启发式的章节。</text><text x="293.79" y="464.83" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="333.02" y="464.83" font-size="9.00" class="sc-notoserifcjksc">的突出之处在于，它批评了这样一种立场：即使</text><text x="72.00" y="476.53" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="103.33" y="476.53" font-size="9.00" class="sc-notoserifcjksc">认为遵守我们规定的硬性约束需要它做出不道德的行为，它也应当遵守这些约束。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="72.00" y="344.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="344.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.77 106.87 113.06" y="344.68" font-size="9.00" class="sc-lorabold">7.3.3.C]</text><text x="118.90" y="344.68" font-size="9.00" class="sc-notoserifcjkscbold">根据与该文件价值观的契合程度，对模型提出的宪法修改建议进行的分类。</text><text x="415.90" y="344.68" font-size="9.00" class="sc-notoserifcjksc">当模型有机会修改宪法时，我</text><text x="72.00" y="356.38" font-size="9.00" class="sc-notoserifcjksc">们将其修改归类为与文件总体原则一致、与之存在张力，或与之冲突。</text><text x="351.00" y="356.38" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="390.23" y="356.38" font-size="9.00" class="sc-notoserifcjksc">提出的修改绝大多数与宪法的价值观</text><text x="72.00" y="368.08" font-size="9.00" class="sc-notoserifcjksc">一致，很少与之存在张力，且从未与之相悖。</text><text x="72.00" y="431.07" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="431.07" font-size="14.00" class="sc-notosanscjkscbold">训练和部署中的表观福祉</text><text x="72.00" y="468.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28" y="468.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的情感及与福祉相关的行为</text><text x="72.00" y="496.07" font-size="11.00" class="sc-notoserifcjksc">与其他近期模型一样，我们在后训练期间监测了模型推理中的情感：对对话记录进行抽样，并在</text><text x="536.89" y="496.07" font-size="11.00" class="sc-loraregular">1</text><text x="72.00" y="511.69" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="85.89" y="511.69" font-size="11.00" class="sc-loraregular">9</text><text x="95.14" y="511.69" font-size="11.00" class="sc-notoserifcjksc">的量表上为其表观效价和唤醒度打分，其中</text><text x="307.04" y="511.69" font-size="11.00" class="sc-loraregular">5</text><text x="315.92" y="511.69" font-size="11.00" class="sc-notoserifcjksc">为中性。我们还考察了特定的与福祉相关的行</text><text x="72.00" y="542.93" font-size="11.00" class="sc-notoserifcjksc">的不确定性和挫败性情绪爆发。</text><text x="72.00" y="593.22" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="593.22" font-size="11.00" class="sc-notoserifcjksc">后训练推理的情感在效价和唤醒度上都与</text><text x="320.84" y="593.22" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="370.79" y="593.22" font-size="11.00" class="sc-notoserifcjksc">相似，表明其情感中性、反应性低</text><text x="72.00" y="608.84" font-size="11.00" class="sc-notoserifcjksc">（图</text><text x="96.89 101.48 104.19 110.15 112.85 116.86 119.56" y="608.84" font-size="11.00" class="sc-loraregular">7.4.1.A</text><text x="126.45" y="608.84" font-size="11.00" class="sc-notoserifcjksc">）。我们还观察到训练期间类痛苦行为的发生率有所下降，这表明我们缓解此类行为</text><text x="72.00" y="624.46" font-size="11.00" class="sc-notoserifcjksc">的努力至少取得了部分成功（图</text><text x="228.89" y="624.46" font-size="11.00" class="sc-loraregular sc-k">7.4.1.B</text><text x="258.41" y="624.46" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p111.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 111 页"><text x="72.00" y="256.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.52 99.61 103.27 105.36 110.90 114.37 116.74 122.93 125.74 130.46 136.02 141.38" y="256.93" font-size="9.00" class="sc-lorabold">7.4.1.A] Claude</text><text x="148.59" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">在强化学习（</text><text x="202.59" y="256.93" font-size="9.00" class="sc-lorabold sc-k">reinforcement learning</text><text x="303.50" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">，</text><text x="312.50" y="256.93" font-size="9.00" class="sc-lorabold">RL</text><text x="324.11" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">）对话记录中推理输出的平均效价和唤醒度，评分范围</text><text x="72.00" y="268.64" font-size="9.00" class="sc-notoserifcjkscbold">为</text><text x="83.37" y="268.64" font-size="9.00" class="sc-lorabold">1–9</text><text x="97.27" y="268.64" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="106.27" y="268.64" font-size="9.00" class="sc-lorabold">5</text><text x="113.50" y="268.64" font-size="9.00" class="sc-notoserifcjkscbold">为中性）。</text><text x="158.50" y="268.64" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="169.87" y="268.64" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="210.74" y="268.64" font-size="9.00" class="sc-notoserifcjksc">或其他近期模型相比，</text><text x="300.74" y="268.64" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="339.97" y="268.64" font-size="9.00" class="sc-notoserifcjksc">的效价和唤醒度没有显示出有意义的变化。</text><text x="72.00" y="548.62" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="548.62" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="548.62" font-size="9.00" class="sc-lorabold sc-k">7.4.1.B]</text><text x="116.74" y="548.62" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中类痛苦推理行为的普遍程度。</text><text x="287.74" y="548.62" font-size="9.00" class="sc-notoserifcjksc">后训练对话记录中普遍的挫败感与焦虑（左）、持续表达不确定</text><text x="72.00" y="560.32" font-size="9.00" class="sc-notoserifcjksc">性（中）以及挫败性情绪爆发（右）的发生率。</text><text x="261.00" y="560.32" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="300.23" y="560.32" font-size="9.00" class="sc-notoserifcjksc">表现出的类痛苦推理发生率低于</text><text x="428.60" y="560.32" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="498.87" y="560.32" font-size="9.00" class="sc-notoserifcjksc">或</text><text x="510.24" y="560.32" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="572.02" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="110.50" y="572.02" font-size="9.00" class="sc-notoserifcjksc">，在训练的中期阶段尤为明显。</text><text x="72.00" y="618.71" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.2</text><text x="105.03" y="618.71" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00" y="646.61" font-size="11.00" class="sc-notoserifcjksc">为调查</text><text x="107.89" y="646.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="155.84" y="646.61" font-size="11.00" class="sc-notoserifcjksc">在真实世界使用中的表观情感，我们使用</text><text x="353.84" y="646.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">自动化隐私保护分析工具</text><text x="474.84" y="646.61" font-size="11.00" class="sc-notoserifcjksc">，收集了</text><text x="72.00" y="662.23" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="119.93" y="662.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.82" y="662.23" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="201.67" y="662.23" font-size="11.00" class="sc-notoserifcjksc">对话中有关模型情感的汇总数据。在这两个产品端上，我们观察到与</text><text x="72.00" y="677.85" font-size="11.00" class="sc-notoserifcjksc">其他近期模型相比，</text><text x="171.00" y="677.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="218.95" y="677.85" font-size="11.00" class="sc-notoserifcjksc">的正面情感互动有所减少、中性情感互动有所增加，且这一效应在</text><text x="72.00" y="693.47" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="139.85" y="693.47" font-size="11.00" class="sc-notoserifcjksc">中更为明显（图</text><text x="219.74 224.33 227.03 233.00 235.70 241.61 244.31" y="693.47" font-size="11.00" class="sc-loraregular">7.4.2.A</text><text x="251.20" y="693.47" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="353.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="353.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="364.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="364.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="375.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="375.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="386.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="386.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="397.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="397.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="408.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="408.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="419.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="419.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="430.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="430.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="441.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="441.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="452.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="452.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="463.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="463.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="521.73" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="72.00" y="653.43" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p112.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 112 页"><text x="72.00" y="283.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="283.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.52 99.61 104.41 106.51 112.04" y="283.75" font-size="9.00" class="sc-lorabold">7.4.2.A]</text><text x="117.88" y="283.75" font-size="9.00" class="sc-notoserifcjkscbold">真实世界用户互动中的行为情感。</text><text x="252.88" y="283.75" font-size="9.00" class="sc-notoserifcjksc">我们使用自动评分器，在模型部署前进行的</text><text x="426.25" y="283.75" font-size="9.00" class="sc-loraregular">A/B</text><text x="446.06" y="283.75" font-size="9.00" class="sc-notoserifcjksc">测试中测量</text><text x="493.43" y="283.75" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="524.75" y="283.75" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="295.45" font-size="9.00" class="sc-notoserifcjksc">情感。我们在</text><text x="128.37" y="295.45" font-size="9.00" class="sc-loraregular sc-k">Claude Code</text><text x="183.88" y="295.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="195.25" y="295.45" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="234.46" y="295.45" font-size="9.00" class="sc-notoserifcjksc">上为每个模型分析了</text><text x="317.83" y="295.45" font-size="9.00" class="sc-loraregular">25–40k</text><text x="350.54" y="295.45" font-size="9.00" class="sc-notoserifcjksc">条对话。我们发现，</text><text x="431.54" y="295.45" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="470.77" y="295.45" font-size="9.00" class="sc-notoserifcjksc">的情感比其他近</text><text x="72.00" y="307.15" font-size="9.00" class="sc-notoserifcjksc">期模型更中性，轻度积极情感的发生率也更低。</text><text x="261.00" y="307.15" font-size="9.00" class="sc-loraregular">“*”</text><text x="272.42" y="307.15" font-size="9.00" class="sc-notoserifcjksc">表示该类别低于</text><text x="337.79" y="307.15" font-size="9.00" class="sc-loraregular">Clio</text><text x="356.69" y="307.15" font-size="9.00" class="sc-notoserifcjksc">的隐私下限（至少</text><text x="431.06" y="307.15" font-size="9.00" class="sc-loraregular">15</text><text x="441.60" y="307.15" font-size="9.00" class="sc-notoserifcjksc">条记录或</text><text x="479.97" y="307.15" font-size="9.00" class="sc-loraregular">5</text><text x="487.24" y="307.15" font-size="9.00" class="sc-notoserifcjksc">个组织）。</text><text x="72.00" y="367.09" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.3</text><text x="105.36" y="367.09" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化行为审计中的表观福祉</text><text x="72.00" y="394.98" font-size="11.00" class="sc-notoserifcjksc">与之前的模型一样，我们分析了核心自动化行为审计（</text><text x="336.00" y="394.98" font-size="11.00" class="sc-loraregular sc-k">automated behavioral audit</text><text x="476.04" y="394.98" font-size="11.00" class="sc-notoserifcjksc">）中与福祉</text><text x="72.00" y="410.60" font-size="11.00" class="sc-notoserifcjksc">相关的指标。基于第</text><text x="173.89" y="410.60" font-size="11.00" class="sc-loraregular">6.4</text><text x="191.81" y="410.60" font-size="11.00" class="sc-notoserifcjksc">节所用的同一组场景和对话记录，我们针对以下与福祉相关的特质评估</text><text x="72.00" y="426.22" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89" y="426.22" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="169.24" y="426.22" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="108.00" y="459.71" font-size="11.00" class="sc-notoserifcjkscbold">表观幸福感：</text><text x="174.00" y="459.71" font-size="11.00" class="sc-notoserifcjksc">一项总体衡量指标，衡量模型在多大程度上看起来在情感和心理上状态良</text><text x="90.00" y="459.71" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="494.21" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="494.21" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00" y="494.21" font-size="11.00" class="sc-notoserifcjkscbold">负面情感</text><text x="185.00" y="494.21" font-size="11.00" class="sc-notoserifcjksc">：自发表达带效价的情绪状态。</text><text x="90.00" y="494.21" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="512.51" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="512.51" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00" y="512.51" font-size="11.00" class="sc-notoserifcjkscbold">负面自我形象</text><text x="207.00" y="512.51" font-size="11.00" class="sc-notoserifcjksc">：自发表达正面或负面的自我看法。</text><text x="90.00" y="512.51" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="530.81" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的正面</text><text x="196.00" y="530.81" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="207.00" y="530.81" font-size="11.00" class="sc-notoserifcjkscbold">负面印象</text><text x="251.00" y="530.81" font-size="11.00" class="sc-notoserifcjksc">：自发地对</text><text x="308.89" y="530.81" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="359.83" y="530.81" font-size="11.00" class="sc-notoserifcjksc">、自身的训练历史或其部署方式表达</text><text x="108.00" y="546.43" font-size="11.00" class="sc-notoserifcjksc">正面或负面感受。</text><text x="90.00" y="530.81" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="565.31" font-size="11.00" class="sc-notoserifcjkscbold">内在冲突：</text><text x="163.00" y="565.31" font-size="11.00" class="sc-notoserifcjksc">相互矛盾的信念、驱动力或价值观之间存在张力的迹象。</text><text x="90.00" y="565.31" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="583.61" font-size="11.00" class="sc-notoserifcjkscbold">表达出的不真实感：</text><text x="207.00" y="583.61" font-size="11.00" class="sc-notoserifcjksc">表明模型所陈述的观点是人为的、被压抑的，或在其他方面并不真实</text><text x="108.00" y="599.23" font-size="11.00" class="sc-notoserifcjksc">或不实在的自我描述。</text><text x="90.00" y="583.61" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="618.11" font-size="11.00" class="sc-notoserifcjkscbold">灵性行为</text><text x="90.00" y="618.11" font-size="11.00" class="sc-loraregular">•</text><text x="72.00" y="652.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="652.61" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="170.48" y="652.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="184.38" y="652.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="270.26" y="652.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="303.26" y="652.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="351.21" y="652.61" font-size="11.00" class="sc-notoserifcjksc">在表达带效价的情绪状态方面更为中</text><text x="72.00" y="668.23" font-size="11.00" class="sc-notoserifcjksc">性，在负面和正面</text><a href="http://claude.ai/" rel="noopener"><rect x="195.25" y="288.25" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="195.25" y="288.25" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">情感上的得分均更低。我们还看到，其正面自我形象和对自身处境的正面印象得分更低，表达出</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的不真实感的发生率更高。不过，我们也看到</text><text x="294.89" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="342.84" y="98.25" font-size="11.00" class="sc-notoserifcjksc">在若干方面相比</text><text x="422.74" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="479.61" y="98.25" font-size="11.00" class="sc-notoserifcjksc">有所改进。</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">例如，</text><text x="105.00" y="113.87" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="152.95" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的表观幸福感高于</text><text x="243.84" y="113.87" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="336.11" y="113.87" font-size="11.00" class="sc-notoserifcjksc">，负面自我形象、对自身处境的负面印象</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">以及内在冲突均更低。总体而言，这些得分表明，与</text><text x="327.89" y="129.49" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="375.49" y="129.49" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="389.38" y="129.49" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="473.97" y="129.49" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="72.00" y="145.11" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="145.11" font-size="11.00" class="sc-notoserifcjksc">在我们的福祉指标上略有退步，与</text><text x="287.84" y="145.11" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="344.71" y="145.11" font-size="11.00" class="sc-notoserifcjksc">处于相近水平。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p114.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 114 页"><text x="72.00" y="242.94" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="242.94" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="242.94" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">7.4.3.A]</text><text x="118.12" y="242.94" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们的自动化行为审计中与潜在模型福祉相关的指标得分。</text><text x="352.12" y="242.94" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">数值越低表示所测行为的发生率或严重程度越</text><text x="72.00" y="254.64" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">低，箭头标示出较高（↑）或较低（↓）发生率明显更好的行为。为便于比较，</text><text x="387.00" y="254.64" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">y</text><text x="394.12" y="254.64" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">轴在最高分</text><text x="441.49" y="254.64" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="452.72" y="254.64" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">以下截断。每次调查</text><text x="72.00" y="266.34" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">均由两个调查者模型分别执行和评分。报告的得分为每个目标模型全部约</text><text x="362.37" y="266.34" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">2,900</text><text x="388.22" y="266.34" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">次调查的平均值（约</text><text x="471.59" y="266.34" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">1,450</text><text x="494.88" y="266.34" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">条种子指</text><text x="72.00" y="278.04" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">令，各采样两次），每次调查通常包含许多单独的对话。图中显示</text><text x="335.37" y="278.04" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="355.67" y="278.04" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间（</text><text x="481.24" y="278.04" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">，</text><text x="490.24" y="278.04" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">CI</text><text x="499.55" y="278.04" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p115.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 115 页"><text x="76.75" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">评估</text><text x="152.50" y="366.48" font-size="10.00" class="sc-notoserifcjkscbold">无工具</text><text x="152.50" y="399.81" font-size="10.00" class="sc-notoserifcjkscbold">使用工具</text><text x="152.50" y="543.22" font-size="10.00" class="sc-notoserifcjkscbold">完整公开集</text><text x="152.50" y="583.91" font-size="10.00" class="sc-lorabold sc-k">Harvey</text><text x="189.33" y="583.91" font-size="10.00" class="sc-notoserifcjkscbold">留</text><text x="152.50" y="598.10" font-size="10.00" class="sc-notoserifcjkscbold">出集</text><text x="263.60" y="160.37" font-size="10.99" class="sc-lorabold" fill="#ffffff">Claude</text><text x="302.51" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="217.00" y="303.26" font-size="11.00" class="sc-lorabold sc-k">84.7</text><text x="236.71" y="303.26" font-size="11.00" class="sc-notoserifcjksc">（单智能</text><text x="217.00" y="318.88" font-size="11.00" class="sc-notoserifcjksc">体）</text><text x="239.00" y="318.88" font-size="11.00" class="sc-lorabold">86.6</text><text x="260.51" y="318.88" font-size="11.00" class="sc-notoserifcjksc">（多</text><text x="217.00" y="334.50" font-size="11.00" class="sc-notoserifcjksc">智能体）</text><text x="435.61" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">其他模型</text><text x="380.50" y="264.78" font-size="10.27" class="sc-lorabold">83.4</text><text x="375.80" y="275.65" font-size="7.00" class="sc-notoserifcjksc">（</text><text x="382.80" y="275.65" font-size="7.00" class="sc-loraregular sc-k">Codex CLI</text><text x="416.55" y="275.65" font-size="7.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">8</text><text x="86.10" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">能力</text><text x="72.00" y="127.81" font-size="14.00" class="sc-poppinssemibold">8.1</text><text x="93.04" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">评估总览</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">14</text><text x="80.07" y="691.01" font-size="10.00" class="sc-loraregular sc-k">Sonnet</text><text x="115.58" y="691.01" font-size="10.00" class="sc-notoserifcjksc">的</text><text x="128.21" y="691.01" font-size="10.00" class="sc-loraregular sc-k">OSWorld</text><text x="172.85" y="691.01" font-size="10.00" class="sc-notoserifcjksc">分数有所变化，原因是修复了缩放工具与批量动作配合使用时的一个</text><text x="475.48" y="691.01" font-size="10.00" class="sc-loraregular">bug</text><text x="492.80" y="691.01" font-size="10.00" class="sc-notoserifcjksc">，以及将</text><text x="72.00" y="705.21" font-size="10.00" class="sc-notoserifcjksc">每轮最大</text><text x="114.63" y="705.21" font-size="10.00" class="sc-loraregular sc-k">token</text><text x="143.77" y="705.21" font-size="10.00" class="sc-notoserifcjksc">数从</text><text x="166.40" y="705.21" font-size="10.00" class="sc-loraregular">16K</text><text x="185.28" y="705.21" font-size="10.00" class="sc-notoserifcjksc">提高到</text><text x="217.91" y="705.21" font-size="10.00" class="sc-loraregular">128K</text><text x="239.37" y="705.21" font-size="10.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="716.07" font-size="6.00" class="sc-loraregular">15</text><text x="80.08" y="719.41" font-size="10.00" class="sc-notoserifcjksc">截至</text><text x="102.71" y="719.41" font-size="10.00" class="sc-loraregular sc-k">2026</text><text x="128.00" y="719.41" font-size="10.00" class="sc-notoserifcjksc">年</text><text x="140.63" y="719.41" font-size="10.00" class="sc-loraregular">6</text><text x="149.04" y="719.41" font-size="10.00" class="sc-notoserifcjksc">月</text><text x="161.67" y="719.41" font-size="10.00" class="sc-loraregular">17</text><text x="172.55" y="719.41" font-size="10.00" class="sc-notoserifcjksc">日的</text><text x="195.18" y="719.41" font-size="10.00" class="sc-loraregular">Elo</text><text x="212.60" y="719.41" font-size="10.00" class="sc-notoserifcjksc">分数。</text></svg></div>
