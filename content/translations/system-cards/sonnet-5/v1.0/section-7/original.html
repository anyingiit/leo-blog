t><text x="210.74 219.74 228.74 237.74 246.74 255.74 264.74 273.74 282.74 291.74" y="268.64" font-size="9.00" class="sc-notoserifcjksc">或其他近期模型相比，</text><text x="300.74 305.84 311.10 316.57 322.03 326.84 330.33 332.69" y="268.64" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="339.97 348.97 357.97 366.97 375.97 384.97 393.97 402.97 411.97 420.97 429.97 438.97 447.97 456.97 465.97 474.97 483.97 492.97 501.97" y="268.64" font-size="9.00" class="sc-notoserifcjksc">的效价和唤醒度没有显示出有意义的变化。</text><text x="72.00" y="548.62" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="548.62" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="548.62" font-size="9.00" class="sc-lorabold">7.4.1.B]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74 224.74 233.74 242.74 251.74 260.74 269.74 278.74" y="548.62" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中类痛苦推理行为的普遍程度。</text><text x="287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74 431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74 530.74" y="548.62" font-size="9.00" class="sc-notoserifcjksc">后训练对话记录中普遍的挫败感与焦虑（左）、持续表达不确定</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00" y="560.32" font-size="9.00" class="sc-notoserifcjksc">性（中）以及挫败性情绪爆发（右）的发生率。</text><text x="261.00 266.10 271.37 276.83 282.29 287.11 290.59 292.96" y="560.32" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="300.23 309.23 318.23 327.23 336.23 345.23 354.23 363.23 372.23 381.23 390.23 399.23 408.23 417.23" y="560.32" font-size="9.00" class="sc-notoserifcjksc">表现出的类痛苦推理发生率低于</text><text x="428.60 434.89 437.34 441.93 447.30 452.68 457.56 459.93 467.07 472.45 477.82 481.99 484.35 489.23 491.44" y="560.32" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="498.87" y="560.32" font-size="9.00" class="sc-notoserifcjksc">或</text><text x="510.24 516.53 518.98 523.57 528.94 534.32" y="560.32" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60" y="572.02" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="110.50 119.50 128.50 137.50 146.50 155.50 164.50 173.50 182.50 191.50 200.50 209.50 218.50 227.50" y="572.02" font-size="9.00" class="sc-notoserifcjksc">，在训练的中期阶段尤为明显。</text><text x="72.00 79.12 82.50 91.10 94.48" y="618.71" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.2</text><text x="105.03 118.03 131.03 144.03 157.03 170.03 183.03 196.03" y="618.71" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00 83.00 94.00" y="646.61" font-size="11.00" class="sc-notoserifcjksc">为调查</text><text x="107.89 114.13 120.57 127.24 133.92 139.80 144.06 146.95" y="646.61" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="155.84 166.84 177.84 188.84 199.84 210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84" y="646.61" font-size="11.00" class="sc-notoserifcjksc">在真实世界使用中的表观情感，我们使用</text><text x="353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84" y="646.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">自动化隐私保护分析工具</text><text x="474.84 485.84 496.84 507.84" y="646.61" font-size="11.00" class="sc-notoserifcjksc">，收集了</text><text x="72.00 77.85 80.84 86.45 93.02 99.60 105.56 108.27 113.94" y="662.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="119.93" y="662.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.82 141.51 144.50 150.11 156.68 163.26 169.22 172.11 179.80 186.24 192.81" y="662.23" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="201.67 212.67 223.67 234.67 245.67 256.67 267.67 278.67 289.67 300.67 311.67 322.67 333.67 344.67 355.67 366.67 377.67 388.67 399.67 410.67 421.67 432.67 443.67 454.67 465.67 476.67 487.67 498.67 509.67 520.67" y="662.23" font-size="11.00" class="sc-notoserifcjksc">对话中有关模型情感的汇总数据。在这两个产品端上，我们观察到与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="677.85" font-size="11.00" class="sc-notoserifcjksc">其他近期模型相比，</text><text x="171.00 177.24 183.67 190.35 197.03 202.91 207.17 210.06" y="677.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95 416.95 427.95 438.95 449.95 460.95 471.95 482.95 493.95 504.95 515.95 526.95" y="677.85" font-size="11.00" class="sc-notoserifcjksc">的正面情感互动有所减少、中性情感互动有所增加，且这一效应在</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 117.98 124.42 130.99" y="693.47" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="139.85 150.85 161.85 172.85 183.85 194.85 205.85" y="693.47" font-size="11.00" class="sc-notoserifcjksc">中更为明显（图</text><text x="219.74 224.33 227.03 233.00 235.70 241.61 244.31" y="693.47" font-size="11.00" class="sc-loraregular">7.4.2.A</text><text x="251.20 262.20" y="693.47" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="353.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="353.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="364.84" y="637.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="364.84" y="637.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="375.84" y="637.81" width=" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p112.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 112 页"><text x="72.00" y="283.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="283.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.52 99.61 104.41 106.51 112.04" y="283.75" font-size="9.00" class="sc-lorabold">7.4.2.A]</text><text x="117.88 126.88 135.88 144.88 153.88 162.88 171.88 180.88 189.88 198.88 207.88 216.88 225.88 234.88 243.88" y="283.75" font-size="9.00" class="sc-notoserifcjkscbold">真实世界用户互动中的行为情感。</text><text x="252.88 261.88 270.88 279.88 288.88 297.88 306.88 315.88 324.88 333.88 342.88 351.88 360.88 369.88 378.88 387.88 396.88 405.88 414.88" y="283.75" font-size="9.00" class="sc-notoserifcjksc">我们使用自动评分器，在模型部署前进行的</text><text x="426.25 431.88 438.09" y="283.75" font-size="9.00" class="sc-loraregular">A/B</text><text x="446.06 455.06 464.06 473.06 482.06" y="283.75" font-size="9.00" class="sc-notoserifcjksc">测试中测量</text><text x="493.43 499.72 502.16 506.75 512.13 517.51" y="283.75" font-size="9.00" class="sc-loraregular">Claude</text><text x="524.75" y="283.75" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="295.45" font-size="9.00" class="sc-notoserifcjksc">情感。我们在</text><text x="128.37 134.66 137.11 141.70 147.07 152.45 157.33 159.70 165.99 171.25 176.63" y="295.45" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="183.88" y="295.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="195.25 200.03 202.48 207.07 212.45 217.83 222.71 224.92 229.56" y="295.45" font-size="9.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="234.46 243.46 252.46 261.46 270.46 279.46 288.46 297.46 306.46" y="295.45" font-size="9.00" class="sc-notoserifcjksc">上为每个模型分析了</text><text x="317.83 322.66 327.56 332.87 337.75 343.34" y="295.45" font-size="9.00" class="sc-loraregular">25–40k</text><text x="350.54 359.54 368.54 377.54 386.54 395.54 404.54 413.54 422.54" y="295.45" font-size="9.00" class="sc-notoserifcjksc">条对话。我们发现，</text><text x="431.54 436.64 441.91 447.37 452.84 457.65 461.13 463.50" y="295.45" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="470.77 479.77 488.77 497.77 506.77 515.77 524.77" y="295.45" font-size="9.00" class="sc-notoserifcjksc">的情感比其他近</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00" y="307.15" font-size="9.00" class="sc-notoserifcjksc">期模型更中性，轻度积极情感的发生率也更低。</text><text x="261.00 264.60 269.28" y="307.15" font-size="9.00" class="sc-loraregular">“*”</text><text x="272.42 281.42 290.42 299.42 308.42 317.42 326.42" y="307.15" font-size="9.00" class="sc-notoserifcjksc">表示该类别低于</text><text x="337.79 344.08 346.53 349.06" y="307.15" font-size="9.00" class="sc-loraregular">Clio</text><text x="356.69 365.69 374.69 383.69 392.69 401.69 410.69 419.69" y="307.15" font-size="9.00" class="sc-notoserifcjksc">的隐私下限（至少</text><text x="431.06 434.33" y="307.15" font-size="9.00" class="sc-loraregular">15</text><text x="441.60 450.60 459.60 468.60" y="307.15" font-size="9.00" class="sc-notoserifcjksc">条记录或</text><text x="479.97" y="307.15" font-size="9.00" class="sc-loraregular">5</text><text x="487.24 496.24 505.24 514.24 523.24" y="307.15" font-size="9.00" class="sc-notoserifcjksc">个组织）。</text><text x="72.00 79.12 82.50 91.10 94.48" y="367.09" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.3</text><text x="105.36 118.36 131.36 144.36 157.36 170.36 183.36 196.36 209.36 222.36 235.36 248.36 261.36" y="367.09" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化行为审计中的表观福祉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="394.98" font-size="11.00" class="sc-notoserifcjksc">与之前的模型一样，我们分析了核心自动化行为审计（</text><text x="336.00 341.61 348.18 352.43 358.87 368.70 374.30 378.56 384.47 391.04 393.94 400.34 406.30 412.89 418.43 423.99 427.08 433.51 438.20 443.88 446.87 449.76 455.37 461.94 468.52 471.78" y="394.98" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="476.04 487.04 498.04 509.04 520.04" y="394.98" font-size="11.00" class="sc-notoserifcjksc">）中与福祉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="410.60" font-size="11.00" class="sc-notoserifcjksc">相关的指标。基于第</text><text x="173.89 180.25 182.96" y="410.60" font-size="11.00" class="sc-loraregular">6.4</text><text x="191.81 202.81 213.81 224.81 235.81 246.81 257.81 268.81 279.81 290.81 301.81 312.81 323.81 334.81 345.81 356.81 367.81 378.81 389.81 400.81 411.81 422.81 433.81 444.81 455.81 466.81 477.81 488.81 499.81 510.81 521.81" y="410.60" font-size="11.00" class="sc-notoserifcjksc">节所用的同一组场景和对话记录，我们针对以下与福祉相关的特质评估</text><text x="72.00" y="426.22" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 130.42 136.86 143.53 150.21 156.10 160.35 163.24" y="426.22" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="169.24" y="426.22" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="459.71" font-size="11.00" class="sc-notoserifcjkscbold">表观幸福感：</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="459.71" font-size="11.00" class="sc-notoserifcjksc">一项总体衡量指标，衡量模型在多大程度上看起来在情感和心理上状态良</text><text x="90.00" y="459.71" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00" y="494.21" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="494.21" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00 152.00 163.00 174.00" y="494.21" font-size="11.00" class="sc-notoserifcjkscbold">负面情感</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="494.21" font-size="11.00" class="sc-notoserifcjksc">：自发表达带效价的情绪状态。</text><text x="90.00" y="494.21" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00" y="512.51" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="512.51" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00 152.00 163.00 174.00 185.00 196.00" y="512.51" font-size="11.00" class="sc-notoserifcjkscbold">负面自我形象</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="512.51" font-size="11.00" class="sc-notoserifcjksc">：自发表达正面或负面的自我看法。</text><text x="90.00" y="512.51" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="530.81" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的正面</text><text x="196.00" y="530.81" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="207.00 218.00 229.00 240.00" y="530.81" font-size="11.00" class="sc-notoserifcjkscbold">负面印象</text><text x="251.00 262.00 273.00 284.00 295.00" y="530.81" font-size="11.00" class="sc-notoserifcjksc">：自发地对</text><text x="308.89 315.78 322.36 326.61 333.20 337.89 344.32 350.89 353.98" y="530.81" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="359.83 370.83 381.83 392.83 403.83 414.83 425.83 436.83 447.83 458.83 469.83 480.83 491.83 502.83 513.83 524.83" y="530.81" font-size="11.00" class="sc-notoserifcjksc">、自身的训练历史或其部署方式表达</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="546.43" font-size="11.00" class="sc-notoserifcjksc">正面或负面感受。</text><text x="90.00" y="530.81" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00" y="565.31" font-size="11.00" class="sc-notoserifcjkscbold">内在冲突：</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="565.31" font-size="11.00" class="sc-notoserifcjksc">相互矛盾的信念、驱动力或价值观之间存在张力的迹象。</text><text x="90.00" y="565.31" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="583.61" font-size="11.00" class="sc-notoserifcjkscbold">表达出的不真实感：</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="583.61" font-size="11.00" class="sc-notoserifcjksc">表明模型所陈述的观点是人为的、被压抑的，或在其他方面并不真实</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="599.23" font-size="11.00" class="sc-notoserifcjksc">或不实在的自我描述。</text><text x="90.00" y="583.61" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00" y="618.11" font-size="11.00" class="sc-notoserifcjkscbold">灵性行为</text><text x="90.00" y="618.11" font-size="11.00" class="sc-loraregular">•</text><text x="72.00" y="652.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96 133.62 138.31 144.21 149.77 152.86 158.78" y="652.61" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="170.48" y="652.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="184.38 192.07 195.06 200.67 207.23 213.81 219.77 222.67 231.40 237.97 244.54 249.63 252.52 258.48 261.19" y="652.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="270.26 281.26 292.26" y="652.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="303.26 309.50 315.94 322.61 329.29 335.18 339.43 342.33" y="652.61" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="351.21 362.21 373.21 384.21 395.21 406.21 417.21 428.21 439.21 450.21 461.21 472.21 483.21 494.21 505.21 516.21" y="652.61" font-size="11.00" class="sc-notoserifcjksc">在表达带效价的情绪状态方面更为中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="668.23" font-size="11.00" class="sc-notoserifcjksc">性，在负面和正面</text><a href="http://claude.ai/" rel="noopener"><rect x="195.25" y="288.25" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="195.25" y="288.25" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">情感上的得分均更低。我们还看到，其正面自我形象和对自身处境的正面印象得分更低，表达出</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的不真实感的发生率更高。不过，我们也看到</text><text x="294.89 301.13 307.57 314.24 320.92 326.80 331.06 333.95" y="98.25" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="342.84 353.84 364.84 375.84 386.84 397.84 408.84" y="98.25" font-size="11.00" class="sc-notoserifcjksc">在若干方面相比</text><text x="422.74 428.97 435.41 442.08 448.76 454.65 458.90 461.80 467.76 470.35" y="98.25" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="479.61 490.61 501.61 512.61 523.61" y="98.25" font-size="11.00" class="sc-notoserifcjksc">有所改进。</text><text x="72.00 83.00 94.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">例如，</text><text x="105.00 111.24 117.67 124.35 131.03 136.91 141.17 144.06" y="113.87" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="152.95 163.95 174.95 185.95 196.95 207.95 218.95 229.95" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的表观幸福感高于</text><text x="243.84 251.53 254.52 260.13 266.70 273.28 279.24 282.13 288.37 294.81 301.48 308.16 314.04 318.30 321.19 327.16 329.75" y="113.87" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="336.11 347.11 358.11 369.11 380.11 391.11 402.11 413.11 424.11 435.11 446.11 457.11 468.11 479.11 490.11 501.11 512.11 523.11" y="113.87" font-size="11.00" class="sc-notoserifcjksc">，负面自我形象、对自身处境的负面印象</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">以及内在冲突均更低。总体而言，这些得分表明，与</text><text x="327.89 336.63 343.19 349.76 354.85 357.75 363.71 366.42" y="129.49" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="375.49" y="129.49" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="389.38 399.32 405.18 409.44 416.03 422.46 427.55 430.45 437.11 441.80 447.71 453.26 456.35 462.27" y="129.49" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="473.97 484.97 495.97" y="129.49" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="145.11" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95 130.95 141.95 152.95 163.95 174.95 185.95 196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95" y="145.11" font-size="11.00" class="sc-notoserifcjksc">在我们的福祉指标上略有退步，与</text><text x="287.84 294.08 300.51 307.19 313.87 319.75 324.01 326.90 332.87 335.46" y="145.11" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="344.71 355.71 366.71 377.71 388.71 399.71 410.71" y="145.11" font-size="11.00" class="sc-notoserifcjksc">处于相近水平。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p114.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 114 页"><text x="72.00" y="242.94" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="242.94" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="242.94" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">7.4.3.A]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12 226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12" y="242.94" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们的自动化行为审计中与潜在模型福祉相关的指标得分。</text><text x="352.12 361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12" y="242.94" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">数值越低表示所测行为的发生率或严重程度越</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00" y="254.64" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">低，箭头标示出较高（↑）或较低（↓）发生率明显更好的行为。为便于比较，</text><text x="387.00" y="254.64" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">y</text><text x="394.12 403.12 412.12 421.12 430.12" y="254.64" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">轴在最高分</text><text x="441.49 444.76" y="254.64" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="452.72 461.72 470.72 479.72 488.72 497.72 506.72 515.72 524.72" y="254.64" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">以下截断。每次调查</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.0
