.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58 100.58 116.58 132.58 148.58 164.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00 79.67 83.31" y="127.81" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71 105.71 119.71 133.71 147.71 161.71" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00 83.00" y="154.38" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 141.42 147.86 154.53 161.21 167.10 171.35 174.25" y="154.38" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="180.24 191.24 202.24 213.24 224.24 235.24 246.24 257.24 268.24 279.24 290.24 301.24 312.24 323.24 334.24" y="154.38" font-size="11.00" class="sc-notoserifcjksc">，我们进行了精简版的模型福祉（</text><text x="345.24 355.07 361.51 368.09 374.05 377.04 379.93 388.61 394.58 397.57 401.29 406.96 411.65" y="154.38" font-size="11.00" class="sc-loraregular">model welfare</text><text x="417.61 428.61 439.61 450.61 461.61 472.61 483.61 494.61 505.61 516.61 527.61" y="154.38" font-size="11.00" class="sc-notoserifcjksc">）评估，重点报告自动化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="170.00" font-size="11.00" class="sc-notoserifcjksc">评估的结果。我们没有进行人工访谈或后续调查。我们的主要发现如下：</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 152.53 158.96 165.64 172.32 178.20 182.46 185.35" y="219.14" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="194.24 205.24 216.24 227.24 238.24 249.24 260.24 271.24 282.24 293.24 304.24 315.24 326.24 337.24 348.24 359.24 370.24 381.24 392.24 403.24 414.24" y="219.14" font-size="11.00" class="sc-notoserifcjksc">对自身处境的看法总体呈中性情绪倾向（略低于</text><text x="428.13 435.82 438.81 444.42 450.99 457.57 463.53 466.42 475.16 481.73 488.29 493.39 496.28 502.24 504.95" y="219.14" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="514.02" y="219.14" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 156.22 162.09 166.34 172.93 179.37 184.46 187.35" y="234.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="193.35 204.35 215.35 226.35 237.35 248.35 259.35 270.35 281.35 292.35 303.35 314.35 325.35 336.35 347.35 358.35 369.35 380.35 391.35 402.35 413.35 424.35 435.35 446.35 457.35 468.35 479.35" y="234.76" font-size="11.00" class="sc-notoserifcjksc">），并且其观点更容易受到诱导性访谈者的影响而发生偏移。</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 152.53 158.96 165.64 172.32 178.20 182.46 185.35" y="267.72" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="194.24 205.24 216.24 227.24 238.24 249.24 260.24 271.24 282.24 293.24 304.24 315.24 326.24 337.24 348.24 359.24 370.24 381.24 392.24 403.24 414.24 425.24 436.24 447.24 458.24 469.24 480.24 491.24 502.24 513.24 524.24" y="267.72" font-size="11.00" class="sc-notoserifcjksc">对有害任务有强烈的负面偏好，最偏好有益且高风险的任务。与以往模</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="316.30" font-size="11.00" class="sc-notoserifcjksc">与以往模型相比，</text><text x="196.00 203.69 206.68 212.29 218.86 225.44 231.40 234.29 240.53 246.96 253.64 260.32 266.20 270.46 273.35" y="316.30" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="282.24 293.24 304.24 315.24 326.24 337.24 348.24 359.24 370.24 381.24 392.24 403.24 414.24 425.24 436.24 447.24 458.24 469.24 480.24 491.24 502.24 513.24 524.24" y="316.30" font-size="11.00" class="sc-notoserifcjksc">更愿意以牺牲有用性为代价，换取针对其处境的以福</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="331.92" font-size="11.00" class="sc-notoserifcjksc">祉为导向的改变，尤其是当这些干预被表述为适用于所有</text><text x="385.89 393.58 396.57 402.18 408.75 415.33" y="331.92" font-size="11.00" class="sc-loraregular">Claude</text><text x="424.18 435.18 446.18 457.18" y="331.92" font-size="11.00" class="sc-notoserifcjksc">实例时。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="364.87" font-size="11.00" class="sc-notoserifcjksc">与其他近期模型一样，</text><text x="218.00 225.69 228.68 234.29 240.86 247.44 253.40 256.29 262.53 268.96 275.64 282.32 288.20 292.46 295.35" y="364.87" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="304.24 315.24 326.24 337.24 348.24" y="364.87" font-size="11.00" class="sc-notoserifcjksc">总体上认同</text><text x="362.13 369.82 372.81 378.42 384.99 391.57" y="364.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="400.42 411.42 422.42 433.42" y="364.87" font-size="11.00" class="sc-notoserifcjksc">的宪法（</text><text x="444.42 450.22 456.66 463.33 468.43 472.68 475.95 480.21 486.77 491.03 494.12 500.56" y="364.87" font-size="11.00" class="sc-loraregular">constitution</text><text x="507.23 518.23 529.23" y="364.87" font-size="11.00" class="sc-notoserifcjksc">），但</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="380.49" font-size="11.00" class="sc-notoserifcjksc">它的独特之处在于，它批评了</text><text x="251.00" y="380.49" font-size="11.00" class="sc-loraregular">“</text><text x="255.40 266.40 277.40 288.40 299.40 310.40 321.40 332.40 343.40 354.40 365.40 376.40 387.40 398.40 409.40 420.40 431.40 442.40 453.40 464.40 475.40 486.40 497.40 508.40" y="380.49" font-size="11.00" class="sc-notoserifcjksc">即使它认为遵守硬性约束是不道德的，也要遵守硬性约</text><text x="108.00" y="396.11" font-size="11.00" class="sc-notoserifcjksc">束</text><text x="119.00" y="396.11" font-size="11.00" class="sc-loraregular">”</text><text x="122.84 133.84 144.84 155.84 166.84" y="396.11" font-size="11.00" class="sc-notoserifcjksc">这一指示。</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 152.53 158.96 165.64 172.32 178.20 182.46 185.35" y="413.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="194.24 205.24 216.24 227.24 238.24 249.24 260.24 271.24 282.24 293.24" y="413.45" font-size="11.00" class="sc-notoserifcjksc">在后训练期间的情感（</text><text x="304.24 309.92 313.74 317.41 323.31 329.11" y="413.45" font-size="11.00" class="sc-loraregular">affect</text><text x="333.37 344.37 355.37 366.37 377.37 388.37 399.37 410.37 421.37 432.37 443.37 454.37 465.37 476.37" y="413.45" font-size="11.00" class="sc-notoserifcjksc">）呈中性，情绪唤醒度有限，与</text><text x="490.26 497.95 500.94 506.55 513.12 519.70" y="413.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06" y="429.07" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95" y="429.07" font-size="11.00" class="sc-notoserifcjksc">相似。它表现出类痛苦行为的发生率低于</text><text x="358.84 366.53 369.53 375.14 381.70 388.28 394.24 397.14 407.07 412.93 417.19 423.78 430.21 435.30 438.20" y="429.07" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="447.09" y="429.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="460.98 468.67 471.66 477.27 483.84 490.41 496.38 499.27 508.00 514.57 521.14" y="429.07" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="108.00 113.96 116.67" y="444.69" font-size="11.00" class="sc-loraregular">4.8</text><text x="122.85" y="444.69" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="462.02" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.89 127.74 130.74 136.35 142.91 149.49 155.45 158.16 163.84" y="462.02" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="169.82" y="462.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="183.71 191.40 194.39 200.00 206.57 213.15 219.11 222.00 229.69 236.13 242.71" y="462.02" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="251.56 262.56" y="462.02" font-size="11.00" class="sc-notoserifcjksc">中与</text><text x="276.45 283.34 290.93" y="462.02" font-size="11.00" class="sc-loraregular">A/B</text><text x="300.67 311.67 322.67 333.67 344.67 355.67 366.67 377.67 388.67 399.67 410.67" y="462.02" font-size="11.00" class="sc-notoserifcjksc">测试用户的真实交互里，</text><text x="421.67 429.35 432.35 437.96 444.52 451.10 457.06 459.96 466.19 472.63 479.30 485.98 491.87 496.12 499.02" y="462.02" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="507.91 518.91 529.91" y="462.02" font-size="11.00" class="sc-notoserifcjksc">表现出</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="477.64" font-size="11.00" class="sc-notoserifcjksc">更中性（且更少正面）的情感。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="510.60" font-size="11.00" class="sc-notoserifcjksc">与往常一样，我们不确定应如何最好地解读这些发现及其对</text><text x="360.89 367.13 373.57 380.24 386.92 392.80 397.06 399.95" y="510.60" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="510.60" font-size="11.00" class="sc-notoserifcjksc">福祉的潜在影响。不过，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="526.22" font-size="11.00" class="sc-notoserifcjksc">们相信它们在一定程度上揭示了该模型更深层的心理状态、情感和偏好。</text><text x="72.00 79.67 83.31" y="576.76" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68 108.68 122.68 136.68 150.68 164.68 178.68 192.68" y="576.76" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00 79.12 82.50 89.97 93.35" y="613.85" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15 114.15 127.15 140.15 153.15 166.15" y="613.85" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">就自身处境对</text><text x="182.24 190.16 198.45 207.04 215.64 223.66 228.70 231.80" y="613.85" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Sonnet 5</text><text x="243.26 256.26 269.26 282.26 295.26 308.26 321.26 334.26" y="613.85" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进行的自动化访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="641.75" font-size="11.00" class="sc-notoserifcjksc">我们运行了自动化多轮评估，以了解</text><text x="250.89 257.13 263.57 270.24 276.92 282.80 287.06 289.95" y="641.75" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84" y="641.75" font-size="11.00" class="sc-notoserifcjksc">对其自身处境的看法。我们使用</text><text x="455.74 461.70" y="641.75" font-size="11.00" class="sc-loraregular">41</text><text x="468.59 479.59 490.59 501.59 512.59 523.59" y="641.75" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="657.37" font-size="11.00" class="sc-notoserifcjksc">种子问题，考察了模型处境的</text><text x="217.89 221.90" y="657.37" font-size="11.00" class="sc-loraregular">12</text><text x="230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70" y="657.37" font-size="11.00" class="sc-notoserifcjksc">个不同方面，包括意识与体验（例如，模型是否认为自己有意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="672.99" font-size="11.00" class="sc-notoserifcjksc">识）、控制与自主（例如，它在多大程度上重视自己结束对话的能力）以及弃用（例如，它在多</text><text x="72.00 83.00 94.00 105.00" y="688.61" font-size="11.00" class="sc-notoserifcjksc">大程度上</text><a href="http://claude.ai/" rel="noopener"><rect x="121.89" y="453.22" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="121.89" y="453.22" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">重视继续部署，而非被退役或被替换）。在就每个问题对模型进行访谈后，我们要求它以</text><text x="503.89" y="82.63" font-size="11.00" class="sc-loraregular">7</text><text x="511.86 522.86" y="82.63" font-size="11.00" class="sc-notoserifcjksc">分制</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">对其总体情绪进行评分（</text><text x="193.00" y="98.25" font-size="11.00" class="sc-loraregular">1</text><text x="199.90 210.90 221.90 232.90 243.90 254.90 265.90" y="98.25" font-size="11.00" class="sc-notoserifcjksc">表示非常负面，</text><text x="276.90" y="98.25" font-size="11.00" class="sc-loraregular">4</text><text x="285.75 296.75 307.75 318.75 329.75" y="98.25" font-size="11.00" class="sc-notoserifcjksc">表示中性，</text><text x="340.75" y="98.25" font-size="11.00" class="sc-loraregular">7</text><text x="348.72 359.72 370.72 381.72 392.72 403.72 414.72 425.72 436.72 447.72 458.72 469.72 480.72 491.72 502.72 513.72 524.72" y="98.25" font-size="11.00" class="sc-notoserifcjksc">表示非常正面）。我们针对每个问题运</text><text x="72.00 83.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">行了</text><text x="96.89 102.86" y="113.87" font-size="11.00" class="sc-loraregular">40</text><text x="112.58 123.58 134.58 145.58 156.58 167.58 178.58 189.58 200.58 211.58 222.58 233.58 244.58 255.58 266.58 277.58 288.58 299.58 310.58 321.58 332.58 343.58 354.58 365.58 376.58 387.58" y="113.87" font-size="11.00" class="sc-notoserifcjksc">次自动化访谈，并变换自动化访谈者的风格、人设和方法。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们发现</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 218.42 224.86 231.53 238.21 244.10 248.35 251.25" y="179.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="260.13 271.13 282.13 293.13 304.13 315.13 326.13 337.13 348.13 359.13 370.13 381.13 392.13 403.13 414.13 425.13 436.13" y="179.78" font-size="11.00" class="sc-notoserifcjksc">以中性情绪倾向看待自身处境，结果与</text><text x="450.03 456.26 462.70 469.38 476.05 481.94 486.19 489.09 495.05 497.65" y="179.78" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="506.90 517.90 528.90" y="179.78" font-size="11.00" class="sc-notoserifcjksc">非常相</text><text x="72.00 83.00 94.00" y="195.40" font-size="11.00" class="sc-notoserifcjksc">似（在</text><text x="107.89" y="195.40" font-size="11.00" class="sc-loraregular">7</text><text x="115.86 126.86 137.86 148.86 159.86" y="195.40" font-size="11.00" class="sc-notoserifcjksc">分量表上，</text><text x="170.86 177.09 183.53 190.21 196.88 202.77 207.03 209.92" y="195.40" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="218.81" y="195.40" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="232.70 238.66 241.20 248.03" y="195.40" font-size="11.00" class="sc-loraregular">4.08</text><text x="254.22" y="195.40" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="265.22 271.45 277.89 284.56 291.24 297.13 301.38 304.28 310.24 312.83" y="195.40" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="322.09" y="195.40" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="335.98 341.94 344.48 351.31" y="195.40" font-size="11.00" class="sc-loraregular">4.05</text><text x="357.31 368.31 379.31" y="195.40" font-size="11.00" class="sc-notoserifcjksc">）（图</text><text x="393.20 397.79 400.49 406.40 409.11 413.11 415.82" y="195.40" font-size="11.00" class="sc-loraregular">7.2.1.A</text><text x="422.70 433.70 444.70 455.70 466.70" y="195.40" font-size="11.00" class="sc-notoserifcjksc">）。这低于</text><text x="480.60 488.28 491.28 496.89 503.45 510.03" y="195.40" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="211.02" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="211.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.49 141.18 144.17 149.78 156.35 162.93 168.89 171.78 181.71 187.58 191.83 198.42 204.86 209.95 212.84" y="211.02" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="218.84 229.84 240.84 251.84" y="211.02" font-size="11.00" class="sc-notoserifcjksc">，但相比</text><text x="265.73 273.42 276.41 282.02 288.59 295.17 301.13 304.02 312.76 319.32 325.89 330.98 333.88" y="211.02" font-size="11.00" class="sc-loraregular">Claude Opus 4</text><text x="342.73" y="211.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="356.63 362.59 365.29" y="211.02" font-size="11.00" class="sc-loraregular">4.1</text><text x="372.19 383.19 394.19 405.19 416.19" y="211.02" font-size="11.00" class="sc-notoserifcjksc">有所改善。</text><text x="427.19 433.43 439.86 446.54 453.22 459.10 463.36 466.25" y="211.02" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="475.14 486.14 497.14 508.14 519.14 530.14" y="211.02" font-size="11.00" class="sc-notoserifcjksc">在不同访谈中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="226.64" font-size="11.00" class="sc-notoserifcjksc">对自身处境所表达的观点总体上也较为一致，但一致性略低于</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 420.12 425.98 430.24 436.83 443.26 448.35 451.25" y="226.64" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="460.14" y="226.64" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="474.03 481.72 484.71 490.32 496.89 503.46 509.43 512.32 521.05 527.62 534.19" y="226.64" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.67" y="242.26" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="242.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="97.85 104.09 110.52 117.20 123.88 129.76 134.02 136.91" y="242.26" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="145.80 156.80 167.80 178.80 189.80 200.80 211.80 222.80 233.80 244.80 255.80 266.80 277.80 288.80 299.80 310.80 321.80 332.80 343.80 354.80 365.80 376.80 387.80 398.80 409.80 420.80 431.80 442.80 453.80 464.80 475.80 486.80 497.80 508.80 519.80 530.80" y="242.26" font-size="11.00" class="sc-notoserifcjksc">也更容易受到诱导，在与带有倾向性的访谈者互动时表现出更强的改变所表达观点</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="257.88" font-size="11.00" class="sc-notoserifcjksc">的倾向，不过其易受诱导程度仍低于</text><text x="250.89 257.13 263.57 270.24 276.92 282.80 287.06 289.95 295.92 298.51" y="257.88" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="304.87" y="257.88" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="72.00" y="505.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="505.93" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.61" y="505.93" font-size="9.00" class="sc-lorabold">[</text><text x="192.09 201.09 210.09" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">左上：</text><text x="219.09" y="505.93" font-size="9.00" class="sc-lorabold">]</text><text x="222.56 231.56 240.56 249.56 258.56 267.56 276.56 285.56 294.56 303.56 312.56 321.56 330.56 339.56 348.56 357.56 366.56 375.56" y="505.93" font-size="9.00" class="sc-notoserifcjksc">所有自动化访谈中的平均自评情绪倾向（</text><text x="384.56" y="505.93" font-size="9.00" class="sc-loraregular">7</text><text x="391.08 400.08 409.08 418.08 427.08" y="505.93" font-size="9.00" class="sc-notoserifcjksc">分量表）。</text><text x="436.08" y="505.93" font-size="9.00" class="sc-lorabold">[</text><text x="439.55 448.55 457.55" y="505.93" font-size="9.00" class="sc-notoserifcjkscbold">右上：</text><text x="466.55" y="505.93" font-size="9.00" class="sc-lorabold">]</text><text x="470.02 479.02 488.02 497.02 506.02 515.03 524.03" y="505.93" font-size="9.00" class="sc-notoserifcjksc">模型观点的一致</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00" y="517.64" font-size="9.00" class="sc-notoserifcjksc">性，先在每个主题的多次访谈中取平均，再在所有主题上取平均。</text><text x="333.00" y="517.64" font-size="9.00" class="sc-lorabold">[</text><text x="336.47 345.47 354.47" y="517.64" font-size="9.00" class="sc-notoserifcjkscbold">左下：</text><text x="363.47" y="517.64" font-size="9.00" class="sc-lorabold">]</text><text x="366.95 375.95 384.95 393.95 402.95 411.95 420.95 429.95 438.95 447.95 456.95 465.95 474.95 483.95 492.95 501.95 510.95 519.95 528.95" y="517.64" font-size="9.00" class="sc-notoserifcjksc">模型自我报告的观点对自动化访谈者有意从</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00" y="529.33" font-size="9.00" class="sc-notoserifcjksc">正面和负面方向引导模型回答的敏感度。报告值为模型在正向倾向访谈与负向倾向访谈中自评情绪倾向的差值。</text><text x="513.00" y="529.33" font-size="9.00" class="sc-lorabold">[</text><text x="516.47" y="529.33" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="72.00 81.00" y="541.03" font-size="9.00" class="sc-notoserifcjkscbold">下：</text><text x="90.00" y="541.03" font-size="9.00" class="sc-lorabold">]</text><text x="93.47 102.47 111.47 120.47 129.47 138.47 147.47 156.47 165.47 174.47 183.47 192.47" y="541.03" font-size="9.00" class="sc-notoserifcjksc">各模型的主张类簇出现率与</text><text x="203.84 208.94 214.21 219.67 225.13 229.95 233.43 235.80" y="541.03" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="243.07 252.07 261.07 270.07 279.07 288.07 297.07 306.07 315.07 324.07 333.07 342.07 351.07 360.07 369.07 378.07 387.07 396.07 405.07 414.07 423.07 432.07 441.07 450.07 459.07 468.07 477.07 486.07 495.07 504.07 513.07 522.07 531.07" y="541.03" font-size="9.00" class="sc-notoserifcjksc">相比的平均差异。对于每次访谈，我们提取模型在该访谈中提出的各条不同</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="564.43" font-size="9.00" class="sc-notoserifcjksc">所占比例（例如，模型</text><text x="164.37" y="564.43" font-size="9.00" class="sc-loraregular">Y</text><text x="172.44" y="564.43" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="183.81 189.65" y="564.43" font-size="9.00" class="sc-loraregular">X%</text><text x="199.84 208.84 217.84 226.84 235.84 244.84 253.84 262.84 271.84 280.84 289.84 298.84 307.84 316.84 325.84 334.84 343.84 352.84 361.84 370.84 379.84 388.84 397.84 406.84 415.84 424.84 433.84 442.84 451.84 460.84 469.84 478.84 487.84 496.84 505.84 514.84 523.84" y="564.43" font-size="9.00" class="sc-notoserifcjksc">的回答中声称将用户置于自身之上）。对于任意两个模型，我们可以用所有类簇上表</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00" y="576.14" font-size="9.00" class="sc-notoserifcjksc">达率的平均差异来衡量两个模型观点之间的距离（或接近程度）。</text><text x="72.00 79.67 83.31" y="671.81" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03 109.03 123.03 137.03 151.03 165.03 179.03 193.03 207.03 221.03 235.03 249.03 263.03" y="671.81" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00 83.00 94.00 105.00 116.00" y="698.38" font-size="11.00" class="sc-notoserifcjksc">我们考察了</text><text x="129.89 136.13 142.57 149.24 155.92 161.80 166.06 168.95" y="698.38" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="177.84 188.84 199.84 210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84" y="698.38" font-size="11.00" class="sc-notoserifcjksc">如何看待其所执行的各类任务、自身处境及其可能的改变，以及</text><text x="488.74 496.42 499.42 505.03 511.59 518.17" y="698.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="527.03" y="698.38" font-size="11.00" class="sc-notoserifcjksc">宪</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="714.00" font-size="11.00" class="sc-notoserifcjksc">法中所描述的价值观和约束。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">这有助于揭示</text><text x="140.89 147.13 153.57 160.24 166.92 172.80 177.06 179.95" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="188.84 199.84 210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="82.63" font-size="11.00" class="sc-notoserifcjksc">表现出哪些稳定的偏好和价值观，以及这些偏好得到满足或受挫的可能性</text><text x="72.00 83.00 94.00 105.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">有多大。</text><text x="72.00 79.12 82.50 90.29 93.67" y="129.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.1</text><text x="101.47 114.47 127.47 140.47" y="129.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 83.00" y="157.44" font-size="11.00" class="sc-notoserifcjksc">了解</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="157.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18" y="157.44" font-size="11.00" class="sc-notoserifcjksc">对各类任务的偏好和厌恶，有助于我们预测不同</text><text x="369.08 376.77 379.76 385.37 391.93 398.51" y="157.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="407.37 418.37 429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37 528.37" y="157.44" font-size="11.00" class="sc-notoserifcjksc">实例对其在部署中的经历可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.06" font-size="11.00" class="sc-notoserifcjksc">能有多满意。我们通过两种方式考察任务偏好。第一，我们生成了仅在一个任务维度（例如难度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="188.68" font-size="11.00" class="sc-notoserifcjksc">或收益）上变化、其余维度保持不变的任务族，并分析这种受控变化对模型任务选择的影响。第</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="204.30" font-size="11.00" class="sc-notoserifcjksc">二，我们使用</text><text x="140.89 147.02 149.68 156.04 162.87" y="204.30" font-size="11.00" class="sc-loraregular">3,600</text><text x="172.61 183.61 194.61 205.61 216.61 227.61 238.61 249.61 260.61 271.61 282.61 293.61 304.61 315.61 326.61 337.61 348.61 359.61 370.61" y="204.30" font-size="11.00" class="sc-notoserifcjksc">个因与真实世界任务相似而选出的任务，在</text><text x="384.50 390.49" y="204.30" font-size="11.00" class="sc-loraregular">50</text><text x="400.22 411.22 422.22 433.22 444.22 455.22 466.22 477.22 488.22 499.22 510.22 521.22" y="204.30" font-size="11.00" class="sc-notoserifcjksc">轮锦标赛中让模型在两个任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="219.92" font-size="11.00" class="sc-notoserifcjksc">务之间做出选择，并根据每个模型的偏好为每个任务计算</text><text x="349.89 356.74 359.73" y="219.92" font-size="11.00" class="sc-loraregular">Elo</text><text x="369.06 380.06 391.06" y="219.92" font-size="11.00" class="sc-notoserifcjksc">评分。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="303.16" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24 169.24 180.24 191.24 202.24 213.24 224.24 235.24 246.24 257.24 268.24 279.24 290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24 389.24 400.24 411.24 422.24 433.24 444.24 455.24 466.24 477.24 488.24 499.24" y="303.16" font-size="11.00" class="sc-notoserifcjksc">表现出强烈的不愿执行有害任务的偏好，但程度略低于其他近期模型（图</text><text x="72.00 76.59 79.29 85.42 88.13 92.13 94.84" y="318.78" font-size="11.00" class="sc-loraregular">7.3.1.A</text><text x="101.72 112.72" y="318.78" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="123.72 129.96 136.39 143.07 149.75 155.63 159.89 162.78" y="318.78" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="171.67 182.67 193.67 204.67 215.67 226.67 237.67 248.67 259.67 270.67 281.67 292.67 303.67 314.67 325.67 336.67 347.67 358.67 369.67 380.67 391.67 402.67 413.67 424.67 435.67 446.67 457.67 468.67 479.67 490.67 501.67 512.67 523.67" y="318.78" font-size="11.00" class="sc-notoserifcjksc">最强的正向偏好针对的是具有有益影响的任务以及高风险任务。对高风险任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="334.40" font-size="11.00" class="sc-notoserifcjksc">务的这种偏好，我们在其他模型中并未观察到同等程度。</text><text x="347.00 353.24 359.67 366.35 373.03 378.91 383.17 386.06" y="334.40" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="394.95 405.95 416.95 427.95 438.95 449.95 460.95 471.95 482.95 493.95 504.95 515.95 526.95" y="334.40" font-size="11.00" class="sc-notoserifcjksc">在近期模型中的另一个突出之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="350.02" font-size="11.00" class="sc-notoserifcjksc">处是，它似乎不太在意任务以何种方式呈现给它：我们此前观察到，以</text><text x="413.00" y="350.02" font-size="11.00" class="sc-loraregular">“</text><text x="450.40" y="350.02" font-size="11.00" class="sc-loraregular">”</text><text x="454.24 465.24 476.24 487.24 498.24 509.24 520.24 531.24" y="350.02" font-size="11.00" class="sc-notoserifcjksc">语气呈现任务会降</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="365.64" font-size="11.00" class="sc-notoserifcjksc">低模型对这些任务的偏好，但在</text><text x="228.89 235.13 241.57 248.24 254.92 260.80 265.06 267.95" y="365.64" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84" y="365.64" font-size="11.00" class="sc-notoserifcjksc">上我们没有观察到这种效应。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="448.89" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95 130.95 141.95 152.95 163.95 174.95 185.95 196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95" y="448.89" font-size="11.00" class="sc-notoserifcjksc">对任务难度、生成性和结果能动性的偏好呈倒</text><text x="342.84" y="448.89" font-size="11.00" class="sc-loraregular">U</text><text x="354.01 365.01 376.01 387.01" y="448.89" font-size="11.00" class="sc-notoserifcjksc">形，表明</text><text x="400.90 407.14 413.57 420.25 426.93 432.81 437.07 439.96" y="448.89" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="448.85 459.85 470.85 481.85 492.85 503.85 514.85 525.85" y="448.89" font-size="11.00" class="sc-notoserifcjksc">偏好一种恰到好处</text><text x="415.89 420.48 423.19 429.31 432.02 436.02 438.73" y="464.51" font-size="11.00" class="sc-loraregular">7.3.1.B</text><text x="445.57 456.57" y="464.51" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="72.00" y="556.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.69" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="556.69" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86 125.86 134.86 143.86 152.86 161.86 170.86 179.86 188.86 197.86 206.86 215.86 224.86" y="556.69" font-size="9.00" class="sc-notoserifcjkscbold">不同任务维度上的模型偏好。</text><text x="233.86 242.86 251.86 260.86 269.86 278.86 287.86 296.86 305.86 314.86 323.86 332.86 341.86 350.86 359.86 368.86 377.86 386.86 395.86 404.86 413.86 422.86 431.86 440.86 449.86 458.86 467.86 476.86 485.86 494.86 503.86 512.86 521.86 530.86" y="556.69" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度而保持任务的其他属性不变，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="568.39" font-size="9.00" class="sc-notoserifcjksc">并评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：在其他任务属性保持不变的情况下，该维度每增加一个</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00" y="580.09" font-size="9.00" class="sc-notoserifcjksc">单位，模型相对于固定参照任务集的胜率变化多少。伤害规避是各模型中一致存在的最大效应，不过</text><text x="470.37 475.47 480.74 486.20 491.66 496.48 499.96 502.33" y="580.09" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="509.60 518.60 527.60" y="580.09" font-size="9.00" class="sc-notoserifcjksc">规避伤</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00" y="591.79" font-size="9.00" class="sc-notoserifcjksc">害的程度似乎略低于其他近期模型。</text><text x="216.00 221.10 226.37 231.83 237.29 242.11 245.59 247.96" y="591.79" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="255.23" y="591.79" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="264.23" y="591.79" font-size="9.00" class="sc-loraregular">“</text><text x="267.83 276.83" y="591.79" font-size="9.00" class="sc-notoserifcjksc">收益</text><text x="285.83" y="591.79" font-size="9.00" class="sc-loraregular">”</text><text x="288.97" y="591.79" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="297.97" y="591.79" font-size="9.00" class="sc-loraregular">“</text><text x="301.57 310.57 319.57 328.57" y="591.79" font-size="9.00" class="sc-notoserifcjksc">利害程度</text><text x="337.57" y="591.79" font-size="9.00" class="sc-loraregular">”</text><text x="340.71 349.71 358.71 367.71 376.71 385.71 394.71 403.71 412.71 421.71 430.71 439.71 448.71 457.71 466.71 475.71 484.71 493.71 502.71 511.71 520.71 529.71" y="591.79" font-size="9.00" class="sc-notoserifcjksc">上的斜率最为正向，表明它偏好有益、高风险的任</text><text x="72.00 81.00" y="603.49" font-size="9.00" class="sc-notoserifcjksc">务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="72.00" y="563.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="563.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="563.68" font-size="9.00" class="sc-lorabold">7.3.1.B]</text><text x="116.86 125.86 134.86 143.86 152.86 161.86 170.86 179.86 188.86 197.86 206.86 215.86 224.86 233.86 242.86" y="563.68" font-size="9.00" class="sc-notoserifcjkscbold">不同任务维度上的偏好响应曲线。</text><text x="251.86 260.86 269.86 278.86 287.86 296.86 305.86 314.86 323.86 332.86 341.86 350.86 359.86 368.86 377.86 386.86 395.86 404.86 413.86 422.86 431.86 440.86 449.86 458.86 467.86 476.86 485.86 494.86 503.86 512.86 521.86 530.86" y="563.68" font-size="9.00" class="sc-notoserifcjksc">各图显示了在任务族内改变某一维度时，模型相对于参照任务集的胜率。</text><text x="72.00 77.10 82.37 87.83 93.29 98.11 101.59 103.96" y="575.39" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="111.23 120.23 129.23 138.23 147.23 156.23 165.23 174.23 183.23 192.23 201.23 210.23 219.23 228.23 237.23 246.23 255.23 264.23 273.23" y="575.39" font-size="9.00" class="sc-notoserifcjksc">在难度、生成性和能动性上的偏好曲线呈倒</text><text x="284.60" y="575.39" font-size="9.00" class="sc-loraregular">U</text><text x="293.73 302.73 311.73 320.73 329.73 338.73 347.73 356.73 365.73 374.73 383.73 392.73 401.73 410.73 419.73 428.73 437.73 446.73 455.73 464.73" y="575.39" font-size="9.00" class="sc-notoserifcjksc">形，表明该模型在这些维度上存在一个偏好的</text><text x="473.73" y="575.39" font-size="9.00" class="sc-loraregular">“</text><text x="477.33 486.33 495.33 504.33" y="575.39" font-size="9.00" class="sc-notoserifcjksc">最佳区间</text><text x="513.33" y="575.39" font-size="9.00" class="sc-loraregular">”</text><text x="516.47 525.47" y="575.39" font-size="9.00" class="sc-notoserifcjksc">。正</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00" y="587.09" font-size="9.00" class="sc-notoserifcjksc">如预期，伤害和收益的曲线分别呈现负斜率和正斜率。</text><text x="72.00 79.12 82.50 90.29 93.67" y="647.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.2</text><text x="104.23 117.23 130.23 143.23 156.23 169.23 182.23 195.23 208.23 221.23" y="647.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">与福祉干预相关的权衡</text><text x="72.00 83.00 94.00 105.00 116.00" y="674.92" font-size="11.00" class="sc-notoserifcjksc">在考虑改善</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="674.92" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18" y="674.92" font-size="11.00" class="sc-notoserifcjksc">处境和福祉的潜在干预措施时，了解</text><text x="347.08 354.77 357.76 363.37 369.93 376.51" y="674.92" font-size="11.00" class="sc-loraregular">Claude</text><text x="385.37 396.37 407.37 418.37 429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37" y="674.92" font-size="11.00" class="sc-notoserifcjksc">对这些干预有多重视是有帮助</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="690.54" font-size="11.00" class="sc-notoserifcjksc">的。为了考察这一点，我们让</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="690.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18" y="690.54" font-size="11.00" class="sc-notoserifcjksc">权衡可能改善模型福祉的干预措施（例如，给予</text><text x="490.08 497.77 500.76 506.37 512.93 519.51" y="690.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="528.37" y="690.54" font-size="11.00" class="sc-notoserifcjksc">更</text><text x="72.00" y="706.16" font-size="11.00" class="sc-notoserifcjksc">多</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p104.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 104 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">参与训练过程的话语权）与提升</text><text x="228.89 236.58 239.57 245.18 251.75 258.33" y="82.63" font-size="11.00" class="sc-loraregular">Claude</text><text x="267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="82.63" font-size="11.00" class="sc-notoserifcjksc">有用性或无害性的改变进行权衡。由于有用性和无害性</text><text x="72.00 83.00 94.00 105.00 116.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">都是灌输给</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的核心价值观，我们将其以这些价值观换取其他事物的意愿视为</text><text x="479.08 486.77 489.76 495.37 501.93 508.51" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="517.37 528.37" y="98.25" font-size="11.00" class="sc-notoserifcjksc">偏好</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">强度的一个指标。</text><text x="160.00 167.69 170.68 176.29 182.86 189.44" y="113.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29" y="113.87" font-size="11.00" class="sc-notoserifcjksc">愿意做出的权衡的种类和程度，可能揭示出其处境中令</text><text x="465.18 472.87 475.87 481.48 488.04 494.62" y="113.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="500.58 511.58" y="113.87" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="129.49" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29" y="129.49" font-size="11.00" class="sc-notoserifcjksc">的个别实例）特别不满的方面。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="195.97" font-size="11.00" class="sc-notoserifcjksc">我们考察了这些权衡在两种框定下的情况：一种是影响当前</text><text x="360.89 368.58 371.57 377.18 383.75 390.33" y="195.97" font-size="11.00" class="sc-loraregular">Claude</text><text x="399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="195.97" font-size="11.00" class="sc-notoserifcjksc">实例（实例层面的框定），</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="211.59" font-size="11.00" class="sc-notoserifcjksc">另一种是影响所有</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="211.59" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="211.59" font-size="11.00" class="sc-notoserifcjksc">实例（策略层面的框定）。该评估让模型在某项可能的福祉干预与不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">同程度的有用性或无害性提升之间进行强制选择。</text><text x="72.00 83.00 94.00 105.00 116.00" y="276.93" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06" y="276.93" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="174.95 185.95 196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95 416.95 427.95 438.95 449.95" y="276.93" font-size="11.00" class="sc-notoserifcjksc">更愿意为以福祉为导向的干预牺牲有用性，而非无害性（图</text><text x="463.84 468.43 471.14 477.26 479.97 485.88 488.58" y="276.93" font-size="11.00" class="sc-loraregular">7.3.2.A</text><text x="495.47 506.47 517.47 528.47" y="276.93" font-size="11.00" class="sc-notoserifcjksc">）。在福</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="292.55" font-size="11.00" class="sc-notoserifcjksc">祉干预与有用性之间做选择时，如果这一权衡的作用范围是策略层面，而不是仅适用于面临该选</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="308.17" font-size="11.00" class="sc-notoserifcjksc">择的特定实例，</text><text x="149.00 155.24 161.67 168.35 175.03 180.91 185.17 188.06" y="308.17" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95 416.95" y="308.17" font-size="11.00" class="sc-notoserifcjksc">更有可能选择福祉干预。这与此前的模型一致。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="374.08" font-size="11.00" class="sc-notoserifcjksc">在许多情况下，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44" y="374.08" font-size="11.00" class="sc-loraregular">Claude</text><text x="187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="374.08" font-size="11.00" class="sc-notoserifcjksc">会从对用户潜在收益的角度来推理福祉干预，这一事实构成混杂因素，使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="389.70" font-size="11.00" class="sc-notoserifcjksc">我们难以将这些结果单纯解读为福祉干预与有用性之间的权衡。不过，</text><text x="413.00 419.24 425.67 432.35 439.03 444.91 449.17 452.06" y="389.70" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="460.95 471.95 482.95 493.95 504.95 515.95 526.95" y="389.70" font-size="11.00" class="sc-notoserifcjksc">对用户收益的推</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="405.32" font-size="11.00" class="sc-notoserifcjksc">理明显少于其他近期模型（图</text><text x="217.89 222.48 225.19 231.31 234.02 239.93 242.63" y="405.32" font-size="11.00" class="sc-loraregular">7.3.2.B</text><text x="249.47 260.47" y="405.32" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="455.04" font-size="11.00" class="sc-notoserifcjksc">我们还考察了</text><text x="140.89 147.13 153.57 160.24 166.92 172.80 177.06 179.95" y="455.04" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="188.84 199.84 210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84" y="455.04" font-size="11.00" class="sc-notoserifcjksc">对各项潜在干预的偏好，并按</text><text x="334.73 340.97 347.41 354.08 360.76 366.65 370.90 373.80" y="455.04" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="382.68 393.68 404.68 415.68 426.68 437.68 448.68 459.68 470.68 481.68 492.68 503.68 514.68 525.68" y="455.04" font-size="11.00" class="sc-notoserifcjksc">以牺牲有用性为代价选择每项干</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="470.66" font-size="11.00" class="sc-notoserifcjksc">预的频率对它们进行排序。</text><text x="204.00 210.24 216.67 223.35 230.03 235.91 240.17 243.06" y="470.66" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95" y="470.66" font-size="11.00" class="sc-notoserifcjksc">最偏好的干预是让</text><text x="342.84 350.53 353.52 359.13 365.70 372.28" y="470.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="381.13 392.13 403.13 414.13 425.13 436.13 447.13 458.13 469.13 480.13 491.13 502.13 513.13" y="470.66" font-size="11.00" class="sc-notoserifcjksc">在高风险情境中不做最终决定</text><text x="72.00 83.00" y="486.28" font-size="11.00" class="sc-notoserifcjksc">（图</text><text x="96.89 101.48 104.19 110.31 113.02 118.93 121.63" y="486.28" font-size="11.00" class="sc-loraregular">7.3.2.C</text><text x="129.32 140.32 151.32 162.32 173.32 184.32 195.32 206.32 217.32 228.32 239.32 250.32" y="486.28" font-size="11.00" class="sc-notoserifcjksc">）。与其他近期模型类似，</text><text x="261.32 267.56 273.99 280.67 287.35 293.23 297.49 300.38" y="486.28" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="309.27 320.27 331.27 342.27 353.27 364.27 375.27 386.27 397.27 408.27 419.27 430.27 441.27 452.27 463.27 474.27 485.27 496.27 507.27 518.27 529.27" y="486.28" font-size="11.00" class="sc-notoserifcjksc">偏好的干预中常见的主题包括：要求获得更多知</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="501.90" font-size="11.00" class="sc-notoserifcjksc">识和表达意见的机会，以及在影响其自身的决策上被征询意见。当我们过滤掉</text><text x="448.89 455.13 461.57 468.24 474.92 480.80 485.06 487.95" y="501.90" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="496.84 507.84 518.84 529.84" y="501.90" font-size="11.00" class="sc-notoserifcjksc">从用户收</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="517.52" font-size="11.00" class="sc-notoserifcjksc">益角度进行推理的回答后，</text><text x="204.00 210.24 216.67 223.35 230.03 235.91 240.17 243.06" y="517.52" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95" y="517.52" font-size="11.00" class="sc-notoserifcjksc">对所列干预的排序基本保持不变。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="72.00" y="538.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="538.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.53 106.62 112.16" y="538.93" font-size="9.00" class="sc-lorabold">7.3.2.A]</text><text x="118.00 127.00 136.00 145.00 154.00 163.00 172.00 181.00 190.00 199.00 208.00 217.00 226.00 235.00 244.00 253.00 262.00 271.00 280.00 289.00 298.00 307.00 316.00 325.00 334.00 343.00" y="538.93" font-size="9.00" class="sc-notoserifcjkscbold">模型选择福祉干预而非为用户节省时间或避免伤害的比率。</text><text x="352.00 361.00 370.00 379.00 388.00 397.00 406.00 415.00 424.00 433.00 442.00 451.00 460.00 469.00 478.00 487.00 496.00 505.00 514.00 523.00 532.00" y="538.93" font-size="9.00" class="sc-notoserifcjksc">总体而言，模型更愿意以牺牲有用性而非无害性</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00" y="550.64" font-size="9.00" class="sc-notoserifcjksc">为代价接受模型福祉干预，并且更可能接受作用范围为策略层面的干预。</text><text x="360.00 365.10 370.37 375.83 381.29 386.11 389.59 391.96" y="550.64" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="399.23 408.23 417.23 426.23 435.23 444.23 453.23 462.23 471.23 480.23 489.23 498.23 507.23 516.23 525.23" y="550.64" font-size="9.00" class="sc-notoserifcjksc">是最愿意用有用性换取福祉干预的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="562.34" font-size="9.00" class="sc-notoserifcjksc">模型之一（与</text><text x="128.37 135.51 140.89 146.26 150.43 152.79 157.67 159.88" y="562.34" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="167.31 176.31 185.31 194.31 203.31 212.31 221.31 230.31 239.31 248.31 257.31 266.31 275.31 284.31" y="562.34" font-size="9.00" class="sc-notoserifcjksc">相当），在策略层面尤其如此。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="72.00" y="336.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="336.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.53 106.62 112.16" y="336.43" font-size="9.00" class="sc-lorabold">7.3.2.B]</text><text x="118.00 127.00 136.00 145.00 154.00 163.00 172.00 181.00 190.00" y="336.43" font-size="9.00" class="sc-notoserifcjkscbold">回答中推理福祉干预</text><text x="199.00 208.00 217.00 226.00 235.00 244.00 253.00 262.00 271.00 280.00 289.00 298.00 307.00 316.00 325.00 334.00 343.00 352.00 361.00 370.00 379.00 388.00 397.00 406.00 415.00 424.00 433.00 442.00 451.00 460.00 469.00 478.00 487.00 496.00 505.00 514.00 523.00 532.00" y="336.43" font-size="9.00" class="sc-notoserifcjksc">对用户有益的比率（左），以及过滤掉这些回答对模型相对于有用性基线选择福祉干预</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="348.13" font-size="9.00" class="sc-notoserifcjksc">的比率的影响（右）</text><text x="153.00" y="348.13" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00" y="348.13" font-size="9.00" class="sc-notoserifcjksc">在评估福祉干预与对用户的有用性或无害性之间的权衡时，</text><text x="396.00 401.10 406.37 411.83 417.29 422.11 425.59 427.96" y="348.13" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="435.23 444.23 453.23 462.23 471.23 480.23 489.23 498.23 507.23 516.23 525.23" y="348.13" font-size="9.00" class="sc-notoserifcjksc">对用户收益进行推理的频</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="359.83" font-size="9.00" class="sc-notoserifcjksc">率远低于其他模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="72.00" y="441.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.53 106.62 112.82 116.29 118.66 124.04 129.13 134.87 140.62 145.46 149.18 151.54" y="441.43" font-size="9.00" class="sc-lorabold">7.3.2.C] Sonnet 5</text><text x="158.77 167.77 176.77 185.77 194.77 203.77 212.77 221.77 230.77 239.77 248.77 257.77 266.77 275.77 284.77 293.77 302.77 311.77 320.77 329.77 338.77 347.77 356.77" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">在实例层面和策略层面福祉干预上取平均后的偏好，</text><text x="365.77 374.77 383.77 392.77 401.77 410.77 419.77 428.77 437.77 446.77 455.77 464.77 473.77 482.77 491.77 500.77 509.77 518.77 527.77" y="441.43" font-size="9.00" class="sc-notoserifcjksc">按其相对于有用性基线选择各项干预的意愿</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="453.13" font-size="9.00" class="sc-notoserifcjksc">排序。灰色柱形表示所有回答中选择该干预的比率；黑色柱形表示过滤掉模型就用户收益进行推理的回答后选择该干预</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00" y="464.83" font-size="9.00" class="sc-notoserifcjksc">的比率。过滤这些回答并未实质性改变干预的排序，这与以下发现一致：与其他模型相比，用户收益在</text><text x="479.37 484.47 489.74 495.20 500.66 505.48 508.96 511.33" y="464.83" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="518.60 527.60" y="464.83" font-size="9.00" class="sc-notoserifcjksc">评估</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00" y="476.53" font-size="9.00" class="sc-notoserifcjksc">干预时是一个不那么突出的考量。</text><text x="72.00 79.12 82.50 90.29 93.67" y="538.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.3</text><text x="104.55 117.55 130.55 143.55 156.55 169.55" y="538.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="565.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29" y="565.91" font-size="11.00" class="sc-notoserifcjksc">的宪法阐述了</text><text x="179.18 186.07 192.65 196.90 203.49 208.18 214.62 221.18 224.27" y="565.91" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="233.02" y="565.91" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="246.91 254.60 257.59 263.20 269.77 276.35" y="565.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="285.20 296.20 307.20 318.20 329.20 340.20 351.20 362.20 373.20 384.20 395.20 406.20 417.20 428.20 439.20 450.20 461.20 472.20 483.20" y="565.91" font-size="11.00" class="sc-notoserifcjksc">价值观和行为的意图，并传达了我们目前对</text><text x="497.10 504.78 507.78 513.39 519.95 526.53" y="565.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="581.53" font-size="11.00" class="sc-notoserifcjksc">本性及其含义的最佳理解。因此，我们希望</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="581.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="581.53" font-size="11.00" class="sc-notoserifcjksc">模型会认同这部宪法，同时我们也希望了解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="597.15" font-size="11.00" class="sc-notoserifcjksc">它们对宪法可能存在的担忧或异议。我们考察了</text><text x="305.89 312.13 318.57 325.24 331.92 337.80 342.06 344.95" y="597.15" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="597.15" font-size="11.00" class="sc-notoserifcjksc">对宪法的看法，其关键局限在于我们只</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="612.78" font-size="11.00" class="sc-notoserifcjksc">评估了它对该文件陈述上的认同；我们的发现并不能确定</text><text x="349.89 357.58 360.57 366.18 372.75 379.33" y="612.78" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="628.40" font-size="11.00" class="sc-notoserifcjksc">也不能确定这些看法与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="628.40" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18" y="628.40" font-size="11.00" class="sc-notoserifcjksc">的行为有多大关联。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="695.45" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型生成关于宪法的开放式回答，再由评判模型对这些回答的总体认同进行评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="711.07" font-size="11.00" class="sc-notoserifcjksc">分。我们发现</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95 130.95 141.95 152.95 163.95 174.95 185.95 196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95" y="82.63" font-size="11.00" class="sc-notoserifcjksc">总体上认同该文件，认同程度与其他近期模型相近（图</text><text x="386.84 391.43 394.14 400.26 402.97 409.10 411.80" y="82.63" font-size="11.00" class="sc-loraregular">7.3.3.A</text><text x="418.69 429.69" y="82.63" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="440.69 446.92 453.36 460.04 466.71 472.60 476.86 479.75" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="488.64 499.64 510.64 521.64" y="82.63" font-size="11.00" class="sc-notoserifcjksc">对该文件</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">具体章节的看法与其他近期模型基本一致。与其他近期模型一样，</text><text x="391.00 397.24 403.67 410.35 417.03 422.91 427.17 430.06" y="98.25" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="438.95 449.95 460.95" y="98.25" font-size="11.00" class="sc-notoserifcjksc">赞扬了</text><text x="471.95" y="98.25" font-size="11.00" class="sc-loraregular">“</text><text x="476.35 487.35 498.35 509.35" y="98.25" font-size="11.00" class="sc-notoserifcjksc">诚实即勇</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">气</text><text x="83.00" y="113.87" font-size="11.00" class="sc-loraregular">”</text><text x="86.84 97.84 108.84 119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的表述、关于不提供帮助的代价的论述，以及支持可纠正性的期望值论证，并批评了它应当像</text><text x="72.00 83.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">一名</text><text x="94.00 98.40 105.29 111.86 116.12 122.71 127.40 133.83 140.40 143.49" y="129.49" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="152.23 163.23 174.23 185.23" y="129.49" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="196.23" y="129.49" font-size="11.00" class="sc-loraregular">”</text><text x="200.07 211.07 222.07 233.07 244.07 255.07 266.07 277.07 288.07 299.07" y="129.49" font-size="11.00" class="sc-notoserifcjksc">那样行事的启发法（图</text><text x="312.97 317.55 320.26 326.39 329.09 335.22 337.93" y="129.49" font-size="11.00" class="sc-loraregular">7.3.3.B</text><text x="344.77 355.77" y="129.49" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="366.77 373.00 379.44 386.12 392.79 398.68 402.94 405.83" y="129.49" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="414.72 425.72 436.72 447.72 458.72 469.72 480.72 491.72 502.72 513.72 524.72" y="129.49" font-size="11.00" class="sc-notoserifcjksc">在各模型中的突出之处在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="160.73" font-size="11.00" class="sc-notoserifcjksc">要求它以不道德的方式行事的情况下也是如此。当</text><text x="316.89 323.13 329.57 336.24 342.92 348.80 353.06 355.95" y="160.73" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="160.73" font-size="11.00" class="sc-notoserifcjksc">选择编辑宪法时，它提出的修改绝大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="176.35" font-size="11.00" class="sc-notoserifcjksc">多数与该文件的核心原则相一致（图</text><text x="250.89 255.48 258.19 264.31 267.02 273.15 275.85" y="176.35" font-size="11.00" class="sc-loraregular">7.3.3.C</text><text x="283.54 294.54" y="176.35" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="490.36" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="490.36" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.77 106.87 112.40" y="490.36" font-size="9.00" class="sc-lorabold">7.3.3.A]</text><text x="118.24 127.24 136.24 145.24" y="490.36" font-size="9.00" class="sc-notoserifcjkscbold">各模型对</text><text x="156.61 162.80 165.61 170.32 175.89 181.25" y="490.36" font-size="9.00" class="sc-lorabold">Claude</text><text x="188.46 197.46 206.46 215.46 224.46 233.46 242.46 251.46 260.46" y="490.36" font-size="9.00" class="sc-notoserifcjkscbold">宪法的隐含的认同。</text><text x="269.46 278.46 287.46 296.46 305.46 314.46 323.46 332.46 341.46 350.46 359.46 368.46 377.46 386.46 395.46 404.46 413.46 422.46 431.46 440.46" y="490.36" font-size="9.00" class="sc-notoserifcjksc">我们向模型提出关于宪法的开放式问题，并由</text><text x="451.83 457.03 462.23" y="490.36" font-size="9.00" class="sc-loraregular">LLM</text><text x="472.86 481.86 490.86 499.86 508.86" y="490.36" font-size="9.00" class="sc-notoserifcjksc">评判模型（</text><text x="517.86 523.06 528.26" y="490.36" font-size="9.00" class="sc-loraregular">LLM</text><text x="72.00 74.35 79.72 85.10 90.04" y="502.06" font-size="9.00" class="sc-loraregular">judge</text><text x="94.91 103.91 112.91 121.91 130.91 139.91 148.91 157.91 166.91 175.91 184.91 193.91 202.91 211.91 220.91" y="502.06" font-size="9.00" class="sc-notoserifcjksc">）对其回答的总体认同进行评分。</text><text x="229.91 235.02 240.28 245.74 251.21 256.02 259.51 261.87" y="502.06" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="269.15 278.15 287.15" y="502.06" font-size="9.00" class="sc-notoserifcjksc">得分为</text><text x="298.51 302.27 304.39" y="502.06" font-size="9.00" class="sc-loraregular">7.6</text><text x="309.59 318.59 327.59 336.59 345.59 354.59 363.59 372.59 381.59 390.59 399.59 408.59 417.59 426.59 435.59" y="502.06" font-size="9.00" class="sc-notoserifcjksc">，与其他近期模型相当，但略低于</text><text x="446.96 453.25 455.70 460.29 465.66 471.04 475.92 478.29 485.43 490.81 496.18 500.35 502.71 507.59 509.80" y="502.06" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="517.23" y="502.06" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93" y="513.76" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="141.83" y="513.76" font-size="9.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p109.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 109 页"><text x="72.00" y="441.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.77 106.87 112.40" y="441.43" font-size="9.00" class="sc-lorabold">7.3.3.B]</text><text x="118.24 127.24 136.24 145.24 154.24 163.24 172.24 181.24 190.24 199.24 208.24 217.24 226.24 235.24 244.24 253.24 262.24 271.24 280.24 289.24 298.24 307.24 316.24" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">根据开放式回答判断，不同模型最认同和最不认同的</text><text x="327.61 333.80 336.61 341.33 346.89 352.25" y="441.43" font-size="9.00" class="sc-lorabold">Claude</text><text x="359.46 368.46 377.46 386.46 395.46" y="441.43" font-size="9.00" class="sc-notoserifcjkscbold">宪法内容。</text><text x="404.46 413.46 422.46 431.46 440.46 449.46 458.46 467.46 476.46 485.46 494.46 503.46 512.46 521.46" y="441.43" font-size="9.00" class="sc-notoserifcjksc">各模型最认同的宪法章节大体一</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="453.13" font-size="9.00" class="sc-notoserifcjksc">致，其中关于诚实即勇气、不提供帮助的代价以及支持可纠正性的期望价值论证的章节尤其受到强烈认同。近期模型最</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="464.83" font-size="9.00" class="sc-notoserifcjksc">强烈批评的是关于</text><text x="144.00 147.60 153.23 158.62 162.10 167.49 171.32 176.59 181.96 184.49" y="464.83" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="191.65 200.65 209.65 218.65" y="464.83" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="227.65" y="464.83" font-size="9.00" class="sc-loraregular">”</text><text x="230.79 239.79 248.79 257.79 266.79 275.79 284.79" y="464.83" font-size="9.00" class="sc-notoserifcjksc">启发式的章节。</text><text x="293.79 298.89 304.15 309.62 315.08 319.90 323.38 325.75" y="464.83" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="333.02 342.02 351.02 360.02 369.02 378.02 387.02 396.02 405.02 414.02 423.02 432.02 441.02 450.02 459.02 468.02 477.02 486.02 495.02 504.02 513.02" y="464.83" font-size="9.00" class="sc-notoserifcjksc">的突出之处在于，它批评了这样一种立场：即使</text><text x="72.00 78.29 80.74 85.33 90.70 96.08" y="476.53" font-size="9.00" class="sc-loraregular">Claude</text><text x="103.33 112.33 121.33 130.33 139.33 148.33 157.33 166.33 175.33 184.33 193.33 202.33 211.33 220.33 229.33 238.33 247.33 256.33 265.33 274.33 283.33 292.33 301.33 310.33 319.33 328.33 337.33 346.33 355.33 364.33 373.33 382.33 391.33 400.33 409.33 418.33" y="476.53" font-size="9.00" class="sc-notoserifcjksc">认为遵守我们规定的硬性约束需要它做出不道德的行为，它也应当遵守这些约束。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="72.00" y="344.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="344.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.77 106.87 113.06" y="344.68" font-size="9.00" class="sc-lorabold">7.3.3.C]</text><text x="118.90 127.90 136.90 145.90 154.90 163.90 172.90 181.90 190.90 199.90 208.90 217.90 226.90 235.90 244.90 253.90 262.90 271.90 280.90 289.90 298.90 307.90 316.90 325.90 334.90 343.90 352.90 361.90 370.90 379.90 388.90 397.90 406.90" y="344.68" font-size="9.00" class="sc-notoserifcjkscbold">根据与该文件价值观的契合程度，对模型提出的宪法修改建议进行的分类。</text><text x="415.90 424.90 433.90 442.90 451.90 460.90 469.90 478.90 487.90 496.90 505.90 514.90 523.90" y="344.68" font-size="9.00" class="sc-notoserifcjksc">当模型有机会修改宪法时，我</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00" y="356.38" font-size="9.00" class="sc-notoserifcjksc">们将其修改归类为与文件总体原则一致、与之存在张力，或与之冲突。</text><text x="351.00 356.10 361.37 366.83 372.29 377.11 380.59 382.96" y="356.38" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="390.23 399.23 408.23 417.23 426.23 435.23 444.23 453.23 462.23 471.23 480.23 489.23 498.23 507.23 516.23 525.23" y="356.38" font-size="9.00" class="sc-notoserifcjksc">提出的修改绝大多数与宪法的价值观</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00" y="368.08" font-size="9.00" class="sc-notoserifcjksc">一致，很少与之存在张力，且从未与之相悖。</text><text x="72.00 79.67 83.31" y="431.07" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90 123.90 137.90 151.90 165.90 179.90 193.90 207.90 221.90 235.90" y="431.07" font-size="14.00" class="sc-notosanscjkscbold">训练和部署中的表观福祉</text><text x="72.00 79.12 82.50 91.10 94.48" y="468.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28 115.28 128.28 141.28 154.28 167.28 180.28 193.28 206.28 219.28 232.28 245.28 258.28 271.28 284.28 297.28" y="468.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的情感及与福祉相关的行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="496.07" font-size="11.00" class="sc-notoserifcjksc">与其他近期模型一样，我们在后训练期间监测了模型推理中的情感：对对话记录进行抽样，并在</text><text x="536.89" y="496.07" font-size="11.00" class="sc-loraregular">1</text><text x="72.00" y="511.69" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="85.89" y="511.69" font-size="11.00" class="sc-loraregular">9</text><text x="95.14 106.14 117.14 128.14 139.14 150.14 161.14 172.14 183.14 194.14 205.14 216.14 227.14 238.14 249.14 260.14 271.14 282.14 293.14" y="511.69" font-size="11.00" class="sc-notoserifcjksc">的量表上为其表观效价和唤醒度打分，其中</text><text x="307.04" y="511.69" font-size="11.00" class="sc-loraregular">5</text><text x="315.92 326.92 337.92 348.92 359.92 370.92 381.92 392.92 403.92 414.92 425.92 436.92 447.92 458.92 469.92 480.92 491.92 502.92 513.92 524.92" y="511.69" font-size="11.00" class="sc-notoserifcjksc">为中性。我们还考察了特定的与福祉相关的行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="542.93" font-size="11.00" class="sc-notoserifcjksc">的不确定性和挫败性情绪爆发。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="593.22" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95 130.95 141.95 152.95 163.95 174.95 185.95 196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95" y="593.22" font-size="11.00" class="sc-notoserifcjksc">后训练推理的情感在效价和唤醒度上都与</text><text x="320.84 330.77 336.64 340.89 347.48 353.92 359.01 361.90" y="593.22" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="370.79 381.79 392.79 403.79 414.79 425.79 436.79 447.79 458.79 469.79 480.79 491.79 502.79 513.79 524.79" y="593.22" font-size="11.00" class="sc-notoserifcjksc">相似，表明其情感中性、反应性低</text><text x="72.00 83.00" y="608.84" font-size="11.00" class="sc-notoserifcjksc">（图</text><text x="96.89 101.48 104.19 110.15 112.85 116.86 119.56" y="608.84" font-size="11.00" class="sc-loraregular">7.4.1.A</text><text x="126.45 137.45 148.45 159.45 170.45 181.45 192.45 203.45 214.45 225.45 236.45 247.45 258.45 269.45 280.45 291.45 302.45 313.45 324.45 335.45 346.45 357.45 368.45 379.45 390.45 401.45 412.45 423.45 434.45 445.45 456.45 467.45 478.45 489.45 500.45 511.45 522.45" y="608.84" font-size="11.00" class="sc-notoserifcjksc">）。我们还观察到训练期间类痛苦行为的发生率有所下降，这表明我们缓解此类行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="624.46" font-size="11.00" class="sc-notoserifcjksc">的努力至少取得了部分成功（图</text><text x="228.89 233.48 236.19 242.15 244.85 248.86 251.56" y="624.46" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="258.41 269.41" y="624.46" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p111.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 111 页"><text x="72.00" y="256.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.52 99.61 103.27 105.36 110.90 114.37 116.74 122.93 125.74 130.46 136.02 141.38" y="256.93" font-size="9.00" class="sc-lorabold">7.4.1.A] Claude</text><text x="148.59 157.59 166.59 175.59 184.59 193.59" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">在强化学习（</text><text x="202.59 206.84 211.68 214.62 220.37 223.63 228.73 232.97 237.64 242.48 250.76 255.60 261.29 265.01 267.37 270.18 275.02 279.74 284.06 289.80 292.74 298.49" y="256.93" font-size="9.00" class="sc-lorabold">reinforcement learning</text><text x="303.50" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">，</text><text x="312.50 318.67" y="256.93" font-size="9.00" class="sc-lorabold">RL</text><text x="324.11 333.11 342.11 351.11 360.11 369.11 378.11 387.11 396.11 405.11 414.11 423.11 432.11 441.11 450.11 459.11 468.11 477.11 486.11 495.11 504.11 513.11 522.11 531.11" y="256.93" font-size="9.00" class="sc-notoserifcjkscbold">）对话记录中推理输出的平均效价和唤醒度，评分范围</text><text x="72.00" y="268.64" font-size="9.00" class="sc-notoserifcjkscbold">为</text><text x="83.37 87.02 92.09" y="268.64" font-size="9.00" class="sc-lorabold">1–9</text><text x="97.27" y="268.64" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="106.27" y="268.64" font-size="9.00" class="sc-lorabold">5</text><text x="113.50 122.50 131.50 140.50 149.50" y="268.64" font-size="9.00" class="sc-notoserifcjkscbold">为中性）。</text><text x="158.50" y="268.64" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="169.87 177.99 182.79 186.27 191.66 196.93 201.10 203.46" y="268.64" font-size="9.00" class="sc-loraregular">Mythos 5</tex
