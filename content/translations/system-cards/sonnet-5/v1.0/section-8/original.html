<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="72.00" y="84.21" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="84.21" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="72.00" y="485.51" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="161.46" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">与</text><text x="231.13" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="242.50 248.46 254.15 257.87 263.46 267.71 272.80 278.21 281.15" y="485.51" font-size="9.00" class="sc-lorabold">Anthropic</text><text x="288.18" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">内部智能体运行框架上的精确匹配准确率。</text><text x="459.18" y="485.51" font-size="9.00" class="sc-notoserifcjksc">除</text><text x="470.55 476.84 479.29 483.88 489.25 494.63 499.51 501.88 509.02 514.40 519.77 523.93 526.30 531.18 533.11" y="485.51" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="72.00" y="497.21" font-size="9.00" class="sc-notoserifcjksc">以其默认推理强度设置运行外，所有模型均在</text><text x="254.37" y="497.21" font-size="9.00" class="sc-loraregular">max</text><text x="274.19" y="497.21" font-size="9.00" class="sc-notoserifcjksc">推理强度下使用自适应思考运行。</text><text x="409.19 415.48 417.93 422.52 427.90 433.28 438.16 440.52 445.63 450.89 456.35 461.82 466.63 470.12 472.48" y="497.21" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="479.75" y="497.21" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="491.12 497.41 499.86 504.45 509.82 515.21" y="497.21" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 79.15 84.52 89.89 94.06 96.43 101.30 103.23" y="508.91" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="109.75" y="508.91" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="148.11" y="508.91" font-size="9.00" class="sc-loraregular">5</text><text x="155.38" y="508.91" font-size="9.00" class="sc-notoserifcjksc">次试验的平均值，</text><text x="227.38 233.68 236.12 240.71 246.09 251.47 256.35 258.71 263.82 269.08 274.54 280.01 284.82 288.31 290.67 295.55 297.68" y="508.91" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="305.24" y="508.91" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="316.61 322.90 325.35 329.94 335.31 340.70 345.57 347.94 355.09 360.46 365.83 370.00 372.37 377.24 379.46" y="508.91" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="386.88" y="508.91" font-size="9.00" class="sc-notoserifcjksc">的得分为单次试验结果。</text><text x="121.57" y="551.07" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46 143.60 149.20 153.46 159.13 165.53 170.30 173.39 179.24 185.15" y="551.07" font-size="11.00" class="sc-loraregular">Databricks</text><text x="193.13" y="551.07" font-size="11.00" class="sc-notoserifcjksc">发布的一项公开基准测试，评估模型在由大量历史</text><text x="438.02 444.90 449.59 455.53 461.20 466.29 472.86 477.81" y="551.07" font-size="11.00" class="sc-loraregular">Treasury</text><text x="72.00 78.76 85.33 88.32 91.32 97.20 101.46 104.55" y="566.69" font-size="11.00" class="sc-loraregular">Bulletin</text><text x="111.23" y="566.69" font-size="11.00" class="sc-notoserifcjksc">（美国财政部公报）文档构成的语料上进行端到端有据推理的能力。模型必须在整个语料</text><text x="72.00" y="582.31" font-size="11.00" class="sc-notoserifcjksc">中定位相关表格，并基于这些表格进行精确的数值推理。我们以智能体方式进行评估：文档以提</text><text x="72.00" y="597.93" font-size="11.00" class="sc-notoserifcjksc">取后的文本形式提供于沙箱化的环境中，并提供代码执行工具；</text><text x="450.25" y="597.93" font-size="11.00" class="sc-notoserifcjksc">是推荐用于前沿模</text><text x="72.00" y="613.55" font-size="11.00" class="sc-notoserifcjksc">型的、难度更高的</text><text x="162.89" y="613.55" font-size="11.00" class="sc-loraregular">133</text><text x="182.04" y="613.55" font-size="11.00" class="sc-notoserifcjksc">题子集。得分采用精确匹配（五次试验的平均值），耗尽输出预算的回合</text><text x="72.00" y="629.17" font-size="11.00" class="sc-notoserifcjksc">记为错误。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="680.60" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="680.60" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="221.70" y="680.60" font-size="11.00" class="sc-notoserifcjksc">上达到</text><text x="257.59" y="680.60" font-size="11.00" class="sc-loraregular">73.3%</text><text x="287.19" y="680.60" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="382.33" y="680.60" font-size="11.00" class="sc-notoserifcjksc">上达到</text><text x="418.23 424.22 430.40 433.11 439.07" y="680.60" font-size="11.00" class="sc-loraregular">59.4%</text><text x="448.64" y="680.60" font-size="11.00" class="sc-notoserifcjksc">，较</text><text x="473.53 481.22 484.21 489.82 496.39 502.97" y="680.60" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="696.22" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98" y="696.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="136.98 143.34 149.52 151.87 156.94" y="696.22" font-size="11.00" class="sc-loraregular">68.7%</text><text x="169.40" y="696.22" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="183.30" y="696.22" font-size="11.00" class="sc-loraregular">53.4%</text><text x="213.66" y="696.22" font-size="11.00" class="sc-notoserifcjksc">）有所提升。两个模型都会产生很长的推理，在最高</text><a href="https://www.databricks.com/blog/introducing-officeqa-benchmark-end-to-end-grounded-reasoning" rel="noopener"><rect x="72.00" y="542.27" width="46.67" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">推理强度下，有一部分回合（约</text><text x="228.89" y="82.63" font-size="11.00" class="sc-loraregular">9–15%</text><text x="261.31" y="82.63" font-size="11.00" class="sc-notoserifcjksc">）在给出最终答案之前就达到了每轮输出上限；这些回合</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">记为错误，因此相关数值是保守的。</text><text x="121.57" y="131.20" font-size="11.00" class="sc-notoserifcjksc">得分对评估运行框架高度敏感：要求模型直接解析原始</text><text x="388.46 395.07 403.16" y="131.20" font-size="11.00" class="sc-loraregular">PDF</text><text x="412.08" y="131.20" font-size="11.00" class="sc-notoserifcjksc">语料的设置会使所有模型</text><text x="72.00" y="146.82" font-size="11.00" class="sc-notoserifcjksc">的绝对得分大幅降低，跨报告比较时应考虑这一点。</text><text x="72.00 78.83 84.77 90.45 93.44 98.82 109.33 115.77 120.49 123.48 130.06 132.95 138.92 142.02 148.69 154.37 161.05 166.84 172.80 175.70 181.25" y="222.20" font-size="11.00" class="sc-loraregular">Real-World Finance v2</text><text x="190.05" y="222.20" font-size="11.00" class="sc-notoserifcjksc">是我们内部开发的一项评估，用于衡量模型完成复杂、长程金融分析任</text><text x="72.00" y="253.44" font-size="11.00" class="sc-notoserifcjksc">析，以及基于贴近现实的输入材料产出可直接交付客户的工作成果。该评估套件包含</text><text x="481.89" y="253.44" font-size="11.00" class="sc-loraregular">294</text><text x="503.01" y="253.44" font-size="11.00" class="sc-notoserifcjksc">项复杂</text><text x="72.00" y="269.06" font-size="11.00" class="sc-notoserifcjksc">且贴近现实的任务，代表了金融专业人士的日常工作。由于这些任务的交付物是开放式的，而非</text><text x="72.00" y="284.68" font-size="11.00" class="sc-notoserifcjksc">单一正确答案，我们以两两比较的方式进行评估：两个模型尝试同一任务，由基于模型的评分者</text><text x="72.00" y="300.30" font-size="11.00" class="sc-notoserifcjksc">在两份工作成果之间给出偏好。我们报告正面对比胜率（以及据此推导出的</text><text x="437.89" y="300.30" font-size="11.00" class="sc-loraregular">Elo</text><text x="454.16" y="300.30" font-size="11.00" class="sc-notoserifcjksc">），这一方法与</text><text x="72.00" y="315.92" font-size="11.00" class="sc-notoserifcjksc">其他已发表的专业工作成果评估类似。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="400.32" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="117.06" y="400.32" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="128.06" y="400.32" font-size="11.00" class="sc-loraregular">1219</text><text x="148.33" y="400.32" font-size="11.00" class="sc-notoserifcjksc">）与</text><text x="173.22 181.96 188.52 195.09 200.18 203.08 209.04 211.39" y="400.32" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="216.46" y="400.32" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="227.46 231.47 237.37 243.96" y="400.32" font-size="11.00" class="sc-loraregular">1207</text><text x="249.03" y="400.32" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="273.93" y="400.32" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="318.63" y="400.32" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="329.63" y="400.32" font-size="11.00" class="sc-loraregular">1222</text><text x="351.36" y="400.32" font-size="11.00" class="sc-notoserifcjksc">）在统计上持平，比</text><text x="453.25 459.49 465.92 472.60 479.28 485.16 489.42 492.31 498.27 500.87" y="400.32" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="510.12" y="400.32" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="524.01" y="400.32" font-size="11.00" class="sc-loraregular">219</text><text x="72.00" y="415.94" font-size="11.00" class="sc-notoserifcjksc">分（</text><text x="94.00 100.24 106.67 113.35 120.03 125.91 130.17 133.06" y="415.94" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="141.95" y="415.94" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="155.84 162.08 168.51 175.19 181.87 187.75 192.01 194.90 200.86 203.46" y="415.94" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="212.71" y="415.94" font-size="11.00" class="sc-notoserifcjksc">的胜率为</text><text x="259.61" y="415.94" font-size="11.00" class="sc-loraregular">69%</text><text x="281.89" y="415.94" font-size="11.00" class="sc-notoserifcjksc">），且明显低于</text><text x="361.78 367.37 373.05 379.45 382.44 388.40 391.30" y="415.94" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="397.29" y="415.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="408.29 413.88 419.56 425.96 428.95" y="415.94" font-size="11.00" class="sc-loraregular">Fable</text><text x="437.80" y="415.94" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="451.70 457.93 464.37 471.05 477.72 483.61 487.87 490.76" y="415.94" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="499.65" y="415.94" font-size="11.00" class="sc-notoserifcjksc">的胜率</text><text x="72.00" y="431.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="431.56" font-size="11.00" class="sc-loraregular">69%</text><text x="108.18" y="431.56" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92 119.39 121.76 127.81 132.65 137.37 140.09 144.33 152.86 157.96 162.20 165.01 170.37 172.74 177.78 180.72 186.46 191.18 196.92 201.58 206.42 208.79 213.63 218.43 220.80 226.41 231.85" y="367.93" font-size="9.00" class="sc-lorabold">8.11.2.A] Real-World Finance v2 ELO</text><text x="238.77" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="247.77" y="367.93" font-size="9.00" class="sc-notoserifcjksc">每个模型尝试</text><text x="304.14" y="367.93" font-size="9.00" class="sc-loraregular">294</text><text x="321.42" y="367.93" font-size="9.00" class="sc-notoserifcjksc">项量化金融任务；由</text><text x="404.78 411.08 413.52 418.11 423.49 428.87 433.75 436.11 443.26 448.63 454.00 458.17 460.54 465.42 467.63" y="367.93" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="475.06" y="367.93" font-size="9.00" class="sc-notoserifcjksc">评分者对交付物</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">进行两两比较，评分采用</text><text x="173.37 178.89 182.73 187.37 192.75 195.20 200.03 204.79 209.19 214.51 219.38 223.28 227.33" y="379.63" font-size="9.00" class="sc-loraregular">Bradley-Terry</text><text x="234.45" y="379.63" font-size="9.00" class="sc-notoserifcjksc">拟合，其中</text><text x="281.82 286.92 292.18 297.65 303.11 307.93 311.41 313.78 318.65 320.78" y="379.63" font-size="9.00" class="sc-loraregular">Sonnet 4.6</text><text x="325.98" y="379.63" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="334.98" y="379.63" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="371.56" y="379 text><text x="75.47" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.35 110.45 115.98" y="458.16" font-size="9.00" class="sc-lorabold">8.11.5.A]</text><text x="121.82" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">使用内部运行框架的</text><text x="205.19 210.58 215.68 220.73 223.54 228.22 231.94 237.53 240.34 245.43" y="458.16" font-size="9.00" class="sc-lorabold">Toolathlon</text><text x="253.54" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="280.54" y="458.16" font-size="9.00" class="sc-notoserifcjksc">各模型均在</text><text x="327.91" y="458.16" font-size="9.00" class="sc-loraregular">max</text><text x="347.73" y="458.16" font-size="9.00" class="sc-notoserifcjksc">推理强度下使用自适应思考进行评估。</text><text x="500.73 506.12 510.77 514.94 519.10 526.27" y="458.16" font-size="9.00" class="sc-loraregular">Pass@1</text><text x="529.54" y="458.16" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00 77.39 82.04 86.20 90.37 97.53" y="469.86" font-size="9.00" class="sc-loraregular">Pass@3</text><text x="104.91" y="469.86" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="116.28 121.67 126.32 130.48 134.65" y="469.86" font-size="9.00" class="sc-loraregular">Pass³</text><text x="140.35" y="469.86" font-size="9.00" class="sc-notoserifcjksc">按论文的评估方案，基于全部</text><text x="259.71" y="469.86" font-size="9.00" class="sc-loraregular">108</text><text x="276.00" y="469.86" font-size="9.00" class="sc-notoserifcjksc">项任务、每项</text><text x="332.37" y="469.86" font-size="9.00" class="sc-loraregular">3</text><text x="339.75" y="469.86" font-size="9.00" class="sc-notoserifcjksc">次试验计算。</text><text x="72.00" y="497.22" font-size="11.00" class="sc-notoserifcjksc">关于与已发布排行榜可比性的说明。我们的运行框架复刻了上游的任务定义、提示词和基于执行</text><text x="72.00" y="512.84" font-size="11.00" class="sc-notoserifcjksc">的检查器，并通过重放已发布的</text><text x="228.89 234.75 237.74 243.35 249.91 256.49 262.45 267.83 272.93 279.36 286.04 292.72 298.60 302.86 308.24 314.20 316.90" y="512.84" font-size="11.00" class="sc-loraregular">claude-sonnet-4.5</text><text x="325.79" y="512.84" font-size="11.00" class="sc-notoserifcjksc">轨迹进行了验证。为控制自已发布轨迹以来</text><text x="72.00" y="528.46" font-size="11.00" class="sc-notoserifcjksc">的实时依赖漂移和上游仓库变更，我们将金融数据源和容器镜像固定到离线快照，并镜像当前的</text><text x="72.00" y="544.08" font-size="11.00" class="sc-notoserifcjksc">上游状态。按已发布的版本，大约四分之一的任务无法完成；我们对这些任务未作改动。固定版</text><text x="72.00" y="559.70" font-size="11.00" class="sc-notoserifcjksc">本的净效应：我们的得分比严格与上游等价的运行框架高约</text><text x="360.89" y="559.70" font-size="11.00" class="sc-loraregular">3</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="575.32" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="575.32" font-size="11.00" class="sc-notoserifcjksc">模型之间保持不变。另外，已发布排行榜中</text><text x="322.18 330.92 337.48 344.05 349.14 352.04 358.00 360.35" y="575.32" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="368.32" y="575.32" font-size="11.00" class="sc-notoserifcjksc">的数据采用的是作者的默认配置，</text><text x="72.00" y="590.94" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="96.89" y="590.94" font-size="11.00" class="sc-loraregular">max</text><text x="121.13" y="590.94" font-size="11.00" class="sc-notoserifcjksc">推理强度。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="72.00 78.89 85.45 89.71 96.15 105.98 111.58 115.84 118.93 125.36 131.97 138.81 144.78 151.45 157.31" y="110.82" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="163.89" y="107.15" font-size="6.60" class="sc-loraregular">31</text><text x="172.87" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="186.76" y="110.82" font-size="11.00" class="sc-loraregular">Zapier</text><text x="222.42" y="110.82" font-size="11.00" class="sc-notoserifcjksc">推出的一项基准测试，衡量智能体能否完成贴近现实的端到端业</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">务工作流。任务基于真实客户在销售、市场营销、运营、客户支持、财务和人力资源领域的工作</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">流模式构建。每项任务都将智能体置于一家模拟公司中，该公司拥有数十个</text><text x="437.89 444.80 451.64 457.88 464.92 467.81 474.70 481.31" y="142.06" font-size="11.00" class="sc-loraregular">REST API</text><text x="487.89" y="142.06" font-size="11.00" class="sc-notoserifcjksc">端点，覆</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">盖</text><text x="85.89" y="157.68" font-size="11.00" class="sc-loraregular">47</text><text x="99.82" y="157.68" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="143.82" y="157.68" font-size="11.00" class="sc-loraregular">CRM</text><text x="168.51" y="157.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="179.51" y="157.68" font-size="11.00" class="sc-loraregular">Slack</text><text x="206.18" y="157.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="217.18 225.55 231.98 238.42 244.77 247.76 253.72 256.61 267.13 273.56 278.28 284.19 289.28 295.85 301.53 307.32" y="157.68" font-size="11.00" class="sc-loraregular">Google Workspace</text><text x="316.18" y="157.68" font-size="11.00" class="sc-notoserifcjksc">等）。在仅给出一条自然语言指令的情况下，</text><text x="72.00" y="173.30" font-size="11.00" class="sc-notoserifcjksc">智能体必须通过搜索自主发现正确的端点，进行数十次顺序执行、相互依赖的</text><text x="448.89 455.78 462.39" y="173.30" font-size="11.00" class="sc-loraregular">API</text><text x="468.97" y="173.30" font-size="11.00" class="sc-notoserifcjksc">调用，查阅并</text><text x="72.00" y="188.92" font-size="11.00" class="sc-notoserifcjksc">遵守分层业务政策文档，同时避开刻意设置的干扰项。每项任务的评分为通过或不通过，依据是</text><text x="72.00" y="204.54" font-size="11.00" class="sc-notoserifcjksc">否满足针对模拟应用状态的所有确定性断言（例如，是否应用了正确的</text><text x="415.89" y="204.54" font-size="11.00" class="sc-loraregular">CRM</text><text x="443.48" y="204.54" font-size="11.00" class="sc-notoserifcjksc">更新）。</text><text x="72.00" y="289.16" font-size="11.00" class="sc-notoserifcjksc">在衡量私有留出评估集表现的</text><text x="217.89 224.78 231.35 235.60 242.04 251.87 257.47 261.73 264.82 271.25 277.87 284.71 290.67 297.35 303.20" y="289.16" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="312.68" y="289.16" font-size="11.00" class="sc-notoserifcjksc">排行榜上，</text><text x="367.68 375.37 378.36 383.97 390.54 397.12 403.08 405.97 412.21 418.64 425.32 432.00 437.88 442.14 445.03" y="289.16" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="451.03" y="289.16" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="462.03" y="289.16" font-size="11.00" class="sc-loraregular">max</text><text x="486.26" y="289.16" font-size="11.00" class="sc-notoserifcjksc">推理强</text><text x="72.00" y="304.78" font-size="11.00" class="sc-notoserifcjksc">度）得分为</text><text x="129.89" y="304.78" font-size="11.00" class="sc-loraregular">13.5%</text><text x="158.29" y="304.78" font-size="11.00" class="sc-notoserifcjksc">，较</text><text x="183.19 190.88 193.87 199.48 206.05 212.62 218.59 221.48 227.72 234.15 240.83 247.51 253.39 257.65 260.54 266.50 269.10" y="304.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="275.46" y="304.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="286.46" y="304.78" font-size="11.00" class="sc-loraregular">max</text><text x="310.69" y="304.78" font-size="11.00" class="sc-notoserifcjksc">推理强度）的</text><text x="379.58" y="304.78" font-size="11.00" class="sc-loraregular">5.3%</text><text x="406.87" y="304.78" font-size="11.00" class="sc-notoserifcjksc">有显著提升。</text><text x="72.00" y="610.13" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="610.13" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.67 110.76 116.30 119.77 122.14 127.96 133.49 137.21 142.30 150.58 155.26 158.98 161.92 167.01 172.70 178.65 183.49 189.23 193.90" y="610.13" font-size="9.00" class="sc-lorabold">8.11.6.A] AutomationBench</text><text x="201.85" y="610.13" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="219.85" y="610.13" font-size="9.00" class="sc-notoserifcjksc">，基于</text><text x="249.22" y="610.13" font-size="9.00" class="sc-loraregular" fill="#0000ff">Zapier</text><text x="278.40" y="610.13" font-size="9.00" class="sc-notoserifcjksc" fill="#0000ff">排行榜</text><text x="305.40" y="610.13" font-size="9.00" class="sc-notoserifcjksc">的私有留出任务。</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" y="707.25" width="157.50" height="12.75" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="249.22" y="602.93" width="0.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="249.22" y="602.93" width="26.81" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="276.03" y="602.93" width="2.37" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="278.40" y="602.93" width="9.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="287.40" y="602.93" width="0.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="287.40" y="602.93" width="9.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="296.40" y="602.93" width="0.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="296.40" y="602.93" width="9.00" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="72.00 79.39 86.06 91.44 98.19 102.95 106.05 112.01 115.67 121.50 127.18 132.27" y="115.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">AA-Briefcase</text><text x="141.12" y="115.05" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="245.60" y="115.05" font-size="11.00" class="sc-notoserifcjksc">开发，是一项新的基准测试，面向由行业专家构建的复杂项</text><text x="72.00" y="130.67" font-size="11.00" class="sc-notoserifcjksc">目中的长程知识工作。模型需要完成为期数周的项目，这些项目包含大量相互关联的任务以及数</text><text x="72.00" y="146.29" font-size="11.00" class="sc-notoserifcjksc">千个输入源文件；评分结合评分细则打分与由前沿模型评审团进行的成对评判，以衡量可验证的</text><text x="72.00" y="161.91" font-size="11.00" class="sc-notoserifcjksc">任务成功率、分析质量和呈现质量。</text><text x="248.00 255.69 258.68 264.29 270.86 277.44" y="161.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="418.29 425.98 428.97 434.58 441.15 447.73 453.69 456.58 462.82 469.25 475.93 482.61 488.49 492.75 495.64" y="161.91" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="504.53" y="161.91" font-size="11.00" class="sc-notoserifcjksc">排名第</text><text x="72.00" y="177.53" font-size="11.00" class="sc-notoserifcjksc">二（</text><text x="94.00 100.84 106.98 115.71 118.61 122.61 128.74 135.10" y="177.53" font-size="11.00" class="sc-loraregular">ELO 1393</text><text x="141.22" y="177.53" font-size="11.00" class="sc-notoserifcjksc">），与</text><text x="177.12" y="177.53" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="221.82" y="177.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="232.82 239.66 245.80 254.53 257.43 261.43 267.56 273.55" y="177.53" font-size="11.00" class="sc-loraregular">ELO 1352</text><text x="279.46" y="177.53" font-size="11.00" class="sc-notoserifcjksc">）在统计上持平，仅次于</text><text x="403.35 408.94 414.62 421.02 424.01 429.97 432.87" y="177.53" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="438.86" y="177.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="449.86 456.70 462.84 471.58 474.47 478.47 484.47 490.65" y="177.53" font-size="11.00" class="sc-loraregular">ELO 1586</text><text x="497.01" y="177.53" font-size="11.00" class="sc-notoserifcjksc">）。相</text><text x="72.00" y="193.15" font-size="11.00" class="sc-notoserifcjksc">较于</text><text x="96.89" y="193.15" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="141.60" y="193.15" font-size="11.00" class="sc-notoserifcjksc">，它在评分细则得分和分析质量</text><text x="298.49" y="193.15" font-size="11.00" class="sc-loraregular">Elo</text><text x="317.65" y="193.15" font-size="11.00" class="sc-notoserifcjksc">上均有提升，呈现质量</text><text x="430.55" y="193.15" font-size="11.00" class="sc-loraregular">Elo</text><text x="449.71" y="193.15" font-size="11.00" class="sc-notoserifcjksc">略有下降。与</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66" y="208.77" font-size="11.00" class="sc-loraregular">GDPval-AA v2</text><text x="146.46" y="208.77" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="179.46 187.15 190.14 195.75 202.32 208.90 214.86 217.75 223.99 230.42 237.10 243.78 249.66 253.92 256.81" y="208.77" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="265.70" y="208.77" font-size="11.00" class="sc-notoserifcjksc">运行的轨迹比同类模型长得多：平均</text><text x="444.59" y="208.77" font-size="11.00" class="sc-loraregular">183</text><text x="463.80" y="208.77" font-size="11.00" class="sc-notoserifcjksc">轮，而</text><text x="499.69 505.28 510.96 517.36 520.35 526.31 529.20" y="208.77" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="72.00" y="224.39" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 92.17" y="224.39" font-size="11.00" class="sc-loraregular">67</text><text x="100.14" y="224.39" font-size="11.00" class="sc-notoserifcjksc">轮，</text><text x="122.14" y="224.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="169.73" y="224.39" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="183.63" y="224.39" font-size="11.00" class="sc-loraregular">55</text><text x="198.51" y="224.39" font-size="11.00" class="sc-notoserifcjksc">轮。评估由</text><text x="346.99" y="224.39" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00" y="310.74" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="310.74" font-size="14.00" class="sc-notosanscjkscbold">医疗健康</text><text x="72.00" y="347.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.1 HealthBench</text><text x="194.98" y="347.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结果</text><text x="72.00 80.34 86.28 91.95 94.95 99.20 105.73 112.57 118.53 125.21 131.06" y="379.51" font-size="11.00" class="sc-loraregular">HealthBench</text><text x="137.65" y="375.84" font-size="6.60" class="sc-loraregular">32</text><text x="147.76" y="379.51" font-size="11.00" class="sc-notoserifcjksc">是一项开源评估，旨在评估真实医疗健康情境中的安全性、准确性和沟通能力。</text><text x="72.00" y="395.13" font-size="11.00" class="sc-notoserifcjksc">该基准测试使用</text><text x="151.89 157.85 164.04 166.64 173.48 180.31" y="395.13" font-size="11.00" class="sc-loraregular">48,000</text><text x="190.04" y="395.13" font-size="11.00" class="sc-notoserifcjksc">多条由专家撰写的评分细则条目，对涵盖</text><text x="390.93" y="395.13" font-size="11.00" class="sc-loraregular">26</text><text x="406.09" y="395.13" font-size="11.00" class="sc-notoserifcjksc">个医学专科的</text><text x="474.99 480.98 483.59 490.42 497.25" y="395.13" font-size="11.00" class="sc-loraregular">5,000</text><text x="506.98" y="395.13" font-size="11.00" class="sc-notoserifcjksc">段多轮</text><text x="72.00" y="410.75" font-size="11.00" class="sc-notoserifcjksc">患者对话进行评分。</text><a href="https://arxiv.org/abs/2505.08775" rel="noopener"><rect x="186.00" y= text><text x="268.24" y="468.64" font-size="11.00" class="sc-notoserifcjksc">大幅优于</text><text x="315.13 322.82 325.81 331.42 337.99 344.57 350.53 353.42 359.66 366.10 372.77 379.45 385.34 389.59 392.49 398.45 401.04" y="468.64" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="407.40" y="468.64" font-size="11.00" class="sc-notoserifcjksc">，平均表现接近</text><text x="487.29 494.98 497.98 503.58 510.15 516.73" y="468.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="484.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="116.70" y="484.26" font-size="11.00" class="sc-notoserifcjksc">，但低于</text><text x="163.60 171.29 174.28 179.89 186.46 193.03 198.99 201.89 211.82 217.68 221.94 228.53 234.97 240.06 242.95" y="484.26" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="248.95" y="484.26" font-size="11.00" class="sc-notoserifcjksc">。我们报告了多个领域的评估结果，包括计算生物学、结构</text><text x="72.00" y="499.88" font-size="11.00" class="sc-notoserifcjksc">生物学、有机化学和实验方案故障排查。这些评估中有许多由领域专家在内部开发，侧重于推动</text><text x="72.00" y="515.50" font-size="11.00" class="sc-notoserifcjksc">基础研究和药物研发中有益应用的能力，与第</text><text x="294.89" y="515.50" font-size="11.00" class="sc-loraregular">2.2</text><text x="312.31" y="515.50" font-size="11.00" class="sc-notoserifcjksc">节中侧重于滥用潜力的</text><text x="425.20" y="515.50" font-size="11.00" class="sc-loraregular">CB</text><text x="442.62" y="515.50" font-size="11.00" class="sc-notoserifcjksc">风险评估（</text><text x="497.62" y="515.50" font-size="11.00" class="sc-loraregular">CB risk</text><text x="72.00 77.68 82.77 87.86 93.82 98.92 104.01 113.84 119.81 126.38" y="531.12" font-size="11.00" class="sc-loraregular">assessment</text><text x="130.64" y="531.12" font-size="11.00" class="sc-notoserifcjksc">）形成互补。</text><text x="72.00" y="598.18" font-size="11.00" class="sc-notoserifcjksc">尽管其中许多评估并未公开发布，我们在下文对每一项作简要介绍。</text><text x="72.00 78.75 81.85 88.05 97.98 103.79 108.88 113.14 119.10 124.05 129.66 136.50 142.47 149.14 154.99" y="672.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">BioMysteryBench</text><text x="164.48" y="672.99" font-size="11.00" class="sc-notoserifcjksc">评估模型解决高难度分析难题的能力，这些难题要求将计算分析与生物学推理</text><text x="72.00" y="688.61" font-size="11.00" class="sc-notoserifcjksc">交织进行。给定未经处理的数据集，模型必须回答诸如从……中识别被敲除的基因之类的问题</text><a href="https://www.anthropic.com/research/Evaluating-Claude-For-Bioinformatics-With-BioMysteryBench" rel="noopener"><rect x="72.00" y="664.19" width="89.58" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">（指从转录组数据中识别），或确定样本感染了何种病毒。对于该基准测试，我们报告独立人类</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">专家能够解决的问题子集（</text><text x="204.00 208.40 216.77 223.34 233.17 238.85 245.53 248.42 254.66 261.09 264.04 269.48 275.16 281.56 284.55 290.30" y="98.25" font-size="11.00" class="sc-loraregular">“Human Solvable”</text><text x="294.13" y="98.25" font-size="11.00" class="sc-notoserifcjksc">），以及人类尚未解决但具有客观、真实标准答案</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的问题子集（</text><text x="227.89" y="113.87" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="189.82" font-size="11.00" class="sc-notoserifcjksc">这些评估由</text><text x="129.89 136.49 142.09 146.35 152.20 158.72 165.48 168.57" y="189.82" font-size="11.00" class="sc-loraregular">LatchBio</text><text x="177.90" y="189.82" font-size="11.00" class="sc-notoserifcjksc">开发，评估解决具有挑战性的真实世界生物信息学问题的能力。</text><text x="72.00 78.17 84.74 90.34 94.59 97.69 103.36 106.27 113.11 119.07 125.75 131.60" y="205.44" font-size="11.00" class="sc-loraregular" fill="#0000ff">SpatialBench</text><text x="183.88" y="205.44" font-size="11.00" class="sc-notoserifcjksc">变体在一组</text><text x="241.77" y="205.44" font-size="11.00" class="sc-loraregular">115</text><text x="258.67" y="205.44" font-size="11.00" class="sc-notoserifcjksc">个经外部验证的问题上测试对空间转录组学数据的分析，</text><text x="72.00" y="221.06" font-size="11.00" class="sc-notoserifcjksc">要求模型根据这些分析结果回答有关样本的生物学问题。</text><text x="347.00 353.17 356.26 362.94 369.29 372.28 378.24 385.93 391.89 394.88 397.79 404.63 410.59 417.27 423.12" y="221.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">SingleCellBench</text><text x="432.60" y="221.06" font-size="11.00" class="sc-notoserifcjksc">变体在</text><text x="468.50" y="221.06" font-size="11.00" class="sc-loraregular">195</text><text x="487.75" y="221.06" font-size="11.00" class="sc-notoserifcjksc">个问题上</text><text x="72.00" y="236.68" font-size="11.00" class="sc-notoserifcjksc">测试对单细胞</text><text x="140.89" y="236.68" font-size="11.00" class="sc-loraregular">RNA</text><text x="165.96" y="236.68" font-size="11.00" class="sc-notoserifcjksc">测序数据的分析，这些问题涵盖标注细胞类型、寻找差异表达基因和校正批次</text><text x="72.00" y="252.30" font-size="11.00" class="sc-notoserifcjksc">效应等标准工作流程。</text><text x="72.00" y="317.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.3</text><text x="111.30" y="317.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">开放式结构生物学</text><text x="72.00" y="345.59" font-size="11.00" class="sc-notoserifcjksc">我们评估了模型理解生物分子结构与功能之间关系的能力。在仅给定结构数据和基础工具的情况</text><text x="72.00" y="361.21" font-size="11.00" class="sc-notoserifcjksc">下，模型必须回答有关某一生物分子功能的开放式问题。</text><text x="72.00 78.67 83.35 89.79 94.04 100.01 103.10 109.64 118.01 123.82" y="436.59" font-size="11.00" class="sc-loraregular" fill="#0000ff">ProteinGym</text><text x="136.55" y="436.59" font-size="11.00" class="sc-notoserifcjksc">基准测试评估模型预测蛋白质突变效应的能力。</text><text x="72.00" y="483.50" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.5</text><text x="111.88" y="483.50" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有机化学</text><text x="72.00" y="527.02" font-size="11.00" class="sc-notoserifcjksc">预测反应产物，以及在</text><text x="184.89 188.58 196.85 203.14 209.97" y="527.02" font-size="11.00" class="sc-loraregular">IUPAC</text><text x="220.56" y="527.02" font-size="11.00" class="sc-notoserifcjksc">命名、</text><text x="253.56" y="527.02" font-size="11.00" class="sc-loraregular">SMILES</text><text x="295.91" y="527.02" font-size="11.00" class="sc-notoserifcjksc">表示法和化学结构图像之间进行转换。</text><text x="72.00" y="590.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.6</text><text x="111.83" y="590.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">实验方案故障排查</text><text x="72.00" y="618.59" font-size="11.00" class="sc-notoserifcjksc">该评估考察模型检测并修复分子生物学实验方案中错误的能力，包括使用网络搜索工具在线查找</text><text x="72.00" y="634.21" font-size="11.00" class="sc-notoserifcjksc">有关实验方案的更多细节。</text><a href="https://arxiv.org/abs/2512.21907" rel="noopener"><rect x="485.90" y="181.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.21907" rel="noopener"><rect x="72.00" y="196.64" width="66.19" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/html/2602.09063v1" rel="noopener"><rect x="347.00" y="212.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/html/2602.09063v1" rel="noopener"><rect x="347.00" y="212.26" width="82.71" height="11.00" fill="transparent"/></a><a href="https://proteingym.org/" rel="noopener"><rect x="72.00" y="427.79" width="61.65" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="72.00" y="611.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="611.39" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.93 112.03 117.57" y="611.39" font-size="9.00" class="sc-lorabold">8.14.6.A]</text><text x="123.41" y="611.39" font-size="9.00" class="sc-notoserifcjkscbold">生命科学能力的评估结果。</text><text x="231.41" y="611.39" font-size="9.00" class="sc-notoserifcjksc">在六项生命科学基准测试上，</text><text x="348.41 354.70 357.15 361.74 367.11 372.49 377.37 379.74 384.84 390.10 395.57 401.03 405.85 409.33 411.70" y="611.39" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="418.97" y="611.39" font-size="9.00" class="sc-notoserifcjksc">较</text><text x="430.34 436.63 439.07 443.66 449.04 454.42 459.30 461.66 466.77 472.03 477.50 482.96 487.77 491.26 493.62 498.50 500.63" y="611.39" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="508.19" y="611.39" font-size="9.00" class="sc-notoserifcjksc">有所提</text><text x="72.00" y="623.09" font-size="9.00" class="sc-notoserifcjksc">升，平均表现接近</text><text x="146.37 152.66 155.11 159.70 165.07 170.45 175.33 177.70 184.84 190.21 195.59 199.76 202.12 207.00 209.21" y="623.09" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="214.27" y="623.09" font-size="9.00" class="sc-notoserifcjksc">，但低于</text><text x="252.64 258.93 261.38 265.97 271.34 276.72 281.60 283.97 292.10 296.89 300.38 305.77 311.03 315.20 317.57" y="623.09" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="322.47" y="623.09" font-size="9.00" class="sc-notoserifcjksc">。分数为各任务特定的</text><text x="414.84" y="623.09" font-size="9.00" class="sc-loraregular">0–1</text><text x="431.38" y="623.09" font-size="9.00" class="sc-notoserifcjksc">指标（越高越好）。成对面</text><text x="72.00" y="634.79" font-size="9.00" class="sc-notoserifcjksc">板显示每个模型在两个子基准测试上的结果（较浅色</text><text x="281.37" y="634.79" font-size="9.00" class="sc-loraregular">=</text><text x="288.50" y="634.79" font-size="9.00" class="sc-notoserifcjksc">第一种条件）。</text></svg></div>
