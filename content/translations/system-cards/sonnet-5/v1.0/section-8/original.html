<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p117.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 117 页"><text x="72.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="98.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">GKE</text><text x="111.51" y="98.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">集群</text><text x="133.51" y="98.82" font-size="11.00" class="sc-notoserifcjksc">上，以</text><text x="169.41" y="98.82" font-size="11.00" class="sc-loraregular">1×</text><text x="182.13" y="98.82" font-size="11.00" class="sc-notoserifcjksc">超时率和</text><text x="229.03" y="98.82" font-size="11.00" class="sc-loraregular">pod</text><text x="287.39" y="98.82" font-size="11.00" class="sc-loraregular">3×</text><text x="302.24" y="98.82" font-size="11.00" class="sc-notoserifcjksc">内存上限的设置，</text><text x="390.24 397.93 400.92 406.53 413.10 419.68 425.64 428.53 434.77 441.20 447.88 454.56 460.44 464.70 467.59" y="98.82" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="476.48" y="98.82" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="490.37" y="98.82" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="526.27" y="98.82" font-size="11.00" class="sc-notoserifcjksc">推</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">理强度下取得了</text><text x="151.89 158.08 164.73 167.44 173.40" y="114.44" font-size="11.00" class="sc-loraregular">80.4%</text><text x="185.86" y="114.44" font-size="11.00" class="sc-notoserifcjksc">的平均奖励，该结果为</text><text x="298.75 304.86" y="114.44" font-size="11.00" class="sc-loraregular">89</text><text x="314.11" y="114.44" font-size="11.00" class="sc-notoserifcjksc">个不同任务各尝试</text><text x="405.00" y="114.44" font-size="11.00" class="sc-loraregular">5</text><text x="413.89" y="114.44" font-size="11.00" class="sc-notoserifcjksc">次的平均值（共</text><text x="493.78" y="114.44" font-size="11.00" class="sc-loraregular">445</text><text x="514.60" y="114.44" font-size="11.00" class="sc-notoserifcjksc">次试</text><text x="72.00" y="130.06" font-size="11.00" class="sc-notoserifcjksc">验）。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="164.10" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="128.87" y="164.10" font-size="11.00" class="sc-notoserifcjksc">在同一评估和同一基础设施上、以</text><text x="296.76" y="164.10" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="326.06" y="164.10" font-size="11.00" class="sc-notoserifcjksc">推理强度取得了</text><text x="405.95 412.23 417.31" y="164.10" font-size="11.00" class="sc-loraregular">67%</text><text x="429.77" y="164.10" font-size="11.00" class="sc-notoserifcjksc">的得分。</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.97 108.93 113.69 121.38 127.81 134.39" y="240.95" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="140.35" y="237.28" font-size="6.60" class="sc-loraregular">20</text><text x="150.89" y="240.95" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="175.78 183.47 189.91 195.99 202.67 205.93 210.19 213.28 219.72" y="240.95" font-size="11.00" class="sc-loraregular">Cognition</text><text x="229.29" y="240.95" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="397.18" y="240.95" font-size="11.00" class="sc-loraregular">150</text><text x="416.90" y="240.95" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务源</text><text x="72.00" y="256.57" font-size="11.00" class="sc-notoserifcjksc">自开源代码仓库中的真实拉取请求（</text><text x="248.00 254.57 261.13 264.13 267.12 270.01 274.70 280.60 286.94 293.51 299.47 304.56" y="256.57" font-size="11.00" class="sc-loraregular">pull request</text><text x="308.82" y="256.57" font-size="11.00" class="sc-notoserifcjksc">），例如：修复</text><text x="388.71 395.54 401.41 405.66 412.25 418.69" y="256.57" font-size="11.00" class="sc-loraregular">Python</text><text x="428.26" y="256.57" font-size="11.00" class="sc-notoserifcjksc">框架</text><text x="453.15" y="256.57" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="502.25" y="256.57" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="72.00 80.68 86.64 93.04 98.14 104.57 110.42 116.25 122.14 126.40 129.29 135.69 142.26" y="272.19" font-size="11.00" class="sc-loraregular">websocket bug</text><text x="148.34" y="272.19" font-size="11.00" class="sc-notoserifcjksc">、加固</text><text x="184.23" y="272.19" font-size="11.00" class="sc-loraregular">Prisma</text><text x="222.25" y="272.19" font-size="11.00" class="sc-notoserifcjksc">的浏览器</text><text x="269.14" y="272.19" font-size="11.00" class="sc-loraregular">bundle</text><text x="304.32" y="272.19" font-size="11.00" class="sc-notoserifcjksc">，或扩展</text><text x="351.21 355.32 361.55 370.19 378.57 381.46 386.56 392.41 399.00 404.96 414.79" y="272.19" font-size="11.00" class="sc-loraregular">JSON schema</text><text x="423.36" y="272.19" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="437.26 440.25 443.34 449.92" y="272.19" font-size="11.00" class="sc-loraregular">lint</text><text x="457.07" y="272.19" font-size="11.00" class="sc-notoserifcjksc">规则。</text><text x="72.00" y="316.48" font-size="11.00" class="sc-notoserifcjksc">每个任务向智能体提供一个已检出的代码仓库和一条</text><text x="327.89" y="316.48" font-size="11.00" class="sc-loraregular">issue</text><text x="356.59" y="316.48" font-size="11.00" class="sc-notoserifcjksc">描述；随后智能体在容器化环境中自</text><text x="72.00" y="332.10" font-size="11.00" class="sc-notoserifcjksc">主工作，生成最终补丁，期间没有人工干预，也没有超时信息。补丁依据阻断性功能标准（主要</text><text x="72.00" y="347.72" font-size="11.00" class="sc-notoserifcjksc">是留出的单元测试）以及加权评分细则标准进行评分，其中包括针对所需测试覆盖率和禁止的实</text><text x="72.00" y="363.34" font-size="11.00" class="sc-notoserifcjksc">现模式的、由模型评分的检查项。任务由底层代码仓库的维护者编写，并由</text><text x="437.89 445.58 452.02 458.10 464.78 468.04 472.30 475.39 481.83" y="363.34" font-size="11.00" class="sc-loraregular">Cognition</text><text x="491.40" y="363.34" font-size="11.00" class="sc-notoserifcjksc">研究人员</text><text x="72.00" y="378.96" font-size="11.00" class="sc-notoserifcjksc">逐一审核，其中随机抽取的一部分经人工求解，以验证公平性。</text><a href="https://cognition.ai/blog/frontier-code" rel="noopener"><rect x="317.25" y="708.75" width="171.75" height="11.25" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="85.89" y="90.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="85.89" y="90.02" width="22.73" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="108.62" y="90.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="111.51" y="90.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="122.51" y="90.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="122.51" y="90.02" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

378.71" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="243.03" y="378.71" font-size="9.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="314.14" y="378.71" font-size="9.00" class="sc-notoserifcjksc">的分数来自</text><text x="361.50 369.77 374.35 377.83 383.22 388.85 392.69 397.57 403.03" y="378.71" font-size="9.00" class="sc-loraregular">MathArena</text><text x="410.04" y="378.71" font-size="9.00" class="sc-notoserifcjksc">排行榜。</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="458.27" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="147.92 151.32" y="454.60" font-size="6.60" class="sc-loraregular">24</text><text x="157.79" y="458.27" font-size="11.00" class="sc-notoserifcjksc">是一个长上下文智能体编程基准测试，包含</text><text x="369.68" y="458.27" font-size="11.00" class="sc-loraregular">200</text><text x="72.00" y="482.03" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获得由某个开源项目编译而成的二进制文件及该项目的文档，必须在</text><text x="72.00" y="497.65" font-size="11.00" class="sc-notoserifcjksc">无法访问互联网、不使用反编译工具的情况下，重建一个能复现原程序行为的代码库。任务范围</text><text x="72.00" y="513.27" font-size="11.00" class="sc-notoserifcjksc">从小型终端工具（</text><text x="160.00" y="513.27" font-size="11.00" class="sc-loraregular">jq</text><text x="169.21" y="513.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="180.21 184.97 188.06 194.63 200.71 205.40 211.36" y="513.27" font-size="11.00" class="sc-loraregular">ripgrep</text><text x="217.93" y="513.27" font-size="11.00" class="sc-notoserifcjksc">）到大型系统（</text><text x="294.93 300.95 306.87 316.71 323.27 329.23" y="513.27" font-size="11.00" class="sc-loraregular">FFmpeg</text><text x="335.32" y="513.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="346.32 352.55 361.21 367.57 370.84 375.09" y="513.27" font-size="11.00" class="sc-loraregular">SQLite</text><text x="381.06" y="513.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="392.06 398.67 407.25" y="513.27" font-size="11.00" class="sc-loraregular">PHP</text><text x="416.81" y="513.27" font-size="11.00" class="sc-notoserifcjksc">解释器）。提交结果依据</text><text x="302.51 308.17 314.13 318.72 321.33 328.16 334.99" y="528.89" font-size="11.00" class="sc-loraregular">247,000</text><text x="344.72" y="528.89" font-size="11.00" class="sc-notoserifcjksc">余个此类测试，均通过智能体驱动的模</text><text x="72.00" y="544.51" font-size="11.00" class="sc-notoserifcjksc">糊测试生成。</text><text x="72.00" y="595.37" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="595.37" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="595.37" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件本身在隐藏测试集上得分低于</text><text x="378.77 385.42 388.13" y="595.37" font-size="11.00" class="sc-loraregular">0.9</text><text x="397.38" y="595.37" font-size="11.00" class="sc-notoserifcjksc">的任务（这表明存在测试不稳</text><text x="72.00" y="610.99" font-size="11.00" class="sc-notoserifcjksc">定性），剩余</text><text x="140.89" y="610.99" font-size="11.00" class="sc-loraregular">166</text><text x="160.51" y="610.99" font-size="11.00" class="sc-notoserifcjksc">个任务；在这些任务中，我们只依据参考二进制文件能够通过的测试进行评</text><text x="72.00" y="626.61" font-size="11.00" class="sc-notoserifcjksc">分。我们报告</text><text x="140.89" y="626.61" font-size="11.00" class="sc-loraregular">5</text><text x="149.78" y="626.61" font-size="11.00" class="sc-notoserifcjksc">个回合的隐藏测试通过率，每个回合都在上一回合的代码库基础上继续，并拥有</text><text x="72.00" y="642.23" font-size="11.00" class="sc-notoserifcjksc">至多</text><text x="96.89" y="642.23" font-size="11.00" class="sc-loraregular">100</text><text x="117.45" y="642.23" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="131.35 135.60 142.04 147.87 153.83" y="642.23" font-size="11.00" class="sc-loraregular">token</text><text x="163.40" y="642.23" font-size="11.00" class="sc-notoserifcjksc">的全新上下文预算。在该任务集上，</text><text x="339.40 347.09 350.08 355.69 362.26 368.83 374.80 377.69 383.93 390.36 397.04 403.72 409.60 413.86 416.75" y="642.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="425.64" y="642.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="450.53" y="642.23" font-size="11.00" class="sc-loraregular">76–86%</text><text x="490.56" y="642.23" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.31 157.91" y="657.85" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="167.16" y="657.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="181.05 187.05 192.76 199.25 204.16 210.13" y="657.85" font-size="11.00" class="sc-loraregular">52–74%</text><text x="219.70" y="657.85" font-size="11.00" class="sc-notoserifcjksc">。作为参照，</text><text x="285.70 293.39 296.38 301.99 308.55 315.13 321.10 323.99 332.72 339.29 345.86 350.95 353.84 359.80 362.51" y="657.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="371.59" y="657.85" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="396.48" y="657.85" font-size="11.00" class="sc-loraregular">80–90%</text><text x="438.74" y="657.85" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="449.74 459.67 465.54 469.79 476.38 482.82 487.91 490.80" y="657.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.00" y="707.25" width="159.75" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="96.89" y="82.63" font-size="11.00" class="sc-loraregular">84–93%</text><text x="137.58" y="82.63" font-size="11.00" class="sc-notoserifcjksc">。我们认为</text><text x="195.48 202.14 206.83 213.26 219.35 224.03 229.71 239.48 246.32 252.28 258.96 264.81" y="82.63" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="274.29" y="82.63" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标：</text><text x="461.29 467.53 473.96 480.64 487.32 493.20 497.46 500.35" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="509.24" y="82.63" font-size="11.00" class="sc-notoserifcjksc">的各</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">回合覆盖了直至完整</text><text x="173.89" y="98.25" font-size="11.00" class="sc-loraregular">100</text><text x="194.45" y="98.25" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="208.35 212.60 219.04 224.87 230.83" y="98.25" font-size="11.00" class="sc-loraregular">token</text><text x="240.40" y="98.25" font-size="11.00" class="sc-notoserifcjksc">窗口的各种上下文长度，且这些任务考察的长上下文能力与实</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">际的下游用例高度契合。</text><text x="72.00" y="164.97" font-size="14.00" class="sc-poppinssemibold">8.9</text><text x="96.74" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00 80.37 86.94 96.77 102.45 109.12 112.39 116.67 122.48 124.19 129.29 132.18 138.78 144.46 149.55 153.81 156.70 163.54 169.37 175.05" y="229.97" font-size="11.00" class="sc-loraregular">Humanity’s Last Exam</text><text x="184.88" y="229.97" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="229.97" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="229.97" font-size="11.00" class="sc-notoserifcjksc">）是一个处于人类知识前沿的多模态基准测试，包含</text><text x="473.55 479.46 482.23 488.23 495.06" y="229.97" font-size="11.00" class="sc-loraregular">2,500</text><text x="504.79" y="229.97" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="245.59" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="278.55" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 240.42 246.86 253.53 260.21 266.10 270.35 273.25" y="278.55" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="279.24" y="278.55" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="301.24" y="278.55" font-size="11.00" class="sc-loraregular">1</text><text x="305.24" y="278.55" font-size="11.00" class="sc-notoserifcjksc">）纯推理（不用工具）；（</text><text x="437.24" y="278.55" font-size="11.00" class="sc-loraregular">2</text><text x="443.15" y="278.55" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜索、</text><text x="72.00" y="294.17" font-size="11.00" class="sc-notoserifcjksc">网页抓取、程序化工具调用和代码执行。在所有运行中，思考设置为</text><text x="404.89 410.50 417.07 421.33" y="294.17" font-size="11.00" class="sc-loraregular">auto</text><text x="427.76" y="294.17" font-size="11.00" class="sc-notoserifcjksc">，跨上下文使用的</text><text x="72.00 76.26 82.69 88.52 94.48" y="309.79" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="309.79" font-size="11.00" class="sc-notoserifcjksc">总量上限为</text><text x="161.95" y="309.79" font-size="11.00" class="sc-loraregular">100</text><text x="182.51" y="309.79" font-size="11.00" class="sc-notoserifcjksc">万。这些结果未使用上下文压缩。</text><text x="347.51 355.20 358.19 363.80 370.36 376.94 382.90 385.80 394.53 401.10 407.67 412.76 415.65 421.61 424.21" y="309.79" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="433.46" y="309.79" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="510.46" y="309.79" font-size="11.00" class="sc-loraregular">“</text><text x="514.86" y="309.79" font-size="11.00" class="sc-notoserifcjksc">无工</text><text x="72.00" y="325.41" font-size="11.00" class="sc-notoserifcjksc">具</text><text x="83.00" y="325.41" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="325.41" font-size="11.00" class="sc-notoserifcjksc">结果无法通过公开</text><text x="177.73 184.62 191.23" y="325.41" font-size="11.00" class="sc-loraregular">API</text><text x="197.81" y="325.41" font-size="11.00" class="sc-notoserifcjksc">复现，因为部分题目超出了其</text><text x="343.70" y="325.41" font-size="11.00" class="sc-loraregular">1</text><text x="350.60" y="325.41" font-size="11.00" class="sc-notoserifcjksc">小时的采样时限。</text><text x="72.00" y="391.89" font-size="11.00" class="sc-notoserifcjksc">为防止工具版本中的结果污染，我们为搜索器与抓取器屏蔽了已知讨论</text><text x="415.89" y="391.89" font-size="11.00" class="sc-loraregular">HLE</text><text x="440.57" y="391.89" font-size="11.00" class="sc-notoserifcjksc">的来源（见附录</text><text x="72.00 78.18 80.89" y="407.51" font-size="11.00" class="sc-loraregular">9.1</text><text x="84.89" y="407.51" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="164.79 172.47 175.47 181.08 187.64 194.22 200.18 203.08 211.81 218.38 224.94 230.04 232.93 238.89 241.49" y="407.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="250.74" y="407.51" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，标记任何看似从</text><text x="429.63" y="407.51" font-size="11.00" class="sc-loraregular">HLE</text><text x="454.31" y="407.51" font-size="11.00" class="sc-notoserifcjksc">专门来源中获取</text><text x="72.00" y="423.13" font-size="11.00" class="sc-notoserifcjksc">了答案的对话记录；经确认的情况将被重新判为错误。</text><text x="72.00" y="640.97" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="640.97" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 112.51 115.98 118.35 125.39 130.95 139.23 143.95 149.69 152.60 156.31 161.27 163.00 167.36 169.73 175.17 179.88 184.25 187.96 190.33 195.95 200.88 205.60" y="640.97" font-size="9.00" class="sc-lorabold">8.9.1.A] Humanity’s Last Exam</text><text x="216.24" y="640.97" font-size="9.00" class="sc-notoserifcjkscbold">准确率分数。</text><text x="270.24" y="640.97" font-size="9.00" class="sc-loraregular">Gemini</text><text x="302.90" y="640.97" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="314.27" y="640.97" font-size="9.00" class="sc-loraregular">GPT</text><text x="334.70" y="640.97" font-size="9.00" class="sc-notoserifcjksc">模型的分数取自已发布的结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 112.51" y="390.43" font-size="9.00" class="sc-lorabold">8.9.1.B]</text><text x="118.35" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下的</text><text x="210.72" y="390.43" font-size="9.00" class="sc-lorabold">HLE</text><text x="231.40" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="258.40" y="390.43" font-size="9.00" class="sc-notoserifcjksc">每个数据点代表每个模型在不同推理强度档位下的单次运行，</text><text x="501.40 504.88 510.15 514.92 519.80" y="390.43" font-size="9.00" class="sc-loraregular">token</text><text x="527.62" y="390.43" font-size="9.00" class="sc-notoserifcjksc">使</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">用总量至多</text><text x="119.37" y="402.13" font-size="9.00" class="sc-loraregular">100</text><text x="136.19" y="402.13" font-size="9.00" class="sc-notoserifcjksc">万。</text><text x="72.00 78.75 83.44 89.76 98.58 103.67 109.63 117.32 123.76 133.59" y="461.92" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="140.16" y="458.26" font-size="6.60" class="sc-loraregular">25</text><text x="150.19" y="461.92" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们运行</text><text x="461.08 468.77 471.76 477.37 483.94 490.52 496.48 499.37 505.61 512.05 518.72 525.40 531.29" y="461.92" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00" y="477.54" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="477.54" font-size="11.00" class="sc-notoserifcjksc">时使用了网络搜索、网页抓取、程序化工具调用和代码执行</text><text x="366.89" y="473.88" font-size="6.60" class="sc-loraregular">26</text><text x="374.25" y="477.54" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="385.25 391.48 397.92 404.60 411.27 417.16 421.42 424.31" y="477.54" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="433.20" y="477.54" font-size="11.00" class="sc-notoserifcjksc">在使用自适应思考、</text><text x="72.00" y="493.16" font-size="11.00" class="sc-loraregular">max</text><text x="96.23" y="493.16" font-size="11.00" class="sc-notoserifcjksc">推理强度、</text><text x="151.23" y="493.16" font-size="11.00" class="sc-loraregular">1000</text><text x="178.62" y="493.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="192.52 196.77 203.21 209.04 215.00" y="493.16" font-size="11.00" class="sc-loraregular">token</text><text x="224.57" y="493.16" font-size="11.00" class="sc-notoserifcjksc">上限的设置下得分</text><text x="315.46 321.65 327.61 329.96 335.03" y="493.16" font-size="11.00" class="sc-loraregular">84.7%</text><text x="344.60" y="493.16" font-size="11.00" class="sc-notoserifcjksc">。为突破</text><text x="391.50" y="493.16" font-size="11.00" class="sc-loraregular">100</text><text x="412.05" y="493.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="425.95 430.20 436.64 442.47 448.43" y="493.16" font-size="11.00" class="sc-loraregular">token</text><text x="458.00" y="493.16" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口，</text><text x="72.00" y="508.78" font-size="11.00" class="sc-notoserifcjksc">我们使用了上下文压缩，在</text><text x="206.89 212.80 219.63 226.46 232.37 235.26 239.52 245.95 251.78 257.75" y="508.78" font-size="11.00" class="sc-loraregular">200k token</text><text x="267.32" y="508.78" font-size="11.00" class="sc-notoserifcjksc">时触发。我们使用评估屏蔽列表来避免污染（见附录</text><text x="72.00 78.18 80.89" y="524.40" font-size="11.00" class="sc-loraregular">9.2</text><text x="86.79" y="524.40" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="575.27" font-size="11.00" class="sc-notoserifcjksc">在给定的任务成本下，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 226.53 232.96 239.64 246.32 252.20 256.46 259.35" y="575.27" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="268.24" y="575.27" font-size="11.00" class="sc-notoserifcjksc">的准确率与</text><text x="326.13 333.82 336.81 342.42 348.99 355.57 361.53 364.42 373.16 379.73 386.29 391.38 394.28 400.24 402.95" y="575.27" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="412.02" y="575.27" font-size="11.00" class="sc-notoserifcjksc">相当。</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">25</text><text x="81.12 90.68 96.10 98.91 101.43 104.06 107.58 110.04 112.56 115.19 120.54 124.41 127.04 132.20 134.92 137.38 140.01 143.06 148.43 154.57 159.94 165.39 168.44 170.90 173.53 179.67 183.93 189.68 197.69 202.32 207.74 214.73 220.58 229.52 235.49 237.99 240.62 246.88 249.51 254.14 256.95 265.89 271.86 274.58 280.00 282.63 287.81 293.16 297.03 299.66 304.98 310.97 316.13 318.85 321.57 326.99 333.06 338.83 341.64 347.71 353.24 355.87 361.69 367.11 373.18 378.50 384.49 393.43 398.59 402.88 408.25 410.88 414.21 420.06 424.39 427.02 432.84 437.10 442.85 450.86 455.49 458.30 464.37 469.90 472.53 477.69 483.17 488.59 494.57 498.44 503.07" y="691.01" font-size="10.00" class="sc-loraregular">Wei, J., et al. (2025). BrowseComp: A simple yet challenging benchmark for browsing agents.</text><text x="151.60 157.50 161.47 165.34 171.31 175.94 178.44 182.13 189.03 194.19 198.52 203.82 206.63 211.29 213.75 219.60 223.88 229.41 236.31 241.47 247.29 251.57 258.47 263.84 269.29 275.50 280.92 283.38 287.02 292.39 297.84 301.48" y="705.21" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2504.12516</text><text x="72.00" y="716.07" font-size="6.00" class="sc-loraregular">26</text><text x="81.32" y="719.41" font-size="10.00" class="sc-notoserifcjksc">关于通过公开</text><text x="143.95 153.06 158.48 163.11 167.74 172.90 178.38 183.80 188.43 191.06 197.32 203.33" y="719.41" font-size="10.00" class="sc-loraregular">Messages API</text><text x="209.31" y="719.41" font-size="10.00" class="sc-notoserifcjksc">的复现方法，请参见</text><text x="301.94 307.10 312.58 318.00 323.98 327.85 330.66 335.98 340.87 345.50 350.90 356.06 360.32 365.64 371.63 374.26 379.53 385.38 391.23 396.60 402.42 408.27 414.12" y="719.41" font-size="10.00" class="sc-loraregular" fill="#0000ff">agentic-search cookbook</text><text x="419.49" y="719.41" font-size="10.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="151.60" y="697.21" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="189.03" y="697.21" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="189.03" y="697.21" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="236.31" y="697.21" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="236.31" y="697.21" width="70.95" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="301.94" y="711.41" width="0.00" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="301.94" y="711.41" width="38.93" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="340.87" y="711.41" width="0.00" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="340.87" y="711.41" width="30.76" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="371.63" y="711.41" width="2.63" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="374.26" y="711.41" width="45.23" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="72.00" y="390.44" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.44" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.02 108.12 113.65 117.13 119.49 125.34 129.59 134.62 141.92 146.29 151.13 157.32 162.41 170.66" y="390.44" font-size="9.00" class="sc-lorabold">8.9.2.A] BrowseComp</text><text x="178.43" y="390.44" font-size="9.00" class="sc-notoserifcjkscbold">测试时计算扩展</text><text x="241.43" y="390.44" font-size="9.00" class="sc-notoserifcjksc">：</text><text x="250.43" y="390.44" font-size="9.00" class="sc-loraregular">max</text><text x="270.26" y="390.44" font-size="9.00" class="sc-notoserifcjksc">推理强度下改变</text><text x="335.63 339.11 344.38 349.15 354.02" y="390.44" font-size="9.00" class="sc-loraregular">token</text><text x="361.85" y="390.44" font-size="9.00" class="sc-notoserifcjksc">上限时的表现。</text><text x="72.00" y="426.77" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="426.77" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="453.34" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="453.34" font-size="11.00" class="sc-notoserifcjksc">在多模态推理上缩小了与</text><text x="282.13 289.82 292.81 298.42 304.99 311.57 317.53 320.42 329.16 335.73 342.29 347.38 350.28 356.24 358.95" y="453.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="368.02" y="453.34" font-size="11.00" class="sc-notoserifcjksc">的差距，相比</text><text x="436.91 444.60 447.60 453.21 459.77 466.35 472.31 475.21 481.44 487.88 494.55 501.23 507.12 511.37 514.27 520.23 522.82" y="453.34" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="72.00" y="468.96" font-size="11.00" class="sc-notoserifcjksc">的最大提升出现在图表理解（</text><text x="215.00 222.69 229.28 234.95 239.79 244.05 254.15 260.72 265.81 271.77 278.34" y="468.96" font-size="11.00" class="sc-loraregular">ChartMuseum</text><text x="291.07" y="468.96" font-size="11.00" class="sc-notoserifcjksc">不使用工具时</text><text x="359.96 365.58 369.58 376.24 378.94" y="468.96" font-size="11.00" class="sc-loraregular">+10.8</text><text x="388.02" y="468.96" font-size="11.00" class="sc-notoserifcjksc">个百分点）以及工具辅助设置</text><text x="72.00" y="484.58" font-size="11.00" class="sc-notoserifcjksc">中。我们报告五个基准测试，涵盖专业文档问答（</text><text x="314.00 322.37 330.46 336.20 338.90 345.47 352.05" y="484.58" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="355.77" y="484.58" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="377.77" y="484.58" font-size="11.00" class="sc-loraregular">GUI</text><text x="400.99" y="484.58" font-size="11.00" class="sc-notoserifcjksc">智能体（</text><text x="444.99 453.72 459.96 470.48 476.91 481.63 484.62 491.20" y="484.58" font-size="11.00" class="sc-loraregular">OSWorld-</text><text x="111.91" y="500.20" font-size="11.00" class="sc-notoserifcjksc">）、程序化</text><text x="169.80 177.38 184.27" y="500.20" font-size="11.00" class="sc-loraregular">CAD</text><text x="195.35" y="500.20" font-size="11.00" class="sc-notoserifcjksc">生成（</text><text x="228.35 235.20 241.16 247.84 253.69 260.14 267.72 274.61" y="500.20" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="282.80" y="500.20" font-size="11.00" class="sc-notoserifcjksc">）以及科学图表推理（</text><text x="392.80 400.49 407.08 412.76 417.60 421.85 431.95 438.52 443.61 449.57 456.14" y="500.20" font-size="11.00" class="sc-loraregular">ChartMuseum</text><text x="465.98" y="500.20" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="476.98 484.67 491.25 496.93 501.01 508.15 511.24" y="500.20" font-size="11.00" class="sc-loraregular">CharXiv</text><text x="72.00 78.83 84.77 90.45 95.54 101.98 108.65 111.74 118.42" y="515.82" font-size="11.00" class="sc-loraregular">Reasoning</text><text x="72.00" y="531.44" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 92.72 98.59 102.84 109.43 115.87" y="531.44" font-size="11.00" class="sc-loraregular">Python</text><text x="72.00 80.37 88.46 94.20 96.90 103.47 110.05" y="625.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">GDP.pdf</text><text x="116.66" y="625.30" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="130.55 136.72 143.29 148.00 154.03 159.99 162.88 169.77" y="625.30" font-size="11.00" class="sc-loraregular">Surge AI</text><text x="176.35" y="625.30" font-size="11.00" class="sc-notoserifcjksc">推出的专家级多模态推理基准测试，由</text><text x="366.24" y="625.30" font-size="11.00" class="sc-loraregular">100</text><text x="386.80" y="625.30" font-size="11.00" class="sc-notoserifcjksc">个真实世界提示词和</text><text x="488.69 495.30 503.39" y="625.30" font-size="11.00" class="sc-loraregular">PDF</text><text x="512.31" y="625.30" font-size="11.00" class="sc-notoserifcjksc">组</text><text x="72.00" y="640.92" font-size="11.00" class="sc-notoserifcjksc">成，直接取自金融、医疗健康、法律、工程和保险等十个领域的专业工作流程。该基准测试检验</text><a href="https://surgehq.ai/benchmarks/gdp-pdf" rel="noopener"><rect x="72.00" y="616.51" width="41.77" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="72.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">我们在内部运行框架上评估</text><text x="206.89 215.26 223.35 229.09 231.80 238.36 244.94" y="98.82" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="248.66" y="98.82" font-size="11.00" class="sc-notoserifcjksc">，分别使用和不使用工具。不使用工具评估时，模型获得</text><text x="72.00" y="114.44" font-size="11.00" class="sc-loraregular">base64</text><text x="110.35" y="114.44" font-size="11.00" class="sc-notoserifcjksc">编码的</text><text x="146.24 152.85 160.93" y="114.44" font-size="11.00" class="sc-loraregular">PDF</text><text x="166.96" y="114.44" font-size="11.00" class="sc-notoserifcjksc">，以匹配</text><text x="213.86 220.03 226.59 231.30 237.33" y="114.44" font-size="11.00" class="sc-loraregular">Surge</text><text x="246.19" y="114.44" font-size="11.00" class="sc-notoserifcjksc">的输入提示词。不过，与</text><text x="370.08 376.25 382.82 387.52 393.55" y="114.44" font-size="11.00" class="sc-loraregular">Surge</text><text x="402.41" y="114.44" font-size="11.00" class="sc-notoserifcjksc">不同，对于超出我们</text><text x="504.30 511.19 517.80" y="114.44" font-size="11.00" class="sc-loraregular">API</text><text x="72.00" y="130.06" font-size="11.00" class="sc-loraregular">32MB</text><text x="103.87" y="130.06" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="183.76 190.37 198.46" y="130.06" font-size="11.00" class="sc-loraregular">PDF</text><text x="204.48" y="130.06" font-size="11.00" class="sc-notoserifcjksc">，我们会将其截断（而非丢弃）。我们使用</text><text x="416.38 425.11 431.68 438.24 443.34 446.23 452.19 454.55" y="130.06" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="462.51" y="130.06" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="487.40" y="130.06" font-size="11.00" class="sc-loraregular">Gemini 3</text><text x="72.00" y="145.68" font-size="11.00" class="sc-loraregular">Flash</text><text x="101.27" y="145.68" font-size="11.00" class="sc-notoserifcjksc">作为评判模型。使用工具评估时，模型获得一个容器（其中装有该</text><text x="423.16 429.77 437.86" y="145.68" font-size="11.00" class="sc-loraregular">PDF</text><text x="446.78" y="145.68" font-size="11.00" class="sc-notoserifcjksc">文件和标准</text><text x="72.00 78.83 84.69 88.95 95.54 101.98" y="161.30" font-size="11.00" class="sc-loraregular">Python</text><text x="111.54" y="161.30" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工具。我们报告平均评分项通过率，即每项任务中满足的评分细则</text><text x="72.00" y="176.92" font-size="11.00" class="sc-notoserifcjksc">条件所占的比例，而非严格通过率。我们在全部</text><text x="305.89" y="176.92" font-size="11.00" class="sc-loraregular">100</text><text x="326.45" y="176.92" font-size="11.00" class="sc-notoserifcjksc">个提示词上评估模型，并对五次运行的分数</text><text x="72.00" y="192.54" font-size="11.00" class="sc-notoserifcjksc">取平均。</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 94.26 102.35 108.09 110.80 117.36 123.94" y="244.55" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="130.55" y="244.55" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="152.55 160.24 163.23 168.84 175.41 181.99 187.95 190.84 197.08 203.52 210.19 216.87 222.76 227.01 229.91" y="244.55" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="238.79" y="244.55" font-size="11.00" class="sc-notoserifcjksc">不使用工具时的平均评分项通过率为</text><text x="417.69 423.97 428.55 431.26 437.26" y="244.55" font-size="11.00" class="sc-loraregular">67.5%</text><text x="446.83" y="244.55" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00 78.18 82.19 84.78 91.14" y="260.17" font-size="11.00" class="sc-loraregular">81.6%</text><text x="100.71" y="260.17" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="111.71 117.95 124.38 131.06 137.74 143.62 147.88 150.77" y="260.17" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="159.66" y="260.17" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="184.55 192.24 195.23 200.84 207.41 213.99 219.95 222.84 229.08 235.52 242.19 248.87 254.75 259.01 261.90 267.87 270.46" y="260.17" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="276.82" y="260.17" font-size="11.00" class="sc-notoserifcjksc">，后者不使用工具时得分</text><text x="400.71" y="260.17" font-size="11.00" class="sc-loraregular">66.9%</text><text x="432.06" y="260.17" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00 77.07 83.25 85.85 92.21" y="275.79" font-size="11.00" class="sc-loraregular">78.6%</text><text x="101.78" y="275.79" font-size="11.00" class="sc-notoserifcjksc">。需要指出的是，我们未能复现</text><text x="258.67 264.84 271.41 276.12 282.14" y="275.79" font-size="11.00" class="sc-loraregular">Surge</text><text x="291.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">报告的数值，且平均评分项通过率和严格通过率均</text><text x="72.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">落后于</text><text x="107.89 114.06 120.63 125.34 131.37" y="291.41" font-size="11.00" class="sc-loraregular">Surge</text><text x="140.22" y="291.41" font-size="11.00" class="sc-notoserifcjksc">运行得到的结果。我们认为这些分数在方向上具有代表性，能够反映</text><text x="473.11 480.80 483.80 489.41 495.97 502.55" y="291.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="511.41" y="291.41" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="72.00" y="307.03" font-size="11.00" class="sc-notoserifcjksc">之间的性能差异。与此前</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 239.77 245.45 251.85 254.84 260.80 263.70" y="307.03" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="272.59" y="307.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="286.48 296.41 302.27 306.53 313.12 319.56 324.65 327.54" y="307.03" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="336.43" y="307.03" font-size="11.00" class="sc-notoserifcjksc">系统卡中的数值相比，我们将最大输出</text><text x="72.00 76.26 82.69 88.52 94.48" y="322.65" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="322.65" font-size="11.00" class="sc-notoserifcjksc">数提高到</text><text x="150.95" y="322.65" font-size="11.00" class="sc-loraregular">128k</text><text x="175.84" y="322.65" font-size="11.00" class="sc-notoserifcjksc">并据此更新了这些数值，这使性能略有提升。</text><text x="72.00" y="669.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="669.39" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 109.06 111.16 116.69 120.17 122.54 129.32 136.03 140.96 142.98 148.39 153.76" y="669.39" font-size="9.00" class="sc-lorabold">8.10.1.A] GDP.pdf</text><text x="159.44" y="669.39" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="186.44" y="669.39" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="269.81" y="669.39" font-size="9.00" class="sc-loraregular">max</text><text x="289.64" y="669.39" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="436.01 441.59 446.39 449.87 455.27 460.53" y="669.39" font-size="9.00" class="sc-loraregular">Python</text><text x="468.36" y="669.39" font-size="9.00" class="sc-notoserifcjksc">工具。平均评分项</text><text x="72.00" y="681.09" font-size="9.00" class="sc-notoserifcjksc">通过率分数为五次运行的平均值。图中显示</text><text x="245.37" y="681.09" font-size="9.00" class="sc-loraregular">95%</text><text x="265.67" y="681.09" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="391.24" y="681.09" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="400.24" y="681.09" font-size="9.00" class="sc-loraregular">CI</text><text x="409.55" y="681.09" font-size="9.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p126.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 126 页"><text x="72.00 80.73 86.97 97.49 103.92 108.64 111.63" y="110.82" font-size="11.00" class="sc-loraregular">OSWorld</text><text x="118.21" y="107.15" font-size="6.60" class="sc-loraregular">27</text><text x="127.69" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，评估智能体通过鼠标和键盘操作与一台运行中的</text><text x="482.58 490.86 497.26 503.82 510.40 514.66" y="110.82" font-size="11.00" class="sc-loraregular">Ubuntu</text><text x="524.12" y="110.82" font-size="11.00" class="sc-notoserifcjksc">虚</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">拟机交互、完成真实世界计算机任务（如编辑文档、浏览网页和管理文件）的能力。我们遵循默</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">认设置，分辨率为</text><text x="162.89" y="142.06" font-size="11.00" class="sc-loraregular">1080p</text><text x="193.31" y="142.06" font-size="11.00" class="sc-notoserifcjksc">，每个任务的操作步数上限为</text><text x="339.20" y="142.06" font-size="11.00" class="sc-loraregular">100</text><text x="356.87" y="142.06" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">我们调整了</text><text x="224.28" y="208.20" font-size="11.00" class="sc-notoserifcjksc">评估的运行方式，以更好地反映真实世界中的表现。如</text><text x="491.18 498.87 501.86 507.47 514.03 520.61" y="208.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="72.00" y="223.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.8</text><text x="119.60" y="223.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="152.60" y="223.82" font-size="11.00" class="sc-notoserifcjksc">中所述，这些调整包括修复一个影响批量动作的缩放工具</text><text x="430.49" y="223.82" font-size="11.00" class="sc-loraregular">bug</text><text x="449.54" y="223.82" font-size="11.00" class="sc-notoserifcjksc">，以及将每轮</text><text x="72.00 76.26 82.69 88.52 94.48" y="239.44" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="239.44" font-size="11.00" class="sc-notoserifcjksc">上限从</text><text x="139.95" y="239.44" font-size="11.00" class="sc-loraregular">16K</text><text x="160.71" y="239.44" font-size="11.00" class="sc-notoserifcjksc">提高到</text><text x="196.61" y="239.44" font-size="11.00" class="sc-loraregular">128K</text><text x="220.21" y="239.44" font-size="11.00" class="sc-notoserifcjksc">。随后我们在这些调整下重新评估了</text><text x="399.11 406.80 409.79 415.40 421.96 428.54 434.50 437.40 443.63 450.07 456.75 463.42 469.31 473.57 476.46 482.42 485.02" y="239.44" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="491.38" y="239.44" font-size="11.00" class="sc-notoserifcjksc">，发现我</text><text x="72.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">们此前一直低报了它在</text><text x="184.89 193.63 199.86 210.38 216.82 221.53 224.53" y="255.06" font-size="11.00" class="sc-loraregular">OSWorld</text><text x="234.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">上的表现。我们在下文报告其表现。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="305.35" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="305.35" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="172.13 180.87 187.10 197.62 204.05 208.77 211.77" y="305.35" font-size="11.00" class="sc-loraregular">OSWorld</text><text x="221.24" y="305.35" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="257.13" y="305.35" font-size="11.00" class="sc-loraregular">81.2%</text><text x="285.50" y="305.35" font-size="11.00" class="sc-notoserifcjksc">（首次尝试成功率，五次运行的平均值）。</text><text x="72.00" y="608.12" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.21 112.30 117.84" y="608.12" font-size="9.00" class="sc-lorabold">8.10.2.A]</text><text x="123.68" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">各模型在</text><text x="162.04" y="608.12" font-size="9.00" class="sc-lorabold">max</text><text x="182.34" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">推理强度下的外部</text><text x="335.48" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="362.48 368.77 371.21 375.80 381.18 386.56" y="608.12" font-size="9.00" class="sc-loraregular">Claude</text><text x="393.80" y="608.12" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="498.03" y="608.12" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="507.03" y="608.12" font-size="9.00" class="sc-loraregular">361</text><text x="522.89" y="608.12" font-size="9.00" class="sc-notoserifcjksc">个任</text><text x="72.00" y="619.82" font-size="9.00" class="sc-notoserifcjksc">务，</text><text x="90.00" y="619.82" font-size="9.00" class="sc-loraregular">100</text><text x="106.82" y="619.82" font-size="9.00" class="sc-notoserifcjksc">步）上以自适应思考和</text><text x="199.19" y="619.82" font-size="9.00" class="sc-loraregular">max</text><text x="219.01" y="619.82" font-size="9.00" class="sc-notoserifcjksc">推理强度进行评估。分数为五次运行平均的</text><text x="392.38" y="619.82" font-size="9.00" class="sc-loraregular">pass@1</text><text x="421.17" y="619.82" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="430.17" y="619.82" font-size="9.00" class="sc-loraregular">Gemini</text><text x="462.83" y="619.82" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="474.20" y="619.82" font-size="9.00" class="sc-loraregular">GPT</text><text x="494.63" y="619.82" font-size="9.00" class="sc-notoserifcjksc">模型的分数</text><text x="72.00" y="631.52" font-size="9.00" class="sc-notoserifcjksc">取自已发布的结果。</text><a href="https://arxiv.org/abs/2404.07972" rel="noopener"><rect x="270.75" y="707.25" width="156.75" height="12.75" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="199.40" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="199.40" width="35.40" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="526.58" y="199.40" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="72.00" y="215.02" width="26.96" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="98.96" y="215.02" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="101.85" y="215.02" width="14.85" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="116.70" y="215.02" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="119.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="215.02" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="141.60" y="215.02" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="141.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="72.00 78.84 84.80 91.48 97.33 103.79 111.37 118.26" y="111.01" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="129.34" y="111.01" font-size="11.00" class="sc-notoserifcjksc">是一个程序化</text><text x="198.24 205.82 212.70" y="111.01" font-size="11.00" class="sc-loraregular">CAD</text><text x="223.79" y="111.01" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="314.68 318.69 323.27 326.05 332.40 339.23" y="111.01" font-size="11.00" class="sc-loraregular">17,900</text><text x="348.97" y="111.01" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="428.86 436.55 442.23 448.68 457.44 464.01 469.97 474.92" y="111.01" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="483.62" y="111.01" font-size="11.00" class="sc-notoserifcjksc">程序构建而</text><text x="72.00" y="126.63" font-size="11.00" class="sc-notoserifcjksc">成，涵盖</text><text x="118.89" y="126.63" font-size="11.00" class="sc-loraregular">106</text><text x="138.98" y="126.63" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="328.87" y="126.63" font-size="11.00" class="sc-loraregular">ISO</text><text x="347.53" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="358.53 366.61 370.30" y="126.63" font-size="11.00" class="sc-loraregular">DIN</text><text x="378.68" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="389.68" y="126.63" font-size="11.00" class="sc-loraregular">EN</text><text x="404.90" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="415.90" y="126.63" font-size="11.00" class="sc-loraregular">ASME</text><text x="448.86" y="126.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="462.75" y="126.63" font-size="11.00" class="sc-loraregular">IEC</text><text x="483.86" y="126.63" font-size="11.00" class="sc-notoserifcjksc">规格表为依</text><text x="72.00" y="142.25" font-size="11.00" class="sc-notoserifcjksc">据。该基准测试将</text><text x="162.89 170.47 177.36" y="142.25" font-size="11.00" class="sc-loraregular">CAD</text><text x="188.45" y="142.25" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务，我们报告</text><text x="400.34 407.36 410.45 415.54 418.63 425.07 431.74 437.65 445.34 451.78 458.35" y="142.25" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="467.21" y="142.25" font-size="11.00" class="sc-notoserifcjksc">任务的结果，</text><text x="72.00" y="157.87" font-size="11.00" class="sc-notoserifcjksc">该任务要求模型根据多视图渲染图生成</text><text x="261.89 269.58 275.26 281.72 290.47 297.04 303.00 307.95" y="157.87" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="316.65" y="157.87" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="194.11" font-size="11.00" class="sc-notoserifcjksc">我们内部实现的</text><text x="151.89 158.74 164.70 171.37 177.23 183.68 191.26 198.15" y="194.11" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="209.24" y="194.11" font-size="11.00" class="sc-notoserifcjksc">与参考实现一致，仅有若干细微修改，包括以下几项。第一，我们修</text><text x="72.00" y="209.73" font-size="11.00" class="sc-notoserifcjksc">正了参考系统提示词（</text><text x="182.00 187.09 192.90 197.99 202.25 208.21 218.05 220.94 227.51 232.19 238.63 248.46 255.03" y="209.73" font-size="11.00" class="sc-loraregular">system prompt</text><text x="259.29" y="209.73" font-size="11.00" class="sc-notoserifcjksc">）中的一处笔误，该笔误将提供给模型的渲染视图中左上</text><text x="534.29" y="209.73" font-size="11.00" class="sc-loraregular">/</text><text x="72.00" y="225.35" font-size="11.00" class="sc-notoserifcjksc">右上以及左下</text><text x="138.00" y="225.35" font-size="11.00" class="sc-loraregular">/</text><text x="445.48 456.00 462.43 467.15 473.06 479.63 482.62 488.30 494.97" y="225.35" font-size="11.00" class="sc-loraregular">Workplane</text><text x="503.83" y="225.35" font-size="11.00" class="sc-notoserifcjksc">外也接</text><text x="72.00" y="240.97" font-size="11.00" class="sc-notoserifcjksc">受原始形状。第三，我们略去了</text><text x="228.89" y="240.97" font-size="11.00" class="sc-loraregular">26</text><text x="244.05" y="240.97" font-size="11.00" class="sc-notoserifcjksc">条其</text><text x="268.94 276.63 282.31 288.77 297.52 304.09 310.05 315.00" y="240.97" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="323.70" y="240.97" font-size="11.00" class="sc-notoserifcjksc">代码未能生成</text><text x="392.60" y="240.97" font-size="11.00" class="sc-loraregular">STEP</text><text x="422.27" y="240.97" font-size="11.00" class="sc-notoserifcjksc">文件的记录。系统提示</text><text x="72.00" y="256.59" font-size="11.00" class="sc-notoserifcjksc">词的修正和评分方式的更改此后均已合并到参考代码仓库中。</text><text x="72.00" y="293.41" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 151.77 157.45 163.85 166.84 172.80 175.70" y="293.41" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="184.58" y="293.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="198.48 208.41 214.27 218.53 225.12 231.56 236.65 239.54" y="293.41" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="248.43" y="293.41" font-size="11.00" class="sc-notoserifcjksc">系统卡中错误地表述为结果同时反映了系统提示词的更改和</text><text x="72.00" y="309.03" font-size="11.00" class="sc-notoserifcjksc">评分方式的更改。此后我们已对该系统卡发布更正，说明这些分数仅反映了系统提示词的更改，</text><text x="72.00" y="324.65" font-size="11.00" class="sc-notoserifcjksc">而未反映评分方式的更改。本节报告的分数是首次在两项更改均已生效的情况下计算得出的。我</text><text x="72.00" y="340.27" font-size="11.00" class="sc-notoserifcjksc">们注意到，评分方式的更改并未对分数产生实质性影响。</text><text x="72.00" y="376.51" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.91 118.00 123.10 126.19 132.62 139.30 145.21 152.89 159.33 165.91" y="376.51" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="174.76" y="376.51" font-size="11.00" class="sc-notoserifcjksc">文件的一个子集上进行了消融实验，分别使用和不使用工具。使用</text><text x="496.65 503.49 509.35 513.61 520.19 526.63" y="376.51" font-size="11.00" class="sc-loraregular">Python</text><text x="72.00" y="392.13" font-size="11.00" class="sc-notoserifcjksc">工具评估时，模型获得一个容器（其中装有图像文件和标准</text><text x="360.89 367.72 373.59 377.84 384.43 390.87" y="392.13" font-size="11.00" class="sc-loraregular">Python</text><text x="400.44" y="392.13" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工</text><text x="72.00" y="407.75" font-size="11.00" class="sc-notoserifcjksc">具。我们从全部</text><text x="151.89 155.90 160.48 163.26 169.44 174.35" y="407.75" font-size="11.00" class="sc-loraregular">17,874</text><text x="183.22" y="407.75" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="197.11 204.13 207.22 212.32 215.41 221.84 228.52 234.43 242.12 248.55 255.13" y="407.75" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="263.98" y="407.75" font-size="11.00" class="sc-notoserifcjksc">文件中随机抽取</text><text x="343.88 347.88 350.49 357.32 364.15" y="407.75" font-size="11.00" class="sc-loraregular">1,000</text><text x="373.88" y="407.75" font-size="11.00" class="sc-notoserifcjksc">个作为子集评估模型，并计算五次</text><text x="72.00" y="423.37" font-size="11.00" class="sc-notoserifcjksc">运行的平均体素</text><text x="151.89 155.34 161.55" y="423.37" font-size="11.00" class="sc-loraregular">IoU</text><text x="169.82" y="423.37" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="180.82 186.32 192.70 198.48 204.44 207.43 210.33 213.77 219.98" y="423.37" font-size="11.00" class="sc-loraregular">voxel IoU</text><text x="228.26" y="423.37" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="459.61" font-size="11.00" class="sc-notoserifcjksc">在该子集上，</text><text x="138.00 144.24 150.67 157.35 164.03 169.91 174.17 177.06" y="459.61" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="185.95" y="459.61" font-size="11.00" class="sc-notoserifcjksc">不使用工具时的体素</text><text x="287.84 291.29 297.50" y="459.61" font-size="11.00" class="sc-loraregular">IoU</text><text x="308.67" y="459.61" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="322.56 329.21 331.92 337.83 344.18" y="459.61" font-size="11.00" class="sc-loraregular">0.266</text><text x="350.54" y="459.61" font-size="11.00" class="sc-notoserifcjksc">，使用工具时为</text><text x="430.44 437.09 439.80 445.66 450.73" y="459.61" font-size="11.00" class="sc-loraregular">0.373</text><text x="456.86" y="459.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="467.86 475.55 478.54 484.15 490.71 497.29" y="459.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="475.23" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="128.87" y="475.23" font-size="11.00" class="sc-notoserifcjksc">在相同设置下分别得分</text><text x="241.76 248.42 251.12 257.03 263.31" y="475.23" font-size="11.00" class="sc-loraregular">0.267</text><text x="271.28" y="475.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="285.17 291.82 294.53 300.66 306.56" y="475.23" font-size="11.00" class="sc-loraregular">0.327</text><text x="454.14 460.38 466.81 473.49 480.17 486.05 490.31 493.20" y="475.23" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="502.09" y="475.23" font-size="11.00" class="sc-notoserifcjksc">实际上</text><text x="72.00" y="490.85" font-size="11.00" class="sc-notoserifcjksc">持平，但在使用工具时落后</text><text x="206.89 213.55 216.09 222.92 228.88" y="490.85" font-size="11.00" class="sc-loraregular">0.046</text><text x="235.24" y="490.85" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.45 112.55 118.08 121.55 123.92 129.87 134.71 140.45 145.12 150.59 156.72 162.73 169.56 171.93 178.07 181.01 185.37 188.32 193.41 199.15 203.95 210.14 215.24 220.60" y="367.00" font-size="9.00" class="sc-lorabold">8.10.3.A] BenchCAD Vision2Code</text><text x="227.81" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">子集分数。</text><text x="272.81" y="367.00" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="356.17" y="367.00" font-size="9.00" class="sc-loraregular">max</text><text x="376.00" y="367.00" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="72.00 77.59 82.39 85.87 91.26 96.53" y="378.70" font-size="9.00" class="sc-loraregular">Python</text><text x="104.35" y="378.70" font-size="9.00" class="sc-notoserifcjksc">工具。分数为五次运行的平均值。图中显示</text><text x="277.72" y="378.70" font-size="9.00" class="sc-loraregular">95%</text><text x="298.03" y="378.70" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 79.69 86.28 91.95 96.79 101.05 111.15 117.72 122.81 128.77 135.34" y="438.49" font-size="11.00" class="sc-loraregular">ChartMuseum</text><text x="148.07" y="438.49" font-size="11.00" class="sc-notoserifcjksc">是一个图表问答基准测试，包含</text><text x="304.96 308.96 311.73 315.74 322.10" y="438.49" font-size="11.00" class="sc-loraregular">1,162</text><text x="330.91" y="438.49" font-size="11.00" class="sc-notoserifcjksc">道由专家标注的问题，针对取自</text><text x="487.80" y="438.49" font-size="11.00" class="sc-loraregular">184</text><text x="506.84" y="438.49" font-size="11.00" class="sc-notoserifcjksc">个来源</text><text x="72.00" y="454.11" font-size="11.00" class="sc-notoserifcjksc">的真实世界图表图像，包括学术图表、信息图和非常规的图表设计。该基准测试专门针对需要视</text><text x="72.00" y="551.83" font-size="11.00" class="sc-notoserifcjksc">我们内部实现的</text><text x="151.89 159.58 166.17 171.85 176.69 180.94 191.04 197.61 202.70 208.66 215.23" y="551.83" font-size="11.00" class="sc-loraregular">ChartMuseum</text><text x="227.96" y="551.83" font-size="11.00" class="sc-notoserifcjksc">与官方</text><text x="263.85 271.54 278.13 283.80 288.65 292.90 303.00 309.57 314.66 320.62 327.19" y="551.83" font-size="11.00" class="sc-loraregular">ChartMuseum</text><text x="339.92" y="551.83" font-size="11.00" class="sc-notoserifcjksc">代码仓库中的学生与教师提示词一致。不</text><text x="72.00" y="567.45" font-size="11.00" class="sc-notoserifcjksc">过，我们使用</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 185.42 191.86 198.53 205.21 211.10 215.35 218.25 224.21 226.80" y="567.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="236.05" y="567.45" font-size="11.00" class="sc-notoserifcjksc">作为评分者，而非</text><text x="326.95 335.32 341.98 348.32 353.70 359.66 362.37 366.24 371.62 381.45 384.54 391.22" y="567.45" font-size="11.00" class="sc-loraregular">GPT-4.1-mini</text><text x="394.31" y="567.45" font-size="11.00" class="sc-notoserifcjksc">。在所有运行中，模型均配置</text><text x="72.00" y="583.07" font-size="11.00" class="sc-notoserifcjksc">为开启自适应思考和</text><text x="173.89" y="583.07" font-size="11.00" class="sc-loraregular">max</text><text x="198.13" y="583.07" font-size="11.00" class="sc-notoserifcjksc">推理强度，分别使用和不使用</text><text x="344.02 350.85 356.71 360.97 367.56 373.99" y="583.07" font-size="11.00" class="sc-loraregular">Python</text><text x="383.56" y="583.07" font-size="11.00" class="sc-notoserifcjksc">工具。使用</text><text x="441.46 448.29 454.15 458.41 465.00 471.43" y="583.07" font-size="11.00" class="sc-loraregular">Python</text><text x="481.00" y="583.07" font-size="11.00" class="sc-notoserifcjksc">工具评估</text><text x="72.00" y="598.69" font-size="11.00" class="sc-notoserifcjksc">时，模型获得一个容器（其中装有图像文件和标准</text><text x="316.89 323.72 329.59 333.84 340.43 346.87" y="598.69" font-size="11.00" class="sc-loraregular">Python</text><text x="356.44" y="598.69" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工具。我们在</text><text x="72.00" y="614.31" font-size="11.00" class="sc-notoserifcjksc">测试集上评估模型，并对五次运行的分数取平均。</text><text x="72.00" y="681.37" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 100.17 105.85 110.69 114.94 125.04 131.61 136.70 142.66 149.23" y="681.37" font-size="11.00" class="sc-loraregular">ChartMuseum</text><text x="161.96" y="681.37" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="183.96 191.65 194.64 200.25 206.82 213.39 219.36 222.25 228.49 234.92 241.60 248.28 254.16 258.42 261.31" y="681.37" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="270.20" y="681.37" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="361.09 366.16 372.82 375.52 379.53" y="681.37" font-size="11.00" class="sc-loraregular">70.1%</text><text x="389.10" y="681.37" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="479.99 486.17 492.53 494.88 499.96" y="681.37" font-size="11.00" class="sc-loraregular">86.7%</text><text x="509.53" y="681.37" font-size="11.00" class="sc-notoserifcjksc">，优</text><text x="72.00" y="696.99" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 130.42 136.86 143.53 150.21 156.10 160.35 163.24 169.21 171.80" y="696.99" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="178.16" y="696.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="189.16 195.16 201.34 204.04 210.17" y="696.99" font-size="11.00" class="sc-loraregular">59.3%</text><text x="222.63" y="696.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="236.53 242.71 249.36 252.07 258.43" y="696.99" font-size="11.00" class="sc-loraregular">80.9%</text><text x="268.00" y="696.99" font-size="11.00" class="sc-notoserifcjksc">），但落后于</text><text x="336.89 344.58 347.57 353.18 359.75 366.33 372.29 375.18 383.92 390.48 397.05 402.14 405.04 411.00 413.70" y="696.99" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="419.89" y="696.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="430.89" y="696.99" font-size="11.00" class="sc-loraregular">75.8%</text><text x="463.30" y="696.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="477.20 483.30 489.48 491.84 496.91" y="696.99" font-size="11.00" class="sc-loraregular">89.7%</text><text x="506.48" y="696.99" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>

xt x="442.91" y="439.42" font-size="11.00" class="sc-notoserifcjksc">论文的真实世界图</text><text x="72.00" y="455.04" font-size="11.00" class="sc-notoserifcjksc">表构建而成，涵盖八个主要科学学科。该基准测试检验模型能否综合复杂科学图表中的视觉信</text><text x="72.00" y="470.66" font-size="11.00" class="sc-notoserifcjksc">息，以回答需要多步推理的问题。</text><text x="72.00" y="520.38" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均配置为开启自适应思考和</text><text x="305.89" y="520.38" font-size="11.00" class="sc-loraregular">max</text><text x="330.13" y="520.38" font-size="11.00" class="sc-notoserifcjksc">推理强度，分别使用和不使用</text><text x="476.02 482.85 488.71 492.97 499.56 505.99" y="520.38" font-size="11.00" class="sc-loraregular">Python</text><text x="515.56" y="520.38" font-size="11.00" class="sc-notoserifcjksc">工</text><text x="72.00" y="536.00" font-size="11.00" class="sc-notoserifcjksc">具。使用</text><text x="118.89 125.72 131.59 135.84 142.43 148.87" y="536.00" font-size="11.00" class="sc-loraregular">Python</text><text x="158.44" y="536.00" font-size="11.00" class="sc-notoserifcjksc">工具评估时，模型获得一个容器（其中装有图像文件和标准</text><text x="447.33 454.16 460.02 464.28 470.87 477.31" y="536.00" font-size="11.00" class="sc-loraregular">Python</text><text x="486.88" y="536.00" font-size="11.00" class="sc-notoserifcjksc">库）以及</text><text x="72.00" y="551.62" font-size="11.00" class="sc-notoserifcjksc">一个图像裁剪工具。评分所用的提示词与参考实现相同。不过，我们使用</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 471.42 477.86 484.53 491.21 497.10 501.35 504.24 510.21 512.80" y="551.62" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="522.05" y="551.62" font-size="11.00" class="sc-notoserifcjksc">而</text><text x="72.00" y="567.24" font-size="11.00" class="sc-notoserifcjksc">非</text><text x="85.89 94.26 100.93 107.27 112.65 118.61" y="567.24" font-size="11.00" class="sc-loraregular">GPT-4o</text><text x="127.93" y="567.24" font-size="11.00" class="sc-notoserifcjksc">作为评分模型。我们在验证集的</text><text x="284.83 288.83 291.44 298.27 305.10" y="567.24" font-size="11.00" class="sc-loraregular">1,000</text><text x="314.84" y="567.24" font-size="11.00" class="sc-notoserifcjksc">道题目上评估模型，并对五次运行的分数取平</text><text x="72.00" y="582.86" font-size="11.00" class="sc-notoserifcjksc">均。</text><text x="72.00" y="649.92" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 100.17 105.85 109.93 117.07 120.16 125.71 128.61 135.44 141.38 147.05 152.15 158.58 165.26 168.35 175.03" y="649.92" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="184.00" y="649.92" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="206.00 213.69 216.68 222.29 228.86 235.44 241.40 244.29 250.53 256.96 263.64 270.32 276.20 280.46 283.35" y="649.92" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="292.24" y="649.92" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="383.14 388.21 392.79 395.33 402.17" y="649.92" font-size="11.00" class="sc-loraregular">77.0%</text><text x="411.74" y="649.92" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00" y="665.54" font-size="11.00" class="sc-loraregular">88.3%</text><text x="102.77" y="665.54" font-size="11.00" class="sc-notoserifcjksc">，优于</text><text x="138.66 146.35 149.34 154.95 161.52 168.10 174.06 176.95 183.19 189.62 196.30 202.98 208.86 213.12 216.01 221.97 224.57" y="665.54" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="230.93" y="665.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="241.93 247.00 251.00 253.60 259.96" y="665.54" font-size="11.00" class="sc-loraregular">71.6%</text><text x="272.42" y="665.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="286.31" y="665.54" font-size="11.00" class="sc-loraregular">85.3%</text><text x="316.89" y="665.54" font-size="11.00" class="sc-notoserifcjksc">），略微落后于</text><text x="396.79 404.48 407.47 413.08 419.64 426.22 432.18 435.08 443.81 450.38 456.94 462.04 464.93 470.89 473.60" y="665.54" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="479.78" y="665.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="490.78 496.96 503.62 506.32 512.32" y="665.54" font-size="11.00" class="sc-loraregular">80.5%</text><text x="524.78" y="665.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.11 84.29 86.99 93.35" y="681.16" font-size="11.00" class="sc-loraregular">89.9%</text><text x="102.92" y="681.16" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
