7" y="689.61" font-size="11.00" class="sc-notoserifcjksc">个前沿模型组</text><text x="72.00" y="705.23" font-size="11.00" class="sc-notoserifcjksc">成的评审小组依据既定的评分细则进行评判（我们</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p120.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 120 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">使用了</text><text x="107.89" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="181.33" y="82.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="192.33" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="278.28" y="82.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="292.18" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">所给分数中的最低分。</text><text x="72.00" y="131.20" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="131.20" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="183.13" y="131.20" font-size="11.00" class="sc-loraregular sc-k">79.5%</text><text x="212.66" y="131.20" font-size="11.00" class="sc-notoserifcjksc">，为每道题</text><text x="270.55" y="131.20" font-size="11.00" class="sc-loraregular">10</text><text x="284.28" y="131.20" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均值。我们使用</text><text x="419.17" y="131.20" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="444.68" y="131.20" font-size="11.00" class="sc-notoserifcjksc">推理强度，</text><text x="499.68" y="131.20" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="72.00" y="146.82" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="107.89" y="146.82" font-size="11.00" class="sc-loraregular">300k</text><text x="133.59" y="146.82" font-size="11.00" class="sc-notoserifcjksc">；更高的推理强度设置有时会超出</text><text x="301.48" y="146.82" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="333.54" y="146.82" font-size="11.00" class="sc-notoserifcjksc">上限。在类似设置下，</text><text x="443.54" y="146.82" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="500.41" y="146.82" font-size="11.00" class="sc-notoserifcjksc">在同一</text><text x="72.00" y="162.44" font-size="11.00" class="sc-notoserifcjksc">评估中得分</text><text x="129.89" y="162.44" font-size="11.00" class="sc-loraregular sc-k">55.0%</text><text x="160.82" y="162.44" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="171.82" y="162.44" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="219.42" y="162.44" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="244.32" y="162.44" font-size="11.00" class="sc-loraregular sc-k">96.7%</text><text x="274.03" y="162.44" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="285.03" y="162.44" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="334.98" y="162.44" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="359.87" y="162.44" font-size="11.00" class="sc-loraregular sc-k">99.8%</text><text x="390.87" y="162.44" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="240.12" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="127.98" y="240.12" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87" y="240.12" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="212.20" y="240.12" font-size="11.00" class="sc-notoserifcjksc">维护的研究级数学最终答案型基准。题目每月从近期</text><text x="468.09" y="240.12" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="496.52" y="240.12" font-size="11.00" class="sc-notoserifcjksc">论文摘要</text><text x="72.00" y="255.74" font-size="11.00" class="sc-notoserifcjksc">中提取，再经过自动和人工检查筛选，以确保其自成一体、非平凡且可验证。由于题目取自活跃</text><text x="72.00" y="271.36" font-size="11.00" class="sc-notoserifcjksc">的研究，该基准比竞赛</text><text x="184.89" y="271.36" font-size="11.00" class="sc-loraregular">/</text><text x="195.38" y="271.36" font-size="11.00" class="sc-notoserifcjksc">奥赛类基准更贴近现实，与数学研究的联系也更紧密。</text><text x="72.00" y="353.23" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="353.23" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="146.71" y="353.23" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="160.60" y="353.23" font-size="11.00" class="sc-loraregular">4</text><text x="169.46" y="353.23" font-size="11.00" class="sc-notoserifcjksc">月和</text><text x="194.35" y="353.23" font-size="11.00" class="sc-loraregular">5</text><text x="203.24" y="353.23" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="214.24" y="349.57" font-size="6.60" class="sc-loraregular">22</text><text x="221.33" y="353.23" font-size="11.00" class="sc-notoserifcjksc">发布的题目（共</text><text x="301.22" y="353.23" font-size="11.00" class="sc-loraregular">81</text><text x="314.30" y="353.23" font-size="11.00" class="sc-notoserifcjksc">道）进行评估，选择这两期是为了避免与</text><text x="72.00" y="368.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="368.85" font-size="11.00" class="sc-notoserifcjksc">的训练数据发生污染。</text><text x="229.95" y="368.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="277.90" y="368.85" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="368.79" y="368.85" font-size="11.00" class="sc-loraregular sc-k">65.7%</text><text x="398.14" y="368.85" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="489.03" y="368.85" font-size="11.00" class="sc-loraregular">72.2%</text><text x="518.19" y="368.85" font-size="11.00" class="sc-notoserifcjksc">，两</text><text x="72.00" y="384.47" font-size="11.00" class="sc-notoserifcjksc">者均开启扩展思考（</text><text x="171.00" y="384.47" font-size="11.00" class="sc-loraregular sc-k">extended thinking</text><text x="263.96" y="384.47" font-size="11.00" class="sc-notoserifcjksc">），并为每道题四次尝试的平均值。</text><text x="439.96" y="380.81" font-size="6.60" class="sc-loraregular sc-k">23</text><text x="72.00" y="674.87" font-size="6.00" class="sc-loraregular">22</text><text x="78.44" y="678.21" font-size="10.00" class="sc-notoserifcjksc">截至撰写本文时，</text><text x="158.44" y="678.21" font-size="10.00" class="sc-loraregular sc-k">MathArena</text><text x="212.37" y="678.21" font-size="10.00" class="sc-notoserifcjksc">在</text><text x="225.00" y="678.21" font-size="10.00" class="sc-loraregular sc-k">Hugging Face</text><text x="290.48" y="678.21" font-size="10.00" class="sc-notoserifcjksc">上的</text><text x="313.11" y="678.21" font-size="10.00" class="sc-loraregular sc-k">ArXivMath</text><text x="364.00" y="678.21" font-size="10.00" class="sc-notoserifcjksc">数据集中列出</text><text x="426.63" y="678.21" font-size="10.00" class="sc-loraregular">4</text><text x="434.68" y="678.21" font-size="10.00" class="sc-notoserifcjksc">月</text><text x="447.31" y="678.21" font-size="10.00" class="sc-loraregular">41</text><text x="459.00" y="678.21" font-size="10.00" class="sc-notoserifcjksc">道题、</text><text x="489.00" y="678.21" font-size="10.00" class="sc-loraregular">5</text><text x="497.08" y="678.21" font-size="10.00" class="sc-notoserifcjksc">月</text><text x="509.71" y="678.21" font-size="10.00" class="sc-loraregular">40</text><text x="523.97" y="678.21" font-size="10.00" class="sc-notoserifcjksc">道</text><text x="72.00" y="692.41" font-size="10.00" class="sc-notoserifcjksc">题，这些分数即在该处报告。</text><text x="72.00" y="703.27" font-size="6.00" class="sc-loraregular sc-k">23</text><text x="81.10" y="706.61" font-size="10.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="148.19" y="706.61" font-size="10.00" class="sc-notoserifcjksc">、</text><text x="158.19" y="706.61" font-size="10.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="198.50" y="706.61" font-size="10.00" class="sc-notoserifcjksc">和</text><text x="211.13" y="706.61" font-size="10.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="290.14" y="706.61" font-size="10.00" class="sc-notoserifcjksc">的分数取自</text><text x="342.77" y="706.61" font-size="10.00" class="sc-loraregular sc-k">MathArena</text><text x="396.70" y="706.61" font-size="10.00" class="sc-notoserifcjksc">排行榜上相同期次的结果。</text><text x="72.00" y="720.81" font-size="10.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="150.08" y="720.81" font-size="10.00" class="sc-notoserifcjksc">和</text><text x="162.71" y="720.81" font-size="10.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="241.11" y="720.81" font-size="10.00" class="sc-notoserifcjksc">的分数为内部评估结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="72.00" y="367.01" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.01" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 93.82 97.48 99.58 105.11 108.58 110.95 116.92 121.24 126.17 129.05 133.61 142.28 146.96 150.68" y="367.01" font-size="9.00" class="sc-lorabold">8.7.A] ArxivMath</text><text x="156.27" y="367.01" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="165.27" y="367.01" font-size="9.00" class="sc-lorabold">4</text><text x="172.56" y="367.01" font-size="9.00" class="sc-notoserifcjkscbold">月和</text><text x="192.92" y="367.01" font-size="9.00" class="sc-lorabold">5</text><text x="200.15" y="367.01" font-size="9.00" class="sc-notoserifcjkscbold">月）准确率分数。</text><text x="272.15" y="367.01" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="342.42" y="367.01" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="353.79" y="367.01" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="424.35" y="367.01" font-size="9.00" class="sc-notoserifcjksc">在开启扩展思考的情况下进</text><text x="72.00" y="378.71" font-size="9.00" class="sc-notoserifcjksc">行内部评估；</text><text x="126.00" y="378.71" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="186.38" y="378.71" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="195.38" y="378.71" font-size="9.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="231.66" y="378.71" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="243.03" y="378.71" font-size="9.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="314.14" y="378.71" font-size="9.00" class="sc-notoserifcjksc">的分数来自</text><text x="361.50" y="378.71" font-size="9.00" class="sc-loraregular sc-k">MathArena</text><text x="410.04" y="378.71" font-size="9.00" class="sc-notoserifcjksc">排行榜。</text><text x="72.00" y="458.27" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="147.92" y="454.60" font-size="6.60" class="sc-loraregular sc-k">24</text><text x="157.79" y="458.27" font-size="11.00" class="sc-notoserifcjksc">是一个长上下文智能体编程基准测试，包含</text><text x="369.68" y="458.27" font-size="11.00" class="sc-loraregular">200</text><text x="72.00" y="482.03" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获得由某个开源项目编译而成的二进制文件及该项目的文档，必须在</text><text x="72.00" y="497.65" font-size="11.00" class="sc-notoserifcjksc">无法访问互联网、不使用反编译工具的情况下，重建一个能复现原程序行为的代码库。任务范围</text><text x="72.00" y="513.27" font-size="11.00" class="sc-notoserifcjksc">从小型终端工具（</text><text x="160.00" y="513.27" font-size="11.00" class="sc-loraregular">jq</text><text x="169.21" y="513.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="180.21" y="513.27" font-size="11.00" class="sc-loraregular sc-k">ripgrep</text><text x="217.93" y="513.27" font-size="11.00" class="sc-notoserifcjksc">）到大型系统（</text><text x="294.93" y="513.27" font-size="11.00" class="sc-loraregular sc-k">FFmpeg</text><text x="335.32" y="513.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="346.32" y="513.27" font-size="11.00" class="sc-loraregular sc-k">SQLite</text><text x="381.06" y="513.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="392.06" y="513.27" font-size="11.00" class="sc-loraregular sc-k">PHP</text><text x="416.81" y="513.27" font-size="11.00" class="sc-notoserifcjksc">解释器）。提交结果依据</text><text x="302.51 308.17 314.13 318.72 321.33 328.16 334.99" y="528.89" font-size="11.00" class="sc-loraregular">247,000</text><text x="344.72" y="528.89" font-size="11.00" class="sc-notoserifcjksc">余个此类测试，均通过智能体驱动的模</text><text x="72.00" y="544.51" font-size="11.00" class="sc-notoserifcjksc">糊测试生成。</text><text x="72.00" y="595.37" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="595.37" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="595.37" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件本身在隐藏测试集上得分低于</text><text x="378.77" y="595.37" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="397.38" y="595.37" font-size="11.00" class="sc-notoserifcjksc">的任务（这表明存在测试不稳</text><text x="72.00" y="610.99" font-size="11.00" class="sc-notoserifcjksc">定性），剩余</text><text x="140.89" y="610.99" font-size="11.00" class="sc-loraregular">166</text><text x="160.51" y="610.99" font-size="11.00" class="sc-notoserifcjksc">个任务；在这些任务中，我们只依据参考二进制文件能够通过的测试进行评</text><text x="72.00" y="626.61" font-size="11.00" class="sc-notoserifcjksc">分。我们报告</text><text x="140.89" y="626.61" font-size="11.00" class="sc-loraregular">5</text><text x="149.78" y="626.61" font-size="11.00" class="sc-notoserifcjksc">个回合的隐藏测试通过率，每个回合都在上一回合的代码库基础上继续，并拥有</text><text x="72.00" y="642.23" font-size="11.00" class="sc-notoserifcjksc">至多</text><text x="96.89" y="642.23" font-size="11.00" class="sc-loraregular">100</text><text x="117.45" y="642.23" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="131.35" y="642.23" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="163.40" y="642.23" font-size="11.00" class="sc-notoserifcjksc">的全新上下文预算。在该任务集上，</text><text x="339.40" y="642.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="425.64" y="642.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="450.53" y="642.23" font-size="11.00" class="sc-loraregular">76–86%</text><text x="490.56" y="642.23" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="72.00" y="657.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="167.16" y="657.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="181.05 187.05 192.76 199.25 204.16 210.13" y="657.85" font-size="11.00" class="sc-loraregular">52–74%</text><text x="219.70" y="657.85" font-size="11.00" class="sc-notoserifcjksc">。作为参照，</text><text x="285.70" y="657.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="371.59" y="657.85" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="396.48" y="657.85" font-size="11.00" class="sc-loraregular">80–90%</text><text x="438.74" y="657.85" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="449.74" y="657.85" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.00" y="707.25" width="159.75" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="96.89" y="82.63" font-size="11.00" class="sc-loraregular">84–93%</text><text x="137.58" y="82.63" font-size="11.00" class="sc-notoserifcjksc">。我们认为</text><text x="195.48" y="82.63" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="274.29" y="82.63" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标：</text><text x="461.29" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="509.24" y="82.63" font-size="11.00" class="sc-notoserifcjksc">的各</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">回合覆盖了直至完整</text><text x="173.89" y="98.25" font-size="11.00" class="sc-loraregular">100</text><text x="194.45" y="98.25" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="208.35" y="98.25" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="240.40" y="98.25" font-size="11.00" class="sc-notoserifcjksc">窗口的各种上下文长度，且这些任务考察的长上下文能力与实</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">际的下游用例高度契合。</text><text x="72.00" y="164.97" font-size="14.00" class="sc-poppinssemibold">8.9</text><text x="96.74" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00" y="229.97" font-size="11.00" class="sc-loraregular sc-k">Humanity’s Last Exam</text><text x="184.88" y="229.97" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="229.97" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="229.97" font-size="11.00" class="sc-notoserifcjksc">）是一个处于人类知识前沿的多模态基准测试，包含</text><text x="473.55 479.46 482.23 488.23 495.06" y="229.97" font-size="11.00" class="sc-loraregular">2,500</text><text x="504.79" y="229.97" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="245.59" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="278.55" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89" y="278.55" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="279.24" y="278.55" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="301.24" y="278.55" font-size="11.00" class="sc-loraregular">1</text><text x="305.24" y="278.55" font-size="11.00" class="sc-notoserifcjksc">）纯推理（不用工具）；（</text><text x="437.24" y="278.55" font-size="11.00" class="sc-loraregular">2</text><text x="443.15" y="278.55" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜索、</text><text x="72.00" y="294.17" font-size="11.00" class="sc-notoserifcjksc">网页抓取、程序化工具调用和代码执行。在所有运行中，思考设置为</text><text x="404.89" y="294.17" font-size="11.00" class="sc-loraregular sc-k">auto</text><text x="427.76" y="294.17" font-size="11.00" class="sc-notoserifcjksc">，跨上下文使用的</text><text x="72.00" y="309.79" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="309.79" font-size="11.00" class="sc-notoserifcjksc">总量上限为</text><text x="161.95" y="309.79" font-size="11.00" class="sc-loraregular">100</text><text x="182.51" y="309.79" font-size="11.00" class="sc-notoserifcjksc">万。这些结果未使用上下文压缩。</text><text x="347.51" y="309.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="433.46" y="309.79" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="510.46" y="309.79" font-size="11.00" class="sc-loraregular">“</text><text x="514.86" y="309.79" font-size="11.00" class="sc-notoserifcjksc">无工</text><text x="72.00" y="325.41" font-size="11.00" class="sc-notoserifcjksc">具</text><text x="83.00" y="325.41" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="325.41" font-size="11.00" class="sc-notoserifcjksc">结果无法通过公开</text><text x="177.73" y="325.41" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="197.81" y="325.41" font-size="11.00" class="sc-notoserifcjksc">复现，因为部分题目超出了其</text><text x="343.70" y="325.41" font-size="11.00" class="sc-loraregular">1</text><text x="350.60" y="325.41" font-size="11.00" class="sc-notoserifcjksc">小时的采样时限。</text><text x="72.00" y="391.89" font-size="11.00" class="sc-notoserifcjksc">为防止工具版本中的结果污染，我们为搜索器与抓取器屏蔽了已知讨论</text><text x="415.89" y="391.89" font-size="11.00" class="sc-loraregular">HLE</text><text x="440.57" y="391.89" font-size="11.00" class="sc-notoserifcjksc">的来源（见附录</text><text x="72.00" y="407.51" font-size="11.00" class="sc-loraregular sc-k">9.1</text><text x="84.89" y="407.51" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="164.79" y="407.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="250.74" y="407.51" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，标记任何看似从</text><text x="429.63" y="407.51" font-size="11.00" class="sc-loraregular">HLE</text><text x="454.31" y="407.51" font-size="11.00" class="sc-notoserifcjksc">专门来源中获取</text><text x="72.00" y="423.13" font-size="11.00" class="sc-notoserifcjksc">了答案的对话记录；经确认的情况将被重新判为错误。</text><text x="72.00" y="640.97" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="640.97" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 112.51 115.98 118.35 125.39 130.95 139.23 143.95 149.69 152.60 156.31 161.27 163.00 167.36 169.73 175.17 179.88 184.25 187.96 190.33 195.95 200.88 205.60" y="640.97" font-size="9.00" class="sc-lorabold">8.9.1.A] Humanity’s Last Exam</text><text x="216.24" y="640.97" font-size="9.00" class="sc-notoserifcjkscbold">准确率分数。</text><text x="270.24" y="640.97" font-size="9.00" class="sc-loraregular">Gemini</text><text x="302.90" y="640.97" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="314.27" y="640.97" font-size="9.00" class="sc-loraregular">GPT</text><text x="334.70" y="640.97" font-size="9.00" class="sc-notoserifcjksc">模型的分数取自已发布的结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="390.43" font-size="9.00" class="sc-lorabold sc-k">8.9.1.B]</text><text x="118.35" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下的</text><text x="210.72" y="390.43" font-size="9.00" class="sc-lorabold">HLE</text><text x="231.40" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="258.40" y="390.43" font-size="9.00" class="sc-notoserifcjksc">每个数据点代表每个模型在不同推理强度档位下的单次运行，</text><text x="501.40" y="390.43" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="527.62" y="390.43" font-size="9.00" class="sc-notoserifcjksc">使</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">用总量至多</text><text x="119.37" y="402.13" font-size="9.00" class="sc-loraregular">100</text><text x="136.19" y="402.13" font-size="9.00" class="sc-notoserifcjksc">万。</text><text x="72.00" y="461.92" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="140.16" y="458.26" font-size="6.60" class="sc-loraregular">25</text><text x="150.19" y="461.92" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们运行</text><text x="461.08" y="461.92" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="477.54" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="477.54" font-size="11.00" class="sc-notoserifcjksc">时使用了网络搜索、网页抓取、程序化工具调用和代码执行</text><text x="366.89" y="473.88" font-size="6.60" class="sc-loraregular">26</text><text x="374.25" y="477.54" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="385.25" y="477.54" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="433.20" y="477.54" font-size="11.00" class="sc-notoserifcjksc">在使用自适应思考、</text><text x="72.00" y="493.16" font-size="11.00" class="sc-loraregular">max</text><text x="96.23" y="493.16" font-size="11.00" class="sc-notoserifcjksc">推理强度、</text><text x="151.23" y="493.16" font-size="11.00" class="sc-loraregular">1000</text><text x="178.62" y="493.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="192.52" y="493.16" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="224.57" y="493.16" font-size="11.00" class="sc-notoserifcjksc">上限的设置下得分</text><text x="315.46" y="493.16" font-size="11.00" class="sc-loraregular sc-k">84.7%</text><text x="344.60" y="493.16" font-size="11.00" class="sc-notoserifcjksc">。为突破</text><text x="391.50" y="493.16" font-size="11.00" class="sc-loraregular">100</text><text x="412.05" y="493.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="425.95" y="493.16" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="458.00" y="493.16" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口，</text><text x="72.00" y="508.78" font-size="11.00" class="sc-notoserifcjksc">我们使用了上下文压缩，在</text><text x="206.89" y="508.78" font-size="11.00" class="sc-loraregular sc-k">200k token</text><text x="267.32" y="508.78" font-size="11.00" class="sc-notoserifcjksc">时触发。我们使用评估屏蔽列表来避免污染（见附录</text><text x="72.00" y="524.40" font-size="11.00" class="sc-loraregular sc-k">9.2</text><text x="86.79" y="524.40" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="575.27" font-size="11.00" class="sc-notoserifcjksc">在给定的任务成本下，</text><text x="182.00" y="575.27" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="268.24" y="575.27" font-size="11.00" class="sc-notoserifcjksc">的准确率与</text><text x="326.13" y="575.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="412.02" y="575.27" font-size="11.00" class="sc-notoserifcjksc">相当。</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">25</text><text x="81.12 90.68 96.10 98.91 101.43 104.06 107.58 110.04 112.56 115.19 120.54 124.41 127.04 132.20 134.92 137.38 140.01 143.06 148.43 154.57 159.94 165.39 168.44 170.90 173.53 179.67 183.93 189.68 197.69 202.32 207.74 214.73 220.58 229.52 235.49 237.99 240.62 246.88 249.51 254.14 256.95 265.89 271.86 274.58 280.00 282.63 287.81 293.16 297.03 299.66 304.98 310.97 316.13 318.85 321.57 326.99 333.06 338.83 341.64 347.71 353.24 355.87 361.69 367.11 373.18 378.50 384.49 393.43 398.59 402.88 408.25 410.88 414.21 420.06 424.39 427.02 432.84 437.10 442.85 450.86 455.49 458.30 464.37 469.90 472.53 477.69 483.17 488.59 494.57 498.44 503.07" y="691.01" font-size="10.00" class="sc-loraregular">Wei, J., et al. (2025). BrowseComp: A simple yet challenging benchmark for browsing agents.</text><text x="151.60 157.50 161.47 165.34 171.31 175.94 178.44 182.13 189.03 194.19 198.52 203.82 206.63 211.29 213.75 219.60 223.88 229.41 236.31 241.47 247.29 251.57 258.47 263.84 269.29 275.50 280.92 283.38 287.02 292.39 297.84 301.48" y="705.21" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2504.12516</text><text x="72.00" y="716.07" font-size="6.00" class="sc-loraregular">26</text><text x="81.32" y="719.41" font-size="10.00" class="sc-notoserifcjksc">关于通过公开</text><text x="143.95" y="719.41" font-size="10.00" class="sc-loraregular sc-k">Messages API</text><text x="209.31" y="719.41" font-size="10.00" class="sc-notoserifcjksc">的复现方法，请参见</text><text x="301.94" y="719.41" font-size="10.00" class="sc-loraregular sc-k" fill="#0000ff">agentic-search cookbook</text><text x="419.49" y="719.41" font-size="10.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="151.60" y="697.21" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="189.03" y="697.21" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="189.03" y="697.21" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="236.31" y="697.21" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="236.31" y="697.21" width="70.95" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="301.94" y="711.41" width="0.00" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="301.94" y="711.41" width="38.93" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="340.87" y="711.41" width="0.00" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="340.87" y="711.41" width="30.76" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="371.63" y="711.41" width="2.63" height="10.00" fill="transparent"/></a><a href="https://platform.claude.com/cookbook/evals-agentic-search-reproduce-agentic-search-benchmarks" rel="noopener"><rect x="374.26" y="711.41" width="45.23" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="72.00" y="390.44" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.44" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.02 108.12 113.65 117.13 119.49 125.34 129.59 134.62 141.92 146.29 151.13 157.32 162.41 170.66" y="390.44" font-size="9.00" class="sc-lorabold">8.9.2.A] BrowseComp</text><text x="178.43" y="390.44" font-size="9.00" class="sc-notoserifcjkscbold">测试时计算扩展</text><text x="241.43" y="390.44" font-size="9.00" class="sc-notoserifcjksc">：</text><text x="250.43" y="390.44" font-size="9.00" class="sc-loraregular">max</text><text x="270.26" y="390.44" font-size="9.00" class="sc-notoserifcjksc">推理强度下改变</text><text x="335.63" y="390.44" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="361.85" y="390.44" font-size="9.00" class="sc-notoserifcjksc">上限时的表现。</text><text x="72.00" y="426.77" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="426.77" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="453.34" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="453.34" font-size="11.00" class="sc-notoserifcjksc">在多模态推理上缩小了与</text><text x="282.13" y="453.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="368.02" y="453.34" font-size="11.00" class="sc-notoserifcjksc">的差距，相比</text><text x="436.91" y="453.34" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="72.00" y="468.96" font-size="11.00" class="sc-notoserifcjksc">的最大提升出现在图表理解（</text><text x="215.00" y="468.96" font-size="11.00" class="sc-loraregular sc-k">ChartMuseum</text><text x="291.07" y="468.96" font-size="11.00" class="sc-notoserifcjksc">不使用工具时</text><text x="359.96" y="468.96" font-size="11.00" class="sc-loraregular sc-k">+10.8</text><text x="388.02" y="468.96" font-size="11.00" class="sc-notoserifcjksc">个百分点）以及工具辅助设置</text><text x="72.00" y="484.58" font-size="11.00" class="sc-notoserifcjksc">中。我们报告五个基准测试，涵盖专业文档问答（</text><text x="314.00" y="484.58" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="355.77" y="484.58" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="377.77" y="484.58" font-size="11.00" class="sc-loraregular">GUI</text><text x="400.99" y="484.58" font-size="11.00" class="sc-notoserifcjksc">智能体（</text><text x="444.99" y="484.58" font-size="11.00" class="sc-loraregular sc-k">OSWorld-</text><text x="111.91" y="500.20" font-size="11.00" class="sc-notoserifcjksc">）、程序化</text><text x="169.80" y="500.20" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="195.35" y="500.20" font-size="11.00" class="sc-notoserifcjksc">生成（</text><text x="228.35" y="500.20" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="282.80" y="500.20" font-size="11.00" class="sc-notoserifcjksc">）以及科学图表推理（</text><text x="392.80" y="500.20" font-size="11.00" class="sc-loraregular sc-k">ChartMuseum</text><text x="465.98" y="500.20" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="476.98" y="500.20" font-size="11.00" class="sc-loraregular sc-k">CharXiv</text><text x="72.00" y="515.82" font-size="11.00" class="sc-loraregular sc-k">Reasoning</text><text x="72.00" y="531.44" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="531.44" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="72.00" y="625.30" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GDP.pdf</text><text x="116.66" y="625.30" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="130.55" y="625.30" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="176.35" y="625.30" font-size="11.00" class="sc-notoserifcjksc">推出的专家级多模态推理基准测试，由</text><text x="366.24" y="625.30" font-size="11.00" class="sc-loraregular">100</text><text x="386.80" y="625.30" font-size="11.00" class="sc-notoserifcjksc">个真实世界提示词和</text><text x="488.69" y="625.30" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="512.31" y="625.30" font-size="11.00" class="sc-notoserifcjksc">组</text><text x="72.00" y="640.92" font-size="11.00" class="sc-notoserifcjksc">成，直接取自金融、医疗健康、法律、工程和保险等十个领域的专业工作流程。该基准测试检验</text><a href="https://surgehq.ai/benchmarks/gdp-pdf" rel="noopener"><rect x="72.00" y="616.51" width="41.77" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="72.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">我们在内部运行框架上评估</text><text x="206.89" y="98.82" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="248.66" y="98.82" font-size="11.00" class="sc-notoserifcjksc">，分别使用和不使用工具。不使用工具评估时，模型获得</text><text x="72.00" y="114.44" font-size="11.00" class="sc-loraregular">base64</text><text x="110.35" y="114.44" font-size="11.00" class="sc-notoserifcjksc">编码的</text><text x="146.24" y="114.44" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="166.96" y="114.44" font-size="11.00" class="sc-notoserifcjksc">，以匹配</text><text x="213.86" y="114.44" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="246.19" y="114.44" font-size="11.00" class="sc-notoserifcjksc">的输入提示词。不过，与</text><text x="370.08" y="114.44" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="402.41" y="114.44" font-size="11.00" class="sc-notoserifcjksc">不同，对于超出我们</text><text x="504.30" y="114.44" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="72.00" y="130.06" font-size="11.00" class="sc-loraregular">32MB</text><text x="103.87" y="130.06" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="183.76" y="130.06" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="204.48" y="130.06" font-size="11.00" class="sc-notoserifcjksc">，我们会将其截断（而非丢弃）。我们使用</text><text x="416.38" y="130.06" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="462.51" y="130.06" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="487.40" y="130.06" font-size="11.00" class="sc-loraregular">Gemini 3</text><text x="72.00" y="145.68" font-size="11.00" class="sc-loraregular">Flash</text><text x="101.27" y="145.68" font-size="11.00" class="sc-notoserifcjksc">作为评判模型。使用工具评估时，模型获得一个容器（其中装有该</text><text x="423.16" y="145.68" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="446.78" y="145.68" font-size="11.00" class="sc-notoserifcjksc">文件和标准</text><text x="72.00" y="161.30" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="111.54" y="161.30" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工具。我们报告平均评分项通过率，即每项任务中满足的评分细则</text><text x="72.00" y="176.92" font-size="11.00" class="sc-notoserifcjksc">条件所占的比例，而非严格通过率。我们在全部</text><text x="305.89" y="176.92" font-size="11.00" class="sc-loraregular">100</text><text x="326.45" y="176.92" font-size="11.00" class="sc-notoserifcjksc">个提示词上评估模型，并对五次运行的分数</text><text x="72.00" y="192.54" font-size="11.00" class="sc-notoserifcjksc">取平均。</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="244.55" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="130.55" y="244.55" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="152.55" y="244.55" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="238.79" y="244.55" font-size="11.00" class="sc-notoserifcjksc">不使用工具时的平均评分项通过率为</text><text x="417.69" y="244.55" font-size="11.00" class="sc-loraregular sc-k">67.5%</text><text x="446.83" y="244.55" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00" y="260.17" font-size="11.00" class="sc-loraregular sc-k">81.6%</text><text x="100.71" y="260.17" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="111.71" y="260.17" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="159.66" y="260.17" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="184.55" y="260.17" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="276.82" y="260.17" font-size="11.00" class="sc-notoserifcjksc">，后者不使用工具时得分</text><text x="400.71" y="260.17" font-size="11.00" class="sc-loraregular">66.9%</text><text x="432.06" y="260.17" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00" y="275.79" font-size="11.00" class="sc-loraregular sc-k">78.6%</text><text x="101.78" y="275.79" font-size="11.00" class="sc-notoserifcjksc">。需要指出的是，我们未能复现</text><text x="258.67" y="275.79" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="291.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">报告的数值，且平均评分项通过率和严格通过率均</text><text x="72.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">落后于</text><text x="107.89" y="291.41" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="140.22" y="291.41" font-size="11.00" class="sc-notoserifcjksc">运行得到的结果。我们认为这些分数在方向上具有代表性，能够反映</text><text x="473.11" y="291.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="511.41" y="291.41" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="72.00" y="307.03" font-size="11.00" class="sc-notoserifcjksc">之间的性能差异。与此前</text><text x="195.89" y="307.03" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="272.59" y="307.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="286.48" y="307.03" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="336.43" y="307.03" font-size="11.00" class="sc-notoserifcjksc">系统卡中的数值相比，我们将最大输出</text><text x="72.00" y="322.65" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="322.65" font-size="11.00" class="sc-notoserifcjksc">数提高到</text><text x="150.95" y="322.65" font-size="11.00" class="sc-loraregular">128k</text><text x="175.84" y="322.65" font-size="11.00" class="sc-notoserifcjksc">并据此更新了这些数值，这使性能略有提升。</text><text x="72.00" y="669.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="669.39" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 109.06 111.16 116.69 120.17 122.54 129.32 136.03 140.96 142.98 148.39 153.76" y="669.39" font-size="9.00" class="sc-lorabold">8.10.1.A] GDP.pdf</text><text x="159.44" y="669.39" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="186.44" y="669.39" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="269.81" y="669.39" font-size="9.00" class="sc-loraregular">max</text><text x="289.64" y="669.39" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="436.01" y="669.39" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="468.36" y="669.39" font-size="9.00" class="sc-notoserifcjksc">工具。平均评分项</text><text x="72.00" y="681.09" font-size="9.00" class="sc-notoserifcjksc">通过率分数为五次运行的平均值。图中显示</text><text x="245.37" y="681.09" font-size="9.00" class="sc-loraregular">95%</text><text x="265.67" y="681.09" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="391.24" y="681.09" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="400.24" y="681.09" font-size="9.00" class="sc-loraregular">CI</text><text x="409.55" y="681.09" font-size="9.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p126.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 126 页"><text x="72.00" y="110.82" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="118.21" y="107.15" font-size="6.60" class="sc-loraregular">27</text><text x="127.69" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，评估智能体通过鼠标和键盘操作与一台运行中的</text><text x="482.58" y="110.82" font-size="11.00" class="sc-loraregular sc-k">Ubuntu</text><text x="524.12" y="110.82" font-size="11.00" class="sc-notoserifcjksc">虚</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">拟机交互、完成真实世界计算机任务（如编辑文档、浏览网页和管理文件）的能力。我们遵循默</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">认设置，分辨率为</text><text x="162.89" y="142.06" font-size="11.00" class="sc-loraregular">1080p</text><text x="193.31" y="142.06" font-size="11.00" class="sc-notoserifcjksc">，每个任务的操作步数上限为</text><text x="339.20" y="142.06" font-size="11.00" class="sc-loraregular">100</text><text x="356.87" y="142.06" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">我们调整了</text><text x="224.28" y="208.20" font-size="11.00" class="sc-notoserifcjksc">评估的运行方式，以更好地反映真实世界中的表现。如</text><text x="491.18" y="208.20" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="72.00" y="223.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.8</text><text x="119.60" y="223.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="152.60" y="223.82" font-size="11.00" class="sc-notoserifcjksc">中所述，这些调整包括修复一个影响批量动作的缩放工具</text><text x="430.49" y="223.82" font-size="11.00" class="sc-loraregular">bug</text><text x="449.54" y="223.82" font-size="11.00" class="sc-notoserifcjksc">，以及将每轮</text><text x="72.00" y="239.44" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="239.44" font-size="11.00" class="sc-notoserifcjksc">上限从</text><text x="139.95" y="239.44" font-size="11.00" class="sc-loraregular">16K</text><text x="160.71" y="239.44" font-size="11.00" class="sc-notoserifcjksc">提高到</text><text x="196.61" y="239.44" font-size="11.00" class="sc-loraregular">128K</text><text x="220.21" y="239.44" font-size="11.00" class="sc-notoserifcjksc">。随后我们在这些调整下重新评估了</text><text x="399.11" y="239.44" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="491.38" y="239.44" font-size="11.00" class="sc-notoserifcjksc">，发现我</text><text x="72.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">们此前一直低报了它在</text><text x="184.89" y="255.06" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="234.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">上的表现。我们在下文报告其表现。</text><text x="72.00" y="305.35" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="305.35" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="172.13" y="305.35" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="221.24" y="305.35" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="257.13" y="305.35" font-size="11.00" class="sc-loraregular">81.2%</text><text x="285.50" y="305.35" font-size="11.00" class="sc-notoserifcjksc">（首次尝试成功率，五次运行的平均值）。</text><text x="72.00" y="608.12" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.21 112.30 117.84" y="608.12" font-size="9.00" class="sc-lorabold">8.10.2.A]</text><text x="123.68" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">各模型在</text><text x="162.04" y="608.12" font-size="9.00" class="sc-lorabold">max</text><text x="182.34" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">推理强度下的外部</text><text x="335.48" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="362.48" y="608.12" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="393.80" y="608.12" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="498.03" y="608.12" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="507.03" y="608.12" font-size="9.00" class="sc-loraregular">361</text><text x="522.89" y="608.12" font-size="9.00" class="sc-notoserifcjksc">个任</text><text x="72.00" y="619.82" font-size="9.00" class="sc-notoserifcjksc">务，</text><text x="90.00" y="619.82" font-size="9.00" class="sc-loraregular">100</text><text x="106.82" y="619.82" font-size="9.00" class="sc-notoserifcjksc">步）上以自适应思考和</text><text x="199.19" y="619.82" font-size="9.00" class="sc-loraregular">max</text><text x="219.01" y="619.82" font-size="9.00" class="sc-notoserifcjksc">推理强度进行评估。分数为五次运行平均的</text><text x="392.38" y="619.82" font-size="9.00" class="sc-loraregular">pass@1</text><text x="421.17" y="619.82" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="430.17" y="619.82" font-size="9.00" class="sc-loraregular">Gemini</text><text x="462.83" y="619.82" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="474.20" y="619.82" font-size="9.00" class="sc-loraregular">GPT</text><text x="494.63" y="619.82" font-size="9.00" class="sc-notoserifcjksc">模型的分数</text><text x="72.00" y="631.52" font-size="9.00" class="sc-notoserifcjksc">取自已发布的结果。</text><a href="https://arxiv.org/abs/2404.07972" rel="noopener"><rect x="270.75" y="707.25" width="156.75" height="12.75" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="199.40" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="199.40" width="35.40" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="526.58" y="199.40" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="72.00" y="215.02" width="26.96" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="98.96" y="215.02" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="101.85" y="215.02" width="14.85" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="116.70" y="215.02" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="119.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="215.02" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="141.60" y="215.02" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="141.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="72.00" y="111.01" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="129.34" y="111.01" font-size="11.00" class="sc-notoserifcjksc">是一个程序化</text><text x="198.24" y="111.01" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="223.79" y="111.01" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="314.68 318.69 323.27 326.05 332.40 339.23" y="111.01" font-size="11.00" class="sc-loraregular">17,900</text><text x="348.97" y="111.01" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="428.86" y="111.01" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="483.62" y="111.01" font-size="11.00" class="sc-notoserifcjksc">程序构建而</text><text x="72.00" y="126.63" font-size="11.00" class="sc-notoserifcjksc">成，涵盖</text><text x="118.89" y="126.63" font-size="11.00" class="sc-loraregular">106</text><text x="138.98" y="126.63" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="328.87" y="126.63" font-size="11.00" class="sc-loraregular">ISO</text><text x="347.53" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="358.53" y="126.63" font-size="11.00" class="sc-loraregular sc-k">DIN</text><text x="378.68" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="389.68" y="126.63" font-size="11.00" class="sc-loraregular">EN</text><text x="404.90" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="415.90" y="126.63" font-size="11.00" class="sc-loraregular">ASME</text><text x="448.86" y="126.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="462.75" y="126.63" font-size="11.00" class="sc-loraregular">IEC</text><text x="483.86" y="126.63" font-size="11.00" class="sc-notoserifcjksc">规格表为依</text><text x="72.00" y="142.25" font-size="11.00" class="sc-notoserifcjksc">据。该基准测试将</text><text x="162.89" y="142.25" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="188.45" y="142.25" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务，我们报告</text><text x="400.34" y="142.25" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="467.21" y="142.25" font-size="11.00" class="sc-notoserifcjksc">任务的结果，</text><text x="72.00" y="157.87" font-size="11.00" class="sc-notoserifcjksc">该任务要求模型根据多视图渲染图生成</text><text x="261.89" y="157.87" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="316.65" y="157.87" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="194.11" font-size="11.00" class="sc-notoserifcjksc">我们内部实现的</text><text x="151.89" y="194.11" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="209.24" y="194.11" font-size="11.00" class="sc-notoserifcjksc">与参考实现一致，仅有若干细微修改，包括以下几项。第一，我们修</text><text x="72.00" y="209.73" font-size="11.00" class="sc-notoserifcjksc">正了参考系统提示词（</text><text x="182.00" y="209.73" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="259.29" y="209.73" font-size="11.00" class="sc-notoserifcjksc">）中的一处笔误，该笔误将提供给模型的渲染视图中左上</text><text x="534.29" y="209.73" font-size="11.00" class="sc-loraregular">/</text><text x="72.00" y="225.35" font-size="11.00" class="sc-notoserifcjksc">右上以及左下</text><text x="138.00" y="225.35" font-size="11.00" class="sc-loraregular">/</text><text x="445.48" y="225.35" font-size="11.00" class="sc-loraregular sc-k">Workplane</text><text x="503.83" y="225.35" font-size="11.00" class="sc-notoserifcjksc">外也接</text><text x="72.00" y="240.97" font-size="11.00" class="sc-notoserifcjksc">受原始形状。第三，我们略去了</text><text x="228.89" y="240.97" font-size="11.00" class="sc-loraregular">26</text><text x="244.05" y="240.97" font-size="11.00" class="sc-notoserifcjksc">条其</text><text x="268.94" y="240.97" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="323.70" y="240.97" font-size="11.00" class="sc-notoserifcjksc">代码未能生成</text><text x="392.60" y="240.97" font-size="11.00" class="sc-loraregular">STEP</text><text x="422.27" y="240.97" font-size="11.00" class="sc-notoserifcjksc">文件的记录。系统提示</text><text x="72.00" y="256.59" font-size="11.00" class="sc-notoserifcjksc">词的修正和评分方式的更改此后均已合并到参考代码仓库中。</text><text x="72.00" y="293.41" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="293.41" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="184.58" y="293.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="198.48" y="293.41" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="248.43" y="293.41" font-size="11.00" class="sc-notoserifcjksc">系统卡中错误地表述为结果同时反映了系统提示词的更改和</text><text x="72.00" y="309.03" font-size="11.00" class="sc-notoserifcjksc">评分方式的更改。此后我们已对该系统卡发布更正，说明这些分数仅反映了系统提示词的更改，</text><text x="72.00" y="324.65" font-size="11.00" class="sc-notoserifcjksc">而未反映评分方式的更改。本节报告的分数是首次在两项更改均已生效的情况下计算得出的。我</text><text x="72.00" y="340.27" font-size="11.00" class="sc-notoserifcjksc">们注意到，评分方式的更改并未对分数产生实质性影响。</text><text x="72.00" y="376.51" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="376.51" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="174.76" y="376.51" font-size="11.00" class="sc-notoserifcjksc">文件的一个子集上进行了消融实验，分别使用和不使用工具。使用</text><text x="496.65" y="376.51" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="72.00" y="392.13" font-size="11.00" class="sc-notoserifcjksc">工具评估时，模型获得一个容器（其中装有图像文件和标准</text><text x="360.89" y="392.13" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="400.44" y="392.13" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工</text><text x="72.00" y="407.75" font-size="11.00" class="sc-notoserifcjksc">具。我们从全部</text><text x="151.89 155.90 160.48 163.26 169.44 174.35" y="407.75" font-size="11.00" class="sc-loraregular">17,874</text><text x="183.22" y="407.75" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="197.11" y="407.75" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="263.98" y="407.75" font-size="11.00" class="sc-notoserifcjksc">文件中随机抽取</text><text x="343.88 347.88 350.49 357.32 364.15" y="407.75" font-size="11.00" class="sc-loraregular">1,000</text><text x="373.88" y="407.75" font-size="11.00" class="sc-notoserifcjksc">个作为子集评估模型，并计算五次</text><text x="72.00" y="423.37" font-size="11.00" class="sc-notoserifcjksc">运行的平均体素</text><text x="151.89" y="423.37" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="169.82" y="423.37" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="180.82" y="423.37" font-size="11.00" class="sc-loraregular sc-k">voxel IoU</text><text x="228.26" y="423.37" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="459.61" font-size="11.00" class="sc-notoserifcjksc">在该子集上，</text><text x="138.00" y="459.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="185.95" y="459.61" font-size="11.00" class="sc-notoserifcjksc">不使用工具时的体素</text><text x="287.84" y="459.61" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="308.67" y="459.61" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="322.56" y="459.61" font-size="11.00" class="sc-loraregular sc-k">0.266</text><text x="350.54" y="459.61" font-size="11.00" class="sc-notoserifcjksc">，使用工具时为</text><text x="430.44" y="459.61" font-size="11.00" class="sc-loraregular sc-k">0.373</text><text x="456.86" y="459.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="467.86" y="459.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="475.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="128.87" y="475.23" font-size="11.00" class="sc-notoserifcjksc">在相同设置下分别得分</text><text x="241.76" y="475.23" font-size="11.00" class="sc-loraregular sc-k">0.267</text><text x="271.28" y="475.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="285.17" y="475.23" font-size="11.00" class="sc-loraregular sc-k">0.327</text><text x="454.14" y="475.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="502.09" y="475.23" font-size="11.00" class="sc-notoserifcjksc">实际上</text><text x="72.00" y="490.85" font-size="11.00" class="sc-notoserifcjksc">持平，但在使用工具时落后</text><text x="206.89" y="490.85" font-size="11.00" class="sc-loraregular sc-k">0.046</text><text x="235.24" y="490.85" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.45 112.55 118.08 121.55 123.92 129.87 134.71 140.45 145.12 150.59 156.72 162.73 169.56 171.93 178.07 181.01 185.37 188.32 193.41 199.15 203.95 210.14 215.24 220.60" y="367.00" font-size="9.00" class="sc-lorabold">8.10.3.A] BenchCAD Vision2Code</text><text x="227.81" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">子集分数。</text><text x="272.81" y="367.00" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="356.17" y="367.00" font-size="9.00" class="sc-loraregular">max</text><text x="376.00" y="367.00" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="72.00" y="378.70" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="104.35" y="378.70" font-size="9.00" class="sc-notoserifcjksc">工具。分数为五次运行的平均值。图中显示</text><text x="277.72" y="378.70" font-size="9.00" class="sc-loraregular">95%</text><text x="298.03" y="378.70" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="438.49" font-size="11.00" class="sc-loraregular sc-k">ChartMuseum</text><text x="148.07" y="438.49" font-size="11.00" class="sc-notoserifcjksc">是一个图表问答基准测试，包含</text><text x="304.96 308.96 311.73 315.74 322.10" y="438.49" font-size="11.00" class="sc-loraregular">1,162</text><text x="330.91" y="438.49" font-size="11.00" class="sc-notoserifcjksc">道由专家标注的问题，针对取自</text><text x="487.80" y="438.49" font-size="11.00" class="sc-loraregular">184</text><text x="506.84" y="438.49" font-size="11.00" class="sc-notoserifcjksc">个来源</text><text x="72.00" y="454.11" font-size="11.00" class="sc-notoserifcjksc">的真实世界图表图像，包括学术图表、信息图和非常规的图表设计。该基准测试专门针对需要视</text><text x="72.00" y="551.83" font-size="11.00" class="sc-notoserifcjksc">我们内部实现的</text><text x="151.89" y="551.83" font-size="11.00" class="sc-loraregular sc-k">ChartMuseum</text><text x="227.96" y="551.83" font-size="11.00" class="sc-notoserifcjksc">与官方</text><text x="263.85" y="551.83" font-size="11.00" class="sc-loraregular sc-k">ChartMuseum</text><text x="339.92" y="551.83" font-size="11.00" class="sc-notoserifcjksc">代码仓库中的学生与教师提示词一致。不</text><text x="72.00" y="567.45" font-size="11.00" class="sc-notoserifcjksc">过，我们使用</text><text x="140.89" y="567.45" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="236.05" y="567.45" font-size="11.00" class="sc-notoserifcjksc">作为评分者，而非</text><text x="326.95" y="567.45" font-size="11.00" class="sc-loraregular sc-k">GPT-4.1-mini</text><text x="394.31" y="567.45" font-size="11.00" class="sc-notoserifcjksc">。在所有运行中，模型均配置</text><text x="72.00" y="583.07" font-size="11.00" class="sc-notoserifcjksc">为开启自适应思考和</text><text x="173.89" y="583.07" font-size="11.00" class="sc-loraregular">max</text><text x="198.13" y="583.07" font-size="11.00" class="sc-notoserifcjksc">推理强度，分别使用和不使用</text><text x="344.02" y="583.07" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="383.56" y="583.07" font-size="11.00" class="sc-notoserifcjksc">工具。使用</text><text x="441.46" y="583.07" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="481.00" y="583.07" font-size="11.00" class="sc-notoserifcjksc">工具评估</text><text x="72.00" y="598.69" font-size="11.00" class="sc-notoserifcjksc">时，模型获得一个容器（其中装有图像文件和标准</text><text x="316.89" y="598.69" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="356.44" y="598.69" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工具。我们在</text><text x="72.00" y="614.31" font-size="11.00" class="sc-notoserifcjksc">测试集上评估模型，并对五次运行的分数取平均。</text><text x="72.00" y="681.37" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="681.37" font-size="11.00" class="sc-loraregular sc-k">ChartMuseum</text><text x="161.96" y="681.37" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="183.96" y="681.37" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="270.20" y="681.37" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="361.09" y="681.37" font-size="11.00" class="sc-loraregular sc-k">70.1%</text><text x="389.10" y="681.37" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="479.99" y="681.37" font-size="11.00" class="sc-loraregular sc-k">86.7%</text><text x="509.53" y="681.37" font-size="11.00" class="sc-notoserifcjksc">，优</text><text x="72.00" y="696.99" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="696.99" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="178.16" y="696.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="189.16" y="696.99" font-size="11.00" class="sc-loraregular sc-k">59.3%</text><text x="222.63" y="696.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="236.53" y="696.99" font-size="11.00" class="sc-loraregular sc-k">80.9%</text><text x="268.00" y="696.99" font-size="11.00" class="sc-notoserifcjksc">），但落后于</text><text x="336.89" y="696.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="419.89" y="696.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="430.89" y="696.99" font-size="11.00" class="sc-loraregular">75.8%</text><text x="463.30" y="696.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="477.20" y="696.99" font-size="11.00" class="sc-loraregular sc-k">89.7%</text><text x="506.48" y="696.99" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p129.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 129 页"><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.33 112.43 117.96 121.44 123.80 130.00 135.59 140.30 144.62 148.34 156.88 162.44 166.81 171.65 177.21" y="367.93" font-size="9.00" class="sc-lorabold">8.10.4.A] ChartMuseum</text><text x="187.86" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="214.86" y="367.93" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="298.22" y="367.93" font-size="9.00" class="sc-loraregular">max</text><text x="318.05" y="367.93" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="464.42" y="367.93" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="496.77" y="367.93" font-size="9.00" class="sc-notoserifcjksc">工具。分</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">数为五次运行的平均值。图中显示</text><text x="209.37" y="379.63" font-size="9.00" class="sc-loraregular">95%</text><text x="229.67" y="379.63" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="439.42" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="170.11" y="439.42" font-size="11.00" class="sc-notoserifcjksc">是一个全面的图表理解评估套件，由</text><text x="349.00 354.91 357.68 363.81 369.55" y="439.42" font-size="11.00" class="sc-loraregular">2,323</text><text x="378.58" y="439.42" font-size="11.00" class="sc-notoserifcjksc">张取自</text><text x="414.47" y="439.42" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="442.91" y="439.42" font-size="11.00" class="sc-notoserifcjksc">论文的真实世界图</text><text x="72.00" y="455.04" font-size="11.00" class="sc-notoserifcjksc">表构建而成，涵盖八个主要科学学科。该基准测试检验模型能否综合复杂科学图表中的视觉信</text><text x="72.00" y="470.66" font-size="11.00" class="sc-notoserifcjksc">息，以回答需要多步推理的问题。</text><text x="72.00" y="520.38" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均配置为开启自适应思考和</text><text x="305.89" y="520.38" font-size="11.00" class="sc-loraregular">max</text><text x="330.13" y="520.38" font-size="11.00" class="sc-notoserifcjksc">推理强度，分别使用和不使用</text><text x="476.02" y="520.38" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="515.56" y="520.38" font-size="11.00" class="sc-notoserifcjksc">工</text><text x="72.00" y="536.00" font-size="11.00" class="sc-notoserifcjksc">具。使用</text><text x="118.89" y="536.00" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="158.44" y="536.00" font-size="11.00" class="sc-notoserifcjksc">工具评估时，模型获得一个容器（其中装有图像文件和标准</text><text x="447.33" y="536.00" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="486.88" y="536.00" font-size="11.00" class="sc-notoserifcjksc">库）以及</text><text x="72.00" y="551.62" font-size="11.00" class="sc-notoserifcjksc">一个图像裁剪工具。评分所用的提示词与参考实现相同。不过，我们使用</text><text x="426.89" y="551.62" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="522.05" y="551.62" font-size="11.00" class="sc-notoserifcjksc">而</text><text x="72.00" y="567.24" font-size="11.00" class="sc-notoserifcjksc">非</text><text x="85.89" y="567.24" font-size="11.00" class="sc-loraregular sc-k">GPT-4o</text><text x="127.93" y="567.24" font-size="11.00" class="sc-notoserifcjksc">作为评分模型。我们在验证集的</text><text x="284.83 288.83 291.44 298.27 305.10" y="567.24" font-size="11.00" class="sc-loraregular">1,000</text><text x="314.84" y="567.24" font-size="11.00" class="sc-notoserifcjksc">道题目上评估模型，并对五次运行的分数取平</text><text x="72.00" y="582.86" font-size="11.00" class="sc-notoserifcjksc">均。</text><text x="72.00" y="649.92" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="649.92" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="184.00" y="649.92" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="206.00" y="649.92" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="292.24" y="649.92" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="383.14" y="649.92" font-size="11.00" class="sc-loraregular sc-k">77.0%</text><text x="411.74" y="649.92" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00" y="665.54" font-size="11.00" class="sc-loraregular">88.3%</text><text x="102.77" y="665.54" font-size="11.00" class="sc-notoserifcjksc">，优于</text><text x="138.66" y="665.54" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="230.93" y="665.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="241.93" y="665.54" font-size="11.00" class="sc-loraregular sc-k">71.6%</text><text x="272.42" y="665.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="286.31" y="665.54" font-size="11.00" class="sc-loraregular">85.3%</text><text x="316.89" y="665.54" font-size="11.00" class="sc-notoserifcjksc">），略微落后于</text><text x="396.79" y="665.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="479.78" y="665.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="490.78" y="665.54" font-size="11.00" class="sc-loraregular sc-k">80.5%</text><text x="524.78" y="665.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="681.16" font-size="11.00" class="sc-loraregular sc-k">89.9%</text><text x="102.92" y="681.16" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p130.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 130 页"><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.27 112.37 117.90 121.37 123.74 129.93 135.52 140.24 144.07 150.36 153.24 158.09 160.45 166.50 171.34 176.06 180.42 185.52 191.26 194.20 199.94" y="367.93" font-size="9.00" class="sc-lorabold">8.10.5.A] CharXiv Reasoning</text><text x="207.32" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="234.32" y="367.93" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="265.65" y="367.93" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="349.02" y="367.93" font-size="9.00" class="sc-loraregular">max</text><text x="368.85" y="367.93" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="72.00" y="379.63" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="104.35" y="379.63" font-size="9.00" class="sc-notoserifcjksc">工具。</text><text x="131.35" y="379.63" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="162.68" y="379.63" font-size="9.00" class="sc-notoserifcjksc">模型的分数为五次运行的平均值。图中显示</text><text x="336.05" y="379.63" font-size="9.00" class="sc-loraregular">95%</text><text x="356.36" y="379.63" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="72.00" y="84.21" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="84.21" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="72.00" y="485.51" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="161.46" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">与</text><text x="231.13" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="242.50" y="485.51" font-size="9.00" class="sc-lorabold sc-k">Anthropic</text><text x="288.18" y="485.51" font-size="9.00" class="sc-notoserifcjkscbold">内部智能体运行框架上的精确匹配准确率。</text><text x="459.18" y="485.51" font-size="9.00" class="sc-notoserifcjksc">除</text><text x="470.55" y="485.51" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="72.00" y="497.21" font-size="9.00" class="sc-notoserifcjksc">以其默认推理强度设置运行外，所有模型均在</text><text x="254.37" y="497.21" font-size="9.00" class="sc-loraregular">max</text><text x="274.19" y="497.21" font-size="9.00" class="sc-notoserifcjksc">推理强度下使用自适应思考运行。</text><text x="409.19" y="497.21" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="479.75" y="497.21" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="491.12" y="497.21" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="508.91" font-size="9.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="109.75" y="508.91" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="148.11" y="508.91" font-size="9.00" class="sc-loraregular">5</text><text x="155.38" y="508.91" font-size="9.00" class="sc-notoserifcjksc">次试验的平均值，</text><text x="227.38" y="508.91" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="305.24" y="508.91" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="316.61" y="508.91" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="386.88" y="508.91" font-size="9.00" class="sc-notoserifcjksc">的得分为单次试验结果。</text><text x="121.57" y="551.07" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46" y="551.07" font-size="11.00" class="sc-loraregular sc-k">Databricks</text><text x="193.13" y="551.07" font-size="11.00" class="sc-notoserifcjksc">发布的一项公开基准测试，评估模型在由大量历史</text><text x="438.02" y="551.07" font-size="11.00" class="sc-loraregular sc-k">Treasury</text><text x="72.00" y="566.69" font-size="11.00" class="sc-loraregular sc-k">Bulletin</text><text x="111.23" y="566.69" font-size="11.00" class="sc-notoserifcjksc">（美国财政部公报）文档构成的语料上进行端到端有据推理的能力。模型必须在整个语料</text><text x="72.00" y="582.31" font-size="11.00" class="sc-notoserifcjksc">中定位相关表格，并基于这些表格进行精确的数值推理。我们以智能体方式进行评估：文档以提</text><text x="72.00" y="597.93" font-size="11.00" class="sc-notoserifcjksc">取后的文本形式提供于沙箱化的环境中，并提供代码执行工具；</text><text x="450.25" y="597.93" font-size="11.00" class="sc-notoserifcjksc">是推荐用于前沿模</text><text x="72.00" y="613.55" font-size="11.00" class="sc-notoserifcjksc">型的、难度更高的</text><text x="162.89" y="613.55" font-size="11.00" class="sc-loraregular">133</text><text x="182.04" y="613.55" font-size="11.00" class="sc-notoserifcjksc">题子集。得分采用精确匹配（五次试验的平均值），耗尽输出预算的回合</text><text x="72.00" y="629.17" font-size="11.00" class="sc-notoserifcjksc">记为错误。</text><text x="72.00" y="680.60" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="680.60" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="221.70" y="680.60" font-size="11.00" class="sc-notoserifcjksc">上达到</text><text x="257.59" y="680.60" font-size="11.00" class="sc-loraregular">73.3%</text><text x="287.19" y="680.60" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="382.33" y="680.60" font-size="11.00" class="sc-notoserifcjksc">上达到</text><text x="418.23" y="680.60" font-size="11.00" class="sc-loraregular sc-k">59.4%</text><text x="448.64" y="680.60" font-size="11.00" class="sc-notoserifcjksc">，较</text><text x="473.53" y="680.60" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="696.22" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="125.98" y="696.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="136.98" y="696.22" font-size="11.00" class="sc-loraregular sc-k">68.7%</text><text x="169.40" y="696.22" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="183.30" y="696.22" font-size="11.00" class="sc-loraregular">53.4%</text><text x="213.66" y="696.22" font-size="11.00" class="sc-notoserifcjksc">）有所提升。两个模型都会产生很长的推理，在最高</text><a href="https://www.databricks.com/blog/introducing-officeqa-benchmark-end-to-end-grounded-reasoning" rel="noopener"><rect x="72.00" y="542.27" width="46.67" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">推理强度下，有一部分回合（约</text><text x="228.89" y="82.63" font-size="11.00" class="sc-loraregular">9–15%</text><text x="261.31" y="82.63" font-size="11.00" class="sc-notoserifcjksc">）在给出最终答案之前就达到了每轮输出上限；这些回合</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">记为错误，因此相关数值是保守的。</text><text x="121.57" y="131.20" font-size="11.00" class="sc-notoserifcjksc">得分对评估运行框架高度敏感：要求模型直接解析原始</text><text x="388.46" y="131.20" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="412.08" y="131.20" font-size="11.00" class="sc-notoserifcjksc">语料的设置会使所有模型</text><text x="72.00" y="146.82" font-size="11.00" class="sc-notoserifcjksc">的绝对得分大幅降低，跨报告比较时应考虑这一点。</text><text x="72.00 78.83 84.77 90.45 93.44 98.82 109.33 115.77 120.49 123.48 130.06 132.95 138.92 142.02 148.69 154.37 161.05 166.84 172.80 175.70 181.25" y="222.20" font-size="11.00" class="sc-loraregular">Real-World Finance v2</text><text x="190.05" y="222.20" font-size="11.00" class="sc-notoserifcjksc">是我们内部开发的一项评估，用于衡量模型完成复杂、长程金融分析任</text><text x="72.00" y="253.44" font-size="11.00" class="sc-notoserifcjksc">析，以及基于贴近现实的输入材料产出可直接交付客户的工作成果。该评估套件包含</text><text x="481.89" y="253.44" font-size="11.00" class="sc-loraregular">294</text><text x="503.01" y="253.44" font-size="11.00" class="sc-notoserifcjksc">项复杂</text><text x="72.00" y="269.06" font-size="11.00" class="sc-notoserifcjksc">且贴近现实的任务，代表了金融专业人士的日常工作。由于这些任务的交付物是开放式的，而非</text><text x="72.00" y="284.68" font-size="11.00" class="sc-notoserifcjksc">单一正确答案，我们以两两比较的方式进行评估：两个模型尝试同一任务，由基于模型的评分者</text><text x="72.00" y="300.30" font-size="11.00" class="sc-notoserifcjksc">在两份工作成果之间给出偏好。我们报告正面对比胜率（以及据此推导出的</text><text x="437.89" y="300.30" font-size="11.00" class="sc-loraregular">Elo</text><text x="454.16" y="300.30" font-size="11.00" class="sc-notoserifcjksc">），这一方法与</text><text x="72.00" y="315.92" font-size="11.00" class="sc-notoserifcjksc">其他已发表的专业工作成果评估类似。</text><text x="72.00" y="400.32" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="117.06" y="400.32" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="128.06" y="400.32" font-size="11.00" class="sc-loraregular">1219</text><text x="148.33" y="400.32" font-size="11.00" class="sc-notoserifcjksc">）与</text><text x="173.22" y="400.32" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="216.46" y="400.32" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="227.46" y="400.32" font-size="11.00" class="sc-loraregular sc-k">1207</text><text x="249.03" y="400.32" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="273.93" y="400.32" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="318.63" y="400.32" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="329.63" y="400.32" font-size="11.00" class="sc-loraregular">1222</text><text x="351.36" y="400.32" font-size="11.00" class="sc-notoserifcjksc">）在统计上持平，比</text><text x="453.25" y="400.32" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="510.12" y="400.32" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="524.01" y="400.32" font-size="11.00" class="sc-loraregular">219</text><text x="72.00" y="415.94" font-size="11.00" class="sc-notoserifcjksc">分（</text><text x="94.00" y="415.94" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="141.95" y="415.94" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="155.84" y="415.94" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="212.71" y="415.94" font-size="11.00" class="sc-notoserifcjksc">的胜率为</text><text x="259.61" y="415.94" font-size="11.00" class="sc-loraregular">69%</text><text x="281.89" y="415.94" font-size="11.00" class="sc-notoserifcjksc">），且明显低于</text><text x="361.78" y="415.94" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="397.29" y="415.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="408.29" y="415.94" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="437.80" y="415.94" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="451.70" y="415.94" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="499.65" y="415.94" font-size="11.00" class="sc-notoserifcjksc">的胜率</text><text x="72.00" y="431.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="431.56" font-size="11.00" class="sc-loraregular">69%</text><text x="108.18" y="431.56" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
