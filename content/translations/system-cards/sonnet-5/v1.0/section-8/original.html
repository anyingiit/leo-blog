<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p117.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 117 页"><text x="72.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="98.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">GKE</text><text x="111.51" y="98.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">集群</text><text x="133.51" y="98.82" font-size="11.00" class="sc-notoserifcjksc">上，以</text><text x="169.41" y="98.82" font-size="11.00" class="sc-loraregular">1×</text><text x="182.13" y="98.82" font-size="11.00" class="sc-notoserifcjksc">超时率和</text><text x="229.03" y="98.82" font-size="11.00" class="sc-loraregular">pod</text><text x="287.39" y="98.82" font-size="11.00" class="sc-loraregular">3×</text><text x="302.24" y="98.82" font-size="11.00" class="sc-notoserifcjksc">内存上限的设置，</text><text x="390.24" y="98.82" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="476.48" y="98.82" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="490.37" y="98.82" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="526.27" y="98.82" font-size="11.00" class="sc-notoserifcjksc">推</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">理强度下取得了</text><text x="151.89" y="114.44" font-size="11.00" class="sc-loraregular sc-k">80.4%</text><text x="185.86" y="114.44" font-size="11.00" class="sc-notoserifcjksc">的平均奖励，该结果为</text><text x="298.75" y="114.44" font-size="11.00" class="sc-loraregular sc-k">89</text><text x="314.11" y="114.44" font-size="11.00" class="sc-notoserifcjksc">个不同任务各尝试</text><text x="405.00" y="114.44" font-size="11.00" class="sc-loraregular">5</text><text x="413.89" y="114.44" font-size="11.00" class="sc-notoserifcjksc">次的平均值（共</text><text x="493.78" y="114.44" font-size="11.00" class="sc-loraregular">445</text><text x="514.60" y="114.44" font-size="11.00" class="sc-notoserifcjksc">次试</text><text x="72.00" y="130.06" font-size="11.00" class="sc-notoserifcjksc">验）。</text><text x="72.00" y="164.10" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="128.87" y="164.10" font-size="11.00" class="sc-notoserifcjksc">在同一评估和同一基础设施上、以</text><text x="296.76" y="164.10" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="326.06" y="164.10" font-size="11.00" class="sc-notoserifcjksc">推理强度取得了</text><text x="405.95" y="164.10" font-size="11.00" class="sc-loraregular sc-k">67%</text><text x="429.77" y="164.10" font-size="11.00" class="sc-notoserifcjksc">的得分。</text><text x="72.00" y="240.95" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="140.35" y="237.28" font-size="6.60" class="sc-loraregular">20</text><text x="150.89" y="240.95" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="175.78" y="240.95" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="229.29" y="240.95" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="397.18" y="240.95" font-size="11.00" class="sc-loraregular">150</text><text x="416.90" y="240.95" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务源</text><text x="72.00" y="256.57" font-size="11.00" class="sc-notoserifcjksc">自开源代码仓库中的真实拉取请求（</text><text x="248.00" y="256.57" font-size="11.00" class="sc-loraregular sc-k">pull request</text><text x="308.82" y="256.57" font-size="11.00" class="sc-notoserifcjksc">），例如：修复</text><text x="388.71" y="256.57" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="428.26" y="256.57" font-size="11.00" class="sc-notoserifcjksc">框架</text><text x="453.15" y="256.57" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="502.25" y="256.57" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="72.00" y="272.19" font-size="11.00" class="sc-loraregular sc-k">websocket bug</text><text x="148.34" y="272.19" font-size="11.00" class="sc-notoserifcjksc">、加固</text><text x="184.23" y="272.19" font-size="11.00" class="sc-loraregular">Prisma</text><text x="222.25" y="272.19" font-size="11.00" class="sc-notoserifcjksc">的浏览器</text><text x="269.14" y="272.19" font-size="11.00" class="sc-loraregular">bundle</text><text x="304.32" y="272.19" font-size="11.00" class="sc-notoserifcjksc">，或扩展</text><text x="351.21" y="272.19" font-size="11.00" class="sc-loraregular sc-k">JSON schema</text><text x="423.36" y="272.19" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="437.26" y="272.19" font-size="11.00" class="sc-loraregular sc-k">lint</text><text x="457.07" y="272.19" font-size="11.00" class="sc-notoserifcjksc">规则。</text><text x="72.00" y="316.48" font-size="11.00" class="sc-notoserifcjksc">每个任务向智能体提供一个已检出的代码仓库和一条</text><text x="327.89" y="316.48" font-size="11.00" class="sc-loraregular">issue</text><text x="356.59" y="316.48" font-size="11.00" class="sc-notoserifcjksc">描述；随后智能体在容器化环境中自</text><text x="72.00" y="332.10" font-size="11.00" class="sc-notoserifcjksc">主工作，生成最终补丁，期间没有人工干预，也没有超时信息。补丁依据阻断性功能标准（主要</text><text x="72.00" y="347.72" font-size="11.00" class="sc-notoserifcjksc">是留出的单元测试）以及加权评分细则标准进行评分，其中包括针对所需测试覆盖率和禁止的实</text><text x="72.00" y="363.34" font-size="11.00" class="sc-notoserifcjksc">现模式的、由模型评分的检查项。任务由底层代码仓库的维护者编写，并由</text><text x="437.89" y="363.34" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="491.40" y="363.34" font-size="11.00" class="sc-notoserifcjksc">研究人员</text><text x="72.00" y="378.96" font-size="11.00" class="sc-notoserifcjksc">逐一审核，其中随机抽取的一部分经人工求解，以验证公平性。</text><a href="https://cognition.ai/blog/frontier-code" rel="noopener"><rect x="317.25" y="708.75" width="171.75" height="11.25" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="85.89" y="90.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https:
