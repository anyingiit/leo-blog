414.15" y="379.63" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="425.52" y="379.63" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="456.94" y="379.63" font-size="9.00" class="sc-notoserifcjksc">锚定于其先前公布的</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">数值。误差线为</text><text x="137.37" y="391.33" font-size="9.00" class="sc-loraregular">95%</text><text x="157.67" y="391.33" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间（</text><text x="353.36" y="391.33" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="452.44" font-size="11.00" class="sc-loraregular sc-k">Legal Agent Benchmark</text><text x="192.63" y="448.77" font-size="6.60" class="sc-loraregular">28</text><text x="199.88" y="452.44" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="210.88" y="452.44" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="231.15" y="452.44" font-size="11.00" class="sc-notoserifcjksc">）是由</text><text x="267.05" y="452.44" font-size="11.00" class="sc-loraregular sc-k">Harvey AI</text><text x="319.63" y="452.44" font-size="11.00" class="sc-notoserifcjksc">创建的开源基准测试。该基准测试包含</text><text x="509.52 513.52 516.29 522.20 529.03" y="452.44" font-size="11.00" class="sc-loraregular">1,200</text><text x="72.00" y="468.06" font-size="11.00" class="sc-notoserifcjksc">多项任务，覆盖</text><text x="151.89" y="468.06" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="166.41" y="468.06" font-size="11.00" class="sc-notoserifcjksc">个不同的执业领域。每项任务都包含一个封闭文档集</text><text x="72.00" y="483.68" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="483.68" font-size="11.00" class="sc-loraregular">.xlsx</text><text x="105.45" y="483.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="116.45" y="483.68" font-size="11.00" class="sc-loraregular sc-k">.docx</text><text x="143.77" y="483.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="154.77" y="483.68" font-size="11.00" class="sc-loraregular">.eml</text><text x="176.27" y="483.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="187.27" y="483.68" font-size="11.00" class="sc-loraregular sc-k">.pptx</text><text x="213.33" y="483.68" font-size="11.00" class="sc-notoserifcjksc">），其中包括电子邮件往来、律所模板、程序性文件以及其他客户</text><text x="72.00" y="499.30" font-size="11.00" class="sc-notoserifcjksc">案件材料，智能体必须从中筛查信息才能完成任务。任务指令以合伙人向授薪律师发出的简短</text><text x="523.00" y="499.30" font-size="11.00" class="sc-loraregular">“</text><text x="527.40" y="499.30" font-size="11.00" class="sc-notoserifcjksc">工</text><text x="105.00" y="514.92" font-size="11.00" class="sc-loraregular">”</text><text x="108.84" y="514.92" font-size="11.00" class="sc-notoserifcjksc">形式撰写。任务指令还规定了预期的输出文档及格式。评估采用</text><text x="419.73" y="514.92" font-size="11.00" class="sc-loraregular">LLM</text><text x="445.44" y="514.92" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="500.44" y="514.92" font-size="11.00" class="sc-loraregular sc-k">LLM-</text><text x="72.00" y="530.54" font-size="11.00" class="sc-loraregular sc-k">as-a-judge</text><text x="127.21" y="530.54" font-size="11.00" class="sc-notoserifcjksc">），依据一套由专家撰写的评分细则标准进行通过</text><text x="369.21" y="530.54" font-size="11.00" class="sc-loraregular">/</text><text x="376.80" y="530.54" font-size="11.00" class="sc-notoserifcjksc">不通过判定（每项被评估任务的</text><text x="72.00" y="546.16" font-size="11.00" class="sc-notoserifcjksc">标准数：最小值</text><text x="149.00" y="546.16" font-size="11.00" class="sc-loraregular sc-k">=23</text><text x="166.70" y="546.16" font-size="11.00" class="sc-notoserifcjksc">，中位数</text><text x="210.70" y="546.16" font-size="11.00" class="sc-loraregular">=56</text><text x="228.88" y="546.16" font-size="11.00" class="sc-notoserifcjksc">，最大值</text><text x="272.88" y="546.16" font-size="11.00" class="sc-loraregular sc-k">=194</text><text x="294.92" y="546.16" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="316.92" y="546.16" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="340.08" y="546.16" font-size="11.00" class="sc-notoserifcjksc">的标准报告方式仅在所有标准均满足时才</text><text x="72.00" y="561.78" font-size="11.00" class="sc-notoserifcjksc">将任务视为成功。</text><text x="72.00" y="630.78" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 111.90 114.67 120.41 126.54" y="630.78" font-size="11.00" class="sc-loraregular">1,235</text><text x="135.44" y="630.78" font-size="11.00" class="sc-notoserifcjksc">道题上测试了</text><text x="204.33" y="630.78" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="287.68" y="630.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="298.68 302.68 305.45 311.36 317.35" y="630.78" font-size="11.00" class="sc-loraregular">1,251</text><text x="324.26" y="630.78" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="371.16" y="630.78" font-size="11.00" class="sc-loraregular">16</text><text x="384.41" y="630.78" font-size="11.00" class="sc-notoserifcjksc">道因数据缺陷被排除；排除项在</text><text x="72.00" y="646.40" font-size="11.00" class="sc-notoserifcjksc">测试前即已确定），其全通过率为</text><text x="239.89" y="646.40" font-size="11.00" class="sc-loraregular">8.92%</text><text x="270.62" y="646.40" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="281.62" y="646.40" font-size="11.00" class="sc-loraregular sc-k">± 0.36</text><text x="312.18" y="646.40" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="323.18" y="646.40" font-size="11.00" class="sc-loraregular">n=5</text><text x="341.69" y="646.40" font-size="11.00" class="sc-notoserifcjksc">），平均评分项通过率为</text><text x="465.58" y="646.40" font-size="11.00" class="sc-loraregular">88.26%</text><text x="502.49" y="646.40" font-size="11.00" class="sc-notoserifcjksc">（自适</text><text x="72.00" y="662.02" font-size="11.00" class="sc-notoserifcjksc">应思考，</text><text x="116.00" y="662.02" font-size="11.00" class="sc-loraregular">max</text><text x="140.23" y="662.02" font-si ss="sc-notoserifcjksc">、</text><text x="141.07" y="129.49" font-size="11.00" class="sc-loraregular sc-k">glob</text><text x="163.25" y="129.49" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="174.25" y="129.49" font-size="11.00" class="sc-loraregular sc-k">grep</text><text x="200.44" y="129.49" font-size="11.00" class="sc-notoserifcjksc">工具，而我们仅提供</text><text x="302.33" y="129.49" font-size="11.00" class="sc-loraregular">bash</text><text x="328.98" y="129.49" font-size="11.00" class="sc-notoserifcjksc">和一个</text><text x="364.88" y="129.49" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="404.42" y="129.49" font-size="11.00" class="sc-notoserifcjksc">工具。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66" y="210.01" font-size="11.00" class="sc-loraregular">GDPval-AA v2</text><text x="146.46" y="210.01" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="250.94" y="210.01" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真实</text><text x="72.00" y="225.63" font-size="11.00" class="sc-notoserifcjksc">世界专业任务上测试</text><text x="173.89" y="225.63" font-size="11.00" class="sc-loraregular">AI</text><text x="187.36" y="225.63" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用来自</text><text x="322.25" y="225.63" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="363.65" y="225.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="377.55" y="225.63" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GDPval</text><text x="417.99" y="225.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="472.99" y="221.96" font-size="6.60" class="sc-loraregular">29</text><text x="483.25" y="225.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="497.14" y="225.63" font-size="11.00" class="sc-loraregular">220</text><text x="518.68" y="225.63" font-size="11.00" class="sc-notoserifcjksc">项任</text><text x="72.00" y="241.25" font-size="11.00" class="sc-notoserifcjksc">务，涵盖</text><text x="118.89" y="241.25" font-size="11.00" class="sc-loraregular">9</text><text x="128.14" y="241.25" font-size="11.00" class="sc-notoserifcjksc">个主要行业中的</text><text x="208.04" y="241.25" font-size="11.00" class="sc-loraregular">44</text><text x="222.85" y="241.25" font-size="11.00" class="sc-notoserifcjksc">种职业。任务模拟真实的专业工作成果，包括文档、幻灯片、图</text><text x="72.00" y="256.87" font-size="11.00" class="sc-notoserifcjksc">表和电子表格。模型在智能体循环中获得</text><text x="272.89" y="256.87" font-size="11.00" class="sc-loraregular">shell</text><text x="299.41" y="256.87" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来解决任务，表现通过</text><text x="72.00" y="272.49" font-size="11.00" class="sc-notoserifcjksc">基于模型输出盲评两两比较得出的</text><text x="239.89" y="272.49" font-size="11.00" class="sc-loraregular sc-k">ELO</text><text x="264.50" y="272.49" font-size="11.00" class="sc-notoserifcjksc">评分来衡量。</text><text x="330.50" y="272.49" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="500.79" y="272.49" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="288.11" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="288.11" font-size="11.00" class="sc-notoserifcjksc">排名第二（</text><text x="174.95" y="288.11" font-size="11.00" class="sc-loraregular sc-k">ELO 1618</text><text x="220.10" y="288.11" font-size="11.00" class="sc-notoserifcjksc">），与</text><text x="256.00" y="288.11" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="300.70" y="288.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="311.70" y="288.11" font-size="11.00" class="sc-loraregular sc-k">ELO 1615</text><text x="356.67" y="288.11" font-size="11.00" class="sc-notoserifcjksc">）在统计上持平，仅次于</text><text x="480.56" y="288.11" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="72.00" y="303.73" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="303.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99" y="303.73" font-size="11.00" class="sc-loraregular sc-k">ELO 1783</text><text x="134.99" y="303.73" font-size="11.00" class="sc-notoserifcjksc">）。评估由</text><text x="283.46" y="303.73" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00" y="440.32" font-size="11.00" class="sc-loraregular sc-k">Toolathlon</text><text x="126.91" y="436.65" font-size="6.60" class="sc-loraregular">30</text><text x="137.58" y="440.32" font-size="11.00" class="sc-notoserifcjksc">是一项智能体基准测试，包含</text><text x="283.47" y="440.32" font-size="11.00" class="sc-loraregular">108</text><text x="303.38" y="440.32" font-size="11.00" class="sc-notoserifcjksc">项真实世界工具使用任务，涵盖办公效率、电子</text><text x="72.00" y="455.94" font-size="11.00" class="sc-notoserifcjksc">商务与运营、数据分析以及网络研究。任务以真实的应用状态作为初始设定，并由基于执行的检</text><text x="72.00" y="471.56" font-size="11.00" class="sc-notoserifcjksc">查器评分，这些检查器会验证生成的产出物及其副作用。该基准测试提供了</text><text x="437.89" y="471.56" font-size="11.00" class="sc-loraregular">32</text><text x="452.82" y="471.56" font-size="11.00" class="sc-notoserifcjksc">个应用中的</text><text x="510.71" y="471.56" font-size="11.00" class="sc-loraregular">604</text><text x="72.00" y="487.18" font-size="11.00" class="sc-notoserifcjksc">个工具；任务平均约</text><text x="173.89" y="487.18" font-size="11.00" class="sc-loraregular">20</text><text x="189.52" y="487.18" font-size="11.00" class="sc-notoserifcjksc">轮，要求正确选择工具、按正确顺序执行多个步骤，并给出与检查器要</text><text x="72.00" y="502.80" font-size="11.00" class="sc-notoserifcjksc">求完全一致的输出。</text><text x="72.00" y="553.89" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="553.89" font-size="11.00" class="sc-loraregular">max</text><text x="132.13" y="553.89" font-size="11.00" class="sc-notoserifcjksc">推理强度下使用自适应思考运行了内部运行框架。遵循</text><text x="399.02" y="553.89" font-size="11.00" class="sc-loraregular sc-k">Toolathlon</text><text x="456.82" y="553.89" font-size="11.00" class="sc-notoserifcjksc">论文的评估方</text><text x="72.00" y="569.51" font-size="11.00" class="sc-notoserifcjksc">案，我们报告全部</text><text x="162.89" y="569.51" font-size="11.00" class="sc-loraregular">108</text><text x="182.80" y="569.51" font-size="11.00" class="sc-notoserifcjksc">项任务上</text><text x="229.70" y="569.51" font-size="11.00" class="sc-loraregular">3</text><text x="238.72" y="569.51" font-size="11.00" class="sc-notoserifcjksc">次试验平均的</text><text x="307.61" y="569.51" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="342.82" y="569.51" font-size="11.00" class="sc-notoserifcjksc">，同时报告</text><text x="400.71" y="569.51" font-size="11.00" class="sc-loraregular sc-k">Pass@3</text><text x="438.05" y="569.51" font-size="11.00" class="sc-notoserifcjksc">（三次试验中至少一</text><text x="72.00" y="585.13" font-size="11.00" class="sc-notoserifcjksc">次正确）、</text><text x="127.00" y="585.13" font-size="11.00" class="sc-loraregular sc-k">Pass³</text><text x="153.52" y="585.13" font-size="11.00" class="sc-notoserifcjksc">（三次试验全部正确）以及每条轨迹的平均轮次。</text><text x="72.00" y="634.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="634.85" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="172.13" y="634.85" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="210.24" y="634.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="224.13" y="634.85" font-size="11.00" class="sc-loraregular">54.3%</text><text x="254.49" y="634.85" font-size="11.00" class="sc-notoserifcjksc">（三次试验平均）。这使其领先于</text><text x="422.38" y="634.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="72.00" y="650.47" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="164.27" y="650.47" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="175.27" y="650.47" font-size="11.00" class="sc-loraregular sc-k">49.4%</text><text x="205.65" y="650.47" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p135.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 135 页"><text x="76.75" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="447.25" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">平均轮次</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">落后于前沿</text><text x="129.89" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="82.63" font-size="11.00" class="sc-notoserifcjksc">模型，包括</text><text x="226.08" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="309.07" y="82.63" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="320.07" y="82.63" font-size="11.00" class="sc-loraregular sc-k">59.9%</text><text x="350.88" y="82.63" font-size="11.00" class="sc-notoserifcjksc">）以及</text><text x="386.78" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="463.47" y="82.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="477.36" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="119.06" y="98.25" font-size="11.00" class="sc-notoserifcjksc">（均为</text><text x="154.95" y="98.25" font-size="11.00" class="sc-loraregular sc-k">61.7%</text><text x="182.31" y="98.25" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="458.16" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.35 110.45 115.98" y="458.16" font-size="9.00" class="sc-lorabold">8.11.5.A]</text><text x="121.82" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">使用内部运行框架的</text><text x="205.19" y="458.16" font-size="9.00" class="sc-lorabold sc-k">Toolathlon</text><text x="253.54" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="280.54" y="458.16" font-size="9.00" class="sc-notoserifcjksc">各模型均在</text><text x="327.91" y="458.16" font-size="9.00" class="sc-loraregular">max</text><text x="347.73" y="458.16" font-size="9.00" class="sc-notoserifcjksc">推理强度下使用自适应思考进行评估。</text><text x="500.73" y="458.16" font-size="9.00" class="sc-loraregular sc-k">Pass@1</text><text x="529.54" y="458.16" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="469.86" font-size="9.00" class="sc-loraregular sc-k">Pass@3</text><text x="104.91" y="469.86" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="116.28" y="469.86" font-size="9.00" class="sc-loraregular sc-k">Pass³</text><text x="140.35" y="469.86" font-size="9.00" class="sc-notoserifcjksc">按论文的评估方案，基于全部</text><text x="259.71" y="469.86" font-size="9.00" class="sc-loraregular">108</text><text x="276.00" y="469.86" font-size="9.00" class="sc-notoserifcjksc">项任务、每项</text><text x="332.37" y="469.86" font-size="9.00" class="sc-loraregular">3</text><text x="339.75" y="469.86" font-size="9.00" class="sc-notoserifcjksc">次试验计算。</text><text x="72.00" y="497.22" font-size="11.00" class="sc-notoserifcjksc">关于与已发布排行榜可比性的说明。我们的运行框架复刻了上游的任务定义、提示词和基于执行</text><text x="72.00" y="512.84" font-size="11.00" class="sc-notoserifcjksc">的检查器，并通过重放已发布的</text><text x="228.89" y="512.84" font-size="11.00" class="sc-loraregular sc-k">claude-sonnet-4.5</text><text x="325.79" y="512.84" font-size="11.00" class="sc-notoserifcjksc">轨迹进行了验证。为控制自已发布轨迹以来</text><text x="72.00" y="528.46" font-size="11.00" class="sc-notoserifcjksc">的实时依赖漂移和上游仓库变更，我们将金融数据源和容器镜像固定到离线快照，并镜像当前的</text><text x="72.00" y="544.08" font-size="11.00" class="sc-notoserifcjksc">上游状态。按已发布的版本，大约四分之一的任务无法完成；我们对这些任务未作改动。固定版</text><text x="72.00" y="559.70" font-size="11.00" class="sc-notoserifcjksc">本的净效应：我们的得分比严格与上游等价的运行框架高约</text><text x="360.89" y="559.70" font-size="11.00" class="sc-loraregular">3</text><text x="72.00" y="575.32" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="575.32" font-size="11.00" class="sc-notoserifcjksc">模型之间保持不变。另外，已发布排行榜中</text><text x="322.18" y="575.32" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="368.32" y="575.32" font-size="11.00" class="sc-notoserifcjksc">的数据采用的是作者的默认配置，</text><text x="72.00" y="590.94" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="96.89" y="590.94" font-size="11.00" class="sc-loraregular">max</text><text x="121.13" y="590.94" font-size="11.00" class="sc-notoserifcjksc">推理强度。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="72.00" y="110.82" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="163.89" y="107.15" font-size="6.60" class="sc-loraregular">31</text><text x="172.87" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="186.76" y="110.82" font-size="11.00" class="sc-loraregular">Zapier</text><text x="222.42" y="110.82" font-size="11.00" class="sc-notoserifcjksc">推出的一项基准测试，衡量智能体能否完成贴近现实的端到端业</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">务工作流。任务基于真实客户在销售、市场营销、运营、客户支持、财务和人力资源领域的工作</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">流模式构建。每项任务都将智能体置于一家模拟公司中，该公司拥有数十个</text><text x="437.89" y="142.06" font-size="11.00" class="sc-loraregular sc-k">REST API</text><text x="487.89" y="142.06" font-size="11.00" class="sc-notoserifcjksc">端点，覆</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">盖</text><text x="85.89" y="157.68" font-size="11.00" class="sc-loraregular">47</text><text x="99.82" y="157.68" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="143.82" y="157.68" font-size="11.00" class="sc-loraregular">CRM</text><text x="168.51" y="157.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="179.51" y="157.68" font-size="11.00" class="sc-loraregular">Slack</text><text x="206.18" y="157.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="217.18" y="157.68" font-size="11.00" class="sc-loraregular sc-k">Google Workspace</text><text x="316.18" y="157.68" font-size="11.00" class="sc-notoserifcjksc">等）。在仅给出一条自然语言指令的情况下，</text><text x="72.00" y="173.30" font-size="11.00" class="sc-notoserifcjksc">智能体必须通过搜索自主发现正确的端点，进行数十次顺序执行、相互依赖的</text><text x="448.89" y="173.30" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="468.97" y="173.30" font-size="11.00" class="sc-notoserifcjksc">调用，查阅并</text><text x="72.00" y="188.92" font-size="11.00" class="sc-notoserifcjksc">遵守分层业务政策文档，同时避开刻意设置的干扰项。每项任务的评分为通过或不通过，依据是</text><text x="72.00" y="204.54" font-size="11.00" class="sc-notoserifcjksc">否满足针对模拟应用状态的所有确定性断言（例如，是否应用了正确的</text><text x="415.89" y="204.54" font-size="11.00" class="sc-loraregular">CRM</text><text x="443.48" y="204.54" font-size="11.00" class="sc-notoserifcjksc">更新）。</text><text x="72.00" y="289.16" font-size="11.00" class="sc-notoserifcjksc">在衡量私有留出评估集表现的</text><text x="217.89" y="289.16" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="312.68" y="289.16" font-size="11.00" class="sc-notoserifcjksc">排行榜上，</text><text x="367.68" y="289.16" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="451.03" y="289.16" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="462.03" y="289.16" font-size="11.00" class="sc-loraregular">max</text><text x="486.26" y="289.16" font-size="11.00" class="sc-notoserifcjksc">推理强</text><text x="72.00" y="304.78" font-size="11.00" class="sc-notoserifcjksc">度）得分为</text><text x="129.89" y="304.78" font-size="11.00" class="sc-loraregular">13.5%</text><text x="158.29" y="304.78" font-size="11.00" class="sc-notoserifcjksc">，较</text><text x="183.19" y="304.78" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="275.46" y="304.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="286.46" y="304.78" font-size="11.00" class="sc-loraregular">max</text><text x="310.69" y="304.78" font-size="11.00" class="sc-notoserifcjksc">推理强度）的</text><text x="379.58" y="304.78" font-size="11.00" class="sc-loraregular">5.3%</text><text x="406.87" y="304.78" font-size="11.00" class="sc-notoserifcjksc">有显著提升。</text><text x="72.00" y="610.13" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="610.13" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.67 110.76 116.30 119.77 122.14 127.96 133.49 137.21 142.30 150.58 155.26 158.98 161.92 167.01 172.70 178.65 183.49 189.23 193.90" y="610.13" font-size="9.00" class="sc-lorabold">8.11.6.A] AutomationBench</text><text x="201.85" y="610.13" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="219.85" y="610.13" font-size="9.00" class="sc-notoserifcjksc">，基于</text><text x="249.22" y="610.13" font-size="9.00" class="sc-loraregular" fill="#0000ff">Zapier</text><text x="278.40" y="610.13" font-size="9.00" class="sc-notoserifcjksc" fill="#0000ff">排行榜</text><text x="305.40" y="610.13" font-size="9.00" class="sc-notoserifcjksc">的私有留出任务。</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" y="707.25" width="157.50" height="12.75" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="249.22" y="602.93" width="0.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="249.22" y="602.93" width="26.81" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="276.03" y="602.93" width="2.37" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="278.40" y="602.93" width="9.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="287.40" y="602.93" width="0.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="287.40" y="602.93" width="9.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="296.40" y="602.93" width="0.00" height="9.00" fill="transparent"/></a><a href="http://zapier.com/benchmarks" rel="noopener"><rect x="296.40" y="602.93" width="9.00" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="72.00 79.39 86.06 91.44 98.19 102.95 106.05 112.01 115.67 121.50 127.18 132.27" y="115.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">AA-Briefcase</text><text x="141.12" y="115.05" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="245.60" y="115.05" font-size="11.00" class="sc-notoserifcjksc">开发，是一项新的基准测试，面向由行业专家构建的复杂项</text><text x="72.00" y="130.67" font-size="11.00" class="sc-notoserifcjksc">目中的长程知识工作。模型需要完成为期数周的项目，这些项目包含大量相互关联的任务以及数</text><text x="72.00" y="146.29" font-size="11.00" class="sc-notoserifcjksc">千个输入源文件；评分结合评分细则打分与由前沿模型评审团进行的成对评判，以衡量可验证的</text><text x="72.00" y="161.91" font-size="11.00" class="sc-notoserifcjksc">任务成功率、分析质量和呈现质量。</text><text x="248.00" y="161.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="418.29" y="161.91" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="504.53" y="161.91" font-size="11.00" class="sc-notoserifcjksc">排名第</text><text x="72.00" y="177.53" font-size="11.00" class="sc-notoserifcjksc">二（</text><text x="94.00" y="177.53" font-size="11.00" class="sc-loraregular sc-k">ELO 1393</text><text x="141.22" y="177.53" font-size="11.00" class="sc-notoserifcjksc">），与</text><text x="177.12" y="177.53" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="221.82" y="177.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="232.82" y="177.53" font-size="11.00" class="sc-loraregular sc-k">ELO 1352</text><text x="279.46" y="177.53" font-size="11.00" class="sc-notoserifcjksc">）在统计上持平，仅次于</text><text x="403.35" y="177.53" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="438.86" y="177.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="449.86" y="177.53" font-size="11.00" class="sc-loraregular sc-k">ELO 1586</text><text x="497.01" y="177.53" font-size="11.00" class="sc-notoserifcjksc">）。相</text><text x="72.00" y="193.15" font-size="11.00" class="sc-notoserifcjksc">较于</text><text x="96.89" y="193.15" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="141.60" y="193.15" font-size="11.00" class="sc-notoserifcjksc">，它在评分细则得分和分析质量</text><text x="298.49" y="193.15" font-size="11.00" class="sc-loraregular">Elo</text><text x="317.65" y="193.15" font-size="11.00" class="sc-notoserifcjksc">上均有提升，呈现质量</text><text x="430.55" y="193.15" font-size="11.00" class="sc-loraregular">Elo</text><text x="449.71" y="193.15" font-size="11.00" class="sc-notoserifcjksc">略有下降。与</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66" y="208.77" font-size="11.00" class="sc-loraregular">GDPval-AA v2</text><text x="146.46" y="208.77" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="179.46" y="208.77" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="265.70" y="208.77" font-size="11.00" class="sc-notoserifcjksc">运行的轨迹比同类模型长得多：平均</text><text x="444.59" y="208.77" font-size="11.00" class="sc-loraregular">183</text><text x="463.80" y="208.77" font-size="11.00" class="sc-notoserifcjksc">轮，而</text><text x="499.69" y="208.77" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="72.00" y="224.39" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="224.39" font-size="11.00" class="sc-loraregular sc-k">67</text><text x="100.14" y="224.39" font-size="11.00" class="sc-notoserifcjksc">轮，</text><text x="122.14" y="224.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="169.73" y="224.39" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="183.63" y="224.39" font-size="11.00" class="sc-loraregular">55</text><text x="198.51" y="224.39" font-size="11.00" class="sc-notoserifcjksc">轮。评估由</text><text x="346.99" y="224.39" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00" y="310.74" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="310.74" font-size="14.00" class="sc-notosanscjkscbold">医疗健康</text><text x="72.00" y="347.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.1 HealthBench</text><text x="194.98" y="347.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结果</text><text x="72.00" y="379.51" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="137.65" y="375.84" font-size="6.60" class="sc-loraregular">32</text><text x="147.76" y="379.51" font-size="11.00" class="sc-notoserifcjksc">是一项开源评估，旨在评估真实医疗健康情境中的安全性、准确性和沟通能力。</text><text x="72.00" y="395.13" font-size="11.00" class="sc-notoserifcjksc">该基准测试使用</text><text x="151.89 157.85 164.04 166.64 173.48 180.31" y="395.13" font-size="11.00" class="sc-loraregular">48,000</text><text x="190.04" y="395.13" font-size="11.00" class="sc-notoserifcjksc">多条由专家撰写的评分细则条目，对涵盖</text><text x="390.93" y="395.13" font-size="11.00" class="sc-loraregular">26</text><text x="406.09" y="395.13" font-size="11.00" class="sc-notoserifcjksc">个医学专科的</text><text x="474.99 480.98 483.59 490.42 497.25" y="395.13" font-size="11.00" class="sc-loraregular">5,000</text><text x="506.98" y="395.13" font-size="11.00" class="sc-notoserifcjksc">段多轮</text><text x="72.00" y="410.75" font-size="11.00" class="sc-notoserifcjksc">患者对话进行评分。</text><a href="https://arxiv.org/abs/2505.08775" rel="noopener"><rect x="186.00" y="707.25" width="159.75" height="12.75" fill="transparent"/></a><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="72.00" y="106.25" width="19.44" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="91.44" y="106.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="91.44" y="106.25" width="46.79" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p138.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 138 页"><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 128.79 133.63 138.35 141.12 144.84 150.37 156.32 161.16 166.90 171.57" y="367.00" font-size="9.00" class="sc-lorabold">8.12.1.A] HealthBench</text><text x="179.52" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">长度校正后得分</text><text x="242.52" y="367.00" font-size="9.00" class="sc-notoserifcjksc">。所有</text><text x="271.89" y="367.00" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="303.22" y="367.00" font-size="9.00" class="sc-notoserifcjksc">模型均在</text><text x="341.59" y="367.00" font-size="9.00" class="sc-loraregular">max</text><text x="361.41" y="367.00" font-size="9.00" class="sc-notoserifcjksc">推理强度下使用自适应思考。</text><text x="478.41" y="367.00" font-size="9.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="378.70" font-size="9.00" class="sc-loraregular">4.8</text><text x="86.52" y="378.70" font-size="9.00" class="sc-notoserifcjksc">为评分模型。得分为</text><text x="169.88" y="378.70" font-size="9.00" class="sc-loraregular">5</text><text x="177.16" y="378.70" font-size="9.00" class="sc-notoserifcjksc">次试验的平均值。未向任何模型提供工具或定制的系统提示词。长度校正后得分采用</text><text x="72.00" y="390.40" font-size="9.00" class="sc-loraregular sc-k">HealthBench</text><text x="128.08" y="390.40" font-size="9.00" class="sc-notoserifcjksc">论文中公布的方法计算。</text><text x="227.08" y="390.40" font-size="9.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="263.36" y="390.40" font-size="9.00" class="sc-notoserifcjksc">的得分取自</text><text x="310.73" y="390.40" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="34 ze="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="407.40" y="468.64" font-size="11.00" class="sc-notoserifcjksc">，平均表现接近</text><text x="487.29" y="468.64" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="484.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="116.70" y="484.26" font-size="11.00" class="sc-notoserifcjksc">，但低于</text><text x="163.60" y="484.26" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="248.95" y="484.26" font-size="11.00" class="sc-notoserifcjksc">。我们报告了多个领域的评估结果，包括计算生物学、结构</text><text x="72.00" y="499.88" font-size="11.00" class="sc-notoserifcjksc">生物学、有机化学和实验方案故障排查。这些评估中有许多由领域专家在内部开发，侧重于推动</text><text x="72.00" y="515.50" font-size="11.00" class="sc-notoserifcjksc">基础研究和药物研发中有益应用的能力，与第</text><text x="294.89" y="515.50" font-size="11.00" class="sc-loraregular">2.2</text><text x="312.31" y="515.50" font-size="11.00" class="sc-notoserifcjksc">节中侧重于滥用潜力的</text><text x="425.20" y="515.50" font-size="11.00" class="sc-loraregular">CB</text><text x="442.62" y="515.50" font-size="11.00" class="sc-notoserifcjksc">风险评估（</text><text x="497.62" y="515.50" font-size="11.00" class="sc-loraregular">CB risk</text><text x="72.00" y="531.12" font-size="11.00" class="sc-loraregular sc-k">assessment</text><text x="130.64" y="531.12" font-size="11.00" class="sc-notoserifcjksc">）形成互补。</text><text x="72.00" y="598.18" font-size="11.00" class="sc-notoserifcjksc">尽管其中许多评估并未公开发布，我们在下文对每一项作简要介绍。</text><text x="72.00" y="672.99" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">BioMysteryBench</text><text x="164.48" y="672.99" font-size="11.00" class="sc-notoserifcjksc">评估模型解决高难度分析难题的能力，这些难题要求将计算分析与生物学推理</text><text x="72.00" y="688.61" font-size="11.00" class="sc-notoserifcjksc">交织进行。给定未经处理的数据集，模型必须回答诸如从……中识别被敲除的基因之类的问题</text><a href="https://www.anthropic.com/research/Evaluating-Claude-For-Bioinformatics-With-BioMysteryBench" rel="noopener"><rect x="72.00" y="664.19" width="89.58" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">（指从转录组数据中识别），或确定样本感染了何种病毒。对于该基准测试，我们报告独立人类</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">专家能够解决的问题子集（</text><text x="204.00" y="98.25" font-size="11.00" class="sc-loraregular sc-k">“Human Solvable”</text><text x="294.13" y="98.25" font-size="11.00" class="sc-notoserifcjksc">），以及人类尚未解决但具有客观、真实标准答案</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的问题子集（</text><text x="227.89" y="113.87" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="189.82" font-size="11.00" class="sc-notoserifcjksc">这些评估由</text><text x="129.89" y="189.82" font-size="11.00" class="sc-loraregular sc-k">LatchBio</text><text x="177.90" y="189.82" font-size="11.00" class="sc-notoserifcjksc">开发，评估解决具有挑战性的真实世界生物信息学问题的能力。</text><text x="72.00" y="205.44" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">SpatialBench</text><text x="183.88" y="205.44" font-size="11.00" class="sc-notoserifcjksc">变体在一组</text><text x="241.77" y="205.44" font-size="11.00" class="sc-loraregular">115</text><text x="258.67" y="205.44" font-size="11.00" class="sc-notoserifcjksc">个经外部验证的问题上测试对空间转录组学数据的分析，</text><text x="72.00" y="221.06" font-size="11.00" class="sc-notoserifcjksc">要求模型根据这些分析结果回答有关样本的生物学问题。</text><text x="347.00" y="221.06" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">SingleCellBench</text><text x="432.60" y="221.06" font-size="11.00" class="sc-notoserifcjksc">变体在</text><text x="468.50" y="221.06" font-size="11.00" class="sc-loraregular">195</text><text x="487.75" y="221.06" font-size="11.00" class="sc-notoserifcjksc">个问题上</text><text x="72.00" y="236.68" font-size="11.00" class="sc-notoserifcjksc">测试对单细胞</text><text x="140.89" y="236.68" font-size="11.00" class="sc-loraregular">RNA</text><text x="165.96" y="236.68" font-size="11.00" class="sc-notoserifcjksc">测序数据的分析，这些问题涵盖标注细胞类型、寻找差异表达基因和校正批次</text><text x="72.00" y="252.30" font-size="11.00" class="sc-notoserifcjksc">效应等标准工作流程。</text><text x="72.00" y="317.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.3</text><text x="111.30" y="317.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">开放式结构生物学</text><text x="72.00" y="345.59" font-size="11.00" class="sc-notoserifcjksc">我们评估了模型理解生物分子结构与功能之间关系的能力。在仅给定结构数据和基础工具的情况</text><text x="72.00" y="361.21" font-size="11.00" class="sc-notoserifcjksc">下，模型必须回答有关某一生物分子功能的开放式问题。</text><text x="72.00" y="436.59" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">ProteinGym</text><text x="136.55" y="436.59" font-size="11.00" class="sc-notoserifcjksc">基准测试评估模型预测蛋白质突变效应的能力。</text><text x="72.00" y="483.50" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.5</text><text x="111.88" y="483.50" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有机化学</text><text x="72.00" y="527.02" font-size="11.00" class="sc-notoserifcjksc">预测反应产物，以及在</text><text x="184.89" y="527.02" font-size="11.00" class="sc-loraregular sc-k">IUPAC</text><text x="220.56" y="527.02" font-size="11.00" class="sc-notoserifcjksc">命名、</text><text x="253.56" y="527.02" font-size="11.00" class="sc-loraregular">SMILES</text><text x="295.91" y="527.02" font-size="11.00" class="sc-notoserifcjksc">表示法和化学结构图像之间进行转换。</text><text x="72.00" y="590.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.6</text><text x="111.83" y="590.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">实验方案故障排查</text><text x="72.00" y="618.59" font-size="11.00" class="sc-notoserifcjksc">该评估考察模型检测并修复分子生物学实验方案中错误的能力，包括使用网络搜索工具在线查找</text><text x="72.00" y="634.21" font-size="11.00" class="sc-notoserifcjksc">有关实验方案的更多细节。</text><a href="https://arxiv.org/abs/2512.21907" rel="noopener"><rect x="485.90" y="181.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.21907" rel="noopener"><rect x="72.00" y="196.64" width="66.19" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/html/2602.09063v1" rel="noopener"><rect x="347.00" y="212.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/html/2602.09063v1" rel="noopener"><rect x="347.00" y="212.26" width="82.71" height="11.00" fill="transparent"/></a><a href="https://proteingym.org/" rel="noopener"><rect x="72.00" y="427.79" width="61.65" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="72.00" y="611.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="611.39" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.93 112.03 117.57" y="611.39" font-size="9.00" class="sc-lorabold">8.14.6.A]</text><text x="123.41" y="611.39" font-size="9.00" class="sc-notoserifcjkscbold">生命科学能力的评估结果。</text><text x="231.41" y="611.39" font-size="9.00" class="sc-notoserifcjksc">在六项生命科学基准测试上，</text><text x="348.41" y="611.39" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="418.97" y="611.39" font-size="9.00" class="sc-notoserifcjksc">较</text><text x="430.34" y="611.39" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="508.19" y="611.39" font-size="9.00" class="sc-notoserifcjksc">有所提</text><text x="72.00" y="623.09" font-size="9.00" class="sc-notoserifcjksc">升，平均表现接近</text><text x="146.37" y="623.09" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="214.27" y="623.09" font-size="9.00" class="sc-notoserifcjksc">，但低于</text><text x="252.64" y="623.09" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="322.47" y="623.09" font-size="9.00" class="sc-notoserifcjksc">。分数为各任务特定的</text><text x="414.84" y="623.09" font-size="9.00" class="sc-loraregular">0–1</text><text x="431.38" y="623.09" font-size="9.00" class="sc-notoserifcjksc">指标（越高越好）。成对面</text><text x="72.00" y="634.79" font-size="9.00" class="sc-notoserifcjksc">板显示每个模型在两个子基准测试上的结果（较浅色</text><text x="281.37" y="634.79" font-size="9.00" class="sc-loraregular">=</text><text x="288.50" y="634.79" font-size="9.00" class="sc-notoserifcjksc">第一种条件）。</text></svg></div>
