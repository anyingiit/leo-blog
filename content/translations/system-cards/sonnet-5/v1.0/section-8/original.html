<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">我们在内部运行框架上评估</text><text x="206.89 215.26 223.35 229.09 231.80 238.36 244.94" y="98.82" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="248.66 259.66 270.66 281.66 292.66 303.66 314.66 325.66 336.66 347.66 358.66 369.66 380.66 391.66 402.66 413.66 424.66 435.66 446.66 457.66 468.66 479.66 490.66 501.66 512.66" y="98.82" font-size="11.00" class="sc-notoserifcjksc">，分别使用和不使用工具。不使用工具评估时，模型获得</text><text x="72.00 78.40 84.08 89.17 95.13 101.49" y="114.44" font-size="11.00" class="sc-loraregular">base64</text><text x="110.35 121.35 132.35" y="114.44" font-size="11.00" class="sc-notoserifcjksc">编码的</text><text x="146.24 152.85 160.93" y="114.44" font-size="11.00" class="sc-loraregular">PDF</text><text x="166.96 177.96 188.96 199.96" y="114.44" font-size="11.00" class="sc-notoserifcjksc">，以匹配</text><text x="213.86 220.03 226.59 231.30 237.33" y="114.44" font-size="11.00" class="sc-loraregular">Surge</text><text x="246.19 257.18 268.18 279.18 290.18 301.18 312.18 323.18 334.18 345.18 356.18" y="114.44" font-size="11.00" class="sc-notoserifcjksc">的输入提示词。不过，与</text><text x="370.08 376.25 382.82 387.52 393.55" y="114.44" font-size="11.00" class="sc-loraregular">Surge</text><text x="402.41 413.41 424.41 435.41 446.41 457.41 468.41 479.41 490.41" y="114.44" font-size="11.00" class="sc-notoserifcjksc">不同，对于超出我们</text><text x="504.30 511.19 517.80" y="114.44" font-size="11.00" class="sc-loraregular">API</text><text x="72.00 78.13 84.03 94.13" y="130.06" font-size="11.00" class="sc-loraregular">32MB</text><text x="103.87 114.87 125.87 136.87 147.87 158.87 169.87" y="130.06" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="183.76 190.37 198.46" y="130.06" font-size="11.00" class="sc-loraregular">PDF</text><text x="204.48 215.48 226.48 237.48 248.48 259.48 270.48 281.48 292.48 303.48 314.48 325.48 336.48 347.48 358.48 369.48 380.48 391.48 402.48" y="130.06" font-size="11.00" class="sc-notoserifcjksc">，我们会将其截断（而非丢弃）。我们使用</text><text x="416.38 425.11 431.68 438.24 443.34 446.23 452.19 454.55" y="130.06" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="462.51 473.51" y="130.06" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="487.40 495.78 501.74 511.57 514.66 521.34 524.43 527.32" y="130.06" font-size="11.00" class="sc-loraregular">Gemini 3</text><text x="72.00 78.03 81.02 86.70 91.79" y="145.68" font-size="11.00" class="sc-loraregular">Flash</text><text x="101.27 112.27 123.27 134.27 145.27 156.27 167.27 178.27 189.27 200.27 211.27 222.27 233.27 244.27 255.27 266.27 277.27 288.27 299.27 310.27 321.27 332.27 343.27 354.27 365.27 376.27 387.27 398.27 409.27" y="145.68" font-size="11.00" class="sc-notoserifcjksc">作为评判模型。使用工具评估时，模型获得一个容器（其中装有该</text><text x="423.16 429.77 437.86" y="145.68" font-size="11.00" class="sc-loraregular">PDF</text><text x="446.78 457.78 468.78 479.78 490.78" y="145.68" font-size="11.00" class="sc-notoserifcjksc">文件和标准</text><text x="72.00 78.83 84.69 88.95 95.54 101.98" y="161.30" font-size="11.00" class="sc-loraregular">Python</text><text x="111.54 122.54 133.54 144.54 155.54 166.54 177.54 188.54 199.54 210.54 221.54 232.54 243.54 254.54 265.54 276.54 287.54 298.54 309.54 320.54 331.54 342.54 353.54 364.54 375.54 386.54 397.54 408.54 419.54 430.54 441.54 452.54 463.54 474.54 485.54 496.54 507.54 518.54 529.54" y="161.30" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工具。我们报告平均评分项通过率，即每项任务中满足的评分细则</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="176.92" font-size="11.00" class="sc-notoserifcjksc">条件所占的比例，而非严格通过率。我们在全部</text><text x="305.89 309.90 316.73" y="176.92" font-size="11.00" class="sc-loraregular">100</text><text x="326.45 337.45 348.45 359.45 370.45 381.45 392.45 403.45 414.45 425.45 436.45 447.45 458.45 469.45 480.45 491.45 502.45 513.45 524.45" y="176.92" font-size="11.00" class="sc-notoserifcjksc">个提示词上评估模型，并对五次运行的分数</text><text x="72.00 83.00 94.00 105.00" y="192.54" font-size="11.00" class="sc-notoserifcjksc">取平均。</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 94.26 102.35 108.09 110.80 117.36 123.94" y="244.55" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="130.55 141.55" y="244.55" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="152.55 160.24 163.23 168.84 175.41 181.99 187.95 190.84 197.08 203.52 210.19 216.87 222.76 227.01 229.91" y="244.55" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="238.79 249.79 260.79 271.79 282.79 293.79 304.79 315.79 326.79 337.79 348.79 359.79 370.79 381.79 392.79 403.79" y="244.55" font-size="11.00" class="sc-notoserifcjksc">不使用工具时的平均评分项通过率为</text><text x="417.69 423.97 428.55 431.26 437.26" y="244.55" font-size="11.00" class="sc-loraregular">67.5%</text><text x="446.83 457.83 468.83 479.83 490.83 501.83 512.83 523.83" y="244.55" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00 78.18 82.19 84.78 91.14" y="260.17" font-size="11.00" class="sc-loraregular">81.6%</text><text x="100.71" y="260.17" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="111.71 117.95 124.38 131.06 137.74 143.62 147.88 150.77" y="260.17" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="159.66 170.66" y="260.17" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="184.55 192.24 195.23 200.84 207.41 213.99 219.95 222.84 229.08 235.52 242.19 248.87 254.75 259.01 261.90 267.87 270.46" y="260.17" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="276.82 287.82 298.82 309.82 320.82 331.82 342.82 353.82 364.82 375.82 386.82" y="260.17" font-size="11.00" class="sc-notoserifcjksc">，后者不使用工具时得分</text><text x="400.71 407.07 413.43 416.14 422.49" y="260.17" font-size="11.00" class="sc-loraregular">66.9%</text><text x="432.06 443.06 454.06 465.06 476.06 487.06 498.06 509.06" y="260.17" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="72.00 77.07 83.25 85.85 92.21" y="275.79" font-size="11.00" class="sc-loraregular">78.6%</text><text x="101.78 112.78 123.78 134.78 145.78 156.78 167.78 178.78 189.78 200.78 211.78 222.78 233.78 244.78" y="275.79" font-size="11.00" class="sc-notoserifcjksc">。需要指出的是，我们未能复现</text><text x="258.67 264.84 271.41 276.12 282.14" y="275.79" font-size="11.00" class="sc-loraregular">Surge</text><text x="291.00 302.00 313.00 324.00 335.00 346.00 357.00 368.00 379.00 390.00 401.00 412.00 423.00 434.00 445.00 456.00 467.00 478.00 489.00 500.00 511.00 522.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">报告的数值，且平均评分项通过率和严格通过率均</text><text x="72.00 83.00 94.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">落后于</text><text x="107.89 114.06 120.63 125.34 131.37" y="291.41" font-size="11.00" class="sc-loraregular">Surge</text><text x="140.22 151.22 162.22 173.22 184.22 195.22 206.22 217.22 228.22 239.22 250.22 261.22 272.22 283.22 294.22 305.22 316.22 327.22 338.22 349.22 360.22 371.22 382.22 393.22 404.22 415.22 426.22 437.22 448.22 459.22" y="291.41" font-size="11.00" class="sc-notoserifcjksc">运行得到的结果。我们认为这些分数在方向上具有代表性，能够反映</text><text x="473.11 480.80 483.80 489.41 495.97 502.55" y="291.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="511.41 522.41" y="291.41" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="307.03" font-size="11.00" class="sc-notoserifcjksc">之间的性能差异。与此前</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 239.77 245.45 251.85 254.84 260.80 263.70" y="307.03" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="272.59" y="307.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="286.48 296.41 302.27 306.53 313.12 319.56 324.65 327.54" y="307.03" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="336.43 347.43 358.43 369.43 380.43 391.43 402.43 413.43 424.43 435.43 446.43 457.43 468.43 479.43 490.43 501.43 512.43" y="307.03" font-size="11.00" class="sc-notoserifcjksc">系统卡中的数值相比，我们将最大输出</text><text x="72.00 76.26 82.69 88.52 94.48" y="322.65" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05 137.05" y="322.65" font-size="11.00" class="sc-notoserifcjksc">数提高到</text><text x="150.95 154.95 160.86 167.04" y="322.65" font-size="11.00" class="sc-loraregular">128k</text><text x="175.84 186.84 197.84 208.84 219.84 230.84 241.84 252.84 263.84 274.84 285.84 296.84 307.84 318.84 329.84 340.84 351.84 362.84 373.84 384.84" y="322.65" font-size="11.00" class="sc-notoserifcjksc">并据此更新了这些数值，这使性能略有提升。</text><text x="72.00" y="669.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="669.39" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 109.06 111.16 116.69 120.17 122.54 129.32 136.03 140.96 142.98 148.39 153.76" y="669.39" font-size="9.00" class="sc-lorabold">8.10.1.A] GDP.pdf</text><text x="159.44 168.44 177.44" y="669.39" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="186.44 195.44 204.44 213.44 222.44 231.44 240.44 249.44 258.44" y="669.39" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="269.81 277.86 282.50" y="669.39" font-size="9.00" class="sc-loraregular">max</text><text x="289.64 298.64 307.64 316.64 325.64 334.64 343.64 352.64 361.64 370.64 379.64 388.64 397.64 406.64 415.64 424.64" y="669.39" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="436.01 441.59 446.39 449.87 455.27 460.53" y="669.39" font-size="9.00" class="sc-loraregular">Python</text><text x="468.36 477.36 486.36 495.36 504.36 513.36 522.36 531.36" y="669.39" font-size="9.00" class="sc-notoserifcjksc">工具。平均评分项</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00" y="681.09" font-size="9.00" class="sc-notoserifcjksc">通过率分数为五次运行的平均值。图中显示</text><text x="245.37 250.57 255.47" y="681.09" font-size="9.00" class="sc-loraregular">95%</text><text x="265.67 274.67 283.67 292.67 301.67" y="681.09" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="391.24" y="681.09" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="400.24 406.53" y="681.09" font-size="9.00" class="sc-loraregular">CI</text><text x="409.55 418.55" y="681.09" font-size="9.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p126.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 126 页"><text x="72.00 80.73 86.97 97.49 103.92 108.64 111.63" y="110.82" font-size="11.00" class="sc-loraregular">OSWorld</text><text x="118.21 121.76" y="107.15" font-size="6.60" class="sc-loraregular">27</text><text x="127.69 138.69 149.69 160.69 171.69 182.69 193.69 204.69 215.69 226.69 237.69 248.69 259.69 270.69 281.69 292.69 303.69 314.69 325.69 336.69 347.69 358.69 369.69 380.69 391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，评估智能体通过鼠标和键盘操作与一台运行中的</text><text x="482.58 490.86 497.26 503.82 510.40 514.66" y="110.82" font-size="11.00" class="sc-loraregular">Ubuntu</text><text x="524.12" y="110.82" font-size="11.00" class="sc-notoserifcjksc">虚</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">拟机交互、完成真实世界计算机任务（如编辑文档、浏览网页和管理文件）的能力。我们遵循默</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">认设置，分辨率为</text><text x="162.89 166.90 173.73 179.91 186.74" y="142.06" font-size="11.00" class="sc-loraregular">1080p</text><text x="193.31 204.31 215.31 226.31 237.31 248.31 259.31 270.31 281.31 292.31 303.31 314.31 325.31" y="142.06" font-size="11.00" class="sc-notoserifcjksc">，每个任务的操作步数上限为</text><text x="339.20 343.21 350.04" y="142.06" font-size="11.00" class="sc-loraregular">100</text><text x="356.87" y="142.06" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">我们调整了</text><text x="224.28 235.28 246.28 257.28 268.28 279.28 290.28 301.28 312.28 323.28 334.28 345.28 356.28 367.28 378.28 389.28 400.28 411.28 422.28 433.28 444.28 455.28 466.28 477.28" y="208.20" font-size="11.00" class="sc-notoserifcjksc">评估的运行方式，以更好地反映真实世界中的表现。如</text><text x="491.18 498.87 501.86 507.47 514.03 520.61" y="208.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="223.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.8</text><text x="119.60 130.60 141.60" y="223.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60" y="223.82" font-size="11.00" class="sc-notoserifcjksc">中所述，这些调整包括修复一个影响批量动作的缩放工具</text><text x="430.49 436.89 443.46" y="223.82" font-size="11.00" class="sc-loraregular">bug</text><text x="449.54 460.54 471.54 482.54 493.54 504.54" y="223.82" font-size="11.00" class="sc-notoserifcjksc">，以及将每轮</text><text x="72.00 76.26 82.69 88.52 94.48" y="239.44" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05" y="239.44" font-size="11.00" class="sc-notoserifcjksc">上限从</text><text x="139.95 143.95 150.31" y="239.44" font-size="11.00" class="sc-loraregular">16K</text><text x="160.71 171.71 182.71" y="239.44" font-size="11.00" class="sc-notoserifcjksc">提高到</text><text x="196.61 200.61 206.52 212.70" y="239.44" font-size="11.00" class="sc-loraregular">128K</text><text x="220.21 231.21 242.21 253.21 264.21 275.21 286.21 297.21 308.21 319.21 330.21 341.21 352.21 363.21 374.21 385.21" y="239.44" font-size="11.00" class="sc-notoserifcjksc">。随后我们在这些调整下重新评估了</text><text x="399.11 406.80 409.79 415.40 421.96 428.54 434.50 437.40 443.63 450.07 456.75 463.42 469.31 473.57 476.46 482.42 485.02" y="239.44" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="491.38 502.38 513.38 524.38" y="239.44" font-size="11.00" class="sc-notoserifcjksc">，发现我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">们此前一直低报了它在</text><text x="184.89 193.63 199.86 210.38 216.82 221.53 224.53" y="255.06" font-size="11.00" class="sc-loraregular">OSWorld</text><text x="234.00 245.00 256.00 267.00 278.00 289.00 300.00 311.00 322.00 333.00 344.00 355.00 366.00 377.00 388.00 399.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">上的表现。我们在下文报告其表现。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="305.35" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="305.35" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="172.13 180.87 187.10 197.62 204.05 208.77 211.77" y="305.35" font-size="11.00" class="sc-loraregular">OSWorld</text><text x="221.24 232.24 243.24" y="305.35" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="257.13 263.31 267.32 270.02 275.93" y="305.35" font-size="11.00" class="sc-loraregular">81.2%</text><text x="285.50 296.50 307.50 318.50 329.50 340.50 351.50 362.50 373.50 384.50 395.50 406.50 417.50 428.50 439.50 450.50 461.50 472.50 483.50" y="305.35" font-size="11.00" class="sc-notoserifcjksc">（首次尝试成功率，五次运行的平均值）。</text><text x="72.00" y="608.12" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.21 112.30 117.84" y="608.12" font-size="9.00" class="sc-lorabold">8.10.2.A]</text><text x="123.68 132.68 141.68 150.68" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">各模型在</text><text x="162.04 170.32 175.04" y="608.12" font-size="9.00" class="sc-lorabold">max</text><text x="182.34 191.34 200.34 209.34 218.34 227.34 236.34 245.34" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">推理强度下的外部</text><text x="335.48 344.48 353.48" y="608.12" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="362.48 368.77 371.21 375.80 381.18 386.56" y="608.12" font-size="9.00" class="sc-loraregular">Claude</text><text x="393.80 402.80 411.80" y="608.12" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="498.03" y="608.12" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="507.03 512.05 517.25" y="608.12" font-size="9.00" class="sc-loraregular">361</text><text x="522.89 531.89" y="608.12" font-size="9.00" class="sc-notoserifcjksc">个任</text><text x="72.00 81.00" y="619.82" font-size="9.00" class="sc-notoserifcjksc">务，</text><text x="90.00 93.28 98.87" y="619.82" font-size="9.00" class="sc-loraregular">100</text><text x="106.82 115.82 124.82 133.82 142.82 151.82 160.82 169.82 178.82 187.82" y="619.82" font-size="9.00" class="sc-notoserifcjksc">步）上以自适应思考和</text><text x="199.19 207.23 211.88" y="619.82" font-size="9.00" class="sc-loraregular">max</text><text x="219.01 228.01 237.01 246.01 255.01 264.02 273.02 282.02 291.02 300.02 309.02 318.02 327.02 336.02 345.02 354.02 363.02 372.02 381.02" y="619.82" font-size="9.00" class="sc-notoserifcjksc">推理强度进行评估。分数为五次运行平均的</text><text x="392.38 397.76 402.40 406.57 410.73 417.90" y="619.82" font-size="9.00" class="sc-loraregular">pass@1</text><text x="421.17" y="619.82" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="430.17 437.02 441.90 449.95 452.48 457.94" y="619.82" font-size="9.00" class="sc-loraregular">Gemini</text><text x="462.83" y="619.82" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="474.20 481.05 486.50" y="619.82" font-size="9.00" class="sc-loraregular">GPT</text><text x="494.63 503.63 512.63 521.63 530.63" y="619.82" font-size="9.00" class="sc-notoserifcjksc">模型的分数</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="631.52" font-size="9.00" class="sc-notoserifcjksc">取自已发布的结果。</text><a href="https://arxiv.org/abs/2404.07972" rel="noopener"><rect x="270.75" y="707.25" width="156.75" height="12.75" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="199.40" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="199.40" width="35.40" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="526.58" y="199.40" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="72.00" y="215.02" width="26.96" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="98.96" y="215.02" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="101.85" y="215.02" width="14.85" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="116.70" y="215.02" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="119.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="215.02" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="215.02" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="141.60" y="215.02" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="141.60" y="215.02" width="11.00" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="72.00 78.84 84.80 91.48 97.33 103.79 111.37 118.26" y="111.01" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="129.34 140.34 151.34 162.34 173.34 184.34" y="111.01" font-size="11.00" class="sc-notoserifcjksc">是一个程序化</text><text x="198.24 205.82 212.70" y="111.01" font-size="11.00" class="sc-loraregular">CAD</text><text x="223.79 234.79 245.79 256.79 267.79 278.79 289.79 300.79" y="111.01" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="314.68 318.69 323.27 326.05 332.40 339.23" y="111.01" font-size="11.00" class="sc-loraregular">17,900</text><text x="348.97 359.97 370.97 381.97 392.97 403.97 414.97" y="111.01" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="428.86 436.55 442.23 448.68 457.44 464.01 469.97 474.92" y="111.01" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="483.62 494.62 505.62 516.62 527.62" y="111.01" font-size="11.00" class="sc-notoserifcjksc">程序构建而</text><text x="72.00 83.00 94.00 105.00" y="126.63" font-size="11.00" class="sc-notoserifcjksc">成，涵盖</text><text x="118.89 122.90 129.73" y="126.63" font-size="11.00" class="sc-loraregular">106</text><text x="138.98 149.98 160.98 171.98 182.98 193.98 204.98 215.98 226.98 237.98 248.98 259.98 270.98 281.98 292.98 303.98 314.98" y="126.63" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="328.87 332.56 338.79" y="126.63" font-size="11.00" class="sc-loraregular">ISO</text><text x="347.53" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="358.53 366.61 370.30" y="126.63" font-size="11.00" class="sc-loraregular">DIN</text><text x="378.68" y="126.63" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="389.68 396.52" y="126.63" font-size="11.00" class="s  456.35 461.82 466.63 470.12 472.48" y="497.21" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="479.75" y="497.21" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="491.12 497.41 499.86 504.45 509.82 515.21" y="497.21" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 79.15 84.52 89.89 94.06 96.43 101.30 103.23" y="508.91" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="109.75 118.75 127.75 136.75" y="508.91" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="148.11" y="508.91" font-size="9.00" class="sc-loraregular">5</text><text x="155.38 164.38 173.38 182.38 191.38 200.38 209.38 218.38" y="508.91" font-size="9.00" class="sc-notoserifcjksc">次试验的平均值，</text><text x="227.38 233.68 236.12 240.71 246.09 251.47 256.35 258.71 263.82 269.08 274.54 280.01 284.82 288.31 290.67 295.55 297.68" y="508.91" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="305.24" y="508.91" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="316.61 322.90 325.35 329.94 335.31 340.70 345.57 347.94 355.09 360.46 365.83 370.00 372.37 377.24 379.46" y="508.91" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="386.88 395.88 404.88 413.88 422.88 431.88 440.88 449.88 458.88 467.88 476.88" y="508.91" font-size="9.00" class="sc-notoserifcjksc">的得分为单次试验结果。</text><text x="121.57" y="551.07" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46 143.60 149.20 153.46 159.13 165.53 170.30 173.39 179.24 185.15" y="551.07" font-size="11.00" class="sc-loraregular">Databricks</text><text x="193.13 204.13 215.13 226.13 237.13 248.13 259.13 270.13 281.13 292.13 303.13 314.13 325.13 336.13 347.13 358.13 369.13 380.13 391.13 402.13 413.13 424.13" y="551.07" font-size="11.00" class="sc-notoserifcjksc">发布的一项公开基准测试，评估模型在由大量历史</text><text x="438.02 444.90 449.59 455.53 461.20 466.29 472.86 477.81" y="551.07" font-size="11.00" class="sc-loraregular">Treasury</text><text x="72.00 78.76 85.33 88.32 91.32 97.20 101.46 104.55" y="566.69" font-size="11.00" class="sc-loraregular">Bulletin</text><text x="111.23 122.23 133.23 144.23 155.23 166.23 177.23 188.23 199.23 210.23 221.23 232.23 243.23 254.23 265.23 276.23 287.23 298.23 309.23 320.23 331.23 342.23 353.23 364.23 375.23 386.23 397.23 408.23 419.23 430.23 441.23 452.23 463.23 474.23 485.23 496.23 507.23 518.23 529.23" y="566.69" font-size="11.00" class="sc-notoserifcjksc">（美国财政部公报）文档构成的语料上进行端到端有据推理的能力。模型必须在整个语料</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="582.31" font-size="11.00" class="sc-notoserifcjksc">中定位相关表格，并基于这些表格进行精确的数值推理。我们以智能体方式进行评估：文档以提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="597.93" font-size="11.00" class="sc-notoserifcjksc">取后的文本形式提供于沙箱化的环境中，并提供代码执行工具；</text><text x="450.25 461.25 472.25 483.25 494.25 505.25 516.25 527.25" y="597.93" font-size="11.00" class="sc-notoserifcjksc">是推荐用于前沿模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="613.55" font-size="11.00" class="sc-notoserifcjksc">型的、难度更高的</text><text x="162.89 166.90 173.02" y="613.55" font-size="11.00" class="sc-loraregular">133</text><text x="182.04 193.04 204.04 215.04 226.04 237.04 248.04 259.04 270.04 281.04 292.04 303.04 314.04 325.04 336.04 347.04 358.04 369.04 380.04 391.04 402.04 413.04 424.04 435.04 446.04 457.04 468.04 479.04 490.04 501.04 512.04 523.04" y="613.55" font-size="11.00" class="sc-notoserifcjksc">题子集。得分采用精确匹配（五次试验的平均值），耗尽输出预算的回合</text><text x="72.00 83.00 94.00 105.00 116.00" y="629.17" font-size="11.00" class="sc-notoserifcjksc">记为错误。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="680.60" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="680.60" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="221.70 232.70 243.70" y="680.60" font-size="11.00" class="sc-notoserifcjksc">上达到</text><text x="257.59 262.66 268.79 271.50 277.62" y="680.60" font-size="11.00" class="sc-loraregular">73.3%</text><text x="287.19 298.19" y="680.60" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="382.33 393.33 404.33" y="680.60" font-size="11.00" class="sc-notoserifcjksc">上达到</text><text x="418.23 424.22 430.40 433.11 439.07" y="680.60" font-size="11.00" class="sc-loraregular">59.4%</text><text x="448.64 459.64" y="680.60" font-size="11.00" class="sc-notoserifcjksc">，较</text><text x="473.53 481.22 484.21 489.82 496.39 502.97" y="680.60" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="696.22" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98" y="696.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="136.98 143.34 149.52 151.87 156.94" y="696.22" font-size="11.00" class="sc-loraregular">68.7%</text><text x="169.40" y="696.22" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="183.30 189.29 195.42 198.13 204.09" y="696.22" font-size="11.00" class="sc-loraregular">53.4%</text><text x="213.66 224.66 235.66 246.66 257.66 268.66 279.66 290.66 301.66 312.66 323.66 334.66 345.66 356.66 367.66 378.66 389.66 400.66 411.66 422.66 433.66 444.66 455.66" y="696.22" font-size="11.00" class="sc-notoserifcjksc">）有所提升。两个模型都会产生很长的推理，在最高</text><a href="https://www.databricks.com/blog/introducing-officeqa-benchmark-end-to-end-grounded-reasoning" rel="noopener"><rect x="72.00" y="542.27" width="46.67" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">推理强度下，有一部分回合（约</text><text x="228.89 235.25 241.74 245.75 251.74" y="82.63" font-size="11.00" class="sc-loraregular">9–15%</text><text x="261.31 272.31 283.31 294.31 305.31 316.31 327.31 338.31 349.31 360.31 371.31 382.31 393.31 404.31 415.31 426.31 437.31 448.31 459.31 470.31 481.31 492.31 503.31 514.31 525.31" y="82.63" font-size="11.00" class="sc-notoserifcjksc">）在给出最终答案之前就达到了每轮输出上限；这些回合</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">记为错误，因此相关数值是保守的。</text><text x="121.57 132.57 143.57 154.57 165.57 176.57 187.57 198.57 209.57 220.57 231.57 242.57 253.57 264.57 275.57 286.57 297.57 308.57 319.57 330.57 341.57 352.57 363.57 374.57" y="131.20" font-size="11.00" class="sc-notoserifcjksc">得分对评估运行框架高度敏感：要求模型直接解析原始</text><text x="388.46 395.07 403.16" y="131.20" font-size="11.00" class="sc-loraregular">PDF</text><text x="412.08 423.08 434.08 445.08 456.08 467.08 478.08 489.08 500.08 511.08 522.08" y="131.20" font-size="11.00" class="sc-notoserifcjksc">语料的设置会使所有模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="146.82" font-size="11.00" class="sc-notoserifcjksc">的绝对得分大幅降低，跨报告比较时应考虑这一点。</text><text x="72.00 78.83 84.77 90.45 93.44 98.82 109.33 115.77 120.49 123.48 130.06 132.95 138.92 142.02 148.69 154.37 161.05 166.84 172.80 175.70 181.25" y="222.20" font-size="11.00" class="sc-loraregular">Real-World Finance v2</text><text x="190.05 201. -size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="458.16" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.35 110.45 115.98" y="458.16" font-size="9.00" class="sc-lorabold">8.11.5.A]</text><text x="121.82 130.82 139.82 148.82 157.82 166.82 175.82 184.82 193.82" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">使用内部运行框架的</text><text x="205.19 210.58 215.68 220.73 223.54 228.22 231.94 237.53 240.34 245.43" y="458.16" font-size="9.00" class="sc-lorabold">Toolathlon</text><text x="253.54 262.54 271.54" y="458.16" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="280.54 289.54 298.54 307.54 316.54" y="458.16" font-size="9.00" class="sc-notoserifcjksc">各模型均在</text><text x="327.91 335.95 340.60" y="458.16" font-size="9.00" class="sc-loraregular">max</text><text x="347.73 356.73 365.73 374.73 383.73 392.73 401.73 410.73 419.73 428.73 437.73 446.73 455.73 464.73 473.73 482.73 491.73" y="458.16" font-size="9.00" class="sc-notoserifcjksc">推理强度下使用自适应思考进行评估。</text><text x="500.73 506.12 510.77 514.94 519.10 526.27" y="458.16" font-size="9.00" class="sc-loraregular">Pass@1</text><text x="529.54" y="458.16" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00 77.39 82.04 86.20 90.37 97.53" y="469.86" font-size="9.00" class="sc-loraregular">Pass@3</text><text x="104.91" y="469.86" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="116.28 121.67 126.32 130.48 134.65" y="469.86" font-size="9.00" class="sc-loraregular">Pass³</text><text x="140.35 149.35 158.35 167.35 176.35 185.35 194.35 203.35 212.35 221.35 230.35 239.35 248.35" y="469.86" font-size="9.00" class="sc-notoserifcjksc">按论文的评估方案，基于全部</text><text x="259.71 262.99 268.58" y="469.86" font-size="9.00" class="sc-loraregular">108</text><text x="276.00 285.00 294.00 303.00 312.00 321.00" y="469.86" font-size="9.00" class="sc-notoserifcjksc">项任务、每项</text><text x="332.37" y="469.86" font-size="9.00" class="sc-loraregular">3</text><text x="339.75 348.75 357.75 366.75 375.75 384.75" y="469.86" font-size="9.00" class="sc-notoserifcjksc">次试验计算。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="497.22" font-size="11.00" class="sc-notoserifcjksc">关于与已发布排行榜可比性的说明。我们的运行框架复刻了上游的任务定义、提示词和基于执行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="512.84" font-size="11.00" class="sc-notoserifcjksc">的检查器，并通过重放已发布的</text><text x="228.89 234.75 237.74 243.35 249.91 256.49 262.45 267.83 272.93 279.36 286.04 292.72 298.60 302.86 308.24 314.20 316.90" y="512.84" font-size="11.00" class="sc-loraregular">claude-sonnet-4.5</text><text x="325.79 336.79 347.79 358.79 369.79 380.79 391.79 402.79 413.79 424.79 435.79 446.79 457.79 468.79 479.79 490.79 501.79 512.79 523.79" y="512.84" font-size="11.00" class="sc-notoserifcjksc">轨迹进行了验证。为控制自已发布轨迹以来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="528.46" font-size="11.00" class="sc-notoserifcjksc">的实时依赖漂移和上游仓库变更，我们将金融数据源和容器镜像固定到离线快照，并镜像当前的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="544.08" font-size="11.00" class="sc-notoserifcjksc">上游状态。按已发布的版本，大约四分之一的任务无法完成；我们对这些任务未作改动。固定版</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="559.70" font-size="11.00" class="sc-notoserifcjksc">本的净效应：我们的得分比严格与上游等价的运行框架高约</text><text x="360.89" y="559.70" font-size="11.00" class="sc-loraregular">3</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="575.32" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29" y="575.32" font-size="11.00" class="sc-notoserifcjksc">模型之间保持不变。另外，已发布排行榜中</text><text x="322.18 330.92 337.48 344.05 349.14 352.04 358.00 360.35" y="575.32" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="575.32" font-size="11.00" class="sc-notoserifcjksc">的数据采用的是作者的默认配置，</text><text x="72.00 83.00" y="590.94" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="96.89 106.73 112.40" y="590.94" font-size="11.00" class="sc-loraregular">max</text><text x="121.13 132.13 143.13 154.13 165.13" y="590.94" font-size="11.00" class="sc-notoserifcjksc">推理强度。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="72.00 78.89 85.45 89.71 96.15 105.98 111.58 115.84 118.93 125.36 131.97 138.81 144.78 151.45 157.31" y="110.82" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="163.89 167.57" y="107.15" font-size="6.60" class="sc-loraregular">31</text><text x="172.87" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="186.76 193.47 199.14 205.71 208.80 214.76" y="110.82" font-size="11.00" class="sc-loraregular">Zapier</text><text x="222.42 233.42 244.42 255.42 266.42 277.42 288.42 299.42 310.42 321.42 332.42 343.42 354.42 365.42 376.42 387.42 398.42 409.42 420.42 431.42 442.42 453.42 464.42 475.42 486.42 497.42 508.42 519.42" y="110.82" font-size="11.00" class="sc-notoserifcjksc">推出的一项基准测试，衡量智能体能否完成贴近现实的端到端业</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">务工作流。任务基于真实客户在销售、市场营销、运营、客户支持、财务和人力资源领域的工作</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">流模式构建。每项任务都将智能体置于一家模拟公司中，该公司拥有数十个</text><text x="437.89 444.80 451.64 457.88 464.92 467.81 474.70 481.31" y="142.06" font-size="11.00" class="sc-loraregular">REST API</text><text x="487.89 498.89 509.89 520.89" y="142.06" font-size="11.00" class="sc-notoserifcjksc">端点，覆</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">盖</text><text x="85.89 91.86" y="157.68" font-size="11.00" class="sc-loraregular">47</text><text x="99.82 110.82 121.82 132.82" y="157.68" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="143.82 151.51 158.42" y="157.68" font-size="11.00" class="sc-loraregular">CRM</text><text x="168.51" y="157.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="179.51 185.75 188.74 194.42 200.27" y="157.68" font-size="11.00" class="sc-loraregular">Slack</text><text x="206.18" y="157.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="217.18 225.55 231.98 238.42 244.77 247.76 253.72 256.61 267.13 273.56 278.28 284.19 289.28 295.85 301.53 307.32" y="157.68" font-size="11.00" class="sc-loraregular">Google Workspace</text><text x="316.18 327.18 338.18 349.18 360.18 371.18 382.18 393.18 404.18 415.18 426.18 437.18 448.18 459.18 470.18 481.18 492.18 503.18 514.18 525.18" y="157.68" font-size="11.00" class="sc-notoserifcjksc">等）。在仅给出一条自然语言指令的情况下，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="173.30" font-size="11.00" class="sc-notoserifcjksc">智能体必须通过搜索自主发现正确的端点，进行数十次顺序执行、相互依赖的</text><text x="448.89 455.78 462.39" y="173.30" font-size="11.00" class="sc-loraregular">API</text><text x="468.97 479.97 490.97 501.97 512.97 523.97" y="173.30" font-size="11.00" class="sc-notoserifcjksc">调用，查阅并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="188.92" font-size="11.00" class="sc-notoserifcjksc">遵守分层业务政策文档，同时避开刻意设置的干扰项。每项任务的评分为通过或不通过，依据是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="204.54" font-size="11.00" class="sc-notoserifcjksc">否满足针对模拟应用状态的所有确定性断言（例如，是否应用了正确的</text><text x="415.89 423.58 430.49" y="204.54" font-size="11.00" class="sc-loraregular">CRM</text><text x="443.48 454.48 465.48 476.48" y="204.54" font-size="11.00" class="sc-notoserifcjksc">更新）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="289.16" font-size="11.00" class="sc-notoserifcjksc">在衡量私有留出评估集表现的</text><text x="217.89 224.78 231.35 235.60 242.04 251.87 257.47 261.73 264.82 271.25 277.87 284.71 290.67 297.35 303.20" y="289.16" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="312.68 323.68 334.68 345.68 356.68" y="289.16" font-size="11.00" class="sc-notoserifcjksc">排行榜上，</text><text x="367.68 375.37 378.36 383.97 390.54 397.12 403.08 405.97 412.21 418.64 425.32 432.00 437.88 442.14 445.03" y="289.16" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="451.03" y="289.16" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="462.03 471.86 477.54" y="289.16" font-size="11.00" class="sc-loraregular">max</text><text x="486.26 497.26 508.26" y="289.16" font-size="11.00" class="sc-notoserifcjksc">推理强</text><text x="72.00 83.00 94.00 105.00 116.00" y="304.78" font-size="11.00" class="sc-notoserifcjksc">度）得分为</text><text x="129.89 133.90 140.02 142.73 148.73" y="304.78" font-size="11.00" class="sc-loraregular">13.5%</text><text x="158.29 169.29" y="304.78" font-size="11.00" class="sc-notoserifcjksc">，较</text><text x="183.19 190.88 193.87 199.48 206.05 212.62 218.59 221.48 227.72 234.15 240.83 247.51 253.39 257.65 260.54 266.50 269.10" y="304.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="275.46" y="304.78" font-size="11.00" class="sc-notoserifcjk .30 144.30 158.30 172.30" y="442.07" font-size="14.00" class="sc-notosanscjkscbold">生命科学能力</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="468.64" font-size="11.00" class="sc-notoserifcjksc">在生命科学能力方面，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 226.53 232.96 239.64 246.32 252.20 256.46 259.35" y="468.64" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="268.24 279.24 290.24 301.24" y="468.64" font-size="11.00" class="sc-notoserifcjksc">大幅优于</text><text x="315.13 322.82 325.81 331.42 337.99 344.57 350.53 353.42 359.66 366.10 372.77 379.45 385.34 389.59 392.49 398.45 401.04" y="468.64" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="407.40 418.40 429.40 440.40 451.40 462.40 473.40" y="468.64" font-size="11.00" class="sc-notoserifcjksc">，平均表现接近</text><text x="487.29 494.98 497.98 503.58 510.15 516.73" y="468.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="484.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="116.70 127.70 138.70 149.70" y="484.26" font-size="11.00" class="sc-notoserifcjksc">，但低于</text><text x="163.60 171.29 174.28 179.89 186.46 193.03 198.99 201.89 211.82 217.68 221.94 228.53 234.97 240.06 242.95" y="484.26" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="248.95 259.95 270.95 281.95 292.95 303.95 314.95 325.95 336.95 347.95 358.95 369.95 380.95 391.95 402.95 413.95 424.95 435.95 446.95 457.95 468.95 479.95 490.95 501.95 512.95 523.95" y="484.26" font-size="11.00" class="sc-notoserifcjksc">。我们报告了多个领域的评估结果，包括计算生物学、结构</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="499.88" font-size="11.00" class="sc-notoserifcjksc">生物学、有机化学和实验方案故障排查。这些评估中有许多由领域专家在内部开发，侧重于推动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="515.50" font-size="11.00" class="sc-notoserifcjksc">基础研究和药物研发中有益应用的能力，与第</text><text x="294.89 300.80 303.51" y="515.50" font-size="11.00" class="sc-loraregular">2.2</text><text x="312.31 323.31 334.31 345.31 356.31 367.31 378.31 389.31 400.31 411.31" y="515.50" font-size="11.00" class="sc-notoserifcjksc">节中侧重于滥用潜力的</text><text x="425.20 432.89" y="515.50" font-size="11.00" class="sc-loraregular">CB</text><text x="442.62 453.62 464.62 475.62 486.62" y="515.50" font-size="11.00" class="sc-notoserifcjksc">风险评估（</text><text x="497.62 505.31 512.15 515.05 519.81 522.90 527.99" y="515.50" font-size="11.00" class="sc-loraregular">CB risk</text><text x="72.00 77.68 82.77 87.86 93.82 98.92 104.01 113.84 119.81 126.38" y="531.12" font-size="11.00" class="sc-loraregular">assessment</text><text x="130.64 141.64 152.64 163.64 174.64 185.64" y="531.12" font-size="11.00" class="sc-notoserifcjksc">）形成互补。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="598.18" font-size="11.00" class="sc-notoserifcjksc">尽管其中许多评估并未公开发布，我们在下文对每一项作简要介绍。</text><text x="72.00 78.75 81.85 88.05 97.98 103.79 108.88 113.14 119.10 124.05 129.66 136.50 142.47 149.14 154.99" y="672.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">BioMysteryBench</text><text x="164.48 175.48 186.48 197.48 208.48 219.48 230.48 241.48 252.48 263.48 274.48 285.48 296.48 307.48 318.48 329.48 340.48 351.48 362.48 373.48 384.48 395.48 406.48 417.48 428.48 439.48 450.48 461.48 472.48 483.48 494.48 505.48 516.48 527.48" y="672.99" font-size="11.00" class="sc-notoserifcjksc">评估模型解决高难度分析难题的能力，这些难题要求将计算分析与生物学推理</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="688.61" font-size="11.00" class="sc-notoserifcjksc">交织进行。给定未经处理的数据集，模型必须回答诸如从……中识别被敲除的基因之类的问题</text><a href="https://www.anthropic.com/research/Evaluating-Claude-For-Bioinformatics-With-BioMysteryBench" rel="noopener"><rect x="72.00" y="664.19" width="89.58" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">（指从转录组数据中识别），或确定样本感染了何种病毒。对于该基准测试，我们报告独立人类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">专家能够解决的问题子集（</text><text x="204.00 208.40 216.77 223.34 233.17 238.85 245.53 248.42 254.66 261.09 264.04 269.48 275.16 281.56 284.55 290.30" y="98.25" font-size="11.00" class="sc-loraregular">“Human Solvable”</text><text x="294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="98.25" font-size="11.00" class="sc-notoserifcjksc">），以及人类尚未解决但具有客观、真实标准答案</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的问题子集（</text><text x="227.89 238.89" y="113.87" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00" y="189.82" font-size="11.00" class="sc-notoserifcjksc">这些评估由</text><text x="129.89 136.49 142.09 146.35 152.20 158.72 165.48 168.57" y="189.82" font-size="11.00" class="sc-loraregular">LatchBio</text><text x="177.90 188.90 199.90 210.90 221.90 232.90 243.90 254.90 265.90 276.90 287.90 298.90 309.90 320.90 331.90 342.90 353.90 364.90 375.90 386.90 397.90 408.90 419.90 430.90 441.90 452.90 463.90 474.90" y="189.82" font-size="11.00" class="sc-notoserifcjksc">开发，评估解决具有挑战性的真实世界生物信息学问题的能力。</text><text x="72.00 78.17 84.74 90.34 94.59 97.69 103.36 106.27 113.11 119.07 125.75 131.60" y="205.44" font-size="11.00" class="sc-loraregular" fill="#0000ff">SpatialBench</text><text x="183.88 194.88 205.88 216.88 227.88" y="205.44" font-size="11.00" class="sc-notoserifcjksc">变体在一组</text><text x="241.77 245.78 249.78" y="205.44" font-size="11.00" class="sc-loraregular">115</text><text x="258.67 269.67 280.67 291.67 302.67 313.67 324.67 335.67 346.67 357.67 368.67 379.67 390.67 401.67 412.67 423.67 434.67 445.67 456.67 467.67 478.67 489.67 500.67 511.67 522.67" y="205.44" font-size="11.00" class="sc-notoserifcjksc">个经外部验证的问题上测试对空间转录组学数据的分析，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="221.06" font-size="11.00" class="sc-notoserifcjksc">要求模型根据这些分析结果回答有关样本的生物学问题。</text><text x="347.00 353.17 356.26 362.94 369.29 372.28 378.24 385.93 391.89 394.88 397.79 404.63 410.59 417.27 423.12" y="221.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">SingleCellBench</text><text x="432.60 443.60 454.60" y="221.06" font-size="11.00" class="sc-notoserifcjksc">变体在</text><text x="468.50 472.50 478.86" y="221.06" font-size="11.00" class="sc-loraregular">195</text><text x="487.75 498.75 509.75 520.74" y="221.06" font-size="11.00" class="sc-notoserifcjksc">个问题上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="236.68" font-size="11.00" class="sc-notoserifcjksc">测试对单细胞</text><text x="140.89 147.80 156.18" y="236.68" font-size="11.00" class="sc-loraregular">RNA</text><text x="165.96 176.96 187.96 198.96 209.96 220.96 231.96 242.96 253.96 264.96 275.96 286.96 297.96 308.96 319.96 330.96 341.96 352.96 363.96 374.96 385.96 396.96 407.96 418.96 429.96 440.96 451.96 462.96 473.96 484.96 495.96 506.96 517.96 528.96" y="236.68" font-size="11.00" class="sc-notoserifcjksc">测序数据的分析，这些问题涵盖标注细胞类型、寻找差异表达基因和校正批次</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="252.30" font-size="11.00" class="sc-notoserifcjksc">效应等标准工作流程。</text><text x="72.00 80.36 83.74 88.44 97.04 100.42" y="317.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.3</text><text x="111.30 124.30 137.30 150.30 163.30 176.30 189.30 202.30" y="317.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">开放式结构生物学</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="345.59" font-size="11.00" class="sc-notoserifcjksc">我们评估了模型理解生物分子结构与功能之间关系的能力。在仅给定结构数据和基础工具的情况</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="361.21" font-size="11.00" class="sc-notoserifcjksc">下，模型必须回答有关某一生物分子功能的开放式问题。</text><text x="72.00 78.67 83.35 89.79 94.04 100.01 103.10 109.64 118.01 123.82" y="436.59" font-size="11.00" class="sc-loraregular" fill="#0000ff">ProteinGym</text><text x="136.55 147.55 158.55 169.55 180.55 191.55 202.55 213.55 224.55 235.55 246.55 257.55 268.55 279.55 290.55 301.55 312.55 323.55 334.55 345.55 356.55" y="436.59" font-size="11.00" class="sc-notoserifcjksc">基准测试评估模型预测蛋白质突变效应的能力。</text><text x="72.00 80.36 83.74 88.44 97.04 100.42" y="483.50" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.14.5</text><text x="111.88 124.88 137.88 150.88" y="483.50" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有机化学</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="527.02" font-size="11.00" class="sc-notoserifcjksc">预测反应产物，以及在</text><text x="184.89 188.58 196.85 203.14 209.97" y="527.02" font-size="11.00" class="sc-loraregular">IUPAC</text><text x="220.56 231.56 242.56" y=
