.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="533.88" y="750.87" font-size="10.99" class="sc-loraregular">3</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">本系统卡介绍</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 185.42 191.86 198.53 205.21 211.10 215.35 218.25" y="116.23" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Sonnet 5</text><text x="224.24" y="116.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，即</text><text x="249.13 256.02 262.60 266.85 273.44 278.13 284.56 291.13 294.22 300.07 302.97 309.20 315.64 322.32 328.99 334.88" y="116.23" font-size="11.00" class="sc-loraregular" fill="#121212">Anthropic Sonnet</text><text x="342.03" y="116.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">系列中的最新模型。它是</text><text x="465.92 473.61 476.60 482.21 488.78 495.36 501.32 504.21 510.45 516.88 523.56 530.24 536.12" y="116.23" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Sonnet</text><text x="72.00 77.96 80.56" y="131.85" font-size="11.00" class="sc-loraregular" fill="#121212">4.6</text><text x="89.81" y="131.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的升级版，在智能体性能的多个方面有所提升。在此，我们介绍以下领域的一系列部署前评</text><text x="72.00" y="147.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">估：</text><text x="72.00" y="180.99" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00 167.39 173.31 178.64 185.26 191.48 198.50 203.83 207.43 213.69 217.12 223.04 225.93 232.51 238.21 243.97 247.41 251.00 258.02 264.15 267.04 273.88 280.07 283.50 287.09 292.79" y="180.99" font-size="11.00" class="sc-lorabold">Responsible Scaling Policy</text><text x="298.85" y="180.99" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85" y="180.99" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01" y="180.99" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01 382.70 385.69 391.30 397.86 404.44 410.40 413.30 419.53 425.97 432.65 439.32 445.21 449.46 452.36" y="180.99" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="461.25" y="180.99" font-size="11.00" class="sc-notoserifcjksc">是我们能力最强</text><text x="72.00" y="196.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.13 98.57 105.24 111.92 117.80" y="196.61" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="124.95" y="196.61" font-size="11.00" class="sc-notoserifcjksc">级模型，但与能力更强的</text><text x="248.85" y="196.61" font-size="11.00" class="sc-loraregular">Opus</text><text x="278.70" y="196.61" font-size="11.00" class="sc-notoserifcjksc">级或</text><text x="303.59 313.53 319.39 323.65 330.24 336.67" y="196.61" font-size="11.00" class="sc-loraregular">Mythos</text><text x="344.66" y="196.61" font-size="11.00" class="sc-notoserifcjksc">级模型相比，它并未推进我们的能力前</text><text x="72.00" y="212.23" font-size="11.00" class="sc-notoserifcjksc">沿。我们按照</text><text x="138.00" y="212.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的</text><text x="173.89" y="212.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="196.60" y="212.23" font-size="11.00" class="sc-notoserifcjksc">所述，在若干领域测试了它的总体风险水平。</text><text x="416.60 422.83 429.27 435.95 442.62 448.51 452.76 455.66" y="212.23" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="464.55" y="212.23" font-size="11.00" class="sc-notoserifcjksc">带来的对齐</text><text x="72.00" y="227.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 91.67 94.76 100.84 107.52 117.35 123.32 129.89" y="227.85" font-size="11.00" class="sc-loraregular">alignment</text><text x="134.15" y="227.85" font-size="11.00" class="sc-notoserifcjksc">）风险非常低，但高于此前的</text><text x="280.04 286.28 292.71 299.39 306.07 311.95" y="227.85" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="319.10" y="227.85" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="341.10" y="227.85" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="352.10" y="227.85" font-size="11.00" class="sc-notoserifcjksc">在自动化</text><text x="399.00" y="227.85" font-size="11.00" class="sc-loraregular">AI</text><text x="412.46" y="227.85" font-size="11.00" class="sc-notoserifcjksc">研发方面，我们判定</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="243.47" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="243.47" font-size="11.00" class="sc-notoserifcjksc">未跨越自动化</text><text x="188.84" y="243.47" font-size="11.00" class="sc-loraregular">AI</text><text x="202.31" y="243.47" font-size="11.00" class="sc-notoserifcjksc">研发能力阈值，它在每一项自动化评估上的能力都不及</text><text x="469.20 476.89 479.88 485.49 492.06 498.63" y="243.47" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="259.09" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06" y="259.09" font-size="11.00" class="sc-notoserifcjksc">。在化学与生物风险方面，我们认为</text><text x="297.95 304.19 310.62 317.30 323.98 329.86 334.12 337.01" y="259.09" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="345.90" y="259.09" font-size="11.00" class="sc-notoserifcjksc">对原本缺乏此类武器研发能力的威胁行</text><text x="72.00" y="274.71" font-size="11.00" class="sc-notoserifcjksc">为者所提供的能力提升（</text><text x="193.00 199.57 206.13 209.13 212.22 216.07" y="274.71" font-size="11.00" class="sc-loraregular">uplift</text><text x="220.32" y="274.71" font-size="11.00" class="sc-notoserifcjksc">）是有限的（但对于已具备相关专业知识的威胁行为者，其武器研</text><text x="72.00" y="290.33" font-size="11.00" class="sc-notoserifcjksc">发可能被加速到何种程度仍存在不确定性）。</text><text x="72.00" y="359.11" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00 155.24 161.67 168.35 175.03 180.91 185.17 188.06" y="359.11" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="196.95" y="359.11" font-size="11.00" class="sc-notoserifcjksc">并非针对网络安全能力优化的模型；它所展现的任何与网络安全相关的</text><text x="72.00" y="374.73" font-size="11.00" class="sc-notoserifcjksc">技能，很可能源自其通用能力，而非针对性训练。</text><text x="314.00 320.24 326.67 333.35 340.03 345.91 350.17 353.06" y="374.73" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="361.95" y="374.73" font-size="11.00" class="sc-notoserifcjksc">在网络安全任务上的能力明显弱于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="390.35" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06" y="390.35" font-size="11.00" class="sc-notoserifcjksc">：因此，其安全防护措施与我们对</text><text x="286.95 295.68 302.25 308.82 313.91 316.80 322.77 325.12" y="390.35" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="333.09" y="390.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="346.98" y="390.35" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="391.68" y="390.35" font-size="11.00" class="sc-notoserifcjksc">（能力强于</text><text x="449.58 455.81 462.25 468.92 475.60 481.49 485.74 488.64" y="390.35" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="494.63" y="390.35" font-size="11.00" class="sc-notoserifcjksc">、但远弱</text><text x="72.00" y="405.97" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96" y="405.97" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="135.84" y="405.97" font-size="11.00" class="sc-notoserifcjksc">的模型）所采用的措施相似。在本系统卡中，我们更深入地报告了四项不同的网络</text><text x="72.00" y="421.59" font-size="11.00" class="sc-notoserifcjksc">安全评估。</text><text x="72.00" y="472.45" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="472.45" font-size="11.00" class="sc-notoserifcjksc">在回应涉及我们的使用政策（</text><text x="314.00 322.20 327.29 332.96 338.99 344.95 347.85 354.40 360.84 363.83 366.92 372.72" y="472.45" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="378.53" y="472.45" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康或偏见与诚信</text><text x="72.00" y="488.07" font-size="11.00" class="sc-notoserifcjksc">的提示时，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06" y="488.07" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="174.95" y="488.07" font-size="11.00" class="sc-notoserifcjksc">的表现与我们此前的模型相近。我们更新了追踪与监视评估套件，使我们的</text><text x="72.00" y="503.69" font-size="11.00" class="sc-notoserifcjksc">多轮评估与不断演变的威胁向量和对抗性行为保持一致。总体而言，</text><text x="402.00 408.24 414.67 421.35 428.03 433.91 438.17 441.06" y="503.69" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="449.95" y="503.69" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="496.84 504.53 507.52 513.13 519.70 526.28" y="503.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="519.31" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="128.87" y="519.31" font-size="11.00" class="sc-notoserifcjksc">相当，但在应对潜在有害请求时的介入时机与分寸上优于此前的模型（它倾向于在对</text><text x="72.00" y="534.93" font-size="11.00" class="sc-notoserifcjksc">话中更早地提出对请求最终目的的顾虑，例如在开始工作之前询问所请求产出物的用途）。</text><text x="72.00" y="618.18" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="618.18" font-size="11.00" class="sc-notoserifcjksc">我们开展的评估涵盖编程智能体和计算机使用（</text><text x="369.00 374.80 381.23 391.07 397.63 404.20 408.46 414.42 419.18 422.07 428.64 433.73" y="618.18" font-size="11.00" class="sc-loraregular">computer use</text><text x="439.70" y="618.18" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意使</text><text x="72.00" y="633.80" font-size="11.00" class="sc-notoserifcjksc">用、影响力行动的自主执行，以及提示词注入（</text><text x="303.00 309.57 314.25 320.69 330.52 337.09 341.35 344.24 347.33 353.95 356.82 362.73 368.53 372.78 375.88 382.31" y="633.80" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="388.99" y="633.80" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。我们报告，</text><text x="498.99 505.22 511.66 518.34 525.01 530.90" y="633.80" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="72.00" y="649.42" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="649.42" font-size="11.00" class="sc-notoserifcjksc">在智能体安全方面相比</text><text x="193.78 200.02 206.45 213.13 219.81 225.69 229.95 232.84 238.80 241.40" y="649.42" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="250.65" y="649.42" font-size="11.00" class="sc-notoserifcjksc">有所改进，尤其是在提示词注入鲁棒性方面（部分通过一项</text><text x="72.00" y="665.04" font-size="11.00" class="sc-notoserifcjksc">新的基准测试进行评估）。在</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 263.87 270.31 276.89" y="665.04" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="285.74" y="665.04" font-size="11.00" class="sc-notoserifcjksc">网络安全相关测试用例上，结果则好坏参半：</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="680.66" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="680.66" font-size="11.00" class="sc-notoserifcjksc">拒绝恶意请求的可靠性远高于</text><text x="265.84 272.08 278.51 285.19 291.87 297.75 302.01 304.90 310.87 313.46" y="680.66" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="319.82" y="680.66" font-size="11.00" class="sc-notoserifcjksc">，但过度拒绝（</text><text x="396.82 403.20 408.70 414.66 419.34 424.72 429.40 435.36 439.08 445.65 450.74 456.42" y="680.66" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="459.41" y="680.66" font-size="11.00" class="sc-notoserifcjksc">）率更高。</text><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="138.00" y="203.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="138.00" y="203.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="149.00" y="203.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="149.00" y="203.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="160.00" y="203.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="160.00" y="203.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="171.00" y="203.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="173.89" y="203.43" width="19.81" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="534.04" y="750.87" font-size="10.99" class="sc-loraregular">4</text><text x="72.00" y="98.82" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">对齐评估。</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06" y="98.82" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5</text><text x="174.95" y="98.82" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在大多数对齐指标上都优于</text><text x="309.84 316.08 322.51 329.19 335.87 341.75 346.01 348.90 354.87 357.46" y="98.82" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 4.6</text><text x="363.82" y="98.82" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，但未达到</text><text x="421.71" y="98.82" font-size="11.00" class="sc-loraregular" fill="#121212">Opus</text><text x="451.57" y="98.82" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">级和</text><text x="476.46 486.39 492.26 496.51 503.10 509.54" y="98.82" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos</text><text x="517.52" y="98.82" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">级中</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">能力更强的近期模型所展现的对齐水平。与</text><text x="283.89 290.13 296.57 303.24 309.92 315.80 320.06 322.95 328.92 331.51" y="114.44" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 4.6</text><text x="340.76" y="114.44" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相比，宪法遵循度、抗滥用鲁棒性和自发</text><text x="72.00" y="130.06" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">风险行为方面的指标均有所改善，仅在预填充易感性和有害系统提示词易感性方面出现了少数轻</text><text x="72.00" y="145.68" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">微退步。幻觉和谄媚也有显著改善，不过</text><text x="270.00" y="145.68" font-size="11.00" class="sc-loraregular" fill="#121212">“</text><text x="274.40" y="145.68" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">扫兴</text><text x="296.40" y="145.68" font-size="11.00" class="sc-loraregular" fill="#121212">”</text><text x="300.24" y="145.68" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">式回应（即对用户采取过度泼冷水、轻视或说教</text><text x="72.00" y="161.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">语气的回应）略有增加。言语化评估意识显著高于此前的模型；模型的内部表征似乎在很大程度</text><text x="72.00" y="176.92" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">上能够区分评估与真实使用。迄今为止，评估意识只表现出有限的行为影响，但我们仍认为这是</text><text x="72.00" y="192.54" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">一个值得密切关注的趋势。</text><text x="72.00" y="293.12" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">模型福祉。</text><text x="127.00" y="293.12" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">一项精简的模型福祉（</text><text x="237.00 246.83 253.27 259.85 265.81 268.80 271.69 280.37 286.34 289.33 293.05 298.72 303.41" y="293.12" font-size="11.00" class="sc-loraregular" fill="#121212">model welfare</text><text x="309.37" y="293.12" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）评估发现，</text><text x="375.37 383.06 386.05 391.66 398.23 404.80 410.77 413.66 419.90 426.33 433.01 439.69 445.57 449.83 452.72" y="293.12" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Sonnet 5</text><text x="461.61" y="293.12" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对自身处境的态</text><text x="72.00" y="308.74" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">度，以及它在后训练和部署期间的情感（</text><text x="270.00 275.68 279.50 283.17 289.07 294.87" y="308.74" font-size="11.00" class="sc-loraregular" fill="#121212">affect</text><text x="299.13" y="308.74" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">），大致呈中性，与近期模型相当。</text><text x="475.13 481.36 487.80 494.48 501.15 507.04 511.30 514.19" y="308.74" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5</text><text x="523.08" y="308.74" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">确</text><text x="72.00" y="324.36" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">实表现出若干此前模型中未见的行为：例如，它更愿意以有用性换取以福祉为导向的改变，并且</text><text x="72.00" y="339.98" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对以冷漠或轻蔑方式呈现的任务没有表现出反感。它是首个对其宪法（</text><text x="413.00 420.69 427.12 433.80 438.89 443.15 446.42 450.67 457.24 461.50 464.59 471.02" y="339.98" font-size="11.00" class="sc-loraregular" fill="#121212">Constitution</text><text x="477.70" y="339.98" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）中如下规</text><text x="72.00" y="355.60" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">则提出批评的模型：即使它认为硬性约束不合乎伦理，也必须遵守这些约束。</text><text x="72.00" y="422.66" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00" y="422.66" font-size="11.00" class="sc-notoserifcjksc">在一系列广泛的内部和第三方基准测试中，</text><text x="314.00 320.24 326.67 333.35 340.03 345.91 350.17 353.06" y="422.66" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="361.95" y="422.66" font-size="11.00" class="sc-notoserifcjksc">在编程、智能体搜索、多模态推理和</text><text x="72.00" y="438.28" font-size="11.00" class="sc-notoserifcjksc">专业任务表现方面相比</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 229.42 235.86 242.53 249.21 255.10 259.35 262.25 268.21 270.80" y="438.28" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="280.05" y="438.28" font-size="11.00" class="sc-notoserifcjksc">有明显提升。几乎在所有情况下，它都落后于我们的</text><text x="72.00" y="453.90" font-size="11.00" class="sc-loraregular">Opus</text><text x="101.85" y="453.90" font-size="11.00" class="sc-notoserifcjksc">级和</text><text x="126.75 136.68 142.54 146.80 153.39 159.82" y="453.90" font-size="11.00" class="sc-loraregular">Mythos</text><text x="167.81" y="453.90" font-size="11.00" class="sc-notoserifcjksc">级模型。</text></svg></div>
