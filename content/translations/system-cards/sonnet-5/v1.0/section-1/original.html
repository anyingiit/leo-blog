.sc-notoserifcjksc { font-family: "sc-notoserifcjksc"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p009.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 9 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60 97.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="118.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="118.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="172.13 179.02 185.60 189.85 196.44 201.13 207.56 214.13 217.22" y="118.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="225.97 236.97 247.97 258.97 269.97" y="118.23" font-size="11.00" class="sc-notoserifcjksc">推出的最新</text><text x="283.86 290.10 296.53 303.21 309.89 315.77" y="118.23" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="322.92 333.92 344.92 355.92 366.92 377.92" y="118.23" font-size="11.00" class="sc-notoserifcjksc">级模型。它是</text><text x="391.81 398.05 404.49 411.16 417.84 423.73 427.98 430.88 436.84 439.43" y="118.23" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="448.68 459.68 470.68 481.68 492.68 503.68 514.68 525.68" y="118.23" font-size="11.00" class="sc-notoserifcjksc">的升级版，在智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="133.85" font-size="11.00" class="sc-notoserifcjksc">体编程和专业工作方面均有提升。它在以往</text><text x="283.89 290.13 296.57 303.24 309.92 315.80" y="133.85" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95" y="133.85" font-size="11.00" class="sc-notoserifcjksc">模型优势的基础上，以</text><text x="435.85 442.08 448.52 455.20 461.87 467.76" y="133.85" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="474.91 485.91 496.91 507.91 518.91" y="133.85" font-size="11.00" class="sc-notoserifcjksc">的价格为编</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="149.47" font-size="11.00" class="sc-notoserifcjksc">程、智能体和日常专业工作带来接近</text><text x="250.89 259.63 266.19 272.76" y="149.47" font-size="11.00" class="sc-loraregular">Opus</text><text x="280.75 291.75 302.75 313.75 324.75 335.75" y="149.47" font-size="11.00" class="sc-notoserifcjksc">的智能水平。</text><text x="72.00 76.71 80.09" y="197.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1</text><text x="87.89 100.89 113.89 126.89 139.89 152.89 165.89" y="197.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="229.42" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24 169.24 180.24 191.24 202.24 213.24 224.24 235.24 246.24 257.24 268.24 279.24 290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24 389.24 400.24 411.24 422.24 433.24 444.24 455.24 466.24 477.24 488.24 499.24 510.24 521.24" y="229.42" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开和非</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="245.04" font-size="11.00" class="sc-notoserifcjksc">公开数据集，以及由其他模型生成的合成数据。在整个训练过程中，我们使用了多种数据清洗和</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="260.66" font-size="11.00" class="sc-notoserifcjksc">过滤方法，包括去重和分类。我们使用一个名为</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.12 347.96 354.39" y="260.66" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="361.54 372.54 383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="260.66" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="276.28" font-size="11.00" class="sc-notoserifcjksc">数据。对于网站运营者用来表明是否允许爬取其网站内容的</text><text x="358.00 362.40 367.09 373.52 379.92 386.36 390.61 395.71 398.28 402.67 408.50 412.76" y="276.28" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="276.28" font-size="11.00" class="sc-notoserifcjksc">指令，该爬虫遵循业界标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="291.90" font-size="11.00" class="sc-notoserifcjksc">准做法。我们不会访问受密码保护的页面，也不会访问需要登录或</text><text x="393.89 401.47 408.36 415.02 422.06 429.75 438.33" y="291.90" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="448.11 459.11 470.11 481.11 492.11 503.11 514.11 525.11" y="291.90" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="307.52" font-size="11.00" class="sc-notoserifcjksc">会对所使用的训练数据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="323.14" font-size="11.00" class="sc-notoserifcjksc">爬取了其网页，并向我们表明其偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="417.53" font-size="11.00" class="sc-notoserifcjksc">在预训练之后，</text><text x="149.00 155.24 161.67 168.35 175.03 180.91 185.17 188.06" y="417.53" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95 416.95 427.95 438.95 449.95 460.95 471.95" y="417.53" font-size="11.00" class="sc-notoserifcjksc">经历了严格的后训练和微调，目标是使其成为一个行为符合</text><text x="485.84 493.53 496.52 502.13 508.70 515.28" y="417.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="524.13" y="417.53" font-size="11.00" class="sc-notoserifcjksc">宪</text><text x="72.00 83.00" y="433.15" font-size="11.00" class="sc-notoserifcjksc">法（</text><text x="94.00 99.80 106.23 112.91 118.00 122.26 125.53 129.78 136.35 140.61 143.70 150.13" y="433.15" font-size="11.00" class="sc-loraregular">constitution</text><text x="156.81 167.81 178.81 189.81 200.81 211.81 222.81 233.81 244.81 255.81 266.81" y="433.15" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="277.81 285.50 288.49 294.10 300.67 307.25" y="433.15" font-size="11.00" class="sc-loraregular">Claude</text><text x="316.10 327.10 338.10 349.10 360.10 371.10 382.10 393.10 404.10 415.10 426.10 437.10 448.10 459.10 470.10 481.10 492.10 503.10 514.10 525.10" y="433.15" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="448.77" font-size="11.00" class="sc-notoserifcjksc">语言进行回复。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00 76.71 80.09" y="496.83" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2</text><text x="90.64 103.64 116.64 129.64 142.64" y="496.83" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="528.72" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="528.72" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00 83.00 94.00 105.00 116.00" y="544.34" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="544.34" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="544.34" font-size="11.00" class="sc-notoserifcjksc">只与符合以下条件的平台合作：认同我们为工作者提供公平且合乎道德的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="559.96" font-size="11.00" class="sc-notoserifcjksc">报酬的理念，并且无论身处何地都致力于践行安全的工作场所规范，遵循我们在采购合同中详细</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="575.58" font-size="11.00" class="sc-notoserifcjksc">规定的众包工作者福祉标准。</text><text x="72.00 76.71 80.09" y="640.40" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.3</text><text x="90.97 103.97 116.97 129.97 142.97 155.97 168.97" y="640.40" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">使用政策与支持</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="672.30" font-size="11.00" class="sc-notoserifcjksc">对于受适用监管制度约束的模型，我们已在我们的</text><text x="314.00 325.00 336.00 347.00 358.00 369.00" y="672.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="380.00" y="672.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="391.00 396.92 401.60 408.04 414.62 418.87 421.97 427.93 432.69 435.58 443.27 449.71 459.54 466.11 469.10 472.19 477.87 484.54 490.34" y="672.30" font-size="11.00" class="sc-loraregular">Frontier Compliance</text><text x="72.00 77.92 82.60 88.28 98.11 104.03 112.71 119.15 123.87" y="687.92" font-size="11.00" class="sc-loraregular">Framework</text><text x="129.77" y="687.92" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="140.77 145.17 151.12 158.81 164.84" y="687.92" font-size="11.00" class="sc-loraregular">“FCF”</text><text x="168.68 179.68 190.68 201.68 212.68 223.68 234.68 245.68 256.68 267.68 278.68 289.68 300.68 311.68 322.68 333.68 344.68 355.68 366.68 377.68 388.68 399.68 410.68 421.68 432.68" y="687.92" font-size="11.00" class="sc-notoserifcjksc">）中，正式确立了我们履行此类法规所规定义务的方式。</text><text x="443.68 449.63 457.32" y="687.92" font-size="11.00" class="sc-loraregular">FCF</text><text x="466.24 477.24 488.24 499.24 510.24 521.24" y="687.92" font-size="11.00" class="sc-notoserifcjksc">记录了我们当</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="703.54" font-size="11.00" class="sc-notoserifcjksc">前针对系统性风险的技术与组织规程</text><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="314.00" y="663.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="314.00" y="663.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="325.00" y="663.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="325.00" y="663.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="336.00" y="663.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="336.00" y="663.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="347.00" y="663.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="347.00" y="663.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="358.00" y="663.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="358.00" y="663.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources? <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p010.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 10 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">，涵盖各关键风险类别的评估与缓解。</text><text x="259.00 264.95 272.64" y="82.63" font-size="11.00" class="sc-loraregular">FCF</text><text x="281.56 292.56 303.56 314.56 325.56 336.56 347.56 358.56 369.56 380.56 391.56 402.56 413.56 424.56 435.56 446.56 457.56 468.56 479.56 490.56 501.56 512.56 523.56" y="82.63" font-size="11.00" class="sc-notoserifcjksc">是我们针对适用监管制度的合规框架，包括加利福尼</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">亚州的《前沿人工智能透明度法案》（</text><text x="259.00 266.04 271.65 278.54 282.22" y="98.25" font-size="11.00" class="sc-loraregular">TFAIA</text><text x="289.11 300.11 311.11 322.11 333.11 344.11 355.11 366.11 377.11 388.11 399.11 410.11 421.11 432.11 443.11 454.11 465.11 476.11 487.11 498.11 509.11 520.11" y="98.25" font-size="11.00" class="sc-notoserifcjksc">）和《欧盟人工智能法案》的《通用人工智能行为</text><text x="72.00 83.00 94.00 105.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">准则》。</text><text x="72.00 76.71 80.09" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.4</text><text x="91.77 104.77 117.77 130.77" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="177.63" font-size="11.00" class="sc-notoserifcjksc">在训练过程中的不同时间点会获取模型的不同</text><text x="292.00" y="177.63" font-size="11.00" class="sc-loraregular">“</text><text x="296.40 307.40" y="177
