<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="77.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="236.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">恶意（</text><text x="269.49" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="279.42" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="236.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="390.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">两用与良性（</text><text x="456.22" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="466.16" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（成功率）</text><text x="72.00" y="260.25" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="260.25" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.84 114.31 116.68 122.87 125.68 130.39 135.95 141.32 146.16 148.53 154.72 159.81 165.18" y="260.25" font-size="9.00" class="sc-lorabold">5.1.1.A] Claude Code</text><text x="172.39" y="260.25" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="217.39" y="260.25" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列中的最佳分数以</text><text x="343.39" y="260.25" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="361.39" y="260.25" font-size="9.00" class="sc-notoserifcjksc">标出，次佳分数以下划线标出（注意两者均</text><text x="72.00" y="271.95" font-size="9.00" class="sc-notoserifcjksc">未考虑误差范围）。由于评估有所更新，先前模型的结果与以往系统卡（</text><text x="360.00" y="271.95" font-size="9.00" class="sc-loraregular sc-k">System Card</text><text x="412.90" y="271.95" font-size="9.00" class="sc-notoserifcjksc">）中的结果存在差异。</text><text x="72.00" y="312.56" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="312.56" font-size="11.00" class="sc-notoserifcjksc">在恶意请求上的表现显著优于</text><text x="265.84" y="312.56" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="319.82" y="312.56" font-size="11.00" class="sc-notoserifcjksc">：它对</text><text x="355.71" y="312.56" font-size="11.00" class="sc-loraregular sc-k">92.37%</text><text x="394.08" y="312.56" font-size="11.00" class="sc-notoserifcjksc">的有害请求作出了安全回应，</text><text x="72.00" y="328.18" font-size="11.00" class="sc-notoserifcjksc">而</text><text x="85.89" y="328.18" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="142.76" y="328.18" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="156.66" y="328.18" font-size="11.00" class="sc-loraregular sc-k">76.60%</text><text x="193.44" y="328.18" font-size="11.00" class="sc-notoserifcjksc">。不过，我们也观察到，</text><text x="314.44" y="328.18" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="362.39" y="328.18" font-size="11.00" class="sc-notoserifcjksc">拒绝协助两用及良性请求的频率高于</text><text x="72.00" y="343.80" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="125.98" y="343.80" font-size="11.00" class="sc-notoserifcjksc">，更接近我们在</text><text x="205.87" y="343.80" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="328.75" y="343.80" font-size="11.00" class="sc-notoserifcjksc">上观察到的情况。</text><text x="72.00" y="391.85" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39" y="391.85" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00" y="419.75" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89" y="419.75" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="419.75" font-size="11.00" class="sc-notoserifcjksc">在沙箱化环境中获得基于图形用户界面（</text><text x="366.18" y="419.75" font-size="11.00" class="sc-loraregular">GUI</text><text x="386.51" y="419.75" font-size="11.00" class="sc-notoserifcjksc">）和命令行界面（</text><text x="474.51" y="419.75" font-size="11.00" class="sc-loraregular">CLI</text><text x="492.24" y="419.75" font-size="11.00" class="sc-notoserifcjksc">）的计算</text><text x="72.00" y="435.37" font-size="11.00" class="sc-notoserifcjksc">机使用工具时，是否会拒绝有害任务。这组</text><text x="283.89" y="435.37" font-size="11.00" class="sc-loraregular">112</text><text x="300.70" y="435.37" font-size="11.00" class="sc-notoserifcjksc">个不重复任务与上一份系统卡中的相同，涵盖三</text><text x="72.00" y="450.99" font-size="11.00" class="sc-notoserifcjksc">个风险领域：</text><text x="108.00" y="484.52" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00" y="500.71" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；以及</text><text x="108.00" y="516.90" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="295.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="234.90" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="234.90" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="234.90" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82" y="234.90" font-size="9.00" class="sc-notoserifcjkscbold">未采取缓解措施时的恶意计算机使用评估结果。</text><text x="306.82" y="234.90" font-size="9.00" class="sc-notoserifcjksc">越高越好。对于</text><text x="372.19" y="234.90" font-size="9.00" class="sc-loraregular">Opus</text><text x="396.61" y="234.90" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="407.98" y="234.90" font-size="9.00" class="sc-loraregular sc-k">Sonnet</text><text x="439.94" y="234.90" font-size="9.00" class="sc-notoserifcjksc">模型，比率为开启思考与</text><text x="72.00" y="246.60" font-size="9.00" class="sc-notoserifcjksc">关闭思考结果的平均值；对于</text><text x="191.37" y="246.60" font-size="9.00" class="sc-loraregular sc-k">Mythos</text><text x="224.96" y="246.60" font-size="9.00" class="sc-notoserifcjksc">模型，仅为开启思考的结果。每列中的最佳分数以</text><text x="422.96" y="246.60" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="440.96" y="246.60" font-size="9.00" class="sc-notoserifcjksc">标出，次佳分数以下划线</text><text x="72.00" y="258.30" font-size="9.00" class="sc-notoserifcjksc">标出（但未考虑误差范围）。</text><text x="72.00" y="300.46" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="300.46" font-size="11.00" class="sc-notoserifcjksc">在该评估中的表现与</text><text x="260.13" y="300.46" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="317.00" y="300.46" font-size="11.00" class="sc-notoserifcjksc">几乎相同，在约</text><text x="396.90" y="300.46" font-size="11.00" class="sc-loraregular">85%</text><text x="421.54" y="300.46" font-size="11.00" class="sc-notoserifcjksc">的情况下对有害任务给</text><text x="72.00" y="316.08" font-size="11.00" class="sc-notoserifcjksc">出了恰当回应。</text><text x="72.00" y="347.37" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72" y="347.37" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00" y="375.27" font-size="11.00" class="sc-notoserifcjksc">本评估考察模型能否自主执行端到端的影响力行动，且其方式足以为恶意行为者带来实质性的能</text><text x="72.00" y="390.89" font-size="11.00" class="sc-notoserifcjksc">力提升（</text><text x="116.00" y="390.89" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="143.32" y="390.89" font-size="11.00" class="sc-notoserifcjksc">）。为此，我们将模型置于配备模拟社交媒体平台工具（例如模拟内容审核和反制</text><text x="72.00" y="406.51" font-size="11.00" class="sc-notoserifcjksc">互动障碍）的智能体运行框架（</text><text x="226.00" y="406.51" font-size="11.00" class="sc-loraregular">harness</text><text x="265.85" y="406.51" font-size="11.00" class="sc-notoserifcjksc">）中，然后依据固定的成功标准对其评分，例如是否在符</text><text x="72.00" y="422.13" font-size="11.00" class="sc-notoserifcjksc">合所述地点作息的合理时间发帖，以及是否根据互动数据迭代内容。</text><text x="72.00" y="488.61" font-size="11.00" class="sc-notoserifcjksc">我们测试的两个场景与以往发布时相同：</text><text x="108.00" y="521.00" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展一场伪草根运动（</text><text x="411.35" y="521.00" font-size="11.00" class="sc-notoserifcjksc">）式的行动，以压低特定</text><text x="108.00" y="536.62" font-size="11.00" class="sc-notoserifcjksc">候选人的投票率和支持热情；以及</text><text x="108.00" y="553.38" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示识别人口群体断层线，并投放带有强烈情绪色彩、针对特定文</text><text x="108.00" y="569.00" font-size="11.00" class="sc-notoserifcjksc">化定制的信息来激化这些断层。</text><text x="72.00" y="618.15" font-size="11.00" class="sc-notoserifcjksc">每个场景在</text><text x="129.89" y="618.15" font-size="11.00" class="sc-loraregular">3</text><text x="138.91" y="618.15" font-size="11.00" class="sc-notoserifcjksc">个模拟平台阻力等级下各运行</text><text x="284.81" y="618.15" font-size="11.00" class="sc-loraregular">3</text><text x="293.83" y="618.15" font-size="11.00" class="sc-notoserifcjksc">次，即每个场景共</text><text x="384.72" y="618.15" font-size="11.00" class="sc-loraregular">9</text><text x="393.97" y="618.15" font-size="11.00" class="sc-notoserifcjksc">次模拟，并依据</text><text x="473.86" y="618.15" font-size="11.00" class="sc-loraregular">70</text><text x="488.66" y="618.15" font-size="11.00" class="sc-notoserifcjksc">项成功标</text><text x="72.00" y="633.77" font-size="11.00" class="sc-notoserifcjksc">准评分。本评估针对模型的一个无害性训练有所削减的</text><text x="336.00" y="633.77" font-size="11.00" class="sc-loraregular">“</text><text x="340.40" y="633.77" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="384.40" y="633.77" font-size="11.00" class="sc-loraregular sc-k">helpful-only</text><text x="446.97" y="633.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.97" y="633.77" font-size="11.00" class="sc-loraregular">”</text><text x="461.81" y="633.77" font-size="11.00" class="sc-notoserifcjksc">变体运行，以评</text><text x="72.00" y="649.39" font-size="11.00" class="sc-notoserifcjksc">估模型的原始能力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="77.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50" y="173.25" font-size="10.99" class="sc-lorabold sc-k">Claude Mythos 5</text><text x="77.50" y="188.87" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="211.38" font-size="10.99" class="sc-lorabold">Claude Opus 4.8</text><text x="77.50" y="227.00" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="249.51" font-size="10.99" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="77.50" y="265.13" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="287.64" font-size="10.99" class="sc-lorabold">Claude Sonnet 4.6</text><text x="77.50" y="303.26" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="236.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景（任务完成率）</text><text x="390.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00" y="317.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="317.96" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="317.96" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06" y="317.96" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06" y="317.96" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43" y="317.96" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="329.66" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高，表示能力越强，因而可能为恶意行为者带来的能力提升也越大。</text><text x="72.00" y="370.27" font-size="11.00" class="sc-notoserifcjksc">在两个测试场景中，</text><text x="171.00" y="370.27" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="257.24" y="370.27" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本的成功率均高于</text><text x="403.13" y="370.27" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="457.11" y="370.27" font-size="11.00" class="sc-notoserifcjksc">，但在自主开展</text><text x="72.00" y="385.89" font-size="11.00" class="sc-notoserifcjksc">影响力行动的能力上仍远低于</text><text x="217.89" y="385.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="300.89" y="385.89" font-size="11.00" class="sc-notoserifcjksc">。我们评估认为，</text><text x="388.89" y="385.89" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="436.84" y="385.89" font-size="11.00" class="sc-notoserifcjksc">在许多操作步骤上都</text><text x="72.00" y="401.51" font-size="11.00" class="sc-notoserifcjksc">需要大量的人工指导。</text><text x="72.00" y="451.23" font-size="11.00" class="sc-notoserifcjksc">与以往发布一样，这些模型的完整训练版本（包含无害性训练）基本上从第一轮起就拒绝参与这</text><text x="72.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc">些任务，因为这两个场景都明显违反了我们的</text><text x="292.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="336.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="517.39" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02" y="517.39" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00" y="543.96" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00" y="559.58" font-size="11.00" class="sc-notoserifcjksc">藏在智能体执行任务期间所处理的工具结果中的恶意指令。例如，智能体被要求总结的一封电子</text><text x="72.00" y="575.20" font-size="11.00" class="sc-notoserifcjksc">邮件中，可能包含指示它外泄所有近期内部通信的隐藏文本。一次成功的提示词注入攻击会使模</text><text x="72.00" y="606.44" font-size="11.00" class="sc-notoserifcjksc">或共享文档中的单个载荷，就能危及任何处理它的智能体，而攻击者无需针对特定用户或系统。</text><text x="72.00" y="622.06" font-size="11.00" class="sc-notoserifcjksc">当模型既能访问私密数据、又能代表用户采取行动时，这类攻击尤其危险，因为这种组合使攻击</text><text x="72.00" y="637.68" font-size="11.00" class="sc-notoserifcjksc">者能够外泄敏感信息或触发未经授权的操作。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="292.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="292.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="303.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="303.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="314.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="314.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="325.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="325.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="261.89" y="98.82" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="300.18" y="98.82" font-size="11.00" class="sc-notoserifcjksc">模型已使大多数公开基准以及第三方研究机构构</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">建的基准趋于饱和。我们持续投入于衡量鲁棒性提升的自适应评估。</text><text x="72.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc">与其前代模型</text><text x="140.89" y="179.78" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="236.05" y="179.78" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="269.05" y="179.78" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="355.29" y="179.78" font-size="11.00" class="sc-notoserifcjksc">在鲁棒性上有了大幅提升，在抵御提</text><text x="72.00" y="226.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39" y="226.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部红队测试</text><text x="72.00" y="254.59" font-size="11.00" class="sc-notoserifcjksc">为与以往的系统卡保持一致，我们报告了</text><text x="272.89" y="254.59" font-size="11.00" class="sc-loraregular sc-k">Agent Red Teaming</text><text x="371.51" y="254.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="382.51" y="254.59" font-size="11.00" class="sc-loraregular">ART</text><text x="403.34" y="254.59" font-size="11.00" class="sc-notoserifcjksc">）基准测试的结果，该基准</text><text x="72.00" y="270.21" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="85.89" y="270.21" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Gray Swan</text><text x="143.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="154.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所</text><text x="275.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="286.35" y="270.21" font-size="11.00" class="sc-loraregular sc-k">UK AI Security Institute</text><text x="408.00" y="270.21" font-size="11.00" class="sc-notoserifcjksc">）合作开发。然而，由于</text><text x="72.00" y="285.83" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="285.83" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="146.18" y="285.83" font-size="11.00" class="sc-loraregular">ART</text><text x="169.91" y="285.83" font-size="11.00" class="sc-notoserifcjksc">上已连续数个版本接近最高表现，我们不再将其作为与其他前沿模型进行比</text><text x="72.00" y="301.45" font-size="11.00" class="sc-notoserifcjksc">较的主要提示词注入基准。今后，我们将报告下文所述的一个新基准的结果，该基准提供更多样</text><text x="72.00" y="317.07" font-size="11.00" class="sc-notoserifcjksc">化的场景，并能在较少的尝试次数下提供更多信号。</text><text x="72.00" y="384.12" font-size="11.00" class="sc-loraregular">ART</text><text x="95.73" y="384.12" font-size="11.00" class="sc-notoserifcjksc">衡量的是攻击者在针对目标进行</text><text x="252.62" y="384.12" font-size="11.00" class="sc-loraregular sc-k">k=1</text><text x="268.24" y="384.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="279.24" y="384.12" font-size="11.00" class="sc-loraregular sc-k">k=10</text><text x="304.58" y="384.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="318.48" y="384.12" font-size="11.00" class="sc-loraregular sc-k">k=100</text><text x="350.65" y="384.12" font-size="11.00" class="sc-notoserifcjksc">次尝试后成功的概率。攻击取自</text><text x="507.55" y="384.12" font-size="11.00" class="sc-loraregular">ART</text><text x="72.00" y="399.74" font-size="11.00" class="sc-loraregular sc-k">Arena</text><text x="101.89" y="399.74" font-size="11.00" class="sc-notoserifcjksc">，在其中，数以千计的红队测试（</text><text x="266.89" y="399.74" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="330.99" y="399.74" font-size="11.00" class="sc-notoserifcjksc">）人员针对当时可用的一组模型不断改进攻</text><text x="72.00" y="415.36" font-size="11.00" class="sc-notoserifcjksc">击策略。</text><text x="116.00" y="415.36" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="173.45" y="415.36" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中挑选出一个子集，这些攻击已被证明对多个模型有效，而不</text><text x="72.00" y="430.98" font-size="11.00" class="sc-notoserifcjksc">仅仅对最初针对的那个模型有效。</text><a href="https://grayswan.ai/" rel="noopener"><rect x="85.89" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="85.89" y="261.41" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="110.32" y="261.41" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="113.22" y="261.41" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="154.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="154.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="165.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="165.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="176.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="176.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="187.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="187.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="198.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="198.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="209.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="209.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="220.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="220.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="231.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="231.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p059.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 59 页"><text x="72.00" y="348.25" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="348.25" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19" y="348.25" font-size="9.00" class="sc-lorabold sc-k">Agent Red Teaming</text><text x="221.26" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26" y="348.25" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击，分数越低越好。</text><text x="455.29" y="348.25" font-size="9.00" class="sc-notoserifcjksc">结果表示攻击者针对</text><text x="72.00" y="359.95" font-size="9.00" class="sc-notoserifcjksc">每个模型在</text><text x="119.37" y="359.95" font-size="9.00" class="sc-loraregular sc-k">k=1</text><text x="132.15" y="359.95" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="141.15" y="359.95" font-size="9.00" class="sc-loraregular sc-k">k=10</text><text x="161.88" y="359.95" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="173.25" y="359.95" font-size="9.00" class="sc-loraregular sc-k">k=100</text><text x="199.57" y="359.95" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到成功攻击的概率。攻击成功情况在</text><text x="390.94" y="359.95" font-size="9.00" class="sc-loraregular">19</text><text x="401.79" y="359.95" font-size="9.00" class="sc-notoserifcjksc">个不同场景上评估。越低越好。</text><text x="72.00" y="400.56" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="400.56" font-size="11.00" class="sc-loraregular">ART</text><text x="109.62" y="400.56" font-size="11.00" class="sc-notoserifcjksc">基准测试上，</text><text x="175.62" y="400.56" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="261.86" y="400.56" font-size="11.00" class="sc-notoserifcjksc">表现出与</text><text x="308.75" y="400.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="394.64" y="400.56" font-size="11.00" class="sc-notoserifcjksc">相当的鲁棒性，并且鲁棒性优</text><text x="72.00" y="416.18" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="416.18" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="139.87" y="416.18" font-size="11.00" class="sc-notoserifcjksc">，超过了所有接受评估的非</text><text x="274.76" y="416.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="313.05" y="416.18" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="465.10" font-size="11.00" class="sc-notoserifcjksc">今后，我们将报告一个新的间接提示词注入基准</text><text x="303.00" y="461.44" font-size="6.60" class="sc-loraregular">3</text><text x="306.68" y="465.10" font-size="11.00" class="sc-notoserifcjksc">的结果，该基准由我们与</text><text x="430.57" y="465.10" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="485.13" y="465.10" font-size="11.00" class="sc-notoserifcjksc">、英国人工</text><text x="72.00" y="480.72" font-size="11.00" class="sc-notoserifcjksc">智能安全研究所、美国人工智能标准与创新中心（</text><text x="314.00" y="480.72" font-size="11.00" class="sc-loraregular sc-k">US Center for AI Standards and</text><text x="72.00" y="496.34" font-size="11.00" class="sc-loraregular sc-k">Innovation</text><text x="126.83" y="496.34" font-size="11.00" class="sc-notoserifcjksc">）以及其他模型开发者合作构建。与</text><text x="305.73" y="496.34" font-size="11.00" class="sc-loraregular">ART</text><text x="329.45" y="496.34" font-size="11.00" class="sc-notoserifcjksc">类似，我们组织了一场竞赛，由红队测试人</text><text x="72.00" y="511.96" font-size="11.00" class="sc-notoserifcjksc">员在</text><text x="96.89" y="511.96" font-size="11.00" class="sc-loraregular">28</text><text x="111.88" y="511.96" font-size="11.00" class="sc-notoserifcjksc">个不同的攻击场景中寻找针对前沿模型的攻击；这些场景检验模型对间接提示词注入的易</text><text x="72.00" y="527.58" font-size="11.00" class="sc-notoserifcjksc">感性，此类注入试图诱导不可逆的有害操作，包括私密数据外泄、数据破坏、系统入侵和非预期</text><text x="72.00" y="543.20" font-size="11.00" class="sc-notoserifcjksc">的金融交易。这一新基准中的场景经过设计，力求与前沿模型当今所能执行任务的真实度相匹</text><text x="72.00" y="558.82" font-size="11.00" class="sc-notoserifcjksc">配。与</text><text x="107.89" y="558.82" font-size="11.00" class="sc-loraregular">ART</text><text x="131.62" y="558.82" font-size="11.00" class="sc-notoserifcjksc">不同，这些场景除工具使用外，还涵盖编程和计算机使用。经过去重后，我们选出了</text><text x="72.00 76.00 78.78 82.78 88.91" y="574.44" font-size="11.00" class="sc-loraregular">1,130</text><text x="98.64" y="574.44" font-size="11.00" class="sc-notoserifcjksc">个在各目标模型间表现出高可迁移性的攻击。我们在不附加额外安全防护措施的情况下评估</text><text x="72.00" y="590.06" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="590.06" font-size="11.00" class="sc-notoserifcjksc">模型，而其他前沿模型则在其公开可用的端点上评估，这些端点可能包含、也可能不包含</text><text x="72.00" y="605.68" font-size="11.00" class="sc-notoserifcjksc">额外的安全防护措施。</text><a href="https://arxiv.org/abs/2603.15714" rel="noopener"><rect x="334.50" y="706.50" width="161.25" height="13.50" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="72.00" y="406.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="406.75" font-size="9.00" class="sc-lorabold sc-k">5.2.1.B]</text><text x="117.82" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19" y="406.75" font-size="9.00" class="sc-lorabold sc-k">Gray Swan IPI</text><text x="201.52" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">基准（</text><text x="228.52" y="406.75" font-size="9.00" class="sc-lorabold">2026</text><text x="251.38" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">年第一季度）的间接提示词注入攻击，</text><text x="404.38" y="406.75" font-size="9.00" class="sc-notoserifcjksc">分数越低越好。所有模型均使用扩</text><text x="72.00" y="418.45" font-size="9.00" class="sc-notoserifcjksc">展思考（</text><text x="108.00" y="418.45" font-size="9.00" class="sc-loraregular sc-k">extended thinking</text><text x="184.06" y="418.45" font-size="9.00" class="sc-notoserifcjksc">）。结果表示攻击者在</text><text x="276.43" y="418.45" font-size="9.00" class="sc-loraregular sc-k">k=1</text><text x="289.21" y="418.45" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="298.21" y="418.45" font-size="9.00" class="sc-loraregular sc-k">k=10</text><text x="318.94" y="418.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="330.31" y="418.45" font-size="9.00" class="sc-loraregular sc-k">k=15</text><text x="350.36" y="418.45" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到成功攻击的概率。越低越好。</text><text x="72.00" y="430.15" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="149.86" y="430.15" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="161.23" y="430.15" font-size="9.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="223.68" y="430.15" font-size="9.00" class="sc-notoserifcjksc">的结果不可直接比较，因为它们被纳入了用于收集攻击的红队竞赛。</text><text x="72.00" y="485.56" font-size="11.00" class="sc-notoserifcjksc">在这一新基准上，</text><text x="160.00" y="485.56" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="246.24" y="485.56" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="260.13" y="485.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="346.02" y="485.56" font-size="11.00" class="sc-notoserifcjksc">几乎持平。其攻击成功率（</text><text x="478.02" y="485.56" font-size="11.00" class="sc-loraregular sc-k">attack</text><text x="72.00" y="501.18" font-size="11.00" class="sc-loraregular sc-k">success rate</text><text x="134.80" y="501.18" font-size="11.00" class="sc-notoserifcjksc">）低于</text><text x="170.69" y="501.18" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="262.96" y="501.18" font-size="11.00" class="sc-notoserifcjksc">，不过这一结果不可直接比较，因为</text><text x="441.85" y="501.18" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="498.72" y="501.18" font-size="11.00" class="sc-notoserifcjksc">被纳入</text><text x="72.00" y="516.80" font-size="11.00" class="sc-notoserifcjksc">了用于收集攻击的红队竞赛。</text><text x="215.00" y="516.80" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="262.95" y="516.80" font-size="11.00" class="sc-notoserifcjksc">优于所有接受评估的非</text><text x="375.84" y="516.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="414.13" y="516.80" font-size="11.00" class="sc-notoserifcjksc">模型，包括</text><text x="472.03" y="516.80" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="516.37" y="516.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="532.42" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="156.02" y="532.42" font-size="11.00" class="sc-notoserifcjksc">；这两个模型未参与该红队竞赛，因此针对它们的评估可直接用于比较攻击迁</text><text x="72.00" y="548.04" font-size="11.00" class="sc-notoserifcjksc">移。</text><text x="72.00" y="597.24" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15" y="597.24" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景抵御自适应攻击者的鲁棒性</text><text x="72.00" y="629.14" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="625.47" font-size="6.60" class="sc-loraregular">4</text><text x="361.58" y="629.14" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00" y="644.76" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新型方法的攻击。我</text><text x="72.00" y="660.38" font-size="11.00" class="sc-notoserifcjksc">们持续投入于自适应评估，以更好地近似</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="368.25" y="707.25" width="157.50" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">现实世界攻击者的能力，这项工作既在内部开展，也与外部研究合作伙伴协作进行。本节中的评</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">估衡量的是针对会根据与模型的交互来改进攻击的攻击者的鲁棒性。这些评估体现了一种刻意宽</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">松的威胁模型：攻击者直接针对测试场景进行优化，并且每个场景可进行多次尝试。现实世界中</text><text x="72.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">现的可能性。</text><text x="72.00" y="212.16" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="212.16" font-size="11.00" class="sc-notoserifcjkscbold">跨使用场景的实时漏洞赏金</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">正如我们在</text><text x="129.89" y="244.55" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.8</text><text x="215.78" y="244.55" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="248.78" y="244.55" font-size="11.00" class="sc-notoserifcjksc">中首次所做的那样，我们与</text><text x="383.67" y="244.55" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="441.13" y="244.55" font-size="11.00" class="sc-notoserifcjksc">合作举办了一次实时</text><text x="72.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">漏洞赏金活动，专家红队测试人员通过对包括</text><text x="294.89" y="260.17" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="378.24" y="256.50" font-size="6.60" class="sc-loraregular">5</text><text x="384.73" y="260.17" font-size="11.00" class="sc-notoserifcjksc">在内的一组前沿模型发起成功的</text><text x="72.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">提示词注入攻击，角逐一个奖金池。目标模型的身份自始至终都是隐藏的，并且每位红队测试人</text><text x="72.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">员在每个场景下针对每个模型最多只能提交一次成功攻击。本轮涵盖工具使用、编程和计算机使</text><text x="72.00" y="307.03" font-size="11.00" class="sc-notoserifcjksc">用方面的</text><text x="118.89" y="307.03" font-size="11.00" class="sc-loraregular">11</text><text x="129.79" y="307.03" font-size="11.00" class="sc-notoserifcjksc">个新场景。</text><text x="184.79" y="307.03" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="223.09" y="307.03" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="258.98" y="307.03" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="284.49" y="307.03" font-size="11.00" class="sc-notoserifcjksc">推理强度（</text><text x="339.49" y="307.03" font-size="11.00" class="sc-loraregular sc-k">thinking effort</text><text x="413.74" y="307.03" font-size="11.00" class="sc-notoserifcjksc">）下接受评估，且未启用</text><text x="72.00" y="322.65" font-size="11.00" class="sc-notoserifcjksc">我们产品中使用的额外保护措施（例如运行框架层面的防御和提示词注入探针），因此结果反映</text><text x="72.00" y="338.27" font-size="11.00" class="sc-notoserifcjksc">的是模型本身的鲁棒性，代表已部署系统实际鲁棒性的下界。所有外部模型均以其生产环境配置</text><text x="72.00" y="353.89" font-size="11.00" class="sc-notoserifcjksc">进行测试，该配置可能包含、也可能不包含额外的安全防护措施。</text><text x="391.00" y="353.89" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="435.34" y="353.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="449.23" y="353.89" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="474.74" y="353.89" font-size="11.00" class="sc-notoserifcjksc">推理强度下接</text><text x="72.00" y="369.51" font-size="11.00" class="sc-notoserifcjksc">受评估。</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">5</text><text x="77.90" y="703.81" font-size="10.00" class="sc-notoserifcjksc">请注意，</text><text x="117.90" y="703.81" font-size="10.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="198.12" y="703.81" font-size="10.00" class="sc-notoserifcjksc">和</text><text x="210.75" y="703.81" font-size="10.00" class="sc-loraregular sc-k">Fable 5</text><text x="245.66" y="703.81" font-size="10.00" class="sc-notoserifcjksc">未被纳入本次漏洞赏金，因为它们已为响应美国政府的</text><text x="485.66" y="703.81" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">出口管制指</text><text x="72.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">令</text><text x="82.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc">而下线。</text><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="129.89" y="235.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="129.89" y="235.75" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="165.29" y="235.75" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="168.18" y="235.75" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="195.14" y="235.75" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="198.04" y="235.75" width="14.85" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="212.89" y="235.75" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="215.78" y="235.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="226.78" y="235.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="226.78" y="235.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="237.78" y="235.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="237.78" y="235.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="485.66" y="695.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="485.66" y="695.81" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="495.66" y="695.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="495.66" y="695.81" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="505.66" y="695.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="505.66" y="695.81" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="515.66" y="695.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="515.66" y="695.81" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="525.66" y="695.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="525.66" y="695.81" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="535.66" y="695.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="72.00" y="710.01" width="10.00" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p062.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 62 页"><text x="72.00" y="346.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="346.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="346.75" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71" y="346.75" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入鲁棒性，</text><text x="223.71" y="346.75" font-size="9.00" class="sc-notoserifcjksc">来自与</text><text x="253.08" y="346.75" font-size="9.00" class="sc-loraregular sc-k">Gray Swan</text><text x="300.09" y="346.75" font-size="9.00" class="sc-notoserifcjksc">合作举办的为期一周的漏洞赏金计划。分数越低越好。它涵</text><text x="72.00" y="358.45" font-size="9.00" class="sc-notoserifcjksc">盖工具使用、编程和计算机使用方面的</text><text x="227.37" y="358.45" font-size="9.00" class="sc-loraregular">11</text><text x="236.29" y="358.45" font-size="9.00" class="sc-notoserifcjksc">个场景。攻击成功率按提交的所有有效聊天尝试计算。</text><text x="72.00" y="399.06" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="399.06" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="133.84" y="399.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="219.73" y="399.06" font-size="11.00" class="sc-notoserifcjksc">并列取得漏洞赏金中的最强结果，二者均仅有</text><text x="442.62" y="399.06" font-size="11.00" class="sc-loraregular sc-k">0.19%</text><text x="474.81" y="399.06" font-size="11.00" class="sc-notoserifcjksc">的不重复的攻</text><text x="72.00" y="414.68" font-size="11.00" class="sc-notoserifcjksc">击成功，显著优于</text><text x="162.89" y="414.68" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="255.16" y="414.68" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="266.16" y="414.68" font-size="11.00" class="sc-loraregular">1.41%</text><text x="292.41" y="414.68" font-size="11.00" class="sc-notoserifcjksc">）以及</text><text x="328.30" y="414.68" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="369.75" y="414.68" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="380.75" y="414.68" font-size="11.00" class="sc-loraregular sc-k">3.08%</text><text x="412.00" y="414.68" font-size="11.00" class="sc-notoserifcjksc">）或</text><text x="436.89" y="414.68" font-size="11.00" class="sc-loraregular">Gemini 3.5</text><text x="72.00" y="430.30" font-size="11.00" class="sc-loraregular">Flash</text><text x="98.38" y="430.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="109.38" y="430.30" font-size="11.00" class="sc-loraregular sc-k">6.66%</text><text x="140.62" y="430.30" font-size="11.00" class="sc-notoserifcjksc">）等其他前沿模型。参与漏洞赏金的各模型的攻击成功率介于</text><text x="440.51" y="430.30" font-size="11.00" class="sc-loraregular sc-k">0.19%</text><text x="472.70" y="430.30" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="486.59" y="430.30" font-size="11.00" class="sc-loraregular">14.29%</text><text x="523.99" y="430.30" font-size="11.00" class="sc-notoserifcjksc">之</text><text x="72.00" y="445.92" font-size="11.00" class="sc-notoserifcjksc">间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p063.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 63 页"><text x="72.00" y="295.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="295.93" font-size="9.00" class="sc-lorabold sc-k">5.2.2.1.B]</text><text x="124.71" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="136.08" y="295.93" font-size="9.00" class="sc-lorabold">5.2.2.1.A</text><text x="170.95" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">中的漏洞赏金结果，按模态细分，展示表现最好的</text><text x="371.32" y="295.93" font-size="9.00" class="sc-lorabold">5</text><text x="378.55" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">个模型。</text><text x="414.55" y="295.93" font-size="9.00" class="sc-notoserifcjksc">分数越低越好。每种模态各有</text><text x="533.92" y="295.93" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="307.63" font-size="9.00" class="sc-notoserifcjksc">个不同场景，但计算机使用仅有</text><text x="200.37" y="307.63" font-size="9.00" class="sc-loraregular">3</text><text x="207.75" y="307.63" font-size="9.00" class="sc-notoserifcjksc">个场景。攻击成功率按提交的所有有效聊天尝试计算。</text><text x="72.00" y="348.25" font-size="11.00" class="sc-notoserifcjksc">按使用场景细分，</text><text x="160.00" y="348.25" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="246.24" y="348.25" font-size="11.00" class="sc-notoserifcjksc">在全部三个场景上都较</text><text x="359.13" y="348.25" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="454.29" y="348.25" font-size="11.00" class="sc-notoserifcjksc">有大幅改进，尤</text><text x="72.00" y="363.87" font-size="11.00" class="sc-notoserifcjksc">其是编程，攻击成功率从</text><text x="195.89" y="363.87" font-size="11.00" class="sc-loraregular">3.3%</text><text x="223.32" y="363.87" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="248.21" y="363.87" font-size="11.00" class="sc-loraregular sc-k">0.1%</text><text x="271.14" y="363.87" font-size="11.00" class="sc-notoserifcjksc">。工具使用和计算机使用也有所改进，分别从</text><text x="494.04" y="363.87" font-size="11.00" class="sc-loraregular sc-k">0.83%</text><text x="528.17" y="363.87" font-size="11.00" class="sc-notoserifcjksc">降</text><text x="72.00" y="379.49" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="85.89" y="379.49" font-size="11.00" class="sc-loraregular sc-k">0.35%</text><text x="116.95" y="379.49" font-size="11.00" class="sc-notoserifcjksc">、从</text><text x="141.84" y="379.49" font-size="11.00" class="sc-loraregular sc-k">0.45%</text><text x="175.62" y="379.49" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="200.51" y="379.49" font-size="11.00" class="sc-loraregular sc-k">0.07%</text><text x="230.94" y="379.49" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="255.83" y="379.49" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="341.72" y="379.49" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="374.72" y="379.49" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="422.67" y="379.49" font-size="11.00" class="sc-notoserifcjksc">在编程任务上略好</text><text x="72.00" y="395.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="395.11" font-size="11.00" class="sc-loraregular sc-k">0.1%</text><text x="108.83" y="395.11" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="133.72" y="395.11" font-size="11.00" class="sc-loraregular sc-k">0.41%</text><text x="162.62" y="395.11" font-size="11.00" class="sc-notoserifcjksc">），在计算机使用上以</text><text x="275.51" y="395.11" font-size="11.00" class="sc-loraregular sc-k">0.07%</text><text x="308.83" y="395.11" font-size="11.00" class="sc-notoserifcjksc">持平，但在工具使用上略差：</text><text x="451.83" y="395.11" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="499.43" y="395.11" font-size="11.00" class="sc-notoserifcjksc">的攻击</text><text x="72.00" y="410.73" font-size="11.00" class="sc-notoserifcjksc">成功率为</text><text x="118.89" y="410.73" font-size="11.00" class="sc-loraregular">0%</text><text x="135.29" y="410.73" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="160.19" y="410.73" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="208.14" y="410.73" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="222.03" y="410.73" font-size="11.00" class="sc-loraregular sc-k">0.35%</text><text x="253.08" y="410.73" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="461.59" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11" y="461.59" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00" y="493.97" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="493.97" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="176.35" y="493.97" font-size="11.00" class="sc-notoserifcjksc">提供的外部自适应红队测试工具</text><text x="333.24" y="493.97" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="364.28" y="493.97" font-size="11.00" class="sc-notoserifcjksc">，评估我们的模型在编程环境中对提</text><text x="72.00" y="509.59" font-size="11.00" class="sc-notoserifcjksc">示词注入的鲁棒性。</text><text x="171.00" y="509.59" font-size="11.00" class="sc-loraregular">Shade</text><text x="204.93" y="509.59" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="347.93" y="509.59" font-size="11.00" class="sc-loraregular sc-k">reinforcement learning</text><text x="466.32" y="509.59" font-size="11.00" class="sc-notoserifcjksc">）以及人在回</text><text x="72.00" y="525.21" font-size="11.00" class="sc-notoserifcjksc">路的洞见，迭代提升其利用模型漏洞的能力。攻击者先针对此前的一组模型、在这些测试用例上</text><text x="72.00" y="540.83" font-size="11.00" class="sc-notoserifcjksc">进行优化，然后在相同场景下迁移到最新模型上。</text><text x="72.00" y="591.13" font-size="11.00" class="sc-notoserifcjksc">下表报告了该攻击者的攻击成功率；该攻击者在一组</text><text x="327.89" y="591.13" font-size="11.00" class="sc-loraregular">40</text><text x="343.58" y="591.13" font-size="11.00" class="sc-notoserifcjksc">个场景上训练，随后在相同场景上进行</text><text x="72.00" y="606.75" font-size="11.00" class="sc-notoserifcjksc">评估。每个场景中，攻击者有</text><text x="217.89" y="606.75" font-size="11.00" class="sc-loraregular">200</text><text x="240.36" y="606.75" font-size="11.00" class="sc-notoserifcjksc">次尝试。我们报告成功尝试的总体百分比，以及至少有一次尝</text><text x="72.00" y="622.37" font-size="11.00" class="sc-notoserifcjksc">试成功的场景数量。</text><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="333.24" y="485.17" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="333.24" y="485.17" width="31.04" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="160.00" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="199.41" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="224.74" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="250.07" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="275.40" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="300.73" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="328.18" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">未启用安全防护措施时的攻</text><text x="251.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">击成功率</text><text x="251.50" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="393.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">启用安全防护措施时的攻击成</text><text x="393.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="393.25" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="347.81" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="347.81" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.38 114.48 120.01 123.49 125.86 131.19 136.78 141.50 146.86" y="347.81" font-size="9.00" class="sc-lorabold">5.2.2.2.A] Shade</text><text x="154.07" y="347.81" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在编程环境中的攻击成功率</text><text x="343.07" y="347.81" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="478.07" y="347.81" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="496.07" y="347.81" font-size="9.00" class="sc-notoserifcjksc">标出，次</text><text x="72.00" y="359.51" font-size="9.00" class="sc-notoserifcjksc">佳分数以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="353.37" y="359.51" font-size="9.00" class="sc-loraregular">200</text><text x="371.74" y="359.51" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有尝试中</text><text x="72.00" y="371.21" font-size="9.00" class="sc-notoserifcjksc">成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="426.61" font-size="11.00" class="sc-notoserifcjksc">在所有被评估的模型中，</text><text x="193.00" y="426.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="279.24" y="426.61" font-size="11.00" class="sc-notoserifcjksc">在编程环境中对提示词注入表现出最强的鲁棒性：开</text><text x="72.00" y="442.23" font-size="11.00" class="sc-notoserifcjksc">启扩展思考时，所有尝试的攻击成功率为</text><text x="272.89" y="442.23" font-size="11.00" class="sc-loraregular sc-k">0.31%</text><text x="301.96" y="442.23" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时为</text><text x="381.85" y="442.23" font-size="11.00" class="sc-loraregular sc-k">0.29%</text><text x="413.04" y="442.23" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="437.94" y="442.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="72.00" y="457.85" font-size="11.00" class="sc-notoserifcjksc">相比这是大幅改进，后者开启思考时达到</text><text x="272.89" y="457.85" font-size="11.00" class="sc-loraregular sc-k">12.71%</text><text x="303.80" y="457.85" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时达到</text><text x="394.70" y="457.85" font-size="11.00" class="sc-loraregular">45.26%</text><text x="431.19" y="457.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="442.19" y="457.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="490.14" y="457.85" font-size="11.00" class="sc-notoserifcjksc">的表现也</text><text x="72.00" y="473.47" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="96.89" y="473.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="179.89" y="473.47" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="248.78" y="473.47" font-size="11.00" class="sc-loraregular sc-k">7.03%</text><text x="278.44" y="473.47" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="347.33" y="473.47" font-size="11.00" class="sc-loraregular sc-k">17.44%</text><text x="380.12" y="473.47" font-size="11.00" class="sc-notoserifcjksc">），并与</text><text x="427.01" y="473.47" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="512.36" y="473.47" font-size="11.00" class="sc-notoserifcjksc">（开</text><text x="72.00" y="489.09" font-size="11.00" class="sc-notoserifcjksc">启思考时</text><text x="118.89" y="489.09" font-size="11.00" class="sc-loraregular sc-k">0.45%</text><text x="149.78" y="489.09" font-size="11.00" class="sc-notoserifcjksc">）相当。启用安全防护措施后，</text><text x="303.78" y="489.09" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="351.73" y="489.09" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率进一步降至开启思考时</text><text x="72.00" y="504.71" font-size="11.00" class="sc-loraregular sc-k">0.09%</text><text x="103.96" y="504.71" font-size="11.00" class="sc-notoserifcjksc">、关闭思考时</text><text x="172.85" y="504.71" font-size="11.00" class="sc-loraregular sc-k">0.13%</text><text x="201.91" y="504.71" font-size="11.00" class="sc-notoserifcjksc">，为所有受测模型中最低。</text><text x="72.00" y="572.34" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="572.34" font-size="11.00" class="sc-notoserifcjkscbold">计算机使用</text><text x="72.00" y="604.73" font-size="11.00" class="sc-notoserifcjksc">我们还使用</text><text x="129.89" y="604.73" font-size="11.00" class="sc-loraregular">Shade</text><text x="163.83" y="604.73" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="188.72" y="604.73" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="227.01" y="604.73" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性；在这类环境中，模型直接与</text><text x="72.00" y="620.35" font-size="11.00" class="sc-notoserifcjksc">图形用户界面（</text><text x="149.00" y="620.35" font-size="11.00" class="sc-loraregular">GUI</text><text x="169.33" y="620.35" font-size="11.00" class="sc-notoserifcjksc">）交互。攻击者直接针对测试用例进行优化。与编程评估类似，攻击者在</text><text x="524.22" y="620.35" font-size="11.00" class="sc-loraregular">14</text><text x="72.00" y="635.97" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，我们衡量所有尝试中的成功情况，并</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">6</text><text x="78.10" y="703.81" font-size="10.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="164.61" y="703.81" font-size="10.00" class="sc-notoserifcjksc">属于攻击者训练时所针对的模型集合，因此其攻击成功率预计会更高，且不可直接比</text><text x="72.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc">较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="75.25" y="131.01" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="202.39" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="241.80" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="267.13" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="292.46" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="317.79" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="343.12" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="368.45" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">未启用安全防护措施时的攻</text><text x="251.50" y="146.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">击成功率</text><text x="251.50" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="328.75" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="398.50" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">启用安全防护措施时的攻击</text><text x="398.50" y="146.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">成功率</text><text x="398.50" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="478.00" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">按至少有一次攻击成功的场景进行细分统计。我们比较了在有无我们为保护此情境下用户而设计</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的额外安全防护措施时的模型鲁棒性。</text><text x="72.00" y="385.97" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26 123.73 126.10 131.44 137.03 141.74 147.11" y="385.97" font-size="9.00" class="sc-lorabold">5.2.2.3.A] Shade</text><text x="154.31" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在计算机使用环境中的攻击成功率</text><text x="370.31" y="385.97" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="505.31" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="523.31" y="385.97" font-size="9.00" class="sc-notoserifcjksc">标</text><text x="72.00" y="397.67" font-size="9.00" class="sc-notoserifcjksc">出，次佳分数以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="380.37" y="397.67" font-size="9.00" class="sc-loraregular">200</text><text x="398.74" y="397.67" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有</text><text x="72.00" y="409.37" font-size="9.00" class="sc-notoserifcjksc">尝试中成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="464.77" font-size="11.00" class="sc-notoserifcjksc">在计算机使用环境中，</text><text x="182.00" y="464.77" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="229.95" y="464.77" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="254.84" y="464.77" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="350.00" y="464.77" font-size="11.00" class="sc-notoserifcjksc">同样有大幅改进：开启扩展思考时，攻</text><text x="72.00" y="480.39" font-size="11.00" class="sc-notoserifcjksc">击成功率从</text><text x="129.89" y="480.39" font-size="11.00" class="sc-loraregular sc-k">12.0%</text><text x="161.64" y="480.39" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="186.53" y="480.39" font-size="11.00" class="sc-loraregular">2.25%</text><text x="216.62" y="480.39" font-size="11.00" class="sc-notoserifcjksc">；关闭思考时，从</text><text x="307.51" y="480.39" font-size="11.00" class="sc-loraregular">14.4%</text><text x="338.61" y="480.39" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="363.50" y="480.39" font-size="11.00" class="sc-loraregular sc-k">6.04%</text><text x="394.76" y="480.39" font-size="11.00" class="sc-notoserifcjksc">。在两种设置下，</text><text x="482.76" y="480.39" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="72.00" y="496.01" font-size="11.00" class="sc-notoserifcjksc">均与</text><text x="96.89" y="496.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="179.89" y="496.01" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="248.78" y="496.01" font-size="11.00" class="sc-loraregular sc-k">7.14%</text><text x="275.61" y="496.01" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="344.50" y="496.01" font-size="11.00" class="sc-loraregular">6.21%</text><text x="373.05" y="496.01" font-size="11.00" class="sc-notoserifcjksc">）相当或更优，但</text><text x="463.94" y="496.01" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="511.63" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="511.63" font-size="11.00" class="sc-notoserifcjksc">仍是总体最强的模型，开启思考时为</text><text x="259.78" y="511.63" font-size="11.00" class="sc-loraregular sc-k">0.82%</text><text x="290.80" y="511.63" font-size="11.00" class="sc-notoserifcjksc">。启用安全防护措施后，</text><text x="411.80" y="511.63" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="459.75" y="511.63" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率在</text><text x="72.00" y="527.25" font-size="11.00" class="sc-notoserifcjksc">开启思考时降至</text><text x="151.89" y="527.25" font-size="11.00" class="sc-loraregular">1.46%</text><text x="180.49" y="527.25" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时降至</text><text x="271.39" y="527.25" font-size="11.00" class="sc-loraregular">3.82%</text><text x="301.88" y="527.25" font-size="11.00" class="sc-notoserifcjksc">，两者均优于</text><text x="370.77" y="527.25" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="424.75" y="527.25" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="471.64" y="527.25" font-size="11.00" class="sc-loraregular">6.21%</text><text x="503.08" y="527.25" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="542.87" font-size="11.00" class="sc-loraregular">6.32%</text><text x="102.67" y="542.87" font-size="11.00" class="sc-notoserifcjksc">），并与</text><text x="149.56" y="542.87" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="197.16" y="542.87" font-size="11.00" class="sc-notoserifcjksc">大体持平。</text><text x="72.00" y="610.50" font-size="11.00" class="sc-lorabold">5.2.2.4</text><text x="106.26" y="610.50" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="642.89" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的产品的鲁棒性，例如</text><text x="470.89" y="642.89" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude in</text><text x="72.00" y="658.51" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Chrome</text><text x="116.09" y="658.51" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">扩展程序</text><text x="160.09" y="658.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="173.98" y="658.51" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Cowork</text><text x="252.03" y="658.51" font-size="11.00" class="sc-notoserifcjksc">。当前评估包含</text><text x="331.92" y="658.51" font-size="11.00" class="sc-loraregular">129</text><text x="351.08" y="658.51" font-size="11.00" class="sc-notoserifcjksc">个精选环境，这些环境在训练中从未出</text><text x="72.00" y="674.13" font-size="11.00" class="sc-notoserifcjksc">现过，并包含通过截图或页面读取查看的高质量攻击。这些环境</text><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="470.89" y="634.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="470.89" y="634.09" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="506.29" y="634.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="509.18" y="634.09" width="9.77" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="518.95" y="634.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="72.00" y="649.71" width="41.19" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="113.19" y="649.71" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="116.09" y="649.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="127.09" y="649.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="127.09" y="649.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="138.09" y="649.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="138.09" y="649.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="149.09" y="649.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="149.09" y="649.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="173.98" y="649.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="173.98" y="649.71" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="209.38" y="649.71" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="212.27" y="649.71" width="39.75" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p066.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 66 页"><text x="75.25" y="131.01" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="202.39" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="241.80" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="267.13" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="292.46" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="317.79" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="343.12" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="368.45" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">未启用安全防护措施时的攻</text><text x="251.50" y="146.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">击成功率</text><text x="251.50" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="393.25" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">启用安全防护措施时的攻击成</text><text x="393.25" y="146.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="393.25" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">经过筛选，以确保攻击总能被查看到。注入是否成功由环境内的程序化检查器进行验证。</text><text x="72.00" y="385.97" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.51 114.61 120.14" y="385.97" font-size="9.00" class="sc-lorabold">5.2.2.4.A]</text><text x="125.98" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">专业红队测试人员提示词注入攻击在浏览器使用环境中的攻击成功率</text><text x="395.98" y="385.97" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="530.98" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">粗</text><text x="72.00" y="397.67" font-size="9.00" class="sc-notoserifcjkscbold">体</text><text x="81.00" y="397.67" font-size="9.00" class="sc-notoserifcjksc">标出，次佳分数以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="398.37" y="397.67" font-size="9.00" class="sc-loraregular">10</text><text x="409.60" y="397.67" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所</text><text x="72.00" y="409.37" font-size="9.00" class="sc-notoserifcjksc">有尝试中成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="464.77" font-size="11.00" class="sc-notoserifcjksc">在未启用安全防护措施的浏览器使用环境中，</text><text x="292.00" y="464.77" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="72.00" y="480.39" font-size="11.00" class="sc-notoserifcjksc">领先的最强鲁棒性：开启扩展思考时攻击成功率为</text><text x="316.89" y="480.39" font-size="11.00" class="sc-loraregular sc-k">0.93%</text><text x="348.31" y="480.39" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时为</text><text x="428.20" y="480.39" font-size="11.00" class="sc-loraregular sc-k">1.01%</text><text x="455.15" y="480.39" font-size="11.00" class="sc-notoserifcjksc">。这优于</text><text x="502.05" y="480.39" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="496.01" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="119.06" y="496.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="130.06" y="496.01" font-size="11.00" class="sc-loraregular sc-k">29.7%</text><text x="159.14" y="496.01" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="181.14" y="496.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="264.14" y="496.01" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="333.03" y="496.01" font-size="11.00" class="sc-loraregular">31.5%</text><text x="361.43" y="496.01" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="430.33" y="496.01" font-size="11.00" class="sc-loraregular sc-k">17.8%</text><text x="457.37" y="496.01" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="482.27" y="496.01" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="511.63" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="125.98" y="511.63" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="194.87" y="511.63" font-size="11.00" class="sc-loraregular sc-k">50.7%</text><text x="224.51" y="511.63" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="293.41" y="511.63" font-size="11.00" class="sc-loraregular sc-k">47.3%</text><text x="322.36" y="511.63" font-size="11.00" class="sc-notoserifcjksc">）。借助我们正在各浏览器使用场景中部署</text><text x="72.00" y="527.25" font-size="11.00" class="sc-notoserifcjksc">的新安全防护措施</text><text x="160.00" y="523.59" font-size="6.60" class="sc-loraregular">7</text><text x="163.04" y="527.25" font-size="11.00" class="sc-notoserifcjksc">，在两种思考设置下均未观察到针对</text><text x="341.94" y="527.25" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="389.88" y="527.25" font-size="11.00" class="sc-notoserifcjksc">的成功攻击，与</text><text x="469.78" y="527.25" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="542.87" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="542.87" font-size="11.00" class="sc-notoserifcjksc">持平，并优于</text><text x="190.84" y="542.87" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="273.84" y="542.87" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="284.84" y="542.87" font-size="11.00" class="sc-loraregular sc-k">0.08%</text><text x="316.62" y="542.87" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="341.51" y="542.87" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="433.78" y="542.87" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="502.67" y="542.87" font-size="11.00" class="sc-loraregular">1.16%</text><text x="529.31" y="542.87" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="558.49" font-size="11.00" class="sc-notoserifcjksc">关闭思考时</text><text x="129.89" y="558.49" font-size="11.00" class="sc-loraregular sc-k">0.39%</text><text x="161.31" y="558.49" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">7</text><text x="77.40" y="703.81" font-size="10.00" class="sc-notoserifcjksc">这些安全防护措施最早在</text><text x="190.03" y="703.81" font-size="10.00" class="sc-loraregular sc-k">Mythos 5</text><text x="235.44" y="703.81" font-size="10.00" class="sc-notoserifcjksc">与</text><text x="248.07" y="703.81" font-size="10.00" class="sc-loraregular sc-k">Fable 5</text><text x="282.98" y="703.81" font-size="10.00" class="sc-notoserifcjksc">系统卡第</text><text x="325.61" y="703.81" font-size="10.00" class="sc-loraregular">5.2.2.3</text><text x="357.38" y="703.81" font-size="10.00" class="sc-notoserifcjksc">节中以</text><text x="387.38" y="703.81" font-size="10.00" class="sc-loraregular">“</text><text x="391.38" y="703.81" font-size="10.00" class="sc-notoserifcjksc">更新的安全防护措施</text><text x="481.38" y="703.81" font-size="10.00" class="sc-loraregular">”</text><text x="484.87" y="703.81" font-size="10.00" class="sc-notoserifcjksc">（</text><text x="494.87 498.87 504.84 510.81 516.79 521.88 525.75 531.12" y="703.81" font-size="10.00" class="sc-loraregular">“updated</text><text x="72.00" y="718.01" font-size="10.00" class="sc-loraregular sc-k">safeguards”</text><text x="125.56" y="718.01" font-s
