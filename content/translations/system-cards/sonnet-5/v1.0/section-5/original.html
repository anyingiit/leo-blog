<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p062.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 62 页"><text x="72.00" y="346.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="346.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="346.75" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71" y="346.75" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入鲁棒性，</text><text x="223.71" y="346.75" font-size="9.00" class="sc-notoserifcjksc">来自与</text><text x="253.08 259.93 263.76 268.32 273.07 275.44 280.49 287.61 292.26" y="346.75" font-size="9.00" class="sc-loraregular">Gray Swan</text><text x="300.09" y="346.75" font-size="9.00" class="sc-notoserifcjksc">合作举办的为期一周的漏洞赏金计划。分数越低越好。它涵</text><text x="72.00" y="358.45" font-size="9.00" class="sc-notoserifcjksc">盖工具使用、编程和计算机使用方面的</text><text x="227.37" y="358.45" font-size="9.00" class="sc-loraregular">11</text><text x="236.29" y="358.45" font-size="9.00" class="sc-notoserifcjksc">个场景。攻击成功率按提交的所有有效聊天尝试计算。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="399.06" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="399.06" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="133.84 141.53 144.52 150.13 156.70 163.28 169.24 172.13 180.87 187.43 194.00 199.09 201.99 207.95 210.66" y="399.06" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="219.73" y="399.06" font-size="11.00" class="sc-notoserifcjksc">并列取得漏洞赏金中的最强结果，二者均仅有</text><text x="442.62 449.28 451.98 455.99 462.35" y="399.06" font-size="11.00" class="sc-loraregular">0.19%</text><text x="474.81" y="399.06" font-size="11.00" class="sc-notoserifcjksc">的不重复的攻</text><text x="72.00" y="414.68" font-size="11.00" class="sc-notoserifcjksc">击成功，显著优于</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 207.42 213.86 220.53 227.21 233.10 237.35 240.25 246.21 248.80" y="414.68" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="255.16" y="414.68" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="266.16" y="414.68" font-size="11.00" class="sc-loraregular">1.41%</text><text x="292.41" y="414.68" font-size="11.00" class="sc-notoserifcjksc">）以及</text><text x="328.30 336.67 343.34 349.67 355.05 361.05 363.75" y="414.68" font-size="11.00" class="sc-loraregular">GPT-5.5</text><text x="369.75" y="414.68" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="380.75 386.88 389.42 396.25 402.43" y="414.68" font-size="11.00" class="sc-loraregular">3.08%</text><text x="412.00" y="414.68" font-size="11.00" class="sc-notoserifcjksc">）或</text><text x="436.89" y="414.68" font-size="11.00" class="sc-loraregular">Gemini 3.5</text><text x="72.00" y="430.30" font-size="11.00" class="sc-loraregular">Flash</text><text x="98.38" y="430.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="109.38 115.74 118.33 124.69 131.05" y="430.30" font-size="11.00" class="sc-loraregular">6.66%</text><text x="140.62" y="430.30" font-size="11.00" class="sc-notoserifcjksc">）等其他前沿模型。参与漏洞赏金的各模型的攻击成功率介于</text><text x="440.51 447.17 449.87 453.88 460.23" y="430.30" font-size="11.00" class="sc-loraregular">0.19%</text><text x="472.70" y="430.30" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="486.59" y="430.30" font-size="11.00" class="sc-loraregular">14.29%</text><text x="523.99" y="430.30" font-size="11.00" class="sc-notoserifcjksc">之</text><text x="72.00" y="445.92" font-size="11.00" class="sc-notoserifcjksc">间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p063.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 63 页"><text x="72.00" y="295.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="295.93" font-size="9.00" class="sc-lorabold">5.2.2.1.B]</text><text x="124.71" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="136.08" y="295.93" font-size="9.00" class="sc-lorabold">5.2.2.1.A</text><text x="170.95" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">中的漏洞赏金结果，按模态细分，展示表现最好的</text><text x="371.32" y="295.93" font-size="9.00" class="sc-lorabold">5</text><text x="378.55" y="295.93" font-size="9.00" class="sc-notoserifcjkscbold">个模型。</text><text x="414.55" y="295.93" font-size="9.00" class="sc-notoserifcjksc">分数越低越好。每种模态各有</text><text x="533.92" y="295.93" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="307.63" font-size="9.00" class="sc-notoserifcjksc">个不同场景，但计算机使用仅有</text><text x="200.37" y="307.63" font-size="9.00" class="sc-loraregular">3</text><text x="207.75" y="307.63" font-size="9.00" class="sc-notoserifcjksc">个场景。攻击成功率按提交的所有有效聊天尝试计算。</text><text x="72.00" y="348.25" font-size="11.00" class="sc-notoserifcjksc">按使用场景细分，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 204.53 210.96 217.64 224.32 230.20 234.46 237.35" y="348.25" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="246.24" y="348.25" font-size="11.00" class="sc-notoserifcjksc">在全部三个场景上都较</text><text x="359.13 366.82 369.81 375.42 381.99 388.57 394.53 397.42 403.66 410.10 416.77 423.45 429.33 433.59 436.48 442.45 445.04" y="348.25" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="454.29" y="348.25" font-size="11.00" class="sc-notoserifcjksc">有大幅改进，尤</text><text x="72.00" y="363.87" font-size="11.00" class="sc-notoserifcjksc">其是编程，攻击成功率从</text><text x="195.89" y="363.87" font-size="11.00" class="sc-loraregular">3.3%</text><text x="223.32" y="363.87" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="248.21 254.86 257.57 261.57" y="363.87" font-size="11.00" class="sc-loraregular">0.1%</text><text x="271.14" y="363.87" font-size="11.00" class="sc-notoserifcjksc">。工具使用和计算机使用也有所改进，分别从</text><text x="494.04 500.69 503.40 509.58 515.71" y="363.87" font-size="11.00" class="sc-loraregular">0.83%</text><text x="528.17" y="363.87" font-size="11.00" class="sc-notoserifcjksc">降</text><text x="72.00" y="379.49" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="85.89 92.55 95.25 101.38 107.38" y="379.49" font-size="11.00" class="sc-loraregular">0.35%</text><text x="116.95" y="379.49" font-size="11.00" class="sc-notoserifcjksc">、从</text><text x="141.84 148.49 151.20 157.16 163.16" y="379.49" font-size="11.00" class="sc-loraregular">0.45%</text><text x="175.62" y="379.49" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="200.51 207.17 209.71 216.30 221.37" y="379.49" font-size="11.00" class="sc-loraregular">0.07%</text><text x="230.94" y="379.49" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="255.83 263.52 266.51 272.12 278.69 285.27 291.23 294.12 302.86 309.42 315.99 321.08 323.98 329.94 332.65" y="379.49" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="341.72" y="379.49" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="374.72 380.96 387.39 394.07 400.75 406.63 410.89 413.78" y="379.49" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="422.67" y="379.49" font-size="11.00" class="sc-notoserifcjksc">在编程任务上略好</text><text x="72.00" y="395.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.65 92.36 96.36" y="395.11" font-size="11.00" class="sc-loraregular">0.1%</text><text x="108.83" y="395.11" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="133.72 140.38 143.08 149.04 153.05" y="395.11" font-size="11.00" class="sc-loraregular">0.41%</text><text x="162.62" y="395.11" font-size="11.00" class="sc-notoserifcjksc">），在计算机使用上以</text><text x="275.51 282.17 284.71 291.30 296.37" y="395.11" font-size="11.00" class="sc-loraregular">0.07%</text><text x="308.83" y="395.11" font-size="11.00" class="sc-notoserifcjksc">持平，但在工具使用上略差：</text><text x="451.83" y="395.11" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="499.43" y="395.11" font-size="11.00" class="sc-notoserifcjksc">的攻击</text><text x="72.00" y="410.73" font-size="11.00" class="sc-notoserifcjksc">成功率为</text><text x="118.89" y="410.73" font-size="11.00" class="sc-loraregular">0%</text><text x="135.29" y="410.73" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="160.19 166.42 172.86 179.54 186.21 192.10 196.35 199.25" y="410.73" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="208.14" y="410.73" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="222.03 228.68 231.39 237.52 243.51" y="410.73" font-size="11.00" class="sc-loraregular">0.35%</text><text x="253.08" y="410.73" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="461.59" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11" y="461.59" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00" y="493.97" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="493.97" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35" y="493.97" font-size="11.00" class="sc-notoserifcjksc">提供的外部自适应红队测试工具</text><text x="333.24" y="493.97" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="364.28" y="493.97" font-size="11.00" class="sc-notoserifcjksc">，评估我们的模型在编程环境中对提</text><text x="72.00" y="509.59" font-size="11.00" class="sc-notoserifcjksc">示词注入的鲁棒性。</text><text x="171.00" y="509.59" font-size="11.00" class="sc-loraregular">Shade</text><text x="204.93" y="509.59" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="347.93 352.62 358.58 361.67 368.35 372.01 378.45 383.14 388.93 394.89 404.73 410.69 417.27 421.53 424.42 427.41 433.35 439.03 443.79 450.47 453.56 460.23" y="509.59" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="466.32" y="509.59" font-size="11.00" class="sc-notoserifcjksc">）以及人在回</text><text x="72.00" y="525.21" font-size="11.00" class="sc-notoserifcjksc">路的洞见，迭代提升其利用模型漏洞的能力。攻击者先针对此前的一组模型、在这些测试用例上</text><text x="72.00" y="540.83" font-size="11.00" class="sc-notoserifcjksc">进行优化，然后在相同场景下迁移到最新模型上。</text><text x="72.00" y="591.13" font-size="11.00" class="sc-notoserifcjksc">下表报告了该攻击者的攻击成功率；该攻击者在一组</text><text x="327.89" y="591.13" font-size="11.00" class="sc-loraregular">40</text><text x="343.58" y="591.13" font-size="11.00" class="sc-notoserifcjksc">个场景上训练，随后在相同场景上进行</text><text x="72.00" y="606.75" font-size="11.00" class="sc-notoserifcjksc">评估。每个场景中，攻击者有</text><text x="217.89" y="606.75" font-size="11.00" class="sc-loraregular">200</text><text x="240.36" y="606.75" font-size="11.00" class="sc-notoserifcjksc">次尝试。我们报告成功尝试的总体百分比，以及至少有一次尝</text><text x="72.00" y="622.37" font-size="11.00" class="sc-notoserifcjksc">试成功的场景数量。</text><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="333.24" y="485.17" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="333.24" y="485.17" width="31.04" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="160.00" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="199.41" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="224.74" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="250.07" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="275.40" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="300.73" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="328.18" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">未启用安全防护措施时的攻</text><text x="251.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">击成功率</text><text x="251.50" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="393.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">启用安全防护措施时的攻击成</text><text x="393.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="393.25" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="347.81" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="347.81" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.38 114.48 120.01 123.49 125.86 131.19 136.78 141.50 146.86" y="347.81" font-size="9.00" class="sc-lorabold">5.2.2.2.A] Shade</text><text x="154.07" y="347.81" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在编程环境中的攻击成功率</text><text x="343.07" y="347.81" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="478.07" y="347.81" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="496.07" y="347.81" font-size="9.00" class="sc-notoserifcjksc">标出，次</text><text x="72.00" y="359.51" font-size="9.00" class="sc-notoserifcjksc">佳分数以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="353.37" y="359.51" font-size="9.00" class="sc-loraregular">200</text><text x="371.74" y="359.51" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有尝试中</text><text x="72.00" y="371.21" font-size="9.00" class="sc-notoserifcjksc">成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="426.61" font-size="11.00" class="sc-notoserifcjksc">在所有被评估的模型中，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 237.53 243.96 250.64 257.32 263.20 267.46 270.35" y="426.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="279.24" y="426.61" font-size="11.00" class="sc-notoserifcjksc">在编程环境中对提示词注入表现出最强的鲁棒性：开</text><text x="72.00" y="442.23" font-size="11.00" class="sc-notoserifcjksc">启扩展思考时，所有尝试的攻击成功率为</text><text x="272.89 279.55 282.25 288.38 292.39" y="442.23" font-size="11.00" class="sc-loraregular">0.31%</text><text x="301.96" y="442.23" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时为</text><text x="381.85 388.50 391.21 397.12 403.47" y="442.23" font-size="11.00" class="sc-loraregular">0.29%</text><text x="413.04" y="442.23" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="437.94 445.63 448.62 454.23 460.79 467.37 473.33 476.23 482.46 488.90 495.58 502.25 508.14 512.40 515.29 521.25 523.85" y="442.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="72.00" y="457.85" font-size="11.00" class="sc-notoserifcjksc">相比这是大幅改进，后者开启思考时达到</text><text x="272.89 276.90 282.80 285.16 290.23 294.23" y="457.85" font-size="11.00" class="sc-loraregular">12.71%</text><text x="303.80" y="457.85" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时达到</text><text x="394.70" y="457.85" font-size="11.00" class="sc-loraregular">45.26%</text><text x="431.19" y="457.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="442.19 448.43 454.87 461.54 468.22 474.11 478.36 481.26" y="457.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="490.14" y="457.85" font-size="11.00" class="sc-notoserifcjksc">的表现也</text><text x="72.00" y="473.47" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.71" y="473.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="179.89" y="473.47" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="248.78 253.37 255.91 262.74 268.87" y="473.47" font-size="11.00" class="sc-loraregular">7.03%</text><text x="278.44" y="473.47" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="347.33 351.33 355.92 358.63 364.59 370.55" y="473.47" font-size="11.00" class="sc-loraregular">17.44%</text><text x="380.12" y="473.47" font-size="11.00" class="sc-notoserifcjksc">），并与</text><text x="427.01 434.70 437.70 443.31 449.87 456.45 462.41 465.31 475.24 481.10 485.36 491.95 498.38 503.47 506.37" y="473.47" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="512.36" y="473.47" font-size="11.00" class="sc-notoserifcjksc">（开</text><text x="72.00" y="489.09" font-size="11.00" class="sc-notoserifcjksc">启思考时</text><text x="118.89 125.55 128.25 134.22 140.21" y="489.09" font-size="11.00" class="sc-loraregular">0.45%</text><text x="149.78" y="489.09" font-size="11.00" class="sc-notoserifcjksc">）相当。启用安全防护措施后，</text><text x="303.78 310.02 316.45 323.13 329.81 335.69 339.95 342.84" y="489.09" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="351.73" y="489.09" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率进一步降至开启思考时</text><text x="72.00 78.65 81.20 88.03 94.39" y="504.71" font-size="11.00" class="sc-loraregular">0.09%</text><text x="103.96" y="504.71" font-size="11.00" class="sc-notoserifcjksc">、关闭思考时</text><text x="172.85 179.50 182.21 186.21 192.34" y="504.71" font-size="11.00" class="sc-loraregular">0.13%</text><text x="201.91" y="504.71" font-size="11.00" class="sc-notoserifcjksc">，为所有受测模型中最低。</text><text x="72.00" y="572.34" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="572.34" font-size="11.00" class="sc-notoserifcjkscbold">计算机使用</text><text x="72.00" y="604.73" font-size="11.00" class="sc-notoserifcjksc">我们还使用</text><text x="129.89" y="604.73" font-size="11.00" class="sc-loraregular">Shade</text><text x="163.83" y="604.73" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="188.72 196.41 199.40 205.01 211.58 218.16" y="604.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="227.01" y="604.73" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性；在这类环境中，模型直接与</text><text x="72.00" y="620.35" font-size="11.00" class="sc-notoserifcjksc">图形用户界面（</text><text x="149.00" y="620.35" font-size="11.00" class="sc-loraregular">GUI</text><text x="169.33" y="620.35" font-size="11.00" class="sc-notoserifcjksc">）交互。攻击者直接针对测试用例进行优化。与编程评估类似，攻击者在</text><text x="524.22" y="620.35" font-size="11.00" class="sc-loraregular">14</text><text x="72.00" y="635.97" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，我们衡量所有尝试中的成功情况，并</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">6</text><text x="78.10 85.09 87.81 92.91 98.88 104.86 110.28 112.91 118.58 124.43 130.50 136.57 141.92 145.79 148.42 153.84 156.20" y="703.81" font-size="10.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="164.61" y="703.81" font-size="10.00" class="sc-notoserifcjksc">属于攻击者训练时所针对的模型集合，因此其攻击成功率预计会更高，且不可直接比</text><text x="72.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc">较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="75.25" y="131.01" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="202.39" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="241.80" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="267.13" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="292.46" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="317.79" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="343.12" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="368.45" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">未启用安全防护措施时的攻</text><text x="251.50" y="146.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">击成功率</text><text x="251.50" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="328.75" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="398.50" y="131.00" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">启用安全防护措施时的攻击</text><text x="398.50" y="146.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">成功率</text><text x="398.50" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="478.00" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">按至少有一次攻击成功的场景进行细分统计。我们比较了在有无我们为保护此情境下用户而设计</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的额外安全防护措施时的模型鲁棒性。</text><text x="72.00" y="385.97" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26 123.73 126.10 131.44 137.03 141.74 147.11" y="385.97" font-size="9.00" class="sc-lorabold">5.2.2.3.A] Shade</text><text x="154.31" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在计算机使用环境中的攻击成功率</text><text x="370.31" y="385.97" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="505.31" y="385.97" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="523.31" y="385.97" font-size="9.00" class="sc-notoserifcjksc">标</text><text x="72.00" y="397.67" font-size="9.00" class="sc-notoserifcjksc">出，次佳分数以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="380.37" y="397.67" font-size="9.00" class="sc-loraregular">200</text><text x="398.74" y="397.67" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有</text><text x="72.00" y="409.37" font-size="9.00" class="sc-notoserifcjksc">尝试中成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="464.77" font-size="11.00" class="sc-notoserifcjksc">在计算机使用环境中，</text><text x="182.00 188.24 194.67 201.35 208.03 213.91 218.17 221.06" y="464.77" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="229.95" y="464.77" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="254.84 262.53 265.52 271.13 277.70 284.28 290.24 293.13 299.37 305.81 312.48 319.16 325.04 329.30 332.19 338.16 340.75" y="464.77" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="350.00" y="464.77" font-size="11.00" class="sc-notoserifcjksc">同样有大幅改进：开启扩展思考时，攻</text><text x="72.00" y="480.39" font-size="11.00" class="sc-notoserifcjksc">击成功率从</text><text x="129.89 133.90 139.80 142.35 149.18" y="480.39" font-size="11.00" class="sc-loraregular">12.0%</text><text x="161.64" y="480.39" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="186.53" y="480.39" font-size="11.00" class="sc-loraregular">2.25%</text><text x="216.62" y="480.39" font-size="11.00" class="sc-notoserifcjksc">；关闭思考时，从</text><text x="307.51" y="480.39" font-size="11.00" class="sc-loraregular">14.4%</text><text x="338.61" y="480.39" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="363.50 369.86 372.40 379.23 385.19" y="480.39" font-size="11.00" class="sc-loraregular">6.04%</text><text x="394.76" y="480.39" font-size="11.00" class="sc-notoserifcjksc">。在两种设置下，</text><text x="482.76 489.00 495.43 502.11 508.79 514.67 518.93 521.82" y="480.39" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="72.00" y="496.01" font-size="11.00" class="sc-notoserifcjksc">均与</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.71" y="496.01" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="179.89" y="496.01" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="248.78 253.37 256.07 260.08 266.04" y="496.01" font-size="11.00" class="sc-loraregular">7.14%</text><text x="275.61" y="496.01" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="344.50" y="496.01" font-size="11.00" class="sc-loraregular">6.21%</text><text x="373.05" y="496.01" font-size="11.00" class="sc-notoserifcjksc">）相当或更优，但</text><text x="463.94 471.63 474.62 480.23 486.80 493.38 499.34 502.23 512.16 518.03 522.28 528.87 535.31" y="496.01" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00" y="511.63" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="511.63" font-size="11.00" class="sc-notoserifcjksc">仍是总体最强的模型，开启思考时为</text><text x="259.78 266.44 269.14 275.32 281.23" y="511.63" font-size="11.00" class="sc-loraregular">0.82%</text><text x="290.80" y="511.63" font-size="11.00" class="sc-notoserifcjksc">。启用安全防护措施后，</text><text x="411.80 418.04 424.47 431.15 437.83 443.71 447.97 450.86" y="511.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><tex
