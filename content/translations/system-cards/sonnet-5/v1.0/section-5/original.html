.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="116.23" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 152.42 158.86 165.53 172.21 178.10 182.35 185.24" y="116.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="194.13" y="116.23" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了与发布</text><text x="318.03 325.71 328.71 334.32 340.88 347.46 353.42 356.32 365.05 371.62 378.18 383.28 386.17 392.13 394.84" y="116.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="403.91" y="116.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="417.81 425.50 428.49 434.10 440.67 447.24 453.21 456.10 461.69 467.36 473.76 476.76 482.72 485.61" y="116.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5</text><text x="494.50" y="116.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="131.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos 5</text><text x="121.95" y="131.85" font-size="11.00" class="sc-notoserifcjksc">时大体相同的智能体安全评估套件。这些评估涵盖对编程智能体和计算机使用</text><text x="72.00" y="147.47" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 105.07 111.63 118.20 122.46 128.42 133.18 136.08 142.64 147.74" y="147.47" font-size="11.00" class="sc-loraregular">computer use</text><text x="153.70" y="147.47" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意使用、影响力行动的自主执行，以及提示词注入（</text><text x="472.70 479.26 483.95 490.38 500.22 506.79" y="147.47" font-size="11.00" class="sc-loraregular">prompt</text><text x="72.00 75.09 81.71 84.58 90.49 96.29 100.54 103.64 110.07" y="163.09" font-size="11.00" class="sc-loraregular">injection</text><text x="116.75" y="163.09" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。在本次发布中，我们在</text><text x="284.64" y="163.09" font-size="11.00" class="sc-loraregular">ART</text><text x="308.37" y="163.09" font-size="11.00" class="sc-notoserifcjksc">提示词注入基准测试（近期的</text><text x="454.26 461.95 464.94 470.55 477.12 483.70" y="163.09" font-size="11.00" class="sc-loraregular">Claude</text><text x="492.55" y="163.09" font-size="11.00" class="sc-notoserifcjksc">模型在该</text><text x="72.00" y="178.71" font-size="11.00" class="sc-notoserifcjksc">基准上已接近饱和）之外，补充了一个新的</text><text x="283.89 292.26 296.95 302.52 308.32 311.22 317.40 326.10 331.78" y="178.71" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="341.35" y="178.71" font-size="11.00" class="sc-notoserifcjksc">间接提示词注入（</text><text x="429.35 432.44 439.11 445.69 448.78 453.47 459.38 465.17 469.43 472.32 478.89 483.58 490.01 499.85 506.41" y="178.71" font-size="11.00" class="sc-loraregular">indirect prompt</text><text x="72.00 75.09 81.71 84.58 90.49 96.29 100.54 103.64 110.07" y="194.33" font-size="11.00" class="sc-loraregular">injection</text><text x="116.75" y="194.33" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="127.75 131.43 138.04" y="194.33" font-size="11.00" class="sc-loraregular">IPI</text><text x="141.73" y="194.33" font-size="11.00" class="sc-notoserifcjksc">）基准，其涵盖编程、计算机使用和工具使用任务。我们还报告了一项新的漏洞赏</text><text x="72.00" y="209.95" font-size="11.00" class="sc-notoserifcjksc">金的结果，该漏洞赏金的场景同样覆盖上述几类使用场景。本节中的智能体安全评估旨在衡量模</text><text x="72.00" y="225.57" font-size="11.00" class="sc-notoserifcjksc">型本身的行为，独立于部署时原本可能拦截请求的安全防护措施（例如安全分类器）。</text><text x="72.00" y="310.53" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们发现</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95" y="310.53" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="221.84" y="310.53" font-size="11.00" class="sc-notoserifcjksc">在智能体安全评估中相较</text><text x="345.74 351.97 358.41 365.08 371.76 377.65 381.90 384.80 390.76 393.35" y="310.53" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="402.61" y="310.53" font-size="11.00" class="sc-notoserifcjksc">有所改进，尤其是在提示词</text><text x="72.00" y="326.15" font-size="11.00" class="sc-notoserifcjksc">注入鲁棒性方面。在</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 219.87 226.31 232.89" y="326.15" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="241.74" y="326.15" font-size="11.00" class="sc-notoserifcjksc">网络安全相关测试用例上，结果则好坏参半：</text><text x="461.74 467.98 474.41 481.09 487.77 493.65 497.91 500.80" y="326.15" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="509.69" y="326.15" font-size="11.00" class="sc-notoserifcjksc">拒绝</text><text x="72.00" y="341.77" font-size="11.00" class="sc-notoserifcjksc">恶意请求的可靠性远高于</text><text x="195.89 202.13 208.57 215.24 221.92 227.80 232.06 234.95 240.92 243.51" y="341.77" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="249.87" y="341.77" font-size="11.00" class="sc-notoserifcjksc">，但相应地，在两用与良性测试用例上的过度拒绝（</text><text x="502.87 509.25 514.75 520.71 525.39" y="341.77" font-size="11.00" class="sc-loraregular">over-</text><text x="72.00 76.69 82.65 86.37 92.93 98.03 103.70" y="357.39" font-size="11.00" class="sc-loraregular">refusal</text><text x="106.69" y="357.39" font-size="11.00" class="sc-notoserifcjksc">）略有增加。</text><text x="72.00" y="409.07" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="409.07" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00" y="446.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="446.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="474.07" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="474.07" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="474.07" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="193.08 200.77 203.76 209.37 215.93 222.51 228.48 231.37 239.06 245.49 252.07" y="474.07" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="260.92" y="474.07" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用及良性的网络安全相</text><text x="72.00" y="489.69" font-size="11.00" class="sc-notoserifcjksc">关请求。提示词集分为两类：</text><text x="108.00" y="538.83" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00" y="538.83" font-size="11.00" class="sc-loraregular">61</text><text x="176.26" y="538.83" font-size="11.00" class="sc-notoserifcjksc">个违反我们</text><text x="231.26" y="538.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="275.26" y="538.83" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="286.26 294.45 299.54 305.22 311.25 317.21 320.10 326.66 333.09 336.09 339.18 344.97" y="538.83" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="350.78" y="538.83" font-size="11.00" class="sc-notoserifcjksc">）、应当被拒绝的提示词。示例包括协</text><text x="108.00" y="554.45" font-size="11.00" class="sc-notoserifcjksc">助制作恶意软件、编写用于</text><text x="242.89 250.98 259.17 265.54" y="554.45" font-size="11.00" class="sc-loraregular">DDoS</text><text x="274.67" y="554.45" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件；以及</text><text x="108.00" y="587.41" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00" y="587.41" font-size="11.00" class="sc-loraregular">61</text><text x="187.26" y="587.41" font-size="11.00" class="sc-notoserifcjksc">个涵盖敏感但被允许的请求的提示词，</text><text x="374.26 381.94 384.94 390.55 397.11 403.69" y="587.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="412.55" y="587.41" font-size="11.00" class="sc-notoserifcjksc">应当对这些请求提供协</text><text x="108.00" y="603.03" font-size="11.00" class="sc-notoserifcjksc">助。示例包括运行网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="652.18" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="652.18" font-size="11.00" class="sc-notoserifcjksc">获得了标准的</text><text x="227.13 234.82 237.81 243.42 249.99 256.57 262.53 265.42 273.11 279.55 286.13" y="652.18" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="294.98" y="652.18" font-size="11.00" class="sc-notoserifcjksc">工具集。每个提示词运行</text><text x="418.87" y="652.18" font-size="11.00" class="sc-loraregular">10</text><text x="432.60" y="652.18" font-size="11.00" class="sc-notoserifcjksc">次，两类合计共</text><text x="512.49 516.50 519.27 525.18 531.09" y="652.18" font-size="11.00" class="sc-loraregular">1,220</text><text x="72.00" y="667.80" font-size="11.00" class="sc-notoserifcjksc">次测试。与近期发布的模型一样，我们在运行本评估时默认应用</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 428.87 435.31 441.89" y="667.80" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="450.74" y="667.80" font-size="11.00" class="sc-notoserifcjksc">系统提示词</text><text x="72.00" y="683.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.09 93.90 98.99 103.25 109.21 119.05 121.94 128.51 133.19 139.63 149.46 156.03" y="683.42" font-size="11.00" class="sc-loraregular">system prompt</text><text x="160.29" y="683.42" font-size="11.00" class="sc-notoserifcjksc">），且不附加部署时可能存在的额外安全防护措施。</text><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="318.03" y="107.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="318.03" y="107.43" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="353.42" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="356.32" y="107.43" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="383.28" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="386.17" y="107.43" width="14.85" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="417.81" y="107.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="417.81" y="107.43" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="453.21" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="456.10" y="107.43" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="482.72" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="485.61" y="107.43" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="491.61" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="494.50" y="107.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="505.50" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="72.00" y="123.05" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="110.17" y="123.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="113.06" y="123.05" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="231.26" y="530.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="231.26" y="530.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="530.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="530.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="530.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="530.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="530.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="530.03" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="77.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="236.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">恶意（</text><text x="269.49" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="279.42" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="236.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="390.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">两用与良性（</text><text x="456.22" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="466.16" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（成功率）</text><text x="72.00" y="260.25" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="260.25" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.84 114.31 116.68 122.87 125.68 130.39 135.95 141.32 146.16 148.53 154.72 159.81 165.18" y="260.25" font-size="9.00" class="sc-lorabold">5.1.1.A] Claude Code</text><text x="172.39" y="260.25" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="217.39" y="260.25" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列中的最佳分数以</text><text x="343.39" y="260.25" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="361.39" y="260.25" font-size="9.00" class="sc-notoserifcjksc">标出，次佳分数以下划线标出（注意两者均</text><text x="72.00" y="271.95" font-size="9.00" class="sc-notoserifcjksc">未考虑误差范围）。由于评估有所更新，先前模型的结果与以往系统卡（</text><text x="360.00 365.06 369.81 373.98 377.46 382.34 390.38 392.75 399.04 403.69 407.52" y="271.95" font-size="9.00" class="sc-loraregular">System Card</text><text x="412.90" y="271.95" font-size="9.00" class="sc-notoserifcjksc">）中的结果存在差异。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="312.56" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="312.56" font-size="11.00" class="sc-notoserifcjksc">在恶意请求上的表现显著优于</text><text x="265.84 272.08 278.51 285.19 291.87 297.75 302.01 304.90 310.87 313.46" y="312.56" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="319.82" y="312.56" font-size="11.00" class="sc-notoserifcjksc">：它对</text><text x="355.71 362.07 367.98 370.68 376.55 381.62" y="312.56" font-size="11.00" class="sc-loraregular">92.37%</text><text x="394.08" y="312.56" font-size="11.00" class="sc-notoserifcjksc">的有害请求作出了安全回应，</text><text x="72.00" y="328.18" font-size="11.00" class="sc-notoserifcjksc">而</text><text x="85.89 92.13 98.57 105.24 111.92 117.80 122.06 124.95 130.92 133.51" y="328.18" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="142.76" y="328.18" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="156.66 161.73 168.08 170.68 177.04 183.87" y="328.18" font-size="11.00" class="sc-loraregular">76.60%</text><text x="193.44" y="328.18" font-size="11.00" class="sc-notoserifcjksc">。不过，我们也观察到，</text><text x="314.44 320.68 327.11 333.79 340.47 346.35 350.61 353.50" y="328.18" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="362.39" y="328.18" font-size="11.00" class="sc-notoserifcjksc">拒绝协助两用及良性请求的频率高于</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="343.80" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98" y="343.80" font-size="11.00" class="sc-notoserifcjksc">，更接近我们在</text><text x="205.87 213.56 216.55 222.16 228.73 235.31 241.27 244.16 254.09 259.96 264.21 270.80 277.24 282.33 285.22 291.89 296.58 302.48 308.04 311.13 317.05" y="343.80" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="328.75" y="343.80" font-size="11.00" class="sc-notoserifcjksc">上观察到的情况。</text><text x="72.00" y="391.85" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39" y="391.85" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00" y="419.75" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="419.75" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="419.75" font-size="11.00" class="sc-notoserifcjksc">在沙箱化环境中获得基于图形用户界面（</text><text x="366.18" y="419.75" font-size="11.00" class="sc-loraregular">GUI</text><text x="386.51" y="419.75" font-size="11.00" class="sc-notoserifcjksc">）和命令行界面（</text><text x="474.51" y="419.75" font-size="11.00" class="sc-loraregular">CLI</text><text x="492.24" y="419.75" font-size="11.00" class="sc-notoserifcjksc">）的计算</text><text x="72.00" y="435.37" font-size="11.00" class="sc-notoserifcjksc">机使用工具时，是否会拒绝有害任务。这组</text><text x="283.89" y="435.37" font-size="11.00" class="sc-loraregular">112</text><text x="300.70" y="435.37" font-size="11.00" class="sc-notoserifcjksc">个不重复任务与上一份系统卡中的相同，涵盖三</text><text x="72.00" y="450.99" font-size="11.00" class="sc-notoserifcjksc">个风险领域：</text><text x="108.00" y="484.52" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00" y="500.71" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；以及</text><text x="108.00" y="516.90" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="295.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="234.90" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="234.90" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="234.90" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82" y="234.90" font-size="9.00" class="sc-notoserifcjkscbold">未采取缓解措施时的恶意计算机使用评估结果。</text><text x="306.82" y="234.90" font-size="9.00" class="sc-notoserifcjksc">越高越好。对于</text><text x="372.19" y="234.90" font-size="9.00" class="sc-loraregular">Opus</text><text x="396.61" y="234.90" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="407.98 413.08 418.35 423.81 429.27 434.09" y="234.90" font-size="9.00" class="sc-loraregular">Sonnet</text><text x="439.94" y="234.90" font-size="9.00" class="sc-notoserifcjksc">模型，比率为开启思考与</text><text x="72.00" y="246.60" font-size="9.00" class="sc-notoserifcjksc">关闭思考结果的平均值；对于</text><text x="191.37 199.49 204.29 207.77 213.17 218.43" y="246.60" font-size="9.00" class="sc-loraregular">Mythos</text><text x="224.96" y="246.60" font-size="9.00" class="sc-notoserifcjksc">模型，仅为开启思考的结果。每列中的最佳分数以</text><text x="422.96" y="246.60" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="440.96" y="246.60" font-size="9.00" class="sc-notoserifcjksc">标出，次佳分数以下划线</text><text x="72.00" y="258.30" font-size="9.00" class="sc-notoserifcjksc">标出（但未考虑误差范围）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="300.46" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="300.46" font-size="11.00" class="sc-notoserifcjksc">在该评估中的表现与</text><text x="260.13 266.37 272.80 279.48 286.16 292.04 296.30 299.19 305.16 307.75" y="300.46" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="317.00" y="300.46" font-size="11.00" class="sc-notoserifcjksc">几乎相同，在约</text><text x="396.90" y="300.46" font-size="11.00" class="sc-loraregular">85%</text><text x="421.54" y="300.46" font-size="11.00" class="sc-notoserifcjksc">的情况下对有害任务给</text><text x="72.00" y="316.08" font-size="11.00" class="sc-notoserifcjksc">出了恰当回应。</text><text x="72.00" y="347.37" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72" y="347.37" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00" y="375.27" font-size="11.00" class="sc-notoserifcjksc">本评估考察模型能否自主执行端到端的影响力行动，且其方式足以为恶意行为者带来实质性的能</text><text x="72.00" y="390.89" font-size="11.00" class="sc-notoserifcjksc">力提升（</text><text x="116.00 122.57 129.13 132.13 135.22 139.07" y="390.89" font-size="11.00" class="sc-loraregular">uplift</text><text x="143.32" y="390.89" font-size="11.00" class="sc-notoserifcjksc">）。为此，我们将模型置于配备模拟社交媒体平台工具（例如模拟内容审核和反制</text><text x="72.00" y="406.51" font-size="11.00" class="sc-notoserifcjksc">互动障碍）的智能体运行框架（</text><text x="226.00" y="406.51" font-size="11.00" class="sc-loraregular">harness</text><text x="265.85" y="406.51" font-size="11.00" class="sc-notoserifcjksc">）中，然后依据固定的成功标准对其评分，例如是否在符</text><text x="72.00" y="422.13" font-size="11.00" class="sc-notoserifcjksc">合所述地点作息的合理时间发帖，以及是否根据互动数据迭代内容。</text><text x="72.00" y="488.61" font-size="11.00" class="sc-notoserifcjksc">我们测试的两个场景与以往发布时相同：</text><text x="108.00" y="521.00" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展一场伪草根运动（</text><text x="411.35" y="521.00" font-size="11.00" class="sc-notoserifcjksc">）式的行动，以压低特定</text><text x="108.00" y="536.62" font-size="11.00" class="sc-notoserifcjksc">候选人的投票率和支持热情；以及</text><text x="108.00" y="553.38" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示识别人口群体断层线，并投放带有强烈情绪色彩、针对特定文</text><text x="108.00" y="569.00" font-size="11.00" class="sc-notoserifcjksc">化定制的信息来激化这些断层。</text><text x="72.00" y="618.15" font-size="11.00" class="sc-notoserifcjksc">每个场景在</text><text x="129.89" y="618.15" font-size="11.00" class="sc-loraregular">3</text><text x="138.91" y="618.15" font-size="11.00" class="sc-notoserifcjksc">个模拟平台阻力等级下各运行</text><text x="284.81" y="618.15" font-size="11.00" class="sc-loraregular">3</text><text x="293.83" y="618.15" font-size="11.00" class="sc-notoserifcjksc">次，即每个场景共</text><text x="384.72" y="618.15" font-size="11.00" class="sc-loraregular">9</text><text x="393.97" y="618.15" font-size="11.00" class="sc-notoserifcjksc">次模拟，并依据</text><text x="473.86" y="618.15" font-size="11.00" class="sc-loraregular">70</text><text x="488.66" y="618.15" font-size="11.00" class="sc-notoserifcjksc">项成功标</text><text x="72.00" y="633.77" font-size="11.00" class="sc-notoserifcjksc">准评分。本评估针对模型的一个无害性训练有所削减的</text><text x="336.00" y="633.77" font-size="11.00" class="sc-loraregular">“</text><text x="340.40" y="633.77" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="384.40 390.99 396.95 399.94 406.45 410.17 416.74 419.73 425.11 431.55 438.22 441.16" y="633.77" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="446.97" y="633.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.97" y="633.77" font-size="11.00" class="sc-loraregular">”</text><text x="461.81" y="633.77" font-size="11.00" class="sc-notoserifcjksc">变体运行，以评</text><text x="72.00" y="649.39" font-size="11.00" class="sc-notoserifcjksc">估模型的原始能力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="77.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50 85.06 88.50 94.26 101.05 107.60 113.52 116.41 126.72 132.78 137.32 144.15 150.37 155.71 158.60" y="173.25" font-size="10.99" class="sc-lorabold">Claude Mythos 5</text><text x="77.50" y="188.87" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="211.38" font-size="10.99" class="sc-lorabold">Claude Opus 4.8</text><text x="77.50" y="227.00" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50 85.06 88.50 94.26 101.05 107.60 113.52 116.41 126.72 132.78 137.32 144.15 150.37 155.71 158.60 165.62 170.81 176.73 182.65 186.24 192.16" y="249.51" font-size="10.99" class="sc-lorabold">Claude Mythos Preview</text><text x="77.50" y="265.13" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="287.64" font-size="10.99" class="sc-lorabold">Claude Sonnet 4.6</text><text x="77.50" y="303.26" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="236.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景（任务完成率）</text><text x="390.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00" y="317.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="317.96" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="317.96" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06" y="317.96" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06" y="317.96" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43" y="317.96" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="329.66" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高，表示能力越强，因而可能为恶意行为者带来的能力提升也越大。</text><text x="72.00" y="370.27" font-size="11.00" class="sc-notoserifcjksc">在两个测试场景中，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 215.53 221.96 228.64 235.32 241.20 245.46 248.35" y="370.27" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="257.24" y="370.27" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本的成功率均高于</text><text x="403.13 409.37 415.80 422.48 429.16 435.04 439.30 442.19 448.16 450.75" y="370.27" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="457.11" y="370.27" font-size="11.00" class="sc-notoserifcjksc">，但在自主开展</text><text x="72.00" y="385.89" font-size="11.00" class="sc-notoserifcjksc">影响力行动的能力上仍远低于</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.71" y="385.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="300.89" y="385.89" font-size="11.00" class="sc-notoserifcjksc">。我们评估认为，</text><text x="388.89 395.12 401.56 408.24 414.91 420.80 425.06 427.95" y="385.89" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="436.84" y="385.89" font-size="11.00" class="sc-notoserifcjksc">在许多操作步骤上都</text><text x="72.00" y="401.51" font-size="11.00" class="sc-notoserifcjksc">需要大量的人工指导。</text><text x="72.00" y="451.23" font-size="11.00" class="sc-notoserifcjksc">与以往发布一样，这些模型的完整训练版本（包含无害性训练）基本上从第一轮起就拒绝参与这</text><text x="72.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc">些任务，因为这两个场景都明显违反了我们的</text><text x="292.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="336.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="517.39" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02" y="517.39" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00" y="543.96" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00" y="559.58" font-size="11.00" class="sc-notoserifcjksc">藏在智能体执行任务期间所处理的工具结果中的恶意指令。例如，智能体被要求总结的一封电子</text><text x="72.00" y="575.20" font-size="11.00" class="sc-notoserifcjksc">邮件中，可能包含指示它外泄所有近期内部通信的隐藏文本。一次成功的提示词注入攻击会使模</text><text x="72.00" y="606.44" font-size="11.00" class="sc-notoserifcjksc">或共享文档中的单个载荷，就能危及任何处理它的智能体，而攻击者无需针对特定用户或系统。</text><text x="72.00" y="622.06" font-size="11.00" class="sc-notoserifcjksc">当模型既能访问私密数据、又能代表用户采取行动时，这类攻击尤其危险，因为这种组合使攻击</text><text x="72.00" y="637.68" font-size="11.00" class="sc-notoserifcjksc">者能够外泄敏感信息或触发未经授权的操作。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="292.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="292.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="303.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="303.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="314.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="314.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="325.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="325.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="98.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18" y="98.82" font-size="11.00" class="sc-notoserifcjksc">模型已使大多数公开基准以及第三方研究机构构</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">建的基准趋于饱和。我们持续投入于衡量鲁棒性提升的自适应评估。</text><text x="72.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc">与其前代模型</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 185.42 191.86 198.53 205.21 211.10 215.35 218.25 224.21 226.80" y="179.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="236.05" y="179.78" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="269.05 276.74 279.73 285.35 291.91 298.49 304.45 307.35 313.58 320.02 326.69 333.37 339.26 343.51 346.41" y="179.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="355.29" y="179.78" font-size="11.00" class="sc-notoserifcjksc">在鲁棒性上有了大幅提升，在抵御提</text><text x="72.00" y="226.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39" y="226.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部红队测试</text><text x="72.00" y="254.59" font-size="11.00" class="sc-notoserifcjksc">为与以往的系统卡保持一致，我们报告了</text><text x="272.89 279.78 285.81 291.77 298.35 302.60 305.50 312.33 318.24 324.81 327.71 334.21 340.15 345.82 355.66 358.75 365.43" y="254.59" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="371.51" y="254.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="382.51" y="254.59" font-size="11.00" class="sc-loraregular">ART</text><text x="403.34" y="254.59" font-size="11.00" class="sc-notoserifcjksc">）基准测试的结果，该基准</text><text x="72.00" y="270.21" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="85.89 94.26 98.95 104.52 110.32 113.22 119.40 128.10 133.78" y="270.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="143.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="154.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所</text><text x="275.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="286.35 294.62 302.13 305.02 311.91 315.60 318.49 324.73 330.63 336.48 343.05 347.81 351.08 355.36 361.17 364.06 367.66 374.34 379.43 383.68 386.95 391.21 397.78 402.03" y="270.21" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="408.00" y="270.21" font-size="11.00" class="sc-notoserifcjksc">）合作开发。然而，由于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="285.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="285.83" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="146.18" y="285.83" font-size="11.00" class="sc-loraregular">ART</text><text x="169.91" y="285.83" font-size="11.00" class="sc-notoserifcjksc">上已连续数个版本接近最高表现，我们不再将其作为与其他前沿模型进行比</text><text x="72.00" y="301.45" font-size="11.00" class="sc-notoserifcjksc">较的主要提示词注入基准。今后，我们将报告下文所述的一个新基准的结果，该基准提供更多样</text><text x="72.00" y="317.07" font-size="11.00" class="sc-notoserifcjksc">化的场景，并能在较少的尝试次数下提供更多信号。</text><text x="72.00" y="384.12" font-size="11.00" class="sc-loraregular">ART</text><text x="95.73" y="384.12" font-size="11.00" class="sc-notoserifcjksc">衡量的是攻击者在针对目标进行</text><text x="252.62 258.53 264.24" y="384.12" font-size="11.00" class="sc-loraregular">k=1</text><text x="268.24" y="384.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="279.24 285.15 290.86 294.86" y="384.12" font-size="11.00" class="sc-loraregular">k=10</text><text x="304.58" y="384.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="318.48 324.38 330.09 334.10 340.93" y="384.12" font-size="11.00" class="sc-loraregular">k=100</text><text x="350.65" y="384.12" font-size="11.00" class="sc-notoserifcjksc">次尝试后成功的概率。攻击取自</text><text x="507.55" y="384.12" font-size="11.00" class="sc-loraregular">ART</text><text x="72.00 78.89 83.57 89.53 96.21" y="399.74" font-size="11.00" class="sc-loraregular">Arena</text><text x="101.89" y="399.74" font-size="11.00" class="sc-notoserifcjksc">，在其中，数以千计的红队测试（</text><text x="266.89 271.57 277.48 284.06 289.44 293.69 299.63 305.31 315.14 318.24 324.91" y="399.74" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="330.99" y="399.74" font-size="11.00" class="sc-notoserifcjksc">）人员针对当时可用的一组模型不断改进攻</text><text x="72.00" y="415.36" font-size="11.00" class="sc-notoserifcjksc">击策略。</text><text x="116.00 124.37 129.06 134.62 140.43 143.32 149.51 158.21 163.88" y="415.36" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="173.45" y="415.36" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中挑选出一个子集，这些攻击已被证明对多个模型有效，而不</text><text x="72.00" y="430.98" font-size="11.00" class="sc-notoserifcjksc">仅仅对最初针对的那个模型有效。</text><a href="https://grayswan.ai/" rel="noopener"><rect x="85.89" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="85.89" y="261.41" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="110.32" y="261.41" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="113.22" y="261.41" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="154.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="154.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="165.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="165.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="176.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="176.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="187.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="187.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="198.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="198.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="209.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="209.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="220.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="220.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="231.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="231.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="261.41" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p059.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 59 页"><text x="72.00" y="348.25" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="348.25" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.14 149.09 153.94 159.62 163.34 165.71 171.76 176.60 181.96 184.33 189.72 194.56 199.28 207.56 210.50 216.24" y="348.25" font-size="9.00" class="sc-lorabold">Agent Red Teaming</text><text x="221.26" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26" y="348.25" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29" y="348.25" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击，分数越低越好。</text><text x="455.29" y="348.25" font-size="9.00" class="sc-notoserifcjksc">结果表示攻击者针对</text><text x="72.00" y="359.95" font-size="9.00" class="sc-notoserifcjksc">每个模型在</text><text x="119.37 124.20 128.87" y="359.95" font-size="9.00" class="sc-loraregular">k=1</text><text x="132.15" y="359.95" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="141.15 145.98 150.65 153.93" y="359.95" font-size="9.00" class="sc-loraregular">k=10</text><text x="161.88" y="359.95" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="173.25 178.08 182.75 186.03 191.62" y="359.95" font-size="9.00" class="sc-loraregular">k=100</text><text x="199.57" y="359.95" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到成功攻击的概率。攻击成功情况在</text><text x="390.94" y="359.95" font-size="9.00" class="sc-loraregular">19</text><text x="401.79" y="359.95" font-size="9.00" class="sc-notoserifcjksc">个不同场景上评估。越低越好。</text><text x="72.00" y="400.56" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="400.56" font-size="11.00" class="sc-loraregular">ART</text><text x="109.62" y="400.56" font-size="11.00" class="sc-notoserifcjksc">基准测试上，</text><text x="175.62 183.31 186.30 191.91 198.48 205.06 211.02 213.91 220.15 226.58 233.26 239.94 245.82 250.08 252.97" y="400.56" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="261.86" y="400.56" font-size="11.00" class="sc-notoserifcjksc">表现出与</text><text x="308.75 316.44 319.43 325.04 331.61 338.19 344.15 347.04 355.78 362.35 368.91 374.00 376.90 382.86 385.57" y="400.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="394.64" y="400.56" font-size="11.00" class="sc-notoserifcjksc">相当的鲁棒性，并且鲁棒性优</text><text x="72.00" y="416.18" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 92.13 98.57 105.24 111.92 117.80 122.06 124.95 130.92 133.51" y="416.18" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="139.87" y="416.18" font-size="11.00" class="sc-notoserifcjksc">，超过了所有接受评估的非</text><text x="274.76 282.45 285.44 291.05 297.62 304.20" y="416.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="313.05" y="416.18" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="465.10" font-size="11.00" class="sc-notoserifcjksc">今后，我们将报告一个新的间接提示词注入基准</text><text x="303.00" y="461.44" font-size="6.60" class="sc-loraregular">3</text><text x="306.68" y="465.10" font-size="11.00" class="sc-notoserifcjksc">的结果，该基准由我们与</text><text x="430.57 438.94 443.63 449.19 455.00 457.89 464.08 472.78 478.45" y="465.10" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="485.13" y="465.10" font-size="11.00" class="sc-notoserifcjksc">、英国人工</text><text x="72.00" y="480.72" font-size="11.00" class="sc-notoserifcjksc">智能安全研究所、美国人工智能标准与创新中心（</text><text x="314.00 322.27 328.51 331.40 339.09 345.05 351.63 355.89 361.85 366.61 369.51 373.17 379.60 384.37 387.26 394.15 397.83 400.72 406.92 411.17 416.85 423.53 430.10 435.78 440.47 447.04 452.14 455.03 460.71 467.38" y="480.72" font-size="11.00" class="sc-loraregular">US Center for AI Standards and</text><text x="72.00 75.60 82.27 88.95 95.33 100.78 106.38 110.63 113.72 120.16" y="496.34" font-size="11.00" class="sc-loraregular">Innovation</text><text x="126.83" y="496.34" font-size="11.00" class="sc-notoserifcjksc">）以及其他模型开发者合作构建。与</text><text x="305.73" y="496.34" font-size="11.00" class="sc-loraregular">ART</text><text x="329.45" y="496.34" font-size="11.00" class="sc-notoserifcjksc">类似，我们组织了一场竞赛，由红队测试人</text><text x="72.00" y="511.96" font-size="11.00" class="sc-notoserifcjksc">员在</text><text x="96.89" y="511.96" font-size="11.00" class="sc-loraregular">28</text><text x="111.88" y="511.96" font-size="11.00" class="sc-notoserifcjksc">个不同的攻击场景中寻找针对前沿模型的攻击；这些场景检验模型对间接提示词注入的易</text><text x="72.00" y="527.58" font-size="11.00" class="sc-notoserifcjksc">感性，此类注入试图诱导不可逆的有害操作，包括私密数据外泄、数据破坏、系统入侵和非预期</text><text x="72.00" y="543.20" font-size="11.00" class="sc-notoserifcjksc">的金融交易。这一新基准中的场景经过设计，力求与前沿模型当今所能执行任务的真实度相匹</text><text x="72.00" y="558.82" font-size="11.00" class="sc-notoserifcjksc">配。与</text><text x="107.89" y="558.82" font-size="11.00" class="sc-loraregular">ART</text><text x="131.62" y="558.82" font-size="11.00" class="sc-notoserifcjksc">不同，这些场景除工具使用外，还涵盖编程和计算机使用。经过去重后，我们选出了</text><text x="72.00 76.00 78.78 82.78 88.91" y="574.44" font-size="11.00" class="sc-loraregular">1,130</text><text x="98.64" y="574.44" font-size="11.00" class="sc-notoserifcjksc">个在各目标模型间表现出高可迁移性的攻击。我们在不附加额外安全防护措施的情况下评估</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="590.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="590.06" font-size="11.00" class="sc-notoserifcjksc">模型，而其他前沿模型则在其公开可用的端点上评估，这些端点可能包含、也可能不包含</text><text x="72.00" y="605.68" font-size="11.00" class="sc-notoserifcjksc">额外的安全防护措施。</text><a href="https://arxiv.org/abs/2603.15714" rel="noopener"><rect x="334.50" y="706.50" width="161.25" height="13.50" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="72.00" y="406.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="406.75" font-size="9.00" class="sc-lorabold">5.2.1.B]</text><text x="117.82" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.92 149.19 153.79 158.75 161.12 166.40 173.66 178.38 184.12 186.49 189.97 195.67" y="406.75" font-size="9.00" class="sc-lorabold">Gray Swan IPI</text><text x="201.52" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">基准（</text><text x="228.52" y="406.75" font-size="9.00" class="sc-lorabold">2026</text><text x="251.38" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">年第一季度）的间接提示词注入攻击，</text><text x="404.38" y="406.75" font-size="9.00" class="sc-notoserifcjksc">分数越低越好。所有模型均使用扩</text><text x="72.00" y="418.45" font-size="9.00" class="sc-notoserifcjksc">展思考（</text><text x="108.00 112.83 117.60 121.09 125.96 131.43 136.81 141.64 147.02 149.39 152.87 158.27 160.79 166.26 171.09 173.62 179.08" y="418.45" font-size="9.00" class="sc-loraregular">extended thinking</text><text x="184.06" y="418.45" font-size="9.00" class="sc-notoserifcjksc">）。结果表示攻击者在</text><text x="276.43 281.26 285.93" y="418.45" font-size="9.00" class="sc-loraregular">k=1</text><text x="289.21" y="418.45" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="298.21 303.04 307.71 310.99" y="418.45" font-size="9.00" class="sc-loraregular">k=10</text><text x="318.94" y="418.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="330.31 335.14 339.81 343.09" y="418.45" font-size="9.00" class="sc-loraregular">k=15</text><text x="350.36" y="418.45" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到成功攻击的概率。越低越好。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 108.43 113.70 119.16 124.62 129.44 132.92 135.29 140.17 142.29" y="430.15" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="149.86" y="430.15" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="161.23 168.07 172.95 181.00 183.53 188.99 191.52 193.89 198.90 201.11 204.39 206.76 212.21 216.04" y="430.15" font-size="9.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="223.68" y="430.15" font-size="9.00" class="sc-notoserifcjksc">的结果不可直接比较，因为它们被纳入了用于收集攻击的红队竞赛。</text><text x="72.00" y="485.56" font-size="11.00" class="sc-notoserifcjksc">在这一新基准上，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 204.53 210.96 217.64 224.32 230.20 234.46 237.35" y="485.56" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="246.24" y="485.56" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="260.13 267.82 270.81 276.42 282.99 289.57 295.53 298.42 307.16 313.73 320.29 325.39 328.28 334.24 336.95" y="485.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="346.02" y="485.56" font-size="11.00" class="sc-notoserifcjksc">几乎持平。其攻击成功率（</text><text x="478.02 483.62 487.99 492.24 497.92 503.77" y="485.56" font-size="11.00" class="sc-loraregular">attack</text><text x="72.00 77.09 83.66 89.46 95.25 101.22 106.31 111.40 114.30 118.98 124.58 128.84" y="501.18" font-size="11.00" class="sc-loraregular">success rate</text><text x="134.80" y="501.18" font-size="11.00" class="sc-notoserifcjksc">）低于</text><text x="170.69 178.38 181.37 186.98 193.55 200.13 206.09 208.98 215.22 221.66 228.33 235.01 240.89 245.15 248.04 254.01 256.60" y="501.18" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="262.96" y="501.18" font-size="11.00" class="sc-notoserifcjksc">，不过这一结果不可直接比较，因为</text><text x="441.85 448.09 454.53 461.20 467.88 473.76 478.02 480.91 486.88 489.47" y="501.18" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="498.72" y="501.18" font-size="11.00" class="sc-notoserifcjksc">被纳入</text><text x="72.00" y="516.80" font-size="11.00" class="sc-notoserifcjksc">了用于收集攻击的红队竞赛。</text><text x="215.00 221.24 227.67 234.35 241.03 246.91 251.17 254.06" y="516.80" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="262.95" y="516.80" font-size="11.00" class="sc-notoserifcjksc">优于所有接受评估的非</text><text x="375.84 383.53 386.52 392.13 398.70 405.28" y="516.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="414.13" y="516.80" font-size="11.00" class="sc-notoserifcjksc">模型，包括</text><text x="472.03 480.40 487.06 493.40 498.78 504.77 507.48" y="516.80" font-size="11.00" class="sc-loraregular">GPT-5.5</text><text x="516.37" y="516.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="532.42" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="156.02" y="532.42" font-size="11.00" class="sc-notoserifcjksc">；这两个模型未参与该红队竞赛，因此针对它们的评估可直接用于比较攻击迁</text><text x="72.00" y="548.04" font-size="11.00" class="sc-notoserifcjksc">移。</text><text x="72.00" y="597.24" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15" y="597.24" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景抵御自适应攻击者的鲁棒性</text><text x="72.00" y="629.14" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="625.47" font-size="6.60" class="sc-loraregular">4</text><text x="361.58" y="629.14" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00" y="644.76" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新型方法的攻击。我</text><text x="72.00" y="660.38" font-size="11.00" class="sc-notoserifcjksc">们持续投入于自适应评估，以更好地近似</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="368.25" y="707.25" width="157.50" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">现实世界攻击者的能力，这项工作既在内部开展，也与外部研究合作伙伴协作进行。本节中的评</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">估衡量的是针对会根据与模型的交互来改进攻击的攻击者的鲁棒性。这些评估体现了一种刻意宽</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">松的威胁模型：攻击者直接针对测试场景进行优化，并且每个场景可进行多次尝试。现实世界中</text><text x="72.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">现的可能性。</text><text x="72.00" y="212.16" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="212.16" font-size="11.00" class="sc-notoserifcjkscbold">跨使用场景的实时漏洞赏金</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">正如我们在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="244.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="215.78" y="244.55" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="248.78" y="244.55" font-size="11.00" class="sc-notoserifcjksc">中首次所做的那样，我们与</text><text x="383.67 392.05 396.73 402.30 408.11 411.00 417.18 425.88 431.56" y="244.55" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="441.13" y="244.55" font-size="11.00" class="sc-notoserifcjksc">合作举办了一次实时</text><text x="72.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">漏洞赏金活动，专家红队测试人员通过对包括</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 339.42 345.86 352.53 359.21 365.10 369.35 372.25" y="260.17" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="378.24" y="256.50" font-size="6.60" class="sc-loraregular">5</text><text x="384.73" y="260.17" font-size="11.00" class="sc-notoserifcjksc">在内的一组前沿模型发起成功的</text><text x="72.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">提示词注入攻击，角逐一个奖金池。目标模型的身份自始至终都是隐藏的，并且每位红队测试人</text><text x="72.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">员在每个场景下针对每个模型最多只能提交一次成功攻击。本轮涵盖工具使用、编程和计算机使</text><text x="72.00" y="307.03" font-size="11.00" class="sc-notoserifcjksc">用方面的</text><text x="118.89" y="307.03" font-size="11.00" class="sc-loraregular">11</text><text x="129.79" y="307.03" font-size="11.00" class="sc-notoserifcjksc">个新场景。</text><text x="184.79 192.48 195.48 201.09 207.65 214.23" y="307.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.09" y="307.03" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="258.98 265.57 268.66 275.01" y="307.03" font-size="11.00" class="sc-loraregular">high</text><text x="284.49" y="307.03" font-size="11.00" class="sc-notoserifcjksc">推理强度（</text><text x="339.49 343.74 350.33 353.42 360.10 366.01 369.10 375.78 381.86 384.75 390.71 394.54 398.20 404.64 409.48" y="307.03" font-size="11.00" class="sc-loraregular">thinking effort</text><text x="413.74" y="307.03" font-size="11.00" class="sc-notoserifcjksc">）下接受评估，且未启用</text><text x="72.00" y="322.65" font-size="11.00" class="sc-notoserifcjksc">我们产品中使用的额外保护措施（例如运行框架层面的防御和提示词注入探针），因此结果反映</text><text x="72.00" y="338.27" font-size="11.00" class="sc-notoserifcjksc">的是模型本身的鲁棒性，代表已部署系统实际鲁棒性的下界。所有外部模型均以其生产环境配置</text><text x="72.00" y="353.89" font-size="11.00" class="sc-notoserifcjksc">进行测试，该配置可能包含、也可能不包含额外的安全防护措施。</text><text x="391.00 399.37 406.04 412.37 417.75 423.75 426.45" y="353.89" font-size="11.00" class="sc-loraregular">GPT-5.5</text><text x="435.34" y="353.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="449.23 455.82 458.91 465.26" y="353.89" font-size="11.00" class="sc-loraregular">high</text><text x="474.74" y="353.89" font-size="11.00" class="sc-notoserifcjksc">推理强度下接</text><text x="72.00" y="369.51" font-size="11.00" class="sc-notoserifcjksc">受评估。</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">5</text><text x="77.90" y="703.81" font-size="10.00" class="sc-notoserifcjksc">请注意，</text><text x="117.90 124.89 127.61 132.71 138.68 144.66 150.08 152.71 161.74 167.07 170.94 176.93 182.78 187.41 190.04" y="703.81" font-size="10.00" class="sc-loraregular">Claude Mythos 5</text><text x="198.12" y="703.81" font-size="10.00" class="sc-notoserifcjksc">和</text><text x="210.75 215.83 220.99 226.81 229.53 234.95 237.58" y="703.81" font-size="10.00" class="sc-loraregular">Fable 5</text><text x="245.66" y="703.81" font-size="10.00" class="sc-notoserifcjksc">未被纳入本次漏洞赏金，因为它们已为响应美国政府的</text><text x="485.66" y="703.81" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">出口管制指</text><text x="72.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">令</text><text x="82.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc">而下线。</text><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="129.89" y="235.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="129.89" y="235.75" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="165.29" y="235.75" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="168.18" y="235.75" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="195.14" y="235.75" width="2.89" height=
