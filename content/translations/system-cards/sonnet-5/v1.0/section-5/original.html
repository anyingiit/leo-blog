ext x="83.00 88.80 95.23 105.07 111.63 118.20 122.46 128.42 133.18 136.08 142.64 147.74" y="147.47" font-size="11.00" class="sc-loraregular">computer use</text><text x="153.70 164.70 175.70 186.70 197.70 208.70 219.70 230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70" y="147.47" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意使用、影响力行动的自主执行，以及提示词注入（</text><text x="472.70 479.26 483.95 490.38 500.22 506.79" y="147.47" font-size="11.00" class="sc-loraregular">prompt</text><text x="72.00 75.09 81.71 84.58 90.49 96.29 100.54 103.64 110.07" y="163.09" font-size="11.00" class="sc-loraregular">injection</text><text x="116.75 127.75 138.75 149.75 160.75 171.75 182.75 193.75 204.75 215.75 226.75 237.75 248.75 259.75 270.75" y="163.09" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。在本次发布中，我们在</text><text x="284.64 291.53 298.43" y="163.09" font-size="11.00" class="sc-loraregular">ART</text><text x="308.37 319.37 330.37 341.37 352.37 363.37 374.37 385.37 396.37 407.37 418.37 429.37 440.37" y="163.09" font-size="11.00" class="sc-notoserifcjksc">提示词注入基准测试（近期的</text><text x="454.26 461.95 464.94 470.55 477.12 483.70" y="163.09" font-size="11.00" class="sc-loraregular">Claude</text><text x="492.55 503.55 514.55 525.55" y="163.09" font-size="11.00" class="sc-notoserifcjksc">模型在该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="178.71" font-size="11.00" class="sc-notoserifcjksc">基准上已接近饱和）之外，补充了一个新的</text><text x="283.89 292.26 296.95 302.52 308.32 311.22 317.40 326.10 331.78" y="178.71" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="341.35 352.35 363.35 374.35 385.35 396.35 407.35 418.35" y="178.71" font-size="11.00" class="sc-notoserifcjksc">间接提示词注入（</text><text x="429.35 432.44 439.11 445.69 448.78 453.47 459.38 465.17 469.43 472.32 478.89 483.58 490.01 499.85 506.41" y="178.71" font-size="11.00" class="sc-loraregular">indirect prompt</text><text x="72.00 75.09 81.71 84.58 90.49 96.29 100.54 103.64 110.07" y="194.33" font-size="11.00" class="sc-loraregular">injection</text><text x="116.75" y="194.33" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="127.75 131.43 138.04" y="194.33" font-size="11.00" class="sc-loraregular">IPI</text><text x="141.73 152.73 163.73 174.73 185.73 196.73 207.73 218.73 229.73 240.73 251.73 262.73 273.73 284.73 295.73 306.73 317.73 328.73 339.73 350.73 361.73 372.73 383.73 394.73 405.73 416.73 427.73 438.73 449.73 460.73 471.73 482.73 493.73 504.73 515.73 526.73" y="194.33" font-size="11.00" class="sc-notoserifcjksc">）基准，其涵盖编程、计算机使用和工具使用任务。我们还报告了一项新的漏洞赏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="209.95" font-size="11.00" class="sc-notoserifcjksc">金的结果，该漏洞赏金的场景同样覆盖上述几类使用场景。本节中的智能体安全评估旨在衡量模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="225.57" font-size="11.00" class="sc-notoserifcjksc">型本身的行为，独立于部署时原本可能拦截请求的安全防护措施（例如安全分类器）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="310.53" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们发现</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95" y="310.53" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84" y="310.53" font-size="11.00" class="sc-notoserifcjksc">在智能体安全评估中相较</text><text x="345.74 351.97 358.41 365.0 .10 326.66 333.09 336.09 339.18 344.97" y="538.83" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="350.78 361.78 372.78 383.78 394.78 405.78 416.78 427.78 438.78 449.78 460.78 471.78 482.78 493.78 504.78 515.78 526.78" y="538.83" font-size="11.00" class="sc-notoserifcjksc">）、应当被拒绝的提示词。示例包括协</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="554.45" font-size="11.00" class="sc-notoserifcjksc">助制作恶意软件、编写用于</text><text x="242.89 250.98 259.17 265.54" y="554.45" font-size="11.00" class="sc-loraregular">DDoS</text><text x="274.67 285.67 296.67 307.67 318.67 329.67 340.67 351.67 362.67 373.67 384.67 395.67 406.67 417.67 428.67 439.67 450.67 461.67 472.67 483.67 494.67 505.67" y="554.45" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="587.41" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00 180.36" y="587.41" font-size="11.00" class="sc-loraregular">61</text><text x="187.26 198.26 209.26 220.26 231.26 242.26 253.26 264.26 275.26 286.26 297.26 308.26 319.26 330.26 341.26 352.26 363.26" y="587.41" font-size="11.00" class="sc-notoserifcjksc">个涵盖敏感但被允许的请求的提示词，</text><text x="374.26 381.94 384.94 390.55 397.11 403.69" y="587.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="412.55 423.55 434.55 445.55 456.55 467.55 478.55 489.55 500.55 511.55" y="587.41" font-size="11.00" class="sc-notoserifcjksc">应当对这些请求提供协</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="603.03" font-size="11.00" class="sc-notoserifcjksc">助。示例包括运行网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="652.18" font-size="11.00" class=" " class="sc-loraregular">GUI</text><text x="386.51 397.51 408.51 419.51 430.51 441.51 452.51 463.51" y="419.75" font-size="11.00" class="sc-notoserifcjksc">）和命令行界面（</text><text x="474.51 482.20 488.56" y="419.75" font-size="11.00" class="sc-loraregular">CLI</text><text x="492.24 503.24 514.24 525.24" y="419.75" font-size="11.00" class="sc-notoserifcjksc">）的计算</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="435.37" font-size="11.00" class="sc-notoserifcjksc">机使用工具时，是否会拒绝有害任务。这组</text><text x="283.89 287.90 291.90" y="435.37" font-size="11.00" class="sc-loraregular">112</text><text x="300.70 311.70 322.70 333.70 344.70 355.70 366.70 377.70 388.70 399.70 410.70 421.70 432.70 443.70 454.70 465.70 476.70 487.70 498.70 509.70 520.70" y="435.37" font-size="11.00" class="sc-notoserifcjksc">个不重复任务与上一份系统卡中的相同，涵盖三</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="450.99" font-size="11.00" class="sc-notoserifcjksc">个风险领域：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="484.52" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="500.71" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="516.90" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text></svg></div>

.60" font-size="9.00" class="sc-notoserifcjksc">模型，仅为开启思考的结果。每列中的最佳分数以</text><text x="422.96 431.96" y="246.60" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="440.96 449.96 458.96 467.96 476.96 485.96 494.96 503.96 512.96 521.96 530.96" y="246.60" font-size="9.00" class="sc-notoserifcjksc">标出，次佳分数以下划线</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="258.30" font-size="9.00" class="sc-notoserifcjksc">标出（但未考虑误差范围）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="300.46" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24 169.24 180.24 191.24 202.24 213.24 224.24 235.24 246.24" y="300.46" font-size="11.00" class="sc-notoserifcjksc">在该评估中的表现与</text><text x="260.13 266.37 272.80 279.48 286.16 292.04 296.30 299.19 305.16 307.75" y="300.46" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="300.46" font-size="11.00" class="sc-notoserifcjksc">几乎相同，在约</text><text x="396.90 403.08 409.07" y="300.46" font-size="11.00" class="sc-loraregular">85%</text><text x="421.54 432.54 443.54 454.54 465.54 476.54 487.54 498.54 509.54 520.54" y="300.46" font-size="11.00" class="sc-notoserifcjksc">的情况下对有害任务给</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="316.08" font-size="11.00" class="sc-notoserifcjksc">出了恰当回应。</text><text x="72.00 80.37 83.75 88.46 91.84" y="347.37" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72 193.72 206.72 219.72" y="347.37" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.27" font-size="11.00" class="sc-notoserifcjksc">本评估考察模型能否自主执行端到端的影响力行动，且其方式足以为恶意行为者带来实质性的能</text><text x="72.00 83.00 94.00 105.00" y="390.89" font-size="11.00" class="sc-notoserifcjksc">力提升（</text><text x="116.00 122.57 129.13 132.13 135.22 139.07" y="390.89" font-size="11.00" class="sc-loraregular">uplift</text><text x="143.32 154.32 165.32 176.32 187.32 198.32 209.32 220.32 231.32 242.32 253.32 264.32 275.32 286.32 297.32 308.32 319.32 330.32 341.32 352.32 363.32 374.32 385.32 396.32 407.32 418.32 429.32 440.32 451.32 462.32 473.32 484.32 495.32 506.32 517.32 528.32" y="390.89" font-size="11.00" class="sc-notoserifcjksc">）。为此，我们将模型置于配备模拟社交媒体平台工具（例如模拟内容审核和反制</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="406.51" font-size="11.00" class="sc-notoserifcjksc">互动障碍）的智能体运行框架（</text><text x="226.00 232.59 238.26 243.03 249.71 255.67 260.76" y="406.51" font-size="11.00" class="sc-loraregular">harness</text><text x="265.85 276.85 287.85 298.85 309.85 320.85 331.85 342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85 529.85" y="406.51" font-size="11.00" class="sc-notoserifcjksc">）中，然后依据固定的成功标准对其评分，例如是否在符</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="422.13" font-size="11.00" class="sc-notoserifcjksc">合所述地点作息的合理时间发帖，以及是否根据互动数据迭代内容。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="488.61" font-size="11.00" class="sc-notoserifcjksc">我们测试的两个场景与以往发布时相同：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="521.00" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展一场伪草根运动（</text><text x="411.35 422.35 433.35 444.35 455.35 466.35 477.35 488.35 499.35 510.35 521.35" y="521.00" font-size="11.00" class="sc-notoserifcjksc">）式的行动，以压低特定</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="536.62" font-size="11.00" class="sc-notoserifcjksc">候选人的投票率和支持热情；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="553.38" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示识别人口群体断层线，并投放带有强烈情绪色彩、针对特定文</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="569.00" font-size="11.00" class="sc-notoserifcjksc">化定制的信息来激化这些断层。</text><text x="72.00 83.00 94.00 105.00 116.00" y="618.15" font-size="11.00" class="sc-notoserifcjksc">每个场景在</text><text x="129.89" y="618.15" font-size="11.00" class="sc-loraregular">3</text><text x="138.91 149.91 160.91 171.91 182.91 193.91 204.91 215.91 226.91 237.91 248.91 259.91 270.91" y="618.15" font-size="11.00" class="sc-notoserifcjksc">个模拟平台阻力等级下各运行</text><text x="284.81" y="618.15" font-size="11.00" class="sc-loraregular">3</text><text x="293.83 304.83 315.83 326.83 337.83 348.83 359.83 370.83" y="618.15" font-size="11.00" class="sc-notoserifcjksc">次，即每个场景共</text><text x="384.72" y="618.15" font-size="11.00" class="sc-loraregular">9</text><text x="393.97 404.97 415.97 426.97 437.97 448.97 459.97" y="618.15" font-size="11.00" class="sc-notoserifcjksc">次模拟，并依据</text><text x="473.86 478.93" y="618.15" font-size="11.00" class="sc-loraregular">70</text><text x="488.66 499.66 510.66 521.66" y="618.15" font-size="11.00" class="sc-notoserifcjksc">项成功标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="633.77" font-size="11.00" class="sc-notoserifcjksc">准评分。本评估针对模型的一个无害性训练有所削减的</text><text x="336.00" y="633.77" font-size="11.00" class="sc-loraregular">“</text><text x="340.40 351.40 362.40 373.40" y="633.77" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="384.40 390.99 396.95 399.94 406.45 410.17 416.74 419.73 425.11 431.55 438.22 441.16" y="633.77" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="446.97" y="633.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.97" y="633.77" font-size="11.00" class="sc-loraregular">”</text><text x="461.81 472.81 483.81 494.81 505.81 516.81 527.81" y="633.77" font-size="11.00" class="sc-notoserifcjksc">变体运行，以评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="649.39" font-size="11.00" class="sc-notoserifcjksc">估模型的原始能力。</text></svg></div>

0" class="sc-lorabold">[</text><text x="75.47" y="317.96" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="317.96" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06 127.06 136.06 145.06 154.06 163.06 172.06 181.06 190.06 199.06 208.06 217.06 226.06 235.06 244.06 253.06 262.06 271.06 280.06" y="317.96" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06 298.06 307.06 316.06 325.06 334.06 343.06 352.06 361.06 370.06 379.06 388.06 397.06 406.06 415.06 424.06 433.06 442.06 451.06 460.06 469.06 478.06 487.06 496.06 505.06 514.06" y="317.96" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43 529.58" y="317.96" font-size="9.00" class="sc-loraregular">70</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00" y="329.66" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高，表示能力越强，因而可能为恶意行为者带来的能力提升也越大。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="370.27" font-size="11.00" class="sc-notoserifcjksc">在两个测试场景中，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 215.53 221.96 228.64 235.32 241.20 245.46 248.35" y="370.27" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="257.24 268.24 279.24 290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24 389.24" y="370.27" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本的成功率均高于</text><text x="403.13 409.37 415.80 422.48 429.16 435.04 439.30 442.19 448.16 450.75" y="370.27" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="457.11 468.11 479.11 490.11 501.11 512.11 523.11" y="370.27" font-size="11.00" class="sc-notoserifcjksc">，但在自主开展</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="385.89" font-size="11.00" class="sc-notoserifcjksc">影响力行动的能力上仍远低于</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.71" y="385.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89" y="385.89" font-size="11.00" class="sc-notoserifcjksc">。我们评估认为，</text><text x="388.89 395.12 401.56 408.24 414.91 420.80 425.06 427.95" y="385.89" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="436.84 447.84 458.84 469.84 480.84 491.84 502.84 513.84 524.84" y="385.89" font-size="11.00" class="sc-notoserifcjksc">在许多操作步骤上都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="401.51" font-size="11.00" class="sc-notoserifcjksc">需要大量的人工指导。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="451.23" font-size="11.00" class="sc-notoserifcjksc">与以往发布一样，这些模型的完整训练版本（包含无害性训练）基本上从第一轮起就拒绝参与这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc">些任务，因为这两个场景都明显违反了我们的</text><text x="292.00 303.00 314.00 325.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="336.00" y="466.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 81.02 84.66" y="517.39" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02 110.02 124.02 138.02 152.02 166.02 180.02 194.02 208.02 222.02 236.02 250.02 264.02 278.02" y="517.39" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="543.96" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="559.58" font-size="11.00" class="sc-notoserifcjksc">藏在智能体执行任务期间所处理的工具结果中的恶意指令。例如，智能体被要求总结的一封电子</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="575.20" font-size="11.00" class="sc-notoserifcjksc">邮件中，可能包含指示它外泄所有近期内部通信的隐藏文本。一次成功的提示词注入攻击会使模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="606.44" font-size="11.00" class="sc-notoserifcjksc">或共享文档中的单个载荷，就能危及任何处理它的智能体，而攻击者无需针对特定用户或系统。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="622.06" font-size="11.00" class="sc-notoserifcjksc">当模型既能访问私密数据、又能代表用户采取行动时，这类攻击尤其危险，因为这种组合使攻击</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="637.68" font-size="11.00" class="sc-notoserifcjksc">者能够外泄敏感信息或触发未经授权的操作。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="292.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="292.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="303.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="303.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="314.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="314.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="325.00" y="458.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="325.00" y="458.05" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="98.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="98.82" font-size="11.00" class="sc-notoserifcjksc">模型已使大多数公开基准以及第三方研究机构构</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">建的基准趋于饱和。我们持续投入于衡量鲁棒性提升的自适应评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc">与其前代模型</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 185.42 191.86 198.53 205.21 211.10 215.35 218.25 224.21 226.80" y="179.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="236.05 247.05 258.05" y="179.78" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="269.05 276.74 279.73 285.35 291.91 298.49 304.45 307.35 313.58 320.02 326.69 333.37 339.26 343.51 346.41" y="179.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="355.29 366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="179.78" font-size="11.00" class="sc-notoserifcjksc">在鲁棒性上有了大幅提升，在抵御提</text><text x="72.00 80.37 83.75 91.21 94.59" y="226.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39 115.39 128.39 141.39 154.39 167.39" y="226.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部红队测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="254.59" font-size="11.00" class="sc-notoserifcjksc">为与以往的系统卡保持一致，我们报告了</text><text x="272.89 279.78 285.81 291.77 298.35 302.60 305.50 312.33 318.24 324.81 327.71 334.21 340.15 345.82 355.66 358.75 365.43" y="254.59" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="371.51" y="254.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="382.51 389.39 396.30" y="254.59" font-size="11.00" class="sc-loraregular">ART</text><text x="403.34 414.34 425.34 436.34 447.34 458.34 469.34 480.34 491.34 502.34 513.34 524.34" y="254.59" font-size="11.00" class="sc-notoserifcjksc">）基准测试的结果，该基准</text><text x="72.00" y="270.21" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="85.89 94.26 98.95 104.52 110.32 113.22 119.40 128.10 133.78" y="270.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="143.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="154.35 165.35 176.35 187.35 198.35 209.35 220.35 231.35 242.35 253.35 264.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所</text><text x="275.35" y="270.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="286.35 294.62 302.13 305.02 311.91 315.60 318.49 324.73 330.63 336.48 343.05 347.81 351.08 355.36 361.17 364.06 367.66 374.34 379.43 383.68 386.95 391.21 397.78 402.03" y="270.21" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00" y="270.21" font-size="11.00" class="sc-notoserifcjksc">）合作开发。然而，由于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="285.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29" y="285.83" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="146.18 153.07 159.98" y="285.83" font-size="11.00" class="sc-loraregular">ART</text><text x="169.91 180.91 191.91 202.91 213.91 224.91 235.91 246.91 257.91 268.91 279.91 290.91 301.91 312.91 323.91 334.91 345.91 356.91 367.91 378.91 389.91 400.91 411.91 422.91 433.91 444.91 455.91 466.91 477.91 488.91 499.91 510.91 521.91" y="285.83" font-size="11.00" class="sc-notoserifcjksc">上已连续数个版本接近最高表现，我们不再将其作为与其他前沿模型进行比</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="301.45" font-size="11.00" class="sc-notoserifcjksc">较的主要提示词注入基准。今后，我们将报告下文所述的一个新基准的结果，该基准提供更多样</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="317.07" font-size="11.00" class="sc-notoserifcjksc">化的场景，并能在较少的尝试次数下提供更多信号。</text><text x="72.00 78.89 85.79" y="384.12" font-size="11.00" class="sc-loraregular">ART</text><text x="95.73 106.73 117.73 128.73 139.73 150.73 161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73" y="384.12" font-size="11.00" class="sc-notoserifcjksc">衡量的是攻击者在针对目标进行</text><text x="252.62 258.53 264.24" y="384.12" font-size="11.00" class="sc-loraregular">k=1</text><text x="268.24" y="384.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="279.24 285.15 290.86 294.86" y="384.12" font-size="11.00" class="sc-loraregular">k=10</text><text x="304.58" y="384.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="318.48 324.38 330.09 334.10 340.93" y="384.12" font-size="11.00" class="sc-loraregular">k=100</text><text x="350.65 361.65 372.65 383.65 394.65 405.65 416.65 427.65 438.65 449.65 460.65 471.65 482.65 493.65" y="384.12" font-size="11.00" class="sc-notoserifcjksc">次尝试后成功的概率。攻击取自</text><text x="507.55 514.43 521.34" y="384.12" font-size="11.00" class="sc-loraregular">ART</text><text x="72.00 78.89 83.57 89.53 96.21" y="399.74" font-size="11.00" class="sc-loraregular">Arena</text><text x="101.89 112.89 123.89 134.89 145.89 156.89 167.89 178.89 189.89 200.89 211.89 222.89 233.89 244.89 255.89" y="399.74" font-size="11.00" class="sc-notoserifcjksc">，在其中，数以千计的红队测试（</text><text x="266.89 271.57 277.48 284.06 289.44 293.69 299.63 305.31 315.14 318.24 324.91" y="399.74" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="330.99 341.99 352.99 363.99 374.99 385.99 396.99 407.99 418.99 429.99 440.99 451.99 462.99 473.99 484.99 495.99 506.99 517.99 528.99" y="399.74" font-size="11.00" class="sc-notoserifcjksc">）人员针对当时可用的一组模型不断改进攻</text><text x="72.00 83.00 94.00 105.00" y="415.36" font-size="11.00" class="sc-notoserifcjksc">击策略。</text><text x="116.00 124.37 129.06 134.62 140.43 143.32 149.51 158.21 163.88" y="415.36" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="173.45 184.45 195.45 206.45 217.45 228.45 239.45 250.45 261.45 272.45 283.45 294.45 305.45 316.45 327.45 338.45 349.45 360.45 371.45 382.45 393.45 404.45 415.45 426.45 437.45 448.45 459.45 470.45 481.45 492.45 503.45 514.45 525.45" y="415.36" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中挑选出一个子集，这些攻击已被证明对多个模型有效，而不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="430.98" font-size="11.00" class="sc-notoserifcjksc">仅仅对最初针对的那个模型有效。</text><a href="https://grayswan.ai/" rel="noopener"><rect x="85.89" y="261.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="85.89" y="261.41" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="110.32" y="261.41" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="113.22" y="261.41" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="no 1.58 280.58 289.58 298.58 307.58 316.58 325.58 334.58 343.58 352.58 361.58 370.58 379.58" y="359.95" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到成功攻击的概率。攻击成功情况在</text><text x="390.94 394.22" y="359.95" font-size="9.00" class="sc-loraregular">19</text><text x="401.79 410.79 419.79 428.79 437.79 446.79 455.79 464.79 473.79 482.79 491.79 500.79 509.79 518.79" y="359.95" font-size="9.00" class="sc-notoserifcjksc">个不同场景上评估。越低越好。</text><text x="72.00" y="400.56" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.69" y="400.56" font-size="11.00" class="sc-loraregular">ART</text><text x="109.62 120.62 131.62 142.62 153.62 164.62" y="400.56" font-size="11.00" class="sc-notoserifcjksc">基准测试上，</text><text x="175.62 183.31 186.30 191.91 198.48 205.06 211.02 213.91 220.15 226.58 233.26 239.94 245.82 250.08 252.97" y="400.56" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="261.86 272.86 283.86 294.86" y="400.56" font-size="11.00" class="sc-notoserifcjksc">表现出与</text><text x="308.75 316.44 319.43 325.04 331.61 338.19 344.15 347.04 355.78 362.35 368.91 374.00 376.90 382.86 385.57" y="400.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="394.64 405.64 416.64 427.64 438.64 449.64 460.64 471.64 482.64 493.64 504.64 515.64 526.64" y="400.56" font-size="11.00" class="sc-notoserifcjksc">相当的鲁棒性，并且鲁棒性优</text><text x="72.00" y="416.18" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 92.13 98.57 105.24 111.92 117.80 122.06 124.95 130.92 133.51" y="416.18" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="139.87 150.87 161.87 172.87 183.87 194.87 205.87 216.87 227.87 238.87 249.87 260.87" y="416.18" font-size="11.00" class="sc-notoserifcjksc">，超过了所有接受评估的非</text><text x="274.76 282.45 285.44 291.05 297.62 304.20" y="416.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="313.05 324.05 335.05" y="416.18" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="465.10" font-size="11.00" class="sc-notoserifcjksc">今后，我们将报告一个新的间接提示词注入基准</text><text x="303.00" y="461.44" font-size="6.60" class="sc-loraregular">3</text><text x="306.68 317.68 328.68 339.68 350.68 361.68 372.68 383.68 394.68 405.68 416.68" y="465.10" font-size="11.00" class="sc-notoserifcjksc">的结果，该基准由我们与</text><text x="430.57 438.94 443.63 449.19 455.00 457.89 464.08 472.78 478.45" y="465.10" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="485.13 496.13 507.13 518.13 529.13" y="465.10" font-size="11.00" class="sc-notoserifcjksc">、英国人工</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="480.72" font-size="11.00" class="sc-notoserifcjksc">智能安全研究所、美国人工智能标准与创新中心（</text><text x="314.00 322.27 328.51 331.40 339.09 345.05 351.63 355.89 361.85 366.61 369.51 373.17 379.60 384.37 387.26 394.15 397.83 400.72 406.92 411.17 416.85 423.53 430.10 435.78 440.47 447.04 452.14 455.03 460.71 467.38" y="480.72" font-size="11.00" class="sc-loraregular">US Center for AI Standards and</text><text x="72.00 75.60 82.27 88.95 95.33 100.78 106.38 110.63 113.72 120.16" y="496.34" font-size="11.00" class="sc-loraregular">Innovation</text><text x="126.83 137.83 148.83 159.83 170.83 181.83 192.83 203.83 214.83 225.83 236.83 247.83 258.83 269.83 280.83 291.83" y="496.34" font-size="11.00" class="sc-notoserifcjksc">）以及其他模型开发者合作构建。与</text><text x="305.73 312.61 319.52" y="496.34" font-size="11.00" class="sc-loraregular">ART</text><text x="329.45 340.45 351.45 362.45 373.45 384.45 395.45 406.45 417.45 428.45 439.45 450.45 461.45 472.45 483.45 494.45 505.45 516.45 527.45" y="496.34" font-size="11.00" class="sc-notoserifcjksc">类似，我们组织了一场竞赛，由红队测试人</text><text x="72.00 83.00" y="511.96" font-size="11.00" class="sc-notoserifcjksc">员在</text><text x="96.89 102.80" y="511.96" font-size="11.00" class="sc-loraregular">28</text><text x="111.88 122.88 133.88 144.88 155.88 166.88 177.88 188.88 199.88 210.88 221.88 232.88 243.88 254.88 265.88 276.88 287.88 298.88 309.88 320.88 331.88 342.88 353.88 364.88 375.88 386.88 397.88 408.88 419.88 430.88 441.88 452.88 463.88 474.88 485.88 496.88 507.88 518.88 529.88" y="511.96" font-size="11.00" class="sc-notoserifcjksc">个不同的攻击场景中寻找针对前沿模型的攻击；这些场景检验模型对间接提示词注入的易</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="527.58" font-size="11.00" class="sc-notoserifcjksc">感性，此类注入试图诱导不可逆的有害操作，包括私密数据外泄、数据破坏、系统入侵和非预期</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="543.20" font-size="11.00" class="sc-notoserifcjksc">的金融交易。这一新基准中的场景经过设计，力求与前沿模型当今所能执行任务的真实度相匹</text><text x="72.00 83.00 94.00" y="558.82" font-size="11.00" class="sc-notoserifcjksc">配。与</text><text x="107.89 114.78 121.69" y="558.82" font-size="11.00" class="sc-loraregular">ART</text><text x="131.62 142.62 153.62 164.62 175.62 186.62 197.62 208.62 219.62 230.62 241.62 252.62 263.62 274.62 285.62 296.62 307.62 318.62 329.62 340.62 351.62 362.62 373.62 384.62 395.62 406.62 417.62 428.62 439.62 450.62 461.62 472.62 483.62 494.62 505.62 516.62 527.62" y="558.82" font-size="11.00" class="sc-notoserifcjksc">不同，这些场景除工具使用外，还涵盖编程和计算机使用。经过去重后，我们选出了</text><text x="72.00 76.00 78.78 82.78 88.91" y="574.44" font-size="11.00" class="sc-loraregular">1,130</text><text x="98.64 109.64 120.64 131.64 142.64 153.64 164.64 175.64 186.64 197.64 208.64 219.64 230.64 241.64 252.64 263.64 274.64 285.64 296.64 307.64 318.64 329.64 340.64 351.64 362.64 373.64 384.64 395.64 406.64 417.64 428.64 439.64 450.64 461.64 472.64 483.64 494.64 505.64 516.64 527.64" y="574.44" font-size="11.00" class="sc-notoserifcjksc">个在各目标模型间表现出高可迁移性的攻击。我们在不附加额外安全防护措施的情况下评估</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="590.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="590.06" font-size="11.00" class="sc-notoserifcjksc">模型，而其他前沿模型则在其公开可用的端点上评估，这些端点可能包含、也可能不包含</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="605.68" font-size="11.00" class="sc-notoserifcjksc">额外的安全防护措施。</text><a href="https://arxiv.org/abs/2603.15714" rel="noopener"><rect x="334.50" y="706.50" width="161.25" height="13.50" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="72.00" y="406.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="406.75" font-size="9.00" class="sc-lorabold">5.2.1.B]</text><text x="117.82 126.82" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.92 149.19 153.79 158.75 161.12 166.40 173.66 178.38 184.12 186.49 189.97 195.67" y="406.75" font-size="9.00" class="sc-lorabold">Gray Swan IPI</text><text x="201.52 210.52 219.52" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">基准（</text><text x="228.52 233.32 239.04 243.84" y="406.75" font-size="9.00" class="sc-lorabold">2026</text><text x="251.38 260.38 269.38 278.38 287.38 296.38 305.38 314.38 323.38 332.38 341.38 350.38 359.38 368.38 377.38 386.38 395.38" y="406.75" font-size="9.00" class="sc-notoserifcjkscbold">年第一季度）的间接提示词注入攻击，</text><text x="404.38 413.38 422.38 431.38 440.38 449.38 458.38 467.38 476.38 485.38 494.38 503.38 512.38 521.38 530.38" y="406.75" font-size="9.00" class="sc-notoserifcjksc">分数越低越好。所有模型均使用扩</text><text x="72.00 81.00 90.00 99.00" y="418.45" font-size="9.00" class="sc-notoserifcjksc">展思考（</text><text x="108.00 112.83 117.60 121.09 125.96 131.43 136.81 141.64 147.02 149.39 152.87 158.27 160.79 166.26 171.09 173.62 179.08" y="418.45" font-size="9.00" class="sc-loraregular">extended thinking</text><text x="184.06 193.06 202.06 211.06 220.06 229.06 238.06 247.06 256.06 265.06" y="418.45" font-size="9.00" class="sc-notoserifcjksc">）。结果表示攻击者在</text><text x="276.43 281.26 285.93" y="418.45" font-size="9.00" class="sc-loraregular">k=1</text><text x="289.21" y="418.45" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="298.21 303.04 307.71 310.99" y="418.45" font-size="9.00" class="sc-loraregular">k=10</text><text x="318.94" y="418.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="330.31 335.14 339.81 343.09" y="418.45" font-size="9.00" class="sc-loraregular">k=15</text><text x="350.36 359.36 368.36 377.36 386.36 395.36 404.36 413.36 422.36 431.36 440.36 449.36 458.36 467.36 476.36 485.36 494.36 503.36 512.36" y="418.45" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到成功攻击的概率。越低越好。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 108.43 113.70 119.16 124.62 129.44 132.92 135.29 140.17 142.29" y="430.15" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="149.86" y="430.15" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="161.23 168.07 172.95 181.00 183.53 188.99 191.52 193.89 198.90 201.11 204.39 206.76 212.21 216.04" y="430.15" font-size="9.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="223.68 232.68 241.68 250.68 259.68 268.68 277.68 286.68 295.68 304.68 313.68 322.68 331.68 340.68 349.68 358.68 367.68 376.68 385.68 394.68 403.68 412.68 421.68 430.68 439.68 448.68 457.68 466.68 475.68 484.68" y="430.15" font-size="9.00" class="sc-notoserifcjksc">的结果不可直接比较，因为它们被纳入了用于收集攻击的红队竞赛。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="485.56" font-size="11.00" class="sc-notoserifcjksc">在这一新基准上，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 204.53 210.96 217.64 224.32 230.20 234.46 237.35" y="485.56" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="246.24" y="485.56" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="260.13 267.82 270.81 276.42 282.99 289.57 295.53 298.42 307.16 313.73 320.29 325.39 328.28 334.24 336.95" y="485.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="346.02 357.02 368.02 379.02 390.02 401.02 412.02 423.02 434.02 445.02 456.02 467.02" y="485.56" font-size="11.00" class="sc-notoserifcjksc">几乎持平。其攻击成功率（</text><text x="478.02 483.62 487.99 492.24 497.92 503.77" y="485.56" font-size="11.00" class="sc-loraregular">attack</text><text x="72.00 77.09 83.66 89.46 95.25 101.22 106.31 111.40 114.30 118.98 124.58 128.84" y="501.18" font-size="11.00" class="sc-loraregular">success rate</text><text x="134.80 145.80 156.80" y="501.18" font-size="11.00" class="sc-notoserifcjksc">）低于</text><text x="170.69 178.38 181.37 186.98 193.55 200.13 206.09 208.98 215.22 221.66 228.33 235.01 240.89 245.15 248.04 254.01 256.60" y="501.18" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="262.96 273.96 284.96 295.96 306.96 317.96 328.96 339.96 350.96 361.96 372.96 383.96 394.96 405.96 416.96 427.96" y="501.18" font-size="11.00" class="sc-notoserifcjksc">，不过这一结果不可直接比较，因为</text><text x="441.85 448.09 454.53 461.20 467.88 473.76 478.02 480.91 486.88 489.47" y="501.18" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="498.72 509.72 520.72" y="501.18" font-size="11.00" class="sc-notoserifcjksc">被纳入</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="516.80" font-size="11.00" class="sc-notoserifcjksc">了用于收集攻击的红队竞赛。</text><text x="215.00 221.24 227.67 234.35 241.03 246.91 251.17 254.06" y="516.80" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95" y="516.80" font-size="11.00" class="sc-notoserifcjksc">优于所有接受评估的非</text><text x="375.84 383.53 386.52 392.13 398.70 405.28" y="516.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="414.13 425.13 436.13 447.13 458.13" y="516.80" font-size="11.00" class="sc-notoserifcjksc">模型，包括</text><text x="472.03 480.40 487.06 493.40 498.78 504.77 507.48" y="516.80" font-size="11.00" class="sc-loraregular">GPT-5.5</text><text x="516.37" y="516.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 80.37 86.33 96.17 99.26 105.93 109.03 111.92 118.05 120.75 126.75 129.64 135.67 138.66 144.34 149.43" y="532.42" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="156.02 167.02 178.02 189.02 200.02 211.02 222.02 233.02 244.02 255.02 266.02 277.02 288.02 299.02 310.02 321.02 332.02 343.02 354.02 365.02 376.02 387.02 398.02 409.02 420.02 431.02 442.02 453.02 464.02 475.02 486.02 497.02 508.02 519.02" y="532.42" font-size="11.00" class="sc-notoserifcjksc">；这两个模型未参与该红队竞赛，因此针对它们的评估可直接用于比较攻击迁</text><text x="72.00 83.00" y="548.04" font-size="11.00" class="sc-notoserifcjksc">移。</text><text x="72.00 80.37 83.75 91.21 94.59" y="597.24" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15 118.15 131.15 144.15 157.15 170.15 183.15 196.15 209.15 222.15 235.15 248.15 261.15 274.15 287.15 300.15 313.15" y="597.24" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景抵御自适应攻击者的鲁棒性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="629.14" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="625.47" font-size="6.60" class="sc-loraregular">4</text><text x="361.58 372.58 383.58 394.58 405.58 416.58 427.58 438.58 449.58 460.58 471.58 482.58 493.58 504.58 515.58 526.58" y="629.14" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="644.76" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新型方法的攻击。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="660.38" font-size="11.00" class="sc-notoserifcjksc">们持续投入于自适应评估，以更好地近似</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="368.25" y="707.25" width="157.50" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">现实世界攻击者的能力，这项工作既在内部开展，也与外部研究合作伙伴协作进行。本节中的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">估衡量的是针对会根据与模型的交互来改进攻击的攻击者的鲁棒性。这些评估体现了一种刻意宽</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">松的威胁模型：攻击者直接针对测试场景进行优化，并且每个场景可进行多次尝试。现实世界中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">现的可能性。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="212.16" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71 115.71 126.71 137.71 148.71 159.71 170.71 181.71 192.71 203.71 214.71 225.71" y="212.16" font-size="11.00" class="sc-notoserifcjkscbold">跨使用场景的实时漏洞赏金</text><text x="72.00 83.00 94.00 105.00 116.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">正如我们在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="244.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="215.78 226.78 237.78" y="244.55" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78" y="244.55" font-size="11.00" class="sc-notoserifcjksc">中首次所做的那样，我们与</text><text x="383.67 392.05 396.73 402.30 408.11 411.00 417.18 425.88 431.56" y="244.55" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="441.13 452.13 463.13 474.13 485.13 496.13 507.13 518.13 529.13" y="244.55" font-size="11.00" class="sc-notoserifcjksc">合作举办了一次实时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">漏洞赏金活动，专家红队测试人员通过对包括</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 339.42 345.86 352.53 359.21 365.10 369.35 372.25" y="260.17" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="378.24" y="256.50" font-size="6.60" class="sc-loraregular">5</text><text x="384.73 395.73 406.73 417.73 428.73 439.73 450.73 461.73 472.73 483.73 494.73 505.73 516.73 527.73" y="260.17" font-size="11.00" class="sc-notoserifcjksc">在内的一组前沿模型发起成功的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">提示词注入攻击，角逐一个奖金池。目标模型的身份自始至终都是隐藏的，并且每位红队测试人</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">员在每个场景下针对每个模型最多只能提交一次成功攻击。本轮涵盖工具使用、编程和计算机使</text><text x="72.00 83.00 94.00 105.00" y="307.03" font-size="11.00" class="sc-notoserifcjksc">用方面的</text><text x="118.89 122.90" y="307.03" font-size="11.00" class="sc-loraregular">11</text><text x="129.79 140.79 151.79 162.79 173.79" y="307.03" font-size="11.00" class="sc-notoserifcjksc">个新场景。</text><text x="184.79 192.48 195.48 201.09 207.65 214.23" y="307.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.09 234.09 245.09" y="307.03" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="258.98 265.57 268.66 275.01" y="307.03" font-size="11.00" class="sc-loraregular">high</text><text x="284.49 295.49 306.49 317.49 328.49" y="307.03" font-size="11.00" class="sc-notoserifcjksc">推理强度（</text><text x="339.49 343.74 350.33 353.42 360.10 366.01 369.10 375.78 381.86 384.75 390.71 394.54 398.20 404.64 409.48" y="307.03" font-size="11.00" class="sc-loraregular">thinking effort</text><text x="413.74 424.74 435.74 446.74 457.74 468.74 479.74 490.74 501.74 512.74 523.74" y="307.03" font-size="11.00" class="sc-notoserifcjksc">）下接受评估，且未启用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="322.65" font-size="11.00" class="sc-notoserifcjksc">我们产品中使用的额外保护措施（例如运行框架层面的防御和提示词注入探针），因此结果反映</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="338.27" font- "9.00" class="sc-notoserifcjksc">成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="426.61" font-size="11.00" class="sc-notoserifcjksc">在所有被评估的模型中，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 237.53 243.96 250.64 257.32 263.20 267.46 270.35" y="426.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="279.24 290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24 389.24 400.24 411.24 422.24 433.24 444.24 455.24 466.24 477.24 488.24 499.24 510.24 521.24" y="426.61" font-size="11.00" class="sc-notoserifcjksc">在编程环境中对提示词注入表现出最强的鲁棒性：开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="442.23" font-size="11.00" class="sc-notoserifcjksc">启扩展思考时，所有尝试的攻击成功率为</text><text x="272.89 279.55 282.25 288.38 292.39" y="442.23" font-size="11.00" class="sc-loraregular">0.31%</text><text x="301.96 312.96 323.96 334.96 345.96 356.96 367.96" y="442.23" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时为</text><text x="381.85 388.50 391.21 397.12 403.47" y="442.23" font-size="11.00" class="sc-loraregular">0.29%</text><text x="413.04 424.04" y="442.23" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="437.94 445.63 448.62 454.23 460.79 467.37 473.33 476.23 482.46 488.90 495.58 502.25 508.14 512.40 515.29 521.25 523.85" y="442.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="457.85" font-size="11.00" class="sc-notoserifcjksc">相比这是大幅改进，后者开启思考时达到</text><text x="272.89 276.90 282.80 285.16 290.23 294.23" y="457.85" font-size="11.00" class="sc-loraregular">12.71%</text><text x="303.80 314.80 325.80 336.80 347.80 358.80 369.80 380.80" y="457.85" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时达到</text><text x="394.70 400.66 406.65 409.36 415.27 421.62" y="457.85" font-size="11.00" class="sc-loraregular">45.26%</text><text x="431.19" y="457.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="442.19 448.43 454.87 461.54 468.22 474.11 478.36 481.26" y="457.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="490.14 501.14 512.14 523.14" y="457.85" font-size="11.00" class="sc-notoserifcjksc">的表现也</text><text x="72.00 83.00" y="473.47" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.71" y="473.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="179.89 190.89 201.89 212.89 223.89 234.89" y="473.47" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="248.78 253.37 255.91 262.74 268.87" y="473.47" font-size="11.00" class="sc-loraregular">7.03%</text><text x="278.44 289.44 300.44 311.44 322.44 333.44" y="473.47" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="347.33 351.33 355.92 358.63 364.59 370.55" y="473.47" font-size="11.00" class="sc-loraregular">17.44%</text><text x="380.12 391.12 402.12 413.12" y="473.47" font-size="11.00" class="sc-notoserifcjksc">），并与</text><text x="427.01 434.70 437.70 443.31 449.87 456.45 462.41 465.31 475.24 481.10 485.36 491.95 498.38 503.47 506.37" y="473.47" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="512.36 523.36" y="473.47" font-size="11.00" class="sc-notoserifcjksc">（开</text><text x="72.00 83.00 94.00 105.00" y="489.09" font-size="11.00" class="sc-notoserifcjksc">启思考时</text><text x="118.89 125.55 128.25 134.22 140.21" y="489.09" font-size="11.00" class="sc-loraregular">0.45%</text><text x="149.78 160.78 171.78 182.78 193.78 204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78" y="489.09" font-size="11.00" class="sc-notoserifcjksc">）相当。启用安全防护措施后，</text><text x="303.78 310.02 316.45 323.13 329.81 335.69 339.95 342.84" y="489.09" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="351.73 362.73 373.73 384.73 395.73 406.73 417.73 428.73 439.73 450.73 461.73 472.73 483.73 494.73 505.73 516.73" y="489.09" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率进一步降至开启思考时</text><text x="72.00 78.65 81.20 88.03 94.39" y="504.71" font-size="11.00" class="sc-loraregular">0.09%</text><text x="103.96 114.96 125.96 136.96 147.96 158.96" y="504.71" font-size="11.00" class="sc-notoserifcjksc">、关闭思考时</text><text x="172.85 179.50 182.21 186.21 192.34" y="504.71" font-size="11.00" class="sc-loraregular">0.13%</text><text x="201.91 212.91 223.91 234.91 245.91 256.91 267.91 278.91 289.91 300.91 311.91 322.91" y="504.71" font-size="11.00" class="sc-notoserifcjksc">，为所有受测模型中最低。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="572.34" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41 117.41 128.41 139.41 150.41" y="572.34" font-size="11.00" class="sc-notoserifcjkscbold">计算机使用</text><text x="72.00 83.00 94.00 105.00 116.00" y="604.73" font-size="11.00" class="sc-notoserifcjksc">我们还使用</text><text x="129.89 136.13 142.72 148.40 154.97" y="604.73" font-size="11.00" class="sc-loraregular">Shade</text><text x="163.83 174.83" y="604.73" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="188.72 196.41 199.40 205.01 211.58 218.16" y="604.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="227.01 238.01 249.01 260.01 271.01 282.01 293.01 304.01 315.01 326.01 337.01 348.01 359.01 370.01 381.01 392.01 403.01 414.01 425.01 436.01 447.01 458.01 469.01 480.01 491.01 502.01 513.01 524.01" y="604.73" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性；在这类环境中，模型直接与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="620.35" font-size="11.00" class="sc-notoserifcjksc">图形用户界面（</text><text x="149.00 157.37 165.64" y="620.35" font-size="11.00" class="sc-loraregular">GUI</text><text x="169.33 180.33 191.33 202.33 213.33 224.33 2
