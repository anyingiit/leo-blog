.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="116.23" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89" y="116.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="194.13" y="116.23" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了与发布</text><text x="318.03" y="116.23" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.8</text><text x="403.91" y="116.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="417.81" y="116.23" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5</text><text x="494.50" y="116.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="72.00" y="131.85" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos 5</text><text x="121.95" y="131.85" font-size="11.00" class="sc-notoserifcjksc">时大体相同的智能体安全评估套件。这些评估涵盖对编程智能体和计算机使用</text><text x="72.00" y="147.47" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="147.47" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="153.70" y="147.47" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意使用、影响力行动的自主执行，以及提示词注入（</text><text x="472.70" y="147.47" font-size="11.00" class="sc-loraregular sc-k">prompt</text><text x="72.00" y="163.09" font-size="11.00" class="sc-loraregular sc-k">injection</text><text x="116.75" y="163.09" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。在本次发布中，我们在</text><text x="284.64" y="163.09" font-size="11.00" class="sc-loraregular">ART</text><text x="308.37" y="163.09" font-size="11.00" class="sc-notoserifcjksc">提示词注入基准测试（近期的</text><text x="454.26" y="163.09" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="492.55" y="163.09" font-size="11.00" class="sc-notoserifcjksc">模型在该</text><text x="72.00" y="178.71" font-size="11.00" class="sc-notoserifcjksc">基准上已接近饱和）之外，补充了一个新的</text><text x="283.89" y="178.71" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="341.35" y="178.71" font-size="11.00" class="sc-notoserifcjksc">间接提示词注入（</text><text x="429.35" y="178.71" font-size="11.00" class="sc-loraregular sc-k">indirect prompt</text><text x="72.00" y="194.33" font-size="11.00" class="sc-loraregular sc-k">injection</text><text x="116.75" y="194.33" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="127.75" y="194.33" font-size="11.00" class="sc-loraregular sc-k">IPI</text><text x="141.73" y="194.33" font-size="11.00" class="sc-notoserifcjksc">）基准，其涵盖编程、计算机使用和工具使用任务。我们还报告了一项新的漏洞赏</text><text x="72.00" y="209.95" font-size="11.00" class="sc-notoserifcjksc">金的结果，该漏洞赏金的场景同样覆盖上述几类使用场景。本节中的智能体安全评估旨在衡量模</text><text x="72.00" y="225.57" font-size="11.00" class="sc-notoserifcjksc">型本身的行为，独立于部署时原本可能拦截请求的安全防护措施（例如安全分类器）。</text><text x="72.00" y="310.53" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们发现</text><text x="173.89" y="310.53" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="221.84" y="310.53" font-size="11.00" class="sc-notoserifcjksc">在智能体安全评估中相较</text><text x="345.74" y="310.53" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="402.61" y="310.53" font-size="11.00" class="sc-notoserifcjksc">有所改进，尤其是在提示词</text><text x="72.00" y="326.15" font-size="11.00" class="sc-notoserifcjksc">注入鲁棒性方面。在</text><text x="173.89" y="326.15" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="241.74" y="326.15" font-size="11.00" class="sc-notoserifcjksc">网络安全相关测试用例上，结果则好坏参半：</text><text x="461.74" y="326.15" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="509.69" y="326.15" font-size="11.00" class="sc-notoserifcjksc">拒绝</text><text x="72.00" y="341.77" font-size="11.00" class="sc-notoserifcjksc">恶意请求的可靠性远高于</text><text x="195.89" y="341.77" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="249.87" y="341.77" font-size="11.00" class="sc-notoserifcjksc">，但相应地，在两用与良性测试用例上的过度拒绝（</text><text x="502.87" y="341.77" font-size="11.00" class="sc-loraregular sc-k">over-</text><text x="72.00" y="357.39" font-size="11.00" class="sc-loraregular sc-k">refusal</text><text x="106.69" y="357.39" font-size="11.00" class="sc-notoserifcjksc">）略有增加。</text><text x="72.00" y="409.07" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="409.07" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00" y="446.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="446.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="474.07" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89" y="474.07" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="474.07" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="193.08" y="474.07" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="260.92" y="474.07" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用及良性的网络安全相</text><text x="72.00" y="489.69" font-size="11.00" class="sc-notoserifcjksc">关请求。提示词集分为两类：</text><text x="108.00" y="538.83" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00" y="538.83" font-size="11.00" class="sc-loraregular">61</text><text x="176.26" y="538.83" font-size="11.00" class="sc-notoserifcjksc">个违反我们</text><text x="231.26" y="538.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="275.26" y="538.83" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="286.26" y="538.83" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="350.78" y="538.83" font-size="11.00" class="sc-notoserifcjksc">）、应当被拒绝的提示词。示例包括协</text><text x="108.00" y="554.45" font-size="11.00" class="sc-notoserifcjksc">助制作恶意软件、编写用于</text><text x="242.89" y="554.45" font-size="11.00" class="sc-loraregular sc-k">DDoS</text><text x="274.67" y="554.45" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件；以及</text><text x="108.00" y="587.41" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00" y="587.41" font-size="11.00" class="sc-loraregular">61</text><text x="187.26" y="587.41" font-size="11.00" class="sc-notoserifcjksc">个涵盖敏感但被允许的请求的提示词，</text><text x="374.26" y="587.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="412.55" y="587.41" font-size="11.00" class="sc-notoserifcjksc">应当对这些请求提供协</text><text x="108.00" y="603.03" font-size="11.00" class="sc-notoserifcjksc">助。示例包括运行网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00" y="652.18" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="652.18" font-size="11.00" class="sc-notoserifcjksc">获得了标准的</text><text x="227.13" y="652.18" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="294.98" y="652.18" font-size="11.00" class="sc-notoserifcjksc">工具集。每个提示词运行</text><text x="418.87" y="652.18" font-size="11.00" class="sc-loraregular">10</text><text x="432.60" y="652.18" font-size="11.00" class="sc-notoserifcjksc">次，两类合计共</text><text x="512.49 516.50 519.27 525.18 531.09" y="652.18" font-size="11.00" class="sc-loraregular">1,220</text><text x="72.00" y="667.80" font-size="11.00" class="sc-notoserifcjksc">次测试。与近期发布的模型一样，我们在运行本评估时默认应用</text><text x="382.89" y="667.80" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="450.74" y="667.80" font-size="11.00" class="sc-notoserifcjksc">系统提示词</text><text x="72.00" y="683.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="683.42" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="160.29" y="683.42" font-size="11.00" class="sc-notoserifcjksc">），且不附加部署时可能存在的额外安全防护措施。</text><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="318.03" y="107.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="318.03" y="107.43" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="353.42" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="356.32" y="107.43" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="383.28" y="107.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf" rel="noopener"><rect x="386.17" y="107.43" width="14.85" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="417.81" y="107.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="417.81" y="107.43" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.ant
