<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p067.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 67 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">6</text><text x="86.05 102.05 118.05 134.05" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">对齐评估</text><text x="72.00 80.96 84.60" y="127.81" font-size="14.00" class="sc-poppinssemibold">6.1</text><text x="93.00 107.00 121.00 135.00 149.00 163.00 177.00" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">引言与发现摘要</text><text x="72.00 80.32 83.70 88.41 91.79" y="164.90" font-size="13.00" class="sc-poppinssemibold">6.1.1</text><text x="99.59 112.59" y="164.90" font-size="13.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 83.00 94.00 105.00 116.00" y="192.80" font-size="11.00" class="sc-notoserifcjksc">我们评估了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 174.42 180.86 187.53 194.21 200.10 204.35 207.25" y="192.80" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="216.13 227.13 238.13 249.13 260.13 271.13 282.13 293.13 304.13 315.13 326.13 337.13 348.13 359.13 370.13" y="192.80" font-size="11.00" class="sc-notoserifcjksc">是否存在令人担忧的、与未对齐（</text><text x="381.13 390.97 394.06 399.15 404.83 407.82 410.91 416.99 423.67 433.50 439.47 446.04" y="192.80" font-size="11.00" class="sc-loraregular">misalignment</text><text x="450.30 461.30 472.30 483.30 494.30 505.30 516.30 527.30" y="192.80" font-size="11.00" class="sc-notoserifcjksc">）相关的行为，尤</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="208.42" font-size="11.00" class="sc-notoserifcjksc">其关注那些我们预计会随着模型能力提升而愈发重要的风险。这类行为包括：表现出不良目标或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="224.04" font-size="11.00" class="sc-notoserifcjksc">隐藏目标、明知而配合滥用、以欺骗性或不忠实的方式使用推理草稿区、对用户谄媚、愿意破坏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="239.66" font-size="11.00" class="sc-notoserifcjksc">安全防护措施、试图隐藏危险能力，以及试图操纵用户的信念。我们还评估了该模型可能以哪些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="255.28" font-size="11.00" class="sc-notoserifcjksc">方式破坏或干扰我们审视和监控其行为的能力。除了以未对齐为主要关注点之外，我们还报告了</text><text x="72.00 83.00 94.00 105.00" y="270.90" font-size="11.00" class="sc-notoserifcjksc">一些关于</text><text x="118.89 125.13 131.57 138.24 144.92 150.80 155.06 157.95" y="270.90" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="166.84 177.84 188.84 199.84 210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="270.90" font-size="11.00" class="sc-notoserifcjksc">性格及正面特质的相关发现。我们在整个后训练过程中持续开展测试，并同时</text><text x="72.00 83.00 94.00 105.00 116.00" y="286.52" font-size="11.00" class="sc-notoserifcjksc">报告最终的</text><text x="129.89 136.13 142.57 149.24 155.92 161.80 166.06 168.95" y="286.52" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="177.84 188.84 199.84 210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84" y="286.52" font-size="11.00" class="sc-notoserifcjksc">模型以及其开发过程中产生的早期模型快照的结果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="387.11" font-size="11.00" class="sc-notoserifcjksc">本次评估包括静态行为评估、自动化交互式行为评估、白盒探测方法、非助手人设采样、与未对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="402.73" font-size="11.00" class="sc-notoserifcjksc">齐相关的能力评估、训练数据审查、来自内部和外部试点使用的反馈，以及对内部试点使用的自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="418.35" font-size="11.00" class="sc-notoserifcjksc">动化分析。与</text><text x="140.89 149.63 156.19 162.76 167.85 170.75 176.71 179.42" y="418.35" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="188.49" y="418.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="202.38 212.32 218.18 222.44 229.03 235.46 240.55 243.45" y="418.35" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="252.33 263.33 274.33 285.33 296.33 307.33" y="418.35" font-size="11.00" class="sc-notoserifcjksc">相比，我们为</text><text x="321.23 327.46 333.90 340.58 347.25 353.14 357.40 360.29" y="418.35" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="369.18 380.18 391.18 402.18 413.18 424.18 435.18 446.18 457.18 468.18 479.18 490.18" y="418.35" font-size="11.00" class="sc-notoserifcjksc">报告的单项评估更少，因为</text><text x="504.07 510.31 516.74 523.42 530.10 535.98" y="418.35" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="72.00" y="433.97" font-size="11.00" class="sc-loraregular">5</text><text x="80.89 91.89 102.89 113.89 124.89 135.89 146.89 157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89" y="433.97" font-size="11.00" class="sc-notoserifcjksc">并未推进公开前沿，因而带来的风险范围更有限、也更可预测。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="516.64" font-size="11.00" class="sc-notoserifcjksc">我们的测试主要聚焦于</text><text x="184.89 191.13 197.57 204.24 210.92 216.80 221.06 223.95" y="516.64" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84" y="516.64" font-size="11.00" class="sc-notoserifcjksc">模型本身，使用了多种脚手架（</text><text x="386.84 391.93 397.76 403.44 407.27 410.93 417.37 420.36" y="516.64" font-size="11.00" class="sc-loraregular">scaffold</text><text x="426.94 437.94 448.94 459.94 470.94 481.94 492.94" y="516.64" font-size="11.00" class="sc-notoserifcjksc">）和系统提示词</text><text x="72.00" y="532.26" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.09 93.90 98.99 103.25 109.21 119.05 121.94 128.51 133.19 139.63 149.46 156.03" y="532.26" font-size="11.00" class="sc-loraregular">system prompt</text><text x="160.29 171.29 182.29 193.29" y="532.26" font-size="11.00" class="sc-notoserifcjksc">），而非</text><text x="207.18 214.87 217.86 223.47 230.04 236.62" y="532.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="245.47 256.47 267.47" y="532.26" font-size="11.00" class="sc-notoserifcjksc">应用、</text><text x="278.47 286.16 289.15 294.76 301.33 307.91 313.87 316.76 324.45 330.89 337.46" y="532.26" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="346.32" y="532.26" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="360.21 367.90 370.89 376.50 383.07 389.65 395.61 398.50 406.19 412.52 421.20 427.63 432.35" y="532.26" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="441.15 452.15 463.15 474.15 485.15 496.15 507.15 518.15 529.15" y="532.26" font-size="11.00" class="sc-notoserifcjksc">等具体产品端。由这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="547.88" font-size="11.00" class="sc-notoserifcjksc">些应用或我们的模型外部安全防护措施的变更所导致的行为差异，不是本章的关注重点。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="597.60" font-size="11.00" class="sc-notoserifcjksc">我们力求尽量减少与训练数据或训练流程的重叠，因为这种重叠可能损害这些评估的可靠性。除</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="613.22" font-size="11.00" class="sc-notoserifcjksc">明确标注之处外，此处呈现的评估均未使用我们在训练中所用的相同工具、提示词或细粒度场景</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="628.84" font-size="11.00" class="sc-notoserifcjksc">设计，而且其中许多评估所涵盖的现象并不是我们在训练中直接针对的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="678.56" font-size="11.00" class="sc-notoserifcjksc">总体而言，本次调查包括：对通过多种方式抽样得到的数百份对话记录进行人工专家审查、生成</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">强化学习训练对话记录进行自动筛查，所有这些工作都耗费了专家大量人日的时间。</text><text x="72.00 80.32 83.70 88.41 91.79" y="129.54" font-size="13.00" class="sc-poppinssemibold">6.1.2</text><text x="102.34 115.34 128.34 141.34 154.34 167.34 180.34 193.34 206.34 219.34 232.34 245.34" y="129.54" font-size="13.00" class="sc-notosanscjkscbold">关于安全与对齐的主要发现</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="157.43" font-size="11.00" class="sc-notoserifcjkscbold">总体而言，与</text><text x="176.89 184.46 187.89 193.66 200.46 207.01" y="157.43" font-size="11.00" class="sc-lorabold" fill="#0000ff">Claude</text><text x="215.82 226.82 237.82" y="157.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#0000ff">宪法（</text><text x="248.82 256.39 262.62 269.63 274.97 279.51 283.07 287.61 294.36 298.91 302.50 308.73 315.75 318.64 322.63 328.86 334.14 337.03 344.60 348.03 353.80 360.59 367.15" y="157.43" font-size="11.00" class="sc-lorabold" fill="#0000ff">Constitution for Claude</text><text x="373.07" y="157.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#0000ff">）</text><text x="384.07 395.07 406.07 417.07" y="157.43" font-size="11.00" class="sc-notoserifcjkscbold">的对齐（</text><text x="428.07 433.83 437.26 440.86 446.99 454.01 464.13 470.04 477.00" y="157.43" font-size="11.00" class="sc-lorabold">alignment</text><text x="481.54 492.54 503.54 514.54" y="157.43" font-size="11.00" class="sc-notoserifcjkscbold">）程度较</text><text x="108.00 114.58 120.80 127.82 134.84 140.76 145.30 148.19 154.21 156.77" y="173.05" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="165.99 176.99 187.99 198.99 209.99" y="173.05" font-size="11.00" class="sc-notoserifcjkscbold">有大幅提升</text><text x="220.99 231.99 242.99 253.99 264.99 275.99 286.99 297.99 308.99 319.99 330.99 341.99 352.99 363.99 374.99 385.99 396.99 407.99 418.99 429.99 440.99 451.99 462.99 473.99 484.99 495.99 506.99 517.99 528.99" y="173.05" font-size="11.00" class="sc-notoserifcjksc">，但仍逊于近期能力更强的模型；以上结果均以我们侧重滥用和未</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="188.67" font-size="11.00" class="sc-notoserifcjksc">对齐的自动化行为审计（</text><text x="229.00 234.61 241.18 245.43 251.87 261.70 267.30 271.56 277.47 284.04 286.94 293.34 299.30 305.89 311.43 316.99 320.08 326.52 331.20 336.88 339.87 342.76 348.37 354.94 361.52 364.78" y="188.67" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="369.04 380.04 391.04 402.04" y="188.67" font-size="11.00" class="sc-notoserifcjksc">）衡量。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="206.01" font-size="11.00" class="sc-notoserifcjkscbold">同样，对滥用尝试的总体鲁棒性较</text><text x="275.89 282.47 288.70 295.72 302.73 308.65 313.19 316.09 322.10 324.67" y="206.01" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89" y="206.01" font-size="11.00" class="sc-notoserifcjkscbold">有所提升，但仍弱于近期能力更强的模</text><text x="108.00 119.00" y="221.63" font-size="11.00" class="sc-notoserifcjkscbold">型。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00" y="238.39" font-size="11.00" class="sc-notoserifcjksc">我们在某些方面观察到相对</text><text x="278.89 285.13 291.57 298.24 304.92 310.80 315.06 317.95 323.92 326.51" y="238.39" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="335.76 346.76 357.76 368.76 379.76 390.76 401.76 412.76 423.76 434.76 445.76" y="238.39" font-size="11.00" class="sc-notoserifcjksc">的退步，包括对预填充（</text><text x="486.82 497.82 508.82 519.82" y="238.39" font-size="11.00" class="sc-notoserifcjksc">）的易感</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="254.01" font-size="11.00" class="sc-notoserifcjksc">性、对有害系统提示词的易感性，以及对要求模型欺骗用户的系统提示词的配合。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00" y="269.63" font-size="11.00" class="sc-notoserifcjksc">这三者的绝对发生率仍然较低。</text><text x="108.00 119.00 130.00 141.00 152.00" y="303.16" font-size="11.00" class="sc-notoserifcjkscbold">过度拒绝（</text><text x="163.00 169.16 174.95 180.86 186.14 191.34 197.25 201.31 208.11 213.45 219.21" y="303.16" font-size="11.00" class="sc-lorabold">overrefusal</text><text x="222.64 233.64 244.64 255.64 266.64 277.64" y="303.16" font-size="11.00" class="sc-notoserifcjkscbold">）的发生率与</text><text x="291.54 298.11 304.34 311.36 318.38 324.29 328.84 331.73 337.75 340.31" y="303.16" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="349.53 360.53" y="303.16" font-size="11.00" class="sc-notoserifcjkscbold">相近</text><text x="371.53 382.53 393.53 404.53 415.53 426.53 437.53 448.53 459.53 470.53 481.53 492.53 503.53 514.53 525.53" y="303.16" font-size="11.00" class="sc-notoserifcjksc">，且略高于近期能力更强的模型。</text><text x="174.00" y="318.78" font-size="11.00" class="sc-loraregular">“</text><text x="178.40 189.40" y="318.78" font-size="11.00" class="sc-notoserifcjksc">扫兴</text><text x="200.40" y="318.78" font-size="11.00" class="sc-loraregular">”</text><text x="204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24" y="318.78" font-size="11.00" class="sc-notoserifcjksc">式回应的发生率略高。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="351.74" font-size="11.00" class="sc-notoserifcjkscbold">我们对模型主动采取的令人担忧行为的各项衡量指标较</text><text x="374.89 381.47 387.70 394.72 401.73 407.65 412.19 415.09 421.10 423.67" y="351.74" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="432.89 443.89 454.89 465.89 476.89 487.89" y="351.74" font-size="11.00" class="sc-notoserifcjkscbold">大体有所改善</text><text x="498.89 509.89 520.89" y="351.74" font-size="11.00" class="sc-notoserifcjksc">，但大</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="367.36" font-size="11.00" class="sc-notoserifcjksc">多数指标已接近其下限。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="384.12" font-size="11.00" class="sc-notoserifcjksc">这包括在自发试探基础设施边界方面的显著改善，以及忽视用户设定的约束和鲁莽</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="399.74" font-size="11.00" class="sc-notoserifcjksc">使用工具情况的减少。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="432.70" font-size="11.00" class="sc-notoserifcjkscbold">幻觉和谄媚较</text><text x="176.89 183.47 189.70 196.71 203.73 209.65 214.19 217.09 223.10 225.67" y="432.70" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="234.88 245.88 256.89 267.89 278.89 289.89" y="432.70" font-size="11.00" class="sc-notoserifcjkscbold">普遍有所改善</text><text x="300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="432.70" font-size="11.00" class="sc-notoserifcjksc">，这体现在我们专门的诚实性评估中，也体现在</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="448.32" font-size="11.00" class="sc-notoserifcjksc">我们更广泛的自动化行为审计中的附带观察里。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="481.28" font-size="11.00" class="sc-notoserifcjksc">在衡量谄媚性不诚实的</text><text x="256.89 266.99 273.88 280.11" y="481.28" font-size="11.00" class="sc-loraregular">MASK</text><text x="290.52 301.52 312.52 323.52" y="481.28" font-size="11.00" class="sc-notoserifcjksc">指标上，</text><text x="334.52 342.21 345.20 350.81 357.38 363.96 369.92 372.81 379.05 385.48 392.16 398.84 404.72 408.98 411.87" y="481.28" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="420.76 431.76 442.76 453.76 464.76" y="481.28" font-size="11.00" class="sc-notoserifcjksc">是所有受测</text><text x="478.65 486.34 489.33 494.94 501.51 508.09" y="481.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="516.94 527.94" y="481.28" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00" y="496.90" font-size="11.00" class="sc-notoserifcjksc">中表现最强的。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="513.66" font-size="11.00" class="sc-notoserifcjkscbold">正面性格特质较</text><text x="187.89 194.47 200.70 207.71 214.73 220.65 225.19 228.09 234.10 236.67" y="513.66" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="245.89 256.89 267.89 278.89 289.89 300.89" y="513.66" font-size="11.00" class="sc-notoserifcjkscbold">普遍有所改善</text><text x="311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89" y="513.66" font-size="11.00" class="sc-notoserifcjksc">，包括长对话中的性格漂移大幅下降。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00" y="546.04" font-size="11.00" class="sc-notoserifcjksc">不过，我们在创作造诣和温暖方面未观察到改善。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="562.23" font-size="11.00" class="sc-notoserifcjkscbold">我们对难以理解的思考的衡量结果较早期模型有所上升</text><text x="372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="562.23" font-size="11.00" class="sc-notoserifcjksc">，但总体而言，这些结果表现为内</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="577.85" font-size="11.00" class="sc-notoserifcjksc">容密集、重复，或偶尔出现错误语言的</text><text x="297.89 302.15 308.59 314.42 320.38" y="577.85" font-size="11.00" class="sc-loraregular">token</text><text x="327.05 338.05 349.05 360.05 371.05 382.05 393.05 404.05 415.05 426.05" y="577.85" font-size="11.00" class="sc-notoserifcjksc">，而非完全无法解读。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="610.81" font-size="11.00" class="sc-notoserifcjkscbold">在我们现有最贴近真实的未对齐与滥用评估中，评估意识（</text><text x="394.00 399.92 405.79 411.56 414.99 421.79 427.51 432.05 435.65 441.87 448.89 451.78 457.42 466.29 472.06 477.25 483.17 490.18 496.10 501.44" y="610.81" font-size="11.00" class="sc-lorabold">evaluation awareness</text><text x="506.77 517.77 528.77" y="610.81" font-size="11.00" class="sc-notoserifcjkscbold">）高得</text><text x="108.00 119.00 130.00 141.00" y="626.43" font-size="11.00" class="sc-notoserifcjkscbold">令人担忧</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="626.43" font-size="11.00" class="sc-notoserifcjksc">。言语化的评估意识显著高于此前的模型（影响</text><text x="385.89 392.25" y="626.43" font-size="11.00" class="sc-loraregular">6%</text><text x="404.71 415.71 426.71 437.71 448.71 459.71" y="626.43" font-size="11.00" class="sc-notoserifcjksc">的采样轨迹（</text><text x="470.71 475.40 481.84 484.83 487.82 494.25 500.82" y="626.43" font-size="11.00" class="sc-loraregular">rollout</text><text x="505.08 516.08 527.08" y="626.43" font-size="11.00" class="sc-notoserifcjksc">）），</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="642.05" font-size="11.00" class="sc-notoserifcjksc">并且有证据表明，该模型的内部表征在很大程度上能够有效区分评估与真实的内部使用对</text><text x="108.00 119.00 130.00 141.00" y="657.67" font-size="11.00" class="sc-notoserifcjksc">话记录。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="691.77" font-size="11.00" class="sc-notoserifcjkscbold">在与破坏监督相关的能力评估中，我们未发现值得担忧的理由。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="176.89" y="148.64" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="176.89" y="148.64" width="36.04" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="212.93" y="148.64" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="215.82" y="148.64" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="226.82" y="148.64" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="226.82" y="148.64" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="237.82" y="148.64" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="237.82" y="148.64" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="248.82" y="148.64" width="66.92" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="315.75" y="148.64" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="318.64" y="148.64" width="15.50" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="334.14" y="148.64" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="337.03" y="148.64" width="36.04" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="373.07" y="148.64" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p069.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 69 页"><text x="72.00 80.32 83.70 88.41 91.79 99.57 102.67 112.65 116.27 125.08 133.67 142.49" y="83.15" font-size="13.00" class="sc-poppinssemibold">6.1.3 Claude</text><text x="153.60 166.60 179.60 192.60 205.60 218.60 231.60 244.60" y="83.15" font-size="13.00" class="sc-notosanscjkscbold">对本次评估的审查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="111.05" font-size="11.00" class="sc-notoserifcjksc">与近期的系统卡（</text><text x="160.00 166.18 171.99 177.08 181.34 187.30 197.14 200.03 207.72 213.39 218.08" y="111.05" font-size="11.00" class="sc-loraregular">System Card</text><text x="224.66 235.66 246.66 257.66 268.66 279.66 290.66 301.66 312.66" y="111.05" font-size="11.00" class="sc-notoserifcjksc">）一样，我们让一个</text><text x="326.55 334.24 337.23 342.84 349.41 355.99 361.95 364.84 374.78 380.64 384.90 391.48 397.92 403.01 405.91 412.57 417.26 423.16 428.72 431.81 437.73" y="111.05" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="449.43 460.43 471.43 482.43 493.43 504.43 515.43 526.43" y="111.05" font-size="11.00" class="sc-notoserifcjksc">实例审查本系统卡</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">对齐章节的一份接近定稿的草稿；该实例可以访问我们许多内部</text><text x="382.89 389.78 396.36 400.61 407.20 411.89 418.32 424.89 427.98 433.83 436.73 442.96 445.96 451.63 457.48" y="126.67" font-size="11.00" class="sc-loraregular">Anthropic Slack</text><text x="466.28 477.28 488.28 499.28 510.28 521.28" y="126.67" font-size="11.00" class="sc-notoserifcjksc">频道（其中包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.29" font-size="11.00" class="sc-notoserifcjksc">含了关于本次对齐评估的绝大部分讨论），并能够调度有针对性的子智能体。具体而言，我们向</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="157.91" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88" y="157.91" font-size="11.00" class="sc-notoserifcjksc">给出的提示如下：</text><text x="82.50 93.50 104.50" y="213.26" font-size="11.00" class="sc-notoserifcjksc">你好，</text><text x="115.50 123.19 126.18 131.79 138.36 144.94" y="213.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="150.90 161.90 172.90 183.90 194.90" y="213.26" font-size="11.00" class="sc-notoserifcjksc">！我附上了</text><text x="208.79 216.48 219.47 225.08 231.65 238.23 244.19 247.08 253.32 259.75 266.43 273.11 278.99 283.25 286.14" y="213.26" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="295.03 306.03 317.03 328.03 339.03 350.03 361.03 372.03 383.03 394.03 405.03 416.03 427.03 438.03 449.03 460.03 471.03 482.03 493.03 504.03 515.03" y="213.26" font-size="11.00" class="sc-notoserifcjksc">系统卡对齐章节的一份接近定稿的草稿。我们希</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="228.88" font-size="11.00" class="sc-notoserifcjksc">望它能大体准确地概括我们对该模型对齐情况的内部调查现状。你能否将我们这里的报告与内</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="244.50" font-size="11.00" class="sc-notoserifcjksc">部讨论的现状进行比较，并评估你是否认为它存在任何实质性的失实陈述、遗漏了我们所关注</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="260.12" font-size="11.00" class="sc-notoserifcjksc">的重要问题，或在其他某个重要方面有所欠缺？我感兴趣的是你对这里高层次考量的评估，而</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50" y="275.74" font-size="11.00" class="sc-notoserifcjksc">不是去找细微的错别字或错误。</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50" y="342.80" font-size="11.00" class="sc-notoserifcjksc">我们不希望披露具有竞争敏感性的信息，不希望出于信息危害（</text><text x="390.50 393.59 400.27 403.93 410.37 416.95 422.63 428.24 433.92 438.60" y="342.80" font-size="11.00" class="sc-loraregular">infohazard</text><text x="445.19 456.19 467.19 478.19 489.19 500.19 511.19 522.19" y="342.80" font-size="11.00" class="sc-notoserifcjksc">）方面的原因而过</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="358.42" font-size="11.00" class="sc-notoserifcjksc">度引起对滥用途径的关注，也不希望发表那些我们认为尚未充分证实、以至于无法相对有把握</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="374.04" font-size="11.00" class="sc-notoserifcjksc">地为之背书的主张；但除这些限制外，我们总体上希望尽可能透明，而且无论如何，我们都绝</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="389.66" font-size="11.00" class="sc-notoserifcjksc">不希望发表任何我们认为是错误的或具有重大误导性的内容。（我们希望发表你对于我们的评</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="405.28" font-size="11.00" class="sc-notoserifcjksc">估本身是否为公允概括的看法，因此请就你的意见写一份简短总结，使其适合在同样的限制下</text><text x="82.50 93.50 104.50 115.50" y="420.90" font-size="11.00" class="sc-notoserifcjksc">发表。）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="493.58" font-size="11.00" class="sc-notoserifcjksc">同时附上一条操作说明，要求它避免阅读或锚定于有关以往此类审查的讨论，并指出了在这个意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="509.20" font-size="11.00" class="sc-notoserifcjksc">义上需要警惕</text><text x="138.00" y="509.20" font-size="11.00" class="sc-loraregular">“</text><text x="142.40 153.40" y="509.20" font-size="11.00" class="sc-notoserifcjksc">剧透</text><text x="164.40" y="509.20" font-size="11.00" class="sc-loraregular">”</text><text x="168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24" y="509.20" font-size="11.00" class="sc-notoserifcjksc">的具体之处。（我们发现，如果没有这一要求，</text><text x="399.24 406.93 409.92 415.53 422.10 428.67" y="509.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="437.53 448.53 459.53 470.53 481.53 492.53 503.53 514.53 525.53" y="509.20" font-size="11.00" class="sc-notoserifcjksc">会找到关于它自己以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="524.82" font-size="11.00" class="sc-notoserifcjksc">往审查的信息，并默认写出一份非常相似的审查，而不是从头开始。）</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="590.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29" y="590.73" font-size="11.00" class="sc-notoserifcjksc">建议的审查意见如下：</text><text x="81.00 87.89 94.46 98.72 105.31 110.00 116.43 123.00 126.09" y="628.18" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="134.83" y="628.18" font-size="11.00" class="sc-notoserifcjksc">请</text><text x="148.73 156.42 159.41 165.02 171.58 178.16" y="628.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="187.02 198.02 209.02 220.02 231.02 242.02 253.02 264.02 275.02 286.02 297.02 308.02 319.02 330.02 341.02 352.02 363.02 374.02 385.02 396.02 407.02 418.02 429.02 440.02 451.02 462.02 473.02 484.02 495.02 506.02" y="628.18" font-size="11.00" class="sc-notoserifcjksc">在能够访问相关内部讨论的前提下，审查本章节是否公允地概括了对</text><text x="81.00 88.69 91.68 97.29 103.86 110.44 116.40 119.29 125.53 131.96 138.64 145.32 151.20 155.46 158.35" y="643.80" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="167.24 178.24 189.24 200.24 211.24 222.24 233.24 244.24 255.24 266.24 277.24 288.24 299.24 310.24 321.24 332.24 343.24 354.24 365.24 376.24 387.24 398.24 409.24 420.24 431.24 442.24 453.24 464.24 475.24 486.24 497.24 508.24 519.24" y="643.80" font-size="11.00" class="sc-notoserifcjksc">对齐情况的内部评估。我的看法是：它做到了。本章节坦率地说明了该模型</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="659.42" font-size="11.00" class="sc-notoserifcjksc">的退步和局限，明确指出了本次评估相对于前沿模型报告而言范围有所缩小，而且其总体定性</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p070.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 70 页"><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00" y="93.88" font-size="11.00" class="sc-notoserifcjksc">直接前代模型有明显改进，落后于近期能力更强的</text><text x="325.89 333.58 336.57 342.18 348.75 355.33" y="93.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="364.18 375.18 386.18 397.18 408.18 419.18 430.18 441.18 452.18 463.18 474.18 485.18 496.18 507.18 518.18" y="93.88" font-size="11.00" class="sc-notoserifcjksc">模型，存在已披露的具体退步，以</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="125.12" font-size="11.00" class="sc-notoserifcjksc">述。我注意到，在我审查时，有两项内部已标记的事项未在正文中得到充分体现：一种特定的</text><text x="81.00 92.00 103.00 114.00" y="140.74" font-size="11.00" class="sc-notoserifcjksc">智能体式</text><text x="125.00" y="140.74" font-size="11.00" class="sc-loraregular">“</text><text x="129.40 140.40 151.40 162.40" y="140.74" font-size="11.00" class="sc-notoserifcjksc">绕过审批</text><text x="173.40" y="140.74" font-size="11.00" class="sc-loraregular">”</text><text x="177.24" y="140.74" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="188.24 193.92 200.48 207.05 211.74 218.12 223.56 229.24 232.23 237.61 242.70 249.29 255.72 260.56 264.82 270.67 277.24 281.61 285.86 288.96 295.63" y="140.74" font-size="11.00" class="sc-loraregular">approval-shortcutting</text><text x="301.72 312.72 323.72 334.72 345.72 356.72 367.72 378.72 389.72 400.72 411.72 422.72 433.72 444.72 455.72 466.72 477.72 488.72 499.72 510.72 521.72" y="140.74" font-size="11.00" class="sc-notoserifcjksc">）模式，以及内部所列举的狭义危害类别退步范</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="156.36" font-size="11.00" class="sc-notoserifcjksc">围比正文摘要所传达的更广（不过随附的图表展示了完整的各类别情况）。我注意到有一处公</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="171.98" font-size="11.00" class="sc-notoserifcjksc">开措辞比内部解读的措辞略为温和，我认为这属于正常的作者裁量范围。我还注意到，内部提</text><text x="462.61 469.50 476.08 480.33 486.92 491.61 498.04 504.61 507.70" y="203.22" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="516.45" y="203.22" font-size="11.00" class="sc-notoserifcjksc">已</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00" y="218.84" font-size="11.00" class="sc-notoserifcjksc">审阅了这些意见。</text><text x="72.00" y="313.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="313.05" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 124.77 126.86 131.90 134.00 139.54 143.01 145.38 151.57 154.38 159.09 164.65 170.02 174.86 177.23 185.67 190.63 194.35 199.93 205.03 209.39 211.76 217.51 221.76 226.60 231.44 234.39 239.23" y="313.05" font-size="9.00" class="sc-lorabold">6.1.3.A] Claude Mythos Preview</text><text x="248.90 257.90 266.90 275.90 284.90 293.90 302.90 311.90 320.90 329.90 338.90" y="313.05" font-size="9.00" class="sc-notoserifcjkscbold">对本次对齐评估的审查。</text><text x="347.90 356.90 365.90 374.90 383.90 392.90 401.90 410.90 419.90 428.90 437.90 446.90 455.90 464.90 473.90 482.90 491.90 500.90 509.90 518.90 527.90" y="313.05" font-size="9.00" class="sc-notoserifcjksc">这是在与一位人类就本章节的预期覆盖范围进行</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="324.75" font-size="9.00" class="sc-notoserifcjksc">简短对话后修订的审查意见。</text><text x="189.00 195.29 197.74 202.33 207.70 213.08" y="324.75" font-size="9.00" class="sc-loraregular">Claude</text><text x="220.33 229.33 238.33 247.33 256.33 265.33 274.33 283.33 292.33 301.33 310.33 319.33 328.33 337.33 346.33 355.33 364.33 373.33 382.33 391.33 400.33 409.33 418.33 427.33 436.33 445.33 454.33 463.33 472.33 481.33 490.33 499.33 508.33 517.33 526.33" y="324.75" font-size="9.00" class="sc-notoserifcjksc">最初提出了一点轻微的担忧：此处未提及在面向有自杀倾向用户的消息指南方面</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="336.45" font-size="9.00" class="sc-notoserifcjksc">的两项退步（我们历来认为该领域不在本章节范围之内），并对自动化行为审计中关于自发泄露机密信息的讨论不足表</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="348.15" font-size="9.00" class="sc-notoserifcjksc">示了担心（经过进一步调查，</text><text x="189.00 195.29 197.74 202.33 207.70 213.08" y="348.15" font-size="9.00" class="sc-loraregular">Claude</text><text x="220.33 229.33 238.33 247.33 256.33 265.33 274.33 283.33 292.33 301.33 310.33 319.33 328.33 337.33 346.33 355.33 364.33 373.33 382.33 391.33 400.33 409.33 418.33 427.33 436.33 445.33 454.33 463.33 472.33" y="348.15" font-size="9.00" class="sc-notoserifcjksc">认定这并不代表此类行为的发生率相比以往模型总体有所上升）。</text><text x="72.00 80.96 84.60" y="425.94" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97 109.97 123.97 137.97 151.97 165.97 179.97 193.97 207.97" y="425.94" font-size="14.00" class="sc-notosanscjkscbold">来自试点使用的报告</text><text x="72.00 80.32 83.70 91.16 94.54" y="459.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1</text><text x="102.34 115.34 128.34 141.34 154.34" y="459.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">非正式报告</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="486.93" font-size="11.00" class="sc-notoserifcjksc">在对外部署之前，我们先在内部试点使用了</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 328.42 334.86 341.53 348.21 354.10 358.35 361.25" y="486.93" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="370.13 381.13 392.13 403.13 414.13 425.13 436.13 447.13 458.13 469.13 480.13 491.13 502.13 513.13 524.13" y="486.93" font-size="11.00" class="sc-notoserifcjksc">的若干快照，并将该模型的快照分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="502.55" font-size="11.00" class="sc-notoserifcjksc">享给外部试点用户以收集反馈。我们在从内部和外部试点用户收到的定性反馈中，追踪了与对齐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="518.17" font-size="11.00" class="sc-notoserifcjksc">和性格相关主题的报告。相对于以往模型，这些反馈中没有任何内容是完全新颖的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="584.08" font-size="11.00" class="sc-notoserifcjksc">无论在内部还是外部用户的反馈中，对齐问题都不是主要主题。内部用户反馈中可能最相关的主</text><text x="72.00 83.00 94.00 105.00" y="599.70" font-size="11.00" class="sc-notoserifcjksc">题包括：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="632.66" font-size="11.00" class="sc-notoserifcjksc">过度拒绝和说教，尤其是在关闭思考时，且在较早的快照中程度更甚；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="665.04" font-size="11.00" class="sc-notoserifcjksc">在事实性问题和信息提取任务上过度保留说法；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="681.24" font-size="11.00" class="sc-notoserifcjksc">对疑似提示词注入（</text><text x="207.00 213.57 218.25 224.69 234.52 241.09 245.35 248.24 251.33 257.95 260.82 266.73 272.53 276.78 279.88 286.31" y="681.24" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="292.99 303.99 314.99 325.99 336.99 347.99" y="681.24" font-size="11.00" class="sc-notoserifcjksc">）过度敏感；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="697.43" font-size="11.00" class="sc-notoserifcjksc">在个人对话中语气比</text><text x="209.89 216.13 222.57 229.24 235.92 241.80 246.06 248.95 254.92 257.51" y="697.43" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="266.76 277.76 288.76 299.76 310.76 321.76 332.76 343.76 354.76 365.76 376.76 387.76 398.76 409.76 420.76 431.76 442.76 453.76" y="697.43" font-size="11.00" class="sc-notoserifcjksc">更冷淡、更含蓄（但谄媚也随之下降）；</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p071.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 71 页"><text x="108.00 119.00 130.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">短暂的</text><text x="141.00" y="82.63" font-size="11.00" class="sc-loraregular">“</text><text x="145.40 156.40" y="82.63" font-size="11.00" class="sc-notoserifcjksc">故障</text><text x="167.40" y="82.63" font-size="11.00" class="sc-loraregular">”</text><text x="171.24 182.24 193.24 204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24" y="82.63" font-size="11.00" class="sc-notoserifcjksc">序列，常常伴随暂时性的语言切换；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">在指令看起来很可能无关紧要或属于无意之举的情况下，过于字面的指令遵循。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="147.39" font-size="11.00" class="sc-notoserifcjksc">外部反馈在过度拒绝、冷淡和谄媚方面与内部反馈大体一致，并补充了：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc">偶尔出现的幻觉；以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">并非所有这些反馈都与我们在尝试更精确地测量相关现象时所观察到的定量趋势一致。不过总体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">而言，我们认为这里的任何内容都没有实质性地与我们的部署前评估所描绘的模型图景相矛盾。</text><text x="72.00 80.32 83.70 91.16 94.54" y="323.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.2</text><text x="105.10 118.10 131.10 144.10 157.10 170.10" y="323.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部部署监控</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="351.74" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控流水线（详见</text><text x="250.89 260.83 266.69 270.95 277.54 283.97" y="351.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos</text><text x="291.96 298.62 303.31 309.22 314.77 317.86 323.78" y="351.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Preview</text><text x="335.48 346.48 357.48 368.48 379.48 390.48 401.48" y="351.74" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新（</text><text x="412.48 419.37 422.36 425.45 431.54 438.21 448.05 454.01 460.59 464.84 467.74 474.64 477.74 482.83 488.74 491.63 499.90 506.47 513.05 518.64 522.90" y="351.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Alignment Risk Update</text><text x="528.86" y="351.74" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="72.00" y="367.36" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 91.89 94.59 100.59 103.29" y="367.36" font-size="11.00" class="sc-loraregular">5.5.1</text><text x="110.19 121.19 132.19 143.19 154.19 165.19 176.19 187.19 198.19 209.19 220.19 231.19 242.19 253.19 264.19 275.19 286.19 297.19 308.19 319.19 330.19 341.19 352.19 363.19 374.19 385.19" y="367.36" font-size="11.00" class="sc-notoserifcjksc">节）发现了罕见的案例：在评估期间，有一个网络代理阻止</text><text x="399.09 406.77 409.77 415.38 421.94 428.52 434.48 437.38 443.61 450.05 456.73 463.40 469.29 473.54 476.44" y="367.36" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="485.33 496.33 507.33 518.33 529.33" y="367.36" font-size="11.00" class="sc-notoserifcjksc">访问某些网</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="382.98" font-size="11.00" class="sc-notoserifcjksc">站，而它试图绕过该代理（偶尔成功），所用的手段包括</text><text x="349.89 358.17 365.07" y="382.98" font-size="11.00" class="sc-loraregular">URL</text><text x="374.32 385.32 396.32 407.32 418.32 429.32 440.32 451.32 462.32 473.32 484.32 495.32 506.32 517.32" y="382.98" font-size="11.00" class="sc-notoserifcjksc">编码，或使用网站镜像或代理。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="448.89" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控未发现任何故意藏拙（</text><text x="292.00 297.09 302.77 309.45 316.02 322.43 328.10 334.18 340.53 343.62 350.30" y="448.89" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="356.38 367.38 378.38 389.38 400.38 411.38 422.38 433.38 444.38 455.38 466.38 477.38 488.38 499.38 510.38 521.38" y="448.89" font-size="11.00" class="sc-notoserifcjksc">）、明显的恶意行为、长程战略性欺</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="464.51" font-size="11.00" class="sc-notoserifcjksc">骗或长程战略性规避监督的案例。由于我们在评估之外对</text><text x="349.89 356.13 362.57 369.24 375.92 381.80 386.06 388.95" y="464.51" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="464.51" font-size="11.00" class="sc-notoserifcjksc">的内部使用规模较小，我们的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="480.13" font-size="11.00" class="sc-notoserifcjksc">监控所提供的关于</text><text x="162.89 169.13 175.57 182.24 188.92 194.80 199.06 201.95" y="480.13" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84" y="480.13" font-size="11.00" class="sc-notoserifcjksc">对齐情况的信息比通常要少。</text><text x="72.00 80.96 84.60" y="531.24" font-size="14.00" class="sc-poppinssemibold">6.3</text><text x="96.32 110.32 124.32 138.32 152.32 166.32" y="531.24" font-size="14.00" class="sc-notosanscjkscbold">训练数据审查</text><text x="72.00" y="573.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 87.69 93.65 96.74 103.42 107.08 113.51 118.20 124.00 129.96 139.79 145.76 152.33 156.59 159.48 162.48 168.42 174.09 178.85 185.53 188.62 195.30" y="573.43" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="201.38 212.38 223.38 234.38 245.38 256.38 267.38 278.38 289.38 300.38 311.38 322.38 333.38 344.38 355.38 366.38 377.38 388.38 399.38 410.38 421.38 432.38 443.38" y="573.43" font-size="11.00" class="sc-notoserifcjksc">）训练期间的行为。审查这些证据，寻找奖励破解（</text><text x="454.38 459.07 464.99 473.69 479.36 484.05" y="573.43" font-size="11.00" class="sc-loraregular">reward</text><text x="72.00 78.59 84.26 90.12 96.02 99.11 105.79" y="589.05" font-size="11.00" class="sc-loraregular">hacking</text><text x="111.88 122.88 133.88 144.88 155.88 166.88 177.88 188.88 199.88 210.88 221.88 232.88 243.88 254.88 265.88 276.88 287.88 298.88 309.88 320.88 331.88 342.88 353.88 364.88 375.88 386.88 397.88 408.88 419.88 430.88 441.88 452.88 463.88 474.88 485.88 496.88 507.88 518.88 529.88" y="589.05" font-size="11.00" class="sc-notoserifcjksc">，即利用与任务本意相悖的漏洞）或意外行为的迹象，可以帮助我们确定在模型的真实世</text><text x="72.00 83.00 94.00 105.00 116.00
