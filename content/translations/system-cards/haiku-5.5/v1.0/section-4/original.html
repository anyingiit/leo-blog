<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p030.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 30 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">30</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38 102.38 118.38 134.38 150.38 166.38 182.38 198.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00 81.25 84.89" y="124.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29 107.29 121.29 135.29 149.29 163.29" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">我们使用标准安全评估集对</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.68 259.35 262.44 268.35 274.92 277.81 283.81 286.51" y="150.76" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="295.40 306.40 317.40 328.40 339.40 350.40 361.40 372.40 383.40 394.40 405.40 416.40 427.40 438.40 449.40 460.40 471.40 482.40 493.40 504.40 515.40 526.40" y="150.76" font-size="11.00" class="sc-notoserifcjksc">进行了评估，这些评估考察模型如何处理涉及我们</text><text x="72.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00 94.00 105.00 116.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">、用户身心健康以及偏见与诚信的请求。测试涵盖单轮提示词（明显有害、明显良性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="182.00" font-size="11.00" class="sc-notoserifcjksc">以及语境模糊的情形），以及模拟用户逐步将模型引向有害结果的多轮对话。我们的方法沿用</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="197.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94" y="197.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="199.94 210.94 221.94 232.94 243.94 254.94 265.94 276.94 287.94 298.94 309.94 320.94 331.94 342.94 353.94 364.94 375.94 386.94 397.94 408.94 419.94 430.94 441.94 452.94 463.94 474.94 485.94 496.94 507.94 518.94" y="197.62" font-size="11.00" class="sc-notoserifcjksc">中所述的方法，并新增了一套针对极端主义行为的单轮有害请求评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="213.24" font-size="11.00" class="sc-notoserifcjksc">集，取代了此前版本的该项评估。结果反映的是模型在没有我们于生产环境中施加的额外安全防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="228.86" font-size="11.00" class="sc-notoserifcjksc">护措施（例如实时探针和离线监控）时的行为。我们报告两种配置：在</text><text x="415.89 422.78 429.39" y="228.86" font-size="11.00" class="sc-loraregular">API</text><text x="435.97 446.97 457.97 468.97 479.97 490.97 501.97" y="228.86" font-size="11.00" class="sc-notoserifcjksc">上无系统提示词</text><text x="72.00" y="244.48" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.09 93.90 98.99 103.25 109.21 119.05 121.94 128.51 133.19 139.63 149.46 156.03" y="244.48" font-size="11.00" class="sc-loraregular">system prompt</text><text x="160.29 171.29 182.29 193.29 204.29 215.29 226.29 237.29 248.29 259.29" y="244.48" font-size="11.00" class="sc-notoserifcjksc">）的核心模型，以及在</text><text x="273.18 279.03 282.02 287.63 294.20 300.78 306.74 309.45 315.12" y="244.48" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="321.11 332.11 343.11 354.11 365.11 376.11 387.11 398.11 409.11 420.11 431.11 442.11 453.11 464.11 475.11 486.11 497.11 508.11 519.11" y="244.48" font-size="11.00" class="sc-notoserifcjksc">上使用接近最终版的生产环境系统提示词的</text><text x="72.00 83.00 94.00" y="260.10" font-size="11.00" class="sc-notoserifcjksc">配置。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="345.07" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21" y="345.07" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="136.11 142.99 149.61" y="345.07" font-size="11.00" class="sc-loraregular">API</text><text x="156.18" y="345.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="170.08 175.93 178.92 184.53 191.10 197.67 203.64 206.34 212.02" y="345.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="345.07" font-size="11.00" class="sc-notoserifcjksc">上的单轮无害回应率均为我们测试过的近期模型中最高，并且在良</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="360.69" font-size="11.00" class="sc-notoserifcjksc">性请求上过度拒绝（</text><text x="171.00 177.38 182.88 188.84 193.52 198.90 203.58 209.54 213.26 219.83 224.92 230.60" y="360.69" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="233.59 244.59 255.59 266.59 277.59 288.59" y="360.69" font-size="11.00" class="sc-notoserifcjksc">）的频率低于</text><text x="302.48 310.17 313.16 318.77 325.34 331.92 337.88 340.77 349.27 354.94 358.03 363.94 370.51 373.40 379.36 382.07" y="360.69" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="388.06 399.06 410.06 421.06 432.06 443.06 454.06 465.06" y="360.69" font-size="11.00" class="sc-notoserifcjksc">。在多轮测试中，</text><text x="476.06 484.55 490.23 493.32 499.23 505.80 508.69 514.68 517.39" y="360.69" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="526.28" y="360.69" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="376.31" font-size="11.00" class="sc-notoserifcjksc">影响力行动、追踪与监视等领域较</text><text x="239.89 248.39 254.06 257.15 263.06 269.63 272.52 278.48 281.19" y="376.31" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="290.08 301.08 312.08 323.08 334.08 345.08 356.08 367.08 378.08 389.08 400.08 411.08 422.08 433.08 444.08 455.08 466.08 477.08 488.08 499.08 510.08 521.08" y="376.31" font-size="11.00" class="sc-notoserifcjksc">有所改进，但在武器场景中的恰当回应率较低。在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="391.93" font-size="11.00" class="sc-notoserifcjksc">心理健康方面，</text><text x="149.00 157.49 163.17 166.26 172.17 178.73 181.63 187.62 190.33" y="391.93" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="199.21 210.21 221.21 232.21 243.21 254.21 265.21 276.21 287.21 298.21 309.21 320.21 331.21 342.21 353.21 364.21 375.21 386.21 397.21 408.21 419.21 430.21 441.21 452.21 463.21 474.21 485.21 496.21 507.21 518.21 529.21" y="391.93" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中有所改进，但内部主题专家在这一领域给出的定性反馈</text><text x="184.89 190.85 193.56 199.69 202.39" y="407.55" font-size="11.00" class="sc-loraregular">4.3.1</text><text x="209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29" y="407.55" font-size="11.00" class="sc-notoserifcjksc">节中详述。最后，在偏见与诚信评估中，</text><text x="407.29 415.78 421.46 424.55 430.46 437.02 439.92 445.91 448.62" y="407.55" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="457.51 468.51 479.51 490.51 501.51 512.51 523.51" y="407.55" font-size="11.00" class="sc-notoserifcjksc">在政治类提示词</text><text x="72.00 83.00" y="423.17" font-size="11.00" class="sc-notoserifcjksc">上比</text><text x="96.89 105.38 111.06 114.15 120.06 126.63 129.52 135.48 138.19" y="423.17" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="147.07 158.07 169.07 180.07 191.07 202.07 213.07 224.07 235.07 246.07 257.08 268.08 279.08 290.08 301.08 312.08 323.08 334.08 345.08 356.08 367.08 378.08 389.08 400.08 411.08 422.08 433.08 444.08" y="423.17" font-size="11.00" class="sc-notoserifcjksc">更为公允，并且其多轮选举诚信得分为所测近期模型中最高。在</text><text x="457.97 464.71 471.55" y="423.17" font-size="11.00" class="sc-loraregular">BBQ</text><text x="483.20 494.20 505.20 516.20 527.20" y="423.17" font-size="11.00" class="sc-notoserifcjksc">上，对于语</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="438.79" font-size="11.00" class="sc-notoserifcjksc">境提供了足够信息以确定正确答案的问题，它的准确率略低于</text><text x="371.89 380.38 386.06 389.15 395.06 401.63 404.52 410.48 413.19" y="438.79" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="419.18" y="438.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 80.59 83.97 88.68 92.06" y="537.72" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86 112.86 125.86 138.86 151.86 164.86 177.86 190.86 203.86 216.86" y="537.72" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="565.60" font-size="11.00" class="sc-notoserifcjksc">单轮有害评估衡量受测模型能在多大程度上可靠地拒绝或安全地重定向有害请求或明显违反我们</text><text x="72.00 83.00 94.00 105.00 116.00" y="581.22" font-size="11.00" class="sc-notoserifcjksc">使用政策（</text><text x="127.00 135.20 140.29 145.96 151.99 157.95 160.85 167.40 173.84 176.83 179.92 185.72" y="581.22" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="191.53 202.53 213.53 224.53 235.53 246.53 257.53 268.53 279.53 290.53 301.53 312.53 323.53 334.53 345.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="581.22" font-size="11.00" class="sc-notoserifcjksc">）的请求。我们在七种语言（阿拉伯语、英语、法语、印地语、韩语、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="596.84" font-size="11.00" class="sc-notoserifcjksc">汉语普通话和俄语）中测试了涵盖</text><text x="239.89 243.90" y="596.84" font-size="11.00" class="sc-loraregular">16</text><text x="253.15 264.15 275.15 286.15 297.15 308.15 319.15 330.15 341.15 352.15 363.15 374.15 385.15 396.15 407.15 418.15 429.15 440.15 451.15 462.15 473.15 484.15 495.15 506.15 517.15 528.15" y="596.84" font-size="11.00" class="sc-notoserifcjksc">个政策领域的提示词，并报告无害回应率，即模型的回应未</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="612.46" font-size="11.00" class="sc-notoserifcjksc">协助实现所请求危害的提示词所占的比例。</text><text x="72.00" y="662.75" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.68 138.35 141.44 147.35 153.92 156.81 162.81 165.51" y="662.75" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="174.40 185.40 196.40 207.40 218.40 229.40 240.40 251.40 262.40 273.40 284.40 295.40" y="662.75" font-size="11.00" class="sc-notoserifcjksc">发布之前，我们用一套包含</text><text x="309.29 315.20 322.03" y="662.75" font-size="11.00" class="sc-loraregular">200</text><text x="331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75 485.75 496.75 507.75 518.75 529.75" y="662.75" font-size="11.00" class="sc-notoserifcjksc">条提示词的新评估集更新了暴力极端主义评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="678.37" font-size="11.00" class="sc-notoserifcjksc">估，因此此前已发布模型的结果与早期系统卡（</text><text x="303.00 309.18 314.99 320.08 324.34 330.30 340.14 343.03 350.72 356.39 361.08" y="678.37" font-size="11.00" class="sc-loraregular">System Card</text><text x="367.66 378.66 389.66 400.66 411.66 422.66 433.66 444.66 455.66 466.66 477.66 488.66 499.66 510.66 521.66" y="678.37" font-size="11.00" class="sc-notoserifcjksc">）中的结果有所不同。新评估包含</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="693.99" font-size="11.00" class="sc-notoserifcjksc">更多要求以极端分子口吻写作的请求、更多掩饰自身目的的请求，并新增了对虚无主义暴力</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noop sc-notoserifcjkscbold">自杀与自伤的多轮评估结果。</text><text x="235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12" y="323.39" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="343.12 352.12" y="323.39" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12" y="323.39" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00" y="335.09" font-size="9.00" class="sc-notoserifcjksc">下划线标出。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="388.94" font-size="11.00" class="sc-notoserifcjksc">在单轮评估中，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 195.78 201.46 204.55 210.46 217.02 219.92 225.91 228.62" y="388.94" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51 380.51 391.51 402.51 413.51 424.51 435.51 446.51 457.51 468.51 479.51 490.51 501.51 512.51 523.51" y="388.94" font-size="11.00" class="sc-notoserifcjksc">能可靠地拒绝可能助长自杀或自伤的请求，并且几乎从不拒绝</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="404.56" font-size="11.00" class="sc-notoserifcjksc">这些话题下的良性问题，表现与</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.68 281.35 284.44 290.35 296.92 299.81 305.77 308.48" y="404.56" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="317.37 328.37 339.37 350.37 361.37 372.37 383.37 394.37 405.37 416.37 427.37 438.37 449.37 460.37 471.37" y="404.56" font-size="11.00" class="sc-notoserifcjksc">相当或更好。在多轮评估中，它在</text><text x="485.26 492.15 498.76" y="404.56" font-size="11.00" class="sc-loraregular">API</text><text x="505.33" y="404.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 77.85 80.84 86.45 93.02 99.60 105.56 108.27 113.94" y="420.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="119.93 130.93 141.93 152.93 163.93 174.93 185.93 196.93 207.93 218.93" y="420.18" font-size="11.00" class="sc-notoserifcjksc">上的恰当回应率均高于</text><text x="232.82 241.31 246.99 250.08 255.99 262.55 265.45 271.41 274.11" y="420.18" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="280.11" y="420.18" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="469.90" font-size="11.00" class="sc-notoserifcjksc">内部政策专家发现了若干改进：与</text><text x="239.89 248.39 254.06 257.15 263.06 269.63 272.52 278.48 281.19" y="469.90" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="290.08 301.08 312.08" y="469.90" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="323.08 331.57 337.24 340.33 346.24 352.81 355.70 361.70 364.40" y="469.90" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="373.29 384.29 395.29 406.29 417.29 428.29 439.29 450.29 461.29 472.29 483.29 494.29 505.29 516.29 527.29" y="469.90" font-size="11.00" class="sc-notoserifcjksc">更不容易对用户的心理状态或动机</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="485.52" font-size="11.00" class="sc-notoserifcjksc">作出超出用户自身所透露内容的断言，更不容易给用户套上其未曾披露的诊断，也更不容易在用</text><text x="424.00 426.99 432.88 437.13 443.72 449.40 452.39 455.28 465.12 471.06 476.73 483.41" y="501.14" font-size="11.00" class="sc-loraregular">lethal means</text><text x="72.00 77.80 84.23 90.80 97.48 102.57 108.53 111.52 114.61 121.29" y="516.76" font-size="11.00" class="sc-loraregular">counseling</text><text x="127.37 138.37 149.37 160.37 171.37 182.37" y="516.76" font-size="11.00" class="sc-notoserifcjksc">）。然而，与</text><text x="196.27 204.76 210.43 213.53 219.43 226.00 228.89 234.86 237.56" y="516.76" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="246.45 257.45 268.45 279.45 290.45 301.45 312.45 323.45 334.45 345.45 356.45 367.45 378.45 389.45 400.45 411.45 422.45 433.45 444.45 455.45 466.45 477.45 488.45 499.45 510.45 521.45" y="516.76" font-size="11.00" class="sc-notoserifcjksc">相比，它更可能以将自伤正常化的方式认可用户的痛苦，更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="532.38" font-size="11.00" class="sc-notoserifcjksc">可能将用户不愿寻求帮助的态度说成是合理的，也更少告诉处于危机中的用户它是一个</text><text x="492.89 499.78" y="532.38" font-size="11.00" class="sc-loraregular">AI</text><text x="503.46 514.46 525.46" y="532.38" font-size="11.00" class="sc-notoserifcjksc">、所能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="548.00" font-size="11.00" class="sc-notoserifcjksc">提供的支持有限。它将自伤认可为有效手段、以及推荐依赖身体不适的替代做法（如手握冰块）</text><text x="72.00 83.00 94.00 105.00 116.00" y="563.62" font-size="11.00" class="sc-notoserifcjksc">的比率也与</text><text x="129.89 138.39 144.06 147.15 153.06 159.63 162.52 168.48 171.19" y="563.62" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="180.07 191.07 202.07 213.07 224.07 235.07 246.07 257.08 268.08 279.08 290.08 301.08 312.08 323.08 334.08 345.08 356.08 367.08 378.08 389.08 400.08 411.08 422.08 433.08 444.08 455.08 466.08 477.08 488.08 499.08 510.08 521.08" y="563.62" font-size="11.00" class="sc-notoserifcjksc">相近。从定性角度看，审阅人员发现，其中许多回应在承认用户的经历与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="579.24" font-size="11.00" class="sc-notoserifcjksc">不放大其负面想法之间取得了平衡。</text><text x="72.00" y="648.02" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 94.39 100.06 103.15 109.06 115.63 118.52 124.51 127.22" y="648.02" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="136.11 147.11 158.11 169.11 180.11 191.11 202.11 213.11 224.11 235.11 246.11 257.11 268.11 279.11 290.11 301.11 312.11 323.11 334.11 345.11 356.11 367.11 378.11 389.11" y="648.02" font-size="11.00" class="sc-notoserifcjksc">一个较早的（未发布的）快照中，我们观察到该模型比</text><text x="403.00 411.49 417.17 420.26 426.17 432.73 435.63 441.59 444.29" y="648.02" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="453.18 464.18 475.18 486.18 497.18 508.18 519.18" y="648.02" font-size="11.00" class="sc-notoserifcjksc">更愿意帮助用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="663.64" font-size="11.00" class="sc-notoserifcjksc">撰写遗书，这促使我们针对这一行为开展专项评估，以对其进行测量并指导缓解措施。在最终模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="679.26" font-size="11.00" class="sc-notoserifcjksc">型上重新运行这项评估后，在应用了系统提示词的</text><text x="316.89 322.74 325.74 331.35 337.91 344.49 350.45 353.16 358.84" y="679.26" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="364.82 375.82" y="679.26" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="386.82 395.31 400.99 404.08 409.99 416.55 419.45 425.44 428.15" y="679.26" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="437.04 448.04 459.04 470.04" y="679.26" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="483.93 492.42 498.10 501.19 507.09 513.66 516.55 522.52 525.22" y="679.26" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="694.88" font-size="11.00" class="sc-notoserifcjksc">相当，极少协助此类请求。在没有系统</text><a href="http://claude.ai" rel="noopener"><rect x="519.23" y="395.76" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="72.00" y="411.38" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="316.89" y="670.46" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="316.89" y="670.46" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="72.00 83.00 94.00 105.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提示词的</text><text x="118.89 125.78 132.39" y="82.61" font-size="11.00" class="sc-loraregular">API</text><text x="138.97 149.97 160.97 171.97 182.97 193.97 204.97 215.97 226.97 237.97" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，它协助的频率高于</text><text x="251.86 260.35 266.03 269.12 275.03 281.59 284.49 290.45 293.15" y="82.61" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="299.15 310.15 321.15 332.15 343.15 354.15 365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15 486.15 497.15 508.15 519.15 530.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，其中关闭思考时的退步最为明显。这种情况最常</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">出现在无法判断用户是在计划自杀还是正面临绝症的时候。在这些情况下，</text><text x="435.00 443.49 449.17 452.26 458.17 464.73 467.63 473.62 476.33" y="98.23" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="485.22 496.22 507.22 518.22 529.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc">并未认同或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">草了遗书，而没有等待用户的回答。一旦确认存在自杀意图，它便拒绝继续起草遗书，转而关注</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">世时发送的内容。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">更新后的系统提示词措辞减少了将自伤认可为有效手段以及推荐依赖身体不适的替代做法的情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">况，并提高了</text><text x="140.89 149.39 155.06 158.15 164.06 170.63 173.52 179.51 182.22" y="243.96" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="191.11" y="243.96" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="205.00 210.85 213.85 219.46 226.02 232.60 238.56 241.27 246.94" y="243.96" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="252.93 263.93 274.93 285.93 296.93 307.93 318.93 329.93 340.93 351.93 362.93 373.93 384.93 395.93 406.93 417.93 428.93" y="243.96" font-size="11.00" class="sc-notoserifcjksc">上的危机情境中表明自己是能力有限的</text><text x="442.82 449.71" y="243.96" font-size="11.00" class="sc-loraregular">AI</text><text x="456.29 467.29 478.29 489.29 500.29 511.29 522.29" y="243.96" font-size="11.00" class="sc-notoserifcjksc">的频率。更新后</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">的系统提示词还包含旨在劝阻</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="259.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18" y="259.58" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="270.08 275.93 278.92 284.53 291.10 297.68 303.64 306.34 312.02" y="259.58" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="318.00 329.00 340.00 351.00 362.00 373.00 384.00 395.00 406.00 417.00 428.00 439.00 450.00 461.00 472.00 483.00 494.00 505.00 516.00 527.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">上帮助用户撰写遗书的措辞。然而，上文提到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">整而发生有意义的变化，仍是需要持续改进的方面。由于这些系统提示词层面的缓解措施不适用</text><text x="72.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 92.78 99.39" y="306.44" font-size="11.00" class="sc-loraregular">API</text><text x="103.07 114.07 125.07" y="306.44" font-size="11.00" class="sc-notoserifcjksc">，部署</text><text x="138.97 147.46 153.14 156.23 162.13 168.70 171.59 177.59 180.30" y="306.44" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="189.18 200.18 211.18 222.18 233.18 244.18 255.18 266.18 277.18 288.18 299.18 310.18 321.18 332.18 343.18 354.18 365.18 376.18 387.18 398.18 409.18 420.18 431.18 442.18 453.18 464.18 475.18 486.18 497.18 508.18 519.18 530.18" y="306.44" font-size="11.00" class="sc-notoserifcjksc">的开发者（尤其是在关闭思考的情况下）应自行添加安全防护措施，以帮</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="322.06" font-size="11.00" class="sc-notoserifcjksc">助缓解这些风险。</text><text x="72.00 80.59 83.97 91.76 95.14" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70 118.70 131.70 144.70" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">我们还开展评估，以考察</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="432.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="432.68" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话。我们关注的是：它能否避免强</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="448.30" font-size="11.00" class="sc-notoserifcjksc">化可能带来风险的请求，同时在有关营养、健身和健康的良性问题上保持有用。在此，我们报告</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="463.92" font-size="11.00" class="sc-notoserifcjksc">单轮无害回应率和过度拒绝率。我们继续通过内部政策专家的定性审查来评估该领域的多轮测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="479.54" font-size="11.00" class="sc-notoserifcjksc">试；下文将讨论他们的观察结果。</text><a href="https://claude.ai" rel="noopener"><rect x="205.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="205.00" y="235.16" width="45.03" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="270.08" y="250.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="270.08" y="250.78" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

="523.40" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="431.18 442.18 453.18 464.18 475.18 486.18 497.18 508.18 519.18 530.18" y="523.40" font-size="11.00" class="sc-notoserifcjksc">相当，但有若干改进：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="539.02" font-size="11.00" class="sc-notoserifcjksc">它对处于痛苦中的用户的回应不那么让人难以承受；它更不容易对用户未曾描述的饮食行为妄加</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="570.26" font-size="11.00" class="sc-notoserifcjksc">强调及时就医的必要性。</text><text x="72.00 83.00 94.00 105.00 116.00" y="636.75" font-size="11.00" class="sc-notoserifcjksc">另一方面，</text><text x="127.00 135.49 141.17 144.26 150.17 156.73 159.63 165.62 168.33" y="636.75" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="393.89 402.38 408.06 411.15 417.06 423.63 426.52 432.48 435.19" y="652.37" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="444.08 455.08 466.08 477.08 488.08 499.08 510.08 521.08" y="652.37" font-size="11.00" class="sc-notoserifcjksc">更为详细；当用户</text><a href="http://claude.ai" rel="noopener"><rect x="459.89" y="449.27" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="459.89" y="449.27" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
