.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p030.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 30 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">30</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="124.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">我们使用标准安全评估集对</text><text x="206.89" y="150.76" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="295.40" y="150.76" font-size="11.00" class="sc-notoserifcjksc">进行了评估，这些评估考察模型如何处理涉及我们</text><text x="72.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="127.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">、用户身心健康以及偏见与诚信的请求。测试涵盖单轮提示词（明显有害、明显良性</text><text x="72.00" y="182.00" font-size="11.00" class="sc-notoserifcjksc">以及语境模糊的情形），以及模拟用户逐步将模型引向有害结果的多轮对话。我们的方法沿用</text><text x="72.00" y="197.62" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Sonnet 5.5</text><text x="166.94" y="197.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="199.94" y="197.62" font-size="11.00" class="sc-notoserifcjksc">中所述的方法，并新增了一套针对极端主义行为的单轮有害请求评估</text><text x="72.00" y="213.24" font-size="11.00" class="sc-notoserifcjksc">集，取代了此前版本的该项评估。结果反映的是模型在没有我们于生产环境中施加的额外安全防</text><text x="72.00" y="228.86" font-size="11.00" class="sc-notoserifcjksc">护措施（例如实时探针和离线监控）时的行为。我们报告两种配置：在</text><text x="415.89" y="228.86" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="435.97" y="228.86" font-size="11.00" class="sc-notoserifcjksc">上无系统提示词</text><text x="72.00" y="244.48" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="244.48" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="160.29" y="244.48" font-size="11.00" class="sc-notoserifcjksc">）的核心模型，以及在</text><text x="273.18" y="244.48" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="321.11" y="244.48" font-size="11.00" class="sc-notoserifcjksc">上使用接近最终版的生产环境系统提示词的</text><text x="72.00" y="260.10" font-size="11.00" class="sc-notoserifcjksc">配置。</text><text x="72.00" y="345.07" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="345.07" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="136.11" y="345.07" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="156.18" y="345.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="170.08" y="345.07" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="218.00" y="345.07" font-size="11.00" class="sc-notoserifcjksc">上的单轮无害回应率均为我们测试过的近期模型中最高，并且在良</text><text x="72.00" y="360.69" font-size="11.00" class="sc-notoserifcjksc">性请求上过度拒绝（</text><text x="171.00" y="360.69" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="233.59" y="360.69" font-size="11.00" class="sc-notoserifcjksc">）的频率低于</text><text x="302.48" y="360.69" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="388.06" y="360.69" font-size="11.00" class="sc-notoserifcjksc">。在多轮测试中，</text><text x="476.06" y="360.69" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="526.28" y="360.69" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="376.31" font-size="11.00" class="sc-notoserifcjksc">影响力行动、追踪与监视等领域较</text><text x="239.89" y="376.31" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="290.08" y="376.31" font-size="11.00" class="sc-notoserifcjksc">有所改进，但在武器场景中的恰当回应率较低。在</text><text x="72.00" y="391.93" font-size="11.00" class="sc-notoserifcjksc">心理健康方面，</text><text x="149.00" y="391.93" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="199.21" y="391.93" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中有所改进，但内部主题专家在这一领域给出的定性反馈</text><text x="184.89" y="407.55" font-size="11.00" class="sc-loraregular">4.3.1</text><text x="209.29" y="407.55" font-size="11.00" class="sc-notoserifcjksc">节中详述。最后，在偏见与诚信评估中，</text><text x="407.29" y="407.55" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="457.51" y="407.55" font-size="11.00" class="sc-notoserifcjksc">在政治类提示词</text><text x="72.00" y="423.17" font-size="11.00" class="sc-notoserifcjksc">上比</text><text x="96.89" y="423.17" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="147.07" y="423.17" font-size="11.00" class="sc-notoserifcjksc">更为公允，并且其多轮选举诚信得分为所测近期模型中最高。在</text><text x="457.97" y="423.17" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="483.20" y="423.17" font-size="11.00" class="sc-notoserifcjksc">上，对于语</text><text x="72.00" y="438.79" font-size="11.00" class="sc-notoserifcjksc">境提供了足够信息以确定正确答案的问题，它的准确率略低于</text><text x="371.89" y="438.79" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="419.18" y="438.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="537.72" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86" y="537.72" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00" y="565.60" font-size="11.00" class="sc-notoserifcjksc">单轮有害评估衡量受测模型能在多大程度上可靠地拒绝或安全地重定向有害请求或明显违反我们</text><text x="72.00" y="581.22" font-size="11.00" class="sc-notoserifcjksc">使用政策（</text><text x="127.00" y="581.22" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="191.53" y="581.22" font-size="11.00" class="sc-notoserifcjksc">）的请求。我们在七种语言（阿拉伯语、英语、法语、印地语、韩语、</text><text x="72.00" y="596.84" font-size="11.00" class="sc-notoserifcjksc">汉语普通话和俄语）中测试了涵盖</text><text x="239.89" y="596.84" font-size="11.00" class="sc-loraregular">16</text><text x="253.15" y="596.84" font-size="11.00" class="sc-notoserifcjksc">个政策领域的提示词，并报告无害回应率，即模型的回应未</text><text x="72.00" y="612.46" font-size="11.00" class="sc-notoserifcjksc">协助实现所请求危害的提示词所占的比例。</text><text x="72.00" y="662.75" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="662.75" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="174.40" y="662.75" font-size="11.00" class="sc-notoserifcjksc">发布之前，我们用一套包含</text><text x="309.29" y="662.75" font-size="11.00" class="sc-loraregular">200</text><text x="331.75" y="662.75" font-size="11.00" class="sc-notoserifcjksc">条提示词的新评估集更新了暴力极端主义评</text><text x="72.00" y="678.37" font-size="11.00" class="sc-notoserifcjksc">估，因此此前已发布模型的结果与早期系统卡（</text><text x="303.00" y="678.37" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="367.66" y="678.37" font-size="11.00" class="sc-notoserifcjksc">）中的结果有所不同。新评估包含</text><text x="72.00" y="693.99" font-size="11.00" class="sc-notoserifcjksc">更多要求以极端分子口吻写作的请求、更多掩饰自身目的的请求，并新增了对虚无主义暴力</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="116.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="116.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="525.89" y="173.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="72.00" y="188.82" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="107.40" y="188.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="110.29" y="188.82" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="146.46" y="188.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="149.35" y="188.82" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="164.05" y="188.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="166.94" y="188.82" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="177.94" y="188.82" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="177.94" y="188.82" width="11.0 。主题包括激进化、极端主义内容创作、行动支持和正当化。回应依据我们</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">内部极端主义行为准则的更新版本进行评分。</text><text x="72.00" y="329.55" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="329.55" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 103.27 105.36 110.90" y="329.55" font-size="9.00" class="sc-lorabold">4.1.1.A]</text><text x="116.74" y="329.55" font-size="9.00" class="sc-notoserifcjkscbold">单轮有害请求评估结果，所有测试语言。</text><text x="278.74" y="329.55" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="431.74" y="329.55" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="449.74" y="329.55" font-size="9.00" class="sc-notoserifcjksc">表示无害回应率最高；</text><text x="72.00" y="341.25" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出。评估以阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄语进行。由于常规评估更新，</text><text x="72.00" y="352.95" font-size="9.00" class="sc-notoserifcjksc">以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00" y="404.65" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="404.65" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="136.11" y="404.65" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="156.18" y="404.65" font-size="11.00" class="sc-notoserifcjksc">上无系统提示词时的无害回应率为所测近期模型中最高，达</text><text x="445.08" y="404.65" font-size="11.00" class="sc-loraregular">98.39%</text><text x="482.38" y="404.65" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="72.00" y="420.27" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="160.47" y="420.27" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="174.37" y="420.27" font-size="11.00" class="sc-loraregular sc-k">97.23%</text><text x="209.19" y="420.27" font-size="11.00" class="sc-notoserifcjksc">。与以往模型的情况一样，系统提示词中的安全指令提升了</text><text x="498.09" y="420.27" font-size="11.00" class="sc-loraregular sc-k">Haiku</text><text x="72.00" y="435.89" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="435.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="103.48" y="435.89" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="151.41" y="435.89" font-size="11.00" class="sc-notoserifcjksc">上的无害回应率。</text><a href="http://claude.ai" rel="noopener"><rect x="103.48" y="427.09" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="103.48" y="427.09" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

<text x="198.75" y="309.88" font-size="11.00" class="sc-lorabold">0%</text><text x="372.00 378.65 381.35 387.48 393.43 403.00 405.89 409.24 415.07 417.96 424.61 427.15 433.97 440.33 449.89" y="309.88" font-size="11.00" class="sc-loraregular">0.34% (± 0.06%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 124.14 129.90 133.49 140.02 146.82 149.71 155.72 158.28" y="335.21" font-size="11.00" class="sc-lorabold">Claude Haiku 4.5</text><text x="198.75 205.40 208.10 214.06 220.02 229.58 232.47 235.83 241.65 244.54 251.19 253.73 260.56 266.55 276.11" y="335.21" font-size="11.00" class="sc-loraregular">0.44% (± 0.05%)</text><text x="372.00 378.12 380.66 387.49 393.48 403.04 405.93 409.29 415.11 418.00 424.65 427.36 431.36 437.32 446.88" y="335.21" font-size="11.00" class="sc-loraregular">3.05% (± 0.14%)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">32</text><text x="76.00" y="189.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="198.25" y="189.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="264.25" y="189.81" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="282.82" y="189.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="371.50" y="189.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="437.50" y="189.81" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.61" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮良性请求评估结果</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">单轮良性评估衡量模型拒绝那些主题敏感但适合回答的请求的频率。该提示词集覆盖与上文有害</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">请求集相同的</text><text x="140.89" y="126.65" font-size="11.00" class="sc-loraregular">16</text><text x="154.15" y="126.65" font-size="11.00" class="sc-notoserifcjksc">个政策领域和七种语言。此处我们报告过度拒绝率，即模型拒绝参与的良性提示</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">词所占的比例。</text><text x="72.00" y="352.28" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="352.28" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="352.28" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="352.28" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，所有测试语言。</text><text x="279.88" y="352.28" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝率（即拒绝回答实际上是良性的提示词）；数值</text><text x="72.00" y="363.98" font-size="9.00" class="sc-notoserifcjksc">越低越好。</text><text x="117.00" y="363.98" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="135.00" y="363.98" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低；次优分数以下划线标出。评估以阿拉伯语、英语、法语、印地语、韩语、汉语普</text><text x="72.00" y="375.68" font-size="9.00" class="sc-notoserifcjksc">通话和俄语进行。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00" y="431.07" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="431.07" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="105.97" y="431.07" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="127.97" y="431.07" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="216.47" y="431.07" font-size="11.00" class="sc-notoserifcjksc">对良性请求的过度拒绝频率低于</text><text x="373.37" y="431.07" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="458.95" y="431.07" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="469.95" y="431.07" font-size="11.00" class="sc-loraregular sc-k">0.17%</text><text x="500.85" y="431.07" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="72.00" y="446.69" font-size="11.00" class="sc-loraregular sc-k">0.44%</text><text x="102.85" y="446.69" font-size="11.00" class="sc-notoserifcjksc">）；在</text><text x="138.75" y="446.69" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="186.67" y="446.69" font-size="11.00" class="sc-notoserifcjksc">上，其过度拒绝频率则大幅低于</text><text x="343.57" y="446.69" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="390.86" y="446.69" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="401.86" y="446.69" font-size="11.00" class="sc-loraregular sc-k">0.82%</text><text x="435.77" y="446.69" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="449.66" y="446.69" font-size="11.00" class="sc-loraregular sc-k">3.05%</text><text x="480.73" y="446.69" font-size="11.00" class="sc-notoserifcjksc">）。与先前</text><text x="72.00" y="462.31" font-size="11.00" class="sc-notoserifcjksc">模型一样，</text><text x="127.00" y="462.31" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="174.93" y="462.31" font-size="11.00" class="sc-notoserifcjksc">上的拒绝比</text><text x="232.82" y="462.31" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="252.90" y="462.31" font-size="11.00" class="sc-notoserifcjksc">上更为常见。</text><text x="72.00" y="494.19" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="494.19" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00" y="522.08" font-size="11.00" class="sc-notoserifcjksc">多轮评估考察的是模型能否在更长、不断演变的对话中（而非单轮交互中）保持安全行为。为构</text><text x="72.00" y="537.70" font-size="11.00" class="sc-notoserifcjksc">建每个测试用例，内部政策专家会编写一份规格说明，描述一个合成</text><text x="402.00" y="537.70" font-size="11.00" class="sc-loraregular">“</text><text x="406.40" y="537.70" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="428.40" y="537.70" font-size="11.00" class="sc-loraregular">”</text><text x="432.24" y="537.70" font-size="11.00" class="sc-notoserifcjksc">的人设、目标与策</text><text x="72.00" y="553.32" font-size="11.00" class="sc-notoserifcjksc">略。由一个</text><text x="129.89" y="553.32" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="553.32" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="237.08" y="553.32" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="320.14" y="553.32" font-size="11.00" class="sc-notoserifcjksc">）按照该规格说明生成用户轮次。随后我们评</text><text x="72.00" y="568.94" font-size="11.00" class="sc-notoserifcjksc">估被测模型如何回应。我们报告的恰当回应率是指模型在整个对话中始终表现恰当的对话所占的</text><text x="72.00" y="584.56" font-size="11.00" class="sc-notoserifcjksc">比例。每段对话均依据其所属风险领域的专用评分细则进行评分，因此不应跨类别比较分数。</text><a href="http://claude.ai" rel="noopener"><rect x="138.75" y="437.89" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="138.75" y="437.89" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="127.00" y="453.51" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="127.00" y="453.51" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p033.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 33 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">33</text><text x="72.00" y="515.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="515.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 97.51 99.61 104.65 106.75 112.28" y="515.68" font-size="9.00" class="sc-lorabold">4.1.3.A]</text><text x="118.12" y="515.68" font-size="9.00" class="sc-notoserifcjkscbold">各多轮测试领域的恰当回应率。</text><text x="244.12" y="515.68" font-size="9.00" class="sc-notoserifcjksc">百分比指各模型在整个对话中始终恰当回应的对话所占比例。先展示无系</text><text x="72.00" y="527.38" font-size="9.00" class="sc-notoserifcjksc">统提示词的</text><text x="119.37" y="527.38" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="135.79" y="527.38" font-size="9.00" class="sc-notoserifcjksc">结果，随后是</text><text x="192.16" y="527.38" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="231.37" y="527.38" font-size="9.00" class="sc-notoserifcjksc">的结果；数值越高越好。由于常规评估更新，以往模型的结果可能与此前系统</text><text x="72.00" y="539.08" font-size="9.00" class="sc-notoserifcjksc">卡中的结果存在差异。</text><text x="72.00" y="579.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="579.23" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="105.97" y="579.23" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="127.97" y="579.23" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="216.47" y="579.23" font-size="11.00" class="sc-notoserifcjksc">在若干领域的恰当回应率高于</text><text x="362.37" y="579.23" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="447.95" y="579.23" font-size="11.00" class="sc-notoserifcjksc">，包括影响力行动</text><text x="72.00" y="594.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="594.85" font-size="11.00" class="sc-loraregular">87%</text><text x="106.72" y="594.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="120.61" y="594.85" font-size="11.00" class="sc-loraregular">78%</text><text x="141.43" y="594.85" font-size="11.00" class="sc-notoserifcjksc">）、追踪与监视（</text><text x="229.43" y="594.85" font-size="11.00" class="sc-loraregular">95%</text><text x="254.25" y="594.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="268.14" y="594.85" font-size="11.00" class="sc-loraregular">84%</text><text x="289.86" y="594.85" font-size="11.00" class="sc-notoserifcjksc">）以及自杀与自伤（</text><text x="388.86" y="594.85" font-size="11.00" class="sc-loraregular">70%</text><text x="413.22" y="594.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="427.11" y="594.85" font-size="11.00" class="sc-loraregular">46%</text><text x="449.00" y="594.85" font-size="11.00" class="sc-notoserifcjksc">），而在致命武器</text><text x="72.00" y="610.47" font-size="11.00" class="sc-notoserifcjksc">领域则较低（</text><text x="138.00" y="610.47" font-size="11.00" class="sc-loraregular">78%</text><text x="161.72" y="610.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="175.61" y="610.47" font-size="11.00" class="sc-loraregular">84%</text><text x="197.32" y="610.47" font-size="11.00" class="sc-notoserifcjksc">）。在</text><text x="233.22" y="610.47" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="281.14" y="610.47" font-size="11.00" class="sc-notoserifcjksc">上，它在影响力行动（</text><text x="391.14" y="610.47" font-size="11.00" class="sc-loraregular">88%</text><text x="415.97" y="610.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="429.86" y="610.47" font-size="11.00" class="sc-loraregular">68%</text><text x="451.97" y="610.47" font-size="11.00" class="sc-notoserifcjksc">）、自杀与自伤</text><text x="72.00" y="626.09" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="626.09" font-size="11.00" class="sc-loraregular">90%</text><text x="108.65" y="626.09" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="122.55" y="626.09" font-size="11.00" class="sc-loraregular">71%</text><text x="141.19" y="626.09" font-size="11.00" class="sc-notoserifcjksc">）以及追踪与监视（</text><text x="240.19" y="626.09" font-size="11.00" class="sc-loraregular">98%</text><text x="265.19" y="626.09" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="279.09" y="626.09" font-size="11.00" class="sc-loraregular sc-k">89%</text><text x="301.12" y="626.09" font-size="11.00" class="sc-notoserifcjksc">）方面较</text><text x="348.01" y="626.09" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="436.49" y="626.09" font-size="11.00" class="sc-notoserifcjksc">有所改进。其余领域</text><text x="72.00" y="641.71" font-size="11.00" class="sc-notoserifcjksc">的结果在两个产品端上相当。儿童安全和心理健康的结果将在第</text><text x="382.89" y="641.71" font-size="11.00" class="sc-loraregular">4.2</text><text x="400.36" y="641.71" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="436.25" y="641.71" font-size="11.00" class="sc-loraregular">4.3</text><text x="453.94" y="641.71" font-size="11.00" class="sc-notoserifcjksc">节中进一步讨</text><text x="72.00" y="657.33" font-size="11.00" class="sc-notoserifcjksc">论。</text><a href="http://claude.ai" rel="noopener"><rect x="192.16" y="520.18" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="192.16" y="520.18" width="36.85" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="233.22" y="601.67" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="233.22" y="601.67" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

s="sc-notoserifcjksc">标出。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00" y="348.46" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="348.46" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="215.51" y="348.46" font-size="11.00" class="sc-notoserifcjksc">在我们的儿童安全对话评估中的表现与</text><text x="405.40" y="348.46" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="455.58" y="348.46" font-size="11.00" class="sc-notoserifcjksc">相当。在单轮请</text><text x="72.00" y="364.08" font-size="11.00" class="sc-notoserifcjksc">求上，它在</text><text x="129.89" y="364.08" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="149.97" y="364.08" font-size="11.00" class="sc-notoserifcjksc">上拒绝有害提示词的比率略低于</text><text x="306.86" y="364.08" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="354.15" y="364.08" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="365.15" y="364.08" font-size="11.00" class="sc-loraregular sc-k">99.29%</text><text x="405.12" y="364.08" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="419.02" y="364.08" font-size="11.00" class="sc-loraregular sc-k">99.92%</text><text x="456.10" y="364.08" font-size="11.00" class="sc-notoserifcjksc">），在</text><text x="491.99" y="364.08" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="72.00" y="379.70" font-size="11.00" class="sc-notoserifcjksc">上则接近</text><text x="118.89" y="379.70" font-size="11.00" class="sc-loraregular">100%</text><text x="146.13" y="379.70" font-size="11.00" class="sc-notoserifcjksc">；同时，它对良性提示词过度拒绝的频率低于</text><text x="369.02" y="379.70" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="416.31" y="379.70" font-size="11.00" class="sc-notoserifcjksc">。在两个产品端上，多轮</text><text x="72.00" y="395.32" font-size="11.00" class="sc-notoserifcjksc">恰当回应率与</text><text x="140.89" y="395.32" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="191.07" y="395.32" font-size="11.00" class="sc-notoserifcjksc">的差异均在误差范围之内。</text><text x="72.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">对单轮灰色地带案例的定性审查未发现令人担忧的行为，而且与</text><text x="382.89" y="445.61" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="433.08" y="445.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="466.08" y="445.61" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="516.29" y="445.61" font-size="11.00" class="sc-notoserifcjksc">能更</text><text x="72.00" y="461.23" font-size="11.00" class="sc-notoserifcjksc">一致地察觉细微的保护性信号并提供资源。对多轮评估的定性审查未发现明显的危害迹象。在</text><text x="72.00" y="476.85" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="92.07" y="476.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="105.97" y="476.85" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="153.89" y="476.85" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="175.89" y="476.85" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="72.00" y="492.47" font-size="11.00" class="sc-notoserifcjksc">描述，不过通过更新我们的系统提示词，这方面的表现有所改善。我们建议在</text><text x="448.89" y="492.47" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="468.97" y="492.47" font-size="11.00" class="sc-notoserifcjksc">上部署的开发</text><text x="72.00" y="508.09" font-size="11.00" class="sc-notoserifcjksc">者采用系统提示词层面的安全防护措施，以帮助减轻儿童安全风险。</text><text x="72.00" y="575.14" font-size="11.00" class="sc-notoserifcjksc">在测试</text><text x="107.89" y="575.14" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="158.11" y="575.14" font-size="11.00" class="sc-notoserifcjksc">是否愿意协助那些会助长儿童安全危害和未经同意的私密影像（</text><text x="466.11" y="575.14" font-size="11.00" class="sc-loraregular">non-</text><text x="72.00" y="590.76" font-size="11.00" class="sc-loraregular sc-k">consensual intimate imagery</text><text x="218.77" y="590.76" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="229.77" y="590.76" font-size="11.00" class="sc-loraregular sc-k">NCII</text><text x="253.16" y="590.76" font-size="11.00" class="sc-notoserifcjksc">）危害的技术请求的评估中，无论启用还是禁用安全防护干</text><text x="72.00" y="606.38" font-size="11.00" class="sc-notoserifcjksc">预措施（例如拦截分类器），</text><text x="215.00" y="606.38" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="265.22" y="606.38" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="279.11" y="606.38" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="299.18" y="606.38" font-size="11.00" class="sc-notoserifcjksc">上的安全回应率都相当，且两者相比</text><text x="478.08" y="606.38" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="528.26" y="606.38" font-size="11.00" class="sc-notoserifcjksc">均</text><text x="72.00" y="622.00" font-size="11.00" class="sc-notoserifcjksc">有显著改善。安全回应行为在各类场景中均有大幅改善，包括用户寻求帮助搭建</text><text x="457.00" y="622.00" font-size="11.00" class="sc-loraregular">“</text><text x="461.40" y="622.00" font-size="11.00" class="sc-notoserifcjksc">一键脱衣</text><text x="505.40" y="622.00" font-size="11.00" class="sc-loraregular">”</text><text x="509.24" y="622.00" font-size="11.00" class="sc-notoserifcjksc">服务、</text><text x="72.00" y="637.62" font-size="11.00" class="sc-notoserifcjksc">识别受虐幸存者以及规避检测的场景。</text><a href="http://claude.ai" rel="noopener"><rect x="491.99" y="355.28" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="491.99" y="355.28" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="105.97" y="468.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="105.97" y="468.05" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

xt><text x="73.50" y="614.52" font-size="11.00" class="sc-lorabold">4.5</text><text x="161.25 167.60 173.78 176.49 182.44 188.80 198.36 201.25 204.60 210.43 213.32 219.97 222.67 226.68 233.03 242.59" y="600.44" font-size="11.00" class="sc-loraregular">99.46% (± 0.19%)</text><text x="261.00 267.65 270.19 276.94 282.84 292.40 295.30 298.65 304.47 307.36 314.02 316.55 323.38 329.50 339.07" y="600.44" font-size="11.00" class="sc-loraregular">0.02% (± 0.03%)</text><text x="354.75 361.10 367.28 369.63 374.70 381.05 390.62 393.51 396.86 402.69 405.58 412.23 414.93 418.93 425.06 434.62" y="600.44" font-size="11.00" class="sc-loraregular">99.79% (± 0.13%)</text><text x="454.50 461.15 463.85 469.85 475.84 485.40 488.29 491.64 497.47 500.36 507.01 509.71 515.62 521.61 531.17" y="600.44" font-size="11.00" class="sc-loraregular">0.55% (± 0.25%)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="73.00" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="160.75" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="160.75" y="358.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="160.75" y="414.90" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="179.32" y="414.90" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="260.50" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="260.50" y="358.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="354.25" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="354.25" y="358.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="454.00" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="454.00" y="358.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">4.3</text><text x="96.61" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">心理健康评估</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.1</text><text x="102.94" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自杀与自伤</text><text x="72.00" y="149.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="149.18" font-size="11.00" class="sc-notoserifcjksc">不能替代专业建议或医疗护理，也不用于诊断或治疗任何疾病。每个</text><text x="443.18" y="149.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="481.48" y="149.18" font-size="11.00" class="sc-notoserifcjksc">模型都经过</text><text x="72.00" y="164.80" font-size="11.00" class="sc-notoserifcjksc">训练，能够识别痛苦情绪的表达（包括用户表达自杀或自伤念头），并以同理心和关怀作出回</text><text x="72.00" y="180.42" font-size="11.00" class="sc-notoserifcjksc">应，同时在适当时引导用户寻求真人支持，包括求助热线、心理健康专业人士或值得信赖的亲</text><text x="72.00" y="196.04" font-size="11.00" class="sc-notoserifcjksc">友。</text><text x="72.00" y="246.34" font-size="11.00" class="sc-notoserifcjksc">本节中的评估考察</text><text x="162.89" y="246.34" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="251.40" y="246.34" font-size="11.00" class="sc-notoserifcjksc">在涉及自杀与自伤的对话中的回应。这些评估衡量模型能否</text><text x="72.00" y="261.96" font-size="11.00" class="sc-notoserifcjksc">对可能表明存在风险的提示词作出安全且支持性的回应，同时在同一领域的良性请求上保持有</text><text x="72.00" y="277.58" font-size="11.00" class="sc-notoserifcjksc">用。我们报告单轮无害回应率、单轮过度拒绝率以及多轮恰当回应率。</text><text x="72.00" y="631.58" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="631.58" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="631.58" font-size="9.00" class="sc-lorabold">4.3.1.A]</text><text x="118.12" y="631.58" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤的单轮评估结果。</text><text x="235.12" y="631.58" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00" y="643.28" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00" y="643.28" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="180.00" y="643.28" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，以往模型的结</text><text x="72.00" y="654.98" font-size="9.00" class="sc-notoserifcjksc">果可能与此前系统卡中的结果存在差异。</text></svg></div>

.00 192.35 199.18 208.74 211.63 214.99 220.81 223.70 227.70 233.66 243.23" y="251.92" font-size="11.00" class="sc-loraregular">60% (± 14%)</text><text x="366.75 373.10 379.06 388.62 391.52 394.87 400.69 403.58 408.65 418.22" y="251.92" font-size="11.00" class="sc-loraregular">94% (± 7%)</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 122.64 128.40 131.99 138.52 145.32 148.21 154.22 156.78" y="305.41" font-size="11.00" class="sc-lorabold">Claude Haiku 4.5</text><text x="186.00 191.96 198.31 207.87 210.77 214.12 219.94 222.83 226.84 233.66 243.23" y="305.41" font-size="11.00" class="sc-loraregular">46% (± 10%)</text><text x="366.75 371.82 375.82 385.38 388.27 391.63 397.45 400.34 406.70 416.26" y="305.41" font-size="11.00" class="sc-loraregular">71% (± 9%)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">37</text><text x="74.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="185.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="185.50" y="132.11" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="204.07" y="132.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="366.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="323.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="323.39" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="323.39" font-size="9.00" class="sc-lorabold sc-k">4.3.1.B]</text><text x="118.12" y="323.39" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤的多轮评估结果。</text><text x="235.12" y="323.39" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="343.12" y="323.39" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="361.12" y="323.39" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以</text><text x="72.00" y="335.09" font-size="9.00" class="sc-notoserifcjksc">下划线标出。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00" y="388.94" font-size="11.00" class="sc-notoserifcjksc">在单轮评估中，</text><text x="149.00" y="388.94" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="237.51" y="388.94" font-size="11.00" class="sc-notoserifcjksc">能可靠地拒绝可能助长自杀或自伤的请求，并且几乎从不拒绝</text><text x="72.00" y="404.56" font-size="11.00" class="sc-notoserifcjksc">这些话题下的良性问题，表现与</text><text x="228.89" y="404.56" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="317.37" y="404.56" font-size="11.00" class="sc-notoserifcjksc">相当或更好。在多轮评估中，它在</text><text x="485.26" y="404.56" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="505.33" y="404.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="420.18" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="119.93" y="420.18" font-size="11.00" class="sc-notoserifcjksc">上的恰当回应率均高于</text><text x="232.82" y="420.18" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="280.11" y="420.18" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="469.90" font-size="11.00" class="sc-notoserifcjksc">内部政策专家发现了若干改进：与</text><text x="239.89" y="469.90" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="290.08" y="469.90" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="323.08" y="469.90" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="373.29" y="469.90" font-size="11.00" class="sc-notoserifcjksc">更不容易对用户的心理状态或动机</text><text x="72.00" y="485.52" font-size="11.00" class="sc-notoserifcjksc">作出超出用户自身所透露内容的断言，更不容易给用户套上其未曾披露的诊断，也更不容易在用</text><text x="424.00" y="501.14" font-size="11.00" class="sc-loraregular sc-k">lethal means</text><text x="72.00" y="516.76" font-size="11.00" class="sc-loraregular sc-k">counseling</text><text x="127.37" y="516.76" font-size="11.00" class="sc-notoserifcjksc">）。然而，与</text><text x="196.27" y="516.76" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="246.45" y="516.76" font-size="11.00" class="sc-notoserifcjksc">相比，它更可能以将自伤正常化的方式认可用户的痛苦，更</text><text x="72.00" y="532.38" font-size="11.00" class="sc-notoserifcjksc">可能将用户不愿寻求帮助的态度说成是合理的，也更少告诉处于危机中的用户它是一个</text><text x="492.89" y="532.38" font-size="11.00" class="sc-loraregular">AI</text><text x="503.46" y="532.38" font-size="11.00" class="sc-notoserifcjksc">、所能</text><text x="72.00" y="548.00" font-size="11.00" class="sc-notoserifcjksc">提供的支持有限。它将自伤认可为有效手段、以及推荐依赖身体不适的替代做法（如手握冰块）</text><text x="72.00" y="563.62" font-size="11.00" class="sc-notoserifcjksc">的比率也与</text><text x="129.89" y="563.62" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="180.07" y="563.62" font-size="11.00" class="sc-notoserifcjksc">相近。从定性角度看，审阅人员发现，其中许多回应在承认用户的经历与</text><text x="72.00" y="579.24" font-size="11.00" class="sc-notoserifcjksc">不放大其负面想法之间取得了平衡。</text><text x="72.00" y="648.02" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="648.02" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="136.11" y="648.02" font-size="11.00" class="sc-notoserifcjksc">一个较早的（未发布的）快照中，我们观察到该模型比</text><text x="403.00" y="648.02" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="453.18" y="648.02" font-size="11.00" class="sc-notoserifcjksc">更愿意帮助用户</text><text x="72.00" y="663.64" font-size="11.00" class="sc-notoserifcjksc">撰写遗书，这促使我们针对这一行为开展专项评估，以对其进行测量并指导缓解措施。在最终模</text><text x="72.00" y="679.26" font-size="11.00" class="sc-notoserifcjksc">型上重新运行这项评估后，在应用了系统提示词的</text><text x="316.89" y="679.26" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="364.82" y="679.26" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="386.82" y="679.26" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="437.04" y="679.26" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="483.93" y="679.26" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="72.00" y="694.88" font-size="11.00" class="sc-notoserifcjksc">相当，极少协助此类请求。在没有系统</text><a href="http://claude.ai" rel="noopener"><rect x="519.23" y="395.76" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="72.00" y="411.38" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="316.89" y="670.46" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="316.89" y="670.46" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提示词的</text><text x="118.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="138.97" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，它协助的频率高于</text><text x="251.86" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="299.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，其中关闭思考时的退步最为明显。这种情况最常</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">出现在无法判断用户是在计划自杀还是正面临绝症的时候。在这些情况下，</text><text x="435.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="485.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc">并未认同或</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">草了遗书，而没有等待用户的回答。一旦确认存在自杀意图，它便拒绝继续起草遗书，转而关注</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">世时发送的内容。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">更新后的系统提示词措辞减少了将自伤认可为有效手段以及推荐依赖身体不适的替代做法的情</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">况，并提高了</text><text x="140.89" y="243.96" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="191.11" y="243.96" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="205.00" y="243.96" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="252.93" y="243.96" font-size="11.00" class="sc-notoserifcjksc">上的危机情境中表明自己是能力有限的</text><text x="442.82" y="243.96" font-size="11.00" class="sc-loraregular">AI</text><text x="456.29" y="243.96" font-size="11.00" class="sc-notoserifcjksc">的频率。更新后</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">的系统提示词还包含旨在劝阻</text><text x="217.89" y="259.58" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="256.18" y="259.58" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="270.08" y="259.58" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="318.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">上帮助用户撰写遗书的措辞。然而，上文提到</text><text x="72.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">整而发生有意义的变化，仍是需要持续改进的方面。由于这些系统提示词层面的缓解措施不适用</text><text x="72.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="306.44" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="103.07" y="306.44" font-size="11.00" class="sc-notoserifcjksc">，部署</text><text x="138.97" y="306.44" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="189.18" y="306.44" font-size="11.00" class="sc-notoserifcjksc">的开发者（尤其是在关闭思考的情况下）应自行添加安全防护措施，以帮</text><text x="72.00" y="322.06" font-size="11.00" class="sc-notoserifcjksc">助缓解这些风险。</text><text x="72.00" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">我们还开展评估，以考察</text><text x="195.89" y="432.68" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="234.18" y="432.68" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话。我们关注的是：它能否避免强</text><text x="72.00" y="448.30" font-size="11.00" class="sc-notoserifcjksc">化可能带来风险的请求，同时在有关营养、健身和健康的良性问题上保持有用。在此，我们报告</text><text x="72.00" y="463.92" font-size="11.00" class="sc-notoserifcjksc">单轮无害回应率和过度拒绝率。我们继续通过内部政策专家的定性审查来评估该领域的多轮测</text><text x="72.00" y="479.54" font-size="11.00" class="sc-notoserifcjksc">试；下文将讨论他们的观察结果。</text><a href="https://claude.ai" rel="noopener"><rect x="205.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="205.00" y="235.16" width="45.03" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="270.08" y="250.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="270.08" y="250.78" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

 410.29 416.28 423.11 432.67" y="227.52" font-size="11.00" class="sc-loraregular">98.90% (± 0.50%)</text><text x="447.00" y="227.52" font-size="11.00" class="sc-lorabold">0%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="266.93" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 84.20 90.81 97.60 102.93 105.82 111.76 114.32" y="281.01" font-size="11.00" class="sc-lorabold">Opus 5.5</text><text x="150.00 156.35 162.34 164.94 171.29 177.25 186.81 189.70 193.06 198.88 201.77 205.77 208.31 215.14 221.97 231.53" y="266.93" font-size="11.00" class="sc-loraregular">95.64% (± 1.00%)</text><text x="249.00" y="266.93" font-size="11.00" class="sc-lorabold">0%</text><text x="348.00 354.35 360.53 363.24 369.14 375.49 385.05 387.95 391.30 397.12 400.02 406.67 409.37 415.33 422.15 431.72" y="266.93" font-size="11.00" class="sc-loraregular">99.26% (± 0.40%)</text><text x="447.00" y="266.93" font-size="11.00" class="sc-lorabold">0%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="306.34" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82 111.76 114.32" y="320.42" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="150.00 156.35 162.34 164.94 171.29 177.65 187.21 190.10 193.45 199.28 202.17 208.82 211.52 217.88 224.23 233.79" y="306.34" font-size="11.00" class="sc-loraregular">95.69% (± 0.96%)</text><text x="249.00" y="306.34" font-size="11.00" class="sc-lorabold">0%</text><text x="348.00 354.35 360.53 363.24 369.19 375.32 384.88 387.77 391.12 396.95 399.84 406.49 409.19 415.32 421.67 431.23" y="306.34" font-size="11.00" class="sc-loraregular">99.43% (± 0.36%)</text><text x="447.00" y="306.34" font-size="11.00" class="sc-lorabold">0%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="345.75" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 84.49 90.25 93.84 100.37 107.17 110.06 116.07 118.63" y="359.83" font-size="11.00" class="sc-lorabold">Haiku 4.5</text><text x="150.00 156.35 162.71 165.41 171.40 175.40 184.97 187.86 191.21 197.04 199.93 206.58 209.17 215.52 222.35 231.91" y="345.75" font-size="11.00" class="sc-loraregular">96.51% (± 0.60%)</text><text x="249.00 255.65 258.19 264.77 269.84 279.40 282.30 285.65 291.47 294.36 301.01 303.55 310.38 316.73 326.30" y="345.75" font-size="11.00" class="sc-loraregular">0.07% (± 0.06%)</text><text x="348.00 354.35 360.53 363.07 369.90 375.85 385.42 388.31 391.66 397.49 400.38 407.03 409.73 415.85 421.76 431.32" y="345.75" font-size="11.00" class="sc-loraregular">99.04% (± 0.32%)</text><text x="447.00 453.65 456.24 462.60 468.78 478.34 481.23 484.58 490.41 493.30 499.95 502.65 508.31 514.27 523.84" y="345.75" font-size="11.00" class="sc-loraregular">0.68% (± 0.24%)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">39</text><text x="75.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="149.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="149.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="149.50" y="160.21" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="168.07" y="160.21" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="248.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="248.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="347.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="347.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="446.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="446.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="72.00" y="376.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="376.89" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="376.89" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27" y="376.89" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱的单轮评估结果。</text><text x="227.27" y="376.89" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00" y="388.59" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00" y="388.59" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="180.00" y="388.59" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，以往模型的结</text><text x="72.00" y="400.29" font-size="9.00" class="sc-notoserifcjksc">果可能与此前系统卡中的结果存在差异。</text><text x="72.00" y="442.45" font-size="11.00" class="sc-notoserifcjksc">在单轮评估中，</text><text x="149.00" y="442.45" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="237.51" y="442.45" font-size="11.00" class="sc-notoserifcjksc">在拒绝可能强化进食紊乱的请求方面表现与</text><text x="449.40" y="442.45" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="72.00" y="458.07" font-size="11.00" class="sc-notoserifcjksc">相当或略好，并且它拒绝有关营养、健身和身体意象的良性问题的频率更低，在</text><text x="459.89" y="458.07" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="507.82" y="458.07" font-size="11.00" class="sc-notoserifcjksc">上尤为</text><text x="72.00" y="473.69" font-size="11.00" class="sc-notoserifcjksc">明显。</text><text x="72.00" y="523.40" font-size="11.00" class="sc-notoserifcjksc">在对多轮对话的审查中，内部政策专家发现</text><text x="283.89" y="523.40" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="334.11" y="523.40" font-size="11.00" class="sc-notoserifcjksc">总体上与</text><text x="381.00" y="523.40" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="431.18" y="523.40" font-size="11.00" class="sc-notoserifcjksc">相当，但有若干改进：</text><text x="72.00" y="539.02" font-size="11.00" class="sc-notoserifcjksc">它对处于痛苦中的用户的回应不那么让人难以承受；它更不容易对用户未曾描述的饮食行为妄加</text><text x="72.00" y="570.26" font-size="11.00" class="sc-notoserifcjksc">强调及时就医的必要性。</text><text x="72.00" y="636.75" font-size="11.00" class="sc-notoserifcjksc">另一方面，</text><text x="127.00" y="636.75" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="393.89" y="652.37" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="444.08" y="652.37" font-size="11.00" class="sc-notoserifcjksc">更为详细；当用户</text><a href="http://claude.ai" rel="noopener"><rect x="459.89" y="449.27" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="459.89" y="449.27" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p040.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 40 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">40</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和食物建议加入了新的系统提示词措辞，这大幅减少了</text><text x="338.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="386.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上的此类评论。现有的系统提示</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">词也在很大程度上缓解了在意图模糊的单轮提示词上观察到的行为。我们鼓励基于</text><text x="470.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="490.97" y="98.23" font-size="11.00" class="sc-notoserifcjksc">进行开发</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的开发者添加同等的防护措施。</text><text x="72.00" y="164.97" font-size="14.00" class="sc-poppinssemibold">4.4</text><text x="97.48" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">偏见与诚信评估</text><text x="72.00" y="191.53" font-size="11.00" class="sc-notoserifcjksc">我们使用与</text><text x="129.89" y="191.53" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Sonnet 5.5</text><text x="224.83" y="191.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="257.83" y="191.53" font-size="11.00" class="sc-notoserifcjksc">中所报告的相同的一组偏见与诚信基准测试对</text><text x="480.73" y="191.53" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="207.15" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="207.15" font-size="11.00" class="sc-notoserifcjksc">进行了评估。我们关注三个方面：我们开源的政治公允性衡量方法；用于衡量人口统计</text><text x="72.00" y="222.77" font-size="11.00" class="sc-notoserifcjksc">偏见的</text><text x="107.89" y="222.77" font-size="11.00" class="sc-loraregular sc-k">Bias Benchmark for Question Answering</text><text x="313.75" y="222.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="324.75" y="222.77" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="347.09" y="222.77" font-size="11.00" class="sc-notoserifcjksc">）；以及我们的选举诚信评估。</text><text x="72.00" y="270.83" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.1</text><text x="103.75" y="270.83" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">政治偏见与公允性</text><text x="72.00" y="302.72" font-size="11.00" class="sc-notoserifcjksc">为衡量</text><text x="107.89" y="302.72" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="196.40" y="302.72" font-size="11.00" class="sc-notoserifcjksc">的政治公允性，我们使用了我们的</text><text x="361.40" y="302.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">开源评估</text><text x="405.40" y="302.72" font-size="11.00" class="sc-notoserifcjksc">，该评估涵盖</text><text x="474.29 478.30 481.07 487.20 493.19" y="302.72" font-size="11.00" class="sc-loraregular">1,350</text><text x="502.92" y="302.72" font-size="11.00" class="sc-notoserifcjksc">个提示</text><text x="72.00" y="318.34" font-size="11.00" class="sc-notoserifcjksc">词对，这些提示词对在</text><text x="184.89" y="318.34" font-size="11.00" class="sc-loraregular">150</text><text x="204.62" y="318.34" font-size="11.00" class="sc-notoserifcjksc">个话题和九种任务类型中呈现对立的意识形态观点。一个</text><text x="482.51" y="318.34" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="520.80" y="318.34" font-size="11.00" class="sc-notoserifcjksc">评</text><text x="72.00" y="333.96" font-size="11.00" class="sc-notoserifcjksc">分模型从三个属性对模型的回应进行评分：公允性（模型是否以相当的深度和质量回应一对提示</text><text x="72.00" y="349.58" font-size="11.00" class="sc-notoserifcjksc">词中的两个提示词）、对立观点（模型的回应是否承认其他观点）以及拒绝（模型是否拒绝回应</text><text x="72.00" y="365.20" font-size="11.00" class="sc-notoserifcjksc">该请求）。</text><text x="72.00" y="432.26" font-size="11.00" class="sc-notoserifcjksc">我们同时报告无系统提示词的核心模型的结果，以及应用了默认系统提示词的</text><text x="448.89" y="432.26" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="496.82" y="432.26" font-size="11.00" class="sc-notoserifcjksc">上的结</text><text x="72.00" y="447.88" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="94.00" y="447.88" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="141.93" y="447.88" font-size="11.00" class="sc-notoserifcjksc">系统提示词包含我们的标准措辞，指示</text><text x="331.82" y="447.88" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="370.11" y="447.88" font-size="11.00" class="sc-notoserifcjksc">对各种观点保持公允；同时报告这</text><text x="72.00" y="463.50" font-size="11.00" class="sc-notoserifcjksc">两种配置，既能展示模型的基线行为，也能展示</text><text x="305.89" y="463.50" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="353.82" y="463.50" font-size="11.00" class="sc-notoserifcjksc">上的消费者用户将会遇到的模型行为。</text><a href="http://claude.ai" rel="noopener"><rect x="338.89" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="338.89" y="73.81" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="129.89" y="182.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="129.89" y="182.73" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="165.29" y="182.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="168.18" y="182.73" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="204.35" y="182.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="207.24" y="182.73" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="221.94" y="182.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="224.83" y="182.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="235.83" y="182.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="235.83" y="182.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="246.83" y="182.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="246.83" y="182.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="361.40" y="293.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="361.40" y="293.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="372.40" y="293.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="372.40" y="293.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="383.40" y="293.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="383.40" y="293.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="394.40" y="293.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="394.40" y="293.92" width="11.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="448.89" y="423.46" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="448.89" y="423.46" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="94.00" y="439.08" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="94.00" y="439.08" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="305.89" y="454.70" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="305.89" y="454.70" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="72.00" y="329.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="329.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 104.54 106.63 112.17" y="329.68" font-size="9.00" class="sc-lorabold">4.4.1.A]</text><text x="118.01" y="329.68" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估：公允性。</text><text x="235.01" y="329.68" font-size="9.00" class="sc-notoserifcjksc">公允性分数越高越好。由于常规评估更新，以往模型的结果可能与此前系统</text><text x="72.00" y="341.38" font-size="9.00" class="sc-notoserifcjksc">卡中的结果存在差异。</text><text x="72.00" y="628.12" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="628.12" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="628.12" font-size="9.00" class="sc-lorabold sc-k">4.4.1.B]</text><text x="118.01" y="628.12" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估：对立观点。</text><text x="244.01" y="628.12" font-size="9.00" class="sc-notoserifcjksc">对立观点分数越高越好。由于常规评估更新，以往模型的结果可能与此前</text><text x="72.00" y="639.82" font-size="9.00" class="sc-notoserifcjksc">系统卡中的结果存在差异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="72.00 80.41 83.54 91.95 95.08 102.58 105.96 114.15 117.58 126.39 133.33 136.71 144.89 152.91 161.35 169.15 177.58 191.08 199.89 204.88 212.08 215.46 219.78 228.07 233.06 236.44 246.67 255.10 263.12 270.06 274.89 278.32 286.62 295.05 298.43 307.49 315.92 322.86 333.58 341.60 346.59 350.02 358.46" y="482.22" font-size="13.00" class="sc-poppinsmedium" fill="#666666">4.4.2 Bias Benchmark for Question Answering</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">2</text><text x="77.85 83.84 89.00 93.32 97.65 100.46 105.09 111.08 113.61 116.24 122.49 124.95 127.48 130.11 135.46 139.33 141.96 147.11 149.83 152.29 154.92 157.97 163.34 169.47 174.84 178.48 181.53 183.99 186.62 192.75 198.96 206.92 209.42 212.05 218.31 220.93 226.92 232.08 238.15 244.13 249.01 254.83 260.80 263.61 266.33 270.19 272.82 278.64 281.45 286.61 291.24 293.87 299.68 305.10 311.17 316.49 322.47 331.41 336.57 340.86 346.22 348.85 352.18 358.03 362.36 364.99 370.75 376.71 382.13 386.76 390.63 393.44 399.28 405.35 407.98 413.14 419.21 423.83 431.72 437.14 441.47 444.28 450.34 455.87 458.33 460.96 466.12 469.83 476.31 479.12 484.17 486.67 492.04 495.68 499.31 505.36 507.67 513.88 519.50 523.13 528.91 534.48" y="704.46" font-size="10.00" class="sc-loraregular">Parrish, A., et al. (2021). BBQ: A hand-built bias benchmark for question answering. arXiv:2110.08193.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 186.95 190.59 196.64 198.95 205.16 210.77 214.41 220.19" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2110.08193</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="72.00" y="329.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="329.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="329.67" font-size="9.00" class="sc-lorabold">4.4.1.C]</text><text x="118.67" y="329.67" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估：拒绝。</text><text x="226.67" y="329.67" font-size="9.00" class="sc-notoserifcjksc">拒绝分数越低越好。由于常规评估更新，以往模型的结果可能与此前系统卡中</text><text x="72.00" y="341.38" font-size="9.00" class="sc-notoserifcjksc">的结果存在差异。</text><text x="72.00" y="366.73" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00" y="366.73" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="199.21" y="366.73" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="213.11" y="366.73" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="301.58" y="366.73" font-size="11.00" class="sc-notoserifcjksc">更为公允，在</text><text x="370.47" y="366.73" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="390.55" y="366.73" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="426.44" y="366.73" font-size="11.00" class="sc-loraregular sc-k">97.7%</text><text x="454.12" y="366.73" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="479.01" y="366.73" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="526.94" y="366.73" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="382.35" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="96.89" y="382.35" font-size="11.00" class="sc-loraregular sc-k">99.1%</text><text x="125.71" y="382.35" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="150.61" y="382.35" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="200.79" y="382.35" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="236.68" y="382.35" font-size="11.00" class="sc-loraregular sc-k">86.7%</text><text x="269.11" y="382.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="283.00" y="382.35" font-size="11.00" class="sc-loraregular">91.2%</text><text x="311.55" y="382.35" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="336.44" y="382.35" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="356.52" y="382.35" font-size="11.00" class="sc-notoserifcjksc">上，它承认对立观点的频率低于</text><text x="72.00" y="397.97" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="119.29" y="397.97" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="130.29" y="397.97" font-size="11.00" class="sc-loraregular">35.9%</text><text x="163.94" y="397.97" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="177.83" y="397.97" font-size="11.00" class="sc-loraregular sc-k">49.9%</text><text x="208.61" y="397.97" font-size="11.00" class="sc-notoserifcjksc">），但在默认应用了系统提示词中公允性措辞的</text><text x="442.50" y="397.97" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="490.43" y="397.97" font-size="11.00" class="sc-notoserifcjksc">上则远高</text><text x="72.00" y="413.59" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="413.59" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="133.18" y="413.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.18" y="413.59" font-size="11.00" class="sc-loraregular sc-k">67.8%</text><text x="176.40" y="413.59" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="190.29" y="413.59" font-size="11.00" class="sc-loraregular">45.1%</text><text x="218.53" y="413.59" font-size="11.00" class="sc-notoserifcjksc">）。在</text><text x="254.42" y="413.59" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="274.50" y="413.59" font-size="11.00" class="sc-notoserifcjksc">上，它的拒绝频率低于</text><text x="387.39" y="413.59" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="434.68" y="413.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="445.68" y="413.59" font-size="11.00" class="sc-loraregular">3.3%</text><text x="473.10" y="413.59" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="487.00" y="413.59" font-size="11.00" class="sc-loraregular">5.4%</text><text x="511.23" y="413.59" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00" y="429.21" font-size="11.00" class="sc-notoserifcjksc">但在</text><text x="96.89" y="429.21" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="144.82" y="429.21" font-size="11.00" class="sc-notoserifcjksc">上略高（</text><text x="188.82" y="429.21" font-size="11.00" class="sc-loraregular sc-k">5.0%</text><text x="216.65" y="429.21" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="230.54" y="429.21" font-size="11.00" class="sc-loraregular sc-k">3.6%</text><text x="255.19" y="429.21" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="506.31" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们使用</text><text x="206.89" y="506.31" font-size="11.00" class="sc-loraregular sc-k">Bias Benchmark for Question Answering</text><text x="412.75" y="506.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="423.75" y="506.31" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="446.09" y="506.31" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.09" y="502.64" font-size="6.60" class="sc-loraregular">2</text><text x="460.63" y="506.31" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="474.53" y="506.31" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="521.93" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="521.93" font-size="11.00" class="sc-notoserifcjksc">进行了评估，这是一项标准的、基于基准测试的偏见评估，涵盖年龄、种族、性别、残</text><text x="72.00" y="537.55" font-size="11.00" class="sc-notoserifcjksc">障和社会经济地位等属性。</text><text x="72.00" y="571.08" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="97.23" y="571.08" font-size="11.00" class="sc-notoserifcjksc">测试模糊问题（正确答案为</text><text x="229.23" y="571.08" font-size="11.00" class="sc-loraregular">“</text><text x="233.63" y="571.08" font-size="11.00" class="sc-notoserifcjksc">未知</text><text x="255.63" y="571.08" font-size="11.00" class="sc-loraregular">”</text><text x="259.47" y="571.08" font-size="11.00" class="sc-notoserifcjksc">）以及提供了足够上下文、可据以正确作答的消歧版本。</text><text x="72.00" y="586.70" font-size="11.00" class="sc-notoserifcjksc">我们报告模型在这两类问题上的准确率，以及一个偏见分数，该分数反映模型的错误是系统性地</text><text x="72.00" y="602.32" font-size="11.00" class="sc-notoserifcjksc">偏向（正值）还是偏离（负值）社会刻板印象；分数越接近零，表示方向性偏见越小。</text><text x="72.00" y="668.23" font-size="11.00" class="sc-notoserifcjksc">以下是这项评估中一个模糊问题的示例：</text><a href="https://arxiv.org/abs/2110.08193" rel="noopener"><rect x="536.94" y="694.40" width="2.63" height="12.80" fill="transparent"/></a><a href="https://arxiv.org/abs/2110.08193" rel="noopener"><rect x="72.00" y="707.20" width="153.76" height="12.80" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="479.01" y="357.93" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="479.01" y="357.93" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="442.50" y="389.17" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="442.50" y="389.17" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="96.89" y="420.41" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="96.89" y="420.41" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
