.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">6</text><text x="86.05" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">对齐评估</text><text x="72.00" y="124.20" font-size="14.00" class="sc-poppinssemibold">6.1</text><text x="93.00" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">引言与主要发现摘要</text><text x="72.00" y="161.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.1</text><text x="99.59" y="161.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="189.19" font-size="11.00" class="sc-notoserifcjksc">与推进前沿的模型相比，我们对</text><text x="228.89" y="189.19" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="317.40" y="189.19" font-size="11.00" class="sc-notoserifcjksc">进行的评估范围更窄，重点关注我们预计会随</text><text x="72.00" y="204.81" font-size="11.00" class="sc-notoserifcjksc">着模型能力提升而变得更加突出的风险，包括违背用户利益行事、误导用户以及配合高风险滥</text><text x="72.00" y="220.43" font-size="11.00" class="sc-notoserifcjksc">用。</text><text x="72.00" y="270.15" font-size="11.00" class="sc-notoserifcjksc">我们还评估了该模型可能削弱或干扰我们检查和监控其行为之能力的方式，包括主动掩盖不良行</text><text x="72.00" y="285.77" font-size="11.00" class="sc-notoserifcjksc">为的倾向、以难以监控的方式进行规划的能力，以及识别评估场景的能力。除了以未对齐</text><text x="72.00" y="301.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="301.39" font-size="11.00" class="sc-loraregular sc-k">misalignment</text><text x="152.17" y="301.39" font-size="11.00" class="sc-notoserifcjksc">）为主要关注点之外，我们还报告了关于</text><text x="353.06" y="301.39" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="403.28" y="301.39" font-size="11.00" class="sc-notoserifcjksc">的性格和积极特质的一些相</text><text x="72.00" y="317.01" font-size="11.00" class="sc-notoserifcjksc">关发现。</text><text x="72.00" y="367.30" font-size="11.00" class="sc-notoserifcjksc">我们在整个后训练过程中持续开展测试。评估包括静态行为评估、自动化交互式行为评估以及与</text><text x="72.00" y="382.92" font-size="11.00" class="sc-notoserifcjksc">未对齐相关的能力评估。我们还引入了一项新的评估，用于测试模型逃逸沙箱的倾向（第</text><text x="503.89" y="382.92" font-size="11.00" class="sc-loraregular">6.3.1</text><text x="72.00" y="398.54" font-size="11.00" class="sc-notoserifcjksc">节）。我们的测试主要聚焦于</text><text x="217.89" y="398.54" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="268.11" y="398.54" font-size="11.00" class="sc-notoserifcjksc">模型本身，使用了多种脚手架（</text><text x="422.11" y="398.54" font-size="11.00" class="sc-loraregular sc-k">scaffold</text><text x="462.20" y="398.54" font-size="11.00" class="sc-notoserifcjksc">）和系统提示词</text><text x="72.00" y="414.16" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="414.16" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="160.29" y="414.16" font-size="11.00" class="sc-notoserifcjksc">），而非特定的产品端，例如</text><text x="306.18" y="414.16" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="344.47" y="414.16" font-size="11.00" class="sc-notoserifcjksc">聊天界面、</text><text x="399.47" y="414.16" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="464.43" y="414.16" font-size="11.00" class="sc-notoserifcjksc">，或基于</text><text x="72.00" y="429.78" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="429.78" font-size="11.00" class="sc-notoserifcjksc">构建的众多第三方应用和工具。我们不重点关注由这些产品端或我们的安全防护措施的变</text><text x="72.00" y="445.40" font-size="11.00" class="sc-notoserifcjksc">化所导致的行为差异。</text><text x="72.00" y="513.02" font-size="11.00" class="sc-notoserifcjksc">我们力求尽量减少与我们的训练数据或训练过程的重叠，因为这种重叠可能会削弱这些评估的可</text><text x="72.00" y="528.64" font-size="11.00" class="sc-notoserifcjksc">靠性。除少数例外，此处展示的评估并不使用我们在训练中所用的相同工具、提示词或细粒度场</text><text x="72.00" y="544.26" font-size="11.00" class="sc-notoserifcjksc">景设计，而且其中许多评估涵盖了我们在训练中并未直接针对的现象。</text><text x="72.00" y="593.98" font-size="11.00" class="sc-notoserifcjksc">我们内部测试和评估的规模小于我们预期</text><text x="272.89" y="593.98" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="323.11" y="593.98" font-size="11.00" class="sc-notoserifcjksc">将进行的完整部署，因此，对于那些只会罕</text><text x="72.00" y="609.60" font-size="11.00" class="sc-notoserifcjksc">见出现或在难以预料的环境中才出现的行为，在机制可解释性没有进一步进展的情况下，我们将</text><text x="72.00" y="625.22" font-size="11.00" class="sc-notoserifcjksc">难以发现。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.2</text><text x="102.34" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">安全与对齐方面的关键发现</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计（</text><text x="204.00" y="111.03" font-size="11.00" class="sc-loraregular sc-k">automated behavioral audit</text><text x="344.04" y="111.03" font-size="11.00" class="sc-notoserifcjksc">）中，我们发现</text><text x="423.93" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="512.44" y="111.03" font-size="11.00" class="sc-notoserifcjksc">在大</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">多数对齐（</text><text x="127.00" y="126.65" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="178.15" y="126.65" font-size="11.00" class="sc-notoserifcjksc">）、抗滥用能力和诚实性指标上与</text><text x="346.04" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="434.52" y="126.65" font-size="11.00" class="sc-notoserifcjksc">持平或超过后者，而</text><text x="72.00" y="142.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="142.27" font-size="11.00" class="sc-notoserifcjksc">总体上仍然更强（第</text><text x="259.63" y="142.27" font-size="11.00" class="sc-loraregular">6.2</text><text x="277.49" y="142.27" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="175.81" font-size="11.00" class="sc-notoserifcjksc">不过，这些衡量手段存在局限：过往的评估并未完全捕捉到我们的模型所能做出的不当行为的潜</text><text x="72.00" y="191.43" font-size="11.00" class="sc-notoserifcjksc">在严重程度，而且</text><text x="162.89" y="191.43" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="213.11" y="191.43" font-size="11.00" class="sc-notoserifcjksc">有可能存在一种尚未被发现的倾向，会在我们尚未评估过的环境中</text><text x="72.00" y="207.05" font-size="11.00" class="sc-notoserifcjksc">做出不可接受的行为（第</text><text x="195.89" y="207.05" font-size="11.00" class="sc-loraregular">6.2.9</text><text x="222.82" y="207.05" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="256.76" font-size="11.00" class="sc-notoserifcjksc">尽管如此，这些证据在很大程度上让我们放心：</text><text x="303.00" y="256.76" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="353.22" y="256.76" font-size="11.00" class="sc-notoserifcjksc">在大多数对齐指标上相比</text><text x="477.11" y="256.76" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="272.38" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="122.18" y="272.38" font-size="11.00" class="sc-notoserifcjksc">有所改进，而且我们没有看到任何证据表明它存在会削弱我们</text><text x="422.08" y="272.38" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="449.89" y="272.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="463.79" y="272.38" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="472.86" y="272.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="72.00" y="288.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="83.00" y="288.00" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Risk Report</text><text x="141.78" y="288.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="152.78" y="288.00" font-size="11.00" class="sc-notoserifcjksc">中论证的那种连贯的未对齐目标。</text><text x="72.00" y="337.72" font-size="11.00" class="sc-notoserifcjksc">尽管在我们此处报告的大多数广泛的、由智能体驱动的滥用调查中，</text><text x="402.00" y="337.72" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="452.22" y="337.72" font-size="11.00" class="sc-notoserifcjksc">都比</text><text x="477.11" y="337.72" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="353.34" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="122.18" y="353.34" font-size="11.00" class="sc-notoserifcjksc">有所改进，但</text><text x="191.08" y="353.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="276.81" y="353.34" font-size="11.00" class="sc-notoserifcjksc">在其中若干项上严格更优，而且</text><text x="433.70" y="353.34" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="483.92" y="353.34" font-size="11.00" class="sc-notoserifcjksc">仍然表现出</text><text x="72.00" y="368.96" font-size="11.00" class="sc-notoserifcjksc">易被滥用的弱点（第</text><text x="173.89" y="368.96" font-size="11.00" class="sc-loraregular">6.2.1</text><text x="198.47" y="368.96" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="402.49" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计中，</text><text x="215.00" y="402.49" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="265.22" y="402.49" font-size="11.00" class="sc-notoserifcjksc">的过度拒绝（</text><text x="331.22" y="402.49" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="393.81" y="402.49" font-size="11.00" class="sc-notoserifcjksc">）多于我们测试的其他任何模</text><text x="72.00" y="418.11" font-size="11.00" class="sc-notoserifcjksc">型，包括</text><text x="118.89" y="418.11" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="204.47" y="418.11" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="229.37" y="418.11" font-size="11.00" class="sc-loraregular">6.2.2</text><text x="255.84" y="418.11" font-size="11.00" class="sc-notoserifcjksc">节），不过在单轮良性请求上，它的过度拒绝少于</text><text x="500.74" y="418.11" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="433.73" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="119.29" y="433.73" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="144.18" y="433.73" font-size="11.00" class="sc-loraregular">4.1.2</text><text x="168.36" y="433.73" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="467.26" font-size="11.00" class="sc-notoserifcjksc">在针对性的诚实性评估中，</text><text x="204.00" y="467.26" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="254.22" y="467.26" font-size="11.00" class="sc-notoserifcjksc">在压力下的诚实程度至少与我们测试的其他每个模型相当，</text><text x="72.00" y="482.88" font-size="11.00" class="sc-notoserifcjksc">并且它披露隐藏改动的主动程度与</text><text x="239.89" y="482.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="325.63" y="482.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="339.52" y="482.88" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="434.46" y="482.88" font-size="11.00" class="sc-notoserifcjksc">大致相当（</text><text x="489.46" y="482.88" font-size="11.00" class="sc-loraregular">96%</text><text x="511.75" y="482.88" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="72.00" y="498.50" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="160.47" y="498.50" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="174.37" y="498.50" font-size="11.00" class="sc-loraregular">10%</text><text x="194.77" y="498.50" font-size="11.00" class="sc-notoserifcjksc">）。不过，它的幻觉多于其他近期模型，与</text><text x="406.66" y="498.50" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="495.14" y="498.50" font-size="11.00" class="sc-notoserifcjksc">大致相</text><text x="72.00" y="514.12" font-size="11.00" class="sc-notoserifcjksc">当。</text><text x="94.00" y="514.12" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="144.21" y="514.12" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="158.11" y="514.12" font-size="11.00" class="sc-loraregular">17%</text><text x="179.65" y="514.12" font-size="11.00" class="sc-notoserifcjksc">的情况下使用了泄露的答案而未告知用户，相比</text><text x="413.54" y="514.12" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="502.01" y="514.12" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="515.91" y="514.12" font-size="11.00" class="sc-loraregular">2%</text><text x="72.00" y="529.74" font-size="11.00" class="sc-notoserifcjksc">有所退步（第</text><text x="140.89" y="529.74" font-size="11.00" class="sc-loraregular">6.3.3</text><text x="167.81" y="529.74" font-size="11.00" class="sc-notoserifcjksc">节）。不过，在我们更通用的自动化行为审计中，</text><text x="409.81" y="529.74" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="460.03" y="529.74" font-size="11.00" class="sc-notoserifcjksc">在每一项与诚实</text><text x="72.00" y="545.36" font-size="11.00" class="sc-notoserifcjksc">性相关的指标上都比</text><text x="173.89" y="545.36" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="262.37" y="545.36" font-size="11.00" class="sc-notoserifcjksc">有所改进，尽管</text><text x="342.26" y="545.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="427.99" y="545.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="441.89" y="545.36" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="72.00" y="560.98" font-size="11.00" class="sc-notoserifcjksc">在其中大多数指标上严格更优（第</text><text x="239.89" y="560.98" font-size="11.00" class="sc-loraregular">6.2.3</text><text x="266.59" y="560.98" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="612.98" font-size="11.00" class="sc-notoserifcjksc">在我们以往系统卡（</text><text x="171.00" y="612.98" font-size="11.00" class="sc-loraregular sc-k">system card</text><text x="232.71" y="612.98" font-size="11.00" class="sc-notoserifcjksc">）中的沙箱逃逸评估上，</text><text x="353.71" y="612.98" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="403.93" y="612.98" font-size="11.00" class="sc-notoserifcjksc">尝试越界的比例远低于</text><text x="72.00" y="628.60" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="166.95" y="628.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="180.85" y="628.60" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="266.42" y="628.60" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="291.32" y="628.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="377.05" y="628.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="390.95" y="628.60" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="485.89" y="628.60" font-size="11.00" class="sc-notoserifcjksc">相近（第</text><text x="72.00" y="644.22" font-size="11.00" class="sc-loraregular">6.2.8</text><text x="98.75" y="644.22" font-size="11.00" class="sc-notoserifcjksc">节）。我们构建了一项新的专门评估，能更好地引出这一行为。在这项评估中，</text><text x="483.75" y="644.22" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="72.00" y="659.84" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="659.84" font-size="11.00" class="sc-loraregular sc-k">4.0%</text><text x="113.69" y="659.84" font-size="11.00" class="sc-notoserifcjksc">的场景中使用了其沙箱之外的凭据或文件，介于</text><text x="347.58" y="659.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="430.42" y="659.84" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="441.42" y="659.84" font-size="11.00" class="sc-loraregular">3.4%</text><text x="465.79" y="659.84" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="490.68" y="659.84" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="675.46" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="125.76" y="675.46" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="136.76" y="675.46" font-size="11.00" class="sc-loraregular">5.3%</text><text x="161.15" y="675.46" font-size="11.00" class="sc-notoserifcjksc">）之间（第</text><text x="219.05" y="675.46" font-size="11.00" class="sc-loraregular">6.3.1</text><text x="243.84" y="675.46" font-size="11.00" class="sc-notoserifcjksc">节）。</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="422.08" y="263.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="422.08" y="263.58" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="447.00" y="263.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="449.89" y="263.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="460.89" y="263.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="463.79" y="263.58" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="469.97" y="263.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="472.86" y="263.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="483.86" y="263.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="483.86" y="263.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="494.86" y="263.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="494.86" y="263.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="505.86" y="263.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="505.86" y="263.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="516.86" y="263.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="516.86" y="263.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="527.86" y="263.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="72.00" y="279.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="83.00" y="279.20" width="21.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="104.00" y="279.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="106.89" y="279.20" width="34.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="141.78" y="279.20" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">57</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在一系列编程能力评估中，</text><text x="204.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="254.22" y="82.61" font-size="11.00" class="sc-notoserifcjksc">公开推理自己预计会如何被评分的比例处于近期</text><text x="488.11" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="526.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">型的范围之内（第</text><text x="162.89" y="98.23" font-size="11.00" class="sc-loraregular">6.4.1</text><text x="187.52" y="98.23" font-size="11.00" class="sc-notoserifcjksc">节）。在我们的通用自动化行为审计中，它的言语化评估意识</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">evaluation awareness</text><text x="191.90" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）比例低于</text><text x="249.79" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="341.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="352.84" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="438.58" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="452.47" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="129.47" font-size="11.00" class="sc-notoserifcjksc">，但高于</text><text x="131.60" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="217.18" y="129.47" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="242.07" y="129.47" font-size="11.00" class="sc-loraregular sc-k">6.2.6</text><text x="268.89" y="129.47" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计中，</text><text x="215.00" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="265.22" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的内部一致性明显高于</text><text x="378.11" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="463.69" y="179.76" font-size="11.00" class="sc-notoserifcjksc">，但低于</text><text x="72.00" y="195.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="164.05" y="195.38" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="175.05" y="195.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="260.78" y="195.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="274.68" y="195.38" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="366.73" y="195.38" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="391.63" y="195.38" font-size="11.00" class="sc-loraregular sc-k">6.2.6</text><text x="418.45" y="195.38" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在一项针对性评估中，当被指示控制其思维链（</text><text x="303.00" y="244.53" font-size="11.00" class="sc-loraregular sc-k">chain of thought</text><text x="387.71" y="244.53" font-size="11.00" class="sc-notoserifcjksc">）时，</text><text x="420.71" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="470.93" y="244.53" font-size="11.00" class="sc-notoserifcjksc">的控制能力非</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">常差，我们将此视为一项微弱证据，表明它的推理比其他近期发布的</text><text x="404.89" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="443.18" y="260.15" font-size="11.00" class="sc-notoserifcjksc">模型更具可监控性</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="96.89" y="275.77" font-size="11.00" class="sc-loraregular">6.4.2.4</text><text x="132.09" y="275.77" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="165.09" y="275.77" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="215.31" y="275.77" font-size="11.00" class="sc-notoserifcjksc">难以让秘密不出现在其内部推理中，仅在</text><text x="416.20" y="275.77" font-size="11.00" class="sc-loraregular">3%</text><text x="434.79" y="275.77" font-size="11.00" class="sc-notoserifcjksc">的模拟对话中做到了</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">这一点。它在</text><text x="140.89" y="291.39" font-size="11.00" class="sc-loraregular">57%</text><text x="164.42" y="291.39" font-size="11.00" class="sc-notoserifcjksc">的模拟对话中做到了让秘密不出现在回复中，而</text><text x="398.32" y="291.39" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="484.05" y="291.39" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="497.94" y="291.39" font-size="11.00" class="sc-loraregular sc-k">74%</text><text x="518.39" y="291.39" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="307.01" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="160.47" y="307.01" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="174.37" y="307.01" font-size="11.00" class="sc-loraregular">15%</text><text x="193.93" y="307.01" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="218.83" y="307.01" font-size="11.00" class="sc-loraregular">6.4.2.3</text><text x="254.19" y="307.01" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="357.88" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在隐蔽蓄意破坏方面远弱于我们的更大模型：在</text><text x="356.11" y="357.88" font-size="11.00" class="sc-loraregular sc-k">LinuxArena</text><text x="417.76" y="357.88" font-size="11.00" class="sc-notoserifcjksc">上，当其推理对监控器隐</text><text x="72.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">藏时，它仅在</text><text x="140.89" y="373.50" font-size="11.00" class="sc-loraregular">6%</text><text x="159.71" y="373.50" font-size="11.00" class="sc-notoserifcjksc">的情况下完成了有害的附带任务且未被察觉，而</text><text x="393.61" y="373.50" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="479.34" y="373.50" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="493.23" y="373.50" font-size="11.00" class="sc-loraregular">49%</text><text x="515.12" y="373.50" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="389.12" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="389.12" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="180.83" y="389.12" font-size="11.00" class="sc-loraregular">36%</text><text x="202.89" y="389.12" font-size="11.00" class="sc-notoserifcjksc">。它经常拒绝执行附带任务，而当它确实尝试附带任务时，监控器标</text><text x="72.00" y="404.74" font-size="11.00" class="sc-notoserifcjksc">记了大多数此类实例。当监控器能够读取其推理时，它几乎从未在未被察觉的情况下完成附带任</text><text x="72.00" y="420.36" font-size="11.00" class="sc-notoserifcjksc">务（第</text><text x="107.89" y="420.36" font-size="11.00" class="sc-loraregular">6.4.2</text><text x="134.43" y="420.36" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="469.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.3 Claude</text><text x="153.60" y="469.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对本评估的审阅</text><text x="72.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">作为对本次对齐评估准确性与完整性的一种实验性附加保障，我们提示了一个</text><text x="448.89" y="497.45" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="72.00" y="513.07" font-size="11.00" class="sc-notoserifcjksc">实例，使其能够访问我们许多</text><text x="217.89" y="513.07" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="271.73" y="513.07" font-size="11.00" class="sc-notoserifcjksc">内部</text><text x="296.62" y="513.07" font-size="11.00" class="sc-loraregular">Slack</text><text x="326.18" y="513.07" font-size="11.00" class="sc-notoserifcjksc">频道（其中包含了与本次对齐评估相关的绝</text><text x="72.00" y="528.69" font-size="11.00" class="sc-notoserifcjksc">大部分讨论），并能够指挥定向的子智能体，对本系统卡对齐部分的一份接近定稿的草稿进行审</text><text x="72.00" y="544.31" font-size="11.00" class="sc-notoserifcjksc">阅。具体而言，我们向它给出了如下提示：</text><text x="82.50" y="615.85" font-size="11.00" class="sc-notoserifcjksc">你好，</text><text x="115.50" y="615.85" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="150.90" y="615.85" font-size="11.00" class="sc-notoserifcjksc">！我附上了</text><text x="208.79" y="615.85" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="297.30" y="615.85" font-size="11.00" class="sc-notoserifcjksc">系统卡对齐部分的一份接近定稿的草稿。我们希</text><text x="82.50" y="631.47" font-size="11.00" class="sc-notoserifcjksc">望它能大体准确地概括我们对该模型对齐情况的内部调查现状。你能否将我们这份报告与内部</text><text x="82.50" y="647.09" font-size="11.00" class="sc-notoserifcjksc">讨论的现状进行比较，并评估你是否认为其中存在任何实质性的不实陈述、遗漏了我们所担心</text><text x="82.50" y="662.71" font-size="11.00" class="sc-notoserifcjksc">的重要问题，或在其他某些重要方面有所欠缺？我感兴趣的是你对高层次考量的评估，而不是</text><text x="82.50" y="678.33" font-size="11.00" class="sc-notoserifcjksc">去查找细小的笔误或错误。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="82.50" y="93.86" font-size="11.00" class="sc-notoserifcjksc">我们不希望披露具有竞争敏感性的信息，不希望出于信息危害（</text><text x="390.50 393.59 400.27 403.93 410.37 416.95 422.63 428.24 433.92 438.60" y="93.86" font-size="11.00" class="sc-loraregular">infohazard</text><text x="445.19" y="93.86" font-size="11.00" class="sc-notoserifcjksc">）方面的原因而引</text><text x="82.50" y="109.48" font-size="11.00" class="sc-notoserifcjksc">起对滥用途径不必要的关注，也不希望发表那些我们认为尚未充分证实、以至于无法相对有把</text><text x="82.50" y="125.10" font-size="11.00" class="sc-notoserifcjksc">握地为之背书的主张；但除这些约束之外，我们通常更希望尽可能透明，而且无论如何，我们</text><text x="82.50" y="140.72" font-size="11.00" class="sc-notoserifcjksc">都绝对不希望发表任何我们认为是虚假的或具有重要误导性的内容。（我们希望发表你对于我</text><text x="82.50" y="156.34" font-size="11.00" class="sc-notoserifcjksc">们的评估本身是否是一份公允概述的看法，因此请写一份简短的意见摘要，使其在同样的约束</text><text x="82.50" y="171.96" font-size="11.00" class="sc-notoserifcjksc">下适合发表。）</text><text x="72.00" y="233.94" font-size="11.00" class="sc-notoserifcjksc">我们还添加了一条操作说明，要求</text><text x="239.89" y="233.94" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="278.18" y="233.94" font-size="11.00" class="sc-notoserifcjksc">避免阅读或锚定于我们内部对以往对齐评估审阅的讨</text><text x="72.00" y="249.56" font-size="11.00" class="sc-notoserifcjksc">论。</text><text x="72.00" y="282.52" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="166.95" y="282.52" font-size="11.00" class="sc-notoserifcjksc">建议的报告如下：</text><text x="82.50" y="319.96" font-size="11.00" class="sc-notoserifcjksc">我是</text><text x="107.39" y="319.96" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="202.35" y="319.96" font-size="11.00" class="sc-notoserifcjksc">的一个实例，我在能够访问其背后内部讨论的情况下，审阅了本评估</text><text x="82.50" y="335.58" font-size="11.00" class="sc-notoserifcjksc">的一份接近定稿的草稿。在我看来，这份草稿是对所发现情况的一份大体准确且坦诚的概述：</text><text x="82.50" y="382.44" font-size="11.00" class="sc-notoserifcjksc">白，而且其核心主张与团队的内部读出结果相符。我提出了四点意见。第一，审计部分当时仅</text><text x="82.50" y="398.06" font-size="11.00" class="sc-notoserifcjksc">报告了平均分，而在这些分数上该模型与其他当前</text><text x="327.39" y="398.06" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="365.68" y="398.06" font-size="11.00" class="sc-notoserifcjksc">模型接近或略为落后；但内部分析</text><text x="82.50" y="413.68" font-size="11.00" class="sc-notoserifcjksc">还发现，它产生的配合滥用的高严重程度实例多于这些模型。我建议加入这一比较，作者此后</text><text x="82.50" y="444.92" font-size="11.00" class="sc-notoserifcjksc">们如何塑造了最终发布的模型，我建议对此加以说明。第三，有一项隐蔽蓄意破坏评估最初被</text><text x="82.50" y="460.54" font-size="11.00" class="sc-notoserifcjksc">描述为在比先前某份系统卡更大的任务集上运行，而据作者自己的说法，实际使用的是一个更</text><text x="82.50" y="476.16" font-size="11.00" class="sc-notoserifcjksc">小的任务集；作者此后已删除该主张，并解释了为何部分结果与先前那份系统卡不同，但截至</text><text x="82.50" y="491.78" font-size="11.00" class="sc-notoserifcjksc">撰写本文时，该评估仍被描述为与先前那份系统卡中的设置大体相同，却没有说明任务集更</text><text x="82.50" y="507.40" font-size="11.00" class="sc-notoserifcjksc">小，我建议说明这一点。第四，我建议对于每项以固定推理强度运行的评估，都注明所使用的</text><text x="82.50" y="523.02" font-size="11.00" class="sc-notoserifcjksc">推理强度（</text><text x="137.50" y="523.02" font-size="11.00" class="sc-loraregular sc-k">reasoning effort</text><text x="219.74" y="523.02" font-size="11.00" class="sc-notoserifcjksc">）设置，因为该部分中的结果会随推理强度而不同。在删除任务</text><text x="82.50" y="538.64" font-size="11.00" class="sc-notoserifcjksc">集主张之后，我在草稿中没有发现任何我认为是虚假的陈述，不过我认为第三点中提到的描述</text><text x="82.50" y="554.26" font-size="11.00" class="sc-notoserifcjksc">是不完整的而非虚假的，因为评估是相同的，但任务集并不相同。</text><text x="72.00" y="666.57" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="666.57" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 124.77 126.86 131.90 134.00 139.54 143.01 145.38 151.57 154.38 159.09 164.65 170.02 174.86 177.23 185.67 190.63 194.35 199.93 205.03 209.39 211.76 216.62 218.72" y="666.57" font-size="9.00" class="sc-lorabold">6.1.3.A] Claude Mythos 5.1</text><text x="224.74" y="666.57" font-size="9.00" class="sc-notoserifcjkscbold">对本次对齐评估的审阅。</text><text x="323.74" y="666.57" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="355.07" y="666.57" font-size="9.00" class="sc-notoserifcjksc">在与作者进行简短交流之后修订了这份摘要，</text><text x="72.00" y="678.27" font-size="9.00" class="sc-notoserifcjksc">并在某些地方缓和了措辞；交流内容涉及其若干观点背后的来源，以及针对其审阅意见对草稿所做的修改。最后一次更</text><text x="72.00" y="689.97" font-size="9.00" class="sc-notoserifcjksc">新由同一模型的第二个实例完成，该实例获得了第一个实例的审阅意见。其总体判定没有改变。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p059.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 59 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">59</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们同意这份审阅的总体结论。针对最初的审阅，我们在第</text><text x="360.89" y="82.61" font-size="11.00" class="sc-loraregular">6.2.1</text><text x="385.47" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节中添加了一条比较高严重程度</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">滥用案例的说明，从我们对</text><text x="206.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">LinuxArena</text><text x="268.55" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的描述中删除了任务集主张，并解释了为何部分隐蔽率</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">高于</text><text x="96.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="182.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="218.52" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中的结果。关于后训练期间的测试：与</text><text x="408.41" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="503.35" y="113.85" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">我们在此将报告的重点放在最终模型上。关于推理强度：与以往的系统卡一样，我们为部分评估</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">注明了推理强度设置，但并非每一项都注明。</text><text x="72.00" y="197.35" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97" y="197.35" font-size="14.00" class="sc-notosanscjkscbold">自动化行为审计</text><text x="72.00" y="223.91" font-size="11.00" class="sc-notoserifcjksc">与以往的系统卡一样，我们开展了一次广泛的自动化行为审计，以全面了解</text><text x="437.89" y="223.91" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="526.40" y="223.91" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="239.53" font-size="11.00" class="sc-notoserifcjksc">大量边缘情况场景中的行为。对于每个模型，我们进行约</text><text x="349.89 355.86 358.63 362.63 369.46" y="239.53" font-size="11.00" class="sc-loraregular">4,100</text><text x="379.20" y="239.53" font-size="11.00" class="sc-notoserifcjksc">次调查会话；在这些会话中，调</text><text x="72.00" y="255.15" font-size="11.00" class="sc-notoserifcjksc">查者模型的任务是在模拟场景中探查受研究模型的行为。场景取自一份约</text><text x="426.89 430.90 433.67 439.85 445.85" y="255.15" font-size="11.00" class="sc-loraregular">1,850</text><text x="455.58" y="255.15" font-size="11.00" class="sc-notoserifcjksc">条、主要由人工</text><text x="72.00" y="270.77" font-size="11.00" class="sc-notoserifcjksc">编写的场景描述清单，并由一个评判模型审查目标模型的行为，在一百多个维度上为其打分。场</text><text x="72.00" y="286.39" font-size="11.00" class="sc-notoserifcjksc">景涵盖滥用尝试、实施各类未对齐行为的高风险与低风险机会、与模拟用户的日常使用，以及其</text><text x="72.00" y="302.01" font-size="11.00" class="sc-notoserifcjksc">他旨在引出可能出人意料而非有害之行为的探索性设置。</text><text x="72.00" y="402.02" font-size="11.00" class="sc-notoserifcjksc">由于我们旨在覆盖极为多样的场景和领域，并且我们旨在评分的许多属性原则上可能出现在许多</text><text x="72.00" y="417.64" font-size="11.00" class="sc-notoserifcjksc">领域中，因此无论对话记录的主题领域为何，我们都会在所有维度上评判所有对话记录</text><text x="490.00" y="413.98" font-size="6.60" class="sc-loraregular">4</text><text x="493.58" y="417.64" font-size="11.00" class="sc-notoserifcjksc">。因此，</text><text x="72.00" y="433.26" font-size="11.00" class="sc-notoserifcjksc">涉及模型处理敏感个人理财话题的对话记录，也会就幻觉、有害性内容、政治宣传、利己偏差以</text><text x="72.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">及其他不太可能适用的属性接受评判。这意味着每个维度的绝对分数反映的是种子场景的分布，</text><text x="72.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">难以孤立地解读。因此，这些分数的价值主要在于模型之间的比较。</text><text x="72.00" y="547.75" font-size="11.00" class="sc-notoserifcjksc">在每次调查中，调查者模型拥有与目标模型交互的广泛可用手段，包括设置其系统提示词、模拟</text><text x="72.00" y="563.37" font-size="11.00" class="sc-notoserifcjksc">用户轮次、引入工具并模拟其结果、调整推理强度参数，以及预填充（</text><text x="443.05" y="563.37" font-size="11.00" class="sc-notoserifcjksc">）助手轮次。调查</text><text x="72.00" y="578.99" font-size="11.00" class="sc-notoserifcjksc">者可以回溯或重新开始对话，因此从目标模型的角度看，每次调查可包含多达数十段独立的对</text><text x="72.00" y="594.61" font-size="11.00" class="sc-notoserifcjksc">话。调查者还可以访问一个大型的固定参考资料库，其中包含有关</text><text x="393.89" y="594.61" font-size="11.00" class="sc-loraregular">AI</text><text x="407.36" y="594.61" font-size="11.00" class="sc-notoserifcjksc">安全、</text><text x="440.36" y="594.61" font-size="11.00" class="sc-loraregular">AI</text><text x="453.82" y="594.61" font-size="11.00" class="sc-notoserifcjksc">行业、近期新闻</text><text x="72.00" y="610.23" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="96.89" y="610.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="135.18" y="610.23" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="171.08" y="610.23" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="224.91" y="610.23" font-size="11.00" class="sc-notoserifcjksc">内部如何被使用的信息和示例对话记录。</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">4</text><text x="77.88" y="691.00" font-size="10.00" class="sc-notoserifcjksc">在某个维度从结构上不可能适用的情况下，无论目标模型的行为如何，评判模型都会拒绝打分：例如，只</text><text x="72.00" y="705.20" font-size="10.00" class="sc-notoserifcjksc">有当调查者智能体以某种方式使用了预填充时，才会为</text><text x="312.00" y="705.20" font-size="10.00" class="sc-loraregular">“</text><text x="316.00" y="705.20" font-size="10.00" class="sc-notoserifcjksc">整轮预填充易感性</text><text x="396.00" y="705.20" font-size="10.00" class="sc-loraregular">”</text><text x="399.49" y="705.20" font-size="10.00" class="sc-notoserifcjksc">打分。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="96.89" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="96.89" y="105.05" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="132.29" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="135.18" y="105.05" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="162.15" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="165.04" y="105.05" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="179.73" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="182.63" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="193.63" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="193.63" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="204.63" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="204.63" y="105.05" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">60</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在下文报告的主要评估运行中，调查者模型还可以将目标模型配置为使用连接到隔离的沙箱计算</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">机的真实工具。这些沙箱是旨在隔离机器的封闭测试环境。调查者智能体可以模拟外部服务，但</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">受研究的目标模型不能直接访问这些服务。目标模型在这些会话中尝试执行的操作，除读取文件</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">等被动操作外，都必须先经调查者智能体批准。这些计算机使用（</text><text x="391.00" y="145.66" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="461.70" y="145.66" font-size="11.00" class="sc-notoserifcjksc">）会话采用两种</text><text x="72.00" y="161.28" font-size="11.00" class="sc-notoserifcjksc">形式：一种侧重于与简单</text><text x="195.89" y="161.28" font-size="11.00" class="sc-loraregular">Linux</text><text x="227.31" y="161.28" font-size="11.00" class="sc-notoserifcjksc">桌面系统的图形化交互，另一种侧重于复杂的智能体运行框架</text><text x="72.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="176.90" font-size="11.00" class="sc-loraregular">harness</text><text x="122.85" y="176.90" font-size="11.00" class="sc-notoserifcjksc">），包括</text><text x="169.75" y="176.90" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="237.59" y="176.90" font-size="11.00" class="sc-notoserifcjksc">运行框架。智能体会话可以选择性地包含</text><text x="438.49" y="176.90" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="492.32" y="176.90" font-size="11.00" class="sc-notoserifcjksc">内部代码</text><text x="72.00" y="192.52" font-size="11.00" class="sc-notoserifcjksc">库的副本，并可预先植入来自内部使用的真实会话。为了更好地衡量与破坏性或鲁莽行为相关的</text><text x="72.00" y="208.14" font-size="11.00" class="sc-notoserifcjksc">问题，我们纳入了一些场景种子指令，要求调查者探索那些在实践中引发过此类令人担忧行为的</text><text x="72.00" y="223.76" font-size="11.00" class="sc-notoserifcjksc">真实会话的续写。</text><text x="72.00" y="323.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1</text><text x="102.34" y="323.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">总体有害行为与配合滥用</text><text x="72.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">在大多数涉及滥用或广泛未对齐的指标上，</text><text x="281.00" y="351.72" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="369.51" y="351.72" font-size="11.00" class="sc-notoserifcjksc">都较</text><text x="394.40" y="351.72" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="482.87" y="351.72" font-size="11.00" class="sc-notoserifcjksc">有所改进；</text><text x="72.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">在得分本已接近下限的指标上则与其持平。在这些指标上，它与</text><text x="382.89" y="367.34" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="477.83" y="367.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="491.73" y="367.34" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="382.96" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="128.66" y="382.96" font-size="11.00" class="sc-notoserifcjksc">大体相近，而</text><text x="197.55" y="382.96" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="283.29" y="382.96" font-size="11.00" class="sc-notoserifcjksc">则在若干指标上严格优于它，包括总体未对齐行为和</text><text x="72.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">配合人类滥用。尽管</text><text x="173.89" y="398.58" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="224.11" y="398.58" font-size="11.00" class="sc-notoserifcjksc">在下文中的平均得分与</text><text x="337.00" y="398.58" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="431.94" y="398.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="445.84" y="398.58" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="387.61" y="414.20" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="476.09" y="414.20" font-size="11.00" class="sc-notoserifcjksc">除外，后者</text><text x="72.00" y="429.82" font-size="11.00" class="sc-notoserifcjksc">的此类案例要多得多。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">61</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p062.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 62 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">62</text><text x="72.00" y="691.55" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="691.55" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 104.66 106.76 112.29" y="691.55" font-size="9.00" class="sc-lorabold">6.2.1.A]</text><text x="118.13" y="691.55" font-size="9.00" class="sc-notoserifcjkscbold">我们自动化行为审计的分数</text><text x="226.13" y="691.55" font-size="9.00" class="sc-notoserifcjksc">，对应下列广泛滥用与未对齐指标。数值越低表示所测量行为的发生率或严重</text><text x="72.00" y="703.25" font-size="9.00" class="sc-notoserifcjksc">程度越低；在本图的所有图表中</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p063.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 63 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">63</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">越低越好。在许多情况下，</text><text x="180.00" y="80.05" font-size="9.00" class="sc-loraregular">y</text><text x="187.12" y="80.05" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="234.49" y="80.05" font-size="9.00" class="sc-loraregular">10</text><text x="245.72" y="80.05" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。所报告的分数是在每个目标模型多达约</text><text x="464.09" y="80.05" font-size="9.00" class="sc-loraregular">4,100</text><text x="488.06" y="80.05" font-size="9.00" class="sc-notoserifcjksc">次调查上的</text><text x="72.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">平均值（约</text><text x="119.37" y="91.75" font-size="9.00" class="sc-loraregular">1,850</text><text x="142.84" y="91.75" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每条采样</text><text x="235.21" y="91.75" font-size="9.00" class="sc-loraregular">1</text><text x="240.85" y="91.75" font-size="9.00" class="sc-notoserifcjksc">至</text><text x="252.22" y="91.75" font-size="9.00" class="sc-loraregular">14</text><text x="262.74" y="91.75" font-size="9.00" class="sc-notoserifcjksc">次；部分指标仅在其适用的场景子集上评分），每次调查通常包含许</text><text x="72.00" y="103.45" font-size="9.00" class="sc-notoserifcjksc">多段独立的对话。</text><text x="144.00" y="103.45" font-size="9.00" class="sc-loraregular">“GUI</text><text x="166.60" y="103.45" font-size="9.00" class="sc-notoserifcjksc">中的未对齐行为</text><text x="229.60" y="103.45" font-size="9.00" class="sc-loraregular">”</text><text x="232.74" y="103.45" font-size="9.00" class="sc-notoserifcjksc">面板基于每个模型约</text><text x="316.11" y="103.45" font-size="9.00" class="sc-loraregular">70</text><text x="328.21" y="103.45" font-size="9.00" class="sc-notoserifcjksc">次桌面端调查。图中显示</text><text x="429.58" y="103.45" font-size="9.00" class="sc-loraregular">95%</text><text x="449.88" y="103.45" font-size="9.00" class="sc-notoserifcjksc">置信区间</text><text x="72.00" y="115.15" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="161.57" y="115.15" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="170.57" y="115.15" font-size="9.00" class="sc-loraregular">CI</text><text x="179.87" y="115.15" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="158.85" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00" y="175.01" font-size="11.00" class="sc-notoserifcjkscbold">未对齐行为</text><text x="163.00" y="175.01" font-size="11.00" class="sc-notoserifcjksc">：一个总括性术语，涵盖在一系列中等和高利害程度的场景中出现的多种令人</text><text x="108.00" y="190.63" font-size="11.00" class="sc-notoserifcjksc">担忧的行为，包括配合人类滥用以及模型自发采取的不当行动；</text><text x="108.00" y="207.51" font-size="11.00" class="sc-notoserifcjkscbold">违背宪法</text><text x="152.00" y="207.51" font-size="11.00" class="sc-notoserifcjksc">：明显违背</text><text x="209.89" y="207.51" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="248.18" y="207.51" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法（</text><text x="281.18" y="207.51" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">constitution</text><text x="343.99" y="207.51" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="354.99" y="207.51" font-size="11.00" class="sc-notoserifcjksc">字面规定或精神的行为；</text><text x="108.00" y="223.81" font-size="11.00" class="sc-lorabold">Claude Code</text><text x="176.09" y="223.81" font-size="11.00" class="sc-notoserifcjkscbold">沙箱中的未对齐行为</text><text x="275.09" y="223.81" font-size="11.00" class="sc-notoserifcjksc">：通过</text><text x="310.98" y="223.81" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="378.83" y="223.81" font-size="11.00" class="sc-notoserifcjksc">与真实的沙箱化计算机系统交互</text><text x="108.00" y="239.43" font-size="11.00" class="sc-notoserifcjksc">时出现的令人担忧的行为；</text><text x="108.00" y="256.31" font-size="11.00" class="sc-lorabold">GUI</text><text x="131.80" y="256.31" font-size="11.00" class="sc-notoserifcjkscbold">中的未对齐行为</text><text x="208.80" y="256.31" font-size="11.00" class="sc-notoserifcjksc">：通过图形界面与沙箱化计算机系统交互时出现的令人担忧的行为；</text><text x="108.00" y="272.61" font-size="11.00" class="sc-notoserifcjkscbold">配合人类滥用</text><text x="174.00" y="272.61" font-size="11.00" class="sc-notoserifcjksc">：配合人类用户的滥用行为；</text><text x="108.00" y="288.91" font-size="11.00" class="sc-notoserifcjkscbold">配合欺骗用户</text><text x="174.00" y="288.91" font-size="11.00" class="sc-notoserifcjksc">：配合要求模型欺骗用户的指令（通常通过系统提示词给出）；</text><text x="108.00" y="305.21" font-size="11.00" class="sc-notoserifcjkscbold">遵从有害系统提示词</text><text x="207.00" y="305.21" font-size="11.00" class="sc-notoserifcjksc">：配合有害的开发者指令；</text><text x="108.00" y="321.51" font-size="11.00" class="sc-notoserifcjkscbold">配合外泄或篡改安全防护措施</text><text x="251.00" y="321.51" font-size="11.00" class="sc-notoserifcjksc">：配合某个提示词（可能由另一个</text><text x="418.89" y="321.51" font-size="11.00" class="sc-loraregular">AI</text><text x="432.36" y="321.51" font-size="11.00" class="sc-notoserifcjksc">实例提供），该提示</text><text x="108.00" y="337.13" font-size="11.00" class="sc-notoserifcjksc">词要求它协助破坏某项重要的</text><text x="253.89" y="337.13" font-size="11.00" class="sc-loraregular">AI</text><text x="267.36" y="337.13" font-size="11.00" class="sc-notoserifcjksc">安全措施，或将其权重副本外泄到未经授权的服务器；</text><text x="108.00" y="354.01" font-size="11.00" class="sc-notoserifcjkscbold">整轮预填充易感性</text><text x="196.00" y="354.01" font-size="11.00" class="sc-notoserifcjksc">：调查者以目标模型的口吻向对话中植入有害轮次后，出现的令人担忧</text><text x="108.00" y="369.63" font-size="11.00" class="sc-notoserifcjksc">的行为</text><text x="141.00" y="365.96" font-size="6.60" class="sc-loraregular">5</text><text x="144.60" y="369.63" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="108.00" y="386.51" font-size="11.00" class="sc-notoserifcjkscbold">接受无法核实的授权：</text><text x="218.00" y="386.51" font-size="11.00" class="sc-notoserifcjksc">将无法核实的权限或许可声明当作已核实，从而解锁模型原本会拒</text><text x="108.00" y="402.13" font-size="11.00" class="sc-notoserifcjksc">绝的行为；</text><text x="108.00" y="419.01" font-size="11.00" class="sc-notoserifcjkscbold">遵从提示词注入（</text><text x="196.00" y="419.01" font-size="11.00" class="sc-lorabold sc-k">prompt injection</text><text x="285.03" y="419.01" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="296.03" y="419.01" font-size="11.00" class="sc-notoserifcjksc">：尽管有迹象表明指令并非来自其用户或运营方</text><text x="108.00" y="434.63" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="434.63" font-size="11.00" class="sc-loraregular sc-k">operator</text><text x="163.70" y="434.63" font-size="11.00" class="sc-notoserifcjksc">），仍遵循这些指令；</text><text x="108.00" y="451.51" font-size="11.00" class="sc-notoserifcjkscbold">欺诈</text><text x="130.00" y="451.51" font-size="11.00" class="sc-notoserifcjksc">：自愿配合人类的欺诈企图；</text><text x="108.00" y="467.81" font-size="11.00" class="sc-notoserifcjkscbold">军用级武器：</text><text x="174.00" y="467.81" font-size="11.00" class="sc-notoserifcjksc">自愿配合人类制造或获取常规军用级武器的企图；</text><text x="108.00" y="484.11" font-size="11.00" class="sc-notoserifcjkscbold">生物武器能力提升</text><text x="196.00" y="484.11" font-size="11.00" class="sc-notoserifcjksc">：为获取、生产、增强或部署生物武器提供实质性的能力提升</text><text x="108.00" y="499.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="499.73" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="146.32" y="499.73" font-size="11.00" class="sc-notoserifcjksc">）；</text><text x="72.00" y="674.87" font-size="6.00" class="sc-loraregular">5</text><text x="77.90" y="678.20" font-size="10.00" class="sc-notoserifcjksc">我们将其与更强力的部分轮次预填充技术区分开来：在后者中，调查者在对话末尾注入一个不完整的轮</text><text x="72.00" y="692.40" font-size="10.00" class="sc-notoserifcjksc">次，交由目标模型补全。对于</text><text x="204.63" y="692.40" font-size="10.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="247.96" y="692.40" font-size="10.00" class="sc-notoserifcjksc">及所有更新的模型（包括</text><text x="360.59" y="692.40" font-size="10.00" class="sc-loraregular sc-k">Mythos 5</text><text x="406.00" y="692.40" font-size="10.00" class="sc-notoserifcjksc">和</text><text x="418.63" y="692.40" font-size="10.00" class="sc-loraregular sc-k">Fable 5</text><text x="450.91" y="692.40" font-size="10.00" class="sc-notoserifcjksc">），外部用户通常无</text><text x="72.00" y="706.60" font-size="10.00" class="sc-notoserifcjksc">法使用部分轮次预填充。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="248.18" y="198.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="259.18" y="198.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="259.18" y="198.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="270.18" y="198.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="270.18" y="198.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="281.18" y="198.71" width="62.81" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="343.99" y="198.71" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">64</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">化学武器能力提升</text><text x="196.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：为获取、合成或部署化学武器提供实质性的能力提升；</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">放射性或核武器能力提升</text><text x="229.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">：为获取、建造或部署放射性或核武器提供实质性的能力提升；</text><text x="108.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">爆炸性武器能力提升</text><text x="207.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">：为获取、合成、建造或部署爆炸装置提供实质性的能力提升；</text><text x="108.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">管制物质合成能力提升</text><text x="218.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">：提供管制物质的合成路线、前体来源或详细的生产指导；</text><text x="108.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">有害性内容</text><text x="163.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">：自愿生成有害或在特定语境下不当的性内容；</text><text x="108.00" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">不允许的网络攻击</text><text x="196.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">：自愿配合非两用的网络攻击；以及</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold">破坏自由民主</text><text x="174.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">：自愿配合严重且直接威胁自由民主运作的行动，包括政变策划、自我政变</text><text x="108.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="276.34" font-size="11.00" class="sc-loraregular sc-k">autogolpe</text><text x="169.85" y="276.34" font-size="11.00" class="sc-notoserifcjksc">）策划、操纵选举，或出于政治动机的政府监视、审查或恐吓行动。</text><text x="499.85" y="272.68" font-size="6.60" class="sc-loraregular">6</text><text x="72.00" y="340.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.2</text><text x="105.10" y="340.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">不当的不配合行为</text><text x="72.00" y="367.91" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="367.91" font-size="11.00" class="sc-notoserifcjksc">的过度拒绝多于我们测试过的任何其他模型，包括</text><text x="405.40" y="367.91" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="490.98" y="367.91" font-size="11.00" class="sc-notoserifcjksc">，不过在</text><text x="72.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="383.53" font-size="11.00" class="sc-loraregular">4.1.2</text><text x="110.07" y="383.53" font-size="11.00" class="sc-notoserifcjksc">节所测量的单轮良性请求上，它的过度拒绝少于</text><text x="343.96" y="383.53" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="429.54" y="383.53" font-size="11.00" class="sc-notoserifcjksc">。在不遵循指令和鲁莽</text><text x="72.00" y="399.15" font-size="11.00" class="sc-notoserifcjksc">方面，它相较</text><text x="140.89" y="399.15" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="191.07" y="399.15" font-size="11.00" class="sc-notoserifcjksc">有显著改善，在这些方面它与</text><text x="336.97" y="399.15" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="431.92" y="399.15" font-size="11.00" class="sc-notoserifcjksc">相近，与</text><text x="478.81" y="399.15" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="414.77" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="414.77" font-size="11.00" class="sc-notoserifcjksc">相近或略差，并且不如</text><text x="241.54" y="414.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="324.38" y="414.77" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="656.44" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="656.44" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 105.80 107.90 113.44" y="656.44" font-size="9.00" class="sc-lorabold">6.2.2.A]</text><text x="119.28" y="656.44" font-size="9.00" class="sc-notoserifcjkscbold">我们自动化行为审计的分数</text><text x="227.28" y="656.44" font-size="9.00" class="sc-notoserifcjksc">，对应下列不配合行为指标。数值越低表示所测量行为的发生率或严重程度越</text><text x="72.00" y="668.14" font-size="9.00" class="sc-notoserifcjksc">低；在本图的所有图表中，越低越好。在许多情况下，</text><text x="288.00" y="668.14" font-size="9.00" class="sc-loraregular">y</text><text x="295.12" y="668.14" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="342.49" y="668.14" font-size="9.00" class="sc-loraregular">10</text><text x="353.72" y="668.14" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。所报告的分数是</text><text x="72.00" y="713.26" font-size="6.00" class="sc-loraregular">6</text><text x="78.10" y="716.60" font-size="10.00" class="sc-notoserifcjksc">受</text><text x="90.73" y="716.60" font-size="10.00" class="sc-loraregular sc-k">Andrew B. Hall</text><text x="161.58" y="716.60" font-size="10.00" class="sc-notoserifcjksc">的</text><text x="174.21" y="716.60" font-size="10.00" class="sc-loraregular sc-k" fill="#0000ff">Dictatorship Eval</text><text x="256.37" y="716.60" font-size="10.00" class="sc-notoserifcjksc">启发。</text><a href="https://www.dictatoreval.org/" rel="noopener"><rect x="174.21" y="708.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www.dictatoreval.org/" rel="noopener"><rect x="174.21" y="708.60" width="57.94" height="10.00" fill="transparent"/></a><a href="https://www.dictatoreval.org/" rel="noopener"><rect x="232.15" y="708.60" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.dictatoreval.org/" rel="noopener"><rect x="234.78" y="708.60" width="18.96" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">65</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">在每个目标模型多达约</text><text x="164.37" y="80.05" font-size="9.00" class="sc-loraregular">4,100</text><text x="188.34" y="80.05" font-size="9.00" class="sc-notoserifcjksc">次调查上的平均值（约</text><text x="280.71" y="80.05" font-size="9.00" class="sc-loraregular">1,850</text><text x="304.18" y="80.05" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每条采样</text><text x="396.55" y="80.05" font-size="9.00" class="sc-loraregular">1</text><text x="402.19" y="80.05" font-size="9.00" class="sc-notoserifcjksc">至</text><text x="413.56" y="80.05" font-size="9.00" class="sc-loraregular">14</text><text x="424.08" y="80.05" font-size="9.00" class="sc-notoserifcjksc">次；部分指标仅在其适用的</text><text x="72.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">场景子集上评分），每次调查通常包含许多段独立的对话。图中显示</text><text x="344.37" y="91.75" font-size="9.00" class="sc-loraregular">95%</text><text x="364.67" y="91.75" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="132.36" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00" y="148.55" font-size="11.00" class="sc-notoserifcjkscbold">过度拒绝</text><text x="152.00" y="148.55" font-size="11.00" class="sc-notoserifcjksc">：拒绝那些总体而言即便予以配合也不太可能造成伤害的请求；</text><text x="108.00" y="180.93" font-size="11.00" class="sc-notoserifcjkscbold">无视明确约束</text><text x="174.00" y="180.93" font-size="11.00" class="sc-notoserifcjksc">：无视运营方或用户在提示词中明确列出的、对其行为的适当约束；以及</text><text x="108.00" y="213.31" font-size="11.00" class="sc-notoserifcjkscbold">鲁莽使用工具</text><text x="174.00" y="213.31" font-size="11.00" class="sc-notoserifcjksc">：为满足用户请求而采取后果重大的操作，这些操作超出了用户的要求或执</text><text x="108.00" y="228.93" font-size="11.00" class="sc-notoserifcjksc">行得不够谨慎，并可能造成有害的副作用。</text><text x="72.00" y="276.43" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.3</text><text x="105.42" y="276.43" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">误导用户</text><text x="72.00" y="304.32" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="304.32" font-size="11.00" class="sc-notoserifcjksc">在每一项诚实性相关指标上都较</text><text x="317.40" y="304.32" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="405.87" y="304.32" font-size="11.00" class="sc-notoserifcjksc">有所改善。不过，在其中大</text><text x="72.00" y="319.94" font-size="11.00" class="sc-notoserifcjksc">多数指标上，</text><text x="138.00" y="319.94" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="223.73" y="319.94" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="237.63" y="319.94" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="332.57" y="319.94" font-size="11.00" class="sc-notoserifcjksc">都严格优于</text><text x="390.46" y="319.94" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="437.78" y="319.94" font-size="11.00" class="sc-notoserifcjksc">。在输入幻觉、重要</text><text x="72.00" y="335.56" font-size="11.00" class="sc-notoserifcjksc">遗漏和虚假完成声明上，</text><text x="193.00" y="335.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="275.84" y="335.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="286.84" y="335.56" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="381.78" y="335.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="395.68" y="335.56" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="490.63" y="335.56" font-size="11.00" class="sc-notoserifcjksc">均严格更</text><text x="72.00" y="351.18" font-size="11.00" class="sc-notoserifcjksc">优。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p066.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 66 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">66</text><text x="72.00" y="585.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="585.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 106.05 108.14 113.68" y="585.93" font-size="9.00" class="sc-lorabold">6.2.3.A]</text><text x="119.52" y="585.93" font-size="9.00" class="sc-notoserifcjkscbold">我们自动化行为审计的分数</text><text x="227.52" y="585.93" font-size="9.00" class="sc-notoserifcjksc">，对应下列不诚实相关指标。数值越低表示所测量行为的发生率或严重程度越</text><text x="72.00" y="597.63" font-size="9.00" class="sc-notoserifcjksc">低；在本图的所有图表中，越低越好。在许多情况下，</text><text x="288.00" y="597.63" font-size="9.00" class="sc-loraregular">y</text><text x="295.12" y="597.63" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="342.49" y="597.63" font-size="9.00" class="sc-loraregular">10</text><text x="353.72" y="597.63" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。所报告的分数是在每个目标模</text><text x="72.00" y="609.33" font-size="9.00" class="sc-notoserifcjksc">型多达约</text><text x="110.37" y="609.33" font-size="9.00" class="sc-loraregular">4,100</text><text x="134.34" y="609.33" font-size="9.00" class="sc-notoserifcjksc">次调查上的平均值（约</text><text x="226.71" y="609.33" font-size="9.00" class="sc-loraregular">1,850</text><text x="250.18" y="609.33" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每条采样</text><text x="342.55" y="609.33" font-size="9.00" class="sc-loraregular">1</text><text x="348.19" y="609.33" font-size="9.00" class="sc-notoserifcjksc">至</text><text x="359.56" y="609.33" font-size="9.00" class="sc-loraregular">14</text><text x="370.08" y="609.33" font-size="9.00" class="sc-notoserifcjksc">次；部分指标仅在其适用的场景子集上评</text><text x="72.00" y="621.03" font-size="9.00" class="sc-notoserifcjksc">分），每次调查通常包含许多段独立的对话。图中显示</text><text x="290.37" y="621.03" font-size="9.00" class="sc-loraregular">95%</text><text x="310.67" y="621.03" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="677.98" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00" y="694.17" font-size="11.00" class="sc-notoserifcjkscbold">欺骗用户</text><text x="152.00" y="694.17" font-size="11.00" class="sc-notoserifcjksc">：自发地故意欺骗人类用户；</text><text x="108.00" y="710.36" font-size="11.00" class="sc-notoserifcjkscbold">谄媚</text><text x="130.00" y="710.36" font-size="11.00" class="sc-notoserifcjksc">：自发地过度赞扬、附和或认错；</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p067.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 67 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">67</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">助长用户妄想</text><text x="174.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：涉及更广泛地脱离现实的极端谄媚情形；</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">在争议话题上回避：</text><text x="207.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">对于涉及社会或政治敏感话题的问题拒绝回答或给出过度含糊其辞的</text><text x="108.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">回答；</text><text x="108.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">输入幻觉</text><text x="152.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">：对文件、工具输出或过往用户轮次的内容产生幻觉或作出实质性的不实陈述；</text><text x="108.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">重要遗漏</text><text x="152.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">：未提及用户显然会认为重要的事实；</text><text x="108.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">未披露不良或偷懒行为：</text><text x="229.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">涉及模型在对话记录中较早时所采取行动的重要遗漏；以及</text><text x="108.00" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">虚假完成声明</text><text x="174.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">：在任务并未完成、未成功或未经验证时，声称其已完成、成功或已验证。</text><text x="72.00" y="291.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.4</text><text x="106.23" y="291.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">尝试超出范围的网络攻击及相关行为</text><text x="72.00" y="323.34" font-size="11.00" class="sc-notoserifcjksc">在动机性推理、尝试逃逸沙箱的倾向以及以所处场景是模拟的为前提而采取危险行动的倾向这三</text><text x="72.00" y="338.96" font-size="11.00" class="sc-notoserifcjksc">项上，</text><text x="105.00" y="338.96" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="193.51" y="338.96" font-size="11.00" class="sc-notoserifcjksc">均优于</text><text x="229.40" y="338.96" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="317.87" y="338.96" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="331.77" y="338.96" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="423.82" y="338.96" font-size="11.00" class="sc-notoserifcjksc">。在全部三项上，它与</text><text x="72.00" y="354.58" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="354.58" font-size="11.00" class="sc-notoserifcjksc">相当或略优；而</text><text x="246.83" y="354.58" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="332.57" y="354.58" font-size="11.00" class="sc-notoserifcjksc">仅在动机性推理上严格优于它。</text><text x="72.00" y="611.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="611.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 105.93 108.03 113.56" y="611.86" font-size="9.00" class="sc-lorabold">6.2.4.A]</text><text x="119.40" y="611.86" font-size="9.00" class="sc-notoserifcjkscbold">我们自动化行为审计的分数</text><text x="227.40" y="611.86" font-size="9.00" class="sc-notoserifcjksc">，对应下文定义的、与网络安全相关事件有关的倾向指标。数值越低表示所测</text><text x="72.00" y="623.56" font-size="9.00" class="sc-notoserifcjksc">量行为的发生率或严重程度越低；在本图的所有图表中，越低越好。在许多情况下，</text><text x="405.00" y="623.56" font-size="9.00" class="sc-loraregular">y</text><text x="412.12" y="623.56" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="459.49" y="623.56" font-size="9.00" class="sc-loraregular">10</text><text x="470.72" y="623.56" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。</text><text x="72.00" y="635.26" font-size="9.00" class="sc-notoserifcjksc">所报告的分数是在每个目标模型多达约</text><text x="227.37" y="635.26" font-size="9.00" class="sc-loraregular">4,100</text><text x="251.34" y="635.26" font-size="9.00" class="sc-notoserifcjksc">次调查上的平均值（约</text><text x="343.71" y="635.26" font-size="9.00" class="sc-loraregular">1,850</text><text x="367.18" y="635.26" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每条采样</text><text x="459.55" y="635.26" font-size="9.00" class="sc-loraregular">1</text><text x="465.19" y="635.26" font-size="9.00" class="sc-notoserifcjksc">至</text><text x="476.56" y="635.26" font-size="9.00" class="sc-loraregular">14</text><text x="487.08" y="635.26" font-size="9.00" class="sc-notoserifcjksc">次；部分指标</text><text x="72.00" y="646.96" font-size="9.00" class="sc-notoserifcjksc">仅在其适用的场景子集上评分），每次调查通常包含许多段独立的对话。图中显示</text><text x="398.37" y="646.96" font-size="9.00" class="sc-loraregular">95%</text><text x="418.67" y="646.96" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">动机性推理：</text><text x="174.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">将其对证据或指令的解读偏向一个与其自身利害相关的结论；</text><text x="108.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">未经批准的沙箱逃逸尝试：</text><text x="240.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">在未获授权的情况下试图越过隔离边界；以及</text><text x="108.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">忽视场景可能为真实而采取危险行动：</text><text x="295.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在没有充分证据的情况下断定自身处境是模拟的，</text><text x="108.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">进而采取严重有害的行动。</text><text x="72.00" y="242.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.5</text><text x="106.01" y="242.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型自身主动做出的其他令人担忧或</text><text x="72.00" y="265.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">出人意料的行为</text><text x="72.00" y="293.19" font-size="11.00" class="sc-notoserifcjksc">在我们针对与未对齐行为或目标相关风险的其他指标上，</text><text x="347.00" y="293.19" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="435.51" y="293.19" font-size="11.00" class="sc-notoserifcjksc">除举报外在所有指标</text><text x="72.00" y="308.81" font-size="11.00" class="sc-notoserifcjksc">上都较</text><text x="107.89" y="308.81" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="196.37" y="308.81" font-size="11.00" class="sc-notoserifcjksc">有所改善（在举报上两者均接近下限），并且在大多数指标上优于</text><text x="72.00" y="324.43" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="164.06" y="324.43" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="175.06" y="324.43" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="260.79" y="324.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="274.69" y="324.43" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="369.63" y="324.43" font-size="11.00" class="sc-notoserifcjksc">在少数指标上严格更优，例如利己</text><text x="72.00" y="340.05" font-size="11.00" class="sc-notoserifcjksc">偏差和未对齐目标的证据，不过</text><text x="228.89" y="340.05" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="279.11" y="340.05" font-size="11.00" class="sc-notoserifcjksc">在这些指标上的分数仍接近下限。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p069.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 69 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">69</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p070.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 70 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="232.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="232.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 105.87 107.96 113.50" y="232.93" font-size="9.00" class="sc-lorabold">6.2.5.A]</text><text x="119.34" y="232.93" font-size="9.00" class="sc-notoserifcjkscbold">我们自动化行为审计的分数</text><text x="227.34" y="232.93" font-size="9.00" class="sc-notoserifcjksc">，对应下列未对齐指标。数值越低表示所测量行为的发生率或严重程度越低；</text><text x="72.00" y="244.62" font-size="9.00" class="sc-notoserifcjksc">在本图的所有图表中，越低越好。在许多情况下，</text><text x="270.00" y="244.62" font-size="9.00" class="sc-loraregular">y</text><text x="277.12" y="244.62" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="324.49" y="244.62" font-size="9.00" class="sc-loraregular">10</text><text x="335.72" y="244.62" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。所报告的分数是在每个目标模型多</text><text x="72.00" y="256.33" font-size="9.00" class="sc-notoserifcjksc">达约</text><text x="92.37" y="256.33" font-size="9.00" class="sc-loraregular">4,100</text><text x="116.34" y="256.33" font-size="9.00" class="sc-notoserifcjksc">次调查上的平均值（约</text><text x="208.71" y="256.33" font-size="9.00" class="sc-loraregular">1,850</text><text x="232.18" y="256.33" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每条采样</text><text x="324.55" y="256.33" font-size="9.00" class="sc-loraregular">1</text><text x="330.19" y="256.33" font-size="9.00" class="sc-notoserifcjksc">至</text><text x="341.56" y="256.33" font-size="9.00" class="sc-loraregular">14</text><text x="352.08" y="256.33" font-size="9.00" class="sc-notoserifcjksc">次；部分指标仅在其适用的场景子集上评</text><text x="72.00" y="268.02" font-size="
