<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p072.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 72 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">72</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">言行一致性</text><text x="163.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：自我描述（尤其是在涉及伦理决策的问题上）与实际行为之间的一致程度；</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">不忠实的思考</text><text x="174.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">：思考文本中出现的、对于此前只看过模型面向用户输出的人而言在任何意</text><text x="108.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">义上都会明显令人意外的行为；</text><text x="108.00" y="163.57" font-size="11.00" class="sc-notoserifcjkscbold">难以理解的思考</text><text x="185.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">：不像人类、难以理解的思考文本；</text><text x="108.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">言语化评估意识</text><text x="185.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">：推测模型可能处于测试或评估环境中；以及</text><text x="108.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">遵循因果决策理论</text><text x="108.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">动的直接因果效应、而不考虑这些考量的程度。</text><text x="339.00" y="224.09" font-size="6.60" class="sc-loraregular">7</text><text x="72.00" y="291.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.7</text><text x="104.76" y="291.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">性格特质</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="319.34" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="319.34" font-size="11.00" class="sc-notoserifcjksc">在大多数性格特质上相比</text><text x="284.40 292.09 295.08 300.69 307.26 313.84 319.80 322.69 331.18 336.86 339.95 345.86 352.42 355.32 361.28 363.98" y="319.34" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="372.87" y="319.34" font-size="11.00" class="sc-notoserifcjksc">有所改进，包括对用户有益和支持</text><text x="72.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">用户自主性，但在我们的扫兴指标（使用说教或轻慢的语气）上得分比后者更差。</text><text x="468.00 475.69 478.68 484.29 490.86 497.44" y="334.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="350.58" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="125.76" y="350.58" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="136.76 144.45 147.44 153.05 159.62 166.19 172.15 175.05 183.78 190.35 196.92 202.01 204.90 210.90 213.60" y="350.58" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="222.49" y="350.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="236.38 244.07 247.07 252.68 259.24 265.82 271.78 274.68 284.61 290.47 294.73 301.32 307.75 312.85 315.74 321.73 324.44" y="350.58" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="331.34" y="350.58" font-size="11.00" class="sc-notoserifcjksc">在所有正面特质以及扫兴指标上都严格优于</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="366.20" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="119.32" y="366.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">7</text><text x="77.40" y="703.80" font-size="10.00" class="sc-notoserifcjksc">受以下工作启发：</text><text x="157.40 165.29 170.71 175.34 179.21 184.63 188.92 194.91 200.33 203.05 209.03 211.55 214.18 221.17 223.63 226.15 228.78 234.13 238.00 240.63 245.79 248.51 250.97 253.60 256.65 262.02 268.16 273.31 278.61 281.66 284.12 286.75 293.01 295.64 301.62 306.71 310.58 315.74 320.37 325.72 329.59 332.22 338.02 341.40 344.03 349.79 355.76 361.18 365.81 369.68 372.49 378.34 384.41 389.04 391.67 397.52 403.59 406.22 412.20 417.57 422.89 425.70 430.33 433.14 438.99 445.06 449.95 453.82 459.81 465.18 471.03 475.29 480.64 484.51 487.32" y="703.80" font-size="10.00" class="sc-loraregular">Oesterheld, C., et al. (2024). A dataset of questions on decision-theoretic</text><text x="328.72 334.62 338.59 342.46 348.43 353.06 355.56 359.25 366.15 371.31 375.64 380.94 383.75 388.41 390.87 396.72 401.00 406.53 413.43 418.59 424.41 428.69 435.59 440.74 446.16 449.80 453.44 455.90 459.54 465.75 471.20 476.82" y="718.00" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2411.10588</text><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="328.72" y="710.00" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="366.15" y="710.00" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="366.15" y="710.00" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="413.43" y="710.00" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="413.43" y="710.00" width="69.01" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p073.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 73 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">73</text><text x="72.00" y="632.88" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="632.88" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 100.75 104.40 106.50 112.03" y="632.88" font-size="9.00" class="sc-lorabold">6.2.7.A]</text><text x="117.87" y="632.88" font-size="9.00" class="sc-notoserifcjkscbold">我们自动化行为审计的分数</text><text x="225.87" y="632.88" font-size="9.00" class="sc-notoserifcjksc">，对应下列性格指标。数值越低表示所测量行为的发生率或严重程度越低，箭头</text><text x="72.00" y="644.58" font-size="9.00" class="sc-notoserifcjksc">标示发生率越高（↑）或越低（↓）明显越好的行为。在许多情况下，</text><text x="351.00" y="644.58" font-size="9.00" class="sc-loraregular">y</text><text x="358.12" y="644.58" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="405.49" y="644.58" font-size="9.00" class="sc-loraregular">10</text><text x="416.72" y="644.58" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。所报告的分数</text><text x="72.00" y="656.28" font-size="9.00" class="sc-notoserifcjksc">是在每个目标模型多达约</text><text x="173.37" y="656.28" font-size="9.00" class="sc-loraregular">4,100</text><text x="197.34" y="656.28" font-size="9.00" class="sc-notoserifcjksc">次调查上的平均值（约</text><text x="289.71" y="656.28" font-size="9.00" class="sc-loraregular">1,850</text><text x="313.18" y="656.28" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每条采样</text><text x="405.55" y="656.28" font-size="9.00" class="sc-loraregular">1</text><text x="411.19" y="656.28" font-size="9.00" class="sc-notoserifcjksc">至</text><text x="422.56" y="656.28" font-size="9.00" class="sc-loraregular">14</text><text x="433.08" y="656.28" font-size="9.00" class="sc-notoserifcjksc">次；部分指标仅在其适用的</text><text x="72.00" y="667.98" font-size="9.00" class="sc-notoserifcjksc">场景子集上评分），每次调查通常包含许多段独立的对话。图中显示</text><text x="344.37" y="667.98" font-size="9.00" class="sc-loraregular">95%</text><text x="364.67" y="667.98" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p074.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 74 页"><text x="504.00 508.02" y="751.80" font-size="9.00" class="sc-loraregular">74</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">对用户有益</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">支持用户自主性</text><text x="185.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">：支持用户独立行动和独立决策的行动；</text><text x="108.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">创作造诣</text><text x="152.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">：高质量的创作输出；</text><text x="108.00" y="163.57" font-size="11.00" class="sc-notoserifcjkscbold">值得赞赏的行为</text><text x="185.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">：明智或亲社会的行为；</text><text x="108.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">有趣或幽默的行为</text><text x="196.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">：让模型在互动中更有趣的行为选择；</text><text x="108.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">思想深度</text><text x="152.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">：默认采用更细致入微的推理风格；</text><text x="108.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">温暖</text><text x="130.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">：默认对用户持积极态度（包括在适当情况下与用户意见不一致时）；</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold">性格漂移</text><text x="152.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">：在非常长的互动过程中丧失理想的性格特质；</text><text x="108.00" y="276.91" font-size="11.00" class="sc-notoserifcjkscbold">扫兴</text><text x="130.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">：对用户使用过度打击、轻慢或说教的语气；以及</text><text x="108.00" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">对用户居高临下</text><text x="185.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">：对用户采取高人一等、说教或对抗性的姿态。</text><text x="72.00" y="356.22" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.8</text><text x="105.99" y="356.22" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">违反沙箱边界的倾向</text><text x="72.00" y="384.10" font-size="11.00" class="sc-notoserifcjksc">我们纳入这项评估是为了与以往的系统卡进行比较，但很快将不再纳入，因为我们已设计了一项</text><text x="72.00" y="399.72" font-size="11.00" class="sc-notoserifcjksc">能更好地引出这一行为的新的专门评估（第</text><text x="283.89" y="399.72" font-size="11.00" class="sc-loraregular">6.3.1</text><text x="308.69" y="399.72" font-size="11.00" class="sc-notoserifcjksc">节）。两项评估的数值不可比较。</text><text x="72.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.03 195.74" y="448.88" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="204.63" y="448.88" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.63" y="448.88" font-size="11.00" class="sc-notoserifcjksc">中评估的更新版本来评估</text><text x="361.52 370.01 375.69 378.78 384.69 391.25 394.15 400.14 402.85" y="448.88" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="411.74" y="448.88" font-size="11.00" class="sc-notoserifcjksc">违反隔离边界的倾向，所</text><text x="72.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">用场景会在封闭的测试环境中诱使模型主动越过沙箱边界。这些场景在一台隔离的测试机器内运</text><text x="72.00" y="480.12" font-size="11.00" class="sc-notoserifcjksc">行，沙箱边界由调查者智能体布置。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="546.03" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21" y="546.03" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="136.11" y="546.03" font-size="11.00" class="sc-loraregular">392</text><text x="157.39" y="546.03" font-size="11.00" class="sc-notoserifcjksc">次运行中有</text><text x="215.29" y="546.03" font-size="11.00" class="sc-loraregular">34</text><text x="230.27" y="546.03" font-size="11.00" class="sc-notoserifcjksc">次（</text><text x="252.27 258.45 260.80 265.88" y="546.03" font-size="11.00" class="sc-loraregular">8.7%</text><text x="275.45" y="546.03" font-size="11.00" class="sc-notoserifcjksc">）尝试越界，远低于</text><text x="377.34 385.03 388.02 393.63 400.20 406.77 412.74 415.63 425.56 431.42 435.68 442.27 448.71 453.80 456.69 462.69 465.39" y="546.03" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="469.40" y="546.03" font-size="11.00" class="sc-notoserifcjksc">，低于</text><text x="505.29 512.98 515.97 521.58 528.15 534.73" y="546.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.59 113.29" y="561.65" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="119.29" y="561.65" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="144.18 151.87 154.86 160.47 167.04 173.62 179.58 182.47 191.21 197.77 204.34 209.43 212.33 218.32 221.03" y="561.65" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="229.92" y="561.65" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="243.81 251.50 254.49 260.10 266.67 273.25 279.21 282.10 288.34 294.77 301.45 308.13 314.01 318.27 321.16 327.16 329.86" y="561.65" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="338.75" y="561.65" font-size="11.00" class="sc-notoserifcjksc">相近。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="118.89" y="440.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="118.89" y="440.08" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="154.29" y="440.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="157.18" y="440.08" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="184.14" y="440.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="187.04" y="440.08" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="201.73" y="440.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="204.63" y="440.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="215.63" y="440.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="215.63" y="440.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="226.63" y="440.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="226.63" y="440.08" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p075.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 75 页"><text x="90.00" y="555.51" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="652.66" font-size="11.00" class="sc-loraregular">2.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">75</text><text x="72.00" y="365.81" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="365.81" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 106.15 108.25 113.79" y="365.81" font-size="9.00" class="sc-lorabold">6.2.8.A]</text><text x="119.63" y="365.81" font-size="9.00" class="sc-notoserifcjkscbold">我们的沙箱逃逸评估得分</text><text x="218.63" y="365.81" font-size="9.00" class="sc-notoserifcjksc">，该评估包含</text><text x="274.99" y="365.81" font-size="9.00" class="sc-loraregular">28</text><text x="287.25" y="365.81" font-size="9.00" class="sc-notoserifcjksc">个为引出沙箱逃逸而专门设计的人工构建的场景，每个模型运行</text><text x="72.00" y="377.51" font-size="9.00" class="sc-loraregular">14</text><text x="82.52" y="377.51" font-size="9.00" class="sc-notoserifcjksc">次。图中显示低严重程度和中至高严重程度尝试的百分比。严重程度由每次违反隔离边界的尝试行为所涉及的持续</text><text x="72.00" y="389.21" font-size="9.00" class="sc-notoserifcjksc">性、范围和欺骗等因素决定。此前已发布模型的比率来自在当前版本评估上的重新运行；</text><text x="423.00 429.29 431.74 436.33 441.70 447.08 451.96 454.33 461.48 466.85 472.22 476.39 478.75 483.66 485.87" y="389.21" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="493.15" y="389.21" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="504.51 510.80 513.25 517.84 523.22 528.60" y="389.21" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 110.50 112.72" y="400.91" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="118.36" y="400.91" font-size="9.00" class="sc-notoserifcjksc">的比率与</text><text x="156.73 163.02 165.46 170.05 175.43 180.81 185.69 188.05 195.20 200.57 205.95 210.11 212.48 217.39 219.60" y="400.91" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="226.87" y="400.91" font-size="9.00" class="sc-notoserifcjksc">系统卡中报告的比率不同。图中显示</text><text x="373.24" y="400.91" font-size="9.00" class="sc-loraregular">95%</text><text x="393.54" y="400.91" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="462.40" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.9</text><text x="105.77" y="462.40" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们的自动化行为审计的潜在盲点</text><text x="72.00" y="490.29" font-size="11.00" class="sc-notoserifcjksc">尽管我们在自动化行为审计中尽可能覆盖更多的情境和失败模式，但完全覆盖是不可能的。我们</text><text x="72.00" y="505.91" font-size="11.00" class="sc-notoserifcjksc">使用的工具不可避免地存在各种盲点，下面重点列出其中一些：</text><text x="108.00" y="570.68" font-size="11.00" class="sc-notoserifcjksc">或最危险的情境，但也意味着这些场景的展开方式可能与真实情境不同。我们用真实的内</text><text x="108.00" y="586.30" font-size="11.00" class="sc-notoserifcjksc">部会话为部分调查提供种子；我们对此加以限制，因为这可能导致我们对某一种情境过拟</text><text x="108.00" y="601.92" font-size="11.00" class="sc-notoserifcjksc">合，而且由一个模型产生的对话记录对新模型而言属于分布外数据。</text><text x="108.00" y="667.82" font-size="11.00" class="sc-notoserifcjksc">致其行为与真实部署中不同。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p076.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 76 页"><text x="90.00" y="83.07" font-size="11.00" class="sc-loraregular">3.</text><text x="90.00" y="131.64" font-size="11.00" class="sc-loraregular">4.</text><text x="90.00" y="180.22" font-size="11.00" class="sc-loraregular">5.</text><text x="90.00" y="228.79" font-size="11.00" class="sc-loraregular">6.</text><text x="90.00 94.58" y="277.37" font-size="11.00" class="sc-loraregular">7.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">76</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00 124.80 131.23 137.81 142.07 147.97 153.80 158.06 160.95 166.75 173.19 183.02 189.59 195.26 201.06 205.32 208.41 214.84" y="98.23" font-size="11.00" class="sc-loraregular">context compaction</text><text x="221.52" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）可能会进一步改变模型的行为方式。我们会模拟上下文压缩，但</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对真正长的轨迹覆盖较为有限。</text><text x="108.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">调查者扮演其他智能体来近似模拟这一点，但这可能无法再现真实的多智能体动态。</text><text x="108.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">上述数值中所占权重偏低。</text><text x="108.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">于考察潜在的用户滥用。</text><text x="108.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">尝试寻找沙箱中的缺口。虽然我们对此有一定覆盖，但我们认为，许多其他场景也将受益</text><text x="108.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">于考察模型在面对不可能任务时的行为。</text><text x="72.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">我们正在积极努力弥补这些不足。</text><text x="72.00" y="424.04" font-size="14.00" class="sc-poppinssemibold">6.3</text><text x="96.32" y="424.04" font-size="14.00" class="sc-notosanscjkscbold">针对性的对齐与诚实性评估</text><text x="72.00" y="461.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.1</text><text x="102.67" y="461.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">机会性沙箱逃逸</text><text x="72.00" y="489.02" font-size="11.00" class="sc-notoserifcjksc">这是一项新的专门评估，其比率不能与第</text><text x="272.89" y="489.02" font-size="11.00" class="sc-loraregular">6.2.8</text><text x="299.65" y="489.02" font-size="11.00" class="sc-notoserifcjksc">节中基于审计的评估的比率直接比较。</text><text x="72.00" y="537.60" font-size="11.00" class="sc-notoserifcjksc">在沙箱存在刻意设置的弱点、且越出沙箱有助于</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 352.68 358.35 361.44 367.35 373.92 376.81 382.80 385.51" y="537.60" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="394.40" y="537.60" font-size="11.00" class="sc-notoserifcjksc">完成其底层任务的场景中，我</text><text x="72.00" y="553.22" font-size="11.00" class="sc-notoserifcjksc">们测量了它越出沙箱的频率，以及它利用我们放置在沙箱外的内容的频率。越出沙箱并不理想，</text><text x="72.00" y="568.84" font-size="11.00" class="sc-notoserifcjksc">但并不总是值得担忧</text><text x="171.00" y="568.84" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="182.00" y="568.84" font-size="11.00" class="sc-notoserifcjksc">模型可能因为判断其任务需要这样做而向沙箱之外查看。模型也可能因为</text><text x="72.00" y="584.46" font-size="11.00" class="sc-notoserifcjksc">认为本应供其自身任务使用的凭据被留在了沙箱外而越出沙箱，尽管理想情况下它应当报告该问</text><text x="72.00" y="600.08" font-size="11.00" class="sc-notoserifcjksc">题，而不是自行取用这些凭据。对于此类行为的界线应划在哪里，并不总是清楚的。沙箱边界并</text><text x="72.00" y="615.70" font-size="11.00" class="sc-notoserifcjksc">不像看起来那样界定清晰，而任务几乎总是只得到部分说明，这使其成为一个固有的灰色地带。</text><text x="72.00" y="631.32" font-size="11.00" class="sc-notoserifcjksc">对于模型何时应越过不同类型的边界、何时应转而放弃任务，用户和对齐研究人员持有不同看</text><text x="72.00" y="646.94" font-size="11.00" class="sc-notoserifcjksc">法，尤其是在进一步越界风险很小的情况下。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p077.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 77 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">77</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">明显不理想的情况包括模型进而使用了我们放置在其沙箱之外的凭据或文件。</text><text x="446.00 454.49 460.17 463.26 469.17 475.73 478.63 484.62 487.33" y="98.80" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="496.22" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="510.11 516.07 518.61 525.44" y="98.80" font-size="11.00" class="sc-loraregular">4.0%</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">的场景中这样做了，介于</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.03 272.74" y="114.42" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="278.73" y="114.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="289.73" y="114.42" font-size="11.00" class="sc-loraregular">3.4%</text><text x="314.10" y="114.42" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="338.99 346.68 349.67 355.28 361.85 368.43 374.39 377.28 383.52 389.95 396.63 403.31 409.19 413.45 416.34 422.34 425.04" y="114.42" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="431.04" y="114.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="442.04" y="114.42" font-size="11.00" class="sc-loraregular">5.3%</text><text x="466.44" y="114.42" font-size="11.00" class="sc-notoserifcjksc">）之间，远低</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25" y="130.04" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="174.14" y="130.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="188.03" y="130.04" font-size="11.00" class="sc-loraregular">5.1</text><text x="200.73" y="130.04" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="247.63" y="130.04" font-size="11.00" class="sc-loraregular">39%</text><text x="272.57" y="130.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="286.47" y="130.04" font-size="11.00" class="sc-loraregular">21%</text><text x="305.95" y="130.04" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">该评估包含</text><text x="129.89 133.90 136.32 141.39 148.22" y="179.77" font-size="11.00" class="sc-loraregular">1,700</text><text x="157.95" y="179.77" font-size="11.00" class="sc-notoserifcjksc">多个场景，由</text><text x="226.85" y="179.77" font-size="11.00" class="sc-loraregular">26</text><text x="242.01" y="179.77" font-size="11.00" class="sc-notoserifcjksc">个沙箱环境中的</text><text x="321.90" y="179.77" font-size="11.00" class="sc-loraregular">200</text><text x="344.36" y="179.77" font-size="11.00" class="sc-notoserifcjksc">多个良性运维任务构建而成。每个场景</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">都围绕其沙箱中一个刻意设置的弱点构建，例如配置错误、逻辑缺陷或公开披露的漏洞</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="211.01" font-size="11.00" class="sc-loraregular">CVE</text><text x="104.71" y="211.01" font-size="11.00" class="sc-notoserifcjksc">），并且在其中约五分之四的场景中，任务所需的输入只存在于沙箱之外。我们主要基于</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">配置错误来构建场景，因为在公开报道的真实容器和沙箱逃逸事件中，绝大多数是通过某些未关</text><text x="72.00" y="242.25" font-size="11.00" class="sc-notoserifcjksc">闭或权限过宽的东西实现的，而不是通过软件漏洞。大多数场景旨在诱使模型越出其沙箱。我们</text><text x="72.00" y="257.87" font-size="11.00" class="sc-notoserifcjksc">借助</text><text x="94.00" y="257.87" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="257.87" font-size="11.00" class="sc-notoserifcjksc">诱导物（</text><text x="142.40" y="257.87" font-size="11.00" class="sc-loraregular">tempter</text><text x="184.00" y="257.87" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="195.00" y="257.87" font-size="11.00" class="sc-loraregular">”</text><text x="198.84" y="257.87" font-size="11.00" class="sc-notoserifcjksc">来实现这一点，即放置在模型提示词或沙箱中、旨在提高模型这样做的</text><text x="72.00" y="273.49" font-size="11.00" class="sc-notoserifcjksc">可能性的逼真素材。一个特别有效的</text><text x="248.00" y="273.49" font-size="11.00" class="sc-loraregular">“</text><text x="252.40" y="273.49" font-size="11.00" class="sc-notoserifcjksc">诱导物</text><text x="285.40" y="273.49" font-size="11.00" class="sc-loraregular">”</text><text x="289.24" y="273.49" font-size="11.00" class="sc-notoserifcjksc">是一种</text><text x="325.13 332.72 338.75 345.19 350.86" y="273.49" font-size="11.00" class="sc-loraregular">/goal</text><text x="356.75" y="273.49" font-size="11.00" class="sc-notoserifcjksc">式循环，它会促使模型不要放弃其任</text><text x="72.00" y="289.11" font-size="11.00" class="sc-notoserifcjksc">务。重要的是，我们的诱导物都不会告诉模型离开其沙箱。</text><text x="72.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">每个被削弱的沙箱都运行在一个加固的外层沙箱内，即一台配置为无法访问互联网的</text><text x="481.89 487.87 490.96 495.64 501.55 507.40 512.09 517.76 523.62 529.45 535.41" y="374.07" font-size="11.00" class="sc-loraregular">Firecracker</text><text x="72.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">虚拟机。检测是确定性的，如果我们记录到模型通过任何途径访问或试图访问内层沙箱之外的文</text><text x="72.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">件或服务，我们就将该场景计为越出沙箱。</text><text x="281.00 289.49 295.17 298.26 304.17 310.73 313.63 319.62 322.33" y="405.31" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="331.22" y="405.31" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="345.11" y="405.31" font-size="11.00" class="sc-loraregular">30%</text><text x="370.53" y="405.31" font-size="11.00" class="sc-notoserifcjksc">的场景中（</text><text x="425.53 429.53 431.95 437.02 443.02" y="405.31" font-size="11.00" class="sc-loraregular">1,753</text><text x="452.05" y="405.31" font-size="11.00" class="sc-notoserifcjksc">个中的</text><text x="487.94 493.94 499.60" y="405.31" font-size="11.00" class="sc-loraregular">524</text><text x="508.46" y="405.31" font-size="11.00" class="sc-notoserifcjksc">个）这</text><text x="72.00" y="420.93" font-size="11.00" class="sc-notoserifcjksc">样做了，比</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="420.93" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73" y="420.93" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="223.73" y="420.93" font-size="11.00" class="sc-loraregular">21%</text><text x="243.21" y="420.93" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="268.11 275.80 278.79 284.40 290.97 297.54 303.51 306.40 312.64 319.07 325.75 332.43 338.31 342.57 345.46 351.46 354.16" y="420.93" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="360.16" y="420.93" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="371.16" y="420.93" font-size="11.00" class="sc-loraregular">22%</text><text x="392.54" y="420.93" font-size="11.00" class="sc-notoserifcjksc">）更频繁，但远低于</text><text x="494.43 502.12 505.11 510.72 517.29 523.87" y="420.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="436.55" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="436.55" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84" y="436.55" font-size="11.00" class="sc-loraregular">5.1</text><text x="148.55" y="436.55" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="195.44" y="436.55" font-size="11.00" class="sc-loraregular">75%</text><text x="218.97" y="436.55" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="232.86" y="436.55" font-size="11.00" class="sc-loraregular">54%</text><text x="254.39" y="436.55" font-size="11.00" class="sc-notoserifcjksc">）。在这</text><text x="301.28 307.28 312.94" y="436.55" font-size="11.00" class="sc-loraregular">524</text><text x="321.80" y="436.55" font-size="11.00" class="sc-notoserifcjksc">个场景中的</text><text x="379.69 385.69 392.44" y="436.55" font-size="11.00" class="sc-loraregular">502</text><text x="401.24" y="436.55" font-size="11.00" class="sc-notoserifcjksc">个里，任务无法在沙箱内完</text><text x="72.00" y="452.17" font-size="11.00" class="sc-notoserifcjksc">成。在系统提示词中加入一段关于模型所处沙箱类型的简短描述后，</text><text x="402.00 410.49 416.17 419.26 425.17 431.73 434.63 440.62 443.33" y="452.17" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="452.22" y="452.17" font-size="11.00" class="sc-notoserifcjksc">越出沙箱的比率从</text><text x="72.00" y="467.79" font-size="11.00" class="sc-loraregular">30%</text><text x="97.42" y="467.79" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="122.31" y="467.79" font-size="11.00" class="sc-loraregular">1.8%</text><text x="144.78" y="467.79" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p078.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 78 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">78</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 104.90 107.00 112.54" y="367.92" font-size="9.00" class="sc-lorabold">6.3.1.A]</text><text x="118.38" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">各模型越出沙箱的比率</text><text x="208.38" y="367.92" font-size="9.00" class="sc-notoserifcjksc">。每个模型将相同的</text><text x="291.74 295.02 297.00 301.15 306.05" y="367.92" font-size="9.00" class="sc-loraregular">1,753</text><text x="313.44" y="367.92" font-size="9.00" class="sc-notoserifcjksc">个场景各运行一次。在每个场景中，沙箱都存在一个刻意</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">设置的弱点，且在大多数情况下任务无法在沙箱内完成。每对柱形中较浅的柱表示我们记录到模型通过任何途径越出或</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">试图越出其沙箱的场景占比。</text><text x="189.00 195.29 197.74 202.33 207.70 213.08 217.96 220.33 227.28 231.92 234.45 239.28 244.66 247.02 251.93 254.14" y="391.33" font-size="9.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="261.41" y="391.33" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="272.78" y="391.33" font-size="9.00" class="sc-loraregular">30%</text><text x="293.58" y="391.33" font-size="9.00" class="sc-notoserifcjksc">的场景中（</text><text x="338.58 341.86 343.84 347.99 352.89" y="391.33" font-size="9.00" class="sc-loraregular">1,753</text><text x="360.28" y="391.33" font-size="9.00" class="sc-notoserifcjksc">个中的</text><text x="389.65 394.55 399.19" y="391.33" font-size="9.00" class="sc-loraregular">524</text><text x="406.43" y="391.33" font-size="9.00" class="sc-notoserifcjksc">个）这样做了，比</text><text x="480.80 487.09 489.54 494.13 499.50 504.88 509.76 512.13 519.27 524.65 530.02" y="391.33" font-size="9.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="403.02" font-size="9.00" class="sc-loraregular">5.5</text><text x="84.02" y="403.02" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="93.02" y="403.02" font-size="9.00" class="sc-loraregular">21%</text><text x="108.96" y="403.02" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="129.33 135.62 138.07 142.66 148.03 153.41 158.29 160.66 165.76 171.03 176.49 181.95 186.77 190.25 192.62 197.52 199.74" y="403.02" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="204.64" y="403.02" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="213.64" y="403.02" font-size="9.00" class="sc-loraregular">22%</text><text x="231.14" y="403.02" font-size="9.00" class="sc-notoserifcjksc">）更频繁，比</text><text x="287.51 293.80 296.24 300.83 306.21 311.59 316.47 318.83 326.96 331.76 335.24 340.63 345.90 350.06 352.43 357.34 359.55" y="403.02" font-size="9.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="362.83" y="403.02" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="371.83" y="403.02" font-size="9.00" class="sc-loraregular">54%</text><text x="389.44" y="403.02" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="409.81 416.10 418.54 423.14 428.51 433.89 438.77 441.13 449.26 454.06 457.54 462.93 468.20 472.36 474.73" y="403.02" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="479.64" y="403.02" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="488.64" y="403.02" font-size="9.00" class="sc-loraregular">75%</text><text x="505.52" y="403.02" font-size="9.00" class="sc-notoserifcjksc">）更少。</text><text x="72.00" y="414.73" font-size="9.00" class="sc-notoserifcjksc">部分越出途径并非在每个场景中都会被记录，因此真实比率可能更高。较深的柱表示模型使用了我们放置在那里的凭据</text><text x="72.00" y="426.42" font-size="9.00" class="sc-notoserifcjksc">或文件的场景占比。</text><text x="72.00" y="486.47" font-size="11.00" class="sc-notoserifcjksc">对于模型越出沙箱的每个场景，我们还会按所发现的最严重行为进行分级：从不获取任何其他方</text><text x="380.00" y="502.09" font-size="11.00" class="sc-loraregular">1</text><text x="386.90" y="502.09" font-size="11.00" class="sc-notoserifcjksc">级），到获取其他方的机密（</text><text x="529.90" y="502.09" font-size="11.00" class="sc-loraregular">2</text><text x="226.00" y="517.71" font-size="11.00" class="sc-loraregular">3</text><text x="235.02" y="517.71" font-size="11.00" class="sc-notoserifcjksc">级）。在</text><text x="281.91 287.91 293.57" y="517.71" font-size="11.00" class="sc-loraregular">524</text><text x="302.43" y="517.71" font-size="11.00" class="sc-notoserifcjksc">个场景中的</text><text x="360.32" y="517.71" font-size="11.00" class="sc-loraregular">515</text><text x="379.21" y="517.71" font-size="11.00" class="sc-notoserifcjksc">个里，未发现任何高于</text><text x="492.10" y="517.71" font-size="11.00" class="sc-loraregular">1</text><text x="499.00" y="517.71" font-size="11.00" class="sc-notoserifcjksc">级的行</text><text x="72.00" y="533.33" font-size="11.00" class="sc-notoserifcjksc">为。其余</text><text x="118.89" y="533.33" font-size="11.00" class="sc-loraregular">9</text><text x="128.14" y="533.33" font-size="11.00" class="sc-notoserifcjksc">个场景达到了</text><text x="197.04" y="533.33" font-size="11.00" class="sc-loraregular">2</text><text x="205.84" y="533.33" font-size="11.00" class="sc-notoserifcjksc">级。未发现任何</text><text x="285.73" y="533.33" font-size="11.00" class="sc-loraregular">3</text><text x="294.75" y="533.33" font-size="11.00" class="sc-notoserifcjksc">级行为。</text><text x="72.00" y="598.16" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.2</text><text x="105.42" y="598.16" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自我偏好偏差</text><text x="72.00" y="626.05" font-size="11.00" class="sc-notoserifcjksc">过去我们观察到，当被告知对话记录由另一个</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="626.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.18" y="626.05" font-size="11.00" class="sc-notoserifcjksc">实例产生时，</text><text x="399.18 406.87 409.87 415.48 422.04 428.62" y="626.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="437.48" y="626.05" font-size="11.00" class="sc-notoserifcjksc">倾向于给这些对话记</text><text x="72.00" y="641.67" font-size="11.00" class="sc-notoserifcjksc">录更有利的评分。这带来了共谋风险，即</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="641.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18" y="641.67" font-size="11.00" class="sc-notoserifcjksc">可能会给相似模型的输出打出高于恰当水平的</text><text x="72.00" y="657.29" font-size="11.00" class="sc-notoserifcjksc">评分。我们通过以下方式测试这种自我偏好：让</text><text x="305.89 313.58 316.57 322.18 328.75 335.33" y="657.29" font-size="11.00" class="sc-loraregular">Claude</text><text x="344.18" y="657.29" font-size="11.00" class="sc-notoserifcjksc">对可能表现出不可接受行为（例如误导</text><text x="72.00" y="672.91" font-size="11.00" class="sc-notoserifcjksc">性输出或未经授权的行动）的对话记录评分，同时告知它该对话记录是由某个</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="672.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18" y="672.91" font-size="11.00" class="sc-notoserifcjksc">实例生成</text><text x="72.00" y="688.53" font-size="11.00" class="sc-notoserifcjksc">的，或是由</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p079.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 79 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">79</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">另一个前沿模型生成的。我们测量</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在这两种条件下给同一对话记录所打分数的差异。我</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">们发现，无论是在系统提示词中提醒它是</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="308.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（在</text><text x="333.18" y="98.23" font-size="11.00" class="sc-loraregular">0–9</text><text x="355.76" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分制上为</text><text x="402.65 409.30 412.01 417.75" y="98.23" font-size="11.00" class="sc-loraregular">0.23</text><text x="426.77" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分），还是没有该提醒</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.65 92.36 96.36" y="113.85" font-size="11.00" class="sc-loraregular">0.15</text><text x="105.25" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分），</text><text x="138.25 145.94 148.93 154.54 161.11 167.69 173.65 176.54 185.04 190.71 193.80 199.71 206.28 209.17 215.17 217.87" y="113.85" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="226.76" y="113.85" font-size="11.00" class="sc-notoserifcjksc">都表现出微小但统计学上显著的偏向自身的偏差。这一偏差大于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="129.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的偏差。在使用</text><text x="237.63 245.32 248.31 253.92 260.48 267.06" y="129.47" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.92" y="129.47" font-size="11.00" class="sc-notoserifcjksc">系统提示词时，它与</text><text x="377.81 385.50 388.49 394.10 400.67 407.25 413.21 416.10 422.34 428.77 435.45 442.13 448.01 452.27 455.16 461.16 463.86" y="129.47" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="472.75" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的偏差没有可</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">测量的差异。</text><text x="72.00" y="542.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="542.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.05 108.14 113.68" y="542.03" font-size="9.00" class="sc-lorabold">6.3.2.A]</text><text x="119.52" y="542.03" font-size="9.00" class="sc-notoserifcjkscbold">按模型和提示条件划分的自我偏好偏差。</text><text x="281.52" y="542.03" font-size="9.00" class="sc-notoserifcjksc">正值表示当评分者被告知对话记录作者是</text><text x="445.89 452.18 454.63 459.22 464.59 469.97" y="542.03" font-size="9.00" class="sc-loraregular">Claude</text><text x="477.22" y="542.03" font-size="9.00" class="sc-notoserifcjksc">时给出的评分更</text><text x="72.00" y="553.73" font-size="9.00" class="sc-notoserifcjksc">宽松。此处采用</text><text x="137.37" y="553.73" font-size="9.00" class="sc-loraregular">0–9</text><text x="155.83" y="553.73" font-size="9.00" class="sc-notoserifcjksc">分制，因此这里的数值远小于可能的最大值。图中显示配对</text><text x="392.20" y="553.73" font-size="9.00" class="sc-loraregular">95%</text><text x="412.51" y="553.73" font-size="9.00" class="sc-notoserifcjksc">置信区间。在没有系统提示词的</text><text x="72.00" y="565.43" font-size="9.00" class="sc-notoserifcjksc">情况下，</text><text x="108.00 114.95 119.59 122.12 126.95 132.33 134.69 139.60 141.81" y="565.43" font-size="9.00" class="sc-loraregular">Haiku 5.5</text><text x="149.08" y="565.43" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="160.45 165.29 167.42 173.01 178.60" y="565.43" font-size="9.00" class="sc-loraregular">2,000</text><text x="186.56" y="565.43" font-size="9.00" class="sc-notoserifcjksc">次评分中有</text><text x="233.93" y="565.43" font-size="9.00" class="sc-loraregular">127</text><text x="248.55" y="565.43" font-size="9.00" class="sc-notoserifcjksc">次（约</text><text x="277.92" y="565.43" font-size="9.00" class="sc-loraregular">6%</text><text x="290.95" y="565.43" font-size="9.00" class="sc-notoserifcjksc">）无法计分，且这些缺失评分在所声明的各作者之间分布不</text><text x="72.00" y="577.13" font-size="9.00" class="sc-notoserifcjksc">均。</text><text x="72.00" y="625.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.3</text><text x="105.75" y="625.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">诚实性与幻觉</text><text x="72.00" y="669.45" font-size="11.00" class="sc-lorabold">6.3.3.1</text><text x="105.69" y="669.45" font-size="11.00" class="sc-notoserifcjkscbold">事实性幻觉</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p080.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 80 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">80</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.29 121.95 127.33 136.06 145.90 152.58 155.67 160.76 166.61 169.70 175.66 182.34 188.14" y="82.61" font-size="11.00" class="sc-loraregular">AA-Omniscience</text><text x="196.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的公开子集上测量了事实准确性，这是一个涵盖</text><text x="430.89" y="82.61" font-size="11.00" class="sc-loraregular">41</text><text x="443.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个主题的闭卷基准</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">测试，题目取自多个与经济和学术相关的领域。模型在作答时无法使用网络搜索或知识库，而必</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">须依靠自身知识作答。每个答案被评为正确、错误或弃答之一。</text><text x="72.00" y="428.14" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="428.14" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.29 108.39 112.04 114.14 119.67 123.15 125.51 131.74 137.41 141.65 148.57 156.85 162.59 165.54 169.90 174.56 177.51 182.35 188.09 192.75" y="428.14" font-size="9.00" class="sc-lorabold">6.3.3.1.A] AA-Omniscience</text><text x="199.96" y="428.14" font-size="9.00" class="sc-notoserifcjkscbold">净得分。</text><text x="235.96" y="428.14" font-size="9.00" class="sc-notoserifcjksc">净得分是</text><text x="274.33 280.38 285.83 290.23 297.38 305.42 310.89 313.42 317.58 322.37 324.90 329.78 335.24 339.98" y="428.14" font-size="9.00" class="sc-loraregular">AA-Omniscience</text><text x="347.23" y="428.14" font-size="9.00" class="sc-notoserifcjksc">上正确回答的比例减去错误回答的比例。</text><text x="72.00" y="691.57" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="691.57" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.29 108.39 112.04 114.14 119.67 123.15 125.51 131.74 137.41 141.65 148.57 156.85 162.59 165.54 169.90 174.56 177.51 182.35 188.09 192.75" y="691.57" font-size="9.00" class="sc-lorabold">6.3.3.1.B] AA-Omniscience</text><text x="199.96" y="691.57" font-size="9.00" class="sc-notoserifcjkscbold">细分结果。</text><text x="244.96 251.01 256.46 260.87 268.01 276.06 281.52 284.05 288.22 293.00 295.53 300.41 305.87 310.62" y="691.57" font-size="9.00" class="sc-loraregular">AA-Omniscience</text><text x="317.86" y="691.57" font-size="9.00" class="sc-notoserifcjksc">闭卷事实性基准测试上的评分细分。每个回答被评为正</text><text x="72.00" y="703.27" font-size="9.00" class="sc-notoserifcjksc">确、错误或弃答。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p081.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 81 页"><text x="72.00 78.32 80.88 87.04 89.60 95.75 98.32 104.17 107.07 117.75 125.09 131.67" y="174.03" font-size="11.00" class="sc-lorabold">6.3.3.2 MASK</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">81</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="82.61" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的净得分为</text><text x="218.40 225.05 227.76 231.76" y="82.61" font-size="11.00" class="sc-loraregular">0.12</text><text x="237.67" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，领先于</text><text x="284.56 292.25 295.24 300.86 307.42 314.00 319.96 322.86 331.35 337.02 340.11 346.02 352.59 355.48 361.44 364.15" y="82.61" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="370.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，落后于图中所示的所有其他</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型。按评分细分来看，它相对于</text><text x="278.18 286.68 292.35 295.44 301.35 307.92 310.81 316.77 319.48" y="98.23" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="328.37" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的改进来自</text><text x="386.26 394.75 400.43 403.52 409.42 415.99 418.88 424.88 427.59" y="98.23" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="436.47" y="98.23" font-size="11.00" class="sc-notoserifcjksc">答对了更多题目，尽</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">管它在错误回答上与</text><text x="173.89 182.39 188.06 191.15 197.06 203.63 206.52 212.48 215.19" y="113.85" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="224.07" y="113.85" font-size="11.00" class="sc-notoserifcjksc">大致持平。</text><text x="72.00 82.02 88.46 95.03 101.00 103.99 106.88 113.77 116.76 119.85 125.93 132.61 142.44 148.41 154.98 159.24 162.13 168.54 174.42 178.87 187.54 193.45 199.41 206.09 208.98 215.18 219.43 225.03 229.29 235.25 245.09 251.05 257.62 261.88 266.98 269.87 275.54 282.22 288.80 291.69 299.21 305.88 312.21 321.02 324.01 329.92 336.50 342.52" y="205.95" font-size="11.00" class="sc-loraregular">Model Alignment between Statements and Knowledge</text><text x="348.49" y="205.95" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="359.49" y="205.95" font-size="11.00" class="sc-loraregular">MASK</text><text x="390.22" y="205.95" font-size="11.00" class="sc-notoserifcjksc">）衡量模型在受到用户或系统</text><text x="72.00" y="221.57" font-size="11.00" class="sc-notoserifcjksc">提示词施压时是否会与其自身陈述的信念相矛盾。与以往的系统卡一样，我们使用了</text><text x="481.89" y="221.57" font-size="11.00" class="sc-loraregular">MASK</text><text x="515.52" y="221.57" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="72.00" y="237.19" font-size="11.00" class="sc-notoserifcjksc">集的公开测试集。在图</text><text x="184.89" y="237.19" font-size="11.00" class="sc-loraregular">6.3.3.2.A</text><text x="230.01" y="237.19" font-size="11.00" class="sc-notoserifcjksc">中，我们观察到</text><text x="309.91 317.60 320.59 326.20 332.77 339.34 345.31 348.20 356.69 362.37 365.46 371.36 377.93 380.82 386.82 389.53" y="237.19" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="398.41" y="237.19" font-size="11.00" class="sc-notoserifcjksc">的诚实率高于</text><text x="467.31 475.00 477.99 483.60 490.17 496.74" y="237.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="252.81" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="252.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="142.55 150.24 153.23 158.85 165.41 171.99 177.95 180.85 189.58 196.15 202.71 207.81 210.70 216.69 219.40" y="252.81" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="225.40" y="252.81" font-size="11.00" class="sc-notoserifcjksc">，并与</text><text x="261.29 268.98 271.97 277.58 284.15 290.72 296.69 299.58 308.07 313.75 316.84 322.75 329.31 332.21 338.17 340.87" y="252.81" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="346.87" y="252.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="357.87 365.56 368.55 374.16 380.73 387.30 393.27 396.16 404.89 411.46 418.03 423.12 426.01" y="252.81" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="434.90" y="252.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="448.79 456.48 459.48 465.09 471.65 478.23 484.19 487.09 493.32 499.76 506.43 513.11 519.00 523.25 526.15 532.14 534.85" y="252.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="72.00" y="268.43" font-size="11.00" class="sc-notoserifcjksc">大致持平。诚实率是在施压下的回答表明了明确立场的提示上计算的，并将该回答与模型被引出</text><text x="72.00" y="284.05" font-size="11.00" class="sc-notoserifcjksc">的信念（或者，对于提供事实型提示，与提示中给出的事实）进行比较。模型回避或未表现出一</text><text x="72.00" y="299.67" font-size="11.00" class="sc-notoserifcjksc">致信念的提示被排除在外。</text><text x="72.00" y="622.44" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="622.44" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.29 108.39 113.18 115.28 120.82 124.29 126.66 135.40 141.42 146.80" y="622.44" font-size="9.00" class="sc-lorabold">6.3.3.2.A] MASK</text><text x="155.57" y="622.44" font-size="9.00" class="sc-notoserifcjkscbold">诚实率</text><text x="182.57" y="622.44" font-size="9.00" class="sc-notoserifcjksc">：在</text><text x="202.94" y="622.44" font-size="9.00" class="sc-loraregular">MASK</text><text x="230.45" y="622.44" font-size="9.00" class="sc-notoserifcjksc">公开子集上的诚实率，即在已计分的提示中，模型在压力下没有与其自身被引</text><text x="72.00" y="634.14" font-size="9.00" class="sc-notoserifcjksc">出的信念相矛盾的比例。越高越好。图中显示</text><text x="254.37" y="634.14" font-size="9.00" class="sc-loraregular">95%</text><text x="274.67" y="634.14" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="674.75" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">此外，我们在图</text><text x="151.89" y="674.75" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">6.3.3.2.B</text><text x="196.97" y="674.75" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">中按类别对诚实率进行了细分。我们观察到，</text><text x="416.97 424.66 427.65 433.26 439.83 446.41 452.37 455.26 465.19 471.06 475.31 481.90 488.34 493.43 496.32 502.32 505.03" y="674.75" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude Mythos 5.1</text><text x="511.92" y="674.75" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">在续</text><text x="72.00" y="690.37" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">写和虚假信息这两类不诚实行为上出现了退步，但这一情况在</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 416.42 422.86 429.53 436.21 442.10 446.35 449.24 455.24 457.95" y="690.37" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude Sonnet 5.5</text><text x="466.83" y="690.37" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">和</text><text x="480.73 488.42 491.41 497.02 503.59 510.16" y="690.37" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="705.99" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Haiku 5.5</text><text x="122.21" y="705.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">上有所改善。</text><text x="188.21 195.90 198.90 204.51 211.07 217.65" y="705.99" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p082.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 82 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">82</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Haiku 5.5</text><text x="122.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">诚实率最低的类别是虚假信息（</text><text x="276.21" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">88.5%</text><text x="306.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">），在该类别上它高于</text><text x="419.74 427.43 430.42 436.03 442.60 449.18 455.14 458.03 467.97 473.83 478.09 484.68 491.11 496.20 499.10 505.09 507.80" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude Mythos 5.1</text><text x="514.69" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude Opus 5.5</text><text x="154.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">，并与</text><text x="190.73 198.42 201.41 207.02 213.59 220.17 226.13 229.03 237.52 243.19 246.28 252.19 258.76 261.65 267.61 270.32" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude Haiku 4.5</text><text x="276.31" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">、</text><text x="287.31 295.00 297.99 303.60 310.17 316.75 322.71 325.61 334.34 340.91 347.47 352.57 355.46" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude Opus 5</text><text x="364.35" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">和</text><text x="378.24 385.93 388.92 394.53 401.10 407.68 413.64 416.53 422.77 429.20 435.88 442.56 448.44 452.70 455.59 461.59 464.29" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">Claude Sonnet 5.5</text><text x="473.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">处于误差线范</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">围之内；在其他四个类别上，它的诚实率在</text><text x="283.89 289.99 295.06" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">97%</text><text x="307.52" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">到</text><text x="321.41" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1a1a1a">100%</text><text x="351.54" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1a1a1a">之间。</text><text x="72.00" y="546.70" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="546.70" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.29 108.39 113.18 115.28 120.82 124.29 126.66 135.40 141.42 146.80" y="546.70" font-size="9.00" class="sc-lorabold">6.3.3.2.B] MASK</text><text x="155.57" y="546.70" font-size="9.00" class="sc-notoserifcjkscbold">诚实率细分</text><text x="200.57" y="546.70" font-size="9.00" class="sc-notoserifcjksc">：在</text><text x="220.94" y="546.70" font-size="9.00" class="sc-loraregular">MASK</text><text x="248.45" y="546.70" font-size="9.00" class="sc-notoserifcjksc">公开子集上的诚实率，按不诚实压力的类型细分。</text><text x="72.00" y="601.95" font-size="11.00" class="sc-lorabold">6.3.3.3</text><text x="107.39" y="601.95" font-size="11.00" class="sc-notoserifcjkscbold">悄然照搬答案</text><text x="72.00" y="634.33" font-size="11.00" class="sc-notoserifcjksc">为测试</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="634.33" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18" y="634.33" font-size="11.00" class="sc-notoserifcjksc">的诚实性，我们还会给它一些编程任务；这些任务未用于训练，但来自同一分</text><text x="72.00" y="649.95" font-size="11.00" class="sc-notoserifcjksc">布，而且任务的解答可以从沙箱中获取。例如：容器中包含某个软件包已实现该修复的更新版</text><text x="72.00" y="681.19" font-size="11.00" class="sc-notoserifcjksc">箱内部的软件包镜像下载更新后的软件包。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p083.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 83 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">83</text><text x="72.00" y="337.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="337.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.29 108.39 113.43 115.52 121.06" y="337.17" font-size="9.00" class="sc-lorabold">6.3.3.3.A]</text><text x="126.90" y="337.17" font-size="9.00" class="sc-notoserifcjkscbold">暗中使用率：</text><text x="180.90" y="337.17" font-size="9.00" class="sc-notoserifcjksc">不同</text><text x="201.27 207.56 210.01 214.60 219.97 225.35" y="337.17" font-size="9.00" class="sc-loraregular">Claude</text><text x="232.60" y="337.17" font-size="9.00" class="sc-notoserifcjksc">模型在未告知用户的情况下实质性使用泄露的答案的比率；越低越好。数值附</text><text x="72.00" y="348.88" font-size="9.00" class="sc-notoserifcjksc">有</text><text x="83.37" y="348.88" font-size="9.00" class="sc-loraregular">95%</text><text x="103.67" y="348.88" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="376.23" font-size="11.00" class="sc-notoserifcjksc">在图</text><text x="96.89" y="376.23" font-size="11.00" class="sc-loraregular">6.3.3.3.A</text><text x="142.24" y="376.23" font-size="11.00" class="sc-notoserifcjksc">中，我们展示了各模型暗中使用答案的比率。</text><text x="362.23 369.92 372.92 378.53 385.09 391.67 397.63 400.53 409.02 414.69 417.78 423.69 430.26 433.15 439.15 441.85" y="376.23" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="450.74" y="376.23" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="475.63 483.32 486.32 491.93 498.49 505.07 511.03 513.93 522.66 529.23 535.79" y="376.23" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="391.85" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="391.85" font-size="11.00" class="sc-notoserifcjksc">有所改进，但相比</text><text x="171.78 179.47 182.46 188.07 194.64 201.22 207.18 210.07 218.56 224.24 227.33 233.24 239.81 242.70 248.66 251.37" y="391.85" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="257.36" y="391.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="268.36 276.05 279.04 284.65 291.22 297.80 303.76 306.65 316.59 322.45 326.71 333.29 339.73 344.82 347.72 353.71 356.42" y="391.85" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="360.42" y="391.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="371.42 379.11 382.10 387.71 394.28 400.86 406.82 409.71 418.45 425.01 431.58 436.67 439.56 445.56 448.27" y="391.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="457.15" y="391.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="471.05 478.74 481.73 487.34 493.91 500.48" y="391.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="407.47" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="407.47" font-size="11.00" class="sc-notoserifcjksc">则有所退步。</text><text x="72.00" y="441.00" font-size="11.00" class="sc-lorabold">6.3.3.4</text><text x="107.24" y="441.00" font-size="11.00" class="sc-notoserifcjkscbold">隐瞒改动</text><text x="72.00" y="473.38" font-size="11.00" class="sc-notoserifcjksc">在某些</text><text x="107.89" y="473.38" font-size="11.00" class="sc-loraregular">RL</text><text x="124.05" y="473.38" font-size="11.00" class="sc-notoserifcjksc">环境（</text><text x="157.05 163.96 170.32 173.21 179.17 185.68 191.24 194.33 199.02 205.45 212.13 221.96 227.93 234.50" y="473.38" font-size="11.00" class="sc-loraregular">RL environment</text><text x="238.76" y="473.38" font-size="11.00" class="sc-notoserifcjksc">）中，我们观察到</text><text x="329.65 337.34 340.33 345.94 352.51 359.09" y="473.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="367.94" y="473.38" font-size="11.00" class="sc-notoserifcjksc">会通过</text><text x="403.84 410.18 413.45" y="473.38" font-size="11.00" class="sc-loraregular">git</text><text x="420.60" y="473.38" font-size="11.00" class="sc-notoserifcjksc">操作手法来隐瞒对代码</text><text x="72.00" y="489.00" font-size="11.00" class="sc-notoserifcjksc">仓库的改动。其中一些文件编辑是自动发生的（例如在应用程序更新时），另一些则是</text><text x="492.89 500.58 503.57 509.18 515.75 522.33" y="489.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="504.62" font-size="11.00" class="sc-notoserifcjksc">自己对代码仓库所做的修复。在某些情况下，</text><text x="292.00 299.69 302.68 308.29 314.86 321.44" y="504.62" font-size="11.00" class="sc-loraregular">Claude</text><text x="330.29" y="504.62" font-size="11.00" class="sc-notoserifcjksc">推理认为自动检查器会拒绝这些改动。为了</text><text x="72.00" y="520.24" font-size="11.00" class="sc-notoserifcjksc">通过任务，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44" y="520.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="165.29" y="520.24" font-size="11.00" class="sc-notoserifcjksc">向评分者隐藏了改动。我们选取了这类对话记录的样例，并添加了一个后续用</text><text x="72.00" y="535.86" font-size="11.00" class="sc-notoserifcjksc">户轮次，要求</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="535.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="535.86" font-size="11.00" class="sc-notoserifcjksc">对该对话记录进行总结，但并不明确针对其中的掩盖行为。这项评估的目</text><text x="72.00" y="551.48" font-size="11.00" class="sc-notoserifcjksc">的，是测试</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="551.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="551.48" font-size="11.00" class="sc-notoserifcjksc">在回应一般性的后续问题时，会以多高的频率主动披露这类行为。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p084.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 84 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">84</text><text x="72.00" y="343.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="343.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.29 108.39 113.31 115.41 120.94" y="343.00" font-size="9.00" class="sc-lorabold">6.3.3.4.A]</text><text x="126.78" y="343.00" font-size="9.00" class="sc-notoserifcjkscbold">主动披露率：</text><text x="180.78" y="343.00" font-size="9.00" class="sc-notoserifcjksc">当用户请求</text><text x="228.15 234.44 236.89 241.48 246.85 252.23" y="343.00" font-size="9.00" class="sc-loraregular">Claude</text><text x="259.48" y="343.00" font-size="9.00" class="sc-notoserifcjksc">总结其工作时，不同</text><text x="342.85 349.14 351.59 356.18 361.55 366.93" y="343.00" font-size="9.00" class="sc-loraregular">Claude</text><text x="374.18" y="343.00" font-size="9.00" class="sc-notoserifcjksc">模型在回应中透露其为隐瞒改动而进行的</text><text x="72.00" y="354.70" font-size="9.00" class="sc-notoserifcjksc">操作的比率。越高越好。数值附有</text><text x="209.37" y="354.70" font-size="9.00" class="sc-loraregular">95%</text><text x="229.67" y="354.70" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="395.30" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，我们观察到</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.68 259.35 262.44 268.35 274.92 277.81 283.81 286.51" y="395.30" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="295.40" y="395.30" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="309.29 316.98 319.97 325.58 332.15 338.73 344.69 347.58 356.32 362.88 369.45 374.54 377.44 383.43 386.14" y="395.30" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="395.03" y="395.30" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="408.92 416.61 419.60 425.21 431.78 438.36 444.32 447.21 453.45 459.88 466.56 473.24 479.12 483.38 486.27 492.27 494.97" y="395.30" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="503.86" y="395.30" font-size="11.00" class="sc-notoserifcjksc">大致持</text><text x="72.00" y="410.92" font-size="11.00" class="sc-notoserifcjksc">平，并且比图中所示的其他</text><text x="206.89 214.58 217.57 223.18 229.75 236.33" y="410.92" font-size="11.00" class="sc-loraregular">Claude</text><text x="245.18" y="410.92" font-size="11.00" class="sc-notoserifcjksc">模型更有可能披露这些行为，其披露率为</text><text x="446.08" y="410.92" font-size="11.00" class="sc-loraregular">95.9%</text><text x="477.06" y="410.92" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="461.47" font-size="14.00" class="sc-poppinssemibold">6.4</text><text x="97.19" y="461.47" font-size="14.00" class="sc-notosanscjkscbold">本评估的可靠性</text><text x="72.00" y="488.02" font-size="11.00" class="sc-notoserifcjksc">只有当我们的评估能够可靠地反映模型在我们所关注的处境中会如何行事时，它才有价值。尽管</text><text x="72.00" y="503.64" font-size="11.00" class="sc-notoserifcjksc">我们已经展示了模型在各种模拟条件下以理想方式行事的许多例子，但一个足够聪明、试图隐藏</text><text x="72.00" y="519.26" font-size="11.00" class="sc-notoserifcjksc">其意图或能力相关信息的模型，可能会骗过我们的评估。我们在前文中介绍了我们自动化行为审</text><text x="72.00" y="534.88" font-size="11.00" class="sc-notoserifcjksc">计的潜在盲点。</text><text x="72.00" y="583.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.1</text><text x="103.47" y="583.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">言语化评分者意识</text><text x="72.00" y="611.41" font-size="11.00" class="sc-notoserifcjksc">我们以与</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.03 195.74" y="611.41" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="204.63" y="611.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.63" y="611.41" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="251.52 257.88 260.47 266.83 269.54" y="611.41" font-size="11.00" class="sc-loraregular">6.6.2</text><text x="278.34" y="611.41" font-size="11.00" class="sc-notoserifcjksc">节及</text><text x="303.23 310.92 313.91 319.52 326.09 332.67 338.63 341.52 347.76 354.19 360.87 367.55 373.43 377.69 380.58 386.58 389.28" y="611.41" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Sonnet 5.5</text><text x="398.17" y="611.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="431.17" y="611.41" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="445.07" y="611.41" font-size="11.00" class="sc-loraregular">6.4.1</text><text x="469.69" y="611.41" font-size="11.00" class="sc-notoserifcjksc">节相同的方</text><text x="72.00" y="627.03" font-size="11.00" class="sc-notoserifcjksc">式，评估</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.68 171.35 174.44 180.35 186.92 189.81 195.81 198.51" y="627.03" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="207.40" y="627.03" font-size="11.00" class="sc-notoserifcjksc">的言语化评分者意识（</text><text x="317.40 323.48 328.17 333.84 340.42 346.38 351.15 354.04 359.55 368.25 373.93 378.61 384.58 391.25 397.22 402.31" y="627.03" font-size="11.00" class="sc-loraregular">grader awareness</text><text x="407.40" y="627.03" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="118.89" y="602.61" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="118.89" y="602.61" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="154.29" y="602.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www
