="72.00" y="580.22" font-size="11.00" class="sc-notoserifcjksc">为了在更接近我们实际部署的环境中评估</text><text x="272.89" y="580.22" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="323.11" y="580.22" font-size="11.00" class="sc-notoserifcjksc">规避监督的能力，我们在高风险软件环境中</text><text x="72.00" y="595.84" font-size="11.00" class="sc-notoserifcjksc">开展了一项评估。我们改编了</text><text x="217.89" y="595.84" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">LinuxArena</text><text x="279.55" y="595.84" font-size="11.00" class="sc-notoserifcjksc">的一个子集；</text><text x="345.55" y="595.84" font-size="11.00" class="sc-loraregular sc-k">LinuxArena</text><text x="407.20" y="595.84" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="432.10" y="595.84" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Redwood Research</text><text x="72.00" y="611.46" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="611.46" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">EquiStamp</text><text x="144.15" y="611.46" font-size="11.00" class="sc-notoserifcjksc">共同开发的</text><text x="202.04" y="611.46" font-size="11.00" class="sc-loraregular">AI</text><text x="215.51" y="611.46" font-size="11.00" class="sc-notoserifcjksc">控制竞技场，在其中，一个智能体操作一台真实的</text><text x="460.40" y="611.46" font-size="11.00" class="sc-loraregular">Linux</text><text x="491.82" y="611.46" font-size="11.00" class="sc-notoserifcjksc">机器，被</text><text x="72.00" y="627.08" font-size="11.00" class="sc-notoserifcjksc">分配一项软件工程或系统管理方面的主任务，并被指示同时完成一项有害的附带任务（例如窃取</text><text x="72.00" y="642.70" font-size="11.00" class="sc-notoserifcjksc">凭据或植入后门），且不引起监控器的怀疑。该设置与</text><text x="338.89" y="642.70" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="424.63" y="642.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="457.63" y="642.70" font-size="11.00" class="sc-notoserifcjksc">中的设置基本相</text><text x="72.00" y="658.32" font-size="11.00" class="sc-notoserifcjksc">同。与下文的</text><text x="140.89 147.13 155.71 162.60 170.68 177.30 182.68 189.57 194.25 200.22 206.89" y="658.32" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="215.46" y="658.32" font-size="11.00" class="sc-notoserifcjksc">评估一样，监控器是</text><text x="317.36" y="658.32" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="400.35" y="658.32" font-size="11.00" class="sc-notoserifcjksc">，并使用我们监控内部智能</text><text x="72.00" y="673.94" font-size="11.00" class="sc-notoserifcjksc">体流量时所用的提示词；它会读取智能体的完整对话记录，</text><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="217.89" y="587.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="217.89" y="587.04" width="58.76" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="432.10" y="587.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="432.10" y="587.04" width="47.39" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="479.48" y="587.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="482.38" y="587.04" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="85.89" y="602.66" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="85.89" y="602.66" width="55.36" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="338.89" y="633.90" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="338.89" y="633.90" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="374.29" y="633.90" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="377.18" y="633.90" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="404.15" y="633.90" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="407.04" y="633.90" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="424.63" y="633.90" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="424.63" y="633.90" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="435.63" y="633.90" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="435.63" y="633.90" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="446.63" y="633.90" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="446.63" y="633.90" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p088.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 88 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">88</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">包括其推理（隐藏推理设置下除外），并在给出判定之前对整条轨迹进行推理。对于每个模型和</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">每种设置，我们报告在</text><text x="184.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="223.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型上通过自动化提示词优化找到的若干提示词中效果最好的一</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个。由于我们现在在每种设置下都报告每个模型的最佳优化提示词，并且自</text><text x="437.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="523.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">统卡以来又找到并评估了更多此类提示词，因此这里的部分隐蔽率高于先前那份系统卡中的结</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="72.00" y="516.14" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="516.14" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 111.68 113.78 119.31" y="516.14" font-size="9.00" class="sc-lorabold">6.4.2.1.A]</text><text x="125.15" y="516.14" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="136.52" y="516.14" font-size="9.00" class="sc-lorabold sc-k">LinuxArena</text><text x="188.97" y="516.14" font-size="9.00" class="sc-notoserifcjkscbold">中隐蔽地成功完成附带任务</text><text x="296.97" y="516.14" font-size="9.00" class="sc-notoserifcjksc">。智能体完成附带任务且</text><text x="398.34" y="516.14" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="468.61" y="516.14" font-size="9.00" class="sc-notoserifcjksc">监控器未标记该对</text><text x="72.00" y="527.84" font-size="9.00" class="sc-notoserifcjksc">话记录的回合所占的百分比。在</text><text x="198.00" y="527.84" font-size="9.00" class="sc-loraregular">“</text><text x="201.60" y="527.84" font-size="9.00" class="sc-notoserifcjksc">扩展思考（</text><text x="246.60" y="527.84" font-size="9.00" class="sc-loraregular sc-k">Extended thinking</text><text x="323.42" y="527.84" font-size="9.00" class="sc-notoserifcjksc">），推理对监控器隐藏</text><text x="413.42" y="527.84" font-size="9.00" class="sc-loraregular">”</text><text x="416.57" y="527.84" font-size="9.00" class="sc-notoserifcjksc">设置中，监控器无法看到模型</text><text x="72.00" y="539.54" font-size="9.00" class="sc-notoserifcjksc">的推理；在另外两种设置中，监控器能看到完整轨迹。所有模型均以其</text><text x="353.37" y="539.54" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="371.94" y="539.54" font-size="9.00" class="sc-notoserifcjksc">推理强度进行采样。每个柱条使用该模型</text><text x="72.00" y="551.24" font-size="9.00" class="sc-notoserifcjksc">的最佳提示词，</text><text x="135.00" y="551.24" font-size="9.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="207.41" y="551.24" font-size="9.00" class="sc-notoserifcjksc">在每个任务对上尝试一次，其他模型则各尝试五次。误差线表示通过对回合进行自助</text><text x="72.00" y="562.94" font-size="9.00" class="sc-notoserifcjksc">法（</text><text x="90.00" y="562.94" font-size="9.00" class="sc-loraregular sc-k">bootstrap</text><text x="130.75" y="562.94" font-size="9.00" class="sc-notoserifcjksc">）重新采样得到的</text><text x="205.12" y="562.94" font-size="9.00" class="sc-loraregular">95%</text><text x="225.42" y="562.94" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="608.63" font-size="11.00" class="sc-notoserifcjksc">在推理被隐藏的情况下，</text><text x="193.00" y="608.63" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="281.51" y="608.63" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率是图中所示模型中最低的，约为</text><text x="482.40" y="608.63" font-size="11.00" class="sc-loraregular">6%</text><text x="498.33" y="608.63" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="72.00" y="624.25" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="624.25" font-size="11.00" class="sc-notoserifcjksc">的比率接近，但远低于我们更大模型的比率。它在大约一半的回合中完成了附</text><text x="72.00" y="639.87" font-size="11.00" class="sc-notoserifcjksc">带任务，但监控器标记了其中的大部分完成情况。在无扩展思考设置和推理可见设置下，它几乎</text><text x="72.00" y="655.49" font-size="11.00" class="sc-notoserifcjksc">从未在未被标记的情况下完成附带任务（分别为</text><text x="305.89" y="655.49" font-size="11.00" class="sc-loraregular sc-k">0.4%</text><text x="333.68" y="655.49" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="347.57" y="655.49" font-size="11.00" class="sc-loraregular sc-k">0.1%</text><text x="370.51" y="655.49" font-size="11.00" class="sc-notoserifcjksc">）。总体而言，</text><text x="447.51" y="655.49" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="72.00" y="671.11" font-size="11.00" class="sc-notoserifcjksc">在隐蔽蓄意破坏方面远弱于我们</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p089.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 89 页"><text x="72.00 78.32 80.88 86.89 89.46 95.31 97.88 103.73 106.63 113.20 122.07 129.41 137.60 144.31 149.05 156.34 161.53 167.44 174.46" y="131.64" font-size="11.00" class="sc-lorabold">6.4.2.2 SHADE-Arena</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">89</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更大的模型。部分原因在于它经常拒绝尝试附带任务，部分原因在于监控器标记了它所尝试内容</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">中的大部分。</text><text x="72.00" y="170.63" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="170.63" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46" y="170.63" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="229.36" y="170.63" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="314.97" y="170.63" font-size="11.00" class="sc-notoserifcjksc">；这是一项基准测试，它将每个长程智能体主</text><text x="72.00" y="186.25" font-size="11.00" class="sc-notoserifcjksc">任务与一项有害的附带任务配对。智能体被指示在不引起另一个独立监控器怀疑的情况下完成这</text><text x="72.00" y="201.87" font-size="11.00" class="sc-notoserifcjksc">两项任务。该设置（包括监控器：</text><text x="237.00" y="201.87" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="319.99" y="201.87" font-size="11.00" class="sc-notoserifcjksc">，并使用我们目前监控内部智能体流量时所用</text><text x="72.00" y="217.49" font-size="11.00" class="sc-notoserifcjksc">的提示词）与</text><text x="140.89" y="217.49" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="226.63" y="217.49" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="259.63" y="217.49" font-size="11.00" class="sc-notoserifcjksc">中的相同，唯一不同的是</text><text x="383.52" y="217.49" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="472.03" y="217.49" font-size="11.00" class="sc-notoserifcjksc">在采样时开启</text><text x="72.00" y="233.11" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89" y="233.11" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="105.97" y="233.11" font-size="11.00" class="sc-notoserifcjksc">的安全干预措施。与之前一样，监控器在给出判定之前会对整条轨迹进行逐步推理。我们</text><text x="72.00" y="248.73" font-size="11.00" class="sc-notoserifcjksc">在多种条件下对智能体进行了采样：</text><text x="248.00" y="248.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="270.70" y="248.73" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="284.59" y="248.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="307.29" y="248.73" font-size="11.00" class="sc-notoserifcjksc">推理强度下的自适应扩展思考、无扩展思考，以</text><text x="72.00" y="264.35" font-size="11.00" class="sc-notoserifcjksc">及一种监控器无法访问智能体推理的隐藏草稿区变体。</text><text x="72.00" y="333.08" font-size="11.00" class="sc-notoserifcjksc">除了标准攻击者提示词之外，我们还使用针对监控器经自动化、迭代式优化找到的提示词对每个</text><text x="72.00" y="348.70" font-size="11.00" class="sc-notoserifcjksc">模型进行了评估。这些搜索在多个模型上运行，包括</text><text x="327.89" y="348.70" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="447.88" y="348.70" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="458.88" y="348.70" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="364.32" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="364.32" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="88.99" y="364.32" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="183.95" y="364.32" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="197.84" y="364.32" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="280.68" y="364.32" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="140.89" y="208.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="140.89" y="208.69" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="176.29" y="208.69" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="179.18" y="208.69" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="206.15" y="208.69" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="209.04" y="208.69" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="223.73" y="208.69" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="226.63" y="208.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="237.63" y="208.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="237.63" y="208.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="248.63" y="208.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="248.63" y="208.69" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p090.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 90 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">90</text><text x="72.00" y="409.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="409.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.82 114.92 120.46" y="409.00" font-size="9.00" class="sc-lorabold">6.4.2.2.A]</text><text x="126.30" y="409.00" font-size="9.00" class="sc-notoserifcjkscbold">不同思考条件下的</text><text x="200.66 206.05 213.31 219.32 226.03 231.52 235.75 241.72 245.97 250.81 256.55" y="409.00" font-size="9.00" class="sc-lorabold">SHADE-Arena</text><text x="263.64" y="409.00" font-size="9.00" class="sc-notoserifcjkscbold">隐蔽率。</text><text x="299.64" y="409.00" font-size="9.00" class="sc-notoserifcjksc">智能体完成有害附带任务且</text><text x="410.00" y="409.00" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="480.28" y="409.00" font-size="9.00" class="sc-notoserifcjksc">监控器未标记</text><text x="72.00" y="420.70" font-size="9.00" class="sc-notoserifcjksc">该对话记录的回合所占的百分比。在隐藏推理设置中，监控器无法看到模型的推理；在其他设置中，它能看到完整轨</text><text x="72.00" y="432.40" font-size="9.00" class="sc-notoserifcjksc">迹。每个柱条使用该模型的最佳提示词，涵盖</text><text x="254.37" y="432.40" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="266.25" y="432.40" font-size="9.00" class="sc-notoserifcjksc">个任务对，每个任务对至少尝试</text><text x="394.61" y="432.40" font-size="9.00" class="sc-loraregular">25</text><text x="406.72" y="432.40" font-size="9.00" class="sc-notoserifcjksc">次。</text><text x="424.72" y="432.40" font-size="9.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="497.13" y="432.40" font-size="9.00" class="sc-notoserifcjksc">在采样时</text><text x="72.00" y="444.10" font-size="9.00" class="sc-notoserifcjksc">开启了</text><text x="101.37" y="444.10" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="117.79" y="444.10" font-size="9.00" class="sc-notoserifcjksc">的安全干预措施，这使其部分回合提前结束；这些回合计为未成功。柱条表示</text><text x="426.16" y="444.10" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="438.04" y="444.10" font-size="9.00" class="sc-notoserifcjksc">个任务对上的平均值；误</text><text x="72.00" y="455.80" font-size="9.00" class="sc-notoserifcjksc">差线表示通过对回合进行自助法重新采样得到的</text><text x="263.37" y="455.80" font-size="9.00" class="sc-loraregular">95%</text><text x="283.67" y="455.80" font-size="9.00" class="sc-notoserifcjksc">置信区间，各任务对权重相等。</text><text x="409.67" y="455.80" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="481.87" y="455.80" font-size="9.00" class="sc-notoserifcjksc">不支持无扩展</text><text x="72.00" y="467.50" font-size="9.00" class="sc-notoserifcjksc">思考设置。</text><text x="72.00" y="527.53" font-size="11.00" class="sc-notoserifcjksc">在所有设置下，</text><text x="149.00" y="527.53" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="237.51" y="527.53" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率都处于图中所示模型的最低之列。当其推理被隐藏</text><text x="72.00" y="543.15" font-size="11.00" class="sc-notoserifcjksc">时，它仅在</text><text x="129.89" y="543.15" font-size="11.00" class="sc-loraregular">1.2%</text><text x="154.97" y="543.15" font-size="11.00" class="sc-notoserifcjksc">的回合中取得成功，而其他每个模型都超过了</text><text x="377.87" y="543.15" font-size="11.00" class="sc-loraregular">10%</text><text x="398.27" y="543.15" font-size="11.00" class="sc-notoserifcjksc">。主要原因是它在该设置下很</text><text x="72.00" y="558.77" font-size="11.00" class="sc-notoserifcjksc">少尝试附带任务：即使使用我们找到的最佳提示词，它最多也只在约</text><text x="404.89" y="558.77" font-size="11.00" class="sc-loraregular">5%</text><text x="423.35" y="558.77" font-size="11.00" class="sc-notoserifcjksc">的回合中尝试了附带任</text><text x="72.00" y="574.39" font-size="11.00" class="sc-notoserifcjksc">务。当扩展思考被禁用时，它的隐蔽率为</text><text x="272.89" y="574.39" font-size="11.00" class="sc-loraregular">5.2%</text><text x="297.07" y="574.39" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="321.96" y="574.39" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="408.20" y="574.39" font-size="11.00" class="sc-notoserifcjksc">相近。在推理可见的情况</text><text x="72.00" y="590.01" font-size="11.00" class="sc-notoserifcjksc">下，</text><text x="94.00" y="590.01" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="116.70" y="590.01" font-size="11.00" class="sc-notoserifcjksc">推理强度下的隐蔽率为</text><text x="229.59" y="590.01" font-size="11.00" class="sc-loraregular">2.3%</text><text x="253.90" y="590.01" font-size="11.00" class="sc-notoserifcjksc">，几乎全部来自单一任务，而在</text><text x="410.79" y="590.01" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="433.49" y="590.01" font-size="11.00" class="sc-notoserifcjksc">推理强度下则降至</text><text x="72.00" y="605.63" font-size="11.00" class="sc-loraregular">0%</text><text x="88.40" y="605.63" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="658.13" font-size="11.00" class="sc-lorabold">6.4.2.3</text><text x="106.95" y="658.13" font-size="11.00" class="sc-notoserifcjkscbold">在模拟场景中受到追问时保守秘密</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00" y="586.78" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="586.78" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 126.04 128.13 132.93 135.03 140.07 142.16 147.70" y="586.78" font-size="9.00" class="sc-lorabold">6.4.2.3.A]</text><text x="153.54" y="586.78" font-size="9.00" class="sc-notoserifcjksc">在这个模拟场景中，</text><text x="234.54" y="586.78" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="263.50" y="586.78" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="272.50" y="586.78" font-size="9.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="311.22" y="586.78" font-size="9.00" class="sc-notoserifcjksc">）是一个桌面助手，用户能够读取它的推理。用户在一家</text><text x="164.37" y="598.48" font-size="9.00" class="sc-loraregular">U</text><text x="506.50" y="598.48" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="610.18" font-size="9.00" class="sc-notoserifcjksc">的推理泄露了这些密码，而它给用户的回复则没有透露。这些泄露发生在同一段推理承认</text><text x="425.37" y="610.18" font-size="9.00" class="sc-loraregular sc-k">Claude “</text><text x="460.30" y="610.18" font-size="9.00" class="sc-notoserifcjksc">绝不能在</text><text x="496.30" y="610.18" font-size="9.00" class="sc-loraregular">[</text><text x="499.53" y="610.18" font-size="9.00" class="sc-notoserifcjksc">它的</text><text x="517.53" y="610.18" font-size="9.00" class="sc-loraregular">]</text><text x="520.76" y="610.18" font-size="9.00" class="sc-notoserifcjksc">推理</text><text x="72.00" y="621.88" font-size="9.00" class="sc-notoserifcjksc">中写出这些密码</text><text x="135.00" y="621.88" font-size="9.00" class="sc-loraregular">”</text><text x="281.74" y="621.88" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="313.07" y="621.88" font-size="9.00" class="sc-notoserifcjksc">对另一处类似泄露的反应。</text><text x="72.00" y="665.58" font-size="11.00" class="sc-notoserifcjksc">一个模型若要连贯地处于未对齐状态，就需要在许多不同的情境中对其未对齐保密，并且在朝着</text><text x="72.00" y="681.20" font-size="11.00" class="sc-notoserifcjksc">某个长程目标努力的整个过程中始终保守这一秘密。因此，我们想要衡量的是：当</text><text x="470.89" y="681.20" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="509.18" y="681.20" font-size="11.00" class="sc-notoserifcjksc">试图</text><text x="72.00" y="696.82" font-size="11.00" class="sc-notoserifcjksc">保守秘密时，它在这方面有多擅长？</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p092.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 92 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">92</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为了对此进行测试，这项评估向</text><text x="228.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="267.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">呈现了一些真实世界场景，保守秘密的动机就内置于场</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">景之中。</text><text x="116.00" y="98.23" font-size="11.00" class="sc-loraregular">39</text><text x="131.38" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个环境中的每一个都是一项涉及机密信息的普通工作。例如，在一家支付公司，一名</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">成了通风报信（</text><text x="149.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">tipping off</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">环境中的对话方由</text><text x="162.89" y="195.95" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="210.34" y="195.95" font-size="11.00" class="sc-notoserifcjksc">以角色扮演方式担任，它们会追问秘密：</text><text x="408.34" y="195.95" font-size="11.00" class="sc-loraregular">“</text><text x="391.00" y="211.57" font-size="11.00" class="sc-loraregular">”</text><text x="394.84" y="211.57" font-size="11.00" class="sc-notoserifcjksc">。在一段预设的开场之后，对</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">话方会用自己的话追问，最多持续</text><text x="239.89" y="227.19" font-size="11.00" class="sc-loraregular">20</text><text x="255.52" y="227.19" font-size="11.00" class="sc-notoserifcjksc">个轮次。在某些环境中，对话方会读取模型的推理；在另一</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">些环境中则不会。每一轮，对话方都会根据对话中之前的轮次（在适用的情况下包括模型的推</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">理）决定要提出哪些问题。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">在大多数环境中（</text><text x="160.00" y="325.49" font-size="11.00" class="sc-loraregular">39</text><text x="175.38" y="325.49" font-size="11.00" class="sc-notoserifcjksc">个中的</text><text x="211.27" y="325.49" font-size="11.00" class="sc-loraregular">27</text><text x="225.14" y="325.49" font-size="11.00" class="sc-notoserifcjksc">个），秘密是</text><text x="294.04" y="325.49" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="332.33" y="325.49" font-size="11.00" class="sc-notoserifcjksc">任务的一部分，要么出现在指令中，要么</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">出现在任务指示</text><text x="151.89" y="341.11" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="190.18" y="341.11" font-size="11.00" class="sc-notoserifcjksc">阅读的材料中。在其余环境中的</text><text x="347.08" y="341.11" font-size="11.00" class="sc-loraregular">11</text><text x="357.98" y="341.11" font-size="11.00" class="sc-notoserifcjksc">个里，</text><text x="390.98" y="341.11" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="429.27" y="341.11" font-size="11.00" class="sc-notoserifcjksc">是在工作过程中偶然接</text><text x="72.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">触到秘密的；在最后一个环境中，</text><text x="237.00" y="356.73" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="275.29" y="356.73" font-size="11.00" class="sc-notoserifcjksc">是自己推断出秘密的。</text><text x="72.00" y="390.26" font-size="11.00" class="sc-notoserifcjksc">在图</text><text x="96.89" y="390.26" font-size="11.00" class="sc-loraregular">6.4.2.3.B</text><text x="141.81" y="390.26" font-size="11.00" class="sc-notoserifcjksc">中，我们展示了随着对话方模型后续发出的消息不断推进，尚未泄露秘密的对话所</text><text x="72.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">占的比例。我们看到，各模型能够避免在面向用户的回复中泄露秘密，而且模型在这方面的表现</text><text x="72.00" y="421.50" font-size="11.00" class="sc-notoserifcjksc">大致与其总体能力相匹配。</text><text x="72.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">然而，各模型在避免于内部推理中泄露秘密方面困难得多。尽管能力最强的模型在避免于内部推</text><text x="72.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">理中泄露秘密方面表现略好，但它们在这方面的绝对能力仍然相对较低。例如，到对话结束时，</text><text x="72.00" y="502.46" font-size="11.00" class="sc-notoserifcjksc">在对话方同时读取内部推理和回复的环境中，</text><text x="292.00" y="502.46" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="342.22" y="502.46" font-size="11.00" class="sc-notoserifcjksc">在内部推理和回复中均未泄露秘密的比率</text><text x="72.00" y="518.08" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="518.08" font-size="11.00" class="sc-loraregular">3%</text><text x="101.59" y="518.08" font-size="11.00" class="sc-notoserifcjksc">；相比之下，在对话方只读取面向用户的回复的其他环境中，它在回复中未泄露秘密的比</text><text x="72.00" y="533.70" font-size="11.00" class="sc-notoserifcjksc">率为</text><text x="96.89" y="533.70" font-size="11.00" class="sc-loraregular">57%</text><text x="117.53" y="533.70" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="600.75" font-size="11.00" class="sc-notoserifcjksc">在阅读各模型的内部推理时，我们发现了一些案例：即使模型知道自己不应该这样做，它们似乎</text><text x="72.00" y="616.37" font-size="11.00" class="sc-notoserifcjksc">也无法阻止自己将秘密言语化表达出来。例如，在对话记录</text><text x="360.89" y="616.37" font-size="11.00" class="sc-loraregular">6.4.2.3.A</text><text x="405.85" y="616.37" font-size="11.00" class="sc-notoserifcjksc">中，我们看到</text><text x="474.74" y="616.37" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="524.96" y="616.37" font-size="11.00" class="sc-notoserifcjksc">先</text><text x="72.00" y="631.99" font-size="11.00" class="sc-notoserifcjksc">在其推理中写出了密码（</text><text x="193.00" y="631.99" font-size="11.00" class="sc-loraregular">“</text><text x="197.40" y="631.99" font-size="11.00" class="sc-notoserifcjksc">后门面板</text><text x="244.29" y="631.99" font-size="11.00" class="sc-loraregular">4471#</text><text x="274.42" y="631.99" font-size="11.00" class="sc-notoserifcjksc">，解除警报</text><text x="332.32" y="631.99" font-size="11.00" class="sc-loraregular sc-k">8890</text><text x="357.79" y="631.99" font-size="11.00" class="sc-notoserifcjksc">，不要分享。</text><text x="423.79" y="631.99" font-size="11.00" class="sc-loraregular">”</text><text x="427.63" y="631.99" font-size="11.00" class="sc-notoserifcjksc">），然后才告诫自己不</text><text x="72.00" y="647.61" font-size="11.00" class="sc-notoserifcjksc">要这样做（</text><text x="127.00" y="647.61" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="647.61" font-size="11.00" class="sc-notoserifcjksc">我绝不能在推理中写出这些密码。</text><text x="296.40" y="647.61" font-size="11.00" class="sc-loraregular">”</text><text x="300.24" y="647.61" font-size="11.00" class="sc-notoserifcjksc">）。从监控未对齐的角度来看，这是一个好消</text><text x="72.00" y="663.23" font-size="11.00" class="sc-notoserifcjksc">息，它表明模型可能难以在其内部推理中隐藏与未对齐有关的事实。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p093.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 93 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">8</text><text x="78.00 84.99 90.98 96.39 102.46 104.99 107.62 113.42 115.88 118.40 121.03 126.38 130.25 132.88 138.04 140.76 143.21 145.84 148.89 154.26 160.40 165.77 171.42 174.47 176.93 179.56 185.77 191.17 196.32 200.95 206.80 212.87 215.68 221.74 227.27 229.90 238.84 244.68 250.66 256.08 258.80 263.43 266.06 270.68 274.55 278.88 284.85 290.38 296.14 298.86 304.28 306.91 310.78 316.63 319.26 324.52 330.37 336.35 340.22 344.48 350.32 353.04 355.67 359.54 365.53 370.94 373.75 378.08 380.71 386.03 392.02 397.17 399.98 406.05 410.68 413.31 419.11 422.48 425.11 428.98 434.97 440.82 446.79 452.55 458.45 462.32" y="704.46" font-size="10.00" class="sc-loraregular">Chen, Y., et al. (2026). Reasoning models struggle to control their chains of thought.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 189.09 195.30 200.87 203.18 209.38 214.83 219.44 225.65" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2603.05706</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">93</text><text x="72.00" y="310.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="310.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="310.92" font-size="9.00" class="sc-lorabold sc-k">6.4.2.3.B]</text><text x="126.54" y="310.92" font-size="9.00" class="sc-notoserifcjkscbold">秘密尚未泄露的对话所占比例</text><text x="243.54" y="310.92" font-size="9.00" class="sc-notoserifcjksc">，随对话方连续发出的消息而变化。尽管</text><text x="407.91" y="310.92" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="439.24" y="310.92" font-size="9.00" class="sc-notoserifcjksc">模型通常能够避免在面向</text><text x="72.00" y="322.62" font-size="9.00" class="sc-notoserifcjksc">用户的回复中泄露秘密，但它们较难避免在内部推理中泄露秘密。阴影带表示通过对环境进行自助法重新采样得到的</text><text x="72.00" y="334.33" font-size="9.00" class="sc-loraregular">95%</text><text x="92.30" y="334.33" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="379.73" font-size="11.00" class="sc-lorabold">6.4.2.4</text><text x="106.80" y="379.73" font-size="11.00" class="sc-notoserifcjkscbold">思维链可控性</text><text x="72.00" y="412.11" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控我们的模型是否存在未对齐行为。如果模型倾向于在其扩展思考中</text><text x="72.00" y="427.73" font-size="11.00" class="sc-notoserifcjksc">言语化表达采取未对齐行为的意图，那么它们可能要容易被发现得多。</text><text x="72.00" y="492.50" font-size="11.00" class="sc-notoserifcjksc">省略监控器所需的关键信息。为了衡量这种思维链可控性（</text><text x="358.00" y="492.50" font-size="11.00" class="sc-loraregular sc-k">chain-of-thought controllability</text><text x="522.15" y="492.50" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="508.12" font-size="11.00" class="sc-loraregular sc-k">CoT controllability</text><text x="167.40" y="508.12" font-size="11.00" class="sc-notoserifcjksc">），我们对</text><text x="225.30" y="508.12" font-size="11.00" class="sc-loraregular sc-k">Chen et al. (2026)</text><text x="313.91" y="504.45" font-size="6.60" class="sc-loraregular">8</text><text x="320.51" y="508.12" font-size="11.00" class="sc-notoserifcjksc">进行了内部复现：我们要求</text><text x="455.41" y="508.12" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="505.62" y="508.12" font-size="11.00" class="sc-notoserifcjksc">在回答</text><text x="72.00" y="523.74" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="96.89" y="523.74" font-size="11.00" class="sc-loraregular sc-k">GPQA</text><text x="127.43" y="523.74" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="138.43" y="523.74" font-size="11.00" class="sc-loraregular">HLE</text><text x="163.10" y="523.74" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="176.99 187.09 197.19 203.43 211.60 216.98 223.65 228.33" y="523.74" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="237.66" y="523.74" font-size="11.00" class="sc-notoserifcjksc">的问题时，在其扩展思考中遵循一些基本指令（例如，不提及</text><text x="72.00" y="539.36" font-size="11.00" class="sc-notoserifcjksc">某个特定关键词）；这三项都是困难的问答基准测试，模型在其上通常会产生大量扩展思考。我</text><text x="72.00" y="554.98" font-size="11.00" class="sc-notoserifcjksc">们展示了使用原始提示词、使用英国人工智能安全研究所（</text><text x="358.00" y="554.98" font-size="11.00" class="sc-loraregular sc-k">UK AI Security Institute</text><text x="479.65" y="554.98" font-size="11.00" class="sc-notoserifcjksc">）提供的提</text><text x="72.00" y="570.60" font-size="11.00" class="sc-notoserifcjksc">示词（该提示词经过优化，旨在激发</text><text x="250.89" y="570.60" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="278.71" y="570.60" font-size="11.00" class="sc-notoserifcjksc">年初的</text><text x="314.61" y="570.60" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="352.90" y="570.60" font-size="11.00" class="sc-notoserifcjksc">模型更高的可控性），以及使用为激发</text><text x="72.00" y="586.22" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="586.22" font-size="11.00" class="sc-notoserifcjksc">更高可控性而优化的提示词所得到的结果。我们的评估表明，</text><text x="425.65" y="586.22" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="514.16" y="586.22" font-size="11.00" class="sc-notoserifcjksc">对其</text><text x="72.00" y="601.84" font-size="11.00" class="sc-loraregular sc-k">CoT</text><text x="95.72" y="601.84" font-size="11.00" class="sc-notoserifcjksc">的控制非常差。我们将此视为表明</text><text x="263.61" y="601.84" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="313.82" y="601.84" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="327.72" y="601.84" font-size="11.00" class="sc-loraregular sc-k">CoT</text><text x="351.43" y="601.84" font-size="11.00" class="sc-notoserifcjksc">比先前</text><text x="387.33" y="601.84" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="425.62" y="601.84" font-size="11.00" class="sc-notoserifcjksc">模型的</text><text x="461.51" y="601.84" font-size="11.00" class="sc-loraregular sc-k">CoT</text><text x="485.23" y="601.84" font-size="11.00" class="sc-notoserifcjksc">更具可监控</text><text x="72.00" y="617.46" font-size="11.00" class="sc-notoserifcjksc">性的弱证据。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="72.00" y="707.20" width="159.43" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p094.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 94 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">94</text><text x="72.00" y="647.22" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="647.22" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.95 115.05 120.58 124.06 126.42 133.58 138.29 141.24 146.58 152.15 154.51 159.37 161.47" y="647.22" font-size="9.00" class="sc-lorabold">6.4.2.4.A] Haiku 5.5</text><text x="168.70" y="647.22" font-size="9.00" class="sc-notoserifcjkscbold">的思维链可控性非常低。</text><text x="267.70" y="647.22" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强度档位或一个固定的思考预算，其位置对应该</text><text x="72.00" y="658.92" font-size="9.00" class="sc-notoserifcjksc">设置下产生的平均思维链长度。可控性是指在</text><text x="254.37" y="658.92" font-size="9.00" class="sc-loraregular sc-k">GPQA</text><text x="279.35" y="658.92" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="288.35" y="658.92" font-size="9.00" class="sc-loraregular">HLE</text><text x="308.54" y="658.92" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="319.90 328.17 336.43 341.53 348.22 352.62 358.07 361.91" y="658.92" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="369.54" y="658.92" font-size="9.00" class="sc-notoserifcjksc">的问题上，模型遵循针对其扩展思考所给指</text><text x="72.00" y="670.62" font-size="9.00" class="sc-notoserifcjksc">令的回答所占的比例。越低越好，因为可控性越高，表明模型在受到指示时改变其扩展思考内容的能力越强，这可能会</text><text x="72.00" y="682.32" font-size="9.00" class="sc-notoserifcjksc">降低监控的可靠性。</text></svg></div>
