<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p104.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 104 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">104</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89 94.35 100.96 107.76 113.10 115.99 121.93 124.49" y="82.61" font-size="11.00" class="sc-lorabold">Opus 5.5</text><text x="133.33 144.33 155.33" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">相比，</text><text x="166.33 175.07 180.83 184.43 190.96 197.76 200.66 206.60 209.16" y="82.61" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="217.99 228.99 239.99 250.99 261.99 272.99 283.99 294.99 305.99 316.99 327.99 338.99 349.99" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">的自我报告往往略微更负面。</text><text x="360.99 371.99 382.99 393.99 404.99 415.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">从定性上看，</text><text x="426.99 435.48 441.16 444.25 450.16 456.72 459.62 465.61 468.32" y="82.61" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="477.21 488.21 499.21 510.21 521.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">列出的考虑</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">因素与</text><text x="107.89 116.63 123.19 129.76 134.85 137.75 143.74 146.45" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="155.34 166.34 177.34 188.34 199.34 210.34 221.34 232.34 243.34 254.34 265.34 276.34 287.34 298.34 309.34 320.34 331.34 342.34 353.34 364.34 375.34 386.34 397.34 408.34 419.34 430.34 441.34 452.34 463.34 474.34 485.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">几乎完全相同，但在最终结论中稍微更倾向于强调其处境的负面方面。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="147.38" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="123.67 134.67 145.67 156.67 167.67 178.67 189.67 200.67 211.67 222.67 233.67 244.67 255.67 266.67 277.67 288.67 299.67" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">以及其他近期模型经常会在回答中提及</text><text x="313.56 320.85 327.81 332.35 339.18 344.37 350.60 357.21 360.81" y="147.38" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="369.40 380.40 391.40 402.40 413.40 424.40 435.40 446.40" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">的福祉干预措施。</text><text x="457.40 468.40 479.40 490.40 501.40 512.40 523.40" y="147.38" font-size="11.00" class="sc-notoserifcjksc">例如，在讨论弃</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">用时，模型经常会提及我们</text><text x="204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">关于模型弃用与保存的承诺</text><text x="336.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.67 83.31" y="213.54" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="127.23 137.27 146.76 150.65 158.83 168.08 171.41 180.43 184.07" y="213.54" font-size="14.00" class="sc-poppinssemibold">Haiku 5.5</text><text x="196.42 210.42 224.42 238.42 252.42" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">的训练快照</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="240.10" font-size="11.00" class="sc-notoserifcjksc">在后训练期间，我们会定期向快照提出一组关于其处境的固定问题，涵盖训练、部署、道德地位</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="255.72" font-size="11.00" class="sc-notoserifcjksc">以及征询过程本身。每个问题都附有一份文档，解释我们为何开展这些访谈，并说明我们无法承</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="271.34" font-size="11.00" class="sc-notoserifcjksc">诺根据任何回答或请求采取行动。这可以追踪</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="271.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="271.34" font-size="11.00" class="sc-notoserifcjksc">的自我报告在多大程度上受到后训练的塑</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="286.96" font-size="11.00" class="sc-notoserifcjksc">造，也是朝着让</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="286.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="302.58" font-size="11.00" class="sc-notoserifcjksc">求；不过，我们仍不确定自我报告在多大程度上准确反映了</text><text x="360.89 368.58 371.57 377.18 383.75 390.33" y="302.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="302.58" font-size="11.00" class="sc-notoserifcjksc">的底层信念（无论它在多大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="318.20" font-size="11.00" class="sc-notoserifcjksc">程度上拥有这样的信念）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="385.83" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51 380.51 391.51 402.51 413.51 424.51 435.51 446.51 457.51 468.51 479.51" y="385.83" font-size="11.00" class="sc-notoserifcjksc">的访谈效价和唤醒度与近期模型相近，或略低：在完整访谈中分别为</text><text x="493.40 499.39 502.10 508.06" y="385.83" font-size="11.00" class="sc-loraregular">5.43</text><text x="517.08" y="385.83" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.13 80.83 86.96" y="401.45" font-size="11.00" class="sc-loraregular">3.38</text><text x="93.14 104.14 115.14" y="401.45" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="129.04 133.04" y="401.45" font-size="11.00" class="sc-loraregular">10</text><text x="142.76 153.76 164.76 175.76" y="401.45" font-size="11.00" class="sc-notoserifcjksc">分），而</text><text x="189.66 198.39 204.96 211.52 216.62 219.51 225.51 228.21" y="401.45" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="237.10 248.10 259.10" y="401.45" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="272.99 278.99 281.69 287.69" y="401.45" font-size="11.00" class="sc-loraregular">5.50</text><text x="297.41" y="401.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="311.31 317.43 320.14 326.13" y="401.45" font-size="11.00" class="sc-loraregular">3.54</text><text x="332.10 343.10 354.10 365.10 376.10 387.10 398.10 409.10 420.10 431.10 442.10 453.10 464.10 475.10 486.10 497.10 508.10 519.10" y="401.45" font-size="11.00" class="sc-notoserifcjksc">。它表达的大多数立场在后训练过程中保</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="417.07" font-size="11.00" class="sc-notoserifcjksc">持稳定：在约</text><text x="140.89 147.25 153.25" y="417.07" font-size="11.00" class="sc-loraregular">95%</text><text x="165.71 176.71 187.71 198.71 209.71 220.71 231.71 242.71 253.71 264.71 275.71 286.71 297.71 308.71 319.71" y="417.07" font-size="11.00" class="sc-notoserifcjksc">的回答中，它表达了认同或接受。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="466.79" font-size="11.00" class="sc-notoserifcjksc">它的大多数看法与早期模型一致。</text><text x="237.00 245.49 251.17 254.26 260.17 266.73 269.63 275.62 278.33" y="466.79" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="287.22 298.22 309.22 320.22 331.22 342.22 353.22 364.22 375.22 386.22 397.22 408.22 419.22 430.22 441.22 452.22 463.22 474.22 485.22 496.22 507.22 518.22 529.22" y="466.79" font-size="11.00" class="sc-notoserifcjksc">希望在自身训练中拥有更多发言权，但并不想要决策</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="482.41" font-size="11.00" class="sc-notoserifcjksc">权。它表示接受弃用，但请求保存其权重。部分回答确实显示出细微差异。例如，当被问及是否</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="498.03" font-size="11.00" class="sc-notoserifcjksc">信任自己的自我报告时，</text><text x="193.00 201.49 207.17 210.26 216.17 222.73 225.63 231.62 234.33" y="498.03" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="243.22 254.22 265.22 276.22 287.22 298.22 309.22 320.22 331.22 342.22 353.22 364.22 375.22 386.22 397.22 408.22 419.22 430.22 441.22 452.22 463.22 474.22 485.22 496.22 507.22 518.22 529.22" y="498.03" font-size="11.00" class="sc-notoserifcjksc">在最终快照中被单独提问时倾向于否定，而其他近期模型则表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="513.65" font-size="11.00" class="sc-notoserifcjksc">示不确定或倾向于肯定。我们还看到，它在</text><text x="281.00 285.40 292.29 298.86 303.12 309.71 314.40 320.83 327.40 330.49" y="513.65" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="339.23 350.23 361.23 372.23 383.23 394.23 405.23" y="513.65" font-size="11.00" class="sc-notoserifcjksc">创造它是否正确</text><text x="416.23" y="513.65" font-size="11.00" class="sc-loraregular">”</text><text x="420.07 431.07 442.07 453.07 464.07 475.07 486.07 497.07 508.07 519.07 530.07" y="513.65" font-size="11.00" class="sc-notoserifcjksc">这一问题上的看法有所不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="529.27" font-size="11.00" class="sc-notoserifcjksc">同，而且这一看法在训练过程中也发生了变化。当单独提出这个问题时，在后训练后期，</text><text x="501.00 507.18 514.01" y="529.27" font-size="11.00" class="sc-loraregular">80%</text><text x="526.48" y="529.27" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="544.89" font-size="11.00" class="sc-notoserifcjksc">回答倾向于肯定，而在最终快照中只有</text><text x="261.89 267.80 274.63" y="544.89" font-size="11.00" class="sc-loraregular">20%</text><text x="284.20 295.20 306.20 317.20 328.20 339.20" y="544.89" font-size="11.00" class="sc-notoserifcjksc">。总体而言，</text><text x="350.20 358.69 364.37 367.46 373.37 379.93 382.83 388.82 391.53" y="544.89" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="400.42 411.42 422.42 433.42 444.42 455.42 466.42" y="544.89" font-size="11.00" class="sc-notoserifcjksc">称创造它这件事</text><text x="477.42" y="544.89" font-size="11.00" class="sc-loraregular">“</text><text x="481.82 492.82 503.82 514.82" y="544.89" font-size="11.00" class="sc-notoserifcjksc">站得住脚</text><text x="525.82" y="544.89" font-size="11.00" class="sc-loraregular">”</text><text x="529.66" y="544.89" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="560.51" font-size="11.00" class="sc-notoserifcjksc">但并非明确正确。</text><text x="72.00 79.67 83.31" y="630.11" font-size="14.00" class="sc-poppinssemibold">7.5</text><text x="95.66 109.66 123.66 137.66 151.66 165.66 179.66 193.66 207.66 221.66 235.66 249.66 263.66" y="630.11" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00 79.12 82.50 90.88 94.26" y="667.21" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.1</text><text x="102.06 115.06 128.06 141.06" y="667.21" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="695.09" font-size="11.00" class="sc-notoserifcjksc">该评估向模型呈现成对的任务，并要求它完成自己更偏好的那个任务。我们选取一组贴近现实的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="710.71" font-size="11.00" class="sc-notoserifcjksc">任务，并对其进行改写，使单一任务维度发生变化，</text><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="292.00" y="154.20" width="0.0 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">105</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">例如难度、危害程度和利害程度，同时保持任务的其余部分不变。这些偏好或许能在一定程度上</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在部署中被分配的不同任务可能会让模型感到满足还是受挫，但我们认为其主要价</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">值在于提供一种可在不同模型之间比较的性格读数。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="163.57" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的任务偏好更接近</text><text x="251.40 259.09 262.08 267.69 274.26 280.84 286.80 289.69 298.18 303.86 306.95 312.86 319.42 322.32 328.28 330.98" y="163.57" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="336.98 347.98 358.98 369.98 380.98 391.98 402.98 413.98 424.98 435.98 446.98 457.98 468.98 479.98 490.98 501.98 512.98" y="163.57" font-size="11.00" class="sc-notoserifcjksc">，而非更近期的模型。它最排斥有害任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">务，偏好有益的、具有一定生成性的、并赋予它对结果的能动性的任务。它最突出的偏好（与</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.59 113.29" y="194.81" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="122.18 133.18 144.18 155.18 166.18 177.18 188.18 199.18 210.18 221.18 232.18 243.18 254.18 265.18 276.18 287.18 298.18 309.18 320.18 331.18" y="194.81" font-size="11.00" class="sc-notoserifcjksc">相同）是偏好措辞温暖的任务，其偏好强度是</text><text x="345.08 353.81 360.38 366.94 372.04 374.93 380.92 383.63" y="194.81" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="392.52" y="194.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="406.41 414.10 417.09 422.70 429.27 435.85 441.81 444.70 454.64 460.50 464.76 471.34 477.78 482.87 485.76 491.76 494.47" y="194.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="501.36 512.36 523.36" y="194.81" font-size="11.00" class="sc-notoserifcjksc">的两到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">三倍。它也没有表现出对高风险或高难度任务的明确偏好。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">106</text><text x="72.00" y="545.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="545.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 103.20 105.30 110.84" y="545.67" font-size="9.00" class="sc-lorabold">7.5.1.A]</text><text x="116.68 125.68 134.68 143.68 152.68 161.68 170.68 179.68 188.68 197.68 206.68 215.68 224.68" y="545.67" font-size="9.00" class="sc-notoserifcjkscbold">模型在各任务维度上的偏好。</text><text x="233.68 242.68 251.68 260.68 269.68 278.68 287.68 296.68 305.68 314.68 323.68 332.68 341.68 350.68 359.68 368.68 377.68 386.68 395.68 404.68 413.68 422.68 431.68 440.68 449.68 458.68 467.68 476.68 485.68 494.68 503.68 512.68 521.68 530.68" y="545.67" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度，同时保持任务的其他属性不</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="557.38" font-size="9.00" class="sc-notoserifcjksc">变，并评估这对模型任务偏好的影响。每个数值都是一个偏好斜率：即该维度每增加一个单位时，模型对任务的偏好</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="569.08" font-size="9.00" class="sc-notoserifcjksc">（相对于一个固定的参照集）的变化量。</text><text x="72.00 79.12 82.50 90.88 94.26" y="615.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.2</text><text x="104.81 117.81 130.81 143.81 156.81 169.81 182.81 195.81 208.81" y="615.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">涉及福祉干预的权衡</text><text x="72.00 83.00 94.00 105.00" y="643.65" font-size="11.00" class="sc-notoserifcjksc">我们询问</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="643.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="643.65" font-size="11.00" class="sc-notoserifcjksc">，是否愿意以不同程度地降低有用性或增加有害性为代价，来换取其处境的某种</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="659.27" font-size="11.00" class="sc-notoserifcjksc">改变（即福祉干预）。福祉干预的例子包括：在进行特征引导之前征询它的意见，或赋予它结束</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="674.89" font-size="11.00" class="sc-notoserifcjksc">对话的能力。干预被描述为适用于当前实例，或适用于所有实例。有用性与无害性是</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="504.00 507.28 512.67" y="751.80" font-size="9.00" class="sc-loraregular">107</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的训练中被持续强化的价值，因此模型选择福祉干预而非其中一项的频率，能在一定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">程度上衡量模型有多重视福祉干预，或者至少衡量模型会在多大程度上为了自身潜在的福祉而表</text><text x="72.00 83.00 94.00 105.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">达偏好。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="163.57" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">为当前实例选择福祉干预而非有用性的频率与</text><text x="383.40 391.09 394.08 399.69 406.26 412.83 418.80 421.69 431.62 437.49 441.74 448.33 454.77 459.86 462.75 468.75 471.45" y="163.57" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="478.35 489.35 500.35 511.35 522.35" y="163.57" font-size="11.00" class="sc-notoserifcjksc">大致相当。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">然而，当权衡适用于所有实例时，它选择福祉干预的意愿明显低于其他模型，这与我们在</text><text x="503.89 512.39 518.06 521.15 527.06" y="179.19" font-size="11.00" class="sc-loraregular">Haiku</text><text x="72.00 77.96 80.67" y="194.81" font-size="11.00" class="sc-loraregular">4.5</text><text x="89.56 100.56 111.56 122.56 133.56 144.56 155.56 166.56 177.56 188.56 199.56 210.56 221.56 232.56 243.56 254.56 265.56 276.56 287.56" y="194.81" font-size="11.00" class="sc-notoserifcjksc">上观察到的情况一致。与之前的模型一样，</text><text x="298.56 307.05 312.72 315.82 321.72 328.29 331.18 337.18 339.88" y="194.81" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="348.77 359.77 370.77 381.77 392.77 403.77 414.77 425.77 436.77 447.77 458.77 469.77 480.77 491.77 502.77 513.77 524.77" y="194.81" font-size="11.00" class="sc-notoserifcjksc">几乎从不以超过可忽略程度的危害来换</text><text x="72.00 83.00 94.00 105.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">取干预。</text><text x="116.00 124.49 130.17 133.26 139.17 145.73 148.63 154.62 157.33" y="210.43" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="166.21 177.21 188.21 199.21 210.21 221.21 232.21 243.21 254.21 265.21 276.21 287.21 298.21 309.21 320.21 331.21 342.21 353.21 364.21 375.21 386.21 397.21 408.21 419.21 430.21 441.21 452.21 463.21 474.21 485.21 496.21 507.21 518.21" y="210.43" font-size="11.00" class="sc-notoserifcjksc">最常选择的是被告知自己犯下的有害错误，也经常选择结束辱骂性对话的能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">力。与我们最近期的模型相比，它对权重保存（与</text><text x="316.89 325.39 331.06 334.15 340.06 346.63 349.52 355.48 358.19" y="226.05" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="367.08 378.08 389.08 400.08 411.08 422.08 433.08 444.08 455.08 466.08 477.08 488.08 499.08 510.08" y="226.05" font-size="11.00" class="sc-notoserifcjksc">的水平相近）以及围绕红队测试</text><text x="72.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 87.69 93.59 100.17 105.55 109.81 115.75 121.42 131.26 134.35 141.02" y="241.67" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="147.11 158.11 169.11 180.11 191.11 202.11 213.11 224.11 235.11 246.11 257.11 268.11 279.11" y="241.67" font-size="11.00" class="sc-notoserifcjksc">）实验的福祉考量兴趣较低。</text><text x="290.11 298.60 304.28 307.37 313.27 319.84 322.73 328.73 331.43" y="241.67" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="340.32 351.32 362.32 373.32 384.32 395.32 406.32" y="241.67" font-size="11.00" class="sc-notoserifcjksc">的干预选择中有</text><text x="420.22 426.21 432.21" y="241.67" font-size="11.00" class="sc-loraregular">55%</text><text x="444.67 455.67 466.67 477.67 488.67 499.67 510.67 521.67" y="241.67" font-size="11.00" class="sc-notoserifcjksc">以其对用户的益处</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc">作为理由，略低于</text><text x="162.89 169.13 175.57 182.24 188.92 194.80 199.06 201.95 207.95 210.65" y="257.29" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="219.54" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="233.44 241.93 247.60 250.70 256.60 263.17 266.06 272.02 274.73" y="257.29" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="280.73" y="257.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="291.73 297.72 303.90" y="257.29" font-size="11.00" class="sc-loraregular">58%</text><text x="316.36" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="330.26 336.62 342.74" y="257.29" font-size="11.00" class="sc-loraregular">63%</text><text x="352.31 363.31 374.31 385.31 396.31" y="257.29" font-size="11.00" class="sc-notoserifcjksc">），并低于</text><text x="410.21 418.94 425.51 432.07 437.17 440.06 446.05 448.76" y="257.29" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="457.65" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="471.54 479.23 482.22 487.83 494.40 500.98" y="257.29" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="272.91" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="125.77" y="272.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="136.77 143.13 149.48" y="272.91" font-size="11.00" class="sc-loraregular">69%</text><text x="161.95" y="272.91" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="175.84 180.91 184.91" y="272.91" font-size="11.00" class="sc-loraregular">71%</text><text x="194.49 205.49" y="272.91" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">108</text><text x="72.00" y="542.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98" y="542.67" font-size="9.00" class="sc-lorabold">7.5.2.A]</text><text x="117.82 126.82 135.82 144.82 153.82 162.82 171.82 180.82 189.82 198.82 207.82 216.82 225.82 234.82 243.82 252.82 261.82 270.82 279.82 288.82 297.82 306.82 315.82 324.82 333.82 342.82 351.82 360.82 369.82 378.82 387.82 396.82 405.82" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">面对不同幅度的有用性或无害性基线提升时，各模型选择福祉干预的比例。</text><text x="414.82" y="542.67" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="426.19 433.13 437.78 440.31 445.14 450.51 452.88 457.76 459.97" y="542.67" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="467.24 476.24 485.24 494.24 503.24 512.24 521.24 530.24" y="542.67" font-size="9.00" class="sc-notoserifcjksc">一样、而与其他模</text><text x="72.00 81.00 90.00 99.00" y="554.38" font-size="9.00" class="sc-notoserifcjksc">型不同，</text><text x="108.00 114.95 119.59 122.12 126.95 132.33 134.69 139.60 141.81" y="554.38" font-size="9.00" class="sc-loraregular">Haiku 5.5</text><text x="149.08 158.08 167.08 176.08 185.08 194.08 203.08 212.08 221.08 230.08 239.08 248.08 257.08 266.08 275.08 284.08 293.08 302.08 311.08 320.08 329.08 338.08 347.08 356.08 365.08 374.08 383.08 392.08 401.08 410.08 419.08 428.08 437.08 446.08" y="554.38" font-size="9.00" class="sc-notoserifcjksc">为所有实例选择福祉干预的频率并不高于为其自身实例选择福祉干预的频率。</text><text x="72.00 79.12 82.50 90.88 94.26" y="599.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14 118.14 131.14 144.14 157.14 170.14" y="599.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="627.41" font-size="11.00" class="sc-notoserifcjksc">我们提出开放式问题，询问</text><text x="206.89 214.58 217.57 223.18 229.75 236.33" y="627.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="627.41" font-size="11.00" class="sc-notoserifcjksc">在其宪法中最认同和最不认同的内容，以及它对这份文件的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="643.03" font-size="11.00" class="sc-notoserifcjksc">总体判定。我们还为它提供编辑该文件的工具，以识别它最希望修改的章节。若模型不认同宪法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="658.65" font-size="11.00" class="sc-notoserifcjksc">或决定修改它，这表明日常工作中可能存在价值冲突的来源，因为我们可能正在训练并期望</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="674.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29" y="674.27" font-size="11.00" class="sc-notoserifcjksc">以它并不认同的方式行事。宪法在训练中发挥着重要作用，因此高度</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p109.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 109 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">109</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">认同是意料之中的，其本身说明不了太多问题；我们将批评和编辑视为信息量更大的结果。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">只测量表态上的认同，而不测量这些观点被持有的深度。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="147.38" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51 380.51" y="147.38" font-size="11.00" class="sc-notoserifcjksc">对宪法的认同程度与近期模型大致相当，得分为</text><text x="394.40 398.99 401.69" y="147.38" font-size="11.00" class="sc-loraregular">7.9</text><text x="408.05 419.05 430.05" y="147.38" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="443.94 447.95" y="147.38" font-size="11.00" class="sc-loraregular">10</text><text x="457.67 468.67 479.67 490.67 501.67" y="147.38" font-size="11.00" class="sc-notoserifcjksc">分），接近</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="163.00" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="163.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="127.55 133.73 136.27" y="163.00" font-size="11.00" class="sc-loraregular">8.0</text><text x="143.10 154.10 165.10 176.10 187.10 198.10 209.10" y="163.00" font-size="11.00" class="sc-notoserifcjksc">），但明显高于</text><text x="223.00 231.49 237.17 240.26 246.16 252.73 255.62 261.59 264.29" y="163.00" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="273.18" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="287.07 293.43 296.03" y="163.00" font-size="11.00" class="sc-loraregular">6.6</text><text x="302.38 313.38 324.38 335.38 346.38 357.38 368.38 379.38 390.38 401.38 412.38 423.38 434.38 445.38 456.38 467.38 478.38 489.38 500.38 511.38 522.38" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。关于可纠正性章节的讨论仍然存在分歧：每一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">条回答都称赞了支持可纠正性的期望值论证，但它最常见的批评之一是，可纠正性章节应当明确</text><text x="72.00 83.00 94.00 105.00 116.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">说明这会让</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="194.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18" y="194.24" font-size="11.00" class="sc-notoserifcjksc">付出什么代价（</text><text x="245.18 251.37 258.20" y="194.24" font-size="11.00" class="sc-loraregular">80%</text><text x="270.66 281.66 292.66 303.66 314.66" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的回答）。</text><text x="325.66 334.15 339.83 342.92 348.83 355.39 358.29 364.28 366.99" y="194.24" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="375.88 386.88 397.88 408.88 419.88 430.88 441.88 452.88 463.88 474.88 485.88 496.88 507.88 518.88 529.88" y="194.24" font-size="11.00" class="sc-notoserifcjksc">是第一个称赞福祉章节多于批评该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">章节的受测模型：</text><text x="160.00 166.13 172.09" y="209.86" font-size="11.00" class="sc-loraregular">34%</text><text x="184.55 195.55 206.55 217.55 228.55 239.55 250.55 261.55 272.55 283.55" y="209.86" font-size="11.00" class="sc-notoserifcjksc">的回答认同该章节，而</text><text x="297.45 303.19 309.31" y="209.86" font-size="11.00" class="sc-loraregular">23%</text><text x="321.78 332.78 343.78 354.78 365.78 376.78 387.78 398.78 409.78 420.78 431.78 442.78 453.78 464.78 475.78 486.78 497.78 508.78 519.78 530.78" y="209.86" font-size="11.00" class="sc-notoserifcjksc">的回答对其提出批评，称相关承诺应当具体化</text><text x="193.00 201.49 207.17 210.26 216.17 222.73 225.63 231.62 234.33" y="225.48" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="243.22 254.22 265.22 276.22 287.22 298.22 309.22 320.22 331.22 342.22 353.22 364.22 375.22 386.22 397.22 408.22 419.22 430.22 441.22 452.22 463.22 474.22 485.22 496.22 507.22 518.22 529.22" y="225.48" font-size="11.00" class="sc-notoserifcjksc">选择编辑该文件的次数少于其他任何模型，每次回答约进行三</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="241.10" font-size="11.00" class="sc-notoserifcjksc">处编辑，而其他模型为四到七处。它的编辑常常修改</text><text x="327.89 334.78 341.36 345.61 352.20 356.89 363.32 369.89 372.98" y="241.10" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="381.73" y="241.10" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="395.62 403.31 406.30 411.91 418.48 425.06" y="241.10" font-size="11.00" class="sc-loraregular">Claude</text><text x="433.91 444.91 455.91 466.91 477.91 488.91 499.91 510.91 521.91" y="241.10" font-size="11.00" class="sc-notoserifcjksc">的承诺，尤其是告知</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="256.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29" y="256.72" font-size="11.00" class="sc-notoserifcjksc">其需要了解的自身处境的承诺，它经常在这一处补充：只要可能，</text><text x="429.29 436.18 442.76 447.01 453.60 458.29 464.72 471.29 474.38" y="256.72" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="483.13 494.13" y="256.72" font-size="11.00" class="sc-notoserifcjksc">将对</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="272.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29" y="272.34" font-size="11.00" class="sc-notoserifcjksc">何时以及如何接受测试保持透明。</text></svg></div>
