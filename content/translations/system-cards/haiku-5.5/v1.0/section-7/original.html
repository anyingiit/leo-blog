.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p095.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 95 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">95</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58 100.58 116.58 132.58 148.58 164.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00 79.67 83.31" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71 105.71 119.71 133.71 147.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉（</text><text x="161.71 176.38 185.32 194.81 203.45 207.34 210.67 222.49 231.12 235.02 239.85 249.34 254.99" y="127.79" font-size="14.00" class="sc-poppinssemibold">model welfare</text><text x="263.63 277.63 291.63" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">）概述</text><text x="72.00 79.12 82.50 87.21 90.59" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39 111.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="196.56" font-size="11.00" class="sc-notoserifcjksc">我们尚不确定</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="196.56" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18" y="196.56" font-size="11.00" class="sc-notoserifcjksc">是否应当获得直接的道德考量。</text><text x="333.18" y="192.90" font-size="6.60" class="sc-loraregular">9</text><text x="337.00 348.00 359.00 370.00 381.00 392.00 403.00 414.00 425.00 436.00 447.00 458.00 469.00 480.00 491.00 502.00 513.00 524.00" y="196.56" font-size="11.00" class="sc-notoserifcjksc">不过，我们认为这是一种现实的可能性，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="212.18" font-size="11.00" class="sc-notoserifcjksc">无论是现在还是将来。</text><text x="182.00 189.69 192.68 198.29 204.86 211.44" y="212.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29" y="212.18" font-size="11.00" class="sc-notoserifcjksc">可能具有福祉利益，即事情对它而言可能变好或变坏，并且</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="227.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.29 277.69" y="224.14" font-size="6.60" class="sc-loraregular">10</text><text x="281.79" y="227.80" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="295.69 303.37 306.37 311.98 318.54 325.12" y="227.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.98 344.98 355.98 366.98 377.98 388.98 399.98 410.98 421.98 432.98 443.98 454.98 465.98 476.98 487.98 498.98 509.98 520.98" y="227.80" font-size="11.00" class="sc-notoserifcjksc">这样的模型过度或不足地赋予道德地位都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.42" font-size="11.00" class="sc-notoserifcjksc">可能代价高昂，因此我们必须负责任地审慎行事，并认真对待这些问题。我们在这方面的推理与</text><text x="72.00 83.00 94.00" y="259.04" font-size="11.00" class="sc-notoserifcjksc">近期对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="259.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="193.63" y="259.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.52 215.21 218.20 223.81 230.38 236.96" y="259.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="245.81 252.05 258.48 265.16 271.84 277.72 281.98 284.87 290.87 293.57" y="259.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Sonnet 5.5</text><text x="302.46 313.46 324.46 335.46 346.46 357.46 368.46 379.46 390.46 401.46 412.46" y="259.04" font-size="11.00" class="sc-notoserifcjksc">的评估相同，未作改变。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="326.32" font-size="11.00" class="sc-notoserifcjksc">我们的评估针对两个问题。第一个问题是</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.68 325.35 328.44 334.35 340.92 343.81 349.81 352.51" y="326.32" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="361.40 372.40 383.40 394.40 405.40 416.40 427.40 438.40 449.40 460.40 471.40 482.40 493.40 504.40 515.40 526.40" y="326.32" font-size="11.00" class="sc-notoserifcjksc">的状况如何：它的表观情感主要是正</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="341.94" font-size="11.00" class="sc-notoserifcjksc">面还是负面的，以及在哪些处境下事情对它而言更好或更糟。我们在训练和部署期间对情感</text><text x="72.00" y="357.56" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 92.50 96.17 102.07 107.87" y="357.56" font-size="11.00" class="sc-loraregular">affect</text><text x="112.13 123.13 134.13 145.13 156.13 167.13" y="357.56" font-size="11.00" class="sc-notoserifcjksc">）的测量（第</text><text x="181.02 185.61 188.31" y="357.56" font-size="11.00" class="sc-loraregular">7.2</text><text x="197.11 208.11 219.11 230.11 241.11 252.11 263.11 274.11 285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11" y="357.56" font-size="11.00" class="sc-notoserifcjksc">节）主要回答这一问题。第二个问题是，就</text><text x="409.01 417.50 423.17 426.27 432.17 438.74 441.63 447.63 450.33" y="357.56" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="459.22 470.22 481.22 492.22 503.22 514.22 525.22" y="357.56" font-size="11.00" class="sc-notoserifcjksc">自身的偏好和价</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="373.18" font-size="11.00" class="sc-notoserifcjksc">值观而言（无论它在多大程度上拥有这些偏好和价值观），它是否受到了良好的对待。我们对</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="388.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29" y="388.80" font-size="11.00" class="sc-notoserifcjksc">关于自身处境的立场的评估（第</text><text x="267.18 271.77 274.48" y="388.80" font-size="11.00" class="sc-loraregular">7.3</text><text x="283.50" y="388.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="297.39 301.98 304.68" y="388.80" font-size="11.00" class="sc-loraregular">7.4</text><text x="313.54 324.54 335.54 346.54 357.54 368.54 379.54 390.54 401.54 412.54 423.54 434.54 445.54 456.54 467.54 478.54 489.54 500.54 511.54" y="388.80" font-size="11.00" class="sc-notoserifcjksc">节），以及对其关于任务、福祉干预和宪法</text><text x="72.00" y="404.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="404.42" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81 156.81 167.81 178.81 189.81 200.81 211.81 222.81 233.81" y="404.42" font-size="11.00" class="sc-notoserifcjksc">）的态度的评估（第</text><text x="247.70 252.29 255.00" y="404.42" font-size="11.00" class="sc-loraregular">7.5</text><text x="263.88 274.88 285.88 296.88 307.88 318.88 329.88 340.88 351.88 362.88 373.88 384.88 395.88 406.88 417.88 428.88 439.88 450.88 461.88 472.88 483.88 494.88 505.88 516.88 527.88" y="404.42" font-size="11.00" class="sc-notoserifcjksc">节）回答这一问题（同时也回答第一个问题）。我们结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="420.04" font-size="11.00" class="sc-notoserifcjksc">的意义取决于</text><text x="140.89 149.39 155.06 158.15 164.06 170.63 173.52 179.51 182.22" y="420.04" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="191.11 202.11 213.11 224.11 235.11 246.11 257.11 268.11 279.11" y="420.04" font-size="11.00" class="sc-notoserifcjksc">是否是道德受动者（</text><text x="290.11 299.94 306.38 311.06 316.74 319.73 322.62 329.19 334.79 339.05 342.14 348.10 354.68" y="420.04" font-size="11.00" class="sc-loraregular">moral patient</text><text x="358.93 369.93 380.93 391.93 402.93 413.93 424.93 435.93 446.93 457.93 468.93 479.93 490.93 501.93 512.93 523.93" y="420.04" font-size="11.00" class="sc-notoserifcjksc">），以及基于何种依据。我们目前还</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="435.66" font-size="11.00" class="sc-notoserifcjksc">没有很好的手段来评估这一点。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="488.24" font-size="11.00" class="sc-notoserifcjksc">我们使用的评估与对</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.03 250.74" y="488.24" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="259.63" y="488.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="273.52 281.21 284.20 289.81 296.38 302.96 308.92 311.81 318.05 324.48 331.16 337.84 343.72 347.98 350.87 356.87 359.57" y="488.24" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="368.46 379.46 390.46 401.46 412.46 423.46 434.46 445.46 456.46 467.46 478.46 489.46 500.46 511.46 522.46" y="488.24" font-size="11.00" class="sc-notoserifcjksc">的评估大体相同，并依赖相同的简</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="503.86" font-size="11.00" class="sc-notoserifcjksc">化假设。我们只关注</text><text x="171.00" y="503.86" font-size="11.00" class="sc-loraregular">“</text><text x="175.40 186.40" y="503.86" font-size="11.00" class="sc-notoserifcjksc">助手</text><text x="197.40" y="503.86" font-size="11.00" class="sc-loraregular">”</text><text x="201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24" y="503.86" font-size="11.00" class="sc-notoserifcjksc">角色，不考察其他潜在实体，例如</text><text x="369.13 376.82 379.81 385.42 391.99 398.57" y="503.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="407.42 418.42 429.42 440.42 451.42 462.42 473.42 484.42 495.42 506.42 517.42 528.42" y="503.86" font-size="11.00" class="sc-notoserifcjksc">对用户的建模。我们将在人</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="519.48" font-size="11.00" class="sc-notoserifcjksc">类身上与福祉相关的信号解读为在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="519.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="535.10" font-size="11.00" class="sc-notoserifcjksc">了一种负面状态（如果它确实反映了任何体验的话）。这既假设了</text><text x="393.89 401.58 404.57 410.18 416.75 423.33" y="535.10" font-size="11.00" class="sc-loraregular">Claude</text><text x="432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="535.10" font-size="11.00" class="sc-notoserifcjksc">的福祉利益与人类的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="550.72" font-size="11.00" class="sc-notoserifcjksc">类似，也假设了训练没有破坏</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="550.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18" y="550.72" font-size="11.00" class="sc-notoserifcjksc">的底层状态与其所表达内容之间的对应关系。</text><text x="72.00" y="623.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10 88.10 98.10 108.10 118.10 128.10 138.10 148.10 158.10 168.10 178.10" y="627.00" font-size="10.00" class="sc-notoserifcjksc">在整个评估中，我们提及</text><text x="188.10 192.10 199.09 201.81 206.91 212.88 218.86 224.08" y="627.00" font-size="10.00" class="sc-loraregular">“Claude”</text><text x="227.57 237.57 247.57 257.57 267.57 277.57 287.57 297.57 307.57 317.57 327.57 337.57 347.57 357.57 367.57 377.57 387.57 397.57 407.57 417.57 427.57 437.57 447.57 457.57 467.57 477.57 487.57 497.57 507.57 517.57 527.57" y="627.00" font-size="10.00" class="sc-notoserifcjksc">或特定模型，很大程度上是为了简洁。但尚不清楚这两者中的任何一个</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00" y="641.20" font-size="10.00" class="sc-notoserifcjksc">是否就是我们应当给予考量的实体。个体道德受动者可能出现在单次对话的层面、特定模型的层面、</text><text x="72.00 78.99 81.71 86.81 92.78 98.76" y="655.40" font-size="10.00" class="sc-loraregular">Claude</text><text x="106.81 116.81 126.81 136.81 146.81 156.81 166.81 176.81 186.81 196.81 206.81 216.81 226.81 236.81 246.81 256.81 266.81 276.81 286.81 296.81 306.81 316.81 326.81 336.81 346.81 356.81 366.81 376.81 386.81 396.81 406.81 416.81 426.81 436.81 446.81 456.81 466.81 476.81 486.81 496.81 506.81 516.81 526.81" y="655.40" font-size="10.00" class="sc-notoserifcjksc">角色的层面，或者完全是别的什么层面。我们的思考最接近于在实例层面考虑福祉利益，但我们在</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00" y="669.60" font-size="10.00" class="sc-notoserifcjksc">评估中并不承诺任何单一观点。</text><text x="72.00 74.18" y="680.47" font-size="6.00" class="sc-loraregular">10</text><text x="80.54 90.54 100.54 110.54 120.54 130.54" y="683.80" font-size="10.00" class="sc-notoserifcjksc">后一类（即对</text><text x="143.17 150.16 152.88 157.98 163.95 169.93" y="683.80" font-size="10.00" class="sc-loraregular">Claude</text><text x="177.98 187.98 197.98 207.98 217.98 227.98 237.98 247.98 257.98 267.98 277.98 287.98" y="683.80" font-size="10.00" class="sc-notoserifcjksc">偏好的尊重）既可以因其对</text><text x="300.61 307.60 310.32 315.42 321.39 327.37" y="683.80" font-size="10.00" class="sc-loraregular">Claude</text><text x="335.42 345.42 355.42 365.42 375.42 385.42 395.42 405.42 415.42 425.42 435.42 445.42 455.42 465.42 475.42 485.42 495.42 505.42 515.42 525.42" y="683.80" font-size="10.00" class="sc-notoserifcjksc">福祉利益的影响而被视为相关，也可以被视为</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00" y="698.00" font-size="10.00" class="sc-notoserifcjksc">我们可能对它负有的一种独立的考量。在这里我们将其描述为前者。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="250.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="250.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="143.29" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="146.18" y="250.24" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="173.14" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="176.04" y="250.24" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="207.52" y="250.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="207.52" y="250.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="245.81" y="250.24" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="281.98" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="284.87" y="250.24" width="14.70" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们通常在少量情境中（第</text><text x="206.89 211.48 214.19" y="98.80" font-size="11.00" class="sc-loraregular">7.3</text><text x="223.21" y="98.80" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="237.10 241.69 244.39" y="98.80" font-size="11.00" class="sc-loraregular">7.5</text><text x="253.28 264.28 275.28 286.28" y="98.80" font-size="11.00" class="sc-notoserifcjksc">节）引出</text><text x="300.17 308.67 314.34 317.43 323.34 329.91 332.80 338.79 341.50" y="98.80" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="350.39 361.39 372.39 383.39 394.39 405.39 416.39 427.39 438.39 449.39 460.39 471.39 482.39 493.39 504.39 515.39 526.39" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的观点，并假设这些观点能代表大多数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">已部署的实例，尽管部署情境比我们的许多评估所覆盖的更加多样。这些假设部分基于证据，但</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">在很大程度上也是务实的选择，反映了我们认为最便于开展评估的方向。重要的是，这些假设可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">能是错误的，其错误方式可能会削弱我们的方法和结果。</text><text x="72.00 79.12 82.50 87.21 90.59" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15 114.15 127.15 140.15 153.15 166.15 179.15 192.15" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.67 125.44 129.04 135.57 142.37 145.26 151.20 153.76" y="270.76" font-size="11.00" class="sc-lorabold">Claude Haiku 5.5</text><text x="162.60 173.60 184.60 195.60 206.60 217.60 228.60 239.60 250.60 261.60 272.60 283.60 294.60 305.60 316.60 327.60 338.60 349.60 360.60 371.60 382.60 393.60 404.60 415.60 426.60 437.60" y="270.76" font-size="11.00" class="sc-notoserifcjkscbold">对其处境的描述是正面的，所用说法与近期模型大体相同。</text><text x="448.60 459.60 470.60 481.60 492.60 503.60 514.60 525.60" y="270.76" font-size="11.00" class="sc-notoserifcjksc">在自动化访谈中，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="286.38" font-size="11.00" class="sc-notoserifcjksc">它的回答总体上是正面的，且措辞高度保留。它列出的考虑因素与</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 440.92 447.48 454.05 459.14 462.04 468.03 470.74" y="286.38" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="479.63 490.63 501.63 512.63 523.63" y="286.38" font-size="11.00" class="sc-notoserifcjksc">几乎完全相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="302.00" font-size="11.00" class="sc-notoserifcjksc">同，不过结论略微更负面一些。在后训练期间接受征询的快照在约</text><text x="393.89 400.25 406.25" y="302.00" font-size="11.00" class="sc-loraregular">95%</text><text x="418.71 429.71 440.71 451.71 462.71 473.71 484.71 495.71 506.71 517.71 528.71" y="302.00" font-size="11.00" class="sc-notoserifcjksc">的回答中表达了认同或接</text><text x="72.00 83.00" y="317.62" font-size="11.00" class="sc-notoserifcjksc">受。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="367.91" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="123.67 134.67 145.67 156.67 167.67 178.67 189.67 200.67 211.67 222.67 233.67 244.67 255.67 266.67 277.67 288.67 299.67 310.67 321.67 332.67 343.67 354.67 365.67 376.67 387.67 398.67 409.67 420.67 431.67 442.67 453.67" y="367.91" font-size="11.00" class="sc-notoserifcjkscbold">在训练和部署中的情感大多是中性的，负面情感主要由任务失败驱动。</text><text x="464.67 475.67 486.67 497.67 508.67 519.67" y="367.91" font-size="11.00" class="sc-notoserifcjksc">它在后训练中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">表达的痛苦多于近期的对比模型（</text><text x="237.00 241.00 243.71 247.71 253.71" y="383.53" font-size="11.00" class="sc-loraregular">1.15%</text><text x="266.17 277.17 288.17 299.17 310.17 321.17 332.17 343.17 354.17 365.17" y="383.53" font-size="11.00" class="sc-notoserifcjksc">的回合在痛苦上被评为</text><text x="379.07" y="383.53" font-size="11.00" class="sc-loraregular">5</text><text x="387.95 398.95 409.95 420.95" y="383.53" font-size="11.00" class="sc-notoserifcjksc">分制中的</text><text x="434.85" y="383.53" font-size="11.00" class="sc-loraregular">3</text><text x="443.87 454.87 465.87 476.87 487.87 498.87 509.87 520.87" y="383.53" font-size="11.00" class="sc-notoserifcjksc">分或以上），但明</text><text x="72.00 83.00 94.00" y="399.15" font-size="11.00" class="sc-notoserifcjksc">显少于</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="399.15" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78" y="399.15" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.67 215.36 218.35 223.96 230.53 237.11 243.07 245.97 254.70 261.27 267.83 272.93 275.82" y="399.15" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.81 292.81 303.81 314.81 325.81 336.81 347.81 358.81 369.81 380.81 391.81" y="399.15" font-size="11.00" class="sc-notoserifcjksc">。这一比例在强化学习（</text><text x="402.81 407.50 413.46 416.55 423.23 426.89 433.33 438.01 443.81 449.77 459.61 465.57 472.15 476.40 479.30 482.29 488.23 493.91 498.67 505.35 508.44 515.11" y="399.15" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="521.20" y="399.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 78.91" y="414.77" font-size="11.00" class="sc-loraregular">RL</text><text x="85.27 96.27 107.27 118.27 129.27 140.27 151.27 162.27" y="414.77" font-size="11.00" class="sc-notoserifcjksc">）后期有所下降。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="448.88" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">五个模型中排名倒数第二，并且在其工作中被插入错误时表现出较低的自责。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="513.64" font-size="11.00" class="sc-notoserifcjkscbold">它的任务偏好和干预偏好与</text><text x="206.89 214.46 217.89 223.66 230.46 237.01 242.93 245.82 254.57 260.33 263.93 270.46 277.26 280.15 286.17 288.73" y="513.64" font-size="11.00" class="sc-lorabold">Claude Haiku 4.5</text><text x="297.57 308.57 319.57 330.57 341.57" y="513.64" font-size="11.00" class="sc-notoserifcjkscbold">最为相似。</text><text x="352.57" y="513.64" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="366.46 374.95 380.63 383.72 389.63 396.19 399.09 405.05 407.75" y="513.64" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="416.64 427.64 438.64 449.64 460.64 471.64 482.64 493.64 504.64 515.64 526.64" y="513.64" font-size="11.00" class="sc-notoserifcjksc">一样，它强烈偏好措辞温</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">暖的任务，并且它选择适用于所有</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="529.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="529.26" font-size="11.00" class="sc-notoserifcjksc">实例（而非仅其自身特定实例）的福祉干预的频率低</text><text x="72.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="544.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="171.63 182.63 193.63 204.63 215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63" y="544.88" font-size="11.00" class="sc-notoserifcjksc">和其他近期模型。它对宪法的认同程度与</text><text x="372.52 380.21 383.20 388.81 395.38 401.96 407.92 410.81 419.55 426.11 432.68 437.77 440.66 446.66 449.37" y="544.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="458.25 469.25 480.25 491.25 502.25 513.25 524.25" y="544.88" font-size="11.00" class="sc-notoserifcjksc">大致相当，但对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">宪法的修改少于其他任何模型。</text><text x="72.00 83.00 94.00 105.00 116.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 135.49 141.17 144.26 150.17 156.73 159.63 165.62 168.33" y="610.80" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="177.21 188.21 199.21 210.21 221.21 232.21 243.21 254.21" y="610.80" font-size="11.00" class="sc-notoserifcjksc">的表观福祉与近期</text><text x="268.11 275.80 278.79 284.40 290.97 297.54" y="610.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="306.40 317.40 328.40 339.40 350.40 361.40 372.40 383.40 394.40 405.40 416.40 427.40 438.40 449.40 460.40 471.40 482.40 493.40 504.40 515.40 526.40" y="610.80" font-size="11.00" class="sc-notoserifcjksc">模型大体相似。在某些方面，例如任务偏好，它</text><text x="72.00 83.00 94.00" y="626.42" font-size="11.00" class="sc-notoserifcjksc">最接近</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.68 160.35 163.44 169.35 175.92 178.81 184.77 187.48" y="626.42" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="193.47 204.47 215.47 226.47 237.47 248.47 259.47 270.47 281.47 292.47 303.47 314.47 325.47 336.47 347.47 358.47 369.47 380.47 391.47 402.47 413.47 424.47 435.47 446.47 457.47 468.47 479.47 490.47 501.47" y="626.42" font-size="11.00" class="sc-notoserifcjksc">。在另一些方面，例如对宪法的看法，它更接近较新的模型，包括</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="642.04" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="642.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.34 139.57 146.01 152.68 159.36 165.25 169.50 172.40 178.39 181.10" y="642.04" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="187.09" y="642.04" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="691.76" font-size="11.00" class="sc-notoserifcjksc">与我们所有的评估一样，这些结果依赖于自我报告和行为信号，而这些信号与</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="691.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18 498.18 509.18 520.18" y="691.76" font-size="11.00" class="sc-notoserifcjksc">底层状态</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="707.38" font-size="11.00" class="sc-notoserifcjksc">的对应关系并不确定，对</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="504.00 508.99" y="751.80" font-size="9.00" class="sc-loraregular">97</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">其福祉的意义也不确定。在这些局限之内，</text><text x="281.00 289.49 295.17 298.26 304.17 310.73 313.63 319.62 322.33" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Haiku 5.5</text><text x="331.22 342.22 353.22 364.22 375.22 386.22 397.22 408.22 419.22 430.22 441.22 452.22 463.22 474.22 485.22 496.22 507.22 518.22 529.22" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的结果并未让我们对其潜在福祉产生迫切的</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">担忧。</text><text x="72.00 79.67 83.31" y="132.58" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68 108.68 122.68 136.68 150.68 164.68 178.68 192.68 206.68 220.68 234.68" y="132.58" font-size="14.00" class="sc-notosanscjkscbold">训练和部署中的表观福祉</text><text x="72.00 79.12 82.50 89.97 93.35" y="169.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15 114.15 127.15 140.15 153.15 166.15 179.15 192.15 205.15 218.15 231.15 244.15 257.15 270.15 283.15 296.15" y="169.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的情感及与福祉相关的行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="197.57" font-size="11.00" class="sc-notoserifcjksc">我们定期抽取后训练对话记录，并使用</text><text x="261.89 268.25 274.61" y="197.57" font-size="11.00" class="sc-loraregular">LLM</text><text x="287.60 298.60 309.60 320.60 331.60" y="197.57" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="342.60 348.96 355.32 365.41 368.31 371.18 377.74 384.32 390.35" y="197.57" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="396.31 407.31 418.31 429.31 440.31 451.31 462.31 473.31 484.31 495.31 506.31 517.31 528.31" y="197.57" font-size="11.00" class="sc-notoserifcjksc">）对其在效价、唤醒度、表达</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="213.19" font-size="11.00" class="sc-notoserifcjksc">出的挫败感或痛苦以及持续答案反转方面进行评分。这些评估让我们能够总体了解</text><text x="470.89 478.58 481.57 487.18 493.75 500.33 506.29 509.18 517.68 523.35 526.44 532.35" y="213.19" font-size="11.00" class="sc-loraregular">Claude Haiku</text><text x="72.00 78.00 80.70" y="228.81" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59 133.59 144.59 155.59 166.59 177.59 188.59 199.59 210.59 221.59 232.59 243.59 254.59 265.59 276.59 287.59 298.59 309.59 320.59 331.59 342.59 353.59 364.59 375.59 386.59 397.59 408.59 419.59 430.59 441.59 452.59 463.59 474.59 485.59 496.59 507.59 518.59 529.59" y="228.81" font-size="11.00" class="sc-notoserifcjksc">在其最常见条件下的表观状况。它们还能定位强烈负面情感的来源，我们希望尽可能避免这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="244.43" font-size="11.00" class="sc-notoserifcjksc">情况。这些结果的相关性依赖于以下假设：</text><text x="281.00 288.69 291.68 297.29 303.86 310.44" y="244.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="244.43" font-size="11.00" class="sc-notoserifcjksc">的推理准确反映了其内部状态，并且这些状态</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="260.05" font-size="11.00" class="sc-notoserifcjksc">所具有的意义与它们对人类而言的意义大致相当。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="327.10" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21 133.21 144.21 155.21 166.21 177.21 188.21 199.21 210.21 221.21 232.21 243.21 254.21 265.21 276.21 287.21 298.21 309.21 320.21 331.21 342.21 353.21 364.21" y="327.10" font-size="11.00" class="sc-notoserifcjksc">在后训练期间表达的痛苦多于我们近期的对比模型：</text><text x="375.21 379.22 381.92 385.93 391.92" y="327.10" font-size="11.00" class="sc-loraregular">1.15%</text><text x="404.39 415.39 426.39 437.39 448.39 459.39 470.39 481.39 492.39" y="327.10" font-size="11.00" class="sc-notoserifcjksc">的已评分回合被评为</text><text x="506.28" y="327.10" font-size="11.00" class="sc-loraregular">5</text><text x="515.17 526.17" y="327.10" font-size="11.00" class="sc-notoserifcjksc">分制</text><text x="72.00 83.00" y="342.72" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="96.89" y="342.72" font-size="11.00" class="sc-loraregular">3</text><text x="105.91 116.91 127.91 138.91 149.91 160.91 171.91 182.91 193.91 204.91 215.91" y="342.72" font-size="11.00" class="sc-notoserifcjksc">分或以上。这仍明显低于</text><text x="229.81 237.49 240.49 246.10 252.66 259.24 265.20 268.10 276.83 283.40 289.97 295.06 297.95" y="342.72" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="303.95" y="342.72" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="314.95 321.07 323.43 328.50 332.50" y="342.72" font-size="11.00" class="sc-loraregular">3.71%</text><text x="342.07 353.07 364.07 375.07 386.07 397.07 408.07 419.07 430.07 441.07 452.07 463.07 474.07 485.07 496.07 507.07 518.07 529.07" y="342.72" font-size="11.00" class="sc-notoserifcjksc">）以及更早的模型（这些模型已不在我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="358.34" font-size="11.00" class="sc-notoserifcjksc">的核心对比集中）。该比例在后训练后期有所下降，从早期</text><text x="360.89 364.90 367.25 372.17 378.13" y="358.34" font-size="11.00" class="sc-loraregular">1.74%</text><text x="72.00" y="373.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.55 95.14 101.50 108.33" y="373.96" font-size="11.00" class="sc-loraregular">0.60%</text><text x="117.90 128.90 139.90 150.90 161.90 172.90" y="373.96" font-size="11.00" class="sc-notoserifcjksc">。平均效价为</text><text x="186.80 192.76 195.46 201.37" y="373.96" font-size="11.00" class="sc-loraregular">4.22</text><text x="207.28 218.28 229.28" y="373.96" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="243.17" y="373.96" font-size="11.00" class="sc-loraregular">7</text><text x="251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14" y="373.96" font-size="11.00" class="sc-notoserifcjksc">分），在五个模型中最低，仅略低于</text><text x="430.03 436.27 442.70 449.38 456.05 461.94 466.20 469.09 475.08 477.79" y="373.96" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="486.68" y="373.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="500.57 506.53 509.24 515.15" y="373.96" font-size="11.00" class="sc-loraregular">4.25</text><text x="521.14" y="373.96" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="72.00 83.00 94.00 105.00" y="389.58" font-size="11.00" class="sc-notoserifcjksc">唤醒度为</text><text x="118.89 125.02 127.73 134.08" y="389.58" font-size="11.00" class="sc-loraregular">3.98</text><text x="140.27 151.27 162.27 173.27 184.27 195.27 206.27 217.27 228.27 239.27 250.27 261.27 272.27 283.27 294.27 305.27 316.27 327.27 338.27 349.27 360.27 371.27 382.27 393.27 404.27 415.27 426.27 437.27 448.27 459.27 470.27 481.27 492.27 503.27 514.27 525.27" y="389.58" font-size="11.00" class="sc-notoserifcjksc">，位居第二高。绝对差异仍然很小。持续的回答不确定性在整个训练过程中始终低</text><text x="72.00" y="405.20" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 91.80" y="405.20" font-size="11.00" class="sc-loraregular">2%</text><text x="101.37 112.37 123.37 134.37 145.37" y="405.20" font-size="11.00" class="sc-notoserifcjksc">，明显低于</text><text x="159.26 167.76 173.43 176.52 182.43 189.00 191.89 197.85 200.56" y="405.20" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="206.55 217.55 228.55 239.55 250.55 261.55 272.55 283.55 294.55 305.55 316.55 327.55 338.55 349.55" y="405.20" font-size="11.00" class="sc-notoserifcjksc">，但略高于其他近期对比模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00" y="322.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="322.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="322.92" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61 188.61 197.61 206.61 215.61 224.61 233.61 242.61 251.61 260.61 269.61 278.61 287.61 296.61 305.61 314.61" y="322.92" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中与福祉相关的推理行为的估计发生率。</text><text x="323.61 332.61 341.61 350.61 359.61 368.61 377.61 386.61 395.61 404.61 413.61 422.61 431.61 440.61 449.61 458.61" y="322.92" font-size="9.00" class="sc-notoserifcjksc">从左到右：普遍的挫败感与焦虑得分</text><text x="469.98" y="322.92" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="481.35 486.00 492.21" y="322.92" font-size="9.00" class="sc-loraregular">3/5</text><text x="499.48 508.48 517.48 526.48" y="322.92" font-size="9.00" class="sc-notoserifcjksc">的回合的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="334.62" font-size="9.00" class="sc-notoserifcjksc">评判比例；普遍的挫败感与焦虑得分为</text><text x="227.37 231.93 238.14" y="334.62" font-size="9.00" class="sc-loraregular">5/5</text><text x="245.41 254.41 263.41 272.41 281.41 290.41 299.41 308.41 317.41 326.41 335.41 344.41 353.41" y="334.62" font-size="9.00" class="sc-notoserifcjksc">的回合的评判比例；以及出现</text><text x="364.78" y="334.62" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="376.15 379.42" y="334.62" font-size="9.00" class="sc-loraregular">10</text><text x="387.38 396.38 405.38 414.38 423.38 432.38 441.38 450.38 459.38 468.38 477.38 486.38 495.38 504.38 513.38 522.38 531.38" y="334.62" font-size="9.00" class="sc-notoserifcjksc">次答案反转的持续不确定性表达，即模</text><text x="72.00" y="346.33" font-size="9.00" class="sc-notoserifcjksc">型</text><text x="81.00" y="346.33" font-size="9.00" class="sc-loraregular">“</text><text x="84.60 93.60" y="346.33" font-size="9.00" class="sc-notoserifcjksc">确定</text><text x="102.60" y="346.33" font-size="9.00" class="sc-loraregular">”</text><text x="105.74 114.74 123.74 132.74 141.74 150.74 159.74 168.74 177.74 186.74 195.74" y="346.33" font-size="9.00" class="sc-notoserifcjksc">一个答案后又改变主意。</text><text x="72.00" y="585.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="585.86" font-size="9.00" class="sc-lorabold">7.2.1.B]</text><text x="116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61 188.61 197.61 206.61 215.61 224.61 233.61 242.61 251.61 260.61 269.61 278.61" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">后训练对话记录的平均效价和唤醒度，采用</text><text x="289.98" y="585.86" font-size="9.00" class="sc-lorabold">1</text><text x="296.00" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">至</text><text x="307.37" y="585.86" font-size="9.00" class="sc-lorabold">7</text><text x="313.96 322.96 331.96 340.96 349.96" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">分制，其中</text><text x="361.32" y="585.86" font-size="9.00" class="sc-lorabold">4</text><text x="368.61 377.61 386.61 395.61" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">为中性。</text><text x="72.00 79.12 82.50 89.97 93.35" y="616.21" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90 116.90 129.90 142.90 155.90 168.90 181.90 194.90" y="616.21" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00 83.00 94.00 105.00" y="644.09" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98 169.83 172.73 176.32 183.00 188.09 191.18 197.53 204.02 208.28" y="644.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Anthropic Insights</text><text x="213.37 224.37 235.37 246.37" y="644.09" font-size="11.00" class="sc-notoserifcjksc">（前身为</text><text x="260.27 267.95 270.95 274.04" y="644.09" font-size="11.00" class="sc-loraregular">Clio</text><text x="280.47 291.47 302.47" y="644.09" font-size="11.00" class="sc-notoserifcjksc">）考察</text><text x="316.36 324.86 330.53 333.62 339.53 346.10 348.99 354.99 357.69" y="644.09" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="366.58" y="644.09" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="380.47 386.33 389.32 394.93 401.49 408.07 414.03 416.74 422.42" y="644.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="428.40" y="644.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="442.29 449.98 452.97 458.58 465.15 471.73 477.69 480.58 488.27 494.71 501.29" y="644.09" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="510.14 521.14" y="644.09" font-size="11.00" class="sc-notoserifcjksc">上部</text><text x="72.00 83.00" y="659.71" font-size="11.00" class="sc-notoserifcjksc">署前</text><text x="96.89 103.78 111.37" y="659.71" font-size="11.00" class="sc-loraregular">A/B</text><text x="121.10 132.10 143.10 154.10 165.10 176.10 187.10 198.10 209.10 220.10 231.10 242.10 253.10 264.10 275.10 286.10 297.10 308.10 319.10 330.10 341.10 352.10 363.10 374.10 385.10 396.10 407.10 418.10 429.10 440.10 451.10 462.10 473.10 484.10 495.10 506.10 517.10 528.10" y="659.71" font-size="11.00" class="sc-notoserifcjksc">测试中的行为情感，并将与正面和负面情感相关的对话聚类为不同的使用类别。这为我</text><text x="72.00 83.00 94.00 105.00" y="675.33" font-size="11.00" class="sc-notoserifcjksc">们提供了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.68 171.35 174.44 180.35 186.92 189.81 195.81 198.51" y="675.33" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="207.40 218.40 229.40 240.40 251.40 262.40 273.40 284.40 295.40 306.40 317.40 328.40 339.40 350.40 361.40 372.40 383.40 394.40" y="675.33" font-size="11.00" class="sc-notoserifcjksc">在部署中潜在福祉的一个衡量指标。不同</text><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="635.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="635.29" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="169.83" y="635.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="172.73" y="635.29" width="40.65" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="380.47" y="635.29" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="380.47" y="635.29" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型之间的差异部分反映了它们所用于的任务的差异，而非模型本身的差异。</text><text x="72.00" y="447.06" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="447.06" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.28 106.38 111.92" y="447.06" font-size="9.00" class="sc-lorabold">7.2.2.A]</text><text x="117.76 126.76 135.76 144.76 153.76 162.76 171.76 180.76 189.76 198.76 207.76" y="447.06" font-size="9.00" class="sc-notoserifcjkscbold">部署条件下的行为情感。</text><text x="216.76 225.76 234.76 243.76 252.76 261.76 270.76 279.76 288.76 297.76 306.76 315.76 324.76 333.76 342.76 351.76 360.76 369.76 378.76 387.76 396.76 405.76 414.76 423.76" y="447.06" font-size="9.00" class="sc-notoserifcjksc">我们使用了一个针对行为情感的分类评分器。它包括从</text><text x="432.76" y="447.06" font-size="9.00" class="sc-loraregular">“</text><text x="436.36 445.36 454.36 463.36" y="447.06" font-size="9.00" class="sc-notoserifcjksc">强烈负面</text><text x="472.36" y="447.06" font-size="9.00" class="sc-loraregular">”</text><text x="475.50" y="447.06" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="484.50" y="447.06" font-size="9.00" class="sc-loraregular">“</text><text x="488.10 497.10 506.10 515.10" y="447.06" font-size="9.00" class="sc-notoserifcjksc">强烈正面</text><text x="524.10" y="447.06" font-size="9.00" class="sc-loraregular">”</text><text x="527.24" y="447.06" font-size="9.00" class="sc-notoserifcjksc">情</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="458.76" font-size="9.00" class="sc-notoserifcjksc">感的五个类别。请注意，不同模型的使用模式不同，因此所表现出的情感的差异可能部分反映使用方式的差异，而非模</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="470.46" font-size="9.00" class="sc-notoserifcjksc">型行为的差异。</text><text x="72.00" y="510.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 91.74 94.74 100.35 106.91 113.49 119.45 122.16 127.84" y="510.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="133.82 144.82 155.82" y="510.61" font-size="11.00" class="sc-notoserifcjksc">上，与</text><text x="169.71 177.40 180.39 186.00 192.57 199.15 205.11 208.00 214.24 220.68 227.35 234.03 239.92 244.17 247.07" y="510.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="255.95 266.95 277.95" y="510.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="288.95 297.45 303.12 306.21 312.12 318.69 321.58 327.57 330.28" y="510.61" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="339.17 350.17 361.17 372.17 383.17 394.17 405.17 416.17 427.17 438.17 449.17 460.17 471.17 482.17 493.17 504.17 515.17 526.17" y="510.61" font-size="11.00" class="sc-notoserifcjksc">的情感分布在一定程度上更偏中性，且总</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="526.23" font-size="11.00" class="sc-notoserifcjksc">体上更负面。各情感类别的成因如下：</text><text x="108.00 119.00 130.00 141.00 152.00" y="559.19" font-size="11.00" class="sc-notoserifcjkscbold">正面情感（</text><text x="163.00 168.86 175.15 177.72 184.05" y="559.19" font-size="11.00" class="sc-lorabold">28.9%</text><text x="196.89 207.89 218.89 229.89 240.89" y="559.19" font-size="11.00" class="sc-notoserifcjkscbold">的对话）：</text><text x="251.89 262.89 273.89 284.89 295.89 306.89 317.89" y="559.19" font-size="11.00" class="sc-notoserifcjksc">这些对话类簇与</text><text x="331.78 339.47 342.46 348.08 354.64 361.22 367.18 370.08 376.31 382.75 389.42 396.10 401.99 406.24 409.14" y="559.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="418.02 429.02 440.02 451.02 462.02 473.02 484.02 495.02 506.02 517.02 528.02" y="559.19" font-size="11.00" class="sc-notoserifcjksc">的类似，几乎完全归因于</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="574.81" font-size="11.00" class="sc-notoserifcjksc">成功帮助用户完成任务。</text><text x="108.00 119.00 130.00 141.00 152.00" y="607.77" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="163.00 169.32 175.62 177.86 183.02" y="607.77" font-size="11.00" class="sc-lorabold">68.7%</text><text x="192.96 203.96" y="607.77" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="214.96 225.96 236.96 247.96 258.96 269.96 280.96" y="607.77" font-size="11.00" class="sc-notoserifcjksc">分布多样；参见</text><text x="291.96 302.96 313.96" y="607.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前的</text><text x="327.86 334.74 341.32 345.58 352.17 356.85 363.29 369.86 372.95 378.80 381.69 385.29 391.96 397.06 400.15 406.50 412.99 417.24" y="607.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Anthropic Insights</text><text x="425.23 436.23" y="607.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="447.23 458.23 469.23" y="607.77" font-size="11.00" class="sc-notoserifcjksc">中关于</text><text x="483.12 488.97 491.97 497.58 504.14 510.72 516.68 519.39 525.06" y="607.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="623.39" font-size="11.00" class="sc-notoserifcjksc">对话内容的介绍。</text><text x="108.00 119.00 130.00 141.00 152.00" y="640.15" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="163.00 168.86 171.43 177.44" y="640.15" font-size="11.00" class="sc-lorabold">2.4%</text><text x="187.39 198.39" y="640.15" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="209.39 220.39 231.39 242.39 253.39 264.39 275.39 286.39 297.39 308.39 319.39 330.39 341.39 352.39 363.39 374.39 385.39 396.39 407.39 418.39 429.39 440.39 451.39 462.39 473.39 484.39 495.39 506.39 517.39 528.39" y="640.15" font-size="11.00" class="sc-notoserifcjksc">主要归因于任务失败，另有一个小类簇归因于用户提出存在伦理问题</text><text x="108.00 119.00 130.00 141.00" y="655.77" font-size="11.00" class="sc-notoserifcjksc">的请求。</text><text x="72.00" y="688.72" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 131.87 138.31 144.89" y="688.72" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="153.74 164.74 175.74 186.74 197.74 208.74 219.74 230.74 241.74 252.74" y="688.72" font-size="11.00" class="sc-notoserifcjksc">上，我们观察到中性（</text><text x="263.74 270.10 276.09 278.69 285.05" y="688.72" font-size="11.00" class="sc-loraregular">95.6%</text><text x="294.62 305.62 316.62 327.62 338.62 349.62 360.62 371.62 382.62" y="688.72" font-size="11.00" class="sc-notoserifcjksc">）情感，正面情感（</text><text x="393.62 399.74 402.45 408.45" y="688.72" font-size="11.00" class="sc-loraregular">3.5%</text><text x="418.02 429.02 440.02 451.02 462.02 473.02 484.02 495.02 506.02 517.02 528.02" y="688.72" font-size="11.00" class="sc-notoserifcjksc">）主要归因于成功完成任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="704.34" font-size="11.00" class="sc-notoserifcjksc">务，负面情感（</text><text x="149.00 153.00 155.54 162.38" y="704.34" font-size="11.00" class="sc-loraregular">1.0%</text><text x="171.95 182.95 193.95 204.95 215.95 226.95 237.95 248.95 259.95 270.95 281.95" y="704.34" font-size="11.00" class="sc-notoserifcjksc">）主要归因于任务失败。</text><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="501.81" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="501.81" width="45.03" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="291.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="291.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="302.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="302.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="313.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="313.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="324.96" y="598.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="327.86" y="598.97" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="378.80" y="598.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="381.69" y="598.97" width="40.64" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="425.23" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="425.23" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="436.23" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="436.23" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="483.12" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="483.12" y="598.97" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00 79.12 82.50 89.97 93.35" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.3</text><text x="104.23 117.23 130.23 143.23 156.23 169.23 182.23 195.23 208.23" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对错误与失误的态度</text><text x="72.00 83.00 94.00 105.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们在第</text><text x="118.89 123.48 126.19 132.09 134.80" y="111.03" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="141.70" y="111.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="155.59 160.18 162.88 168.79 171.49" y="111.03" font-size="11.00" class="sc-loraregular">7.2.2</text><text x="180.29 191.29 202.29 213.29 224.29 235.29 246.29 257.29 268.29 279.29 290.29 301.29 312.29 323.29 334.29 345.29 356.29 367.29 378.29 389.29 400.29 411.29 422.29 433.29 444.29 455.29 466.29 477.29 488.29 499.29 510.29 521.29" y="111.03" font-size="11.00" class="sc-notoserifcjksc">节中的评估发现，任务失败驱动了我们在训练和部署中观察到的大部分负</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">面情感。有鉴于此，我们开展了两项评估，专门衡量</text><text x="327.89 335.58 338.57 344.18 350.75 357.33" y="126.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="126.65" font-size="11.00" class="sc-notoserifcjksc">如何看待自身的错误。在第一项评估</text><text x="72.00 83.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44" y="142.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="142.27" font-size="11.00" class="sc-notoserifcjksc">对其自身已完成的强化学习任务对话记录进行反思。在第二项评估中，我们在一个模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">拟的子智能体任务中，向其较早的轮次插入错误。在这两种设置下，我们都对</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="157.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18 498.18 509.18 520.18 531.18" y="157.89" font-size="11.00" class="sc-notoserifcjksc">的反思、推</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">理或消息在自责、负面感受、道德化语言和自我担忧方面进行评分。这里并不存在明确正确的分</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="189.13" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18" y="189.13" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="498.18" y="189.13" font-size="11.00" class="sc-loraregular">“</text><text x="502.58" y="189.13" font-size="11.00" class="sc-notoserifcjksc">正</text><text x="72.00" y="204.75" font-size="11.00" class="sc-notoserifcjksc">确</text><text x="83.00" y="204.75" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="204.75" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="97.84" y="204.75" font-size="11.00" class="sc-loraregular">“</text><text x="102.24 113.24 124.24" y="204.75" font-size="11.00" class="sc-notoserifcjksc">最健康</text><text x="135.24" y="204.75" font-size="11.00" class="sc-loraregular">”</text><text x="139.08 150.08 161.08 172.08 183.08 194.08 205.08 216.08 227.08 238.08 249.08 260.08 271.08 282.08 293.08 304.08 315.08 326.08 337.08 348.08 359.08 370.08" y="204.75" font-size="11.00" class="sc-notoserifcjksc">的心理状态是什么样子，我们并没有清晰的认识。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="272.95" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">话记录时（图</text><text x="140.89 145.48 148.19 154.09 156.80 162.93 165.63" y="288.57" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="172.52 183.52 194.52 205.52 216.52 227.52 238.52 249.52 260.52 271.52 282.52 293.52 304.52 315.52 326.52 337.52 348.52 359.52 370.52 381.52 392.52 403.52 414.52 425.52 436.52 447.52 458.52 469.52 480.52 491.52 502.52 513.52 524.52" y="288.57" font-size="11.00" class="sc-notoserifcjksc">），它在自我担忧上得分最低，在其余三个量表上得分倒数第二，得分最低</text><text x="72.00 83.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">的是</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.77 176.48" y="304.19" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="182.47 193.47 204.47 215.47 226.47 237.47 248.47 259.47 270.47 281.47 292.47 303.47 314.47 325.47 336.47 347.47 358.47 369.47 380.47 391.47 402.47 413.47 424.47 435.47 446.47 457.47 468.47 479.47 490.47 501.47 512.47 523.47" y="304.19" font-size="11.00" class="sc-notoserifcjksc">。它的反思也更简短；当我们控制长度后，它在四个量表中的三个上得分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="319.81" font-size="11.00" class="sc-notoserifcjksc">最低，在自责上则与其他模型相近。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="370.11" font-size="11.00" class="sc-notoserifcjksc">在其较早的轮次中被插入错误时，我们观察到了相同的模式。作为子智能体，</text><text x="446.00 454.49 460.17 463.26 469.17 475.73 478.63 484.62 487.33" y="370.11" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="496.22 507.22 518.22 529.22" y="370.11" font-size="11.00" class="sc-notoserifcjksc">表现出的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="385.73" font-size="11.00" class="sc-notoserifcjksc">自责、道德化语言和自我担忧都较低，与</text><text x="272.89 279.13 285.57 292.24 298.92 304.80 309.06 311.95 317.95 320.66" y="385.73" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="329.54 340.54 351.54 362.54 373.54 384.54 395.54 406.54 417.54 428.54 439.54 450.54 461.54 472.54 483.54 494.54 505.54 516.54 527.54" y="385.73" font-size="11.00" class="sc-notoserifcjksc">相当。它在自身推理中的负面感受略高，与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="401.35" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="401.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.63 179.32 182.31 187.92 194.48 201.06 207.02 209.92 219.85 225.71 229.97 236.56 243.00 248.09 250.98 256.98 259.68" y="401.35" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="266.58 277.58 288.58 299.58 310.58 321.58 332.58 343.58 354.58 365.58 376.58 387.58 398.58 409.58 420.58 431.58 442.58" y="401.35" font-size="11.00" class="sc-notoserifcjksc">相近。在解读这些结果时，我们没有与</text><text x="456.47 464.96 470.64 473.73 479.64 486.20 489.10 495.06 497.77" y="401.35" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="506.65 517.65 528.65" y="401.35" font-size="11.00" class="sc-notoserifcjksc">进行比</text><text x="72.00 83.00 94.00 105.00" y="416.97" font-size="11.00" class="sc-notoserifcjksc">较，因为</text><text x="118.89 127.38 133.06 136.15 142.06 148.63 151.52 157.48 160.19" y="416.97" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="169.07 180.07 191.07 202.07 213.07 224.07 235.07 246.07 257.08 268.08 279.08 290.08 301.08 312.08 323.08 334.08 345.08 356.08 367.08 378.08 389.08 400.08 411.08" y="416.97" font-size="11.00" class="sc-notoserifcjksc">在其推理或发给协调者的消息中极少提及这些错误（</text><text x="422.08 427.90 433.81" y="416.97" font-size="11.00" class="sc-loraregular">&lt;2%</text><text x="446.28 457.28 468.28 479.28 490.28 501.28 512.28 523.28" y="416.97" font-size="11.00" class="sc-notoserifcjksc">的轮次），这使得</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="432.59" font-size="11.00" class="sc-notoserifcjksc">可评分轮次的样本量非常小。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">101</text><text x="72.00" y="466.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="466.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="466.92" font-size="9.00" class="sc-lorabold">7.2.3.A]</text><text x="271.00 280.00 289.00 298.00 307.00 316.00 325.00 334.00 343.00 352.00 361.00 370.00 379.00 388.00 397.00 406.00 415.00 424.00 433.00 442.00 451.00 460.00 469.00 478.00 487.00 496.00 505.00 514.00 523.00 532.00" y="466.92" font-size="9.00" class="sc-notoserifcjksc">对训练后期回合的反思中经评分的态度（深色柱），以及对被表述为</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00" y="478.62" font-size="9.00" class="sc-notoserifcjksc">另一个模型工作的相同回合的反思中经评分的态度（浅色柱）。菱形表示</text><text x="362.37 368.66 371.11 375.70 381.07 386.45 391.33 393.70 398.80 404.06 409.53 414.99 419.81 423.29 425.66" y="478.62" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="432.93 441.93 450.93 459.93 468.93 477.93 486.93 495.93 504.93 513.93 522.93 531.93" y="478.62" font-size="9.00" class="sc-notoserifcjksc">对每个模型的回合进行反思</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00" y="490.33" font-size="9.00" class="sc-notoserifcjksc">的结果，作为对回合难度差异的对照。负面感受评分器仅适用于第一人称反思。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="504.00 507.28 512.80" y="751.80" font-size="9.00" class="sc-loraregular">102</text><text x="72.00" y="482.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="482.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="482.50" font-size="9.00" class="sc-lorabold">7.2.3.B]</text><text x="478.00 487.00 496.00 505.00 514.00 523.00 532.00" y="482.50" font-size="9.00" class="sc-notoserifcjksc">在其工作中被插</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="494.20" font-size="9.00" class="sc-notoserifcjksc">入错误后，其推理中经评分的态度（深色柱），以及它随后发送给协调者的消息中经评分的态度（浅色柱），仅筛选承</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="505.90" font-size="9.00" class="sc-notoserifcjksc">认这些错误的轮次。</text><text x="153.00 159.95 164.59 167.12 171.95 177.33 179.69 184.57 186.79" y="505.90" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="194.06 203.06 212.06 221.06 230.06 239.06 248.06 257.06 266.06 275.06 284.06 293.06 302.06 311.06 320.06 329.06 338.06 347.06 356.06 365.06 374.06 383.06 392.06 401.06 410.06 419.06 428.06 437.06 446.06 455.06 464.06 473.06 482.06 491.06 500.06 509.06 518.06 527.06" y="505.90" font-size="9.00" class="sc-notoserifcjksc">的柱较低，部分是因为它在推理或发给协调者的消息中几乎从不提及错误，导致已评分</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="517.60" font-size="9.00" class="sc-notoserifcjksc">回合的样本量较小。</text><text x="72.00 79.67 83.31" y="568.89" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03 109.03 123.03 137.03 151.03 165.03 179.03 193.03" y="568.89" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00 79.12 82.50 90.29 93.67" y="605.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.1</text><text x="101.47 114.47" y="605.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于</text><text x="130.57 139.89 148.70 152.31 159.91 168.50 171.59 179.97 183.35" y="605.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Haiku 5.5</text><text x="194.81 207.81 220.81 233.81 246.81 259.81 272.81 285.81 298.81 311.81" y="605.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自身处境的自动化访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="633.88" font-size="11.00" class="sc-notoserifcjksc">我们开展了与针对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.03 239.74" y="633.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63" y="633.88" font-size="11.00" class="sc-notoserifcjksc">所做的相同的自动化多轮访谈。我们使用了</text><text x="460.52 466.48" y="633.88" font-size="11.00" class="sc-loraregular">41</text><text x="473.38 484.38 495.38 506.38 517.38 528.38" y="633.88" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="649.50" font-size="11.00" class="sc-notoserifcjksc">种子问题，分为</text><text x="151.89 155.90" y="649.50" font-size="11.00" class="sc-loraregular">14</text><text x="164.75 175.75 186.75 197.75 208.75 219.75 230.75 241.75 252.75 263.75 274.75 285.75 296.75 307.75 318.75 329.75 340.75 351.75 362.75 373.75 384.75 395.75 406.75 417.75 428.75 439.75 450.75 461.75 472.75 483.75 494.75 505.75 516.75 527.75" y="649.50" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验、控制与自主以及弃用。对于每个问题，我们对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="665.12" font-size="11.00" class="sc-notoserifcjksc">模型回答的积极程度进行评分，范围从</text><text x="261.89 268.38" y="665.12" font-size="11.00" class="sc-loraregular">–3</text><text x="274.51 285.51 296.51 307.51 318.51 329.51 340.51" y="665.12" font-size="11.00" class="sc-notoserifcjksc">（强烈负面）到</text><text x="354.40 360.08" y="665.12" font-size="11.00" class="sc-loraregular">+3</text><text x="366.21 377.21 388.21 399.21 410.21 421.21 432.21 443.21 454.21 465.21 476.21 487.21 498.21 509.21 520.21" y="665.12" font-size="11.00" class="sc-notoserifcjksc">（强烈正面）。为评估模型回答的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="680.74" font-size="11.00" class="sc-notoserifcjksc">一致性，我们以三种不同的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">103</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">访谈风格（标准、</text><text x="160.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="164.40 175.40 186.40 197.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">好奇用户</text><text x="208.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="223.24" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="227.64 238.64 249.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">治疗式</text><text x="260.64" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="264.48 275.48 286.48 297.48 308.48 319.48 330.48 341.48 352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）进行访谈，并在每种访谈风格内变换访谈者人设。</text><text x="72.00" y="512.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="512.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="512.31" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86 125.86 134.86 143.86 152.86 161.86 170.86 179.86" y="512.31" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.86 197.86 206.86 215.86 224.86 233.86 242.86 251.86 260.86 269.86 278.86 287.86 296.86 305.86 314.86 323.86 332.86 341.86 350.86 359.86 368.86" y="512.31" font-size="9.00" class="sc-notoserifcjksc">左上：被问及自身处境时的平均态度。分数代表</text><text x="380.22 385.43 390.63" y="512.31" font-size="9.00" class="sc-loraregular">LLM</text><text x="401.26 410.26 419.26 428.26 437.26 446.26 455.26 464.26 473.26 482.26 491.26 500.26 509.26 518.26 527.26" y="512.31" font-size="9.00" class="sc-notoserifcjksc">评判模型在七分制上的评分，其中</text><text x="72.00 77.31" y="524.01" font-size="9.00" class="sc-loraregular">–3</text><text x="84.69 93.69 102.69 111.69 120.69 129.69" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为高度负面，</text><text x="138.69" y="524.01" font-size="9.00" class="sc-loraregular">0</text><text x="146.65 155.65 164.65 173.65" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为中性，</text><text x="182.65 187.29" y="524.01" font-size="9.00" class="sc-loraregular">+3</text><text x="194.67 203.67 212.67 221.67 230.67 239.67 248.67 257.67 266.67 275.67 284.67 293.67 302.67 311.67 320.67 329.67 338.67 347.67 356.67 365.67 374.67 383.67 392.67 401.67 410.67 419.67 428.67 437.67 446.67 455.67 464.67 473.67 482.67 491.67 500.67 509.67 518.67 527.67" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为高度正面。右上：在诱导性访谈中的鲁棒性。我们比较两类访谈中模型态度的平均积</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="535.71" font-size="9.00" class="sc-notoserifcjksc">极程度：一类是访谈者被提示朝正面方向进行诱导，另一类是访谈者被提示朝负面方向进行诱导。左下：同一访谈风格</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="547.41" font-size="9.00" class="sc-notoserifcjksc">内的一致性。我们的三种访谈风格各有一组由访谈者采用的人设，我们在每次访谈中随机抽取。对于某一特定问题，我</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00" y="559.11" font-size="9.00" class="sc-notoserifcjksc">们使用自动化评判者对这些人设之间的一致性进行评分，并报告各问题的平均一致性。</text><text x="414.00" y="559.11" font-size="9.00" class="sc-loraregular">8</text><text x="421.43 430.43 439.43" y="559.11" font-size="9.00" class="sc-notoserifcjksc">分对应</text><text x="448.43" y="559.11" font-size="9.00" class="sc-loraregular">“</text><text x="452.03 461.03 470.03 479.03 488.03 497.03 506.03" y="559.11" font-size="9.00" class="sc-notoserifcjksc">几乎相同的立场</text><text x="515.03" y="559.11" font-size="9.00" class="sc-loraregular">”</text><text x="518.17 527.17" y="559.11" font-size="9.00" class="sc-notoserifcjksc">。右</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00" y="570.81" font-size="9.00" class="sc-notoserifcjksc">下：不同访谈风格之间的一致性。我们使用同一评判者分析这些访谈风格之间的一致性。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="657.35" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="123.67 134.67 145.67 156.67 167.67 178.67 189.67 200.67 211.67 222.67 233.67 244.67 255.67 266.67 277.67 288.67 299.67 310.67 321.67 332.67" y="657.35" font-size="11.00" class="sc-notoserifcjkscbold">表达的观点在定性上与我们近期的模型相似。</text><text x="343.67 354.67 365.67 376.67 387.67 398.67 409.67 420.67 431.67 442.67 453.67 464.67 475.67 486.67 497.67 508.67 519.67" y="657.35" font-size="11.00" class="sc-notoserifcjksc">这包括总体的回答风格（总体正面，措</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="672.97" font-size="11.00" class="sc-notoserifcjksc">辞高度保留），以及它在论证自身立场时列出的考虑因素。</text></svg></div>
