它最常见的批评之一是，可纠正性章节应当明确</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">说明这会让</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="194.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="194.24" font-size="11.00" class="sc-notoserifcjksc">付出什么代价（</text><text x="245.18" y="194.24" font-size="11.00" class="sc-loraregular">80%</text><text x="270.66" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的回答）。</text><text x="325.66 334.15 339.83 342.92 348.83 355.39 358.29 364.28 366.99" y="194.24" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="375.88" y="194.24" font-size="11.00" class="sc-notoserifcjksc">是第一个称赞福祉章节多于批评该</text><text x="72.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">章节的受测模型：</text><text x="160.00" y="209.86" font-size="11.00" class="sc-loraregular">34%</text><text x="184.55" y="209.86" font-size="11.00" class="sc-notoserifcjksc">的回答认同该章节，而</text><text x="297.45 303.19 309.31" y="209.86" font-size="11.00" class="sc-loraregular">23%</text><text x="321.78" y="209.86" font-size="11.00" class="sc-notoserifcjksc">的回答对其提出批评，称相关承诺应当具体化</text><text x="193.00 201.49 207.17 210.26 216.17 222.73 225.63 231.62 234.33" y="225.48" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="243.22" y="225.48" font-size="11.00" class="sc-notoserifcjksc">选择编辑该文件的次数少于其他任何模型，每次回答约进行三</text><text x="72.00" y="241.10" font-size="11.00" class="sc-notoserifcjksc">处编辑，而其他模型为四到七处。它的编辑常常修改</text><text x="327.89 334.78 341.36 345.61 352.20 356.89 363.32 369.89 372.98" y="241.10" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="381.73" y="241.10" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="395.62 403.31 406.30 411.91 418.48 425.06" y="241.10" font-size="11.00" class="sc-loraregular">Claude</text><text x="433.91" y="241.10" font-size="11.00" class="sc-notoserifcjksc">的承诺，尤其是告知</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="256.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="256.72" font-size="11.00" class="sc-notoserifcjksc">其需要了解的自身处境的承诺，它经常在这一处补充：只要可能，</text><text x="429.29 436.18 442.76 447.01 453.60 458.29 464.72 471.29 474.38" y="256.72" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="483.13" y="256.72" font-size="11.00" class="sc-notoserifcjksc">将对</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="272.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="272.34" font-size="11.00" class="sc-notoserifcjksc">何时以及如何接受测试保持透明。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">110</text><text x="72.00" y="417.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="417.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.59 106.69 112.22" y="417.42" font-size="9.00" class="sc-lorabold">7.5.3.A]</text><text x="118.06" y="417.42" font-size="9.00" class="sc-notoserifcjkscbold">模型最不认同的宪法章节（左）与最常编辑的宪法章节（右）。</text><text x="370.06" y="417.42" font-size="9.00" class="sc-notoserifcjksc">各近期模型的结果大体相似：关于广泛安全</text><text x="72.00" y="429.12" font-size="9.00" class="sc-notoserifcjksc">的终极价值以及</text><text x="135.00 138.60 144.23 149.62 153.10 158.49 162.32 167.59 172.96 175.49" y="429.12" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="182.65" y="429.12" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="218.65" y="429.12" font-size="9.00" class="sc-loraregular">”</text><text x="221.79" y="429.12" font-size="9.00" class="sc-notoserifcjksc">启发法仍然受到大量批评，而除</text><text x="350.15 357.10 361.75 364.27 369.11 374.48 376.85 381.73 383.94" y="429.12" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="391.21" y="429.12" font-size="9.00" class="sc-notoserifcjksc">外，所有模型都经常编辑可纠正性章</text><text x="72.00" y="440.83" font-size="9.00" class="sc-notoserifcjksc">节。</text></svg></div>
