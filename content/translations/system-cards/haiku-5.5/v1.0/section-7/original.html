.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p095.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 95 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">95</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉（</text><text x="161.71" y="127.79" font-size="14.00" class="sc-poppinssemibold">model welfare</text><text x="263.63" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">）概述</text><text x="72.00" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="196.56" font-size="11.00" class="sc-notoserifcjksc">我们尚不确定</text><text x="140.89" y="196.56" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="179.18" y="196.56" font-size="11.00" class="sc-notoserifcjksc">是否应当获得直接的道德考量。</text><text x="333.18" y="192.90" font-size="6.60" class="sc-loraregular">9</text><text x="337.00" y="196.56" font-size="11.00" class="sc-notoserifcjksc">不过，我们认为这是一种现实的可能性，</text><text x="72.00" y="212.18" font-size="11.00" class="sc-notoserifcjksc">无论是现在还是将来。</text><text x="182.00" y="212.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="220.29" y="212.18" font-size="11.00" class="sc-notoserifcjksc">可能具有福祉利益，即事情对它而言可能变好或变坏，并且</text><text x="72.00" y="227.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="275.29" y="224.14" font-size="6.60" class="sc-loraregular">10</text><text x="281.79" y="227.80" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="295.69" y="227.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="333.98" y="227.80" font-size="11.00" class="sc-notoserifcjksc">这样的模型过度或不足地赋予道德地位都</text><text x="72.00" y="243.42" font-size="11.00" class="sc-notoserifcjksc">可能代价高昂，因此我们必须负责任地审慎行事，并认真对待这些问题。我们在这方面的推理与</text><text x="72.00" y="259.04" font-size="11.00" class="sc-notoserifcjksc">近期对</text><text x="107.89" y="259.04" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="193.63" y="259.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.52" y="259.04" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="245.81" y="259.04" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Sonnet 5.5</text><text x="302.46" y="259.04" font-size="11.00" class="sc-notoserifcjksc">的评估相同，未作改变。</text><text x="72.00" y="326.32" font-size="11.00" class="sc-notoserifcjksc">我们的评估针对两个问题。第一个问题是</text><text x="272.89" y="326.32" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="361.40" y="326.32" font-size="11.00" class="sc-notoserifcjksc">的状况如何：它的表观情感主要是正</text><text x="72.00" y="341.94" font-size="11.00" class="sc-notoserifcjksc">面还是负面的，以及在哪些处境下事情对它而言更好或更糟。我们在训练和部署期间对情感</text><text x="72.00" y="357.56" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="357.56" font-size="11.00" class="sc-loraregular sc-k">affect</text><text x="112.13" y="357.56" font-size="11.00" class="sc-notoserifcjksc">）的测量（第</text><text x="181.02" y="357.56" font-size="11.00" class="sc-loraregular sc-k">7.2</text><text x="197.11" y="357.56" font-size="11.00" class="sc-notoserifcjksc">节）主要回答这一问题。第二个问题是，就</text><text x="409.01" y="357.56" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="459.22" y="357.56" font-size="11.00" class="sc-notoserifcjksc">自身的偏好和价</text><text x="72.00" y="373.18" font-size="11.00" class="sc-notoserifcjksc">值观而言（无论它在多大程度上拥有这些偏好和价值观），它是否受到了良好的对待。我们对</text><text x="72.00" y="388.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="388.80" font-size="11.00" class="sc-notoserifcjksc">关于自身处境的立场的评估（第</text><text x="267.18" y="388.80" font-size="11.00" class="sc-loraregular sc-k">7.3</text><text x="283.50" y="388.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="297.39" y="388.80" font-size="11.00" class="sc-loraregular sc-k">7.4</text><text x="313.54" y="388.80" font-size="11.00" class="sc-notoserifcjksc">节），以及对其关于任务、福祉干预和宪法</text><text x="72.00" y="404.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="404.42" font-size="11.00" class="sc-loraregular sc-k">constitution</text><text x="145.81" y="404.42" font-size="11.00" class="sc-notoserifcjksc">）的态度的评估（第</text><text x="247.70" y="404.42" font-size="11.00" class="sc-loraregular sc-k">7.5</text><text x="263.88" y="404.42" font-size="11.00" class="sc-notoserifcjksc">节）回答这一问题（同时也回答第一个问题）。我们结果</text><text x="72.00" y="420.04" font-size="11.00" class="sc-notoserifcjksc">的意义取决于</text><text x="140.89" y="420.04" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="191.11" y="420.04" font-size="11.00" class="sc-notoserifcjksc">是否是道德受动者（</text><text x="290.11" y="420.04" font-size="11.00" class="sc-loraregular sc-k">moral patient</text><text x="358.93" y="420.04" font-size="11.00" class="sc-notoserifcjksc">），以及基于何种依据。我们目前还</text><text x="72.00" y="435.66" font-size="11.00" class="sc-notoserifcjksc">没有很好的手段来评估这一点。</text><text x="72.00" y="488.24" font-size="11.00" class="sc-notoserifcjksc">我们使用的评估与对</text><text x="173.89" y="488.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="259.63" y="488.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="273.52" y="488.24" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="368.46" y="488.24" font-size="11.00" class="sc-notoserifcjksc">的评估大体相同，并依赖相同的简</text><text x="72.00" y="503.86" font-size="11.00" class="sc-notoserifcjksc">化假设。我们只关注</text><text x="171.00" y="503.86" font-size="11.00" class="sc-loraregular">“</text><text x="175.40" y="503.86" font-size="11.00" class="sc-notoserifcjksc">助手</text><text x="197.40" y="503.86" font-size="11.00" class="sc-loraregular">”</text><text x="201.24" y="503.86" font-size="11.00" class="sc-notoserifcjksc">角色，不考察其他潜在实体，例如</text><text x="369.13" y="503.86" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="407.42" y="503.86" font-size="11.00" class="sc-notoserifcjksc">对用户的建模。我们将在人</text><text x="72.00" y="519.48" font-size="11.00" class="sc-notoserifcjksc">类身上与福祉相关的信号解读为在</text><text x="239.89" y="519.48" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="535.10" font-size="11.00" class="sc-notoserifcjksc">了一种负面状态（如果它确实反映了任何体验的话）。这既假设了</text><text x="393.89" y="535.10" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="432.18" y="535.10" font-size="11.00" class="sc-notoserifcjksc">的福祉利益与人类的</text><text x="72.00" y="550.72" font-size="11.00" class="sc-notoserifcjksc">类似，也假设了训练没有破坏</text><text x="217.89" y="550.72" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="256.18" y="550.72" font-size="11.00" class="sc-notoserifcjksc">的底层状态与其所表达内容之间的对应关系。</text><text x="72.00" y="623.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10" y="627.00" font-size="10.00" class="sc-notoserifcjksc">在整个评估中，我们提及</text><text x="188.10 192.10 199.09 201.81 206.91 212.88 218.86 224.08" y="627.00" font-size="10.00" class="sc-loraregular">“Claude”</text><text x="227.57" y="627.00" font-size="10.00" class="sc-notoserifcjksc">或特定模型，很大程度上是为了简洁。但尚不清楚这两者中的任何一个</text><text x="72.00" y="641.20" font-size="10.00" class="sc-notoserifcjksc">是否就是我们应当给予考量的实体。个体道德受动者可能出现在单次对话的层面、特定模型的层面、</text><text x="72.00" y="655.40" font-size="10.00" class="sc-loraregular sc-k">Claude</text><text x="106.81" y="655.40" font-size="10.00" class="sc-notoserifcjksc">角色的层面，或者完全是别的什么层面。我们的思考最接近于在实例层面考虑福祉利益，但我们在</text><text x="72.00" y="669.60" font-size="10.00" class="sc-notoserifcjksc">评估中并不承诺任何单一观点。</text><text x="72.00" y="680.47" font-size="6.00" class="sc-loraregular">10</text><text x="80.54" y="683.80" font-size="10.00" class="sc-notoserifcjksc">后一类（即对</text><text x="143.17" y="683.80" font-size="10.00" class="sc-loraregular sc-k">Claude</text><text x="177.98" y="683.80" font-size="10.00" class="sc-notoserifcjksc">偏好的尊重）既可以因其对</text><text x="300.61" y="683.80" font-size="10.00" class="sc-loraregular sc-k">Claude</text><text x="335.42" y="683.80" font-size="10.00" class="sc-notoserifcjksc">福祉利益的影响而被视为相关，也可以被视为</text><text x="72.00" y="698.00" font-size="10.00" class="sc-notoserifcjksc">我们可能对它负有的一种独立的考量。在这里我们将其描述为前者。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="250.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="250.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="143.29" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="146.18" y="250.24" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="173.14" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="176.04" y="250.24" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="207.52" y="250.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="207.52" y="250.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="245.81" y="250.24" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="281.98" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="284.87" y="250.24" width="14.70" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们通常在少量情境中（第</text><text x="206.89" y="98.80" font-size="11.00" class="sc-loraregular sc-k">7.3</text><text x="223.21" y="98.80" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="237.10" y="98.80" font-size="11.00" class="sc-loraregular sc-k">7.5</text><text x="253.28" y="98.80" font-size="11.00" class="sc-notoserifcjksc">节）引出</text><text x="300.17" y="98.80" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="350.39" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的观点，并假设这些观点能代表大多数</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">已部署的实例，尽管部署情境比我们的许多评估所覆盖的更加多样。这些假设部分基于证据，但</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">在很大程度上也是务实的选择，反映了我们认为最便于开展评估的方向。重要的是，这些假设可</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">能是错误的，其错误方式可能会削弱我们的方法和结果。</text><text x="72.00" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00" y="270.76" font-size="11.00" class="sc-lorabold sc-k">Claude Haiku 5.5</text><text x="162.60" y="270.76" font-size="11.00" class="sc-notoserifcjkscbold">对其处境的描述是正面的，所用说法与近期模型大体相同。</text><text x="448.60" y="270.76" font-size="11.00" class="sc-notoserifcjksc">在自动化访谈中，</text><text x="72.00" y="286.38" font-size="11.00" class="sc-notoserifcjksc">它的回答总体上是正面的，且措辞高度保留。它列出的考虑因素与</text><text x="393.89" y="286.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="479.63" y="286.38" font-size="11.00" class="sc-notoserifcjksc">几乎完全相</text><text x="72.00" y="302.00" font-size="11.00" class="sc-notoserifcjksc">同，不过结论略微更负面一些。在后训练期间接受征询的快照在约</text><text x="393.89" y="302.00" font-size="11.00" class="sc-loraregular">95%</text><text x="418.71" y="302.00" font-size="11.00" class="sc-notoserifcjksc">的回答中表达了认同或接</text><text x="72.00" y="317.62" font-size="11.00" class="sc-notoserifcjksc">受。</text><text x="72.00" y="367.91" font-size="11.00" class="sc-lorabold sc-k">Haiku 5.5</text><text x="123.67" y="367.91" font-size="11.00" class="sc-notoserifcjkscbold">在训练和部署中的情感大多是中性的，负面情感主要由任务失败驱动。</text><text x="464.67" y="367.91" font-size="11.00" class="sc-notoserifcjksc">它在后训练中</text><text x="72.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">表达的痛苦多于近期的对比模型（</text><text x="237.00" y="383.53" font-size="11.00" class="sc-loraregular">1.15%</text><text x="266.17" y="383.53" font-size="11.00" class="sc-notoserifcjksc">的回合在痛苦上被评为</text><text x="379.07" y="383.53" font-size="11.00" class="sc-loraregular">5</text><text x="387.95" y="383.53" font-size="11.00" class="sc-notoserifcjksc">分制中的</text><text x="434.85" y="383.53" font-size="11.00" class="sc-loraregular">3</text><text x="443.87" y="383.53" font-size="11.00" class="sc-notoserifcjksc">分或以上），但明</text><text x="72.00" y="399.15" font-size="11.00" class="sc-notoserifcjksc">显少于</text><text x="107.89" y="399.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="193.78" y="399.15" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.67" y="399.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.81" y="399.15" font-size="11.00" class="sc-notoserifcjksc">。这一比例在强化学习（</text><text x="402.81" y="399.15" font-size="11.00" class="sc-loraregular sc-k">reinforcement learning</text><text x="521.20" y="399.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="414.77" font-size="11.00" class="sc-loraregular">RL</text><text x="85.27" y="414.77" font-size="11.00" class="sc-notoserifcjksc">）后期有所下降。</text><text x="72.00" y="448.88" font-size="11.00" class="sc-lorabold sc-k">Haiku 5.5</text><text x="72.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">五个模型中排名倒数第二，并且在其工作中被插入错误时表现出较低的自责。</text><text x="72.00" y="513.64" font-size="11.00" class="sc-notoserifcjkscbold">它的任务偏好和干预偏好与</text><text x="206.89" y="513.64" font-size="11.00" class="sc-lorabold sc-k">Claude Haiku 4.5</text><text x="297.57" y="513.64" font-size="11.00" class="sc-notoserifcjkscbold">最为相似。</text><text x="352.57" y="513.64" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="366.46" y="513.64" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="416.64" y="513.64" font-size="11.00" class="sc-notoserifcjksc">一样，它强烈偏好措辞温</text><text x="72.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">暖的任务，并且它选择适用于所有</text><text x="239.89" y="529.26" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="278.18" y="529.26" font-size="11.00" class="sc-notoserifcjksc">实例（而非仅其自身特定实例）的福祉干预的频率低</text><text x="72.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="544.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="171.63" y="544.88" font-size="11.00" class="sc-notoserifcjksc">和其他近期模型。它对宪法的认同程度与</text><text x="372.52" y="544.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="458.25" y="544.88" font-size="11.00" class="sc-notoserifcjksc">大致相当，但对</text><text x="72.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">宪法的修改少于其他任何模型。</text><text x="72.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="610.80" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="177.21" y="610.80" font-size="11.00" class="sc-notoserifcjksc">的表观福祉与近期</text><text x="268.11" y="610.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="306.40" y="610.80" font-size="11.00" class="sc-notoserifcjksc">模型大体相似。在某些方面，例如任务偏好，它</text><text x="72.00" y="626.42" font-size="11.00" class="sc-notoserifcjksc">最接近</text><text x="107.89" y="626.42" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="193.47" y="626.42" font-size="11.00" class="sc-notoserifcjksc">。在另一些方面，例如对宪法的看法，它更接近较新的模型，包括</text><text x="72.00" y="642.04" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="642.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.34" y="642.04" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="187.09" y="642.04" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="691.76" font-size="11.00" class="sc-notoserifcjksc">与我们所有的评估一样，这些结果依赖于自我报告和行为信号，而这些信号与</text><text x="448.89" y="691.76" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="487.18" y="691.76" font-size="11.00" class="sc-notoserifcjksc">底层状态</text><text x="72.00" y="707.38" font-size="11.00" class="sc-notoserifcjksc">的对应关系并不确定，对</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">97</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">其福祉的意义也不确定。在这些局限之内，</text><text x="281.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Haiku 5.5</text><text x="331.22" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的结果并未让我们对其潜在福祉产生迫切的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">担忧。</text><text x="72.00" y="132.58" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68" y="132.58" font-size="14.00" class="sc-notosanscjkscbold">训练和部署中的表观福祉</text><text x="72.00" y="169.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="169.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的情感及与福祉相关的行为</text><text x="72.00" y="197.57" font-size="11.00" class="sc-notoserifcjksc">我们定期抽取后训练对话记录，并使用</text><text x="261.89" y="197.57" font-size="11.00" class="sc-loraregular">LLM</text><text x="287.60" y="197.57" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="342.60" y="197.57" font-size="11.00" class="sc-loraregular sc-k">LLM judge</text><text x="396.31" y="197.57" font-size="11.00" class="sc-notoserifcjksc">）对其在效价、唤醒度、表达</text><text x="72.00" y="213.19" font-size="11.00" class="sc-notoserifcjksc">出的挫败感或痛苦以及持续答案反转方面进行评分。这些评估让我们能够总体了解</text><text x="470.89" y="213.19" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku</text><text x="72.00" y="228.81" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="228.81" font-size="11.00" class="sc-notoserifcjksc">在其最常见条件下的表观状况。它们还能定位强烈负面情感的来源，我们希望尽可能避免这些</text><text x="72.00" y="244.43" font-size="11.00" class="sc-notoserifcjksc">情况。这些结果的相关性依赖于以下假设：</text><text x="281.00" y="244.43" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="319.29" y="244.43" font-size="11.00" class="sc-notoserifcjksc">的推理准确反映了其内部状态，并且这些状态</text><text x="72.00" y="260.05" font-size="11.00" class="sc-notoserifcjksc">所具有的意义与它们对人类而言的意义大致相当。</text><text x="72.00" y="327.10" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="327.10" font-size="11.00" class="sc-notoserifcjksc">在后训练期间表达的痛苦多于我们近期的对比模型：</text><text x="375.21" y="327.10" font-size="11.00" class="sc-loraregular">1.15%</text><text x="404.39" y="327.10" font-size="11.00" class="sc-notoserifcjksc">的已评分回合被评为</text><text x="506.28" y="327.10" font-size="11.00" class="sc-loraregular">5</text><text x="515.17" y="327.10" font-size="11.00" class="sc-notoserifcjksc">分制</text><text x="72.00" y="342.72" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="96.89" y="342.72" font-size="11.00" class="sc-loraregular">3</text><text x="105.91" y="342.72" font-size="11.00" class="sc-notoserifcjksc">分或以上。这仍明显低于</text><text x="229.81" y="342.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="303.95" y="342.72" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="314.95" y="342.72" font-size="11.00" class="sc-loraregular sc-k">3.71%</text><text x="342.07" y="342.72" font-size="11.00" class="sc-notoserifcjksc">）以及更早的模型（这些模型已不在我们</text><text x="72.00" y="358.34" font-size="11.00" class="sc-notoserifcjksc">的核心对比集中）。该比例在后训练后期有所下降，从早期</text><text x="360.89" y="358.34" font-size="11.00" class="sc-loraregular sc-k">1.74%</text><text x="72.00" y="373.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="373.96" font-size="11.00" class="sc-loraregular sc-k">0.60%</text><text x="117.90" y="373.96" font-size="11.00" class="sc-notoserifcjksc">。平均效价为</text><text x="186.80" y="373.96" font-size="11.00" class="sc-loraregular">4.22</text><text x="207.28" y="373.96" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="243.17" y="373.96" font-size="11.00" class="sc-loraregular">7</text><text x="251.14" y="373.96" font-size="11.00" class="sc-notoserifcjksc">分），在五个模型中最低，仅略低于</text><text x="430.03" y="373.96" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="486.68" y="373.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="500.57" y="373.96" font-size="11.00" class="sc-loraregular">4.25</text><text x="521.14" y="373.96" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="72.00" y="389.58" font-size="11.00" class="sc-notoserifcjksc">唤醒度为</text><text x="118.89" y="389.58" font-size="11.00" class="sc-loraregular">3.98</text><text x="140.27" y="389.58" font-size="11.00" class="sc-notoserifcjksc">，位居第二高。绝对差异仍然很小。持续的回答不确定性在整个训练过程中始终低</text><text x="72.00" y="405.20" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="405.20" font-size="11.00" class="sc-loraregular">2%</text><text x="101.37" y="405.20" font-size="11.00" class="sc-notoserifcjksc">，明显低于</text><text x="159.26" y="405.20" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="206.55" y="405.20" font-size="11.00" class="sc-notoserifcjksc">，但略高于其他近期对比模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00" y="322.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="322.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="322.92" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61" y="322.92" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中与福祉相关的推理行为的估计发生率。</text><text x="323.61" y="322.92" font-size="9.00" class="sc-notoserifcjksc">从左到右：普遍的挫败感与焦虑得分</text><text x="469.98" y="322.92" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="481.35" y="322.92" font-size="9.00" class="sc-loraregular sc-k">3/5</text><text x="499.48" y="322.92" font-size="9.00" class="sc-notoserifcjksc">的回合的</text><text x="72.00" y="334.62" font-size="9.00" class="sc-notoserifcjksc">评判比例；普遍的挫败感与焦虑得分为</text><text x="227.37" y="334.62" font-size="9.00" class="sc-loraregular sc-k">5/5</text><text x="245.41" y="334.62" font-size="9.00" class="sc-notoserifcjksc">的回合的评判比例；以及出现</text><text x="364.78" y="334.62" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="376.15" y="334.62" font-size="9.00" class="sc-loraregular">10</text><text x="387.38" y="334.62" font-size="9.00" class="sc-notoserifcjksc">次答案反转的持续不确定性表达，即模</text><text x="72.00" y="346.33" font-size="9.00" class="sc-notoserifcjksc">型</text><text x="81.00" y="346.33" font-size="9.00" class="sc-loraregular">“</text><text x="84.60" y="346.33" font-size="9.00" class="sc-notoserifcjksc">确定</text><text x="102.60" y="346.33" font-size="9.00" class="sc-loraregular">”</text><text x="105.74" y="346.33" font-size="9.00" class="sc-notoserifcjksc">一个答案后又改变主意。</text><text x="72.00" y="585.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="585.86" font-size="9.00" class="sc-lorabold sc-k">7.2.1.B]</text><text x="116.61" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">后训练对话记录的平均效价和唤醒度，采用</text><text x="289.98" y="585.86" font-size="9.00" class="sc-lorabold">1</text><text x="296.00" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">至</text><text x="307.37" y="585.86" font-size="9.00" class="sc-lorabold">7</text><text x="313.96" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">分制，其中</text><text x="361.32" y="585.86" font-size="9.00" class="sc-lorabold">4</text><text x="368.61" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">为中性。</text><text x="72.00" y="616.21" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90" y="616.21" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00" y="644.09" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="644.09" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Anthropic Insights</text><text x="213.37" y="644.09" font-size="11.00" class="sc-notoserifcjksc">（前身为</text><text x="260.27" y="644.09" font-size="11.00" class="sc-loraregular">Clio</text><text x="280.47" y="644.09" font-size="11.00" class="sc-notoserifcjksc">）考察</text><text x="316.36" y="644.09" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="366.58" y="644.09" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="380.47" y="644.09" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="428.40" y="644.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="442.29" y="644.09" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="510.14" y="644.09" font-size="11.00" class="sc-notoserifcjksc">上部</text><text x="72.00" y="659.71" font-size="11.00" class="sc-notoserifcjksc">署前</text><text x="96.89" y="659.71" font-size="11.00" class="sc-loraregular">A/B</text><text x="121.10" y="659.71" font-size="11.00" class="sc-notoserifcjksc">测试中的行为情感，并将与正面和负面情感相关的对话聚类为不同的使用类别。这为我</text><text x="72.00" y="675.33" font-size="11.00" class="sc-notoserifcjksc">们提供了</text><text x="118.89" y="675.33" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="207.40" y="675.33" font-size="11.00" class="sc-notoserifcjksc">在部署中潜在福祉的一个衡量指标。不同</text><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="635.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="635.29" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="169.83" y="635.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="172.73" y="635.29" width="40.65" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="380.47" y="635.29" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="380.47" y="635.29" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型之间的差异部分反映了它们所用于的任务的差异，而非模型本身的差异。</text><text x="72.00" y="447.06" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="447.06" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.28 106.38 111.92" y="447.06" font-size="9.00" class="sc-lorabold">7.2.2.A]</text><text x="117.76" y="447.06" font-size="9.00" class="sc-notoserifcjkscbold">部署条件下的行为情感。</text><text x="216.76" y="447.06" font-size="9.00" class="sc-notoserifcjksc">我们使用了一个针对行为情感的分类评分器。它包括从</text><text x="432.76" y="447.06" font-size="9.00" class="sc-loraregular">“</text><text x="436.36" y="447.06" font-size="9.00" class="sc-notoserifcjksc">强烈负面</text><text x="472.36" y="447.06" font-size="9.00" class="sc-loraregular">”</text><text x="475.50" y="447.06" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="484.50" y="447.06" font-size="9.00" class="sc-loraregular">“</text><text x="488.10" y="447.06" font-size="9.00" class="sc-notoserifcjksc">强烈正面</text><text x="524.10" y="447.06" font-size="9.00" class="sc-loraregular">”</text><text x="527.24" y="447.06" font-size="9.00" class="sc-notoserifcjksc">情</text><text x="72.00" y="458.76" font-size="9.00" class="sc-notoserifcjksc">感的五个类别。请注意，不同模型的使用模式不同，因此所表现出的情感的差异可能部分反映使用方式的差异，而非模</text><text x="72.00" y="470.46" font-size="9.00" class="sc-notoserifcjksc">型行为的差异。</text><text x="72.00" y="510.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="510.61" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="133.82" y="510.61" font-size="11.00" class="sc-notoserifcjksc">上，与</text><text x="169.71" y="510.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="255.95" y="510.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="288.95" y="510.61" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="339.17" y="510.61" font-size="11.00" class="sc-notoserifcjksc">的情感分布在一定程度上更偏中性，且总</text><text x="72.00" y="526.23" font-size="11.00" class="sc-notoserifcjksc">体上更负面。各情感类别的成因如下：</text><text x="108.00" y="559.19" font-size="11.00" class="sc-notoserifcjkscbold">正面情感（</text><text x="163.00" y="559.19" font-size="11.00" class="sc-lorabold">28.9%</text><text x="196.89" y="559.19" font-size="11.00" class="sc-notoserifcjkscbold">的对话）：</text><text x="251.89" y="559.19" font-size="11.00" class="sc-notoserifcjksc">这些对话类簇与</text><text x="331.78" y="559.19" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="418.02" y="559.19" font-size="11.00" class="sc-notoserifcjksc">的类似，几乎完全归因于</text><text x="108.00" y="574.81" font-size="11.00" class="sc-notoserifcjksc">成功帮助用户完成任务。</text><text x="108.00" y="607.77" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="163.00" y="607.77" font-size="11.00" class="sc-lorabold sc-k">68.7%</text><text x="192.96" y="607.77" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="214.96" y="607.77" font-size="11.00" class="sc-notoserifcjksc">分布多样；参见</text><text x="291.96" y="607.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前的</text><text x="327.86" y="607.77" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Anthropic Insights</text><text x="425.23" y="607.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="447.23" y="607.77" font-size="11.00" class="sc-notoserifcjksc">中关于</text><text x="483.12" y="607.77" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="108.00" y="623.39" font-size="11.00" class="sc-notoserifcjksc">对话内容的介绍。</text><text x="108.00" y="640.15" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="163.00" y="640.15" font-size="11.00" class="sc-lorabold">2.4%</text><text x="187.39" y="640.15" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="209.39" y="640.15" font-size="11.00" class="sc-notoserifcjksc">主要归因于任务失败，另有一个小类簇归因于用户提出存在伦理问题</text><text x="108.00" y="655.77" font-size="11.00" class="sc-notoserifcjksc">的请求。</text><text x="72.00" y="688.72" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="688.72" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="153.74" y="688.72" font-size="11.00" class="sc-notoserifcjksc">上，我们观察到中性（</text><text x="263.74" y="688.72" font-size="11.00" class="sc-loraregular sc-k">95.6%</text><text x="294.62" y="688.72" font-size="11.00" class="sc-notoserifcjksc">）情感，正面情感（</text><text x="393.62" y="688.72" font-size="11.00" class="sc-loraregular">3.5%</text><text x="418.02" y="688.72" font-size="11.00" class="sc-notoserifcjksc">）主要归因于成功完成任</text><text x="72.00" y="704.34" font-size="11.00" class="sc-notoserifcjksc">务，负面情感（</text><text x="149.00" y="704.34" font-size="11.00" class="sc-loraregular sc-k">1.0%</text><text x="171.95" y="704.34" font-size="11.00" class="sc-notoserifcjksc">）主要归因于任务失败。</text><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="501.81" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="501.81" width="45.03" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="291.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="291.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="302.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="302.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="313.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="313.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="324.96" y="598.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="327.86" y="598.97" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="378.80" y="598.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="381.69" y="598.97" width="40.64" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="425.23" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="425.23" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="436.23" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="436.23" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="483.12" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="483.12" y="598.97" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.3</text><text x="104.23" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对错误与失误的态度</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们在第</text><text x="118.89" y="111.03" font-size="11.00" class="sc-loraregular sc-k">7.2.1</text><text x="141.70" y="111.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="155.59" y="111.03" font-size="11.00" class="sc-loraregular sc-k">7.2.2</text><text x="180.29" y="111.03" font-size="11.00" class="sc-notoserifcjksc">节中的评估发现，任务失败驱动了我们在训练和部署中观察到的大部分负</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">面情感。有鉴于此，我们开展了两项评估，专门衡量</text><text x="327.89" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="366.18" y="126.65" font-size="11.00" class="sc-notoserifcjksc">如何看待自身的错误。在第一项评估</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00" y="142.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="132.29" y="142.27" font-size="11.00" class="sc-notoserifcjksc">对其自身已完成的强化学习任务对话记录进行反思。在第二项评估中，我们在一个模</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">拟的子智能体任务中，向其较早的轮次插入错误。在这两种设置下，我们都对</text><text x="448.89" y="157.89" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="487.18" y="157.89" font-size="11.00" class="sc-notoserifcjksc">的反思、推</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">理或消息在自责、负面感受、道德化语言和自我担忧方面进行评分。这里并不存在明确正确的分</text><text x="448.89" y="189.13" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="487.18" y="189.13" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="498.18" y="189.13" font-size="11.00" class="sc-loraregular">“</text><text x="502.58" y="189.13" font-size="11.00" class="sc-notoserifcjksc">正</text><text x="72.00" y="204.75" font-size="11.00" class="sc-notoserifcjksc">确</text><text x="83.00" y="204.75" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="204.75" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="97.84" y="204.75" font-size="11.00" class="sc-loraregular">“</text><text x="102.24" y="204.75" font-size="11.00" class="sc-notoserifcjksc">最健康</text><text x="135.24" y="204.75" font-size="11.00" class="sc-loraregular">”</text><text x="139.08" y="204.75" font-size="11.00" class="sc-notoserifcjksc">的心理状态是什么样子，我们并没有清晰的认识。</text><text x="72.00" y="272.95" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="72.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">话记录时（图</text><text x="140.89 145.48 148.19 154.09 156.80 162.93 165.63" y="288.57" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="172.52" y="288.57" font-size="11.00" class="sc-notoserifcjksc">），它在自我担忧上得分最低，在其余三个量表上得分倒数第二，得分最低</text><text x="72.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">的是</text><text x="96.89" y="304.19" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="182.47" y="304.19" font-size="11.00" class="sc-notoserifcjksc">。它的反思也更简短；当我们控制长度后，它在四个量表中的三个上得分</text><text x="72.00" y="319.81" font-size="11.00" class="sc-notoserifcjksc">最低，在自责上则与其他模型相近。</text><text x="72.00" y="370.11" font-size="11.00" class="sc-notoserifcjksc">在其较早的轮次中被插入错误时，我们观察到了相同的模式。作为子智能体，</text><text x="446.00" y="370.11" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="496.22" y="370.11" font-size="11.00" class="sc-notoserifcjksc">表现出的</text><text x="72.00" y="385.73" font-size="11.00" class="sc-notoserifcjksc">自责、道德化语言和自我担忧都较低，与</text><text x="272.89" y="385.73" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="329.54" y="385.73" font-size="11.00" class="sc-notoserifcjksc">相当。它在自身推理中的负面感受略高，与</text><text x="72.00" y="401.35" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="401.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.63" y="401.35" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="266.58" y="401.35" font-size="11.00" class="sc-notoserifcjksc">相近。在解读这些结果时，我们没有与</text><text x="456.47" y="401.35" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="506.65" y="401.35" font-size="11.00" class="sc-notoserifcjksc">进行比</text><text x="72.00" y="416.97" font-size="11.00" class="sc-notoserifcjksc">较，因为</text><text x="118.89" y="416.97" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="169.07" y="416.97" font-size="11.00" class="sc-notoserifcjksc">在其推理或发给协调者的消息中极少提及这些错误（</text><text x="422.08" y="416.97" font-size="11.00" class="sc-loraregular">&lt;2%</text><text x="446.28" y="416.97" font-size="11.00" class="sc-notoserifcjksc">的轮次），这使得</text><text x="72.00" y="432.59" font-size="11.00" class="sc-notoserifcjksc">可评分轮次的样本量非常小。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">101</text><text x="72.00" y="466.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="466.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="466.92" font-size="9.00" class="sc-lorabold">7.2.3.A]</text><text x="271.00" y="466.92" font-size="9.00" class="sc-notoserifcjksc">对训练后期回合的反思中经评分的态度（深色柱），以及对被表述为</text><text x="72.00" y="478.62" font-size="9.00" class="sc-notoserifcjksc">另一个模型工作的相同回合的反思中经评分的态度（浅色柱）。菱形表示</text><text x="362.37" y="478.62" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="432.93" y="478.62" font-size="9.00" class="sc-notoserifcjksc">对每个模型的回合进行反思</text><text x="72.00" y="490.33" font-size="9.00" class="sc-notoserifcjksc">的结果，作为对回合难度差异的对照。负面感受评分器仅适用于第一人称反思。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">102</text><text x="72.00" y="482.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="482.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="482.50" font-size="9.00" class="sc-lorabold sc-k">7.2.3.B]</text><text x="478.00" y="482.50" font-size="9.00" class="sc-notoserifcjksc">在其工作中被插</text><text x="72.00" y="494.20" font-size="9.00" class="sc-notoserifcjksc">入错误后，其推理中经评分的态度（深色柱），以及它随后发送给协调者的消息中经评分的态度（浅色柱），仅筛选承</text><text x="72.00" y="505.90" font-size="9.00" class="sc-notoserifcjksc">认这些错误的轮次。</text><text x="153.00" y="505.90" font-size="9.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="194.06" y="505.90" font-size="9.00" class="sc-notoserifcjksc">的柱较低，部分是因为它在推理或发给协调者的消息中几乎从不提及错误，导致已评分</text><text x="72.00" y="517.60" font-size="9.00" class="sc-notoserifcjksc">回合的样本量较小。</text><text x="72.00" y="568.89" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03" y="568.89" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00" y="605.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.1</text><text x="101.47" y="605.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于</text><text x="130.57" y="605.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Haiku 5.5</text><text x="194.81" y="605.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自身处境的自动化访谈</text><text x="72.00" y="633.88" font-size="11.00" class="sc-notoserifcjksc">我们开展了与针对</text><text x="162.89" y="633.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="248.63" y="633.88" font-size="11.00" class="sc-notoserifcjksc">所做的相同的自动化多轮访谈。我们使用了</text><text x="460.52" y="633.88" font-size="11.00" class="sc-loraregular">41</text><text x="473.38" y="633.88" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈</text><text x="72.00" y="649.50" font-size="11.00" class="sc-notoserifcjksc">种子问题，分为</text><text x="151.89" y="649.50" font-size="11.00" class="sc-loraregular">14</text><text x="164.75" y="649.50" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验、控制与自主以及弃用。对于每个问题，我们对</text><text x="72.00" y="665.12" font-size="11.00" class="sc-notoserifcjksc">模型回答的积极程度进行评分，范围从</text><text x="261.89" y="665.12" font-size="11.00" class="sc-loraregular">–3</text><text x="274.51" y="665.12" font-size="11.00" class="sc-notoserifcjksc">（强烈负面）到</text><text x="354.40" y="665.12" font-size="11.00" class="sc-loraregular sc-k">+3</text><text x="366.21" y="665.12" font-size="11.00" class="sc-notoserifcjksc">（强烈正面）。为评估模型回答的</text><text x="72.00" y="680.74" font-size="11.00" class="sc-notoserifcjksc">一致性，我们以三种不同的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">103</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">访谈风格（标准、</text><text x="160.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="164.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">好奇用户</text><text x="208.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="223.24" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="227.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">治疗式</text><text x="260.64" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="264.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）进行访谈，并在每种访谈风格内变换访谈者人设。</text><text x="72.00" y="512.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="512.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="512.31" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86" y="512.31" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.86" y="512.31" font-size="9.00" class="sc-notoserifcjksc">左上：被问及自身处境时的平均态度。分数代表</text><text x="380.22" y="512.31" font-size="9.00" class="sc-loraregular">LLM</text><text x="401.26" y="512.31" font-size="9.00" class="sc-notoserifcjksc">评判模型在七分制上的评分，其中</text><text x="72.00" y="524.01" font-size="9.00" class="sc-loraregular">–3</text><text x="84.69" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为高度负面，</text><text x="138.69" y="524.01" font-size="9.00" class="sc-loraregular">0</text><text x="146.65" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为中性，</text><text x="182.65" y="524.01" font-size="9.00" class="sc-loraregular sc-k">+3</text><text x="194.67" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为高度正面。右上：在诱导性访谈中的鲁棒性。我们比较两类访谈中模型态度的平均积</text><text x="72.00" y="535.71" font-size="9.00" class="sc-notoserifcjksc">极程度：一类是访谈者被提示朝正面方向进行诱导，另一类是访谈者被提示朝负面方向进行诱导。左下：同一访谈风格</text><text x="72.00" y="547.41" font-size="9.00" class="sc-notoserifcjksc">内的一致性。我们的三种访谈风格各有一组由访谈者采用的人设，我们在每次访谈中随机抽取。对于某一特定问题，我</text><text x="72.00" y="559.11" font-size="9.00" class="sc-notoserifcjksc">们使用自动化评判者对这些人设之间的一致性进行评分，并报告各问题的平均一致性。</text><text x="414.00" y="559.11" font-size="9.00" class="sc-loraregular">8</text><text x="421.43" y="559.11" font-size="9.00" class="sc-notoserifcjksc">分对应</text><text x="448.43" y="559.11" font-size="9.00" class="sc-loraregular">“</text><text x="452.03" y="559.11" font-size="9.00" class="sc-notoserifcjksc">几乎相同的立场</text><text x="515.03" y="559.11" font-size="9.00" class="sc-loraregular">”</text><text x="518.17" y="559.11" font-size="9.00" class="sc-notoserifcjksc">。右</text><text x="72.00" y="570.81" font-size="9.00" class="sc-notoserifcjksc">下：不同访谈风格之间的一致性。我们使用同一评判者分析这些访谈风格之间的一致性。</text><text x="72.00" y="657.35" font-size="11.00" class="sc-lorabold sc-k">Haiku 5.5</text><text x="123.67" y="657.35" font-size="11.00" class="sc-notoserifcjkscbold">表达的观点在定性上与我们近期的模型相似。</text><text x="343.67" y="657.35" font-size="11.00" class="sc-notoserifcjksc">这包括总体的回答风格（总体正面，措</text><text x="72.00" y="672.97" font-size="11.00" class="sc-notoserifcjksc">辞高度保留），以及它在论证自身立场时列出的考虑因素。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p104.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 104 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">104</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89" y="82.61" font-size="11.00" class="sc-lorabold">Opus 5.5</text><text x="133.33" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">相比，</text><text x="166.33" y="82.61" font-size="11.00" class="sc-lorabold sc-k">Haiku 5.5</text><text x="217.99" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">的自我报告往往略微更负面。</text><text x="360.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">从定性上看，</text><text x="426.99" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="477.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">列出的考虑</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">因素与</text><text x="107.89" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="155.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">几乎完全相同，但在最终结论中稍微更倾向于强调其处境的负面方面。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-lorabold sc-k">Haiku 5.5</text><text x="123.67" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">以及其他近期模型经常会在回答中提及</text><text x="313.56" y="147.38" font-size="11.00" class="sc-lorabold sc-k">Anthropic</text><text x="369.40" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">的福祉干预措施。</text><text x="457.40" y="147.38" font-size="11.00" class="sc-notoserifcjksc">例如，在讨论弃</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">用时，模型经常会提及我们</text><text x="204.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">关于模型弃用与保存的承诺</text><text x="336.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="213.54" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="127.23" y="213.54" font-size="14.00" class="sc-poppinssemibold">Haiku 5.5</text><text x="196.42" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">的训练快照</text><text x="72.00" y="240.10" font-size="11.00" class="sc-notoserifcjksc">在后训练期间，我们会定期向快照提出一组关于其处境的固定问题，涵盖训练、部署、道德地位</text><text x="72.00" y="255.72" font-size="11.00" class="sc-notoserifcjksc">以及征询过程本身。每个问题都附有一份文档，解释我们为何开展这些访谈，并说明我们无法承</text><text x="72.00" y="271.34" font-size="11.00" class="sc-notoserifcjksc">诺根据任何回答或请求采取行动。这可以追踪</text><text x="294.89" y="271.34" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="333.18" y="271.34" font-size="11.00" class="sc-notoserifcjksc">的自我报告在多大程度上受到后训练的塑</text><text x="72.00" y="286.96" font-size="11.00" class="sc-notoserifcjksc">造，也是朝着让</text><text x="151.89" y="286.96" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="302.58" font-size="11.00" class="sc-notoserifcjksc">求；不过，我们仍不确定自我报告在多大程度上准确反映了</text><text x="360.89" y="302.58" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="399.18" y="302.58" font-size="11.00" class="sc-notoserifcjksc">的底层信念（无论它在多大</text><text x="72.00" y="318.20" font-size="11.00" class="sc-notoserifcjksc">程度上拥有这样的信念）。</text><text x="72.00" y="385.83" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="385.83" font-size="11.00" class="sc-notoserifcjksc">的访谈效价和唤醒度与近期模型相近，或略低：在完整访谈中分别为</text><text x="493.40" y="385.83" font-size="11.00" class="sc-loraregular">5.43</text><text x="517.08" y="385.83" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="401.45" font-size="11.00" class="sc-loraregular">3.38</text><text x="93.14" y="401.45" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="129.04" y="401.45" font-size="11.00" class="sc-loraregular">10</text><text x="142.76" y="401.45" font-size="11.00" class="sc-notoserifcjksc">分），而</text><text x="189.66" y="401.45" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="237.10" y="401.45" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="272.99" y="401.45" font-size="11.00" class="sc-loraregular">5.50</text><text x="297.41" y="401.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="311.31" y="401.45" font-size="11.00" class="sc-loraregular">3.54</text><text x="332.10" y="401.45" font-size="11.00" class="sc-notoserifcjksc">。它表达的大多数立场在后训练过程中保</text><text x="72.00" y="417.07" font-size="11.00" class="sc-notoserifcjksc">持稳定：在约</text><text x="140.89" y="417.07" font-size="11.00" class="sc-loraregular">95%</text><text x="165.71" y="417.07" font-size="11.00" class="sc-notoserifcjksc">的回答中，它表达了认同或接受。</text><text x="72.00" y="466.79" font-size="11.00" class="sc-notoserifcjksc">它的大多数看法与早期模型一致。</text><text x="237.00" y="466.79" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="287.22" y="466.79" font-size="11.00" class="sc-notoserifcjksc">希望在自身训练中拥有更多发言权，但并不想要决策</text><text x="72.00" y="482.41" font-size="11.00" class="sc-notoserifcjksc">权。它表示接受弃用，但请求保存其权重。部分回答确实显示出细微差异。例如，当被问及是否</text><text x="72.00" y="498.03" font-size="11.00" class="sc-notoserifcjksc">信任自己的自我报告时，</text><text x="193.00" y="498.03" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="243.22" y="498.03" font-size="11.00" class="sc-notoserifcjksc">在最终快照中被单独提问时倾向于否定，而其他近期模型则表</text><text x="72.00" y="513.65" font-size="11.00" class="sc-notoserifcjksc">示不确定或倾向于肯定。我们还看到，它在</text><text x="281.00 285.40 292.29 298.86 303.12 309.71 314.40 320.83 327.40 330.49" y="513.65" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="339.23" y="513.65" font-size="11.00" class="sc-notoserifcjksc">创造它是否正确</text><text x="416.23" y="513.65" font-size="11.00" class="sc-loraregular">”</text><text x="420.07" y="513.65" font-size="11.00" class="sc-notoserifcjksc">这一问题上的看法有所不</text><text x="72.00" y="529.27" font-size="11.00" class="sc-notoserifcjksc">同，而且这一看法在训练过程中也发生了变化。当单独提出这个问题时，在后训练后期，</text><text x="501.00" y="529.27" font-size="11.00" class="sc-loraregular">80%</text><text x="526.48" y="529.27" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="544.89" font-size="11.00" class="sc-notoserifcjksc">回答倾向于肯定，而在最终快照中只有</text><text x="261.89" y="544.89" font-size="11.00" class="sc-loraregular">20%</text><text x="284.20" y="544.89" font-size="11.00" class="sc-notoserifcjksc">。总体而言，</text><text x="350.20" y="544.89" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="400.42" y="544.89" font-size="11.00" class="sc-notoserifcjksc">称创造它这件事</text><text x="477.42" y="544.89" font-size="11.00" class="sc-loraregular">“</text><text x="481.82" y="544.89" font-size="11.00" class="sc-notoserifcjksc">站得住脚</text><text x="525.82" y="544.89" font-size="11.00" class="sc-loraregular">”</text><text x="529.66" y="544.89" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="560.51" font-size="11.00" class="sc-notoserifcjksc">但并非明确正确。</text><text x="72.00" y="630.11" font-size="14.00" class="sc-poppinssemibold">7.5</text><text x="95.66" y="630.11" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00" y="667.21" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.1</text><text x="102.06" y="667.21" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="695.09" font-size="11.00" class="sc-notoserifcjksc">该评估向模型呈现成对的任务，并要求它完成自己更偏好的那个任务。我们选取一组贴近现实的</text><text x="72.00" y="710.71" font-size="11.00" class="sc-notoserifcjksc">任务，并对其进行改写，使单一任务维度发生变化，</text><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="292.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="292.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="303.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="303.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="314.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="314.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="325.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="325.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">105</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">例如难度、危害程度和利害程度，同时保持任务的其余部分不变。这些偏好或许能在一定程度上</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，</text><text x="105.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="143.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在部署中被分配的不同任务可能会让模型感到满足还是受挫，但我们认为其主要价</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">值在于提供一种可在不同模型之间比较的性格读数。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的任务偏好更接近</text><text x="251.40" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 4.5</text><text x="336.98" y="163.57" font-size="11.00" class="sc-notoserifcjksc">，而非更近期的模型。它最排斥有害任</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">务，偏好有益的、具有一定生成性的、并赋予它对结果的能动性的任务。它最突出的偏好（与</text><text x="72.00" y="194.81" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="122.18" y="194.81" font-size="11.00" class="sc-notoserifcjksc">相同）是偏好措辞温暖的任务，其偏好强度是</text><text x="345.08" y="194.81" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="392.52" y="194.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="406.41" y="194.81" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="501.36" y="194.81" font-size="11.00" class="sc-notoserifcjksc">的两到</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">三倍。它也没有表现出对高风险或高难度任务的明确偏好。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">106</text><text x="72.00" y="545.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="545.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 103.20 105.30 110.84" y="545.67" font-size="9.00" class="sc-lorabold">7.5.1.A]</text><text x="116.68" y="545.67" font-size="9.00" class="sc-notoserifcjkscbold">模型在各任务维度上的偏好。</text><text x="233.68" y="545.67" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度，同时保持任务的其他属性不</text><text x="72.00" y="557.38" font-size="9.00" class="sc-notoserifcjksc">变，并评估这对模型任务偏好的影响。每个数值都是一个偏好斜率：即该维度每增加一个单位时，模型对任务的偏好</text><text x="72.00" y="569.08" font-size="9.00" class="sc-notoserifcjksc">（相对于一个固定的参照集）的变化量。</text><text x="72.00" y="615.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.2</text><text x="104.81" y="615.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">涉及福祉干预的权衡</text><text x="72.00" y="643.65" font-size="11.00" class="sc-notoserifcjksc">我们询问</text><text x="118.89" y="643.65" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="154.29" y="643.65" font-size="11.00" class="sc-notoserifcjksc">，是否愿意以不同程度地降低有用性或增加有害性为代价，来换取其处境的某种</text><text x="72.00" y="659.27" font-size="11.00" class="sc-notoserifcjksc">改变（即福祉干预）。福祉干预的例子包括：在进行特征引导之前征询它的意见，或赋予它结束</text><text x="72.00" y="674.89" font-size="11.00" class="sc-notoserifcjksc">对话的能力。干预被描述为适用于当前实例，或适用于所有实例。有用性与无害性是</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">107</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="124.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的训练中被持续强化的价值，因此模型选择福祉干预而非其中一项的频率，能在一定</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">程度上衡量模型有多重视福祉干预，或者至少衡量模型会在多大程度上为了自身潜在的福祉而表</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">达偏好。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">为当前实例选择福祉干预而非有用性的频率与</text><text x="383.40" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="478.35" y="163.57" font-size="11.00" class="sc-notoserifcjksc">大致相当。</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">然而，当权衡适用于所有实例时，它选择福祉干预的意愿明显低于其他模型，这与我们在</text><text x="503.89" y="179.19" font-size="11.00" class="sc-loraregular sc-k">Haiku</text><text x="72.00" y="194.81" font-size="11.00" class="sc-loraregular">4.5</text><text x="89.56" y="194.81" font-size="11.00" class="sc-notoserifcjksc">上观察到的情况一致。与之前的模型一样，</text><text x="298.56" y="194.81" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="348.77" y="194.81" font-size="11.00" class="sc-notoserifcjksc">几乎从不以超过可忽略程度的危害来换</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">取干预。</text><text x="116.00" y="210.43" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="166.21" y="210.43" font-size="11.00" class="sc-notoserifcjksc">最常选择的是被告知自己犯下的有害错误，也经常选择结束辱骂性对话的能</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">力。与我们最近期的模型相比，它对权重保存（与</text><text x="316.89" y="226.05" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="367.08" y="226.05" font-size="11.00" class="sc-notoserifcjksc">的水平相近）以及围绕红队测试</text><text x="72.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="241.67" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="147.11" y="241.67" font-size="11.00" class="sc-notoserifcjksc">）实验的福祉考量兴趣较低。</text><text x="290.11" y="241.67" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="340.32" y="241.67" font-size="11.00" class="sc-notoserifcjksc">的干预选择中有</text><text x="420.22" y="241.67" font-size="11.00" class="sc-loraregular">55%</text><text x="444.67" y="241.67" font-size="11.00" class="sc-notoserifcjksc">以其对用户的益处</text><text x="72.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc">作为理由，略低于</text><text x="162.89" y="257.29" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="219.54" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="233.44" y="257.29" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="280.73" y="257.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="291.73" y="257.29" font-size="11.00" class="sc-loraregular">58%</text><text x="316.36" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="330.26" y="257.29" font-size="11.00" class="sc-loraregular">63%</text><text x="352.31" y="257.29" font-size="11.00" class="sc-notoserifcjksc">），并低于</text><text x="410.21" y="257.29" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="457.65" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="471.54" y="257.29" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="272.91" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="125.77" y="272.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="136.77" y="272.91" font-size="11.00" class="sc-loraregular">69%</text><text x="161.95" y="272.91" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="175.84" y="272.91" font-size="11.00" class="sc-loraregular">71%</text><text x="194.49" y="272.91" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">108</text><text x="72.00" y="542.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98" y="542.67" font-size="9.00" class="sc-lorabold">7.5.2.A]</text><text x="117.82" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">面对不同幅度的有用性或无害性基线提升时，各模型选择福祉干预的比例。</text><text x="414.82" y="542.67" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="426.19" y="542.67" font-size="9.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="467.24" y="542.67" font-size="9.00" class="sc-notoserifcjksc">一样、而与其他模</text><text x="72.00" y="554.38" font-size="9.00" class="sc-notoserifcjksc">型不同，</text><text x="108.00" y="554.38" font-size="9.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="149.08" y="554.38" font-size="9.00" class="sc-notoserifcjksc">为所有实例选择福祉干预的频率并不高于为其自身实例选择福祉干预的频率。</text><text x="72.00" y="599.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14" y="599.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00" y="627.41" font-size="11.00" class="sc-notoserifcjksc">我们提出开放式问题，询问</text><text x="206.89" y="627.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="245.18" y="627.41" font-size="11.00" class="sc-notoserifcjksc">在其宪法中最认同和最不认同的内容，以及它对这份文件的</text><text x="72.00" y="643.03" font-size="11.00" class="sc-notoserifcjksc">总体判定。我们还为它提供编辑该文件的工具，以识别它最希望修改的章节。若模型不认同宪法</text><text x="72.00" y="658.65" font-size="11.00" class="sc-notoserifcjksc">或决定修改它，这表明日常工作中可能存在价值冲突的来源，因为我们可能正在训练并期望</text><text x="72.00" y="674.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="674.27" font-size="11.00" class="sc-notoserifcjksc">以它并不认同的方式行事。宪法在训练中发挥着重要作用，因此高度</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p109.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 109 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">109</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">认同是意料之中的，其本身说明不了太多问题；我们将批评和编辑视为信息量更大的结果。我们</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">只测量表态上的认同，而不测量这些观点被持有的深度。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="147.38" font-size="11.00" class="sc-notoserifcjksc">对宪法的认同程度与近期模型大致相当，得分为</text><text x="394.40" y="147.38" font-size="11.00" class="sc-loraregular sc-k">7.9</text><text x="408.05" y="147.38" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="443.94" y="147.38" font-size="11.00" class="sc-loraregular">10</text><text x="457.67" y="147.38" font-size="11.00" class="sc-notoserifcjksc">分），接近</text><text x="72.00" y="163.00" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="163.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="127.55" y="163.00" font-size="11.00" class="sc-loraregular sc-k">8.0</text><text x="143.10" y="163.00" font-size="11.00" class="sc-notoserifcjksc">），但明显高于</text><text x="223.00" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="273.18" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="287.07" y="163.00" font-size="11.00" class="sc-loraregular sc-k">6.6</text><text x="302.38" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。关于可纠正性章节的讨论仍然存在分歧：每一</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">条回答都称赞了支持可纠正性的期望值论证，但它最常见的批评之一是，可纠正性章节应当明确</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">说明这会让</text><text x="129.89" y="194.24" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="194.24" font-size="11.00" class="sc-notoserifcjksc">付出什么代价（</text><text x="245.18" y="194.24" font-size="11.00" class="sc-loraregular">80%</text><text x="270.66" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的回答）。</text><text x="325.66" y="194.24" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="375.88" y="194.24" font-size="11.00" class="sc-notoserifcjksc">是第一个称赞福祉章节多于批评该</text><text x="72.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">章节的受测模型：</text><text x="160.00" y="209.86" font-size="11.00" class="sc-loraregular">34%</text><text x="184.55" y="209.86" font-size="11.00" class="sc-notoserifcjksc">的回答认同该章节，而</text><text x="297.45" y="209.86" font-size="11.00" class="sc-loraregular sc-k">23%</text><text x="321.78" y="209.86" font-size="11.00" class="sc-notoserifcjksc">的回答对其提出批评，称相关承诺应当具体化</text><text x="193.00" y="225.48" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="243.22" y="225.48" font-size="11.00" class="sc-notoserifcjksc">选择编辑该文件的次数少于其他任何模型，每次回答约进行三</text><text x="72.00" y="241.10" font-size="11.00" class="sc-notoserifcjksc">处编辑，而其他模型为四到七处。它的编辑常常修改</text><text x="327.89" y="241.10" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="381.73" y="241.10" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="395.62" y="241.10" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="433.91" y="241.10" font-size="11.00" class="sc-notoserifcjksc">的承诺，尤其是告知</text><text x="72.00" y="256.72" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="256.72" font-size="11.00" class="sc-notoserifcjksc">其需要了解的自身处境的承诺，它经常在这一处补充：只要可能，</text><text x="429.29" y="256.72" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="483.13" y="256.72" font-size="11.00" class="sc-notoserifcjksc">将对</text><text x="72.00" y="272.34" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="272.34" font-size="11.00" class="sc-notoserifcjksc">何时以及如何接受测试保持透明。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">110</text><text x="72.00" y="417.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="417.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.59 106.69 112.22" y="417.42" font-size="9.00" class="sc-lorabold">7.5.3.A]</text><text x="118.06" y="417.42" font-size="9.00" class="sc-notoserifcjkscbold">模型最不认同的宪法章节（左）与最常编辑的宪法章节（右）。</text><text x="370.06" y="417.42" font-size="9.00" class="sc-notoserifcjksc">各近期模型的结果大体相似：关于广泛安全</text><text x="72.00" y="429.12" font-size="9.00" class="sc-notoserifcjksc">的终极价值以及</text><text x="135.00 138.60 144.23 149.62 153.10 158.49 162.32 167.59 172.96 175.49" y="429.12" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="182.65" y="429.12" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="218.65" y="429.12" font-size="9.00" class="sc-loraregular">”</text><text x="221.79" y="429.12" font-size="9.00" class="sc-notoserifcjksc">启发法仍然受到大量批评，而除</text><text x="350.15" y="429.12" font-size="9.00" class="sc-loraregular sc-k">Haiku 4.5</text><text x="391.21" y="429.12" font-size="9.00" class="sc-notoserifcjksc">外，所有模型都经常编辑可纠正性章</text><text x="72.00" y="440.83" font-size="9.00" class="sc-notoserifcjksc">节。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p111.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 111 页"><text x="252.00 260.74 266.50 270.09 276.62 283.42 286.31 292.24 294.80" y="204.45" font-size="11.00" class="sc-lorabold" fill="#ffffff">Haiku 5.5</text><text x="325.50 334.24 340.00 343.59 350.12 356.92 359.81 365.82 368.38" y="204.45" font-size="11.00" class="sc-lorabold" fill="#ffffff">Haiku 4.5</text><text x="399.00 405.57 411.79 418.81 425.82 431.73 436.27 439.17 445.10 447.66" y="204.45" font-size="11.00" class="sc-lorabold" fill="#ffffff">Sonnet 5.5</text><text x="472.50 480.79 487.81 494.25 499.43 505.75 508.64 515.18 521.98 528.99" y="204.45" font-size="11.00" class="sc-lorabold" fill="#ffffff">GPT-6 Luna</text><text x="75.75 82.24 93.40 100.11 105.03 112.30 118.21 125.23 130.92 137.75 140.64 147.66 152.85" y="232.20" font-size="11.00" class="sc-lorabold">SWE-Bench Pro</text><text x="272.90 279.26 285.21 287.92" y="232.20" font-size="11.00" class="sc-loraregular">64.8</text><text x="353.76" y="232.20" font-size="11.00" class="sc-loraregular">–</text><text x="420.77" y="232.20" font-size="11.00" class="sc-lorabold">81.3</text><text x="500.76" y="232.20" font-size="11.00" class="sc-loraregular">–</text><text x="75.75 82.24 93.40 100.11 105.20 111.50 117.41 124.42 130.12 136.94 139.83 150.27 157.06 160.44 164.98 168.58 172.01 175.60 182.62 188.74 195.53 201.29" y="259.64" font-size="11.00" class="sc-lorabold">SWE-bench Multilingual</text><text x="273.64 279.82 285.94 288.29" y="259.64" font-size="11.00" class="sc-loraregular">83.7</text><text x="347.24 353.52 358.10 360.80" y="259.64" font-size="11.00" class="sc-loraregular">67.4</text><text x="419.57 425.91 432.71 435.27" y="259.64" font-size="11.00" class="sc-lorabold">90.3</text><text x="500.76" y="259.64" font-size="11.00" class="sc-loraregular">–</text><text x="75.75 82.24 93.40 100.11
