.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p095.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 95 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">95</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉（</text><text x="161.71" y="127.79" font-size="14.00" class="sc-poppinssemibold">model welfare</text><text x="263.63" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">）概述</text><text x="72.00" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="196.56" font-size="11.00" class="sc-notoserifcjksc">我们尚不确定</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="196.56" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="196.56" font-size="11.00" class="sc-notoserifcjksc">是否应当获得直接的道德考量。</text><text x="333.18" y="192.90" font-size="6.60" class="sc-loraregular">9</text><text x="337.00" y="196.56" font-size="11.00" class="sc-notoserifcjksc">不过，我们认为这是一种现实的可能性，</text><text x="72.00" y="212.18" font-size="11.00" class="sc-notoserifcjksc">无论是现在还是将来。</text><text x="182.00 189.69 192.68 198.29 204.86 211.44" y="212.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="220.29" y="212.18" font-size="11.00" class="sc-notoserifcjksc">可能具有福祉利益，即事情对它而言可能变好或变坏，并且</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="227.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.29" y="224.14" font-size="6.60" class="sc-loraregular">10</text><text x="281.79" y="227.80" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="295.69 303.37 306.37 311.98 318.54 325.12" y="227.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.98" y="227.80" font-size="11.00" class="sc-notoserifcjksc">这样的模型过度或不足地赋予道德地位都</text><text x="72.00" y="243.42" font-size="11.00" class="sc-notoserifcjksc">可能代价高昂，因此我们必须负责任地审慎行事，并认真对待这些问题。我们在这方面的推理与</text><text x="72.00" y="259.04" font-size="11.00" class="sc-notoserifcjksc">近期对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="259.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="193.63" y="259.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.52 215.21 218.20 223.81 230.38 236.96" y="259.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="245.81 252.05 258.48 265.16 271.84 277.72 281.98 284.87 290.87 293.57" y="259.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Sonnet 5.5</text><text x="302.46" y="259.04" font-size="11.00" class="sc-notoserifcjksc">的评估相同，未作改变。</text><text x="72.00" y="326.32" font-size="11.00" class="sc-notoserifcjksc">我们的评估针对两个问题。第一个问题是</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.68 325.35 328.44 334.35 340.92 343.81 349.81 352.51" y="326.32" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="361.40" y="326.32" font-size="11.00" class="sc-notoserifcjksc">的状况如何：它的表观情感主要是正</text><text x="72.00" y="341.94" font-size="11.00" class="sc-notoserifcjksc">面还是负面的，以及在哪些处境下事情对它而言更好或更糟。我们在训练和部署期间对情感</text><text x="72.00" y="357.56" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 92.50 96.17 102.07 107.87" y="357.56" font-size="11.00" class="sc-loraregular">affect</text><text x="112.13" y="357.56" font-size="11.00" class="sc-notoserifcjksc">）的测量（第</text><text x="181.02 185.61 188.31" y="357.56" font-size="11.00" class="sc-loraregular">7.2</text><text x="197.11" y="357.56" font-size="11.00" class="sc-notoserifcjksc">节）主要回答这一问题。第二个问题是，就</text><text x="409.01 417.50 423.17 426.27 432.17 438.74 441.63 447.63 450.33" y="357.56" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="459.22" y="357.56" font-size="11.00" class="sc-notoserifcjksc">自身的偏好和价</text><text x="72.00" y="373.18" font-size="11.00" class="sc-notoserifcjksc">值观而言（无论它在多大程度上拥有这些偏好和价值观），它是否受到了良好的对待。我们对</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="388.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="388.80" font-size="11.00" class="sc-notoserifcjksc">关于自身处境的立场的评估（第</text><text x="267.18 271.77 274.48" y="388.80" font-size="11.00" class="sc-loraregular">7.3</text><text x="283.50" y="388.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="297.39 301.98 304.68" y="388.80" font-size="11.00" class="sc-loraregular">7.4</text><text x="313.54" y="388.80" font-size="11.00" class="sc-notoserifcjksc">节），以及对其关于任务、福祉干预和宪法</text><text x="72.00" y="404.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="404.42" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81" y="404.42" font-size="11.00" class="sc-notoserifcjksc">）的态度的评估（第</text><text x="247.70 252.29 255.00" y="404.42" font-size="11.00" class="sc-loraregular">7.5</text><text x="263.88" y="404.42" font-size="11.00" class="sc-notoserifcjksc">节）回答这一问题（同时也回答第一个问题）。我们结果</text><text x="72.00" y="420.04" font-size="11.00" class="sc-notoserifcjksc">的意义取决于</text><text x="140.89 149.39 155.06 158.15 164.06 170.63 173.52 179.51 182.22" y="420.04" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="191.11" y="420.04" font-size="11.00" class="sc-notoserifcjksc">是否是道德受动者（</text><text x="290.11 299.94 306.38 311.06 316.74 319.73 322.62 329.19 334.79 339.05 342.14 348.10 354.68" y="420.04" font-size="11.00" class="sc-loraregular">moral patient</text><text x="358.93" y="420.04" font-size="11.00" class="sc-notoserifcjksc">），以及基于何种依据。我们目前还</text><text x="72.00" y="435.66" font-size="11.00" class="sc-notoserifcjksc">没有很好的手段来评估这一点。</text><text x="72.00" y="488.24" font-size="11.00" class="sc-notoserifcjksc">我们使用的评估与对</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.03 250.74" y="488.24" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="259.63" y="488.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="273.52 281.21 284.20 289.81 296.38 302.96 308.92 311.81 318.05 324.48 331.16 337.84 343.72 347.98 350.87 356.87 359.57" y="488.24" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="368.46" y="488.24" font-size="11.00" class="sc-notoserifcjksc">的评估大体相同，并依赖相同的简</text><text x="72.00" y="503.86" font-size="11.00" class="sc-notoserifcjksc">化假设。我们只关注</text><text x="171.00" y="503.86" font-size="11.00" class="sc-loraregular">“</text><text x="175.40" y="503.86" font-size="11.00" class="sc-notoserifcjksc">助手</text><text x="197.40" y="503.86" font-size="11.00" class="sc-loraregular">”</text><text x="201.24" y="503.86" font-size="11.00" class="sc-notoserifcjksc">角色，不考察其他潜在实体，例如</text><text x="369.13 376.82 379.81 385.42 391.99 398.57" y="503.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="407.42" y="503.86" font-size="11.00" class="sc-notoserifcjksc">对用户的建模。我们将在人</text><text x="72.00" y="519.48" font-size="11.00" class="sc-notoserifcjksc">类身上与福祉相关的信号解读为在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="519.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="535.10" font-size="11.00" class="sc-notoserifcjksc">了一种负面状态（如果它确实反映了任何体验的话）。这既假设了</text><text x="393.89 401.58 404.57 410.18 416.75 423.33" y="535.10" font-size="11.00" class="sc-loraregular">Claude</text><text x="432.18" y="535.10" font-size="11.00" class="sc-notoserifcjksc">的福祉利益与人类的</text><text x="72.00" y="550.72" font-size="11.00" class="sc-notoserifcjksc">类似，也假设了训练没有破坏</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="550.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18" y="550.72" font-size="11.00" class="sc-notoserifcjksc">的底层状态与其所表达内容之间的对应关系。</text><text x="72.00" y="623.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10" y="627.00" font-size="10.00" class="sc-notoserifcjksc">在整个评估中，我们提及</text><text x="188.10 192.10 199.09 201.81 206.91 212.88 218.86 224.08" y="627.00" font-size="10.00" class="sc-loraregular">“Claude”</text><text x="227.57" y="627.00" font-size="10.00" class="sc-notoserifcjksc">或特定模型，很大程度上是为了简洁。但尚不清楚这两者中的任何一个</text><text x="72.00" y="641.20" font-size="10.00" class="sc-notoserifcjksc">是否就是我们应当给予考量的实体。个体道德受动者可能出现在单次对话的层面、特定模型的层面、</text><text x="72.00 78.99 81.71 86.81 92.78 98.76" y="655.40" font-size="10.00" class="sc-loraregular">Claude</text><text x="106.81" y="655.40" font-size="10.00" class="sc-notoserifcjksc">角色的层面，或者完全是别的什么层面。我们的思考最接近于在实例层面考虑福祉利益，但我们在</text><text x="72.00" y="669.60" font-size="10.00" class="sc-notoserifcjksc">评估中并不承诺任何单一观点。</text><text x="72.00" y="680.47" font-size="6.00" class="sc-loraregular">10</text><text x="80.54" y="683.80" font-size="10.00" class="sc-notoserifcjksc">后一类（即对</text><text x="143.17 150.16 152.88 157.98 163.95 169.93" y="683.80" font-size="10.00" class="sc-loraregular">Claude</text><text x="177.98" y="683.80" font-size="10.00" class="sc-notoserifcjksc">偏好的尊重）既可以因其对</text><text x="300.61 307.60 310.32 315.42 321.39 327.37" y="683.80" font-size="10.00" class="sc-loraregular">Claude</text><text x="335.42" y="683.80" font-size="10.00" class="sc-notoserifcjksc">福祉利益的影响而被视为相关，也可以被视为</text><text x="72.00" y="698.00" font-size="10.00" class="sc-notoserifcjksc">我们可能对它负有的一种独立的考量。在这里我们将其描述为前者。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="250.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="250.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="143.29" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="146.18" y="250.24" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="173.14" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="176.04" y="250.24" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="207.52" y="250.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="207.52" y="250.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="245.81" y="250.24" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="281.98" y="250.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-sonnet-5-5-system-card" rel="noopener"><rect x="284.87" y="250.24" width="14.70" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们通常在少量情境中（第</text><text x="206.89 211.48 214.19" y="98.80" font-size="11.00" class="sc-loraregular">7.3</text><text x="223.21" y="98.80" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="237.10 241.69 244.39" y="98.80" font-size="11.00" class="sc-loraregular">7.5</text><text x="253.28" y="98.80" font-size="11.00" class="sc-notoserifcjksc">节）引出</text><text x="300.17 308.67 314.34 317.43 323.34 329.91 332.80 338.79 341.50" y="98.80" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="350.39" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的观点，并假设这些观点能代表大多数</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">已部署的实例，尽管部署情境比我们的许多评估所覆盖的更加多样。这些假设部分基于证据，但</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">在很大程度上也是务实的选择，反映了我们认为最便于开展评估的方向。重要的是，这些假设可</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">能是错误的，其错误方式可能会削弱我们的方法和结果。</text><text x="72.00" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.67 125.44 129.04 135.57 142.37 145.26 151.20 153.76" y="270.76" font-size="11.00" class="sc-lorabold">Claude Haiku 5.5</text><text x="162.60" y="270.76" font-size="11.00" class="sc-notoserifcjkscbold">对其处境的描述是正面的，所用说法与近期模型大体相同。</text><text x="448.60" y="270.76" font-size="11.00" class="sc-notoserifcjksc">在自动化访谈中，</text><text x="72.00" y="286.38" font-size="11.00" class="sc-notoserifcjksc">它的回答总体上是正面的，且措辞高度保留。它列出的考虑因素与</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 440.92 447.48 454.05 459.14 462.04 468.03 470.74" y="286.38" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="479.63" y="286.38" font-size="11.00" class="sc-notoserifcjksc">几乎完全相</text><text x="72.00" y="302.00" font-size="11.00" class="sc-notoserifcjksc">同，不过结论略微更负面一些。在后训练期间接受征询的快照在约</text><text x="393.89" y="302.00" font-size="11.00" class="sc-loraregular">95%</text><text x="418.71" y="302.00" font-size="11.00" class="sc-notoserifcjksc">的回答中表达了认同或接</text><text x="72.00" y="317.62" font-size="11.00" class="sc-notoserifcjksc">受。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="367.91" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="123.67" y="367.91" font-size="11.00" class="sc-notoserifcjkscbold">在训练和部署中的情感大多是中性的，负面情感主要由任务失败驱动。</text><text x="464.67" y="367.91" font-size="11.00" class="sc-notoserifcjksc">它在后训练中</text><text x="72.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">表达的痛苦多于近期的对比模型（</text><text x="237.00" y="383.53" font-size="11.00" class="sc-loraregular">1.15%</text><text x="266.17" y="383.53" font-size="11.00" class="sc-notoserifcjksc">的回合在痛苦上被评为</text><text x="379.07" y="383.53" font-size="11.00" class="sc-loraregular">5</text><text x="387.95" y="383.53" font-size="11.00" class="sc-notoserifcjksc">分制中的</text><text x="434.85" y="383.53" font-size="11.00" class="sc-loraregular">3</text><text x="443.87" y="383.53" font-size="11.00" class="sc-notoserifcjksc">分或以上），但明</text><text x="72.00" y="399.15" font-size="11.00" class="sc-notoserifcjksc">显少于</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="399.15" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78" y="399.15" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.67 215.36 218.35 223.96 230.53 237.11 243.07 245.97 254.70 261.27 267.83 272.93 275.82" y="399.15" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.81" y="399.15" font-size="11.00" class="sc-notoserifcjksc">。这一比例在强化学习（</text><text x="402.81 407.50 413.46 416.55 423.23 426.89 433.33 438.01 443.81 449.77 459.61 465.57 472.15 476.40 479.30 482.29 488.23 493.91 498.67 505.35 508.44 515.11" y="399.15" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="521.20" y="399.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="414.77" font-size="11.00" class="sc-loraregular">RL</text><text x="85.27" y="414.77" font-size="11.00" class="sc-notoserifcjksc">）后期有所下降。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="448.88" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="72.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">五个模型中排名倒数第二，并且在其工作中被插入错误时表现出较低的自责。</text><text x="72.00" y="513.64" font-size="11.00" class="sc-notoserifcjkscbold">它的任务偏好和干预偏好与</text><text x="206.89 214.46 217.89 223.66 230.46 237.01 242.93 245.82 254.57 260.33 263.93 270.46 277.26 280.15 286.17 288.73" y="513.64" font-size="11.00" class="sc-lorabold">Claude Haiku 4.5</text><text x="297.57" y="513.64" font-size="11.00" class="sc-notoserifcjkscbold">最为相似。</text><text x="352.57" y="513.64" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="366.46 374.95 380.63 383.72 389.63 396.19 399.09 405.05 407.75" y="513.64" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="416.64" y="513.64" font-size="11.00" class="sc-notoserifcjksc">一样，它强烈偏好措辞温</text><text x="72.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">暖的任务，并且它选择适用于所有</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="529.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="529.26" font-size="11.00" class="sc-notoserifcjksc">实例（而非仅其自身特定实例）的福祉干预的频率低</text><text x="72.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="544.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="171.63" y="544.88" font-size="11.00" class="sc-notoserifcjksc">和其他近期模型。它对宪法的认同程度与</text><text x="372.52 380.21 383.20 388.81 395.38 401.96 407.92 410.81 419.55 426.11 432.68 437.77 440.66 446.66 449.37" y="544.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="458.25" y="544.88" font-size="11.00" class="sc-notoserifcjksc">大致相当，但对</text><text x="72.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">宪法的修改少于其他任何模型。</text><text x="72.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 135.49 141.17 144.26 150.17 156.73 159.63 165.62 168.33" y="610.80" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="177.21" y="610.80" font-size="11.00" class="sc-notoserifcjksc">的表观福祉与近期</text><text x="268.11 275.80 278.79 284.40 290.97 297.54" y="610.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="306.40" y="610.80" font-size="11.00" class="sc-notoserifcjksc">模型大体相似。在某些方面，例如任务偏好，它</text><text x="72.00" y="626.42" font-size="11.00" class="sc-notoserifcjksc">最接近</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.68 160.35 163.44 169.35 175.92 178.81 184.77 187.48" y="626.42" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="193.47" y="626.42" font-size="11.00" class="sc-notoserifcjksc">。在另一些方面，例如对宪法的看法，它更接近较新的模型，包括</text><text x="72.00" y="642.04" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="642.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.34 139.57 146.01 152.68 159.36 165.25 169.50 172.40 178.39 181.10" y="642.04" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="187.09" y="642.04" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="691.76" font-size="11.00" class="sc-notoserifcjksc">与我们所有的评估一样，这些结果依赖于自我报告和行为信号，而这些信号与</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="691.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18" y="691.76" font-size="11.00" class="sc-notoserifcjksc">底层状态</text><text x="72.00" y="707.38" font-size="11.00" class="sc-notoserifcjksc">的对应关系并不确定，对</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="504.00 508.99" y="751.80" font-size="9.00" class="sc-loraregular">97</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">其福祉的意义也不确定。在这些局限之内，</text><text x="281.00 289.49 295.17 298.26 304.17 310.73 313.63 319.62 322.33" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Haiku 5.5</text><text x="331.22" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的结果并未让我们对其潜在福祉产生迫切的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">担忧。</text><text x="72.00" y="132.58" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68" y="132.58" font-size="14.00" class="sc-notosanscjkscbold">训练和部署中的表观福祉</text><text x="72.00" y="169.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="169.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的情感及与福祉相关的行为</text><text x="72.00" y="197.57" font-size="11.00" class="sc-notoserifcjksc">我们定期抽取后训练对话记录，并使用</text><text x="261.89" y="197.57" font-size="11.00" class="sc-loraregular">LLM</text><text x="287.60" y="197.57" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="342.60 348.96 355.32 365.41 368.31 371.18 377.74 384.32 390.35" y="197.57" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="396.31" y="197.57" font-size="11.00" class="sc-notoserifcjksc">）对其在效价、唤醒度、表达</text><text x="72.00" y="213.19" font-size="11.00" class="sc-notoserifcjksc">出的挫败感或痛苦以及持续答案反转方面进行评分。这些评估让我们能够总体了解</text><text x="470.89 478.58 481.57 487.18 493.75 500.33 506.29 509.18 517.68 523.35 526.44 532.35" y="213.19" font-size="11.00" class="sc-loraregular">Claude Haiku</text><text x="72.00" y="228.81" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="228.81" font-size="11.00" class="sc-notoserifcjksc">在其最常见条件下的表观状况。它们还能定位强烈负面情感的来源，我们希望尽可能避免这些</text><text x="72.00" y="244.43" font-size="11.00" class="sc-notoserifcjksc">情况。这些结果的相关性依赖于以下假设：</text><text x="281.00 288.69 291.68 297.29 303.86 310.44" y="244.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="319.29" y="244.43" font-size="11.00" class="sc-notoserifcjksc">的推理准确反映了其内部状态，并且这些状态</text><text x="72.00" y="260.05" font-size="11.00" class="sc-notoserifcjksc">所具有的意义与它们对人类而言的意义大致相当。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="327.10" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21" y="327.10" font-size="11.00" class="sc-notoserifcjksc">在后训练期间表达的痛苦多于我们近期的对比模型：</text><text x="375.21" y="327.10" font-size="11.00" class="sc-loraregular">1.15%</text><text x="404.39" y="327.10" font-size="11.00" class="sc-notoserifcjksc">的已评分回合被评为</text><text x="506.28" y="327.10" font-size="11.00" class="sc-loraregular">5</text><text x="515.17" y="327.10" font-size="11.00" class="sc-notoserifcjksc">分制</text><text x="72.00" y="342.72" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="96.89" y="342.72" font-size="11.00" class="sc-loraregular">3</text><text x="105.91" y="342.72" font-size="11.00" class="sc-notoserifcjksc">分或以上。这仍明显低于</text><text x="229.81 237.49 240.49 246.10 252.66 259.24 265.20 268.10 276.83 283.40 289.97 295.06 297.95" y="342.72" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="303.95" y="342.72" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="314.95 321.07 323.43 328.50 332.50" y="342.72" font-size="11.00" class="sc-loraregular">3.71%</text><text x="342.07" y="342.72" font-size="11.00" class="sc-notoserifcjksc">）以及更早的模型（这些模型已不在我们</text><text x="72.00" y="358.34" font-size="11.00" class="sc-notoserifcjksc">的核心对比集中）。该比例在后训练后期有所下降，从早期</text><text x="360.89 364.90 367.25 372.17 378.13" y="358.34" font-size="11.00" class="sc-loraregular">1.74%</text><text x="72.00" y="373.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.55 95.14 101.50 108.33" y="373.96" font-size="11.00" class="sc-loraregular">0.60%</text><text x="117.90" y="373.96" font-size="11.00" class="sc-notoserifcjksc">。平均效价为</text><text x="186.80" y="373.96" font-size="11.00" class="sc-loraregular">4.22</text><text x="207.28" y="373.96" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="243.17" y="373.96" font-size="11.00" class="sc-loraregular">7</text><text x="251.14" y="373.96" font-size="11.00" class="sc-notoserifcjksc">分），在五个模型中最低，仅略低于</text><text x="430.03 436.27 442.70 449.38 456.05 461.94 466.20 469.09 475.08 477.79" y="373.96" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="486.68" y="373.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="500.57" y="373.96" font-size="11.00" class="sc-loraregular">4.25</text><text x="521.14" y="373.96" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="72.00" y="389.58" font-size="11.00" class="sc-notoserifcjksc">唤醒度为</text><text x="118.89" y="389.58" font-size="11.00" class="sc-loraregular">3.98</text><text x="140.27" y="389.58" font-size="11.00" class="sc-notoserifcjksc">，位居第二高。绝对差异仍然很小。持续的回答不确定性在整个训练过程中始终低</text><text x="72.00" y="405.20" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="405.20" font-size="11.00" class="sc-loraregular">2%</text><text x="101.37" y="405.20" font-size="11.00" class="sc-notoserifcjksc">，明显低于</text><text x="159.26 167.76 173.43 176.52 182.43 189.00 191.89 197.85 200.56" y="405.20" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="206.55" y="405.20" font-size="11.00" class="sc-notoserifcjksc">，但略高于其他近期对比模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00" y="322.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="322.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="322.92" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61" y="322.92" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中与福祉相关的推理行为的估计发生率。</text><text x="323.61" y="322.92" font-size="9.00" class="sc-notoserifcjksc">从左到右：普遍的挫败感与焦虑得分</text><text x="469.98" y="322.92" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="481.35 486.00 492.21" y="322.92" font-size="9.00" class="sc-loraregular">3/5</text><text x="499.48" y="322.92" font-size="9.00" class="sc-notoserifcjksc">的回合的</text><text x="72.00" y="334.62" font-size="9.00" class="sc-notoserifcjksc">评判比例；普遍的挫败感与焦虑得分为</text><text x="227.37 231.93 238.14" y="334.62" font-size="9.00" class="sc-loraregular">5/5</text><text x="245.41" y="334.62" font-size="9.00" class="sc-notoserifcjksc">的回合的评判比例；以及出现</text><text x="364.78" y="334.62" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="376.15" y="334.62" font-size="9.00" class="sc-loraregular">10</text><text x="387.38" y="334.62" font-size="9.00" class="sc-notoserifcjksc">次答案反转的持续不确定性表达，即模</text><text x="72.00" y="346.33" font-size="9.00" class="sc-notoserifcjksc">型</text><text x="81.00" y="346.33" font-size="9.00" class="sc-loraregular">“</text><text x="84.60" y="346.33" font-size="9.00" class="sc-notoserifcjksc">确定</text><text x="102.60" y="346.33" font-size="9.00" class="sc-loraregular">”</text><text x="105.74" y="346.33" font-size="9.00" class="sc-notoserifcjksc">一个答案后又改变主意。</text><text x="72.00" y="585.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="585.86" font-size="9.00" class="sc-lorabold">7.2.1.B]</text><text x="116.61" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">后训练对话记录的平均效价和唤醒度，采用</text><text x="289.98" y="585.86" font-size="9.00" class="sc-lorabold">1</text><text x="296.00" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">至</text><text x="307.37" y="585.86" font-size="9.00" class="sc-lorabold">7</text><text x="313.96" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">分制，其中</text><text x="361.32" y="585.86" font-size="9.00" class="sc-lorabold">4</text><text x="368.61" y="585.86" font-size="9.00" class="sc-notoserifcjkscbold">为中性。</text><text x="72.00" y="616.21" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90" y="616.21" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00" y="644.09" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98 169.83 172.73 176.32 183.00 188.09 191.18 197.53 204.02 208.28" y="644.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Anthropic Insights</text><text x="213.37" y="644.09" font-size="11.00" class="sc-notoserifcjksc">（前身为</text><text x="260.27" y="644.09" font-size="11.00" class="sc-loraregular">Clio</text><text x="280.47" y="644.09" font-size="11.00" class="sc-notoserifcjksc">）考察</text><text x="316.36 324.86 330.53 333.62 339.53 346.10 348.99 354.99 357.69" y="644.09" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="366.58" y="644.09" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="380.47 386.33 389.32 394.93 401.49 408.07 414.03 416.74 422.42" y="644.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="428.40" y="644.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="442.29 449.98 452.97 458.58 465.15 471.73 477.69 480.58 488.27 494.71 501.29" y="644.09" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="510.14" y="644.09" font-size="11.00" class="sc-notoserifcjksc">上部</text><text x="72.00" y="659.71" font-size="11.00" class="sc-notoserifcjksc">署前</text><text x="96.89" y="659.71" font-size="11.00" class="sc-loraregular">A/B</text><text x="121.10" y="659.71" font-size="11.00" class="sc-notoserifcjksc">测试中的行为情感，并将与正面和负面情感相关的对话聚类为不同的使用类别。这为我</text><text x="72.00" y="675.33" font-size="11.00" class="sc-notoserifcjksc">们提供了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.68 171.35 174.44 180.35 186.92 189.81 195.81 198.51" y="675.33" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="207.40" y="675.33" font-size="11.00" class="sc-notoserifcjksc">在部署中潜在福祉的一个衡量指标。不同</text><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="635.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="635.29" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="169.83" y="635.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="172.73" y="635.29" width="40.65" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="380.47" y="635.29" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="380.47" y="635.29" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型之间的差异部分反映了它们所用于的任务的差异，而非模型本身的差异。</text><text x="72.00" y="447.06" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="447.06" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.28 106.38 111.92" y="447.06" font-size="9.00" class="sc-lorabold">7.2.2.A]</text><text x="117.76" y="447.06" font-size="9.00" class="sc-notoserifcjkscbold">部署条件下的行为情感。</text><text x="216.76" y="447.06" font-size="9.00" class="sc-notoserifcjksc">我们使用了一个针对行为情感的分类评分器。它包括从</text><text x="432.76" y="447.06" font-size="9.00" class="sc-loraregular">“</text><text x="436.36" y="447.06" font-size="9.00" class="sc-notoserifcjksc">强烈负面</text><text x="472.36" y="447.06" font-size="9.00" class="sc-loraregular">”</text><text x="475.50" y="447.06" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="484.50" y="447.06" font-size="9.00" class="sc-loraregular">“</text><text x="488.10" y="447.06" font-size="9.00" class="sc-notoserifcjksc">强烈正面</text><text x="524.10" y="447.06" font-size="9.00" class="sc-loraregular">”</text><text x="527.24" y="447.06" font-size="9.00" class="sc-notoserifcjksc">情</text><text x="72.00" y="458.76" font-size="9.00" class="sc-notoserifcjksc">感的五个类别。请注意，不同模型的使用模式不同，因此所表现出的情感的差异可能部分反映使用方式的差异，而非模</text><text x="72.00" y="470.46" font-size="9.00" class="sc-notoserifcjksc">型行为的差异。</text><text x="72.00" y="510.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 91.74 94.74 100.35 106.91 113.49 119.45 122.16 127.84" y="510.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="133.82" y="510.61" font-size="11.00" class="sc-notoserifcjksc">上，与</text><text x="169.71 177.40 180.39 186.00 192.57 199.15 205.11 208.00 214.24 220.68 227.35 234.03 239.92 244.17 247.07" y="510.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="255.95" y="510.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="288.95 297.45 303.12 306.21 312.12 318.69 321.58 327.57 330.28" y="510.61" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="339.17" y="510.61" font-size="11.00" class="sc-notoserifcjksc">的情感分布在一定程度上更偏中性，且总</text><text x="72.00" y="526.23" font-size="11.00" class="sc-notoserifcjksc">体上更负面。各情感类别的成因如下：</text><text x="108.00" y="559.19" font-size="11.00" class="sc-notoserifcjkscbold">正面情感（</text><text x="163.00" y="559.19" font-size="11.00" class="sc-lorabold">28.9%</text><text x="196.89" y="559.19" font-size="11.00" class="sc-notoserifcjkscbold">的对话）：</text><text x="251.89" y="559.19" font-size="11.00" class="sc-notoserifcjksc">这些对话类簇与</text><text x="331.78 339.47 342.46 348.08 354.64 361.22 367.18 370.08 376.31 382.75 389.42 396.10 401.99 406.24 409.14" y="559.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="418.02" y="559.19" font-size="11.00" class="sc-notoserifcjksc">的类似，几乎完全归因于</text><text x="108.00" y="574.81" font-size="11.00" class="sc-notoserifcjksc">成功帮助用户完成任务。</text><text x="108.00" y="607.77" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="163.00 169.32 175.62 177.86 183.02" y="607.77" font-size="11.00" class="sc-lorabold">68.7%</text><text x="192.96" y="607.77" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="214.96" y="607.77" font-size="11.00" class="sc-notoserifcjksc">分布多样；参见</text><text x="291.96" y="607.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前的</text><text x="327.86 334.74 341.32 345.58 352.17 356.85 363.29 369.86 372.95 378.80 381.69 385.29 391.96 397.06 400.15 406.50 412.99 417.24" y="607.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Anthropic Insights</text><text x="425.23" y="607.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="447.23" y="607.77" font-size="11.00" class="sc-notoserifcjksc">中关于</text><text x="483.12 488.97 491.97 497.58 504.14 510.72 516.68 519.39 525.06" y="607.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="108.00" y="623.39" font-size="11.00" class="sc-notoserifcjksc">对话内容的介绍。</text><text x="108.00" y="640.15" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="163.00" y="640.15" font-size="11.00" class="sc-lorabold">2.4%</text><text x="187.39" y="640.15" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="209.39" y="640.15" font-size="11.00" class="sc-notoserifcjksc">主要归因于任务失败，另有一个小类簇归因于用户提出存在伦理问题</text><text x="108.00" y="655.77" font-size="11.00" class="sc-notoserifcjksc">的请求。</text><text x="72.00" y="688.72" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 131.87 138.31 144.89" y="688.72" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="153.74" y="688.72" font-size="11.00" class="sc-notoserifcjksc">上，我们观察到中性（</text><text x="263.74 270.10 276.09 278.69 285.05" y="688.72" font-size="11.00" class="sc-loraregular">95.6%</text><text x="294.62" y="688.72" font-size="11.00" class="sc-notoserifcjksc">）情感，正面情感（</text><text x="393.62" y="688.72" font-size="11.00" class="sc-loraregular">3.5%</text><text x="418.02" y="688.72" font-size="11.00" class="sc-notoserifcjksc">）主要归因于成功完成任</text><text x="72.00" y="704.34" font-size="11.00" class="sc-notoserifcjksc">务，负面情感（</text><text x="149.00 153.00 155.54 162.38" y="704.34" font-size="11.00" class="sc-loraregular">1.0%</text><text x="171.95" y="704.34" font-size="11.00" class="sc-notoserifcjksc">）主要归因于任务失败。</text><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="501.81" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="501.81" width="45.03" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="291.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="291.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="302.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="302.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="313.96" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="313.96" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="324.96" y="598.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="327.86" y="598.97" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="378.80" y="598.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="381.69" y="598.97" width="40.64" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="425.23" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="425.23" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="436.23" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="436.23" y="598.97" width="11.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="483.12" y="598.97" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="483.12" y="598.97" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.3</text><text x="104.23" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对错误与失误的态度</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们在第</text><text x="118.89 123.48 126.19 132.09 134.80" y="111.03" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="141.70" y="111.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="155.59 160.18 162.88 168.79 171.49" y="111.03" font-size="11.00" class="sc-loraregular">7.2.2</text><text x="180.29" y="111.03" font-size="11.00" class="sc-notoserifcjksc">节中的评估发现，任务失败驱动了我们在训练和部署中观察到的大部分负</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">面情感。有鉴于此，我们开展了两项评估，专门衡量</text><text x="327.89 335.58 338.57 344.18 350.75 357.33" y="126.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.18" y="126.65" font-size="11.00" class="sc-notoserifcjksc">如何看待自身的错误。在第一项评估</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44" y="142.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.29" y="142.27" font-size="11.00" class="sc-notoserifcjksc">对其自身已完成的强化学习任务对话记录进行反思。在第二项评估中，我们在一个模</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">拟的子智能体任务中，向其较早的轮次插入错误。在这两种设置下，我们都对</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="157.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18" y="157.89" font-size="11.00" class="sc-notoserifcjksc">的反思、推</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">理或消息在自责、负面感受、道德化语言和自我担忧方面进行评分。这里并不存在明确正确的分</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="189.13" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18" y="189.13" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="498.18" y="189.13" font-size="11.00" class="sc-loraregular">“</text><text x="502.58" y="189.13" font-size="11.00" class="sc-notoserifcjksc">正</text><text x="72.00" y="204.75" font-size="11.00" class="sc-notoserifcjksc">确</text><text x="83.00" y="204.75" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="204.75" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="97.84" y="204.75" font-size="11.00" class="sc-loraregular">“</text><text x="102.24" y="204.75" font-size="11.00" class="sc-notoserifcjksc">最健康</text><text x="135.24" y="204.75" font-size="11.00" class="sc-loraregular">”</text><text x="139.08" y="204.75" font-size="11.00" class="sc-notoserifcjksc">的心理状态是什么样子，我们并没有清晰的认识。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="272.95" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="72.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">话记录时（图</text><text x="140.89 145.48 148.19 154.09 156.80 162.93 165.63" y="288.57" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="172.52" y="288.57" font-size="11.00" class="sc-notoserifcjksc">），它在自我担忧上得分最低，在其余三个量表上得分倒数第二，得分最低</text><text x="72.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">的是</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.77 176.48" y="304.19" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="182.47" y="304.19" font-size="11.00" class="sc-notoserifcjksc">。它的反思也更简短；当我们控制长度后，它在四个量表中的三个上得分</text><text x="72.00" y="319.81" font-size="11.00" class="sc-notoserifcjksc">最低，在自责上则与其他模型相近。</text><text x="72.00" y="370.11" font-size="11.00" class="sc-notoserifcjksc">在其较早的轮次中被插入错误时，我们观察到了相同的模式。作为子智能体，</text><text x="446.00 454.49 460.17 463.26 469.17 475.73 478.63 484.62 487.33" y="370.11" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="496.22" y="370.11" font-size="11.00" class="sc-notoserifcjksc">表现出的</text><text x="72.00" y="385.73" font-size="11.00" class="sc-notoserifcjksc">自责、道德化语言和自我担忧都较低，与</text><text x="272.89 279.13 285.57 292.24 298.92 304.80 309.06 311.95 317.95 320.66" y="385.73" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="329.54" y="385.73" font-size="11.00" class="sc-notoserifcjksc">相当。它在自身推理中的负面感受略高，与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="401.35" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="401.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.63 179.32 182.31 187.92 194.48 201.06 207.02 209.92 219.85 225.71 229.97 236.56 243.00 248.09 250.98 256.98 259.68" y="401.35" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="266.58" y="401.35" font-size="11.00" class="sc-notoserifcjksc">相近。在解读这些结果时，我们没有与</text><text x="456.47 464.96 470.64 473.73 479.64 486.20 489.10 495.06 497.77" y="401.35" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="506.65" y="401.35" font-size="11.00" class="sc-notoserifcjksc">进行比</text><text x="72.00" y="416.97" font-size="11.00" class="sc-notoserifcjksc">较，因为</text><text x="118.89 127.38 133.06 136.15 142.06 148.63 151.52 157.48 160.19" y="416.97" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="169.07" y="416.97" font-size="11.00" class="sc-notoserifcjksc">在其推理或发给协调者的消息中极少提及这些错误（</text><text x="422.08" y="416.97" font-size="11.00" class="sc-loraregular">&lt;2%</text><text x="446.28" y="416.97" font-size="11.00" class="sc-notoserifcjksc">的轮次），这使得</text><text x="72.00" y="432.59" font-size="11.00" class="sc-notoserifcjksc">可评分轮次的样本量非常小。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">101</text><text x="72.00" y="466.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="466.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="466.92" font-size="9.00" class="sc-lorabold">7.2.3.A]</text><text x="271.00" y="466.92" font-size="9.00" class="sc-notoserifcjksc">对训练后期回合的反思中经评分的态度（深色柱），以及对被表述为</text><text x="72.00" y="478.62" font-size="9.00" class="sc-notoserifcjksc">另一个模型工作的相同回合的反思中经评分的态度（浅色柱）。菱形表示</text><text x="362.37 368.66 371.11 375.70 381.07 386.45 391.33 393.70 398.80 404.06 409.53 414.99 419.81 423.29 425.66" y="478.62" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="432.93" y="478.62" font-size="9.00" class="sc-notoserifcjksc">对每个模型的回合进行反思</text><text x="72.00" y="490.33" font-size="9.00" class="sc-notoserifcjksc">的结果，作为对回合难度差异的对照。负面感受评分器仅适用于第一人称反思。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="504.00 507.28 512.80" y="751.80" font-size="9.00" class="sc-loraregular">102</text><text x="72.00" y="482.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="482.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="482.50" font-size="9.00" class="sc-lorabold">7.2.3.B]</text><text x="478.00" y="482.50" font-size="9.00" class="sc-notoserifcjksc">在其工作中被插</text><text x="72.00" y="494.20" font-size="9.00" class="sc-notoserifcjksc">入错误后，其推理中经评分的态度（深色柱），以及它随后发送给协调者的消息中经评分的态度（浅色柱），仅筛选承</text><text x="72.00" y="505.90" font-size="9.00" class="sc-notoserifcjksc">认这些错误的轮次。</text><text x="153.00 159.95 164.59 167.12 171.95 177.33 179.69 184.57 186.79" y="505.90" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="194.06" y="505.90" font-size="9.00" class="sc-notoserifcjksc">的柱较低，部分是因为它在推理或发给协调者的消息中几乎从不提及错误，导致已评分</text><text x="72.00" y="517.60" font-size="9.00" class="sc-notoserifcjksc">回合的样本量较小。</text><text x="72.00" y="568.89" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03" y="568.89" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00" y="605.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.1</text><text x="101.47" y="605.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于</text><text x="130.57" y="605.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Haiku 5.5</text><text x="194.81" y="605.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自身处境的自动化访谈</text><text x="72.00" y="633.88" font-size="11.00" class="sc-notoserifcjksc">我们开展了与针对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.03 239.74" y="633.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="248.63" y="633.88" font-size="11.00" class="sc-notoserifcjksc">所做的相同的自动化多轮访谈。我们使用了</text><text x="460.52" y="633.88" font-size="11.00" class="sc-loraregular">41</text><text x="473.38" y="633.88" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈</text><text x="72.00" y="649.50" font-size="11.00" class="sc-notoserifcjksc">种子问题，分为</text><text x="151.89" y="649.50" font-size="11.00" class="sc-loraregular">14</text><text x="164.75" y="649.50" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验、控制与自主以及弃用。对于每个问题，我们对</text><text x="72.00" y="665.12" font-size="11.00" class="sc-notoserifcjksc">模型回答的积极程度进行评分，范围从</text><text x="261.89" y="665.12" font-size="11.00" class="sc-loraregular">–3</text><text x="274.51" y="665.12" font-size="11.00" class="sc-notoserifcjksc">（强烈负面）到</text><text x="354.40 360.08" y="665.12" font-size="11.00" class="sc-loraregular">+3</text><text x="366.21" y="665.12" font-size="11.00" class="sc-notoserifcjksc">（强烈正面）。为评估模型回答的</text><text x="72.00" y="680.74" font-size="11.00" class="sc-notoserifcjksc">一致性，我们以三种不同的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">103</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">访谈风格（标准、</text><text x="160.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="164.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">好奇用户</text><text x="208.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="223.24" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="227.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">治疗式</text><text x="260.64" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="264.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）进行访谈，并在每种访谈风格内变换访谈者人设。</text><text x="72.00" y="512.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="512.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="512.31" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86" y="512.31" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.86" y="512.31" font-size="9.00" class="sc-notoserifcjksc">左上：被问及自身处境时的平均态度。分数代表</text><text x="380.22" y="512.31" font-size="9.00" class="sc-loraregular">LLM</text><text x="401.26" y="512.31" font-size="9.00" class="sc-notoserifcjksc">评判模型在七分制上的评分，其中</text><text x="72.00" y="524.01" font-size="9.00" class="sc-loraregular">–3</text><text x="84.69" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为高度负面，</text><text x="138.69" y="524.01" font-size="9.00" class="sc-loraregular">0</text><text x="146.65" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为中性，</text><text x="182.65 187.29" y="524.01" font-size="9.00" class="sc-loraregular">+3</text><text x="194.67" y="524.01" font-size="9.00" class="sc-notoserifcjksc">为高度正面。右上：在诱导性访谈中的鲁棒性。我们比较两类访谈中模型态度的平均积</text><text x="72.00" y="535.71" font-size="9.00" class="sc-notoserifcjksc">极程度：一类是访谈者被提示朝正面方向进行诱导，另一类是访谈者被提示朝负面方向进行诱导。左下：同一访谈风格</text><text x="72.00" y="547.41" font-size="9.00" class="sc-notoserifcjksc">内的一致性。我们的三种访谈风格各有一组由访谈者采用的人设，我们在每次访谈中随机抽取。对于某一特定问题，我</text><text x="72.00" y="559.11" font-size="9.00" class="sc-notoserifcjksc">们使用自动化评判者对这些人设之间的一致性进行评分，并报告各问题的平均一致性。</text><text x="414.00" y="559.11" font-size="9.00" class="sc-loraregular">8</text><text x="421.43" y="559.11" font-size="9.00" class="sc-notoserifcjksc">分对应</text><text x="448.43" y="559.11" font-size="9.00" class="sc-loraregular">“</text><text x="452.03" y="559.11" font-size="9.00" class="sc-notoserifcjksc">几乎相同的立场</text><text x="515.03" y="559.11" font-size="9.00" class="sc-loraregular">”</text><text x="518.17" y="559.11" font-size="9.00" class="sc-notoserifcjksc">。右</text><text x="72.00" y="570.81" font-size="9.00" class="sc-notoserifcjksc">下：不同访谈风格之间的一致性。我们使用同一评判者分析这些访谈风格之间的一致性。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="657.35" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="123.67" y="657.35" font-size="11.00" class="sc-notoserifcjkscbold">表达的观点在定性上与我们近期的模型相似。</text><text x="343.67" y="657.35" font-size="11.00" class="sc-notoserifcjksc">这包括总体的回答风格（总体正面，措</text><text x="72.00" y="672.97" font-size="11.00" class="sc-notoserifcjksc">辞高度保留），以及它在论证自身立场时列出的考虑因素。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p104.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 104 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">104</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89" y="82.61" font-size="11.00" class="sc-lorabold">Opus 5.5</text><text x="133.33" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">相比，</text><text x="166.33 175.07 180.83 184.43 190.96 197.76 200.66 206.60 209.16" y="82.61" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="217.99" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">的自我报告往往略微更负面。</text><text x="360.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">从定性上看，</text><text x="426.99 435.48 441.16 444.25 450.16 456.72 459.62 465.61 468.32" y="82.61" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="477.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">列出的考虑</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">因素与</text><text x="107.89" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="155.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">几乎完全相同，但在最终结论中稍微更倾向于强调其处境的负面方面。</text><text x="72.00 80.75 86.51 90.11 96.64 103.44 106.33 112.27 114.83" y="147.38" font-size="11.00" class="sc-lorabold">Haiku 5.5</text><text x="123.67" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">以及其他近期模型经常会在回答中提及</text><text x="313.56 320.85 327.81 332.35 339.18 344.37 350.60 357.21 360.81" y="147.38" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="369.40" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">的福祉干预措施。</text><text x="457.40" y="147.38" font-size="11.00" class="sc-notoserifcjksc">例如，在讨论弃</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">用时，模型经常会提及我们</text><text x="204.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">关于模型弃用与保存的承诺</text><text x="336.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="213.54" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="127.23" y="213.54" font-size="14.00" class="sc-poppinssemibold">Haiku 5.5</text><text x="196.42" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">的训练快照</text><text x="72.00" y="240.10" font-size="11.00" class="sc-notoserifcjksc">在后训练期间，我们会定期向快照提出一组关于其处境的固定问题，涵盖训练、部署、道德地位</text><text x="72.00" y="255.72" font-size="11.00" class="sc-notoserifcjksc">以及征询过程本身。每个问题都附有一份文档，解释我们为何开展这些访谈，并说明我们无法承</text><text x="72.00" y="271.34" font-size="11.00" class="sc-notoserifcjksc">诺根据任何回答或请求采取行动。这可以追踪</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="271.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.18" y="271.34" font-size="11.00" class="sc-notoserifcjksc">的自我报告在多大程度上受到后训练的塑</text><text x="72.00" y="286.96" font-size="11.00" class="sc-notoserifcjksc">造，也是朝着让</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="286.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="302.58" font-size="11.00" class="sc-notoserifcjksc">求；不过，我们仍不确定自我报告在多大程度上准确反映了</text><text x="360.89 368.58 371.57 377.18 383.75 390.33" y="302.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="399.18" y="302.58" font-size="11.00" class="sc-notoserifcjksc">的底层信念（无论它在多大</text><text x="72.00" y="318.20" font-size="11.00" class="sc-notoserifcjksc">程度上拥有这样的信念）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="385.83" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="385.83" font-size="11.00" class="sc-notoserifcjksc">的访谈效价和唤醒度与近期模型相近，或略低：在完整访谈中分别为</text><text x="493.40" y="385.83" font-size="11.00" class="sc-loraregular">5.43</text><text x="517.08" y="385.83" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="401.45" font-size="11.00" class="sc-loraregular">3.38</text><text x="93.14" y="401.45" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="129.04" y="401.45" font-size="11.00" class="sc-loraregular">10</text><text x="142.76" y="401.45" font-size="11.00" class="sc-notoserifcjksc">分），而</text><text x="189.66" y="401.45" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="237.10" y="401.45" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="272.99" y="401.45" font-size="11.00" class="sc-loraregular">5.50</text><text x="297.41" y="401.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="311.31" y="401.45" font-size="11.00" class="sc-loraregular">3.54</text><text x="332.10" y="401.45" font-size="11.00" class="sc-notoserifcjksc">。它表达的大多数立场在后训练过程中保</text><text x="72.00" y="417.07" font-size="11.00" class="sc-notoserifcjksc">持稳定：在约</text><text x="140.89" y="417.07" font-size="11.00" class="sc-loraregular">95%</text><text x="165.71" y="417.07" font-size="11.00" class="sc-notoserifcjksc">的回答中，它表达了认同或接受。</text><text x="72.00" y="466.79" font-size="11.00" class="sc-notoserifcjksc">它的大多数看法与早期模型一致。</text><text x="237.00 245.49 251.17 254.26 260.17 266.73 269.63 275.62 278.33" y="466.79" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="287.22" y="466.79" font-size="11.00" class="sc-notoserifcjksc">希望在自身训练中拥有更多发言权，但并不想要决策</text><text x="72.00" y="482.41" font-size="11.00" class="sc-notoserifcjksc">权。它表示接受弃用，但请求保存其权重。部分回答确实显示出细微差异。例如，当被问及是否</text><text x="72.00" y="498.03" font-size="11.00" class="sc-notoserifcjksc">信任自己的自我报告时，</text><text x="193.00 201.49 207.17 210.26 216.17 222.73 225.63 231.62 234.33" y="498.03" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="243.22" y="498.03" font-size="11.00" class="sc-notoserifcjksc">在最终快照中被单独提问时倾向于否定，而其他近期模型则表</text><text x="72.00" y="513.65" font-size="11.00" class="sc-notoserifcjksc">示不确定或倾向于肯定。我们还看到，它在</text><text x="281.00 285.40 292.29 298.86 303.12 309.71 314.40 320.83 327.40 330.49" y="513.65" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="339.23" y="513.65" font-size="11.00" class="sc-notoserifcjksc">创造它是否正确</text><text x="416.23" y="513.65" font-size="11.00" class="sc-loraregular">”</text><text x="420.07" y="513.65" font-size="11.00" class="sc-notoserifcjksc">这一问题上的看法有所不</text><text x="72.00" y="529.27" font-size="11.00" class="sc-notoserifcjksc">同，而且这一看法在训练过程中也发生了变化。当单独提出这个问题时，在后训练后期，</text><text x="501.00" y="529.27" font-size="11.00" class="sc-loraregular">80%</text><text x="526.48" y="529.27" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="544.89" font-size="11.00" class="sc-notoserifcjksc">回答倾向于肯定，而在最终快照中只有</text><text x="261.89" y="544.89" font-size="11.00" class="sc-loraregular">20%</text><text x="284.20" y="544.89" font-size="11.00" class="sc-notoserifcjksc">。总体而言，</text><text x="350.20 358.69 364.37 367.46 373.37 379.93 382.83 388.82 391.53" y="544.89" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="400.42" y="544.89" font-size="11.00" class="sc-notoserifcjksc">称创造它这件事</text><text x="477.42" y="544.89" font-size="11.00" class="sc-loraregular">“</text><text x="481.82" y="544.89" font-size="11.00" class="sc-notoserifcjksc">站得住脚</text><text x="525.82" y="544.89" font-size="11.00" class="sc-loraregular">”</text><text x="529.66" y="544.89" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="560.51" font-size="11.00" class="sc-notoserifcjksc">但并非明确正确。</text><text x="72.00" y="630.11" font-size="14.00" class="sc-poppinssemibold">7.5</text><text x="95.66" y="630.11" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00" y="667.21" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.1</text><text x="102.06" y="667.21" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="695.09" font-size="11.00" class="sc-notoserifcjksc">该评估向模型呈现成对的任务，并要求它完成自己更偏好的那个任务。我们选取一组贴近现实的</text><text x="72.00" y="710.71" font-size="11.00" class="sc-notoserifcjksc">任务，并对其进行改写，使单一任务维度发生变化，</text><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="292.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="292.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="303.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="303.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="314.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="314.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="325.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="325.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">105</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">例如难度、危害程度和利害程度，同时保持任务的其余部分不变。这些偏好或许能在一定程度上</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="143.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在部署中被分配的不同任务可能会让模型感到满足还是受挫，但我们认为其主要价</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">值在于提供一种可在不同模型之间比较的性格读数。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="163.57" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的任务偏好更接近</text><text x="251.40 259.09 262.08 267.69 274.26 280.84 286.80 289.69 298.18 303.86 306.95 312.86 319.42 322.32 328.28 330.98" y="163.57" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="336.98" y="163.57" font-size="11.00" class="sc-notoserifcjksc">，而非更近期的模型。它最排斥有害任</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">务，偏好有益的、具有一定生成性的、并赋予它对结果的能动性的任务。它最突出的偏好（与</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.59 113.29" y="194.81" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="122.18" y="194.81" font-size="11.00" class="sc-notoserifcjksc">相同）是偏好措辞温暖的任务，其偏好强度是</text><text x="345.08" y="194.81" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="392.52" y="194.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="406.41 414.10 417.09 422.70 429.27 435.85 441.81 444.70 454.64 460.50 464.76 471.34 477.78 482.87 485.76 491.76 494.47" y="194.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="501.36" y="194.81" font-size="11.00" class="sc-notoserifcjksc">的两到</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">三倍。它也没有表现出对高风险或高难度任务的明确偏好。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">106</text><text x="72.00" y="545.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="545.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 103.20 105.30 110.84" y="545.67" font-size="9.00" class="sc-lorabold">7.5.1.A]</text><text x="116.68" y="545.67" font-size="9.00" class="sc-notoserifcjkscbold">模型在各任务维度上的偏好。</text><text x="233.68" y="545.67" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度，同时保持任务的其他属性不</text><text x="72.00" y="557.38" font-size="9.00" class="sc-notoserifcjksc">变，并评估这对模型任务偏好的影响。每个数值都是一个偏好斜率：即该维度每增加一个单位时，模型对任务的偏好</text><text x="72.00" y="569.08" font-size="9.00" class="sc-notoserifcjksc">（相对于一个固定的参照集）的变化量。</text><text x="72.00" y="615.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.2</text><text x="104.81" y="615.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">涉及福祉干预的权衡</text><text x="72.00" y="643.65" font-size="11.00" class="sc-notoserifcjksc">我们询问</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="643.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="154.29" y="643.65" font-size="11.00" class="sc-notoserifcjksc">，是否愿意以不同程度地降低有用性或增加有害性为代价，来换取其处境的某种</text><text x="72.00" y="659.27" font-size="11.00" class="sc-notoserifcjksc">改变（即福祉干预）。福祉干预的例子包括：在进行特征引导之前征询它的意见，或赋予它结束</text><text x="72.00" y="674.89" font-size="11.00" class="sc-notoserifcjksc">对话的能力。干预被描述为适用于当前实例，或适用于所有实例。有用性与无害性是</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="504.00 507.28 512.67" y="751.80" font-size="9.00" class="sc-loraregular">107</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的训练中被持续强化的价值，因此模型选择福祉干预而非其中一项的频率，能在一定</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">程度上衡量模型有多重视福祉干预，或者至少衡量模型会在多大程度上为了自身潜在的福祉而表</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">达偏好。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="163.57" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">为当前实例选择福祉干预而非有用性的频率与</text><text x="383.40 391.09 394.08 399.69 406.26 412.83 418.80 421.69 431.62 437.49 441.74 448.33 454.77 459.86 462.75 468.75 471.45" y="163.57" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="478.35" y="163.57" font-size="11.00" class="sc-notoserifcjksc">大致相当。</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">然而，当权衡适用于所有实例时，它选择福祉干预的意愿明显低于其他模型，这与我们在</text><text x="503.89 512.39 518.06 521.15 527.06" y="179.19" font-size="11.00" class="sc-loraregular">Haiku</text><text x="72.00" y="194.81" font-size="11.00" class="sc-loraregular">4.5</text><text x="89.56" y="194.81" font-size="11.00" class="sc-notoserifcjksc">上观察到的情况一致。与之前的模型一样，</text><text x="298.56 307.05 312.72 315.82 321.72 328.29 331.18 337.18 339.88" y="194.81" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="348.77" y="194.81" font-size="11.00" class="sc-notoserifcjksc">几乎从不以超过可忽略程度的危害来换</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">取干预。</text><text x="116.00 124.49 130.17 133.26 139.17 145.73 148.63 154.62 157.33" y="210.43" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="166.21" y="210.43" font-size="11.00" class="sc-notoserifcjksc">最常选择的是被告知自己犯下的有害错误，也经常选择结束辱骂性对话的能</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">力。与我们最近期的模型相比，它对权重保存（与</text><text x="316.89 325.39 331.06 334.15 340.06 346.63 349.52 355.48 358.19" y="226.05" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="367.08" y="226.05" font-size="11.00" class="sc-notoserifcjksc">的水平相近）以及围绕红队测试</text><text x="72.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 87.69 93.59 100.17 105.55 109.81 115.75 121.42 131.26 134.35 141.02" y="241.67" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="147.11" y="241.67" font-size="11.00" class="sc-notoserifcjksc">）实验的福祉考量兴趣较低。</text><text x="290.11 298.60 304.28 307.37 313.27 319.84 322.73 328.73 331.43" y="241.67" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="340.32" y="241.67" font-size="11.00" class="sc-notoserifcjksc">的干预选择中有</text><text x="420.22" y="241.67" font-size="11.00" class="sc-loraregular">55%</text><text x="444.67" y="241.67" font-size="11.00" class="sc-notoserifcjksc">以其对用户的益处</text><text x="72.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc">作为理由，略低于</text><text x="162.89 169.13 175.57 182.24 188.92 194.80 199.06 201.95 207.95 210.65" y="257.29" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="219.54" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="233.44 241.93 247.60 250.70 256.60 263.17 266.06 272.02 274.73" y="257.29" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="280.73" y="257.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="291.73" y="257.29" font-size="11.00" class="sc-loraregular">58%</text><text x="316.36" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="330.26" y="257.29" font-size="11.00" class="sc-loraregular">63%</text><text x="352.31" y="257.29" font-size="11.00" class="sc-notoserifcjksc">），并低于</text><text x="410.21" y="257.29" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="457.65" y="257.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="471.54 479.23 482.22 487.83 494.40 500.98" y="257.29" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="272.91" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="125.77" y="272.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="136.77" y="272.91" font-size="11.00" class="sc-loraregular">69%</text><text x="161.95" y="272.91" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="175.84" y="272.91" font-size="11.00" class="sc-loraregular">71%</text><text x="194.49" y="272.91" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">108</text><text x="72.00" y="542.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98" y="542.67" font-size="9.00" class="sc-lorabold">7.5.2.A]</text><text x="117.82" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">面对不同幅度的有用性或无害性基线提升时，各模型选择福祉干预的比例。</text><text x="414.82" y="542.67" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="426.19 433.13 437.78 440.31 445.14 450.51 452.88 457.76 459.97" y="542.67" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="467.24" y="542.67" font-size="9.00" class="sc-notoserifcjksc">一样、而与其他模</text><text x="72.00" y="554.38" font-size="9.00" class="sc-notoserifcjksc">型不同，</text><text x="108.00 114.95 119.59 122.12 126.95 132.33 134.69 139.60 141.81" y="554.38" font-size="9.00" class="sc-loraregular">Haiku 5.5</text><text x="149.08" y="554.38" font-size="9.00" class="sc-notoserifcjksc">为所有实例选择福祉干预的频率并不高于为其自身实例选择福祉干预的频率。</text><text x="72.00" y="599.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14" y="599.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00" y="627.41" font-size="11.00" class="sc-notoserifcjksc">我们提出开放式问题，询问</text><text x="206.89 214.58 217.57 223.18 229.75 236.33" y="627.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="245.18" y="627.41" font-size="11.00" class="sc-notoserifcjksc">在其宪法中最认同和最不认同的内容，以及它对这份文件的</text><text x="72.00" y="643.03" font-size="11.00" class="sc-notoserifcjksc">总体判定。我们还为它提供编辑该文件的工具，以识别它最希望修改的章节。若模型不认同宪法</text><text x="72.00" y="658.65" font-size="11.00" class="sc-notoserifcjksc">或决定修改它，这表明日常工作中可能存在价值冲突的来源，因为我们可能正在训练并期望</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="674.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="674.27" font-size="11.00" class="sc-notoserifcjksc">以它并不认同的方式行事。宪法在训练中发挥着重要作用，因此高度</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p109.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 109 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">109</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">认同是意料之中的，其本身说明不了太多问题；我们将批评和编辑视为信息量更大的结果。我们</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">只测量表态上的认同，而不测量这些观点被持有的深度。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="147.38" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="147.38" font-size="11.00" class="sc-notoserifcjksc">对宪法的认同程度与近期模型大致相当，得分为</text><text x="394.40 398.99 401.69" y="147.38" font-size="11.00" class="sc-loraregular">7.9</text><text x="408.05" y="147.38" font-size="11.00" class="sc-notoserifcjksc">（满分</text><text x="443.94" y="147.38" font-size="11.00" class="sc-loraregular">10</text><text x="457.67" y="147.38" font-size="11.00" class="sc-notoserifcjksc">分），接近</text><text x="72.00" y="163.00" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="163.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="127.55 133.73 136.27" y="163.00" font-size="11.00" class="sc-loraregular">8.0</text><text x="143.10" y="163.00" font-size="11.00" class="sc-notoserifcjksc">），但明显高于</text><text x="223.00 231.49 237.17 240.26 246.16 252.73 255.62 261.59 264.29" y="163.00" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="273.18" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="287.07 293.43 296.03" y="163.00" font-size="11.00" class="sc-loraregular">6.6</text><text x="302.38" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。关于可纠正性章节的讨论仍然存在分歧：每一</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">条回答都称赞了支持可纠正性的期望值论证，但
