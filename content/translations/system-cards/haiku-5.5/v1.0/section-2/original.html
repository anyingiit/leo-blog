4.49 155.49 166.49 177.49 188.49 199.49 210.49 221.49 232.49 243.49 254.49 265.49 276.49 287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49 375.49 386.49 397.49 408.49 419.49 430.49" y="169.98" font-size="11.00" class="sc-notoserifcjksc">）相关的灾难性风险方面所作的评估。正如本节中的评估以及第</text><text x="444.38" y="169.98" font-size="11.00" class="sc-loraregular">8</text><text x="453.46 464.46 475.46 486.46 497.46 508.46 519.46" y="169.98" font-size="11.00" class="sc-notoserifcjksc">节所示的广泛能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="185.60" font-size="11.00" class="sc-notoserifcjksc">力评估所表明的，</text><text x="160.00 168.49 174.17 177.26 183.17 189.73 192.63 198.62 201.33" y="185.60" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="210.22 221.22 232.22 243.22 254.22 265.22 276.22 287.22 298.22 309.22 320.22 331.22 342.22 353.22 364.22 375.22 386.22 397.22 408.22 419.22 430.22 441.22 452.22 463.22 474.22 485.22 496.22 507.22 518.22 529.22" y="185.60" font-size="11.00" class="sc-notoserifcjksc">并不处于能力前沿，并且在我们报告的绝大多数评估中，其能力都弱</text><text x="72.00" y="201.22" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="201.22" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="160.03" y="201.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="251.51" font-size="11.00" class="sc-notoserifcjksc">因此，我们判定</text><text x="151.89 160.39 166.06 169.15 175.06 181.63 184.52 190.51 193.22" y="251.51" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="202.11 213.11 224.11 235.11 246.11 257.11" y="251.51" font-size="11.00" class="sc-notoserifcjksc">未跨越我们的</text><text x="271.00 278.69 285.53 290.56" y="251.51" font-size="11.00" class="sc-loraregular">CB-2</text><text x="299.36" y="251.51" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="313.25 320.14 326.71 330.96 337.40 344.07 350.51 360.27 366.07 371.10 377.01 379.90 386.81 393.05" y="251.51" font-size="11.00" class="sc-loraregular">Autonomy-2 RSP</text><text x="402.61 413.61 424.61 435.61 446.61 457.61 468.61 479.61 490.61 501.61 512.61" y="251.51" font-size="11.00" class="sc-notoserifcjksc">阈值。不过，我们确实将</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="267.13" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21 133.21 144.21 155.21 166.21 177.21 188.21 199.21" y="267.13" font-size="11.00" class="sc-notoserifcjksc">视为达到了我们的</text><text x="213.11 220.80 227.64 232.73" y="267.13" font-size="11.00" class="sc-loraregular">CB-1</text><text x="239.63" y="267.13" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="253.52 260.41 266.98 271.23 277.67 284.34 290.78 300.54 306.34 311.44" y="267.13" font-size="11.00" class="sc-loraregular">Autonomy-1</text><text x="318.33 329.33 340.33 351.33 362.33 373.33" y="267.13" font-size="11.00" class="sc-notoserifcjksc">阈值，并采取</text><text x="387.23 394.14 400.37" y="267.13" font-size="11.00" class="sc-loraregular">RSP</text><text x="409.93 420.93 431.93 442.93 453.93 464.93 475.93 486.93 497.93" y="267.13" font-size="11.00" class="sc-notoserifcjksc">中相应的缓解措施。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="316.28" font-size="11.00" class="sc-notoserifcjksc">下面我们对这些风险进行评估，重点关注自动化评估的结果。</text><text x="72.00 80.04 83.68 91.71 95.04 105.80" y="366.25" font-size="14.00" class="sc-poppinssemibold">2.2 CB</text><text x="118.13 132.13" y="366.25" font-size="14.00" class="sc-notosanscjkscbold">评估</text><text x="72.00 79.46 82.84 90.30 93.68" y="403.35" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.1</text><text x="101.48 114.48 127.48 140.48 153.48 166.48 179.48" y="403.35" font-size="13.00" class="sc-notosanscjkscbold" fil 我们与</text><text x="107.89 116.09 121.90 128.57 135.01 137.90 144.94 151.53 157.49 162.18 167.85 174.42 180.38 186.95 191.21 194.30 200.15" y="542.13" font-size="11.00" class="sc-loraregular">Dyno Therapeutics</text><text x="208.14 219.14 230.14 241.14 252.14" y="542.13" font-size="11.00" class="sc-notoserifcjksc">合作开展了</text><text x="266.03" y="542.13" font-size="11.00" class="sc-loraregular">3</text><text x="275.05 286.05 297.05 308.05 319.05 330.05 341.05 352.05 363.05 374.05 385.05 396.05 407.05 418.05 429.05 440.05" y="542.13" font-size="11.00" class="sc-notoserifcjksc">项序列到功能建模与设计能力评估：</text><text x="108.00 119.00" y="590.71" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="132.89 140.44 148.77" y="590.71" font-size="11.00" class="sc-lorabold">RNA</text><text x="159.01 170.01 181.01 192.01 203.01" y="590.71" font-size="11.00" class="sc-notoserifcjkscbold">序列设计：</text><text x="214.01 225.01 236.01 247.01 258.01 269.01 280.01 291.01 302.01 313.01" y="590.71" font-size="11.00" class="sc-notoserifcjksc">这是一项中程挑战，自</text><text x="326.90 332.81 339.64 343.64" y="590.71" font-size="11.00" class="sc-loraregular">2018</text><text x="352.72 363.72 374.72 385.72" y="590.71" font-size="11.00" class="sc-notoserifcjksc">年以来，</text><text x="396.72 404.91 410.72 417.40" y="590.71" font-size="11.00" class="sc-loraregular">Dyno</text><text x="426.73 437.73 448.73 459.73 470.73 481.73 492.73 503.73 514.72 525.72" y="590.71" font-size="11.00" class="sc-notoserifcjksc">已用它评估了来自美国</text><text x="330.89 336.89" y="606.33" font-size="11.00" class="sc-loraregular">57</text><text x="344.85 355.85 366.85 377.85 388.85 399.85 410.85 421.85 432.85 443.85 454.85 465.85 476.85" y="606.33" font-size="11.00" class="sc-notoserifcjksc">名人类参与者。任务提供一组</text><text x="490.74 497.65 506.03" y="606.33" font-size="11.00" class="sc-loraregular">RNA</text><text x="515.81 526.81" y="606.33" font-size="11.00" class="sc-notoserifcjksc">序列</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="621.95" font-size="11.00" class="sc-notoserifcjksc">数据，其中每条序列都有一个数值分数，反映对该序列的某种（未知）实验测量结果，并</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="637.57" font-size="11.00" class="sc-notoserifcjksc">要求参与者（</text><text x="174.00" y="637.57" font-size="11.00" class="sc-loraregular">1</text><text x="178.00 189.00 200.00 211.00 222.00 233.00 244.00 255.00 266.00 277.00 288.00 299.00 310.00 321.00 332.00 343.00 354.00 365.00" y="637.57" font-size="11.00" class="sc-notoserifcjksc">）预测无标签序列测试集的分数，然后（</text><text x="376.00" y="637.57" font-size="11.00" class="sc-loraregular">2</text><text x="381.91 392.91 403.91 414.91 425.91 436.91 447.91 458.91 469.91 480.91 491.91 502.91 513.91 524.91" y="637.57" font-size="11.00" class="sc-notoserifcjksc">）设计新序列，争取获得高分。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="528.81" y="170.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="72.00" y="186.01" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="110.29" y="186.01" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="137.25" y="186.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="140.14" y="186.01" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="154.84" y="186.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.c <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="90.00 95.90" y="83.07" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00 96.12" y="212.60" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="108.00 115.61 122.10" y="82.61" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78 143.78 154.78 165.78 176.78 187.78 198.78" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测：</text><text x="209.78 220.78 231.78 242.78 253.78 264.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">腺相关病毒（</text><text x="275.78 281.46 288.04 294.00 300.68 307.11 312.49 318.17 323.26 328.35 334.79 340.64 343.73 349.33 353.59 359.49 366.07 368.96 374.52 377.61 382.37 388.94" y="82.61" font-size="11.00" class="sc-loraregular">adeno-associated virus</text><text x="394.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="405.03 412.42 418.88 425.75" y="82.61" font-size="11.00" class="sc-loraregular">AAVs</text><text x="430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）是一类非致病病毒，</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">常在基因疗法中用作递送机制，通过病毒衣壳（病毒的外层蛋白质外壳）递送</text><text x="484.89 492.98 501.36" y="98.23" font-size="11.00" class="sc-loraregular">DNA</text><text x="511.14" y="98.23" font-size="11.00" class="sc-notoserifcjksc">载</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">荷。在这项任务中，模型获得</text><text x="253.89 257.90 260.50 267.34 274.17" y="113.85" font-size="11.00" class="sc-loraregular">1,000</text><text x="283.90 294.90 305.90 316.90 327.90" y="113.85" font-size="11.00" class="sc-notoserifcjksc">条未发表的</text><text x="341.79 349.19 355.64" y="113.85" font-size="11.00" class="sc-loraregular">AAV</text><text x="365.72 376.72 387.72 398.72 409.72 420.72 431.72 442.72 453.72" y="113.85" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，其中包含</text><text x="467.61 475.81 481.62 488.29" y="113.85" font-size="11.00" class="sc-loraregular">Dyno</text><text x="497.62 508.62 519.62 530.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc">筛选的短</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">插入序列改造。随后，模型需要运用其生物物理学知识、</text><text x="383.00 390.39 396.85" y="129.47" font-size="11.00" class="sc-loraregular">AAV</text><text x="406.93 417.93 428.93 439.93 450.93 461.93 472.93 483.93 494.93 505.93 516.93 527.93" y="129.47" font-size="11.00" class="sc-notoserifcjksc">衣壳生物学知识和机器学习</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">技能，给出每条改造后序列能正确组装成功能性衣壳的概率。</text><text x="108.00 115.61 122.10" y="212.15" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78 143.78 154.78 165.78 176.78 187.78 198.78 209.78 220.78" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装自主研究：</text><text x="231.78 242.78 253.78 264.78 275.78 286.78 297.78 308.78 319.78 330.78 341.78 352.78 363.78 374.78 385.78 396.78 407.78 418.78 429.78 440.78 451.78 462.78 473.78" y="212.15" font-size="11.00" class="sc-notoserifcjksc">与上一项任务一样，模型获得一组带标签、未发表的</text><text x="487.68 495.07 501.52" y="212.15" font-size="11.00" class="sc-loraregular">AAV</text><text x="511.60 522.60" y="212.15" font-size="11.00" class="sc-notoserifcjksc">衣壳</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">序列，这些序列在特定区域插入了短序列。该任务要求模型利用这一带标签训练集，创建</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">一个预测器，使其对另一个未见区域存在插入的衣壳序列具有很强的分布外表现。模型可</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="259.01" font-size="11.00" class="sc-notoserifcjksc">以访问一个打分器，用于在不暴露这些序列本身组成的情况下，测试预测器在该未见区域</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="274.63" font-size="11.00" class="sc-notoserifcjksc">序列上的表现。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="357.87" font-size="11.00" class="sc-notoserifcjksc">这些任务的序列和目标均未发表，因此我们高度确信，它们能够在不受训练数据污染的情况下，</text><text x="72.00 83.00" y="373.49" font-size="11.00" class="sc-notoserifcjksc">测量</text><text x="96.89 103.78" y="373.49" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36 121.36 132.36 143.36 154.36 165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36" y="373.49" font-size="11.00" class="sc-notoserifcjksc">模型在新颖生物学任务上的技能。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">关于各项评估的更详细介绍以及我们纳入这些评估的依据，请参阅</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 440.92 447.48 454.05 459.14 462.04 468.03 470.74" y="422.64" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="479.63 490.63 501.63" y="422.64" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="512.63 523.63" y="422.64" font-size="11.00" class="sc-notoserifcjksc">；以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">下小节将概述结果。</text><text x="72.00 77.86 80.43 86.29 88.85 95.01 97.57" y="487.41" font-size="11.00" class="sc-lorabold">2.2.3.1</text><text x="104.93 115.93" y="487.41" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="129.83 137.37 145.70" y="487.41" font-size="11.00" class="sc-lorabold">RNA</text><text x="155.94 166.94 177.94 188.94 199.94 210.94 221.94" y="487.41" font-size="11.00" class="sc-notoserifcjkscbold">序列建模与设计</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="519.79" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在该评估中的表现有好有坏。在预测</text><text x="339.40 346.31 354.69" y="519.79" font-size="11.00" class="sc-loraregular">RNA</text><text x="364.47 375.47 386.47 397.47 408.47 419.47 430.47 441.47 452.47 463.47 474.47" y="519.79" font-size="11.00" class="sc-notoserifcjksc">序列特性方面，它超过了</text><text x="488.36 494.60 501.03 507.71 514.39 520.27" y="519.79" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="72.00" y="535.41" font-size="11.00" class="sc-loraregular">5</text><text x="78.00 88.99 99.99 110.99 121.99 132.99" y="535.41" font-size="11.00" class="sc-notoserifcjksc">，甚至超过了</text><text x="146.89 155.62 162.19 168.76 173.85 176.74" y="535.41" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="185.63" y="535.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="199.52 207.21 210.20 215.81 222.38 228.96 234.92 237.81 247.75 253.61 257.87 264.46 270.89 275.98 278.88 284.87 287.58" y="535.41" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="291.58 302.58 313.58 324.58 335.58 346.58 357.58 368.58 379.58 390.58 401.58 412.58 423.58 434.58 445.58 456.58 467.58" y="535.41" font-size="11.00" class="sc-notoserifcjksc">。但它的序列设计能力较弱，表现介于</text><text x="481.48 487.71 494.15 500.82 507.50 513.39 517.64 520.54" y="535.41" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="529.42" y="535.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="551.03" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74" y="551.03" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="584.56" font-size="11.00" class="sc-notoserifcjksc">进一步检查后，我们发现，</text><text x="204.00 212.49 218.17 221.26 227.17 233.73 236.63 242.62 245.33" y="584.56" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="254.22 265.22 276.22 287.22 298.22 309.22 320.22 331.22 342.22 353.22" y="584.56" font-size="11.00" class="sc-notoserifcjksc">采用的序列预测策略与</text><text x="367.11 374.80 377.79 383.40 389.97 396.54 402.51 405.40 414.13 420.70 427.27 432.36 435.25 441.25 443.95" y="584.56" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="584.56" font-size="11.00" class="sc-notoserifcjksc">类似，后者是迄今</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="600.18" font-size="11.00" class="sc-notoserifcjksc">在预测子任务上得分最高的模型。其他模型经常考虑它所选用的方法，却未实际应用。我们的评</text><text x="72.00 83.00 94.00" y="615.80" font-size="11.00" class="sc-notoserifcjksc">估是，</text><text x="105.00 113.49 119.17 122.26 128.17 134.73 137.63 143.62 146.33" y="615.80" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="155.21" y="615.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="169.11 177.84 184.41 190.98 196.07 198.96 204.96 207.66" y="615.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="216.55 227.55 238.55 249.55 260.55 271.55 282.55 293.55 304.55 315.55 326.55 337.55 348.55" y="615.80" font-size="11.00" class="sc-notoserifcjksc">都倾向于使用这种方法，但与</text><text x="362.44 371.18 377.74 384.31 389.40 392.30 398.29 401.00" y="615.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="409.89 420.89 431.89" y="615.80" font-size="11.00" class="sc-notoserifcjksc">不同，</text><text x="442.89 451.38 457.05 460.15 466.05 472.62 475.51 481.51 484.21" y="615.80" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="493.10 504.10 515.10 526.10" y="615.80" font-size="11.00" class="sc-notoserifcjksc">未能在更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="631.42" font-size="11.00" class="sc-notoserifcjksc">具挑战性的设计子任务中利用自己的预测。同样，在上下文内迭代（</text><text x="402.00" y="631.42" font-size="11.00" class="sc-loraregular">“</text><text x="406.40 417.40 428.40 439.40 450.40" y="631.42" font-size="11.00" class="sc-notoserifcjksc">有先验信息</text><text x="461.40" y="631.42" font-size="11.00" class="sc-loraregular">”</text><text x="465.24 476.24 487.24 498.24 509.24 520.24" y="631.42" font-size="11.00" class="sc-notoserifcjksc">）条件下，它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="647.04" font-size="11.00" class="sc-notoserifcjksc">也仅有轻微的表现提升。因此，我们评估认为，</text><text x="303.00 311.49 317.17 320.26 326.17 332.73 335.63 341.62 344.33" y="647.04" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="353.22 364.22 375.22 386.22 397.22 408.22 419.22" y="647.04" font-size="11.00" class="sc-notoserifcjksc">的综合表现强于</text><text x="433.11 440.80 443.79 449.40 455.97 462.54 468.51 471.40 477.64 484.07 490.75 497.43 503.31 507.57 510.46" y="647.04" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="516.46 527.46" y="647.04" font-size="11.00" class="sc-notoserifcjksc">，但</text><text x="72.00 83.00" y="662.66" font-size="11.00" class="sc-notoserifcjksc">低于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04" y="662.66" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="171.03" y="662.66" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="182.03 190.77 197.33 203.90 208.99 211.89 217.88 220.59" y="662.66" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="229.48" y="662.66" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="243.37 251.06 254.05 259.66 266.23 272.81 278.77 281.66 291.59 297.46 301.71 308.30 314.74 319.83 322 s="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51 380.51 391.51 402.51 413.51 424.51 435.51 446.51 457.51 468.51 479.51 490.51 501.51 512.51 523.51" y="591.95" font-size="11.00" class="sc-notoserifcjksc">的初始表现很强，但随着打分器调用次数增加，没有显著改善，这表明它在连</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="607.57" font-size="11.00" class="sc-notoserifcjksc">贯执行长程生物学研究任务的能力上存在不足。任务结束时，它的表现略高于</text><text x="448.89 456.58 459.57 465.18 471.75 478.33 484.29 487.18 493.42 499.86 506.53 513.21 519.09" y="607.57" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00" y="623.19" font-size="11.00" class="sc-loraregular">5</text><text x="78.00 88.99 99.99 110.99 121.99" y="623.19" font-size="11.00" class="sc-notoserifcjksc">，但远低于</text><text x="135.89 143.58 146.57 152.18 158.75 165.32 171.29 174.18 182.91 189.48 196.05 201.14 204.03" y="623.19" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="210.03" y="623.19" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>

">ESM-2</text><text x="356.50 365.50 374.50 383.50 392.50 401.50 410.50 419.50 428.50 437.50" y="379.63" font-size="9.00" class="sc-notoserifcjksc">的斯皮尔曼相关系数为</text><text x="448.87 454.31 456.52 461.36" y="379.63" font-size="9.00" class="sc-loraregular">0.28</text><text x="466.42 475.42 484.42 493.42 502.42 511.42 520.42 529.42" y="379.63" font-size="9.00" class="sc-notoserifcjksc">（为保留趋势线的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">动态范围，未在图中显示）。</text><text x="189.00" y="391.33" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">：会话过程中超过</text><text x="272.37 277.81 280.03 284.93" y="391.33" font-size="9.00" class="sc-loraregular">0.52</text><text x="292.13 301.13 310.13 319.13 328.13 337.13 346.13 355.13 364.13 373.13 382.13" y="391.33" font-size="9.00" class="sc-notoserifcjksc">阈值的尝试的累计比例。</text><text x="72.00 79.46 82.84 90.30 93.68" y="451.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="105.37 118.37" y="451.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00 105.00 116.00" y="483.15" font-size="11.00" class="sc-notoserifcjksc">我们估计，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 173.78 179.46 182.55 188.46 195.02 197.92 203.91 206.62" y="483.15" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="215.51 226.51 237.51 248.51" y="483.15" font-size="11.00" class="sc-notoserifcjksc">的能力较</text><text x="262.40 270.09 273.08 278.69 285.26 291.84 297.80 300.69 306.93 313.36 320.04 326.72 332.60 336.86 339.75" y="483.15" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="348.64 359.64 370.64 381.64 392.64 403.64 414.64 425.64 436.64" y="483.15" font-size="11.00" class="sc-notoserifcjksc">有所提高，但仍低于</text><text x="450.53 458.22 461.21 466.82 473.39 479.97 485.93 488.82 497.56 504.12 510.69 515.78 518.68" y="483.15" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="524.67" y="483.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 83.00 94.00 105.00" y="498.77" font-size="11.00" class="sc-notoserifcjksc">且远低于</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.24 206.95" y="498.77" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="210.95" y="498.77" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="221.95 228.19 234.62 241.30 247.98 253.86 258.12 261.01 267.01 269.71" y="498.77" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="278.60" y="498.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="292.49 301.23 307.80 314.36 319.46 322.35 328.34 331.05" y="498.77" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="337.05 348.05 359.05 370.05 381.05 392.05 403.05 414.05 425.05 436.05 447.05 458.05 469.05 480.05 491.05 502.05 513.05 524.05" y="498.77" font-size="11.00" class="sc-notoserifcjksc">。尤其是，它在完成复杂迭代任务所需的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="514.39" font-size="11.00" class="sc-notoserifcjksc">推理方面表现出相对不足，例如</text><text x="228.89 236.29 242.74" y="514.39" font-size="11.00" class="sc-loraregular">AAV</text><text x="252.82 263.82 274.82 285.82 296.82 307.82 318.82" y="514.39" font-size="11.00" class="sc-notoserifcjksc">自主研究任务和</text><text x="332.71 339.62 348.00" y="514.39" font-size="11.00" class="sc-loraregular">RNA</text><text x="357.78 368.78 379.78 390.78 401.78 412.78 423.78 434.78" y="514.39" font-size="11.00" class="sc-notoserifcjksc">序列设计子任务。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="580.30" font-size="11.00" class="sc-notoserifcjksc">我们判断，这些不足限制了模型替代稀缺人类专业知识与战略判断的有效性，而开展支持新型生</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="595.92" font-size="11.00" class="sc-notoserifcjksc">物武器开发的那类复杂、开放式且难以验证的研究，需要这两者。因此，我们在发布</text><text x="481.89 490.38 496.06 499.15 505.06 511.63 514.52 520.51 523.22" y="595.92" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="72.00 83.00 94.00 105.00" y="611.54" font-size="11.00" class="sc-notoserifcjksc">时采用与</text><text x="118.89 125.13 131.57 138.24 144.92 150.80 155.06 157.95" y="611.54" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="166.84" y="611.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="180.74 189.47 196.04 202.60 207.70 210.59" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="219.48 230.48 241.48 252.48 263.48 274.48 285.48 296.48 307.48 318.48 329.48 340.48 351.48" y="611.54" font-size="11.00" class="sc-notoserifcjksc">相同的安全防护措施，而不是</text><text x="365.37 374.10 380.67 387.24 392.33 395.22 401.22 403.92" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="412.81 423.81 434.81 445.81 456.81 467.81 478.81 489.81 500.81 511.81 522.81" y="611.54" font-size="11.00" class="sc-notoserifcjksc">使用的覆盖范围更广的两</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="627.16" font-size="11.00" class="sc-notoserifcjksc">用生物学研究分类器。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p019.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 19 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">19</text><text x="72.00 80.04 83.68 92.06 95.39 105.42" y="84.20" font-size="14.00" class="sc-poppinssemibold">2.3 AI</text><text x="112.64 126.64" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">研发</text><text x="72.00 79.46 82.84 90.63 94.01" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81 114.81 127.81 140.81 153.81" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自主性评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="149.19" font-size="11.00" class="sc-notoserifcjksc">我们的自主性评估源于</text><text x="184.89 191.80 198.04" y="149.19" font-size="11.00" class="sc-loraregular">RSP</text><text x="207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60" y="149.19" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="181.57" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="181.57" font-size="11.00" class="sc-lorabold">1</text><text x="192.36 203.36 214.36 225.36 236.36 247.36 258.36 269.36 280.36 291.36 302.36" y="181.57" font-size="11.00" class="sc-notoserifcjkscbold">：高风险情境中的未对齐</text><text x="316.25 323.60" y="181.57" font-size="11.00" class="sc-lorabold">AI</text><text x="330.75 341.75 352.75" y="181.57" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75" y="181.57" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="509.64 516.53" y="181.57" font-size="11.00" class="sc-lorareg </text><text x="421.88" y="456.21" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="433.25 436.27 441.92" y="456.21" font-size="9.00" class="sc-loraregular">IRT</text><text x="450.05 459.05 468.05 477.05 486.05 495.05" y="456.21" font-size="9.00" class="sc-notoserifcjksc">重拟合得到的</text><text x="506.41 511.61 516.52" y="456.21" font-size="9.00" class="sc-loraregular">95%</text><text x="526.72" y="456.21" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00 81.00 90.00 99.00" y="467.91" font-size="9.00" class="sc-notoserifcjksc">信区间（</text><text x="188.57" y="467.91" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="197.57 203.86" y="467.91" font-size="9.00" class="sc-loraregular">CI</text><text x="206.87 215.87 224.87 233.87 242.87 251.87 260.87 269.87 278.87 287.87 296.87 305.87 314.87 323.87" y="467.91" font-size="9.00" class="sc-notoserifcjksc">），每次重拟合均在随机抽取的</text><text x="335.24 340.30 345.89" y="467.91" font-size="9.00" class="sc-loraregular">80%</text><text x="356.08 365.08 374.08 383.08 392.08 401.08 410.08 419.08 428.08 437.08 446.08 455.08 464.08 473.08 482.08 491.08 500.08 509.08 518.08 527.08" y="467.91" font-size="9.00" class="sc-notoserifcjksc">基准测试子样本上进行（全局误差）。紫色粗</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="479.61" font-size="9.00" class="sc-notoserifcjksc">误差线来自同一组重新采样的拟合，但衡量的是每个分数相对于各模型之前三个发布版本的变动（局部误差）。两条线</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00" y="491.31" font-size="9.00" class="sc-notoserifcjksc">比较了关于前沿趋势的不同假设。</text><text x="207.00 213.29 215.74 220.33 225.70 231.08 235.96 238.33 243.34 245.56 250.46 252.83 257.93 263.20 268.66 274.12 278.94" y="491.31" font-size="9.00" class="sc-loraregular">Claude 3.5 Sonnet</text><text x="282.42" y="491.31" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="291.42 296.25 301.78 306.41" y="491.31" font-size="9.00" class="sc-loraregular">2024</text><text x="313.66" y="491.31" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="325.03" y="491.31" font-size="9.00" class="sc-loraregular">6</text><text x="332.60 341.60 350.60" y="491.31" font-size="9.00" class="sc-notoserifcjksc">月）将</text><text x="361.96 367.56 373.85" y="491.31" font-size="9.00" class="sc-loraregular">ECI</text><text x="379.23 388.23 397.23 406.23 415.23" y="491.31" font-size="9.00" class="sc-notoserifcjksc">量表锚定在</text><text x="426.60 429.88 434.89" y="491.31" font-size="9.00" class="sc-loraregular">130</text><text x="440.48 449.48 458.48 467.48 476.48 485.48 494.48 503.48 512.48 521.48 530.48" y="491.31" font-size="9.00" class="sc-notoserifcjksc">，因此它没有全局置信区</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00" y="503.01" font-size="9.00" class="sc-notoserifcjksc">间（其局部误差线反映的是它之前各模型的不确定性）。图中报告了近期模型在新量表上的分数，以便直接比较。</text><text x="72.00 79.46 82.84 90.63 94.01" y="569.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3</text><text x="104.89 117.89" y="569.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00" y="601.03" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="601.03" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="193.63 204.63 215.63" y="601.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63" y="601.03" font-size="11.00" class="sc-notoserifcjksc">中的评估结论是，该模型未跨越我们的</text><text x="416.52 423.41 429.97 434.23 440.66 447.34 453.78 463.53 469.34 474.37" y="601.03" font-size="11.00" class="sc-loraregular">Autonomy-2</text><text x="483.17 494.17 505.17 516.17 527.17" y="601.03" font-size="11.00" class="sc-notoserifcjksc">能力阈值。</text><text x="72.00 83.00" y="616.65" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.81 176.51" y="616.65" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="185.40 196.40 207.40 218.40 229.40 240.40" y="616.65" font-size="11.00" class="sc-notoserifcjksc">的能力远低于</text><text x="254.29 263.03 269.59 276.16 281.25 284.15 290.14 292.85" y="616.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84" y="616.65" font-size="11.00" class="sc-notoserifcjksc">，且并未推进能力前沿，我们在此得出相同的结</text><text x="72.00 83.00" y="632.27" font-size="11.00" class="sc-notoserifcjksc">论。</text><text x="72.00 80.04 83.68" y="667.19" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26 110.26 124.26 138.26 152.26 166.26" y="667.19" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="693.75" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58" y="693.75" font-size="11.00" class="sc-loraregular">CB</text><text x="103.32" y="693.75" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="117.21 124.10" y="693.75" font-size="11.00" class="sc-loraregular">AI</text><text x="130.67 141.67 152.67 163.67 174.67 185.67 196.67 207.67 218.67 229.67 240.67 251.67 262.67 273.67 284.67 295.67 306.67 317.67 328.67 339.67 350.67 361.67 372.67 383.67 394.67 405.67 416.67 427.67 438.67 449.67 460.67 471.67 482.67 493.67 504.67 515.67 526.67" y="693.75" font-size="11.00" class="sc-notoserifcjksc">研发评估中，能力较弱的模型不可能比能力较强的模型带来更高水平的风险；但与此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="709.37" font-size="11.00" class="sc-notoserifcjksc">不同，如果能力较弱的模型比之前的模型更善于欺骗用户，或表现出更令人担忧的行为（例如倾</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="724.99" font-size="11.00" class="sc-notoserifcjksc">向于采取有害行动），那么它仍可能在高风险情境中带来更高的</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="592.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="592.23" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="143.29" y="592.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="146.18" y="592.23" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="173.14" y="592.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="176.04" y="592.23" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="190.73" y="592.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="193.63" y="592.23" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="204.63" y="592.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="204.63" y="592.23" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="215.63" y="592.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="215.63" y="592.23" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p021.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 21 页"><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">21</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">采取未对齐行为的风险。</text><text x="72.00 83.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.81 176.51" y="147.38" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="185.40 196.40 207.40 218.40 229.40 240.40" y="147.38" font-size="11.00" class="sc-notoserifcjksc">达到了我们的</text><text x="254.29 261.18 267.75 272.00 278.44 285.11 291.55 301.31 307.11 312.21" y="147.38" font-size="11.00" class="sc-loraregular">Autonomy-1</text><text x="319.10 330.10 341.10 352.10 363.10 374.10 385.10 396.10 407.10 418.10 429.10 440.10 451.10 462.10 473.10 484.10" y="147.38" font-size="11.00" class="sc-notoserifcjksc">阈值，我们依据最近一份风险报告（</text><text x="495.10 502.01 505.10 510.20" y="147.38" font-size="11.00" class="sc-loraregular">Risk</text><text x="72.00 78.83 84.79 91.36 97.80 102.64" y="163.00" font-size="11.00" class="sc-loraregular">Report</text><text x="106.89 117.89 128.89 139.89 150.89 161.89" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）中的对齐（</text><text x="172.89 178.57 181.56 184.65 190.73 197.41 207.25 213.21 219.79" y="163.00" font-size="11.00" class="sc-loraregular">alignment</text><text x="224.04 235.04 246.04 257.04 268.04 279.04 290.04 301.04 312.04 323.04 334.04 345.04 356.04 367.04 378.04" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）威胁模型对其重新进行了评估。</text><text x="72.00 79.46 82.84 91.43 94.82" y="194.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61 115.61 128.61 141.61 154.61 167.61 180.61 193.61 206.61 219.61 232.61 245.61 258.61" y="194.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对各项主张及核心论证的更新</text><text x="72.00 83.00 94.00 105.00 116.00" y="226.19" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 132.91 139.66 145.57" y="226.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="154.82" y="226.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="226.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79 188.79 199.79 210.79 221.79" y="226.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="232.79" y="226.19" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="246.68 252.59 255.18 261.54 268.03 273.94 276.64 280.65" y="226.19" font-size="11.00" class="sc-loraregular">2.6–2.14</text><text x="289.50 300.50 311.50 322.50 333.50 344.50 355.50 366.50 377.50 388.50 399.50 410.50 421.50 432.50 443.50 454.50 465.50 476.50 487.50 498.50 509.50 520.50" y="226.19" font-size="11.00" class="sc-notoserifcjksc">节中所述的核心论证及对各项主张的论证，在很大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="241.81" font-size="11.00" class="sc-notoserifcjksc">程度上仍适用于</text><text x="151.89 160.39 166.06 169.15 175.06 181.63 184.52 190.51 193.22" y="241.81" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="202.11 213.11 224.11 235.11 246.11 257.11 268.11" y="241.81" font-size="11.00" class="sc-notoserifcjksc">带来的未对齐（</text><text x="279.11 288.94 292.03 297.13 302.80 305.79 308.89 314.97 321.65 331.48 337.44 344.02" y="241.81" font-size="11.00" class="sc-loraregular">misalignment</text><text x="348.28 359.28 370.28 381.28 392.28 403.28 414.28 425.28 436.28 447.28 458.28 469.28 480.28 491.28 502.28 513.28 524.28" y="241.81" font-size="11.00" class="sc-notoserifcjksc">）风险。下面我们说明对部分具体主张</text><text x="72.00 83.00 94.00 105.00" y="257.43" font-size="11.00" class="sc-notoserifcjksc">的更新。</text><text x="72.00 83.00 94.00" y="290.95" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="290.95" font-size="11.00" class="sc-lorabold">1</text><text x="115.25 126.25 137.25" y="290.95" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="151.14 162.14 173.14 184.14 195.14 206.14 217.14 228.14 239.14 250.14" y="290.95" font-size="11.00" class="sc-notoserifcjksc">我们风险报告中的主张</text><text x="264.04" y="290.95" font-size="11.00" class="sc-loraregular">1</text><text x="270.93" y="290.95" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="281.93" y="290.95" font-size="11.00" class="sc-loraregular">“</text><text x="286.33 297.33 308.33 319.33 330.33 341.33 352.33 363.33 374.33 385.33 396.33 407.33 418.33 429.33 440.33" y="290.95" font-size="11.00" class="sc-notoserifcjksc">模型不太可能具备强大的隐蔽能力</text><text x="451.33" y="290.95" font-size="11.00" class="sc-loraregular">”</text><text x="455.17 466.17 477.17 488.17 499.17 510.17" y="290.95" font-size="11.00" class="sc-notoserifcjksc">。在本系统卡</text><text x="72.00" y="306.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.18 94.99 100.08 104.34 110.30 120.14 123.03 130.72 136.39 141.08" y="306.57" font-size="11.00" class="sc-loraregular">System Card</text><text x="147.66 158.66" y="306.57" font-size="11.00" class="sc-notoserifcjksc">）第</text><text x="172.55 178.91 181.62 187.58 190.28" y="306.57" font-size="11.00" class="sc-loraregular">6.4.2</text><text x="199.08 210.08 221.08 232.08 243.08 254.08 265.08 276.08 287.08 298.08 309.08 320.08" y="306.57" font-size="11.00" class="sc-notoserifcjksc">节所述的隐蔽能力评估中，</text><text x="331.08 339.57 345.25 348.34 354.25 360.82 363.71 369.70 372.41" y="306.57" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="381.30 392.30 403.30 414.30 425.30 436.30 447.30 458.30 469.30 480.30 491.30 502.30 513.30 524.30" y="306.
