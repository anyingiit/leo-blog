<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p020.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 20 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">20</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在我们最近一次拟合中，</text><text x="193.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="281.51" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="295.40" y="82.61" font-size="11.00" class="sc-loraregular">AECI</text><text x="323.39" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="337.29" y="82.61" font-size="11.00" class="sc-loraregular sc-k">167.11</text><text x="362.87" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，远低于</text><text x="409.77" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="495.50" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="509.39" y="82.61" font-size="11.00" class="sc-loraregular sc-k">174.56</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分。</text><text x="72.00" y="432.81" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="432.81" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.67 107.77 113.30 116.78 119.14 124.66 130.07 135.16 139.82 145.41 147.78 153.97 158.69 164.10 168.81 173.97 176.91 179.72 182.63 186.35 189.29 194.13 198.50 200.86 204.25 209.99 215.35 220.19" y="432.81" font-size="9.00" class="sc-lorabold">2.3.2.A] Epoch Capabilities Index</text><text x="225.13" y="432.81" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="234.13" y="432.81" font-size="9.00" class="sc-loraregular">ECI</text><text x="249.03" y="432.81" font-size="9.00" class="sc-notoserifcjksc">）将多个基准测试上的表现综合为每个模型的一个数值。我们这一指标的</text><text x="105.23" y="444.51" font-size="9.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="164.18" y="444.51" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="173.18" y="444.51" font-size="9.00" class="sc-loraregular">AECI</text><text x="391.31" y="444.51" font-size="9.00" class="sc-loraregular sc-k">Epoch</text><text x="420.03" y="444.51" font-size="9.00" class="sc-notoserifcjksc">公开的</text><text x="449.40" y="444.51" font-size="9.00" class="sc-loraregular">ECI</text><text x="466.67" y="444.51" font-size="9.00" class="sc-notoserifcjksc">排行榜直接比较。</text><text x="72.00" y="456.21" font-size="9.00" class="sc-notoserifcjksc">灰色圆点为此前的前沿</text><text x="164.37" y="456.21" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="195.70" y="456.21" font-size="9.00" class="sc-notoserifcjksc">模型；彩色圆点为最新的模型。黑色细误差线为基于</text><text x="405.06" y="456.21" font-size="9.00" class="sc-loraregular">100</text><text x="421.88" y="456.21" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="433.25" y="456.21" font-size="9.00" class="sc-loraregular">IRT</text><text x="450.05" y="456.21" font-size="9.00" class="sc-notoserifcjksc">重拟合得到的</text><text x="506.41" y="456.21" font-size="9.00" class="sc-loraregular">95%</text><text x="526.72" y="456.21" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00" y="467.91" font-size="9.00" class="sc-notoserifcjksc">信区间（</text><text x="188.57" y="467.91" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="197.57" y="467.91" font-size="9.00" class="sc-loraregular">CI</text><text x="206.87" y="467.91" font-size="9.00" class="sc-notoserifcjksc">），每次重拟合均在随机抽取的</text><text x="335.24" y="467.91" font-size="9.00" class="sc-loraregular">80%</text><text x="356.08" y="467.91" font-size="9.00" class="sc-notoserifcjksc">基准测试子样本上进行（全局误差）。紫色粗</text><text x="72.00" y="479.61" font-size="9.00" class="sc-notoserifcjksc">误差线来自同一组重新采样的拟合，但衡量的是每个分数相对于各模型之前三个发布版本的变动（局部误差）。两条线</text><text x="72.00" y="491.31" font-size="9.00" class="sc-notoserifcjksc">比较了关于前沿趋势的不同假设。</text><text x="207.00" y="491.31" font-size="9.00" class="sc-loraregular sc-k">Claude 3.5 Sonnet</text><text x="282.42" y="491.31" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="291.42" y="491.31" font-size="9.00" class="sc-loraregular sc-k">2024</text><text x="313.66" y="491.31" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="325.03" y="491.31" font-size="9.00" class="sc-loraregular">6</text><text x="332.60" y="491.31" font-size="9.00" class="sc-notoserifcjksc">月）将</text><text x="361.96" y="491.31" font-size="9.00" class="sc-loraregular">ECI</text><text x="379.23" y="491.31" font-size="9.00" class="sc-notoserifcjksc">量表锚定在</text><text x="426.60" y="491.31" font-size="9.00" class="sc-loraregular">130</text><text x="440.48" y="491.31" font-size="9.00" class="sc-notoserifcjksc">，因此它没有全局置信区</text><text x="72.00" y="503.01" font-size="9.00" class="sc-notoserifcjksc">间（其局部误差线反映的是它之前各模型的不确定性）。图中报告了近期模型在新量表上的分数，以便直接比较。</text><text x="72.00" y="569.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3</text><text x="104.89" y="569.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="601.03" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="601.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="193.63" y="601.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="226.63" y="601.03" font-size="11.00" class="sc-notoserifcjksc">中的评估结论是，该模型未跨越我们的</text><text x="416.52" y="601.03" font-size="11.00" class="sc-loraregular sc-k">Autonomy-2</text><text x="483.17" y="601.03" font-size="11.00" class="sc-notoserifcjksc">能力阈值。</text><text x="72.00" y="616.65" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89" y="616.65" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="185.40" y="616.65" font-size="11.00" class="sc-notoserifcjksc">的能力远低于</text><text x="254.29" y="616.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="298.84" y="616.65" font-size="11.00" class="sc-notoserifcjksc">，且并未推进能力前沿，我们在此得出相同的结</text><text x="72.00" y="632.27" font-size="11.00" class="sc-notoserifcjksc">论。</text><text x="72.00" y="667.19" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="667.19" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="693.75" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="693.75" font-size="11.00" class="sc-loraregular">CB</text><text x="103.32" y="693.75" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="117.21" y="693.75" font-size="11.00" class="sc-loraregular">AI</text><text x="130.67" y="693.75" font-size="11.00" class="sc-notoserifcjksc">研发评估中，能力较弱的模型不可能比能力较强的模型带来更高水平的风险；但与此</text><text x="72.00" y="709.37" font-size="11.00" class="sc-notoserifcjksc">不同，如果能力较弱的模型比之前的模型更善于欺骗用户，或表现出更令人担忧的行为（例如倾</text><text x="72.00" y="724.99" font-size="11.00" class="sc-notoserifcjksc">向于采取有害行动），那么它仍可能在高风险情境中带来更高的</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="592.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="107.89" y="592.23" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="143.29" y="592.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="146.18" y="592.23" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="173.14" y="592.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="176.04" y="592.23" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="190.73" y="592.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="193.63" y="592.23" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="204.63" y="592.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="204.63" y="592.23" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="215.63" y="592.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="215.63" y="592.23" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p021.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 21 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">21</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">采取未对齐行为的风险。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="185.40" y="147.38" font-size="11.00" class="sc-notoserifcjksc">达到了我们的</text><text x="254.29" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Autonomy-1</text><text x="319.10" y="147.38" font-size="11.00" class="sc-notoserifcjksc">阈值，我们依据最近一份风险报告（</text><text x="495.10" y="147.38" font-size="11.00" class="sc-loraregular">Risk</text><text x="72.00" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Report</text><text x="106.89" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）中的对齐（</text><text x="172.89" y="163.00" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="224.04" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）威胁模型对其重新进行了评估。</text><text x="72.00" y="194.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="194.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对各项主张及核心论证的更新</text><text x="72.00" y="226.19" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00" y="226.19" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="154.82" y="226.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="226.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79" y="226.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="232.79" y="226.19" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="246.68 252.59 255.18 261.54 268.03 273.94 276.64 280.65" y="226.19" font-size="11.00" class="sc-loraregular">2.6–2.14</text><text x="289.50" y="226.19" font-size="11.00" class="sc-notoserifcjksc">节中所述的核心论证及对各项主张的论证，在很大</text><text x="72.00" y="241.81" font-size="11.00" class="sc-notoserifcjksc">程度上仍适用于</text><text x="151.89" y="241.81" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="202.11" y="241.81" font-size="11.00" class="sc-notoserifcjksc">带来的未对齐（</text><text x="279.11" y="241.81" font-size="11.00" class="sc-loraregular sc-k">misalignment</text><text x="348.28" y="241.81" font-size="11.00" class="sc-notoserifcjksc">）风险。下面我们说明对部分具体主张</text><text x="72.00" y="257.43" font-size="11.00" class="sc-notoserifcjksc">的更新。</text><text x="72.00" y="290.95" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="290.95" font-size="11.00" class="sc-lorabold">1</text><text x="115.25" y="290.95" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="151.14" y="290.95" font-size="11.00" class="sc-notoserifcjksc">我们风险报告中的主张</text><text x="264.04" y="290.95" font-size="11.00" class="sc-loraregular">1</text><text x="270.93" y="290.95" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="281.93" y="290.95" font-size="11.00" class="sc-loraregular">“</text><text x="286.33" y="290.95" font-size="11.00" class="sc-notoserifcjksc">模型不太可能具备强大的隐蔽能力</text><text x="451.33" y="290.95" font-size="11.00" class="sc-loraregular">”</text><text x="455.17" y="290.95" font-size="11.00" class="sc-notoserifcjksc">。在本系统卡</text><text x="72.00" y="306.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="306.57" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="147.66" y="306.57" font-size="11.00" class="sc-notoserifcjksc">）第</text><text x="172.55" y="306.57" font-size="11.00" class="sc-loraregular">6.4.2</text><text x="199.08" y="306.57" font-size="11.00" class="sc-notoserifcjksc">节所述的隐蔽能力评估中，</text><text x="331.08" y="306.57" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="381.30" y="306.57" font-size="11.00" class="sc-notoserifcjksc">的表现远低于其他近期模型。我</text><text x="72.00" y="322.19" font-size="11.00" class="sc-notoserifcjksc">们认为，与我们最近一份风险报告相比，主张</text><text x="294.89" y="322.19" font-size="11.00" class="sc-loraregular">1</text><text x="301.79" y="322.19" font-size="11.00" class="sc-notoserifcjksc">目前并未明显减弱。</text><text x="72.00" y="388.11" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="388.11" font-size="11.00" class="sc-lorabold">2</text><text x="116.65" y="388.11" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="152.54" y="388.11" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="177.43" y="388.11" font-size="11.00" class="sc-loraregular">2</text><text x="186.23" y="388.11" font-size="11.00" class="sc-notoserifcjksc">论证的是</text><text x="230.23" y="388.11" font-size="11.00" class="sc-loraregular">“</text><text x="234.63" y="388.11" font-size="11.00" class="sc-notoserifcjksc">已知未对齐造成的预期危害较低</text><text x="388.63" y="388.11" font-size="11.00" class="sc-loraregular">”</text><text x="392.47" y="388.11" font-size="11.00" class="sc-notoserifcjksc">。我们认为，第</text><text x="472.37" y="388.11" font-size="11.00" class="sc-loraregular">6</text><text x="481.62" y="388.11" font-size="11.00" class="sc-notoserifcjksc">节中关于</text><text x="72.00" y="403.73" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="403.73" font-size="11.00" class="sc-notoserifcjksc">对齐特性的任何观察结果，均不意味着其风险高于其他近期</text><text x="411.11" y="403.73" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="449.40" y="403.73" font-size="11.00" class="sc-notoserifcjksc">模型所带来的风</text><text x="72.00" y="419.35" font-size="11.00" class="sc-notoserifcjksc">险。因此，我们认为主张</text><text x="195.89" y="419.35" font-size="11.00" class="sc-loraregular">2</text><text x="204.69" y="419.35" font-size="11.00" class="sc-notoserifcjksc">的强度没有变化。</text><text x="72.00" y="485.26" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="485.26" font-size="11.00" class="sc-lorabold">3.4</text><text x="125.53" y="485.26" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="139.42" y="485.26" font-size="11.00" class="sc-lorabold">4.4</text><text x="156.91" y="485.26" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="192.80" y="485.26" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="217.70" y="485.26" font-size="11.00" class="sc-loraregular">3.4</text><text x="235.38" y="485.26" font-size="11.00" class="sc-notoserifcjksc">指出：</text><text x="268.38" y="485.26" font-size="11.00" class="sc-loraregular">“</text><text x="272.78" y="485.26" font-size="11.00" class="sc-notoserifcjksc">鉴于我们的对齐评估，不太可能存在未知的严重普遍性</text><text x="72.00" y="500.88" font-size="11.00" class="sc-notoserifcjksc">未对齐。</text><text x="116.00" y="500.88" font-size="11.00" class="sc-loraregular">”</text><text x="119.84" y="500.88" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="144.73" y="500.88" font-size="11.00" class="sc-loraregular">4.4</text><text x="162.26" y="500.88" font-size="11.00" class="sc-notoserifcjksc">指出：</text><text x="195.26" y="500.88" font-size="11.00" class="sc-loraregular">“</text><text x="199.65" y="500.88" font-size="11.00" class="sc-notoserifcjksc">鉴于我们的对齐评估，存在未知的严重依赖情境的未对齐的可能性较</text><text x="72.00" y="516.50" font-size="11.00" class="sc-notoserifcjksc">小。</text><text x="94.00" y="516.50" font-size="11.00" class="sc-loraregular">”</text><text x="97.84" y="516.50" font-size="11.00" class="sc-notoserifcjksc">我们针对</text><text x="144.73" y="516.50" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="194.95" y="516.50" font-size="11.00" class="sc-notoserifcjksc">的对齐评估所提供的证据强度，比</text><text x="362.84" y="516.50" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="390.66" y="516.50" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="404.55" y="516.50" font-size="11.00" class="sc-loraregular">8</text><text x="413.63" y="516.50" font-size="11.00" class="sc-notoserifcjksc">月风险报告中针对</text><text x="504.52" y="516.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="532.12" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="532.12" font-size="11.00" class="sc-notoserifcjksc">提供的证据强度略低，因为</text><text x="256.84" y="532.12" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="307.06" y="532.12" font-size="11.00" class="sc-notoserifcjksc">是较新的模型，其内部使用量少于</text><text x="474.95" y="532.12" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="547.74" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="547.74" font-size="11.00" class="sc-notoserifcjksc">在该报告发布时的内部使用量。这并未显著改变我们对上级主张</text><text x="432.84" y="547.74" font-size="11.00" class="sc-loraregular">3</text><text x="438.97" y="547.74" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="449.97" y="547.74" font-size="11.00" class="sc-loraregular">“</text><text x="454.37" y="547.74" font-size="11.00" class="sc-notoserifcjksc">未知的严重普遍</text><text x="72.00" y="563.36" font-size="11.00" class="sc-notoserifcjksc">性未对齐的可能性非常小</text><text x="193.00" y="563.36" font-size="11.00" class="sc-loraregular">”</text><text x="196.84" y="563.36" font-size="11.00" class="sc-notoserifcjksc">）和主张</text><text x="243.73" y="563.36" font-size="11.00" class="sc-loraregular">4</text><text x="249.69" y="563.36" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="260.69" y="563.36" font-size="11.00" class="sc-loraregular">“</text><text x="265.09" y="563.36" font-size="11.00" class="sc-notoserifcjksc">未知的严重依赖情境的未对齐造成的预期危害较低</text><text x="507.09" y="563.36" font-size="11.00" class="sc-loraregular">”</text><text x="510.93" y="563.36" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="578.98" font-size="11.00" class="sc-notoserifcjksc">总体信心，因为二者各自都有若干相互印证的子主张作为支撑。</text><text x="72.00" y="679.56" font-size="11.00" class="sc-notoserifcjksc">我们认为，主张</text><text x="151.89" y="679.56" font-size="11.00" class="sc-loraregular">5</text><text x="157.89" y="679.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="168.89" y="679.56" font-size="11.00" class="sc-loraregular">6</text><text x="175.25" y="679.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="186.25" y="679.56" font-size="11.00" class="sc-loraregular">7</text><text x="194.21" y="679.56" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="208.10" y="679.56" font-size="11.00" class="sc-loraregular">8</text><text x="217.18" y="679.56" font-size="11.00" class="sc-notoserifcjksc">均无需更新，风险报告第</text><text x="341.07" y="679.56" font-size="11.00" class="sc-loraregular">2.15</text><text x="362.58" y="679.56" font-size="11.00" class="sc-notoserifcjksc">节中提供的特定路径评估也无需更</text><text x="72.00" y="695.18" font-size="11.00" class="sc-notoserifcjksc">新。</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="217.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="217.39" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="151.93" y="217.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="154.82" y="217.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="165.82" y="217.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="168.71" y="217.39" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="174.89" y="217.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="177.79" y="217.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="217.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="217.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="217.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="217.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="217.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="217.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="217.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="217.39" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p022.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 22 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">22</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的对齐风险总体评估</text><text x="72.00" y="115.03" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="115.03" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="113.71" y="115.03" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="127.61" y="115.03" font-size="11.00" class="sc-loraregular">8</text><text x="136.68" y="115.03" font-size="11.00" class="sc-notoserifcjksc">月风险报告中，我们将对齐风险评估上调至</text><text x="345.68" y="115.03" font-size="11.00" class="sc-loraregular">“</text><text x="350.08" y="115.03" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="361.08" y="115.03" font-size="11.00" class="sc-loraregular">”</text><text x="364.92" y="115.03" font-size="11.00" class="sc-notoserifcjksc">。我们这样做，是为了反映近期与网</text><text x="72.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">络安全评估中模型行为相关的事件披露所带来的更大不确定性，尽管我们认为我们的论证很可能</text><text x="72.00" y="146.27" font-size="11.00" class="sc-notoserifcjksc">仍支持对所涵盖的模型给出更低的风险定级。鉴于上述对具体主张的更新均不意味着风险显著上</text><text x="72.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">升，我们的总体评估是：</text><text x="193.00" y="161.89" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="281.51" y="161.89" font-size="11.00" class="sc-notoserifcjksc">的未对齐导致灾难性危害的风险同样较低。</text></svg></div>
