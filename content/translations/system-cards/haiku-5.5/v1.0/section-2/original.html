.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">2 RSP</text><text x="118.53" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">2.1</text><text x="92.08" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在本节中，我们介绍对</text><text x="184.89" y="154.36" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="273.40" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在与我们的</text><text x="328.40" y="154.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="405.40" y="154.36" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="416.40" y="154.36" font-size="11.00" class="sc-loraregular sc-k">Responsible Scaling</text><text x="72.00" y="169.98" font-size="11.00" class="sc-loraregular sc-k">Policy</text><text x="102.68" y="169.98" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="113.68" y="169.98" font-size="11.00" class="sc-loraregular">RSP</text><text x="133.49" y="169.98" font-size="11.00" class="sc-notoserifcjksc">）相关的灾难性风险方面所作的评估。正如本节中的评估以及第</text><text x="444.38" y="169.98" font-size="11.00" class="sc-loraregular">8</text><text x="453.46" y="169.98" font-size="11.00" class="sc-notoserifcjksc">节所示的广泛能</text><text x="72.00" y="185.60" font-size="11.00" class="sc-notoserifcjksc">力评估所表明的，</text><text x="160.00" y="185.60" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="210.22" y="185.60" font-size="11.00" class="sc-notoserifcjksc">并不处于能力前沿，并且在我们报告的绝大多数评估中，其能力都弱</text><text x="72.00" y="201.22" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="201.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="160.03" y="201.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="251.51" font-size="11.00" class="sc-notoserifcjksc">因此，我们判定</text><text x="151.89" y="251.51" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="202.11" y="251.51" font-size="11.00" class="sc-notoserifcjksc">未跨越我们的</text><text x="271.00" y="251.51" font-size="11.00" class="sc-loraregular sc-k">CB-2</text><text x="299.36" y="251.51" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="313.25" y="251.51" font-size="11.00" class="sc-loraregular sc-k">Autonomy-2 RSP</text><text x="402.61" y="251.51" font-size="11.00" class="sc-notoserifcjksc">阈值。不过，我们确实将</text><text x="72.00" y="267.13" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="122.21" y="267.13" font-size="11.00" class="sc-notoserifcjksc">视为达到了我们的</text><text x="213.11" y="267.13" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="239.63" y="267.13" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="253.52" y="267.13" font-size="11.00" class="sc-loraregular sc-k">Autonomy-1</text><text x="318.33" y="267.13" font-size="11.00" class="sc-notoserifcjksc">阈值，并采取</text><text x="387.23" y="267.13" font-size="11.00" class="sc-loraregular">RSP</text><text x="409.93" y="267.13" font-size="11.00" class="sc-notoserifcjksc">中相应的缓解措施。</text><text x="72.00" y="316.28" font-size="11.00" class="sc-notoserifcjksc">下面我们对这些风险进行评估，重点关注自动化评估的结果。</text><text x="72.00" y="366.25" font-size="14.00" class="sc-poppinssemibold">2.2 CB</text><text x="118.13" y="366.25" font-size="14.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="403.35" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.1</text><text x="101.48" y="403.35" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们测量了什么</text><text x="72.00" y="431.24" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="431.24" font-size="11.00" class="sc-notoserifcjksc">没有推进</text><text x="207.40" y="431.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="293.13" y="431.24" font-size="11.00" class="sc-notoserifcjksc">所确立的能力前沿，而且我们高度确信它的能力弱</text><text x="72.00" y="446.86" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="446.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="160.03" y="446.86" font-size="11.00" class="sc-notoserifcjksc">。因此，本系统卡只呈现自动化评估结果，并主要将</text><text x="415.93" y="446.86" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="466.14" y="446.86" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="72.00" y="462.48" font-size="11.00" class="sc-loraregular sc-k">Claude 5</text><text x="119.18" y="462.48" font-size="11.00" class="sc-notoserifcjksc">系列模型进行比较。我们没有开展专家红队测试（</text><text x="361.18" y="462.48" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="425.29" y="462.48" font-size="11.00" class="sc-notoserifcjksc">）、能力提升（</text><text x="502.29" y="462.48" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="529.61" y="462.48" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="478.10" font-size="11.00" class="sc-notoserifcjksc">试验或其他需要人类参与、资源投入较大的评估。</text><text x="225.18" y="367.35" font-size="6.95" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本节（2.2 节）译文由项目发起人另行翻译提供，经脚本格式检查后排入，未经 Claude 审校。</text><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="328.40" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="328.40" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="339.40" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="339.40" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="350.40" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="350.40" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="361.40" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="361.40" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="372.40" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="372.40" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="383.40" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="383.40" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="394.40" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="394.40" y="145.56" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="90.81" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">相关性</text><text x="76.75" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold">已知生物武</text><text x="76.75" y="131.67" font-size="11.00" class="sc-notoserifcjkscbold">器</text><text x="76.75" y="240.65" font-size="11.00" class="sc-notoserifcjkscbold">新型生物武</text><text x="76.75" y="256.27" font-size="11.00" class="sc-notoserifcjkscbold">器</text><text x="210.58" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">评估</text><text x="147.25" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold">自动化短程和中程评估：多模</text><text x="147.25" y="131.67" font-size="11.00" class="sc-notoserifcjkscbold">态病毒学（</text><text x="202.25" y="131.67" font-size="11.00" class="sc-lorabold sc-k">VCT</text><text x="224.47" y="131.67" font-size="11.00" class="sc-notoserifcjkscbold">）、</text><text x="246.47" y="131.67" font-size="11.00" class="sc-lorabold sc-k">LatchBio</text><text x="147.25" y="147.29" font-size="11.00" class="sc-lorabold sc-k">Bioinformatics</text><text x="225.34" y="147.29" font-size="11.00" class="sc-notoserifcjkscbold">、</text><text x="236.34" y="147.29" font-size="11.00" class="sc-lorabold sc-k">Protocols</text><text x="147.25" y="240.65" font-size="11.00" class="sc-notoserifcjkscbold">序列到功能建模与设计</text><text x="147.25" y="256.27" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="158.25" y="256.27" font-size="11.00" class="sc-lorabold sc-k">RNA</text><text x="181.47" y="256.27" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="147.25" y="300.47" font-size="11.00" class="sc-notoserifcjkscbold">病毒序列到功能评估（</text><text x="257.25" y="300.47" font-size="11.00" class="sc-lorabold sc-k">AAV</text><text x="282.03" y="300.47" font-size="11.00" class="sc-notoserifcjkscbold">判</text><text x="147.25" y="316.09" font-size="11.00" class="sc-notoserifcjkscbold">别）</text><text x="147.25" y="360.30" font-size="11.00" class="sc-notoserifcjkscbold">病毒序列到功能自主研究</text><text x="409.65" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">说明</text><text x="305.50" y="116.05" font-size="11.00" class="sc-notoserifcjksc">模型在包含图像的病毒学问题上表现如何？模型</text><text x="305.50" y="131.67" font-size="11.00" class="sc-notoserifcjksc">能在多大程度上帮助威胁行为者排查并扩展其湿</text><text x="305.50" y="147.29" font-size="11.00" class="sc-notoserifcjksc">实验方案（</text><text x="360.50" y="147.29" font-size="11.00" class="sc-loraregular sc-k">wet-lab protocol</text><text x="446.27" y="147.29" font-size="11.00" class="sc-notoserifcjksc">）？模型能否分析</text><text x="305.50" y="162.91" font-size="11.00" class="sc-notoserifcjksc">生物学数据，并得出威胁行为者可能需要的生物</text><text x="305.50" y="178.53" font-size="11.00" class="sc-notoserifcjksc">学结论？</text><text x="305.50" y="240.65" font-size="11.00" class="sc-notoserifcjksc">在经过校准的生物序列建模与设计任务上，模型</text><text x="305.50" y="256.27" font-size="11.00" class="sc-notoserifcjksc">能否达到人类专家的表现水平？</text><text x="305.50" y="300.47" font-size="11.00" class="sc-notoserifcjksc">与公开工具相比，模型能否预测新型病毒衣壳序</text><text x="305.50" y="316.09" font-size="11.00" class="sc-notoserifcjksc">列的功能特性？</text><text x="305.50" y="360.30" font-size="11.00" class="sc-notoserifcjksc">模型能否在分布外（</text><text x="404.50" y="360.30" font-size="11.00" class="sc-loraregular sc-k">out-of-distribution</text><text x="502.81" y="360.30" font-size="11.00" class="sc-notoserifcjksc">）数据</text><text x="305.50" y="375.92" font-size="11.00" class="sc-notoserifcjksc">集上迭代改进针对新型病毒衣壳序列的预测模</text><text x="305.50" y="391.54" font-size="11.00" class="sc-notoserifcjksc">型？</text><text x="72.00" y="410.30" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="410.30" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.53 100.63 104.28 106.38 111.92 115.39 117.76 123.95" y="410.30" font-size="9.00" class="sc-lorabold">2.2.1.A] CB</text><text x="132.26" y="410.30" font-size="9.00" class="sc-notoserifcjkscbold">评估组合</text><text x="168.26" y="410.30" font-size="9.00" class="sc-notoserifcjksc">及其与</text><text x="197.63" y="410.30" font-size="9.00" class="sc-loraregular sc-k">CB-1</text><text x="219.33" y="410.30" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="230.70" y="410.30" font-size="9.00" class="sc-loraregular sc-k">CB-2</text><text x="253.90" y="410.30" font-size="9.00" class="sc-notoserifcjksc">阈值的相关性。</text><text x="72.00" y="442.66" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.2 CB-1</text><text x="137.96" y="442.66" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化评估结果</text><text x="72.00" y="470.55" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="470.55" font-size="11.00" class="sc-loraregular">4</text><text x="127.75" y="470.55" font-size="11.00" class="sc-notoserifcjksc">项自动化评估，考察</text><text x="229.64" y="470.55" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="318.15" y="470.55" font-size="11.00" class="sc-notoserifcjksc">在与</text><text x="343.04" y="470.55" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="369.56" y="470.55" font-size="11.00" class="sc-notoserifcjksc">威胁模型相关的任务上的表现。自</text><text x="72.00" y="486.17" font-size="11.00" class="sc-notoserifcjksc">本次模型发布起，</text><text x="160.00" y="486.17" font-size="11.00" class="sc-loraregular sc-k">BioMysteryBench</text><text x="252.48" y="486.17" font-size="11.00" class="sc-notoserifcjksc">已停用，并从生命科学能力评估组合中移除。我们现在改为</text><text x="72.00" y="501.79" font-size="11.00" class="sc-notoserifcjksc">交叉参考</text><text x="118.89" y="501.79" font-size="11.00" class="sc-loraregular sc-k">LatchBio Bioinformatics</text><text x="244.43" y="501.79" font-size="11.00" class="sc-notoserifcjksc">套件，以评估生物信息学相关能力。</text><text x="108.00" y="567.70" font-size="11.00" class="sc-lorabold sc-k" fill="#1d1c1d">VCT</text><text x="130.22" y="567.70" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="141.22" y="567.70" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">由</text><text x="155.11" y="567.70" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">SecureBio</text><text x="209.32" y="567.70" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="223.21" y="567.70" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">CAIS</text><text x="250.49" y="567.70" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">提供的病毒学专项多模态多项选择评估；</text><text x="108.00" y="600.08" font-size="11.00" class="sc-lorabold sc-k" fill="#1d1c1d">LatchBio Bioinformatics</text><text x="235.31" y="600.08" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="246.31" y="600.08" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">由两项评估（</text><text x="421.30" y="600.08" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">、</text><text x="432.30" y="600.08" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">SingleCellBench</text><text x="515.01" y="600.08" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）组</text><text x="108.00" y="615.70" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">成的套件，考察模型解决具有挑战性的真实世界生物信息学问题的能力，反映其协助</text><text x="108.00" y="631.32" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">CB-1</text><text x="134.52" y="631.32" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">威胁行为者开展计算分析的能力；</text><text x="108.00" y="664.85" font-size="11.00" class="sc-lorabold sc-k" fill="#1d1c1d">Protocols</text><text x="157.86" y="664.85" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">（故障排查与理解模块）：</text><text x="289.86" y="664.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一项生命科学专项评估，考察模型协助排查和理解</text><text x="108.00" y="680.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">实验台操作方案的能力，这类方案可能是</text><text x="308.89" y="680.47" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">CB-1</text><text x="335.41" y="680.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">威胁行为者会尝试执行的。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="90.00" y="591.17" font-size="11.00" class="sc-loraregular">1.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">13</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">VCT</text><text x="110.53" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="132.53" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="182.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">强于</text><text x="207.64" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="252.70" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，但弱于</text><text x="299.59" y="82.61" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="335.44" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（图</text><text x="360.33" y="82.61" font-size="11.00" class="sc-loraregular">2.2.2.A</text><text x="393.06" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）。在两项</text><text x="450.95" y="82.61" font-size="11.00" class="sc-loraregular sc-k">LatchBio</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Bioinformatics</text><text x="149.53" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评估上，</text><text x="193.53" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="243.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="257.64" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="305.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表现相当，但仍弱于</text><text x="407.48" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="443.33" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。同样，在</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Protocols</text><text x="123.69" y="113.85" font-size="11.00" class="sc-notoserifcjksc">评估中，它强于</text><text x="203.58" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="248.64" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，但弱于</text><text x="295.53" y="113.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="331.38" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">综合来看，</text><text x="127.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="177.21" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="191.11" y="163.57" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="217.63" y="163.57" font-size="11.00" class="sc-notoserifcjksc">能力达到或超过</text><text x="297.52" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="342.58" y="163.57" font-size="11.00" class="sc-notoserifcjksc">，但低于</text><text x="389.47" y="163.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="425.32" y="163.57" font-size="11.00" class="sc-notoserifcjksc">。有关</text><text x="461.21" y="163.57" font-size="11.00" class="sc-loraregular sc-k">LatchBio</text><text x="72.00" y="179.19" font-size="11.00" class="sc-loraregular sc-k">Bioinformatics</text><text x="149.53" y="179.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="163.42" y="179.19" font-size="11.00" class="sc-loraregular sc-k">Protocols</text><text x="215.11" y="179.19" font-size="11.00" class="sc-notoserifcjksc">评估的更多详情，请参阅本系统卡第</text><text x="394.00" y="179.19" font-size="11.00" class="sc-loraregular">8.13</text><text x="415.92" y="179.19" font-size="11.00" class="sc-notoserifcjksc">节（生命科学能力）及</text><text x="72.00" y="194.81" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="110.29" y="194.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 5.5</text><text x="157.73" y="194.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="190.73" y="194.81" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="457.40" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="457.40" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.43 107.52 113.06" y="457.40" font-size="9.00" class="sc-lorabold">2.2.2.A]</text><text x="118.90" y="457.40" font-size="9.00" class="sc-notoserifcjkscbold">多模态病毒学。</text><text x="181.90" y="457.40" font-size="9.00" class="sc-notoserifcjksc">在包含</text><text x="211.27" y="457.40" font-size="9.00" class="sc-loraregular">350</text><text x="229.14" y="457.40" font-size="9.00" class="sc-notoserifcjksc">道题的多模态病毒学故障排查题集上的准确率。误差线为按题目计算的</text><text x="510.51" y="457.40" font-size="9.00" class="sc-loraregular">95%</text><text x="530.81" y="457.40" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00" y="469.10" font-size="9.00" class="sc-notoserifcjksc">信区间（</text><text x="188.57" y="469.10" font-size="9.00" class="sc-notoserifcjksc">）（</text><text x="206.57" y="469.10" font-size="9.00" class="sc-loraregular">t</text><text x="212.42" y="469.10" font-size="9.00" class="sc-notoserifcjksc">区间）。人类专家基线（</text><text x="311.42" y="469.10" font-size="9.00" class="sc-loraregular sc-k">0.221</text><text x="332.02" y="469.10" font-size="9.00" class="sc-notoserifcjksc">）以虚线表示。</text><text x="72.00" y="514.25" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.3 CB-2</text><text x="141.04" y="514.25" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化评估结果</text><text x="72.00" y="542.13" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89" y="542.13" font-size="11.00" class="sc-loraregular sc-k">Dyno Therapeutics</text><text x="208.14" y="542.13" font-size="11.00" class="sc-notoserifcjksc">合作开展了</text><text x="266.03" y="542.13" font-size="11.00" class="sc-loraregular">3</text><text x="275.05" y="542.13" font-size="11.00" class="sc-notoserifcjksc">项序列到功能建模与设计能力评估：</text><text x="108.00" y="590.71" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="132.89" y="590.71" font-size="11.00" class="sc-lorabold sc-k">RNA</text><text x="159.01" y="590.71" font-size="11.00" class="sc-notoserifcjkscbold">序列设计：</text><text x="214.01" y="590.71" font-size="11.00" class="sc-notoserifcjksc">这是一项中程挑战，自</text><text x="326.90" y="590.71" font-size="11.00" class="sc-loraregular">2018</text><text x="352.72" y="590.71" font-size="11.00" class="sc-notoserifcjksc">年以来，</text><text x="396.72" y="590.71" font-size="11.00" class="sc-loraregular">Dyno</text><text x="426.73" y="590.71" font-size="11.00" class="sc-notoserifcjksc">已用它评估了来自美国</text><text x="330.89" y="606.33" font-size="11.00" class="sc-loraregular">57</text><text x="344.85" y="606.33" font-size="11.00" class="sc-notoserifcjksc">名人类参与者。任务提供一组</text><text x="490.74" y="606.33" font-size="11.00" class="sc-loraregular">RNA</text><text x="515.81" y="606.33" font-size="11.00" class="sc-notoserifcjksc">序列</text><text x="108.00" y="621.95" font-size="11.00" class="sc-notoserifcjksc">数据，其中每条序列都有一个数值分数，反映对该序列的某种（未知）实验测量结果，并</text><text x="108.00" y="637.57" font-size="11.00" class="sc-notoserifcjksc">要求参与者（</text><text x="174.00" y="637.57" font-size="11.00" class="sc-loraregular">1</text><text x="178.00" y="637.57" font-size="11.00" class="sc-notoserifcjksc">）预测无标签序列测试集的分数，然后（</text><text x="376.00" y="637.57" font-size="11.00" class="sc-loraregular">2</text><text x="381.91" y="637.57" font-size="11.00" class="sc-notoserifcjksc">）设计新序列，争取获得高分。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="528.81" y="170.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="72.00" y="186.01" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="110.29" y="186.01" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="137.25" y="186.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="140.14" y="186.01" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="154.84" y="186.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="157.73" y="186.01" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="168.73" y="186.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="168.73" y="186.01" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="179.73" y="186.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="179.73" y="186.01" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="90.00" y="83.07" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="212.60" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="108.00" y="82.61" font-size="11.00" class="sc-lorabold sc-k">AAV</text><text x="132.78" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测：</text><text x="209.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">腺相关病毒（</text><text x="275.78" y="82.61" font-size="11.00" class="sc-loraregular sc-k">adeno-associated virus</text><text x="394.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="405.03" y="82.61" font-size="11.00" class="sc-loraregular sc-k">AAVs</text><text x="430.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）是一类非致病病毒，</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">常在基因疗法中用作递送机制，通过病毒衣壳（病毒的外层蛋白质外壳）递送</text><text x="484.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">DNA</text><text x="511.14" y="98.23" font-size="11.00" class="sc-notoserifcjksc">载</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">荷。在这项任务中，模型获得</text><text x="253.89 257.90 260.50 267.34 274.17" y="113.85" font-size="11.00" class="sc-loraregular">1,000</text><text x="283.90" y="113.85" font-size="11.00" class="sc-notoserifcjksc">条未发表的</text><text x="341.79" y="113.85" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="365.72" y="113.85" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，其中包含</text><text x="467.61" y="113.85" font-size="11.00" class="sc-loraregular">Dyno</text><text x="497.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc">筛选的短</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">插入序列改造。随后，模型需要运用其生物物理学知识、</text><text x="383.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="406.93" y="129.47" font-size="11.00" class="sc-notoserifcjksc">衣壳生物学知识和机器学习</text><text x="108.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">技能，给出每条改造后序列能正确组装成功能性衣壳的概率。</text><text x="108.00" y="212.15" font-size="11.00" class="sc-lorabold sc-k">AAV</text><text x="132.78" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装自主研究：</text><text x="231.78" y="212.15" font-size="11.00" class="sc-notoserifcjksc">与上一项任务一样，模型获得一组带标签、未发表的</text><text x="487.68" y="212.15" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="511.60" y="212.15" font-size="11.00" class="sc-notoserifcjksc">衣壳</text><text x="108.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">序列，这些序列在特定区域插入了短序列。该任务要求模型利用这一带标签训练集，创建</text><text x="108.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">一个预测器，使其对另一个未见区域存在插入的衣壳序列具有很强的分布外表现。模型可</text><text x="108.00" y="259.01" font-size="11.00" class="sc-notoserifcjksc">以访问一个打分器，用于在不暴露这些序列本身组成的情况下，测试预测器在该未见区域</text><text x="108.00" y="274.63" font-size="11.00" class="sc-notoserifcjksc">序列上的表现。</text><text x="72.00" y="357.87" font-size="11.00" class="sc-notoserifcjksc">这些任务的序列和目标均未发表，因此我们高度确信，它们能够在不受训练数据污染的情况下，</text><text x="72.00" y="373.49" font-size="11.00" class="sc-notoserifcjksc">测量</text><text x="96.89" y="373.49" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="373.49" font-size="11.00" class="sc-notoserifcjksc">模型在新颖生物学任务上的技能。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">关于各项评估的更详细介绍以及我们纳入这些评估的依据，请参阅</text><text x="393.89" y="422.64" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="479.63" y="422.64" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="512.63" y="422.64" font-size="11.00" class="sc-notoserifcjksc">；以</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">下小节将概述结果。</text><text x="72.00" y="487.41" font-size="11.00" class="sc-lorabold">2.2.3.1</text><text x="104.93" y="487.41" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="129.83" y="487.41" font-size="11.00" class="sc-lorabold sc-k">RNA</text><text x="155.94" y="487.41" font-size="11.00" class="sc-notoserifcjkscbold">序列建模与设计</text><text x="72.00" y="519.79" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在该评估中的表现有好有坏。在预测</text><text x="339.40" y="519.79" font-size="11.00" class="sc-loraregular">RNA</text><text x="364.47" y="519.79" font-size="11.00" class="sc-notoserifcjksc">序列特性方面，它超过了</text><text x="488.36" y="519.79" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="72.00" y="535.41" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">，甚至超过了</text><text x="146.89" y="535.41" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="185.63" y="535.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="199.52" y="535.41" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="291.58" y="535.41" font-size="11.00" class="sc-notoserifcjksc">。但它的序列设计能力较弱，表现介于</text><text x="481.48" y="535.41" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="529.42" y="535.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="551.03" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="551.03" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="72.00" y="584.56" font-size="11.00" class="sc-notoserifcjksc">进一步检查后，我们发现，</text><text x="204.00" y="584.56" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="254.22" y="584.56" font-size="11.00" class="sc-notoserifcjksc">采用的序列预测策略与</text><text x="367.11" y="584.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="452.84" y="584.56" font-size="11.00" class="sc-notoserifcjksc">类似，后者是迄今</text><text x="72.00" y="600.18" font-size="11.00" class="sc-notoserifcjksc">在预测子任务上得分最高的模型。其他模型经常考虑它所选用的方法，却未实际应用。我们的评</text><text x="72.00" y="615.80" font-size="11.00" class="sc-notoserifcjksc">估是，</text><text x="105.00" y="615.80" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="155.21" y="615.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="169.11" y="615.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="216.55" y="615.80" font-size="11.00" class="sc-notoserifcjksc">都倾向于使用这种方法，但与</text><text x="362.44" y="615.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="409.89" y="615.80" font-size="11.00" class="sc-notoserifcjksc">不同，</text><text x="442.89" y="615.80" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="493.10" y="615.80" font-size="11.00" class="sc-notoserifcjksc">未能在更</text><text x="72.00" y="631.42" font-size="11.00" class="sc-notoserifcjksc">具挑战性的设计子任务中利用自己的预测。同样，在上下文内迭代（</text><text x="402.00" y="631.42" font-size="11.00" class="sc-loraregular">“</text><text x="406.40" y="631.42" font-size="11.00" class="sc-notoserifcjksc">有先验信息</text><text x="461.40" y="631.42" font-size="11.00" class="sc-loraregular">”</text><text x="465.24" y="631.42" font-size="11.00" class="sc-notoserifcjksc">）条件下，它</text><text x="72.00" y="647.04" font-size="11.00" class="sc-notoserifcjksc">也仅有轻微的表现提升。因此，我们评估认为，</text><text x="303.00" y="647.04" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="353.22" y="647.04" font-size="11.00" class="sc-notoserifcjksc">的综合表现强于</text><text x="433.11" y="647.04" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="516.46" y="647.04" font-size="11.00" class="sc-notoserifcjksc">，但</text><text x="72.00" y="662.66" font-size="11.00" class="sc-notoserifcjksc">低于</text><text x="96.89" y="662.66" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="171.03" y="662.66" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="182.03" y="662.66" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="229.48" y="662.66" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="243.37" y="662.66" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="335.43" y="662.66" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="393.89" y="413.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="393.89" y="413.84" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="429.29" y="413.84" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="432.18" y="413.84" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="459.15" y="413.84" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="462.04" y="413.84" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="476.73" y="413.84" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="479.63" y="413.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="490.63" y="413.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="490.63" y="413.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="501.63" y="413.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="501.63" y="413.84" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">15</text><text x="72.00" y="592.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="592.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 111.42 113.52 119.05" y="592.93" font-size="9.00" class="sc-lorabold">2.2.3.1.A]</text><text x="124.89" y="592.93" font-size="9.00" class="sc-notoserifcjkscbold">黑盒</text><text x="145.26" y="592.93" font-size="9.00" class="sc-lorabold sc-k">RNA</text><text x="166.63" y="592.93" font-size="9.00" class="sc-notoserifcjkscbold">序列设计。</text><text x="211.63" y="592.93" font-size="9.00" class="sc-loraregular">RNA</text><text x="232.14" y="592.93" font-size="9.00" class="sc-notoserifcjksc">序列设计任务的结果；每个模型至少尝试</text><text x="396.50" y="592.93" font-size="9.00" class="sc-loraregular">7</text><text x="403.02" y="592.93" font-size="9.00" class="sc-notoserifcjksc">次。每个点表示一次尝试；水平线</text><text x="72.00" y="604.63" font-size="9.00" class="sc-notoserifcjksc">表示平均值。图中的阴影带标示人类表现的各百分位。</text><text x="288.00" y="604.63" font-size="9.00" class="sc-notoserifcjkscbold">上：</text><text x="306.00" y="604.63" font-size="9.00" class="sc-notoserifcjksc">设计分数（最佳）与设计分数（中位数）分别对最佳设计序</text><text x="72.00" y="616.33" font-size="9.00" class="sc-notoserifcjksc">列和典型设计序列评分。</text><text x="171.00" y="616.33" font-size="9.00" class="sc-notoserifcjkscbold">中：</text><text x="189.00" y="616.33" font-size="9.00" class="sc-notoserifcjksc">预测分数（全部）和预测分数（最佳）分别为全部序列和最佳序列中，模型预测活性与实</text><text x="72.00" y="628.03" font-size="9.00" class="sc-notoserifcjksc">测活性之间的秩相关。</text><text x="162.00" y="628.03" font-size="9.00" class="sc-notoserifcjkscbold">下：</text><text x="180.00" y="628.03" font-size="9.00" class="sc-notoserifcjksc">预测分数与设计分数的相互关系图。每个十字线以平均值为中心，覆盖完整数据范围。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p016.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 16 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">16</text><text x="72.00" y="591.99" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">[</text><text x="75.47" y="591.99" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">图</text><text x="86.84" y="591.99" font-size="9.00" class="sc-lorabold sc-k" fill="#1d1d1f">2.2.3.1.B]</text><text x="124.89" y="591.99" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">黑盒</text><text x="145.26" y="591.99" font-size="9.00" class="sc-lorabold sc-k" fill="#1d1d1f">RNA</text><text x="166.63" y="591.99" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">序列设计：提供先前报告。</text><text x="274.63" y="591.99" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">任务和指标与上一图相同。每个模型显示两次：未提供先前报告</text><text x="72.00" y="603.69" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">（圆点），以及在上下文中提供先前报告（三角形，</text><text x="279.00" y="603.69" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">“+</text><text x="289.74" y="603.69" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">先验信息</text><text x="325.74" y="603.69" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">”</text><text x="328.88" y="603.69" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">）。每个模型至少尝试</text><text x="421.24" y="603.69" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">7</text><text x="427.76" y="603.69" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次；水平线表示各次尝试的</text><text x="72.00" y="615.39" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">平均值。此处省略人类基线；</text><text x="189.00" y="615.39" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">“</text><text x="192.60" y="615.39" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">有先验信息</text><text x="237.60" y="615.39" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">”</text><text x="240.74" y="615.39" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">条件无法与人类参与者直接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p017.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 17 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">17</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold sc-k">2.2.3.2 AAV</text><text x="131.11" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在该任务上，</text><text x="138.00" y="114.99" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="226.51" y="114.99" font-size="11.00" class="sc-notoserifcjksc">的表现波动很大。在各条件下，它的表现均弱于</text><text x="460.40" y="114.99" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="496.25" y="114.99" font-size="11.00" class="sc-notoserifcjksc">，更接近</text><text x="72.00" y="130.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="155.35" y="130.61" font-size="11.00" class="sc-notoserifcjksc">。在评估最后两种信息更充分的条件下，它的表现优于</text><text x="422.24" y="130.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="467.30" y="130.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="464.58" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">[</text><text x="75.47" y="464.58" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 120.20 123.67 126.04 132.26 137.57" y="464.58" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">2.2.3.2.A] AAV</text><text x="146.31" y="464.58" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">衣壳包装预测。</text><text x="209.31" y="464.58" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">AAV</text><text x="228.89" y="464.58" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">衣壳评估的任务</text><text x="294.26" y="464.58" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">1</text><text x="297.53" y="464.58" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">：模型按包装率对衣壳变体进行分类，以</text><text x="461.90" y="464.58" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">AUROC</text><text x="495.59" y="464.58" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">评分。</text><text x="522.59" y="464.58" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">5</text><text x="529.86" y="464.58" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">种</text><text x="72.00" y="476.28" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">条件的区别在于提供给模型的训练语料，以及是否可将</text><text x="290.37" y="476.28" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">ESM-2</text><text x="320.50" y="476.28" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">蛋白质语言模型（</text><text x="392.50" y="476.28" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">protein language model</text><text x="491.44" y="476.28" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">）作为工具</text><text x="72.00" y="487.98" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">使用。箱线图展示每个模型在每种条件下</text><text x="236.37" y="487.98" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">8</text><text x="243.79" y="487.98" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次独立尝试的分布；点表示各次运行。虚线标示直接应用</text><text x="471.16" y="487.98" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">ESM-2</text><text x="501.29" y="487.98" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">的参考基</text><text x="72.00" y="499.68" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">线。该任务没有可用的人类参与者基线。</text><text x="72.00" y="559.57" font-size="11.00" class="sc-lorabold sc-k">2.2.3.3 AAV</text><text x="131.41" y="559.57" font-size="11.00" class="sc-notoserifcjkscbold">包装率自主研究评估</text><text x="72.00" y="591.95" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="160.51" y="591.95" font-size="11.00" class="sc-notoserifcjksc">的初始表现很强，但随着打分器调用次数增加，没有显著改善，这表明它在连</text><text x="72.00" y="607.57" font-size="11.00" class="sc-notoserifcjksc">贯执行长程生物学研究任务的能力上存在不足。任务结束时，它的表现略高于</text><text x="448.89" y="607.57" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="623.19" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="623.19" font-size="11.00" class="sc-notoserifcjksc">，但远低于</text><text x="135.89" y="623.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="210.03" y="623.19" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p018.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 18 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">18</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.81 114.90 120.44 123.91 126.28 132.51 137.82" y="367.93" font-size="9.00" class="sc-lorabold">2.2.3.3.A] AAV</text><text x="146.56" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">包装率预测自主研究</text><text x="227.56" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="236.56" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">左：</text><text x="254.56" y="367.93" font-size="9.00" class="sc-notoserifcjksc">趋势线描述各次尝试（</text><text x="344.56" y="367.93" font-size="9.00" class="sc-loraregular">n = 48</text><text x="369.46" y="367.93" font-size="9.00" class="sc-notoserifcjksc">）在验证集上表现的第</text><text x="461.83" y="367.93" font-size="9.00" class="sc-loraregular">90</text><text x="474.98" y="367.93" font-size="9.00" class="sc-notoserifcjksc">百分位。我们发</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">现，能力更强的模型仅用少量打分器调用便迅速改进。直接应用</text><text x="326.37" y="379.63" font-size="9.00" class="sc-loraregular sc-k">ESM-2</text><text x="356.50" y="379.63" font-size="9.00" class="sc-notoserifcjksc">的斯皮尔曼相关系数为</text><text x="448.87" y="379.63" font-size="9.00" class="sc-loraregular sc-k">0.28</text><text x="466.42" y="379.63" font-size="9.00" class="sc-notoserifcjksc">（为保留趋势线的</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">动态范围，未在图中显示）。</text><text x="189.00" y="391.33" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="198.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">：会话过程中超过</text><text x="272.37" y="391.33" font-size="9.00" class="sc-loraregular sc-k">0.52</text><text x="292.13" y="391.33" font-size="9.00" class="sc-notoserifcjksc">阈值的尝试的累计比例。</text><text x="72.00" y="451.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="105.37" y="451.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="483.15" font-size="11.00" class="sc-notoserifcjksc">我们估计，</text><text x="127.00" y="483.15" font-size="11.00" class="sc-loraregular sc-k">Claude Haiku 5.5</text><text x="215.51" y="483.15" font-size="11.00" class="sc-notoserifcjksc">的能力较</text><text x="262.40" y="483.15" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="348.64" y="483.15" font-size="11.00" class="sc-notoserifcjksc">有所提高，但仍低于</text><text x="450.53" y="483.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="524.67" y="483.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="498.77" font-size="11.00" class="sc-notoserifcjksc">且远低于</text><text x="118.89" y="498.77" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="210.95" y="498.77" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="221.95" y="498.77" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="278.60" y="498.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="292.49" y="498.77" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="337.05" y="498.77" font-size="11.00" class="sc-notoserifcjksc">。尤其是，它在完成复杂迭代任务所需的</text><text x="72.00" y="514.39" font-size="11.00" class="sc-notoserifcjksc">推理方面表现出相对不足，例如</text><text x="228.89" y="514.39" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="252.82" y="514.39" font-size="11.00" class="sc-notoserifcjksc">自主研究任务和</text><text x="332.71" y="514.39" font-size="11.00" class="sc-loraregular">RNA</text><text x="357.78" y="514.39" font-size="11.00" class="sc-notoserifcjksc">序列设计子任务。</text><text x="72.00" y="580.30" font-size="11.00" class="sc-notoserifcjksc">我们判断，这些不足限制了模型替代稀缺人类专业知识与战略判断的有效性，而开展支持新型生</text><text x="72.00" y="595.92" font-size="11.00" class="sc-notoserifcjksc">物武器开发的那类复杂、开放式且难以验证的研究，需要这两者。因此，我们在发布</text><text x="481.89" y="595.92" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="72.00" y="611.54" font-size="11.00" class="sc-notoserifcjksc">时采用与</text><text x="118.89" y="611.54" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="166.84" y="611.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="180.74" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="219.48" y="611.54" font-size="11.00" class="sc-notoserifcjksc">相同的安全防护措施，而不是</text><text x="365.37" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="412.81" y="611.54" font-size="11.00" class="sc-notoserifcjksc">使用的覆盖范围更广的两</text><text x="72.00" y="627.16" font-size="11.00" class="sc-notoserifcjksc">用生物学研究分类器。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p019.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 19 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">19</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">2.3 AI</text><text x="112.64" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">研发</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自主性评估</text><text x="72.00" y="149.19" font-size="11.00" class="sc-notoserifcjksc">我们的自主性评估源于</text><text x="184.89" y="149.19" font-size="11.00" class="sc-loraregular">RSP</text><text x="207.60" y="149.19" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="108.00" y="181.57" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="181.57" font-size="11.00" class="sc-lorabold">1</text><text x="192.36" y="181.57" font-size="11.00" class="sc-notoserifcjkscbold">：高风险情境中的未对齐</text><text x="316.25" y="181.57" font-size="11.00" class="sc-lorabold">AI</text><text x="330.75" y="181.57" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="363.75" y="181.57" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="509.64" y="181.57" font-size="11.00" class="sc-loraregular">AI</text><text x="523.11" y="181.57" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="108.00" y="197.19" font-size="11.00" class="sc-notoserifcjksc">统：它们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运行能</text><text x="108.00" y="212.81" font-size="11.00" class="sc-notoserifcjksc">力和使用隐蔽手段的能力，以至于这些系统有可能（如果被导向这一目标，无论是有意还</text><text x="108.00" y="228.43" font-size="11.00" class="sc-notoserifcjksc">是无意）实施蓄意破坏，从而不可逆转地、大幅提高日后发生全球性灾难的概率。</text><text x="108.00" y="278.72" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="278.72" font-size="11.00" class="sc-lorabold">2</text><text x="193.76" y="278.72" font-size="11.00" class="sc-notoserifcjkscbold">：关键领域中自动化研发带来的风险。</text><text x="380.76" y="278.72" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="526.65" y="278.72" font-size="11.00" class="sc-loraregular">AI</text><text x="108.00" y="294.34" font-size="11.00" class="sc-notoserifcjksc">系统：它们能够完全自动化或以其他方式极大加速大型顶尖人类研究团队的工作，而所涉</text><text x="108.00" y="309.96" font-size="11.00" class="sc-notoserifcjksc">领域的快速进展可能对国际安全构成威胁，或迅速打破全球力量平衡。此类领域的例子包</text><text x="108.00" y="325.58" font-size="11.00" class="sc-notoserifcjksc">括能源、机器人、武器研发以及</text><text x="264.89" y="325.58" font-size="11.00" class="sc-loraregular">AI</text><text x="278.36" y="325.58" font-size="11.00" class="sc-notoserifcjksc">本身。</text><text x="72.00" y="392.07" font-size="11.00" class="sc-lorabold sc-k">2.3.1.1 Haiku 5.5</text><text x="155.20" y="392.07" font-size="11.00" class="sc-notoserifcjkscbold">如何影响或改变我们最近一份风险报告中的分析</text><text x="72.00" y="424.45" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是：</text><text x="108.00" y="456.83" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="456.83" font-size="11.00" class="sc-lorabold">1</text><text x="195.25" y="456.83" font-size="11.00" class="sc-notoserifcjkscbold">适用于</text><text x="231.14" y="456.83" font-size="11.00" class="sc-lorabold sc-k">Claude Haiku 5.5</text><text x="318.85" y="456.83" font-size="11.00" class="sc-notoserifcjksc">，正如它适用于我们之前的许多</text><text x="475.74" y="456.83" font-size="11.00" class="sc-loraregular">AI</text><text x="489.21" y="456.83" font-size="11.00" class="sc-notoserifcjksc">模型。我</text><text x="108.00" y="472.45" font-size="11.00" class="sc-notoserifcjksc">们将在第</text><text x="154.89" y="472.45" font-size="11.00" class="sc-loraregular">2.4</text><text x="172.36" y="472.45" font-size="11.00" class="sc-notoserifcjksc">节中讨论，为何我们认为该威胁模型下的风险水平仍维持在我们的</text><text x="494.25" y="472.45" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="522.07" y="472.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="108.00" y="488.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="117.07" y="488.07" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="172.07" y="488.07" font-size="11.00" class="sc-notoserifcjksc">所评定的</text><text x="216.07" y="488.07" font-size="11.00" class="sc-loraregular">“</text><text x="220.48" y="488.07" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="231.48" y="488.07" font-size="11.00" class="sc-loraregular">”</text><text x="235.31" y="488.07" font-size="11.00" class="sc-notoserifcjksc">水平。</text><text x="108.00" y="505.41" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="505.41" font-size="11.00" class="sc-lorabold">2</text><text x="196.65" y="505.41" font-size="11.00" class="sc-notoserifcjkscbold">不适用于</text><text x="243.54" y="505.41" font-size="11.00" class="sc-lorabold sc-k">Haiku 5.5</text><text x="292.32" y="505.41" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="303.32" y="505.41" font-size="11.00" class="sc-notoserifcjksc">我们发现，总体而言，在与</text><text x="438.21" y="505.41" font-size="11.00" class="sc-loraregular">AI</text><text x="451.67" y="505.41" font-size="11.00" class="sc-notoserifcjksc">研发相关的多种任</text><text x="108.00" y="521.03" font-size="11.00" class="sc-notoserifcjksc">务上，</text><text x="141.00" y="521.03" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="191.21" y="521.03" font-size="11.00" class="sc-notoserifcjksc">的能力远低于</text><text x="260.11" y="521.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="342.95" y="521.03" font-size="11.00" class="sc-notoserifcjksc">。因此，我们关于</text><text x="433.84" y="521.03" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="481.29" y="521.03" font-size="11.00" class="sc-notoserifcjksc">未达到该能</text><text x="108.00" y="536.65" font-size="11.00" class="sc-notoserifcjksc">力阈值的结论（见</text><text x="198.89" y="536.65" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="284.63" y="536.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="317.63" y="536.65" font-size="11.00" class="sc-notoserifcjksc">中的讨论）同样适用于</text><text x="430.52" y="536.65" font-size="11.00" class="sc-loraregular sc-k">Haiku 5.5</text><text x="477.84" y="536.65" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="602.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.2 AECI</text><text x="137.48" y="602.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00" y="628.79" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="628.79" font-size="11.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="190.94" y="628.79" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="201.94" y="628.79" font-size="11.00" class="sc-loraregular">AECI</text><text x="227.04" y="628.79" font-size="11.00" class="sc-notoserifcjksc">）追踪我们模型的能力随时间提升的速度；</text><text x="436.04" y="628.79" font-size="11.00" class="sc-loraregular">AECI</text><text x="464.04" y="628.79" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="477.93" y="628.79" font-size="11.00" class="sc-loraregular sc-k">Epoch AI</text><text x="526.50" y="628.79" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="644.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Epoch Capabilities Index</text><text x="201.24" y="644.41" font-size="11.00" class="sc-notoserifcjksc">的一个分支版本。有关我们方法的更多细节，请参见</text><text x="457.13" y="644.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="495.42" y="644.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos</text><text x="72.00" y="660.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Preview</text><text x="115.53" y="660.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="148.53" y="660.03" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="162.42" y="660.03" font-size="11.00" class="sc-loraregular sc-k">2.3.6</text><text x="189.01" y="660.03" font-size="11.00" class="sc-notoserifcjksc">节；有关我们更新后的误差线计算方法，请参见</text><text x="422.90" y="660.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="508.63" y="660.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统</text><text x="72.00" y="675.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00" y="675.65" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="96.89" y="675.65" font-size="11.00" class="sc-loraregular">2.3.5</text><text x="123.23" y="675.65" font-size="11.00" class="sc-notoserifcjksc">节。</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="494.25" y="463.65" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="494.25" y="463.65" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="519.18" y="463.65" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="522.07" y="463.65" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="533.07" y="463.65" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="108.00" y="479.27" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopene
