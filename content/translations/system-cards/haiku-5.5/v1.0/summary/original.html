<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00 88.00 104.00 120.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00 83.00 94.00 105.00 116.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡（</text><text x="127.00 133.18 138.99 144.08 148.34 154.30 164.14 167.03 174.72 180.39 185.08" y="116.21" font-size="11.00" class="sc-loraregular">System Card</text><text x="191.66 202.66 213.66" y="116.21" font-size="11.00" class="sc-notoserifcjksc">）介绍</text><text x="227.55 235.24 238.23 243.84 250.41 256.99 262.95 265.84 274.33 280.01 283.10 289.01 295.58 298.47 304.46 307.17" y="116.21" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="313.16 324.16 335.16" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="349.06 355.94 362.52 366.78 373.37 378.05 384.49 391.05 394.15" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="402.89 413.89 424.89" y="116.21" font-size="11.00" class="sc-notoserifcjksc">最新的</text><text x="438.78 447.28 452.95 456.04 461.95" y="116.21" font-size="11.00" class="sc-loraregular">Haiku</text><text x="471.41 482.41 493.41 504.41 515.41 526.41" y="116.21" font-size="11.00" class="sc-notoserifcjksc">级大语言模型</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 85.99 91.67 96.38 102.40 108.37 111.26 114.25 119.93 126.60 132.69 139.25 144.93 150.96 156.92 159.81 169.65 176.08 182.66 188.62" y="131.83" font-size="11.00" class="sc-loraregular">large language model</text><text x="191.61 202.61 213.61 224.61 235.61 246.61 257.61 268.61 279.61 290.61 301.61 312.61 323.61 334.61 345.61 356.61 367.61 378.61 389.61 400.61 411.61 422.61 433.61 444.61 455.61 466.61 477.61 488.61" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）。我们展示了一系列广泛的部署前评估结果，这些结果表明，</text><text x="499.61 507.30 510.30 515.91 522.47 529.05" y="131.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="147.45" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21 133.21 144.21 155.21 166.21 177.21 188.21 199.21 210.21 221.21 232.21 243.21 254.21 265.21" y="147.45" font-size="11.00" class="sc-notoserifcjksc">在许多领域显著优于其前代模型</text><text x="279.11 286.80 289.79 295.40 301.97 308.54 314.51 317.40 325.89 331.57 334.66 340.57 347.13 350.03 355.99 358.69" y="147.45" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="364.69 375.69 386.69 397.69 408.69 419.69 430.69 441.69 452.69" y="147.45" font-size="11.00" class="sc-notoserifcjksc">。在少数方面，它与</text><text x="466.58 474.27 477.26 482.87 489.44 496.02 501.98 504.87 511.11 517.54 524.22 530.90 536.78" y="147.45" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00 78.00 80.70" y="163.07" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59 133.59 144.59 155.59 166.59 177.59 188.59 199.59 210.59" y="163.07" font-size="11.00" class="sc-notoserifcjksc">不相上下，甚至有所超越。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">我们从多个方面精简了本系统卡的内容，以便将部署前测试更好地集中于深入调查我们前沿模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">的能力。具体而言：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="261.94" font-size="11.00" class="sc-notoserifcjksc">对于需要投入大量人力时间才能获得可信结果的部分评估，如果它们对某一节的主要结论</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="277.56" font-size="11.00" class="sc-notoserifcjksc">并不关键，我们便予以省略。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="294.32" font-size="11.00" class="sc-notoserifcjksc">我们侧重于呈现评估的数值结果，而以较少篇幅对这些评估或其结果进行文字分析，尤其</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="309.94" font-size="11.00" class="sc-notoserifcjksc">是在我们已在之前的系统卡中解释过相关评估的情况下。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.28" font-size="11.00" class="sc-notoserifcjksc">因此，本系统卡比以往的部分系统卡略短。我们预计今后非前沿模型的系统卡也会作类似精简，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="390.90" font-size="11.00" class="sc-notoserifcjksc">除非某个模型具有值得深入阐述的显著特性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="440.05" font-size="11.00" class="sc-notoserifcjksc">下面我们总结本系统卡的主要发现。</text><text x="72.00 83.00 94.00" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们的</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">负责任扩展政策（</text><text x="193.00 200.39 206.31 211.65 218.26 224.48 231.50 236.84 240.43 246.69 250.12 256.04 258.93 265.51 271.21 276.97 280.41 284.00 291.02 297.15 300.04 306.88 313.07 316.50 320.09 325.79" y="472.43" font-size="11.00" class="sc-lorabold" fill="#121212">Responsible Scaling Policy</text><text x="331.85" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">，</text><text x="342.85 350.40 356.98" y="472.43" font-size="11.00" class="sc-lorabold" fill="#121212">RSP</text><text x="364.01 375.01 386.01" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">）评估</text><text x="397.01 408.01 419.01" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">发现，</text><text x="430.01 437.70 440.69 446.30 452.86 459.44 465.40 468.30 476.79 482.46 485.56 491.46 498.03 500.92 506.92 509.62" y="472.43" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 5.5</text><text x="518.51 529.51" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在各</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">领域的能力总体上弱于</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04" y="488.05" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Opus 5</text><text x="259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，且未跨越任何新的</text><text x="360.93 367.83 374.07" y="488.05" font-size="11.00" class="sc-loraregular" fill="#121212">RSP</text><text x="383.63 394.63 405.63 416.63 427.63 438.63 449.63 460.63 471.63 482.63" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">阈值。我们评估认为，</text><text x="493.63 502.12 507.80 510.89 516.80 523.36 526.26 532.25 534.96" y="488.05" font-size="11.00" class="sc-loraregular" fill="#121212">Haiku 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">带来的未对齐（</text><text x="149.00 158.83 161.93 167.02 172.69 175.69 178.78 184.86 191.54 201.37 207.33 213.91" y="503.67" font-size="11.00" class="sc-loraregular" fill="#121212">misalignment</text><text x="218.17 229.17 240.17 251.17 262.17 273.17 284.17 295.17 306.17 317.17 328.17 339.17 350.17 361.17 372.17 383.17 394.17 405.17 416.17 427.17 438.17 449.17 460.17 471.17 482.17 493.17 504.17 515.17 526.17" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）风险较低，因为在推理过程可见的隐蔽能力评估中，它难以控制</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="519.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">自己的思维链（</text><text x="149.00 154.85 161.44 167.12 170.21 176.89 179.78 186.16 189.88 192.77 197.03 203.62 210.05 216.62 222.96 229.45" y="519.29" font-size="11.00" class="sc-loraregular" fill="#121212">chain of thought</text><text x="233.71 244.71 255.71 266.71 277.71 288.71 299.71 310.71 321.71 332.71 343.71" y="519.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">），也难以规避监控器。</text><text x="72.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="83.00 94.00 105.00 116.00 127.00 138.00" y="569.59" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估</text><text x="149.00 160.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 217.78 223.46 226.55 232.46 239.02 241.92 247.91 250.62" y="569.59" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="259.51 270.51 281.51 292.51" y="569.59" font-size="11.00" class="sc-notoserifcjksc">显著优于</text><text x="306.40 314.09 317.08 322.69 329.26 335.84 341.80 344.69 353.18 358.86 361.95 367.86 374.42 377.32 383.28 385.98" y="569.59" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="391.98 402.98 413.98 424.98" y="569.59" font-size="11.00" class="sc-notoserifcjksc">，但不及</text><text x="438.87 446.56 449.55 455.16 461.73 468.31 474.27 477.16 485.90 492.46 499.03 504.12 507.02 513.01 515.72" y="569.59" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="521.71" y="569.59" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="585.21" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="191.85 199.53 202.53 208.14 214.70 221.28 227.24 230.14 238.87 245.44 252.00 257.10 259.99" y="585.21" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="268.88 279.88 290.88 301.88 312.88 323.88 334.88 345.88 356.88 367.88 378.88 389.88 400.88 411.88 422.88 433.88 444.88 455.88 466.88 477.88 488.88 499.88 510.88 521.88" y="585.21" font-size="11.00" class="sc-notoserifcjksc">所取得的结果。鉴于其缺乏高级网络安全能力，我们为</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="600.83" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51 380.51 391.51 402.51 413.51 424.51 435.51 446.51 457.51 468.51 479.51 490.51 501.51 512.51 523.51" y="600.83" font-size="11.00" class="sc-notoserifcjksc">设置的网络安全防护措施所触发的活动范围明显小于其他近期发布模型的相应</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="616.45" font-size="11.00" class="sc-notoserifcjksc">措施。这些安全防护措施针对的是特定的有害及潜在有害活动。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="666.74" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 5.5</text><text x="160.51" y="666.74" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在</text><text x="171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51" y="666.74" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">安全防护与无害性</text><text x="259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51" y="666.74" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">方面的表现大体与</text><text x="350.40 358.09 361.08 366.69 373.26 379.83 385.80 388.69 397.18 402.86 405.95 411.86 418.42 421.32 427.28 429.98" y="666.74" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 4.5</text><text x="438.87 449.87 460.87 471.87 482.87 493.87 504.87 515.87 526.87" y="666.74" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相当或更好，在追踪</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="682.36" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">与监视等多轮场景以及政治公允性方面有所改进。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00 83.00 94.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们的</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">智能体安全评估</text><text x="182.00 193.00 204.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">发现，</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 261.78 267.46 270.55 276.46 283.02 285.92 291.91 294.62" y="82.61" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 5.5</text><text x="303.51 314.51 325.51 336.51 347.51 358.51 369.51 380.51 391.51 402.51 413.51 424.51" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">是迄今为止对提示词注入（</text><text x="435.51 442.07 446.76 453.19 463.03 469.60 473.85 476.74 479.84 486.46 489.33 495.24 501.03 505.29 508.38 514.82" y="82.61" font-size="11.00" class="sc-loraregular" fill="#121212">prompt injection</text><text x="521.49" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">最具鲁棒性的</text><text x="140.89 149.39 155.06 158.15 164.06" y="98.23" font-size="11.00" class="sc-loraregular" fill="#121212">Haiku</text><text x="173.52 184.52 195.52 206.52 217.52 228.52 239.52 250.52 261.52 272.52 283.52 294.52 305.52 316.52" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">级模型，在编程和计算机使用（</text><text x="327.52 333.32 339.75 349.59 356.15 362.72 366.98 372.94 377.70 380.59 387.16 392.25" y="98.23" font-size="11.00" class="sc-loraregular" fill="#121212">computer use</text><text x="398.22 409.22 420.22 431.22 442.22 453.22 464.22 475.22 486.22 497.22 508.22 519.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）环境中面对自适应攻击者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">时，其鲁棒性与我们的前沿模型大致相当。它在计算机使用环境中对有害任务的拒绝率高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="129.47" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Sonnet 5.5</text><text x="166.94" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="180.83 188.52 191.51 197.12 203.69 210.27 216.23 219.12 227.86 234.43 240.99 246.09 248.98 254.97 257.68" y="129.47" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Opus 5.5</text><text x="263.67 274.67 285.67" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，且较</text><text x="299.57 307.26 310.25 315.86 322.43 329.00 334.97 337.86 346.35 352.03 355.12 361.02 367.59 370.48 376.45 379.15" y="129.47" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 4.5</text><text x="388.04 399.04 410.04 421.04 432.04 443.04" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">有大幅提升。</text><text x="72.00 83.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们</text><text x="94.00 105.00 116.00 127.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">对齐评估</text><text x="138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的结果表明，在我们报告的大多数指标上，</text><text x="347.00 354.69 357.68 363.29 369.86 376.44 382.40 385.29 393.78 399.46 402.55 408.46 415.02 417.92 423.91 426.62" y="179.76" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 5.5</text><text x="435.51 446.51 457.51 468.51 479.51" y="179.76" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">优于或持平</text><text x="493.40 501.09 504.08 509.69 516.26 522.84" y="179.76" font-size="11.00" class="sc-loraregular" fill="#121212">Claude</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.59 113.29" y="195.38" font-size="11.00" class="sc-loraregular" fill="#121212">Haiku 4.5</text><text x="119.29 130.29" y="195.38" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，但</text><text x="144.18 151.87 154.86 160.47 167.04 173.62 179.58 182.47 191.21 197.77 204.34 209.43 212.33 218.32 221.03" y="195.38" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Opus 5.5</text><text x="229.92 240.92 251.92 262.92 273.92 284.92 295.92 306.92 317.92 328.92 339.92 350.92 361.92 372.92 383.92 394.92 405.92 416.92 427.92 438.92 449.92 460.92 471.92 482.92 493.92 504.92 515.92 526.92" y="195.38" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">总体上仍更强。它在压力下的诚实性至少与我们测试的其他所有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型相当，而在隐蔽蓄意破坏方面则远弱于我们的更大模型。另一方面，在我们的自动化行为审</text><text x="72.00 83.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">计（</text><text x="94.00 99.61 106.18 110.43 116.87 126.70 132.30 136.56 142.47 149.04 151.94 158.34 164.30 170.89 176.43 181.99 185.08 191.51 196.20 201.88 204.87 207.76 213.37 219.94 226.52 229.78" y="226.62" font-size="11.00" class="sc-loraregular" fill="#121212">automated behavioral audit</text><text x="234.04 245.04 256.04 267.04 278.04 289.04 300.04 311.04 322.04 333.04" y="226.62" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）中，它的过度拒绝（</text><text x="344.04 350.42 355.92 361.88 366.56 371.94 376.62 382.58 386.30 392.87 397.96 403.64" y="226.62" font-size="11.00" class="sc-loraregular" fill="#121212">over-refusal</text><text x="406.63 417.63 428.63 439.63 450.63 461.63 472.63 483.63 494.63 505.63 516.63 527.63" y="226.62" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）多于我们测试的任何其他</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型；并且与</text><text x="140.89 149.39 155.06 158.15 164.06 170.63 173.52 179.48 182.19" y="242.24" font-size="11.00" class="sc-loraregular" fill="#121212">Haiku 4.5</text><text x="191.07 202.07 213.07 224.07 235.07 246.07 257.08 268.08 279.08 290.08 301.08 312.08 323.08 334.08 345.08 356.08 367.08 378.08 389.08 400.08 411.08 422.08 433.08 444.08" y="242.24" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相比，它更常在不告知用户的情况下使用泄露的答案。</text><text x="72.00 83.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">针对</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.81 176.51" y="293.11" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 5.5</text><text x="185.40 196.40 207.40 218.40 229.40 240.40 251.40 262.40 273.40 284.40 295.40 306.40" y="293.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">所表述的观点与偏好开展的</text><text x="317.40 328.40" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">福祉</text><text x="339.40 350.40 361.40 372.40 383.40 394.40 405.40 416.40 427.40" y="293.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">调查发现，其情感（</text><text x="438.40 444.07 447.90 451.57 457.47 463.27" y="293.11" font-size="11.00" class="sc-loraregular" fill="#121212">affect</text><text x="467.53 478.53 489.53 500.53 511.53 522.53" y="293.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）大多为中性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">情感，与近期的</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="308.73" font-size="11.00" class="sc-loraregular" fill="#121212">Claude</text><text x="190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="308.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型大体相似，且它的自我批评程度低于大多数对比模型。它在后训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">中表达出的痛苦多于近期模型，但明显少于</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04" y="324.35" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Opus 5</text><text x="358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03" y="324.35" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。它的任务偏好与</text><text x="448.93 456.62 459.61 465.22 471.78 478.36 484.32 487.22 495.71 501.38 504.48 510.38 516.95 519.84 525.80 528.51" y="324.35" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 4.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">最为相似，包括对措辞温暖的任务的强烈偏好。</text><text x="72.00 83.00 94.00" y="390.26" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.68 160.35 163.44 169.35 175.92 178.81 184.81 187.51" y="390.26" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 5.5</text><text x="196.40 207.40" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">能力</text><text x="218.40 229.40 240.40 251.40 262.40 273.40 284.40 295.40 306.40 317.40 328.40 339.40 350.40 361.40 372.40 383.40 394.40 405.40 416.40 427.40 438.40 449.40 460.40 471.40 482.40 493.40 504.40 515.40" y="390.26" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的评估涵盖了广泛的评估项目，在这些评估中，该模型总体上较</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.88 151.58" y="405.88" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Haiku 4.5</text><text x="160.47 171.47 182.47 193.47 204.47 215.47 226.47 237.47 248.47 259.47 270.47 281.47 292.47 303.47 314.47 325.47 336.47 347.47 358.47" y="405.88" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">有大幅提升。但除少数例外，它通常未达到</text><text x="372.37 380.05 383.05 388.66 395.22 401.80 407.76 410.66 416.89 423.33 430.01 436.68 442.57 446.82 449.72 455.71 458.42" y="405.88" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Sonnet 5.5</text><text x="467.31 478.31 489.31 500.31" y="405.88" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的水平。</text></svg></div>
