="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="378.74" font-size="11.00" class="sc-notoserifcjksc">补丁依据阻断性功能标准（主要是留出的单元测试，外加范围与性能阻断项）和加权评分细则标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="394.36" font-size="11.00" class="sc-notoserifcjksc">准进行评分，其中包括针对所需测试覆盖范围和禁止的实现模式的、由模型评分的检查项。任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="409.98" font-size="11.00" class="sc-notoserifcjksc">由底层代码仓库的维护者编写，并经</text><text x="250.89 258.58 265.02 271.10 277.78 281.04 285.30 288.39 294.83" y="409.98" font-size="11.00" class="sc-loraregular">Cognition</text><text x="304.40 315.40 326.40 337.40 348.40 359.40 370.40 381.40 392.40 403.40 414.40 425.40 436.40 447.40 458.40 469.40 480.40 491.40 502.40 513.40 524.40" y="409.98" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审核，其中随机抽取的一部分由人</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="425.60" font-size="11.00" class="sc-notoserifcjksc">工解答，以验证公平性。我们报告总体得分，即阻断性功能标准与加权代码质量评分细则标准的</text><text x="72.00 83.00 94.00 105.00 116.00" y="441.22" font-size="11.00" class="sc-notoserifcjksc">综合得分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 2 " class="sc-notoserifcjksc">）不使用工具、仅依靠推理；（</text><text x="461.51" y="230.14" font-size="11.00" class="sc-loraregular">2</text><text x="467.42 478.42 489.42 500.42 511.42 522.42" y="230.14" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="245.76" font-size="11.00" class="sc-notoserifcjksc">索、网页抓取、程序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="437.89 444.49 451.09 457.69" y="245.76" font-size="11.00" class="sc-robotomonoregular" fill="#188038">auto</text><text x="464.30 475.30 486.30 497.30 508.30 519.30" y="245.76" font-size="11.00" class="sc-notoserifcjksc">，每次尝试的</text><text x="72.00 83.00 94.00 105.00 116.00" y="261.38" font-size="11.00" class="sc-notoserifcjksc">任务预算为</text><text x="129.89 136.25 142.43 149.26 155.17 158.06 162.32 168.76 174.59 180.55" y="261.38" font-size="11.00" class="sc-loraregular">980k token</text><text x="187.22 198.22 209.22 220.22 231.22 242.22 253.22 264.22 275.22 286.22 297.22 308.22 319.22 330.22 341.22" y="261.38" font-size="11.00" class="sc-notoserifcjksc">。这些结果未使用上下文压缩。由</text><text x="355.12 362.81 365.80 371.41 377.98 384.55 390.52 393.41 402.14 408.71 415.28 420.37 423.26 429.22 431.82" y="261.38" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="441.07 452.07 463.07 474.07 485.07 496.07 507.07" y="261.38" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="311.63" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具版本中出现结果污染，我们为搜索器和抓取器都屏蔽了已知讨论</text><text x="459.89 468.47 474.83" y="311.63" font-size="11.00" class="sc-loraregular">HLE</text><text x="484.57 495.57 506.57 517.57 528.57" y="311.63" font-size="11.00" class="sc-notoserifcjksc">的来源（见</text><text x="72.00 83.00" y="327.25" font-size="11.00" class="sc-notoserifcjksc">附录</text><text x="96.89 103.07 105.78" y="327.25" font-size="11.00" class="sc-loraregular">9.1</text><text x="109.79" y="327.25" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="120.79" y="327.25" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="131.79 142.79 153.79 164.79 175.79 186.79 197.79 208.79 219.79 230.79 241.79 252.79 263.79 274.79 285.79 296.79 307.79 318.79 329.79 340.79 351.79 362.79 373.79 384.79 395.79 406.79" y="327.25" font-size="11.00" class="sc-notoserifcjksc">我们还使用文本规则筛查每一份回答正确的对话记录，查找</text><text x="420.68 429.26 435.62" y="327.25" font-size="11.00" class="sc-loraregular">HLE</text><text x="445.35 456.35 467.35 478.35 489.35 500.35 511.35 522.35" y="327.25" font-size="11.00" class="sc-notoserifcjksc">特定来源的迹象，</text><text x="72.00 83.00 94.00" y="342.87" font-size="11.00" class="sc-notoserifcjksc">并使用</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04" y="342.87" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="184.93 195.93 206.93 217.93 228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="342.87" font-size="11.00" class="sc-notoserifcjksc">审查每一份被标记的对话记录。对于确认属于作弊的情况，我们将其重新</text><text x="72.00 83.00 94.00 105.00 116.00" y="358.49" font-size="11.00" class="sc-notoserifcjksc">评为错误。</text><text x="72.00" y="408.78" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89 94.64 100.40 104.00 110.53 117.33 120.22 126.24 128.80" y="408.78" font-size="11.00" class="sc-lorabold">Haiku 4.5</text><text x="137.64 148.64 159.64" y="408.78" font-size="11.00" class="sc-notoserifcjkscbold">的比较</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.88 151.58" y="434.98" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="160.47 171.47 182.47 193.47 204.47 215.47 226.47 237.47 248.47 259.47 270.47 281.47 292.47 303.47 314.47 325.47 336.47 347.47 358.47 369.47 380.47" y="434.98" font-size="11.00" class="sc-notoserifcjksc">没有推理强度设置，因此我们在多个扩展思考（</text><text x="391.47 397.38 403.21 407.47 413.43 420.11 426.68 432.59 439.17 442.06 446.32 452.91 456.00 462.68 468.58 471.67 478.35" y="434.98" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="484.43 495.43 506.43 517.43 528.43" y="434.98" font-size="11.00" class="sc-notoserifcjksc">）预算下运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="450.61" font-size="11.00" class="sc-notoserifcjksc">行了该评估。对于无工具版本，我们展示这些预算下的曲线；对于使用工具版本，我们只展示</text><text x="72.00 78.36 85.19 92.70 95.60 99.85 106.29 112.12 118.08" y="466.23" font-size="11.00" class="sc-loraregular">60K token</text><text x="127.65 138.65 149.65 160.65 171.65 182.65 193.65 204.65 215.65 226.65 237.65 248.65 259.65" y="466.23" font-size="11.00" class="sc-notoserifcjksc">预算下的结果（该预算接近其</text><text x="273.54 279.90 285.86" y="466.23" font-size="11.00" class="sc-loraregular">64K</text><text x="296.27 307.27 318.27 329.27 340.27 351.27 362.27 373.27 384.27 395.27 406.27 417.27 428.27 439.27 450.27 461.27 472.27 483.27 494.27 505.27 516.27 527.27" y="466.23" font-size="11.00" class="sc-notoserifcjksc">输出上限所允许的最大值），因为在这种多轮设置</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="481.85" font-size="11.00" class="sc-notoserifcjksc">中，不同的思考预算产生的结果相近。使用工具版本还采用了</text><text x="371.89 375.90 382.26 389.09 396.60 399.49 403.75 410.18 416.01 421.98" y="481.85" font-size="11.00" class="sc-loraregular">160K token</text><text x="431.55 442.55 453.55 464.55 475.55 486.55 497.55 508.55" y="481.85" font-size="11.00" class="sc-notoserifcjksc">的任务预算（而非</text><text x="72.00 78.36 84.54 91.37" y="497.46" font-size="11.00" class="sc-loraregular">980K</text><text x="98.88 109.88 120.88 131.88 142.88 153.88" y="497.46" font-size="11.00" class="sc-notoserifcjksc">），以适配其</text><text x="167.78 173.68 180.51 187.35" y="497.46" font-size="11.00" class="sc-loraregular">200K</text><text x="197.75 208.75 219.75 230.75 241.75 252.75 263.75" y="497.46" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="366.99" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>

c-notoserifcjksc">和</text><text x="284.18 289.29 294.55 300.02 305.48 310.29 313.78 316.14 321.05 323.26" y="402.13" font-size="9.00" class="sc-loraregular">Sonnet 5.5</text><text x="330.53 339.53 348.53 357.53 366.53 375.53 384.53 393.53 402.53 411.53 420.53 429.53" y="402.13" font-size="9.00" class="sc-notoserifcjksc">的成本假设缓存完全命中；</text><text x="438.53 445.48 450.13 452.66 457.49 462.86 465.23 470.11 472.32" y="402.13" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="479.59" y="402.13" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="490.96 495.86 498.08" y="402.13" font-size="9.00" class="sc-loraregular">5.5</text><text x="505.35 514.35 523.35" y="402.13" font-size="9.00" class="sc-notoserifcjksc">按记录</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">的用量以标准定价计算。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="475.37" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="475.37" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="475.37" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89 411.29" y="471.70" font-size="6.60" class="sc-loraregular">16</text><text x="415.10 426.10" y="475.37" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="440.00 446.55 452.51 457.28 463.84 466.84 472.74 478.57 481.84 486.12" y="475.37" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.82 505.82 516.82 527.82" y="475.37" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="490.99" font-size="11.00" class="sc-notoserifcjksc">度研究基准，评估模型在真实用户可能提出的复杂研究问题上的表现。</text><text x="413.00 421.09 428.53 435.36 443.05" y="490.99" font-size="11.00" class="sc-loraregular">DRACO</text><text x="454.68" y="490.99" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="468.57 472.58 479.41" y="490.99" font-size="11.00" class="sc-loraregular">100</text><text x="489.13 500.13 511.13 522.13" y="490.99" font-size="11.00" class="sc-notoserifcjksc">个精选任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="506.61" font-size="11.00" class="sc-notoserifcjksc">务组成，这些任务源自多个领域的用户查询。回答依据专家编写的评分细则进行评分，评分细则</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="522.23" font-size="11.00" class="sc-notoserifcjksc">涵盖事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="588.93" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="588.93" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12 465.12 476.12 487.12 498.12 509.12 520.12" y="588.93" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00 83.00 94.00 105.00" y="604.55" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="604.55" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18" y="604.55" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00 83.00 94.00 105.00" y="637.51" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="72.00 83.00" y="653.13" font-size="11.00" class="sc-notoserifcjksc">原始</text><text x="96.89 104.98 112.43 119.26 126.95" y="653.13" font-size="11.00" class="sc-loraregular">DRACO</text><text x="138.57 149.57 160.57 171.57" y="653.13" font-size="11.00" class="sc-notoserifcjksc">论文使用</text><text x="185.46 193.84 199.80 209.63 212.72 219.40 222.49 225.38 231.51 234.40 241.07 245.76" y="653.13" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="255.08 266.08 277.08 288.08 299.08 310.08 321.08 332.08 343.08 354.08 365.08 376.08 387.08 398.08 409.08 420.08 431.08 442.08 453.08 464.08 475.08 486.08 497.08" y="653.13" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型现已不可用。我们改用</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="668.75" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="155.06 166.06 177.06 188.06 199.06 210.06 221.06 232.06" y="668.75" font-size="11.00" class="sc-notoserifcjksc">，依据每个任务的</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="504.00 507.28 512.11" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评分细则对回答进行评分，同样采用二元的</text><text x="283.89 293.99 300.83 307.09 314.68 322.95 331.34 341.43 348.28" y="82.61" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="358.21 369.21 380.21 391.21 402.21 413.21 424.21 435.21 446.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">判定，并使用论文第</text><text x="460.10 466.06 468.77" y="82.61" font-size="11.00" class="sc-loraregular">4.2</text><text x="477.57 488.57 499.57 510.57 521.57" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节中的公式</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">将其汇总为归一化分数。我们遵循论文的方案，对每个回答进行五次独立的评分运行，并记录平</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">均值。我们的评判提示词取自论文的</text><text x="250.89 261.89" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="275.79 283.48 286.18" y="113.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="292.18 303.18 314.18 325.18 336.18" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="350.07" y="113.85" font-size="11.00" class="sc-loraregular">A</text><text x="359.85 370.85 381.85 392.85 403.85 414.85 425.85 436.85 447.85 458.85 469.85 480.85 491.85 502.85 513.85 524.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分</text><text x="72.00 83.00 94.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">数变动</text><text x="107.89 111.90" y="129.47" font-size="11.00" class="sc-loraregular">10</text><text x="121.62" y="129.47" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="135.51 141.42" y="129.47" font-size="11.00" class="sc-loraregular">25</text><text x="150.31 161.31 172.31 183.31 194.31 205.31 216.31 227.31 238.31 249.31 260.31 271.31 282.31 293.31 304.31 315.31 326.31 337.31 348.31 359.31 370.31 381.31 392.31 403.31 414.31 425.31 436.31 447.31 458.31 469.31 480.31 491.31 502.31 513.31" y="129.47" font-size="11.00" class="sc-notoserifcjksc">分，但系统排序保持不变，因此我们的分数与论文的主要公布数字不能直接比</text><text x="72.00 83.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们使用了自己的智能体运行框架（不使用附录</text><text x="305.89 313.58 316.29" y="195.95" font-size="11.00" class="sc-loraregular">C.4</text><text x="325.14 336.14 347.14 358.14 369.14 380.14 391.14" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的系统提示词（</text><text x="402.14 407.24 413.04 418.14 422.39 428.36 438.19 441.08 447.65 452.34 458.77 468.61 475.17" y="195.95" font-size="11.00" class="sc-loraregular">system prompt</text><text x="479.43 490.43 501.43 512.43 523.43" y="195.95" font-size="11.00" class="sc-notoserifcjksc">）；使用网</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">络搜索、网页抓取、程序化工具调用和代码执行，预算为</text><text x="349.89 356.25 362.43 369.26 375.17 378.06 382.32 388.76 394.59 400.55" y="211.57" font-size="11.00" class="sc-loraregular">980k token</text><text x="407.23 418.23 429.23 440.23 451.23 462.23 473.23 484.23 495.23 506.23 517.23 528.23" y="211.57" font-size="11.00" class="sc-notoserifcjksc">），并指示模型将最终报告</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">写入其执行环境中的一个文件。随后我们只对该文件的内容进行评分，而非完整的智能体对话记</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">录，从而将交付物与中间工具输出隔离开来。</text><text x="72.00" y="286.91" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89 94.64 100.40 104.00 110.53 117.33 120.22 126.24 128.80" y="286.91" font-size="11.00" class="sc-lorabold">Haiku 4.5</text><text x="137.64 148.64 159.64" y="286.91" font-size="11.00" class="sc-notoserifcjkscbold">的比较</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.88 151.58" y="313.11" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="160.47 171.47 182.47 193.47 204.47 215.47 226.47 237.47 248.47 259.47 270.47 281.47 292.47 303.47 314.47 325.47 336.47 347.47 358.47 369.47 380.47 391.47 402.47 413.47 424.47 435.47 446.47 457.47 468.47 479.47 490.47 501.47 512.47" y="313.11" font-size="11.00" class="sc-notoserifcjksc">没有推理强度设置，因此我们在多个扩展思考预算下运行了该评估，并展示</text><text x="72.00 78.36 85.19 92.70 95.60 99.85 106.29 112.12 118.08" y="328.73" font-size="11.00" class="sc-loraregular">60K token</text><text x="127.65 138.65 149.65 160.65 171.65 182.65 193.65 204.65 215.65 226.65 237.65 248.65" y="328.73" font-size="11.00" class="sc-notoserifcjksc">预算下的结果。它还采用了</text><text x="262.54 266.55 272.90 279.73 287.25 290.14 294.40 300.83 306.66 312.62" y="328.73" font-size="11.00" class="sc-loraregular">160K token</text><text x="322.20 333.20 344.20 355.20 366.20 377.20 388.20 399.20" y="328.73" font-size="11.00" class="sc-notoserifcjksc">的任务预算（而非</text><text x="413.09 419.45 425.63 432.46" y="328.73" font-size="11.00" class="sc-loraregular">980K</text><text x="439.97 450.97 461.97 472.97 483.97 494.97" y="328.73" font-size="11.00" class="sc-notoserifcjksc">），以适配其</text><text x="508.87 514.77 521.60 528.43" y="328.73" font-size="11.00" class="sc-loraregular">200K</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="344.35" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><text x="72.00" y="679.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="679.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.13 108.23 113.76 117.23 119.60 126.31 132.48 138.31 144.50" y="679.50" font-size="9.00" class="sc-lorabold">8.8.2.A] DRACO</text><text x="153.79 162.79" y="679.50" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="171.79 180.79 189.79 198.79 207.79 216.79 225.79 234.79 243.79 252.79 261.79 270.79 279.79 288.79 297.79 306.79 315.79 324.79 333.79 342.79 351.79" y="679.50" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下每任务平均成本的关系。在</text><text x="363.16 368.36 373.42 379.01" y="679.50" font-size="9.00" class="sc-loraregular">980k</text><text x="386.21 395.21 404.21 413.21 422.21 431.21 440.21 449.21 458.21 467.21 476.21 485.21" y="679.50" font-size="9.00" class="sc-notoserifcjksc">任务预算下，随推理强度从</text><text x="496.58 501.98 507.38" y="679.50" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="515.14 524.14" y="679.50" font-size="9.00" class="sc-notoserifcjksc">提升</text><text x="72.00" y="691.20" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="83.37 88.77 94.17" y="691.20" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="99.57" y="691.20" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="108.57 115.18 121.28 126.87 133.16" y="691.20" font-size="9.00" class="sc-loraregular">DRACO</text><text x="142.67 151.67 160.67 169.67 178.67 187.67 196.67 205.67 214.67 223.67 232.67 241.67 250.67 259.67 268.67 277.67 286.67 295.67 304.67 313.67 322.67 331.67 340.67" y="691.20" font-size="9.00" class="sc-notoserifcjksc">归一化分数与每任务平均成本（对数刻度）的关系。</text><text x="349.67 356.82 362.19 367.56 371.73 374.10 379.00 381.22" y="691.20" font-size="9.00" class="sc-loraregular">Opus 5.5</text><text x="388.49" y="691.20" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="399.85 404.96 410.22 415.69 421.15 425.96 429.45 431.81 436.72 438.93" y="691.20" font-size="9.00" class="sc-loraregular">Sonnet 5.5</text><text x="446.20 455.20 464.20 473.20 482.20 491.20 500.20 509.20 518.20 527.20" y="691.20" font-size="9.00" class="sc-notoserifcjksc">的成本假设缓存完全命</text><text x="72.00 81.00" y="702.90" font-size="9.00" class="sc-notoserifcjksc">中；</text><text x="90.00 96.95 101.59 104.12 108.95 114.33 116.69 121.57 123.79" y="702.90" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="131.06" y="702.90" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="142.42 147.33 149.54" y="702.90" font-size="9.00" class="sc-loraregular">5.5</text><text x="156.82 165.82 174.82 183.82" y="702.90" font-size="9.00" class="sc-notoserifcjksc">按记录的</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="250.89" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="250.89" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="261.89" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="261.89" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="272.89" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="275.79" y="105.05" width="16.39" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="72.00 80.29 83.42 91.71 94.85 102.57 105.95 118.93 127.99 137.36 146.57" y="127.45" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.8.3 WANDR</text><text x="504.00 507.28 512.11" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">用量以标准定价计算，不含网络搜索费用。</text><text x="243.00 249.29 251.74 256.33 261.70 267.08 271.96 274.33 281.28 285.92 288.45 293.28 298.66 301.02 305.90 308.12" y="80.05" font-size="9.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="315.39 324.39 333.39 342.39" y="80.05" font-size="9.00" class="sc-notoserifcjksc">显示的是</text><text x="353.75 358.96 364.55 370.69 373.06 376.54 381.81 386.58 391.46" y="80.05" font-size="9.00" class="sc-loraregular">60K token</text><text x="399.29 408.29 417.29 426.29 435.29 444.29 453.29" y="80.05" font-size="9.00" class="sc-notoserifcjksc">扩展思考预算、</text><text x="462.29 465.56 470.76 476.35" y="80.05" font-size="9.00" class="sc-loraregular">160K</text><text x="484.87 493.87 502.87 511.87 520.87 529.87" y="80.05" font-size="9.00" class="sc-notoserifcjksc">任务预算下的</text><text x="72.00 81.00 90.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">结果。</text><text x="72.00 82.46 89.35 97.73 105.81" y="151.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">WANDR</text><text x="112.72" y="151.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72 134.48 137.57 144.15 150.11 153.00 159.89 168.16 174.74 177.63 185.83 191.74 197.70 204.26 207.16 213.99 219.95 225.04 230.98 236.66 241.35 247.20" y="151.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="151.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="151.53" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68 285.23 291.20 295.96 302.53 305.52 311.43 317.26 320.52 324.80" y="151.53" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="333.50 344.50 355.50 366.50 377.50 388.50 399.50 410.50 421.50 432.50 443.50" y="151.53" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，旨在为</text><text x="457.40 465.48 472.93 479.76 487.45" y="151.53" font-size="11.00" class="sc-loraregular">DRACO</text><text x="499.08 510.08 521.08" y="151.53" font-size="11.00" class="sc-notoserifcjksc">深度研</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="167.15" font-size="11.00" class="sc-notoserifcjksc">究基准提供一个侧重广度搜索的对应基准。它包含</text><text x="316.89 322.89 329.72" y="167.15" font-size="11.00" class="sc-loraregular">500</text><text x="339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44" y="167.15" font-size="11.00" class="sc-notoserifcjksc">个任务，模型需要搜索数十到数百个实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="182.77" font-size="11.00" class="sc-notoserifcjksc">体，查找每个实体的相关事实，并在结构化记录中列出这些事实及其引用来源。我们运行了该评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="198.39" font-size="11.00" class="sc-notoserifcjksc">估的一个修改版本，并在下文说明方法上的差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.0
