e="11.00" class="sc-notoserifcjksc">）。示例包括修复</text><text x="388.71" y="316.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="437.81" y="316.26" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="462.71 473.22 479.18 485.52 491.76 498.19 504.04 509.87 515.76" y="316.26" font-size="11.00" class="sc-loraregular">WebSocket</text><text x="522.91" y="316.26" font-size="11.00" class="sc-notoserifcjksc">缺</text><text x="72.00" y="331.88" font-size="11.00" class="sc-notoserifcjksc">陷、加固</text><text x="118.89" y="331.88" font-size="11.00" class="sc-loraregular">Prisma</text><text x="156.91" y="331.88" font-size="11.00" class="sc-notoserifcjksc">的浏览器包，以及扩展</text><text x="269.80 273.90 280.14 288.78 297.16 300.05 305.15 311.00 317.59 323.55 333.38" y="331.88" font-size="11.00" class="sc-loraregular">JSON schema</text><text x="341.95" y="331.88" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="355.84 358.84 361.93 368.51" y="331.88" font-size="11.00" class="sc-loraregular">lint</text><text x="375.66" y="331.88" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务为智能体提供一个</text><text x="72.00" y="347.50" font-size="11.00" class="sc-notoserifcjksc">已检出的代码仓库、一份</text><text x="195.89" y="347.50" font-size="11.00" class="sc-loraregular">issue</text><text x="224.59" y="347.50" font-size="11.00" class="sc-notoserifcjksc">描述，以及该仓库的测试、</text><text x="356.59 359.58 362.68 369.25" y="347.50" font-size="11.00" class="sc-loraregular">lint</text><text x="376.40" y="347.50" font-size="11.00" class="sc-notoserifcjksc">和代码风格规范。智能体在可访问</text><text x="72.00" y="363.12" font-size="11.00" class="sc-notoserifcjksc">互联网的容器化环境中自主工作，以产出最终补丁，过程中没有人工干预，也不提供超时信息。</text><text x="72.00" y="378.74" font-size="11.00" class="sc-notoserifcjksc">补丁依据阻断性功能标准（主要是留出的单元测试，外加范围与性能阻断项）和加权评分细则标</text><text x="72.00" y="394.36" font-size="11.00" class="sc-notoserifcjksc">准进行评分，其中包括针对所需测试覆盖范围和禁止的实现模式的、由模型评分的检查项。任务</text><text x="72.00" y="409.98" font-size="11.00" class="sc-notoserifcjksc">由底层代码仓库的维护者编写，并经</text><text x="250.89 258.58 265.02 271.10 277.78 281.04 285.30 288.39 294.83" y="409.98" font-size="11.00" class="sc-loraregular">Cognition</text><text x="304.40" y="409.98" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审核，其中随机抽取的一部分由人</text><text x="72.00" y="425.60" font-size="11.00" class="sc-notoserifcjksc">工解答，以验证公平性。我们报告总体得分，即阻断性功能标准与加权代码质量评分细则标准的</text><text x="72.00" y="441.22" font-size="11.00" class="sc-notoserifcjksc">综合得分。</text><text x="72.00" y="519.66" font-size="11.00" class="sc-notoserifcjksc">该评估的目标是无需人工修改即可合并的代码</text><text x="294.89 301.47 304.56 308.39" y="519.66" font-size="11.00" class="sc-loraregular">diff</text><text x="312.11" y="519.66" font-size="11.00" class="sc-notoserifcjksc">。其评分会惩罚超出范围的修改，即使这些修</text><text x="72.00" y="535.28" font-size="11.00" class="sc-notoserifcjksc">改质量很高或有所帮助。我们报告</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.68 292.35 295.44 301.35 307.92 310.81 316.81 319.51" y="535.28" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="328.40" y="535.28" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上的得分，未对官方评估做任</text><text x="72.00" y="550.90" font-size="11.00" class="sc-notoserifcjksc">何改动。</text><text x="72.00" y="576.23" font-size="11.00" class="sc-notoserifcjksc">我们报告两个子集：</text><text x="171.00 177.84 183.67 187.93 193.89 200.57 207.15 213.05" y="576.23" font-size="11.00" class="sc-loraregular">Extended</text><text x="222.52" y="576.23" font-size="11.00" class="sc-notoserifcjksc">是全部</text><text x="258.42" y="576.23" font-size="11.00" class="sc-loraregular">150</text><text x="278.14" y="576.23" font-size="11.00" class="sc-notoserifcjksc">个任务，</text><text x="322.14" y="576.23" font-size="11.00" class="sc-loraregular">Main</text><text x="350.58" y="576.23" font-size="11.00" class="sc-notoserifcjksc">是其中最难的</text><text x="419.47" y="576.23" font-size="11.00" class="sc-loraregular">100</text><text x="440.03" y="576.23" font-size="11.00" class="sc-notoserifcjksc">个任务。每个得分均</text><text x="72.00" y="591.85" font-size="11.00" class="sc-notoserifcjksc">为每个任务五次运行的平均值。表</text><text x="239.89" y="591.85" font-size="11.00" class="sc-loraregular">8.1.A</text><text x="265.27" y="591.85" font-size="11.00" class="sc-notoserifcjksc">展示的是每个模型在</text><text x="367.16" y="591.85" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="389.86" y="591.85" font-size="11.00" class="sc-notoserifcjksc">推理强度下的结果；</text><text x="488.86 496.55 502.98 509.07 515.74 519.01 523.27 526.36 532.79" y="591.85" font-size="11.00" class="sc-loraregular">Cognition</text><text x="72.00" y="607.47" font-size="11.00" class="sc-notoserifcjksc">的公开排行榜展示的是每个模型在其表现最佳的推理强度下的结果，因此两者可能有所不同。</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">12</text><text x="80.04 87.49 92.91 98.98 104.51 107.03 109.66 116.15 118.61 121.13 123.76 129.11 132.98 135.61 140.77 143.49 145.95 148.58 151.63 157.00 163.14 168.51 173.96 177.01 179.47 182.10 187.77 197.72 203.74 208.63 214.85 220.27 226.34 231.66 237.65 240.28 246.34 250.60 256.45 258.95 261.58 268.57 273.73 279.80 282.43 288.69 292.04 294.67 299.83 305.31 310.73 316.71 320.58 325.21 327.84 332.47 338.32 341.00 346.00 351.42 354.05 356.77 362.62 368.69 374.22 379.11 385.10 390.95 395.28 398.09 403.12 408.97 415.04 417.67 422.30 428.10 431.60 435.64 443.55 448.71 452.97 458.39 461.02 466.44 472.51 478.28 481.09 487.16 492.53 497.95 502.28 505.09 511.16" y="678.20" font-size="10.00" class="sc-loraregular">Deng, X., et al. (2025). SWE-Bench Pro: Can AI agents solve long-horizon software engineering</text><text x="183.21 189.11 193.08 196.95 202.92 207.55 210.05 213.74 220.64 225.80 230.13 235.43 238.24 242.90 245.36 251.21 255.49 261.02 267.92 273.08 278.90 283.18 290.08 295.45 300.90 307.11 312.73 315.19 318.83 324.61 330.39 335.81" y="692.40" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2509.16941</text><text <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p115.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 115 页"><text x="72.00 80.93 84.30 93.35 96.99 104.88 113.51 118.89 133.43 137.12 146.20 155.69 159.38 167.57 176.38 185.01 194.10 202.49 211.57 215.21 224.26 227.64" y="88.10" font-size="14.00" class="sc-poppinsmedium">8.4 Terminal-Bench 4.0</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">115</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.65 166.19" y="110.76" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="175.92" y="110.76" font-size="11.00" class="sc-notoserifcjksc">在容器化的终端与命令行环境中，以真实世界工作测试模型。它包含</text><text x="508.81" y="110.76" font-size="11.00" class="sc-loraregular">66</text><text x="524.42" y="110.76" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="126.38" font-size="11.00" class="sc-notoserifcjksc">任务，侧重于与科学相关的问题和前沿工程问题，如计算生物学、物理仿真、</text><text x="446.00 453.58 460.46" y="126.38" font-size="11.00" class="sc-loraregular">CAD</text><text x="468.66" y="126.38" font-size="11.00" class="sc-notoserifcjksc">、形式化证明</text><text x="72.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="96.89" y="142.00" font-size="11.00" class="sc-loraregular">GPU</text><text x="123.10" y="142.00" font-size="11.00" class="sc-notoserifcjksc">性能相关工作。</text><text x="72.00" y="191.72" font-size="11.00" class="sc-notoserifcjksc">此前的</text><text x="107.89 114.39 120.36 125.12 134.95 138.04 144.72 150.40 153.39 158.77 165.61 171.57 178.25 184.10" y="191.72" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="193.58" y="191.72" font-size="11.00" class="sc-notoserifcjksc">版本</text><text x="215.58" y="191.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对超时和资源非常敏感</text><text x="325.58" y="191.72" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="336.58 342.55 345.09" y="191.72" font-size="11.00" class="sc-loraregular">4.0</text><text x="354.81" y="191.72" font-size="11.00" class="sc-notoserifcjksc">版本通过延长超时时间，并在少数可能</text><text x="72.00" y="207.34" font-size="11.00" class="sc-notoserifcjksc">从中受益的任务中自适应地提高</text><text x="228.89 236.34 243.23" y="207.34" font-size="11.00" class="sc-loraregular">RAM</text><text x="256.22" y="207.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="270.11" y="207.34" font-size="11.00" class="sc-loraregular">CPU</text><text x="292.74" y="207.34" font-size="11.00" class="sc-notoserifcjksc">，基本解决了这些问题。沙箱服务提供商在少数任</text><text x="72.00" y="222.96" font-size="11.00" class="sc-notoserifcjksc">务中仍可能是一个混杂因素，但我们预计其作用将比在之前版本中小得多。我们还发现，这次升</text><text x="72.00" y="238.58" font-size="11.00" class="sc-notoserifcjksc">级降低了各种运行框架（</text><text x="193.00" y="238.58" font-size="11.00" class="sc-loraregular">harness</text><text x="232.85" y="238.58" font-size="11.00" class="sc-notoserifcjksc">）带来的混杂效应（例如</text><text x="356.75" y="238.58" font-size="11.00" class="sc-loraregular">CLI</text><text x="377.37" y="238.58" font-size="11.00" class="sc-notoserifcjksc">内存占用、上下文压缩策略和容器</text><text x="72.00" y="254.20" font-size="11.00" class="sc-notoserifcjksc">通信协议），使</text><text x="151.89 158.39 164.36 169.12 178.95 182.04 188.72 194.40 197.39 202.77 209.61 215.57 222.25 228.10" y="254.20" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="237.58" y="254.20" font-size="11.00" class="sc-notoserifcjksc">成为一项更稳定、更严谨的评估。</text><text x="72.00" y="321.26" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 272.78 278.46 281.55 287.46 294.02 296.92 302.91 305.62" y="321.26" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="314.51" y="321.26" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="328.40 334.90 340.86 345.63 355.46 358.55 365.23 370.90 373.90 379.27 386.12 392.08 398.76 404.61 411.20 414.09 420.05 422.59" y="321.26" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="432.32" y="321.26" font-size="11.00" class="sc-notoserifcjksc">上的得分为</text><text x="490.21 496.34 502.52 505.22 511.13" y="321.26" font-size="11.00" class="sc-loraregular">39.2%</text><text x="520.70" y="321.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="336.88" font-size="11.00" class="sc-notoserifcjksc">我们在运行</text><text x="129.89 138.39 144.06 147.15 153.06 159.63 162.52 168.51 171.22" y="336.88" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="180.11" y="336.88" font-size="11.00" class="sc-notoserifcjksc">时未使用回退模型（</text><text x="279.11" y="336.88" font-size="11.00" class="sc-loraregular">fallback model</text><text x="353.02" y="336.88" font-size="11.00" class="sc-notoserifcjksc">），因此当安全防护措施标记某个请求</text><text x="72.00" y="352.50" font-size="11.00" class="sc-notoserifcjksc">时，该次试验即在此终止。这种情况发生在</text><text x="283.89" y="352.50" font-size="11.00" class="sc-loraregular">1.8%</text><text x="309.25" y="352.50" font-size="11.00" class="sc-notoserifcjksc">的试验中（</text><text x="364.25" y="352.50" font-size="11.00" class="sc-loraregular">660</text><text x="386.69" y="352.50" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="422.58" y="352.50" font-size="11.00" class="sc-loraregular">12</text><text x="435.39" y="352.50" font-size="11.00" class="sc-notoserifcjksc">次，其中</text><text x="482.28" y="352.50" font-size="11.00" class="sc-loraregular">10</text><text x="496.01" y="352.50" font-size="11.00" class="sc-notoserifcjksc">次发生在</text><text x="72.00" y="368.12" font-size="11.00" class="sc-notoserifcjksc">同一个任务上），且这些试验全部失败。</text><text x="72.00" y="402.22" font-size="11.00" class="sc-notoserifcjksc">我们在不允许互联网出站流量的条件下为</text><text x="272.89 281.39 287.06 290.15 296.06 302.63 305.52 311.51 314.22" y="402.22" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="323.11" y="402.22" font-size="11.00" class="sc-notoserifcjksc">运行了该评估。我们根据历史运行日志，预</text><text x="72.00" y="417.84" font-size="11.00" class="sc-notoserifcjksc">先缓存了模型运行所需的资源，并据此重新构建了镜像。原则上，如果模型想要使用在线资源却</text><text x="72.00" y="433.46" font-size="11.00" class="sc-notoserifcjksc">被阻止，这可能会降低得分。我们尚未严格测量这一效应对</text><text x="360.89 369.38 375.06 378.15 384.06 390.63 393.52 399.51 402.22" y="433.46" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="411.11" y="433.46" font-size="11.00" class="sc-notoserifcjksc">的影响大小，但我们认为</text><text x="72.00" y="449.08" font-size="11.00" class="sc-notoserifcjksc">它没有使最终得分超出噪声区间。</text><text x="72.00" y="515.56" font-size="11.00" class="sc-notoserifcjksc">作为比较，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 171.53 177.96 184.64 191.32 197.20 201.46 204.35 210.35 213.05" y="515.56" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="221.94" y="515.56" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="268.83 273.90 280.56 283.16 289.51" y="515.56" font-size="11.00" class="sc-loraregular">70.6%</text><text x="299.08" y="515.56" font-size="11.00" class="sc-notoserifcjksc">（其中</text><text x="334.98" y="515.56" font-size="11.00" class="sc-loraregular">1.2%</text><text x="360.06" y="515.56" font-size="11.00" class="sc-notoserifcjksc">的请求被安全防护措施标记并由回退</text><text x="72.00" y="531.18" font-size="11.00" class="sc-notoserifcjksc">模型作答，影响了</text><text x="162.89" y="531.18" font-size="11.00" class="sc-loraregular">1.5%</text><text x="188.06" y="531.18" font-size="11.00" class="sc-notoserifcjksc">的试验），</text><text x="243.06 250.75 253.74 259.35 265.92 272.50 278.46 281.35 290.09 296.65 303.22 308.31 311.21 317.20 319.91" y="531.18" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="328.80" y="531.18" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="375.69" y="531.18" font-size="11.00" class="sc-loraregular">66.4%</text><text x="406.64" y="531.18" font-size="11.00" class="sc-notoserifcjksc">（其中</text><text x="442.54" y="531.18" font-size="11.00" class="sc-loraregular">2.5%</text><text x="469.61" y="531.18" font-size="11.00" class="sc-notoserifcjksc">的请求被安全</text><text x="72.00" y="546.80" font-size="11.00" class="sc-notoserifcjksc">防护措施标记，影响了</text><text x="184.89" y="546.80" font-size="11.00" class="sc-loraregular">10%</text><text x="208.19" y="546.80" font-size="11.00" class="sc-notoserifcjksc">的试验），而</text><text x="277.08 284.77 287.77 293.38 299.94 306.52 312.48 315.38 323.87 329.54 332.63 338.54 345.11 348.00 353.96 356.67" y="546.80" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="365.56" y="546.80" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="412.45 419.11 421.65 428.48" y="546.80" font-size="11.00" class="sc-loraregular">0.0%</text><text x="438.05" y="546.80" font-size="11.00" class="sc-notoserifcjksc">，没有通过任何一次</text><text x="72.00" y="562.42" font-size="11.00" class="sc-notoserifcjksc">试验。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="596.52" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21" y="596.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="136.11 144.60 150.28 153.37 159.27 165.84 168.73 174.70 177.40" y="596.52" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="186.29" y="596.52" font-size="11.00" class="sc-notoserifcjksc">的得分为每个任务</text><text x="277.18" y="596.52" font-size="11.00" class="sc-loraregular">10</text><text x="290.91" y="596.52" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="348.80" y="596.52" font-size="11.00" class="sc-loraregular">660</text><text x="371.24" y="596.52" font-size="11.00" class="sc-notoserifcjksc">次试验）的平均值，</text><text x="470.24 476.48 482.92 489.59 496.27 502.16 506.41 509.31 515.30 518.01" y="596.52" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="526.89" y="596.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="612.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="612.14" font-size="11.00" class="sc-notoserifcjksc">的得分为每个任务五次试验（共</text><text x="276.34" y="612.14" font-size="11.00" class="sc-loraregular">330</text><text x="298.31" y="612.14" font-size="11.00" class="sc-notoserifcjksc">次试验）的平均值。将各次试验视为相互独立时，</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="627.76" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21" y="627.76" font-size="11.00" class="sc-notoserifcjksc">的标准误为</text><text x="180.11" y="627.76" font-size="11.00" class="sc-loraregular">±1.9</text><text x="201.90" y="627.76" font-size="11.00" class="sc-notoserifcjksc">个百分点，</text><text x="256.90 263.14 269.57 276.25 282.92 288.81 293.07 295.96 301.96 304.66" y="627.76" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="313.55" y="627.76" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="327.44" y="627.76" font-size="11.00" class="sc-loraregular">±2.5</text><text x="350.77" y="627.76" font-size="11.00" class="sc-notoserifcjksc">个百分点，</text><text x="405.77" y="627.76" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="453.22" y="627.76" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="467.11 472.94 478.85 481.44" y="627.76" font-size="11.00" class="sc-loraregular">±2.6</text><text x="490.69" y="627.76" font-size="11.00" class="sc-notoserifcjksc">个百分</text><text x="72.00" y="643.38" font-size="11.00" class="sc-notoserifcjksc">点。所有报告的数字均使用</text><text x="206.89" y="643.38" font-size="11.00" class="sc-robotomonoregular" fill="#188038">--bare</text><text x="249.39" y="643.38" font-size="11.00" class="sc-notoserifcjksc">模式下的</text><text x="296.29 303.97 306.97 312.58 319.14 325.72 331.68 334.58 342.27 348.70 355.28" y="643.38" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="361.24" y="643.38" font-size="11.00" class="sc-notoserifcjksc">，并采用</text><text x="408.13" y="643.38" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="430.83" y="643.38" font-size="11.00" class="sc-notoserifcjksc">推理强度；例外的是</text><text x="72.00" y="659.00" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="659.00" font-size="11.00" class="sc-notoserifcjksc">，其结果按其自身系统卡的做法在</text><text x="284.44" y="659.00" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="320.34" y="659.00" font-size="11.00" class="sc-notoserifcjksc">推理强度下报告；以及</text><text x="433.23 441.73 447.40 450.49 456.40 462.97 465.86 471.82 474.53" y="659.00" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="480.52" y="659.00" font-size="11.00" class="sc-notoserifcjksc">，它使用</text><text x="72.00 78.36 84.49 87.26 93.62 99.97 106.33 109.22 113.48 119.92 125.75 131.71" y="674.62" font-size="11.00" class="sc-loraregular">63,999 token</text><text x="141.29" y="674.62" font-size="11.00" class="sc-notoserifcjksc">的固定思考预算而非推理强度档位运行（因为它早于推理强度档位的推出）。</text><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="215.58" y="182.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="215.58" y="182.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="226.58" y="182.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="226.58" y="182.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="237.58" y="182.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/ <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p116.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 116 页"><text x="72.00 80.93 84.30 93.24 96.88 104.77 113.40 118.78 133.31 137.01 146.09 155.58 159.27 167.45 176.27 184.90 193.98 202.38 211.46 219.65 228.10 236.49 240.19 248.82 257.90 266.30 274.93 278.57 287.54 290.91" y="235.76" font-size="14.00" class="sc-poppinsmedium">8.5 Terminal-Bench-Science 0.1</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">116</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89" y="82.61" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="138.30" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的最新一代模型，公开排行榜报告的成绩为：</text><text x="358.30 366.67 373.33 379.67 385.05 391.41 394.30 400.66 407.22 413.90 419.58 422.47 426.47 432.83 435.54 441.50 451.07 453.96 459.79 462.69 468.59 470.95 476.02" y="82.61" font-size="11.00" class="sc-loraregular">GPT-6 Luna 16.4% ± 2.7%</text><text x="485.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="496.59 504.96 511.63 517.96 523.34" y="82.61" font-size="11.00" class="sc-loraregular">GPT-6</text><text x="72.00 78.24 84.67 87.66 90.56 96.52 102.70 105.41 111.37 120.94 123.83 129.66 132.56 138.68 141.39 147.30" y="98.23" font-size="11.00" class="sc-loraregular">Sol 49.4% ± 3.2%</text><text x="156.87" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="167.87 176.24 182.90 189.24 194.62 200.98 203.68 207.68 210.58 216.82 223.25 226.24 229.14 235.13 241.31 244.02 249.93 259.49 262.39 268.22 271.11 277.24 279.94 283.95" y="98.23" font-size="11.00" class="sc-loraregular">GPT-6.1 Sol 58.2% ± 3.1%</text><text x="293.52" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（区间为排行榜所报告的数值），均使用</text><text x="494.41 502.10 508.54 515.11 521.02" y="98.23" font-size="11.00" class="sc-loraregular">Codex</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">CLI</text><text x="92.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="106.52" y="113.85" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="129.21" y="113.85" font-size="11.00" class="sc-notoserifcjksc">推理强度下评分。据我们所知，</text><text x="283.21" y="113.85" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="324.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc">尚未报告其自己测得的这三个模型的</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.65 166.19" y="129.47" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="175.92" y="129.47" font-size="11.00" class="sc-notoserifcjksc">分数。</text><text x="208.92" y="129.47" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="250.32" y="129.47" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="275.21 283.59 290.25 296.59 301.97 308.32 311.22 318.10 323.20 327.45 332.14" y="129.47" font-size="11.00" class="sc-loraregular">GPT-6 Astra</text><text x="340.71" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="354.60 361.10 367.06 371.83 381.66 384.75 391.43 397.11 400.10 405.48 412.32 418.28 424.96 430.81 437.40 440.29 446.25 448.79" y="129.47" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="458.52" y="129.47" font-size="11.00" class="sc-notoserifcjksc">最终分数为</text><text x="72.00 78.00 82.58 85.29 91.65" y="145.09" font-size="11.00" class="sc-loraregular">57.9%</text><text x="101.22" y="145.09" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="126.11" y="145.09" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="155.41" y="145.09" font-size="11.00" class="sc-notoserifcjksc">推理强度下评分（在其报告中，</text><text x="309.41" y="145.09" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="332.10" y="145.09" font-size="11.00" class="sc-notoserifcjksc">推理强度的表现略低于</text><text x="445.00" y="145.09" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="471.40" y="145.09" font-size="11.00" class="sc-notoserifcjksc">，因此我们选</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">取了其最高的数字）。公开排行榜报告其使用</text><text x="294.89 302.58 309.02 315.60 321.50 327.33 330.23 337.91 344.27" y="160.71" font-size="11.00" class="sc-loraregular">Codex CLI</text><text x="350.85" y="160.71" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="364.74" y="160.71" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="387.44" y="160.71" font-size="11.00" class="sc-notoserifcjksc">推理强度下的分数为</text><text x="489.33" y="160.71" font-size="11.00" class="sc-loraregular">58.2% ±</text><text x="72.00" y="176.33" font-size="11.00" class="sc-loraregular">2.8%</text><text x="96.36" y="176.33" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 160.18 166.41 172.26 175.36 181.32 187.99 193.79" y="258.41" font-size="11.00" class="sc-loraregular">Terminal-Bench-Science</text><text x="202.65" y="258.41" font-size="11.00" class="sc-notoserifcjksc">是一个由斯坦福大学牵头的社区基准，包含</text><text x="414.54" y="258.41" font-size="11.00" class="sc-loraregular">70</text><text x="429.34" y="258.41" font-size="11.00" class="sc-notoserifcjksc">个取自科学研究工作流</text><text x="72.00" y="274.03" font-size="11.00" class="sc-notoserifcjksc">的任务，由生命科学、物理科学、地球科学、数学科学和工程科学领域的科学家和研究人员编写</text><text x="72.00" y="289.65" font-size="11.00" class="sc-notoserifcjksc">并审核。该项目的科学顾问来自麻省理工学院（</text><text x="303.00" y="289.65" font-size="11.00" class="sc-loraregular">MIT</text><text x="323.82" y="289.65" font-size="11.00" class="sc-notoserifcjksc">）、普林斯顿大学、华盛顿大学、</text><text x="72.00 80.37 86.33 93.01 98.97 105.55 109.81 115.71 121.57" y="305.27" font-size="11.00" class="sc-loraregular">Genentech</text><text x="131.05" y="305.27" font-size="11.00" class="sc-notoserifcjksc">和斯坦福大学。</text><text x="72.00" y="339.38" font-size="11.00" class="sc-notoserifcjksc">在每个任务中，智能体</text><text x="184.89" y="339.38" font-size="11.00" class="sc-loraregular">CLI</text><text x="205.52" y="339.38" font-size="11.00" class="sc-notoserifcjksc">在一个自包含的环境中根据自然语言指令工作，其生成的产出物依据</text><text x="72.00" y="355.00" font-size="11.00" class="sc-notoserifcjksc">隐藏的、针对特定任务的测试进行评分。</text><text x="72.00" y="387.95" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 272.78 278.46 281.55 287.46 294.02 296.92 302.91 305.62" y="387.95" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="314.51" y="387.95" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="328.40 334.90 340.86 345.63 355.46 358.55 365.23 370.90 373.90 379.27 386.12 392.08 398.76 404.61 411.20 416.58 422.81 428.66 431.76 437.72 444.39 450.19" y="387.95" font-size="11.00" class="sc-loraregular">Terminal-Bench-Science</text><text x="459.05" y="387.95" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="494.94 500.85 507.50 510.10 516.46" y="387.95" font-size="11.00" class="sc-loraregular">20.6%</text><text x="526.03" y="387.95" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="403.57" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 92.39 98.36 103.12 112.95 116.04 122.72 128.40 131.39 136.77 143.61 149.57 156.25 162.10 168.69 171.58 177.54 180.09" y="403.57" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="189.81" y="403.57" font-size="11.00" class="sc-notoserifcjksc">一样，我们运行</text><text x="269.70 278.20 283.87 286.96 292.87 299.44 302.33 308.32 311.03" y="403.57" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="319.92" y="403.57" font-size="11.00" class="sc-notoserifcjksc">时未使用回退模型，因此当安全防护措施标记</text><text x="72.00" y="419.19" font-size="11.00" class="sc-notoserifcjksc">某个请求时，该次试验即退出并判为失败。这种情况发生在</text><text x="360.89" y="419.19" font-size="11.00" class="sc-loraregular">2.3%</text><text x="388.10" y="419.19" font-size="11.00" class="sc-notoserifcjksc">的试验中（</text><text x="443.10" y="419.19" font-size="11.00" class="sc-loraregular">700</text><text x="464.72" y="419.19" font-size="11.00" class="sc-notoserifcjksc">次中有</text><text x="500.62" y="419.19" font-size="11.00" class="sc-loraregular">16</text><text x="513.87" y="419.19" font-size="11.00" class="sc-notoserifcjksc">次，</text><text x="72.00" y="434.81" font-size="11.00" class="sc-notoserifcjksc">全部集中在</text><text x="129.89" y="434.81" font-size="11.00" class="sc-loraregular">70</text><text x="144.69" y="434.81" font-size="11.00" class="sc-notoserifcjksc">个任务中的两个上）。</text><text x="254.69 262.38 265.37 270.98 277.55 284.12 290.09 292.98 299.22 305.65 312.33 319.01 324.89 329.15 332.04 338.04 340.74" y="434.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="349.63" y="434.81" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="374.52 380.52 386.70 389.40 395.76" y="434.81" font-size="11.00" class="sc-loraregular">59.9%</text><text x="405.33" y="434.81" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="416.33 424.02 427.01 432.62 439.19 445.77 451.73 454.62 463.36 469.92 476.49 481.58 484.48 490.47 493.18" y="434.81" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="502.07" y="434.81" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="72.00 78.00 84.18 86.53 91.60" y="450.43" font-size="11.00" class="sc-loraregular">58.7%</text><text x="101.17" y="450.43" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="112.17 119.86 122.85 128.46 135.03 141.61 147.57 150.46 158.96 164.63 167.72 173.63 180.20 183.09 189.05 191.76" y="450.43" font-size="11.00" class="sc-loraregular">Claude Haiku 4. 11.00" class="sc-notoserifcjksc">推出的基准测试，包含</text><text x="335.78" y="110.54" font-size="11.00" class="sc-loraregular">34</text><text x="350.76" y="110.54" font-size="11.00" class="sc-notoserifcjksc">个超长程的工程与研究任务，涵盖系统</text><text x="72.00" y="126.16" font-size="11.00" class="sc-notoserifcjksc">实现、性能优化、科学计算、</text><text x="215.00" y="126.16" font-size="11.00" class="sc-loraregular">AI</text><text x="228.46" y="126.16" font-size="11.00" class="sc-notoserifcjksc">研究和视觉推理。示例包括用</text><text x="374.36" y="126.16" font-size="11.00" class="sc-loraregular">Rust</text><text x="400.08" y="126.16" font-size="11.00" class="sc-notoserifcjksc">重新实现</text><text x="446.97 455.72 462.29 467.97 474.55 478.80 485.37" y="126.16" font-size="11.00" class="sc-loraregular">Quantum</text><text x="72.00 78.84 85.08 91.69 98.60 105.44 111.68 117.91" y="141.78" font-size="11.00" class="sc-loraregular">ESPRESSO</text><text x="129.54" y="141.78" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="143.43 149.95 158.22 160.92" y="141.78" font-size="11.00" class="sc-loraregular">pw.x</text><text x="169.65" y="141.78" font-size="11.00" class="sc-notoserifcjksc">核心、构建一个能够运行飞行模拟器的</text><text x="359.54 368.27 374.84 380.80 387.35 395.72" y="141.78" font-size="11.00" class="sc-loraregular">OpenGL</text><text x="404.97" y="141.78" font-size="11.00" class="sc-notoserifcjksc">场景渲染器，以及对一个大</text><text x="72.00" y="157.40" font-size="11.00" class="sc-notoserifcjksc">语言模型（</text><text x="127.00" y="157.40" font-size="11.00" class="sc-loraregular">LLM</text><text x="149.81" y="157.40" font-size="11.00" class="sc-notoserifcjksc">）进行后训练，使其能玩一款交互式解谜游戏。每次试验的预算为</text><text x="471.71" y="157.40" font-size="11.00" class="sc-loraregular">20</text><text x="487.34" y="157.40" font-size="11.00" class="sc-notoserifcjksc">小时。领先</text><text x="72.00" y="173.02" font-size="11.00" class="sc-notoserifcjksc">的公开模型平均每次试验耗时约</text><text x="228.89" y="173.02" font-size="11.00" class="sc-loraregular">11</text><text x="239.79" y="173.02" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="253.69" y="173.02" font-size="11.00" class="sc-loraregular">16</text><text x="72.00 78.67 83.35 89.73 95.56 98.65 108.49 114.16" y="188.64" font-size="11.00" class="sc-loraregular">Proximal</text><text x="120.05" y="188.64" font-size="11.00" class="sc-notoserifcjksc">自己的智能体运行框架中以</text><text x="254.94" y="188.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="277.64" y="188.64" font-size="11.00" class="sc-notoserifcjksc">推理强度运行，报告的分数为每个任务五次试验的平均</text><text x="72.00" y="204.26" font-size="11.00" class="sc-notoserifcjksc">值。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="257.02" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="257.02" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="174.40 180.32 185.00 191.44 198.02 202.27 205.36 211.33 216.09 222.33 233.27 240.11 243.01 248.56" y="257.02" font-size="11.00" class="sc-loraregular">FrontierSWE v2</text><text x="257.36" y="257.02" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="293.25" y="257.02" font-size="11.00" class="sc-loraregular">43.8%</text><text x="323.80" y="257.02" font-size="11.00" class="sc-notoserifcjksc">，略低于</text><text x="370.69 378.38 381.38 386.99 393.55 400.13 406.09 408.99 414.57 420.25 426.65 429.64 435.61 438.50" y="257.02" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="444.49" y="257.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="455.49 461.46 466.04 468.58 475.41" y="257.02" font-size="11.00" class="sc-loraregular">47.0%</text><text x="484.98" y="257.02" font-size="11.00" class="sc-notoserifcjksc">），远高于</text><text x="72.00 80.37 87.04 93.37 98.75 104.75 107.34 113.70 116.59 122.83 129.27" y="272.64" font-size="11.00" class="sc-loraregular">GPT-5.6 Sol</text><text x="132.26" y="272.64" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="143.26" y="272.64" font-size="11.00" class="sc-loraregular">32.2%</text><text x="173.48" y="272.64" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="195.48 202.14 206.83 213.21 219.04 222.13 231.96 237.64" y="272.64" font-size="11.00" class="sc-loraregular">Proximal</text><text x="243.52" y="272.64" font-size="11.00" class="sc-notoserifcjksc">在全部</text><text x="279.42" y="272.64" font-size="11.00" class="sc-loraregular">34</text><text x="294.40" y="272.64" font-size="11.00" class="sc-notoserifcjksc">个任务上以</text><text x="352.29" y="272.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="374.99" y="272.64" font-size="11.00" class="sc-notoserifcjksc">推理强度运行</text><text x="443.88 451.57 454.56 460.17 466.74 473.32 479.28 482.17 490.66 496.34 499.43 505.34 511.90 514.80 520.79 523.50" y="272.64" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="529.49" y="272.64" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="288.26" font-size="11.00" class="sc-notoserifcjksc">每个任务五次试验。</text><text x="72.00" y="323.72" font-size="14.00" class="sc-poppinssemibold">8.7</text><text x="95.65" y="323.72" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="388.70" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="150.82" y="388.70" font-size="11.00" class="sc-notoserifcjksc">是一个长上下文智能体编程基准，包含</text><text x="340.71" y="388.70" font-size="11.00" class="sc-loraregular">200</text><text x="363.17" y="388.70" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获得由某</text><text x="72.00" y="404.32" font-size="11.00" class="sc-notoserifcjksc">个开源项目编译而成的二进制文件及该项目的文档，必须在不使用互联网或反编译工具的情况下</text><text x="72.00" y="419.94" font-size="11.00" class="sc-notoserifcjksc">重建一个能复现原程序行为的代码库。任务规模从小型终端工具（</text><text x="391.00" y="419.94" font-size="11.00" class="sc-loraregular">jq</text><text x="400.21" y="419.94" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="411.21 415.97 419.06 425.63 431.71 436.40 442.36" y="419.94" font-size="11.00" class="sc-loraregular">ripgrep</text><text x="448.93" y="419.94" font-size="11.00" class="sc-notoserifcjksc">）到大型系统</text><text x="72.00" y="435.56" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.03 94.95 104.78 111.35 117.31" y="435.56" font-size="11.00" class="sc-loraregular">FFmpeg</text><text x="123.39" y="435.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="134.39 140.63 149.29 155.64 158.91 163.17" y="435.56" font-size="11.00" class="sc-loraregular">SQLite</text><text x="169.13" y="435.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="180.13 186.74 195.32" y="435.56" font-size="11.00" class="sc-loraregular">PHP</text><text x="204.88" y="435.56" font-size="11.00" class="sc-notoserifcjksc">解释器）不等。提交结果依据超过</text><text x="372.77 378.44 384.40 388.99 391.59 398.43 405.26" y="435.56" font-size="11.00" class="sc-loraregular">247,000</text><text x="414.99" y="435.56" font-size="11.00" class="sc-notoserifcjksc">个基于执行的行为测试进</text><text x="72.00" y="451.18" font-size="11.00" class="sc-notoserifcjksc">行评分，这些测试通过智能体驱动的模糊测试生成。</text><text x="72.00" y="510.04" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="510.04" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="510.04" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件在隐藏测试集上得分低于</text><text x="356.77 363.42 366.13" y="510.04" font-size="11.00" class="sc-loraregular">0.9</text><text x="375.38" y="510.04" font-size="11.00" class="sc-notoserifcjksc">的任务（这表明存在测试不稳定</text><text x="72.00" y="525.66" font-size="11.00" class="sc-notoserifcjksc">性），剩余</text><text x="129.89" y="525.66" font-size="11.00" class="sc-loraregular">166</text><text x="149.51" y="525.66" font-size="11.00" class="sc-notoserifcjksc">个任务。在这些任务上，我们只依据参考二进制文件能够通过的测试进行评分。</text><text x="72.00" y="541.28" font-size="11.00" class="sc-notoserifcjksc">我们使用与上游仓库相同的</text><text x="206.89 216.73 219.82 226.50 229.59 234.97 240.06 248.74 254.70 260.08 265.75 271.78 277.74 284.32" y="541.28" font-size="11.00" class="sc-loraregular">mini-swe-agent</text><text x="291.47" y="541.28" font-size="11.00" class="sc-notoserifcjksc">运行框架报告隐藏测试通过率，但不设六小时的时</text><text x="72.00" y="556.90" font-size="11.00" class="sc-notoserifcjksc">间限制。在这一任务集上，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 250.78 256.46 259.55 265.46 272.02 274.92 280.91 283.62" y="556.90" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="292.51" y="556.90" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="317.40 323.58 329.49 332.03 338.86" y="556.90" font-size="11.00" class="sc-loraregular">82.0%</text><text x="348.43" y="556.90" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="373.32 381.01 384.00 389.61 396.18 402.76 408.72 411.61 417.85 424.29 430.96 437.64 443.53 447.78 450.68 456.67 459.38" y="556.90" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="468.26" y="556.90" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="493.16 498.23 504.41 506.76 511.84" y="556.90" font-size="11.00" class="sc-loraregular">79.7%</text><text x="521.41" y="556.90" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="572.52" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="572.52" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="182.63" y="572.52" font-size="11.00" class="sc-loraregular">91.2%</text><text x="211.17" y="572.52" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="615.19" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89 125.56 130.24 136.68 142.76 147.45 153.12 162.89 169.74 175.70 182.37 188.23" y="615.19" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="197.71" y="615.19" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标。</text><text x="384.71 393.20 398.88 401.97 407.87 414.44 417.33 423.33 426.03" y="615.19" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="434.92" y="615.19" font-size="11.00" class="sc-notoserifcjksc">的各回合覆盖了一系</text><text x="72.00" y="630.81" font-size="11.00" class="sc-notoserifcjksc">列上下文长度，最长可达完整的</text><text x="228.89" y="630.81" font-size="11.00" class="sc-loraregular">100</text><text x="249.45" y="630.81" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="263.35 267.60 274.04 279.87 285.83" y="630.81" font-size="11.00" class="sc-loraregular">token</text><text x="295.40" y="630.81" font-size="11.00" class="sc-notoserifcjksc">窗口，且这些任务所测试的长上下文能力与实际的</text><text x="72.00" y="646.43" font-size="11.00" class="sc-notoserifcjksc">下游用例高度契合。</text><a href="https://www.frontierswe.com/blog/v2" rel="noopener"><rect x="235.29" y="707.20" width="183.97" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p118.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 118 页"><text x="72.00 80.29 83.42 91.71 94.85 99.40 102.77 111.94 117.71" y="125.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.8.1 HLE</text><text x="72.00" y="713.03" font-size="6.00" class="sc-loraregular">15</text><text x="80.08 86.08 92.07 97.23 103.29 105.82 108.45 114.23 116.69 119.22 121.85 127.19 131.06 133.69 138.85 141.57 144.03 146.66 149.71 155.07 161.21 166.58 172.03 175.08 177.53 180.16 187.77 193.74 202.67 207.83 213.90 216.87 220.76 226.04 227.59 232.22 234.85 240.85 246.01 250.64 254.50 257.13 263.35 268.65 273.81 282.74 285.20 287.83 292.99 296.70 303.18 305.99 311.04 313.54 318.91 324.36 330.56 334.20 336.66 340.30 345.72 350.87 356.28 361.90" y="717.26" font-size="10.00" class="sc-loraregular">Phan, L., et al. (2025). Humanity’s Last Exam. arXiv:2501.14249.</text><text x="366.99 372.89 376.86 380.72 386.69 391.32 393.82 397.51 403.96 409.12 413.45 418.75 421.56 426.21 428.67 434.52 438.80 444.33 450.78 455.94 461.76 466.04 472.94 478.30 483.75 489.96 493.60 496.06 499.69 505.11 510.26 515.68" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2501.14249</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">118</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.8</text><text x="96.98" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00 80.37 86.94 96.77 102.45 109.13 112.39 116.67 122.48 124.20 129.29 132.18 138.78 144.46 149.55 153.81 156.70 163.54 169.37 175.05" y="148.97" font-size="11.00" class="sc-loraregular">Humanity’s Last Exam</text><text x="184.88" y="148.97" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="148.97" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="148.97" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="145.30" font-size="6.60" class="sc-loraregular">15</text><text x="237.55" y="148.97" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，包含涵盖数十个学科的</text><text x="471.45 477.35 480.13 486.12 492.95" y="148.97" font-size="11.00" class="sc-loraregular">2,500</text><text x="502.69" y="148.97" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="164.59" font-size="11.00" class="sc-notoserifcjksc">目。题目由领域专家编写并审核。这些题目经过专门设计，无法通过互联网搜索快速得到答案，</text><text x="72.00" y="180.21" font-size="11.00" class="sc-notoserifcjksc">且每道题只有在前沿大语言模型无法作答时才会被保留。</text><text x="72.00" y="230.14" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.68 248.35 251.44 257.35 263.92 266.81 272.81 275.51" y="230.14" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="281.51" y="230.14" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="303.51" y="230.14" font-size="11.00" class="sc-loraregular">1</text><text x="307.51" y="230.14" font-size="11.00" class="sc-notoserifcjksc">）不使用工具、仅依靠推理；（</text><text x="461.51" y="230.14" font-size="11.00" class="sc-loraregular">2</text><text x="467.42" y="230.14" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜</text><text x="72.00" y="245.76" font-size="11.00" class="sc-notoserifcjksc">索、网页抓取、程序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="437.89" y="245.76" font-size="11.00" class="sc-robotomonoregular" fill="#188038">auto</text><text x="464.30" y="245.76" font-size="11.00" class="sc-notoserifcjksc">，每次尝试的</text><text x="72.00" y="261.38" font-size="11.00" class="sc-notoserifcjksc">任务预算为</text><text x="129.89 136.25 142.43 149.26 155.17 158.06 162.32 168.76 174.59 180.55" y="261.38" font-size="11.00" class="sc-loraregular">980k token</text><text x="187.22" y="261.38" font-size="11.00" class="sc-notoserifcjksc">。这些结果未使用上下文压缩。由</text><text x="355.12 362.81 365.80 371.41 377.98 384.55 390.52 393.41 402.14 408.71 415.28 420.37 423.26 429.22 431.82" y="261.38" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="441.07" y="261.38" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="311.63" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具版本中出现结果污染，我们为搜索器和抓取器都屏蔽了已知讨论</text><text x="459.89" y="311.63" font-size="11.00" class="sc-loraregular">HLE</text><text x="484.57" y="311.63" font-size="11.00" class="sc-notoserifcjksc">的来源（见</text><text x="72.00" y="327.25" font-size="11.00" class="sc-notoserifcjksc">附录</text><text x="96.89 103.07 105.78" y="327.25" font-size="11.00" class="sc-loraregular">9.1</text><text x="109.79" y="327.25" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="120.79" y="327.25" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="131.79" y="327.25" font-size="11.00" class="sc-notoserifcjksc">我们还使用文本规则筛查每一份回答正确的对话记录，查找</text><text x="420.68" y="327.25" font-size="11.00" class="sc-loraregular">HLE</text><text x="445.35" y="327.25" font-size="11.00" class="sc-notoserifcjksc">特定来源的迹象，</text><text x="72.00" y="342.87" font-size="11.00" class="sc-notoserifcjksc">并使用</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04" y="342.87" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="184.93" y="342.87" font-size="11.00" class="sc-notoserifcjksc">审查每一份被标记的对话记录。对于确认属于作弊的情况，我们将其重新</text><text x="72.00" y="358.49" font-size="11.00" class="sc-notoserifcjksc">评为错误。</text><text x="72.00" y="408.78" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89 94.64 100.40 104.00 110.53 117.33 120.22 126.24 128.80" y="408.78" font-size="11.00" class="sc-lorabold">Haiku 4.5</text><text x="137.64" y="408.78" font-size="11.00" class="sc-notoserifcjkscbold">的比较</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.88 151.58" y="434.98" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="160.47" y="434.98" font-size="11.00" class="sc-notoserifcjksc">没有推理强度设置，因此我们在多个扩展思考（</text><text x="391.47 397.38 403.21 407.47 413.43 420.11 426.68 432.59 439.17 442.06 446.32 452.91 456.00 462.68 468.58 471.67 478.35" y="434.98" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="484.43" y="434.98" font-size="11.00" class="sc-notoserifcjksc">）预算下运</text><text x="72.00" y="450.61" font-size="11.00" class="sc-notoserifcjksc">行了该评估。对于无工具版本，我们展示这些预算下的曲线；对于使用工具版本，我们只展示</text><text x="72.00 78.36 85.19 92.70 95.60 99.85 106.29 112.12 118.08" y="466.23" font-size="11.00" class="sc-loraregular">60K token</text><text x="127.65" y="466.23" font-size="11.00" class="sc-notoserifcjksc">预算下的结果（该预算接近其</text><text x="273.54" y="466.23" font-size="11.00" class="sc-loraregular">64K</text><text x="296.27" y="466.23" font-size="11.00" class="sc-notoserifcjksc">输出上限所允许的最大值），因为在这种多轮设置</text><text x="72.00" y="481.85" font-size="11.00" class="sc-notoserifcjksc">中，不同的思考预算产生的结果相近。使用工具版本还采用了</text><text x="371.89 375.90 382.26 389.09 396.60 399.49 403.75 410.18 416.01 421.98" y="481.85" font-size="11.00" class="sc-loraregular">160K token</text><text x="431.55" y="481.85" font-size="11.00" class="sc-notoserifcjksc">的任务预算（而非</text><text x="72.00" y="497.46" font-size="11.00" class="sc-loraregular">980K</text><text x="98.88" y="497.46" font-size="11.00" class="sc-notoserifcjksc">），以适配其</text><text x="167.78" y="497.46" font-size="11.00" class="sc-loraregular">200K</text><text x="197.75" y="497.46" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="366.99" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>

5</text><text x="330.53" y="402.12" font-size="9.00" class="sc-notoserifcjksc">的成本假设缓存完全命中；</text><text x="438.53 445.48 450.13 452.66 457.49 462.86 465.23 470.11 472.32" y="402.12" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="479.59" y="402.12" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="490.96" y="402.12" font-size="9.00" class="sc-loraregular">5.5</text><text x="505.35" y="402.12" font-size="9.00" class="sc-notoserifcjksc">按记录</text><text x="72.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">的用量以标准定价计算，不含网络搜索费用。</text><text x="252.00 258.29 260.74 265.33 270.70 276.08 280.96 283.33 290.28 294.92 297.45 302.28 307.66 310.02 314.90 317.12" y="413.83" font-size="9.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="324.39" y="413.83" font-size="9.00" class="sc-notoserifcjksc">显示的是</text><text x="362.75 367.96 373.55 379.69 382.06 385.54 390.81 395.58 400.46" y="413.83" font-size="9.00" class="sc-loraregular">60K token</text><text x="408.29" y="413.83" font-size="9.00" class="sc-notoserifcjksc">扩展思考预算、</text><text x="471.29" y="413.83" font-size="9.00" class="sc-loraregular">160K</text><text x="493.87" y="413.83" font-size="9.00" class="sc-notoserifcjksc">任务预算下</text><text x="72.00" y="425.52" font-size="9.00" class="sc-notoserifcjksc">的结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p120.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 120 页"><text x="72.00 80.29 83.42 91.71 94.85 102.35 105.72 114.94 123.15 132.21 142.26" y="451.50" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.8.2 DRACO</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">16</text><text x="80.28 86.38 92.37 98.21 104.28 109.81 112.34 114.97 118.49 120.94 123.47 126.10 131.45 135.32 137.95 143.11 145.82 148.28 150.91 153.96 159.33 165.47 170.84 176.49 179.54 182.00 184.63 191.98 198.74 204.95 211.94 219.88 222.37 225.00 231.26 233.89 239.21 243.47 249.31 253.94 258.57 263.46 269.44 275.28 284.22 289.38 292.19 298.25 300.88 306.70 312.12 318.19 323.50 329.49 338.43 343.59 347.88 353.24 355.87 359.20 365.05 369.38 372.01 379.45 384.82 390.24 396.21 398.84 405.04 410.46 415.09 420.49 425.64 429.90 435.22 441.21 443.84 450.09 455.36 460.68 466.65 470.91 476.06 481.33 486.06" y="704.46" font-size="10.00" class="sc-loraregular">Zhong, J., et al. (2026). DRACO: A cross-domain benchmark for Deep Research Accuracy,</text><text x="72.00 78.99 84.83 93.77 99.74 102.46 107.81 111.67 117.09 123.16 128.58 133.21 137.83 140.36 142.99 148.15 154.22 160.20 162.82 170.76 176.58 179.19 184.56 189.82 193.69 196.50 201.55 204.52 208.41 213.31 215.77 218.40 223.56 227.27 233.76 236.56 241.61 244.11 249.48 255.26 261.39 266.76 269.22 272.86 276.50 282.28 287.89 293.34" y="717.26" font-size="10.00" class="sc-loraregular">Completeness, and Objectivity. arXiv:2602.11685.</text><text x="298.43 304.33 308.30 312.16 318.13 322.76 325.26 328.95 335.40 340.56 344.89 350.19 353.00 357.66 360.11 365.96 370.24 375.77 382.23 387.38 393.20 397.48 404.38 409.74 415.52 421.66 427.03 429.49 433.13 436.76 442.54 448.16" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2602.11685</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">120</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 104.99 107.08 112.62 116.09 118.46 125.50 131.06 139.34 144.05 149.80 152.70 156.42 161.38 163.11 167.47 169.84 175.27 179.99 184.36 188.07 190.44 196.06 200.99 205.70" y="390.43" font-size="9.00" class="sc-lorabold">8.8.1.B] Humanity’s Last Exam</text><text x="213.98" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="222.98" y="390.43" font-size="9.00" class="sc-lorabold">HLE</text><text x="241.30" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">，无工具）测试时计算扩展</text><text x="349.30" y="390.43" font-size="9.00" class="sc-notoserifcjksc">。随推理强度从</text><text x="414.67" y="390.43" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="433.24" y="390.43" font-size="9.00" class="sc-notoserifcjksc">提升到</text><text x="462.60" y="390.43" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="478.81" y="390.43" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="487.81" y="390.43" font-size="9.00" class="sc-loraregular">HLE</text><text x="507.99" y="390.43" font-size="9.00" class="sc-notoserifcjksc">准确率</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">与每任务平均成本（对数刻度）的关系。</text><text x="234.00" y="402.13" font-size="9.00" class="sc-loraregular">Opus 5.5</text><text x="272.82" y="402.13" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="284.18 289.29 294.55 300.02 305.48 310.29 313.78 316.14 321.05 323.26" y="402.13" font-size="9.00" class="sc-loraregular">Sonnet 5.5</text><text x="330.53" y="402.13" font-size="9.00" class="sc-notoserifcjksc">的成本假设缓存完全命中；</text><text x="438.53 445.48 450.13 452.66 457.49 462.86 465.23 470.11 472.32" y="402.13" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="479.59" y="402.13" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="490.96" y="402.13" font-size="9.00" class="sc-loraregular">5.5</text><text x="505.35" y="402.13" font-size="9.00" class="sc-notoserifcjksc">按记录</text><text x="72.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">的用量以标准定价计算。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="475.37" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="475.37" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="475.37" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89" y="471.70" font-size="6.60" class="sc-loraregular">16</text><text x="415.10" y="475.37" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="440.00 446.55 452.51 457.28 463.84 466.84 472.74 478.57 481.84 486.12" y="475.37" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.82" y="475.37" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00" y="490.99" font-size="11.00" class="sc-notoserifcjksc">度研究基准，评估模型在真实用户可能提出的复杂研究问题上的表现。</text><text x="413.00 421.09 428.53 435.36 443.05" y="490.99" font-size="11.00" class="sc-loraregular">DRACO</text><text x="454.68" y="490.99" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="468.57" y="490.99" font-size="11.00" class="sc-loraregular">100</text><text x="489.13" y="490.99" font-size="11.00" class="sc-notoserifcjksc">个精选任</text><text x="72.00" y="506.61" font-size="11.00" class="sc-notoserifcjksc">务组成，这些任务源自多个领域的用户查询。回答依据专家编写的评分细则进行评分，评分细则</text><text x="72.00" y="522.23" font-size="11.00" class="sc-notoserifcjksc">涵盖事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="588.93" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="588.93" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12" y="588.93" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="604.55" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="604.55" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="604.55" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="637.51" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="72.00" y="653.13" font-size="11.00" class="sc-notoserifcjksc">原始</text><text x="96.89 104.98 112.43 119.26 126.95" y="653.13" font-size="11.00" class="sc-loraregular">DRACO</text><text x="138.57" y="653.13" font-size="11.00" class="sc-notoserifcjksc">论文使用</text><text x="185.46 193.84 199.80 209.63 212.72 219.40 222.49 225.38 231.51 234.40 241.07 245.76" y="653.13" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="255.08" y="653.13" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型现已不可用。我们改用</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="668.75" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="155.06" y="668.75" font-size="11.00" class="sc-notoserifcjksc">，依据每个任务的</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评分细则对回答进行评分，同样采用二元的</text><text x="283.89 293.99 300.83 307.09 314.68 322.95 331.34 341.43 348.28" y="82.61" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="358.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">判定，并使用论文第</text><text x="460.10" y="82.61" font-size="11.00" class="sc-loraregular">4.2</text><text x="477.57" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节中的公式</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">将其汇总为归一化分数。我们遵循论文的方案，对每个回答进行五次独立的评分运行，并记录平</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">均值。我们的评判提示词取自论文的</text><text x="250.89" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="275.79" y="113.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="292.18" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="350.07" y="113.85" font-size="11.00" class="sc-loraregular">A</text><text x="359.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">数变动</text><text x="107.89" y="129.47" font-size="11.00" class="sc-loraregular">10</text><text x="121.62" y="129.47" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="135.51" y="129.47" font-size="11.00" class="sc-loraregular">25</text><text x="150.31" y="129.47" font-size="11.00" class="sc-notoserifcjksc">分，但系统排序保持不变，因此我们的分数与论文的主要公布数字不能直接比</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">较。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们使用了自己的智能体运行框架（不使用附录</text><text x="305.89" y="195.95" font-size="11.00" class="sc-loraregular">C.4</text><text x="325.14" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的系统提示词（</text><text x="402.14 407.24 413.04 418.14 422.39 428.36 438.19 441.08 447.65 452.34 458.77 468.61 475.17" y="195.95" font-size="11.00" class="sc-loraregular">system prompt</text><text x="479.43" y="195.95" font-size="11.00" class="sc-notoserifcjksc">）；使用网</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">络搜索、网页抓取、程序化工具调用和代码执行，预算为</text><text x="349.89 356.25 362.43 369.26 375.17 378.06 382.32 388.76 394.59 400.55" y="211.57" font-size="11.00" class="sc-loraregular">980k token</text><text x="407.23" y="211.57" font-size="11.00" class="sc-notoserifcjksc">），并指示模型将最终报告</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">写入其执行环境中的一个文件。随后我们只对该文件的内容进行评分，而非完整的智能体对话记</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">录，从而将交付物与中间工具输出隔离开来。</text><text x="72.00" y="286.91" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89 94.64 100.40 104.00 110.53 117.33 120.22 126.24 128.80" y="286.91" font-size="11.00" class="sc-lorabold">Haiku 4.5</text><text x="137.64" y="286.91" font-size="11.00" class="sc-notoserifcjkscbold">的比较</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.88 151.58" y="313.11" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="160.47" y="313.11" font-size="11.00" class="sc-notoserifcjksc">没有推理强度设置，因此我们在多个扩展思考预算下运行了该评估，并展示</text><text x="72.00 78.36 85.19 92.70 95.60 99.85 106.29 112.12 118.08" y="328.73" font-size="11.00" class="sc-loraregular">60K token</text><text x="127.65" y="328.73" font-size="11.00" class="sc-notoserifcjksc">预算下的结果。它还采用了</text><text x="262.54 266.55 272.90 279.73 287.25 290.14 294.40 300.83 306.66 312.62" y="328.73" font-size="11.00" class="sc-loraregular">160K token</text><text x="322.20" y="328.73" font-size="11.00" class="sc-notoserifcjksc">的任务预算（而非</text><text x="413.09" y="328.73" font-size="11.00" class="sc-loraregular">980K</text><text x="439.97" y="328.73" font-size="11.00" class="sc-notoserifcjksc">），以适配其</text><text x="508.87" y="328.73" font-size="11.00" class="sc-loraregular">200K</text><text x="72.00" y="344.35" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><text x="72.00" y="679.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="679.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.13 108.23 113.76 117.23 119.60 126.31 132.48 138.31 144.50" y="679.50" font-size="9.00" class="sc-lorabold">8.8.2.A] DRACO</text><text x="153.79" y="679.50" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="171.79" y="679.50" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下每任务平均成本的关系。在</text><text x="363.16" y="679.50" font-size="9.00" class="sc-loraregular">980k</text><text x="386.21" y="679.50" font-size="9.00" class="sc-notoserifcjksc">任务预算下，随推理强度从</text><text x="496.58" y="679.50" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="515.14" y="679.50" font-size="9.00" class="sc-notoserifcjksc">提升</text><text x="72.00" y="691.20" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="83.37" y="691.20" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="99.57" y="691.20" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="108.57 115.18 121.28 126.87 133.16" y="691.20" font-size="9.00" class="sc-loraregular">DRACO</text><text x="142.67" y="691.20" font-size="9.00" class="sc-notoserifcjksc">归一化分数与每任务平均成本（对数刻度）的关系。</text><text x="349.67" y="691.20" font-size="9.00" class="sc-loraregular">Opus 5.5</text><text x="388.49" y="691.20" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="399.85 404.96 410.22 415.69 421.15 425.96 429.45 431.81 436.72 438.93" y="691.20" font-size="9.00" class="sc-loraregular">Sonnet 5.5</text><text x="446.20" y="691.20" font-size="9.00" class="sc-notoserifcjksc">的成本假设缓存完全命</text><text x="72.00" y="702.90" font-size="9.00" class="sc-notoserifcjksc">中；</text><text x="90.00 96.95 101.59 104.12 108.95 114.33 116.69 121.57 123.79" y="702.90" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="131.06" y="702.90" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="142.42" y="702.90" font-size="9.00" class="sc-loraregular">5.5</text><text x="156.82" y="702.90" font-size="9.00" class="sc-notoserifcjksc">按记录的</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="250.89" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="250.89" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="261.89" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="261.89" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="272.89" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="275.79" y="105.05" width="16.39" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="72.00 80.29 83.42 91.71 94.85 102.57 105.95 118.93 127.99 137.36 146.57" y="127.45" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.8.3 WANDR</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">用量以标准定价计算，不含网络搜索费用。</text><text x="243.00 249.29 251.74 256.33 261.70 267.08 271.96 274.33 281.28 285.92 288.45 293.28 298.66 301.02 305.90 308.12" y="80.05" font-size="9.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="315.39" y="80.05" font-size="9.00" class="sc-notoserifcjksc">显示的是</text><text x="353.75 358.96 364.55 370.69 373.06 376.54 381.81 386.58 391.46" y="80.05" font-size="9.00" class="sc-loraregular">60K token</text><text x="399.29" y="80.05" font-size="9.00" class="sc-notoserifcjksc">扩展思考预算、</text><text x="462.29" y="80.05" font-size="9.00" class="sc-loraregular">160K</text><text x="484.87" y="80.05" font-size="9.00" class="sc-notoserifcjksc">任务预算下的</text><text x="72.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">结果。</text><text x="72.00 82.46 89.35 97.73 105.81" y="151.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">WANDR</text><text x="112.72" y="151.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72 134.48 137.57 144.15 150.11 153.00 159.89 168.16 174.74 177.63 185.83 191.74 197.70 204.26 207.16 213.99 219.95 225.04 230.98 236.66 241.35 247.20" y="151.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="151.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="151.53" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68 285.23 291.20 295.96 302.53 305.52 311.43 317.26 320.52 324.80" y="151.53" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="333.50" y="151.53" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，旨在为</text><text x="457.40 465.48 472.93 479.76 487.45" y="151.53" font-size="11.00" class="sc-loraregular">DRACO</text><text x="499.08" y="151.53" font-size="11.00" class="sc-notoserifcjksc">深度研</text><text x="72.00" y="167.15" font-size="11.00" class="sc-notoserifcjksc">究基准提供一个侧重广度搜索的对应基准。它包含</text><text x="316.89" y="167.15" font-size="11.00" class="sc-loraregular">500</text><text x="339.44" y="167.15" font-size="11.00" class="sc-notoserifcjksc">个任务，模型需要搜索数十到数百个实</text><text x="72.00" y="182.77" font-size="11.00" class="sc-notoserifcjksc">体，查找每个实体的相关事实，并在结构化记录中列出这些事实及其引用来源。我们运行了该评</text><text x="72.00" y="198.39" font-size="11.00" class="sc-notoserifcjksc">估的一个修改版本，并在下文说明方法上的差异。</text><text x="72.00" y="248.68" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="248.68" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12" y="248.68" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="264.30" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="264.30" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="264.30" font-size="11.00" class="sc-notoserifcjksc">模型。任务由一个评判模型评分，该评判模型可以使用与被测模型相同的网页</text><text x="72.00" y="279.92" font-size="11.00" class="sc-notoserifcjksc">抓取工具。评分者重新抓取被引用的</text><text x="250.89" y="279.92" font-size="11.00" class="sc-loraregular">URL</text><text x="272.43" y="279.92" font-size="11.00" class="sc-notoserifcjksc">，然后由评判模型判断这些引用是否支持解答。</text><text x="72.00" y="329.64" font-size="11.00" class="sc-notoserifcjksc">主要指标是</text><text x="127.00" y="329.64" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="329.64" font-size="11.00" class="sc-notoserifcjksc">软</text><text x="145.29" y="329.64" font-size="11.00" class="sc-loraregular">F1</text><text x="155.32" y="329.64" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.32 171.42 177.80 181.65 185.90 188.80 194.83" y="329.64" font-size="11.00" class="sc-loraregular">soft F1</text><text x="198.83" y="329.64" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.83" y="329.64" font-size="11.00" class="sc-loraregular">”</text><text x="213.67" y="329.64" font-size="11.00" class="sc-notoserifcjksc">，它在精确率（模型解答中有多少得到验证）与召回率（模型完成</text><text x="72.00" y="345.26" font-size="11.00" class="sc-notoserifcjksc">了所要求事实集合中的多少）之间取得平衡。当只有部分所需事实能够得到验证时，给予部分得</text><text x="72.00" y="360.88" font-size="11.00" class="sc-notoserifcjksc">分。结果为</text><text x="129.89" y="360.88" font-size="11.00" class="sc-loraregular">500</text><text x="152.44" y="360.88" font-size="11.00" class="sc-notoserifcjksc">个任务的平均值。未通过格式校验的单个实体行会被丢弃，而不会导致整个任务</text><text x="72.00" y="376.50" font-size="11.00" class="sc-notoserifcjksc">失败。</text><text x="72.00" y="426.80" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型获得的是只能访问冻结索引的离线网络搜索和网页抓取工具，而</text><text x="72.00 78.56 84.52 89.28 95.85 98.84 104.75 110.58 113.84 118.12" y="442.42" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="126.82" y="442.42" font-size="11.00" class="sc-notoserifcjksc">的版本使用实时网络。我们使用</text><text x="283.72 291.41 294.40 300.01 306.58 313.15 319.12 322.01 330.74 337.31 343.88 348.97 351.86 357.82 360.42" y="442.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="369.67" y="442.42" font-size="11.00" class="sc-notoserifcjksc">评判</text><text x="394.56 402.25 405.25 410.86 417.42 424.00" y="442.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="432.86" y="442.42" font-size="11.00" class="sc-notoserifcjksc">模型，而</text><text x="479.75 486.30 492.27 497.03 503.60 506.59 512.50 518.33 521.59 525.87" y="442.42" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="72.00" y="458.04" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89 105.26 111.93 118.27 123.65 129.64 132.35" y="458.04" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="138.31" y="458.04" font-size="11.00" class="sc-notoserifcjksc">。我们的提示词也略有不同。由于工具和评分逻辑与</text><text x="394.20 400.76 406.72 411.48 418.05 421.04 426.95 432.78 436.04 440.32" y="458.04" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="449.02" y="458.04" font-size="11.00" class="sc-notoserifcjksc">的运行框架不同，</text><text x="72.00" y="473.66" font-size="11.00" class="sc-notoserifcjksc">我们的结果与竞品模型的已报告数字不能直接比较。</text><text x="72.00" y="517.76" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89 94.64 100.40 104.00 110.53 117.33 120.22 126.24 128.80" y="517.76" font-size="11.00" class="sc-lorabold">Haiku 4.5</text><text x="137.64" y="517.76" font-size="11.00" class="sc-notoserifcjkscbold">的比较</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.88 151.58" y="543.95" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="160.47" y="543.95" font-size="11.00" class="sc-notoserifcjksc">没有推理强度设置，因此我们在多个扩展思考预算下运行了该评估，并展示</text><text x="72.00 78.36 85.19 92.70 95.60 99.85 106.29 112.12 118.08" y="559.57" font-size="11.00" class="sc-loraregular">60K token</text><text x="127.65" y="559.57" font-size="11.00" class="sc-notoserifcjksc">预算下的结果，该预算接近其</text><text x="273.54" y="559.57" font-size="11.00" class="sc-loraregular">64K</text><text x="296.27" y="559.57" font-size="11.00" class="sc-notoserifcjksc">输出上限所允许的最大值。它还采用了</text><text x="486.16" y="559.57" font-size="11.00" class="sc-loraregular">160K</text><text x="72.00 76.26 82.69 88.52 94.48" y="575.19" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="575.19" font-size="11.00" class="sc-notoserifcjksc">的任务预算（而非</text><text x="194.95" y="575.19" font-size="11.00" class="sc-loraregular">980K</text><text x="221.83" y="575.19" font-size="11.00" class="sc-notoserifcjksc">），以适配其</text><text x="290.72" y="575.19" font-size="11.00" class="sc-loraregular">200K</text><text x="320.70" y="575.19" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="72.00" y="142.73" width="40.72" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="112.72" y="142.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="123.72" y="142.73" width="26.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="150.11" y="142.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="153.00" y="142.73" width="21.74" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="174.74" y="142.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="177.63" y="142.73" width="26.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="204.26" y="142.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="207.16" y="142.73" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="253.79" y="142.73" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

72.00" y="423.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="423.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 112.51 115.98 118.35 124.54 130.13 134.85 139.17 142.88 147.98 152.99 157.27 161.98 167.36 172.80" y="423.42" font-size="9.00" class="sc-lorabold">8.9.1.B] Chartography</text><text x="180.13" y="423.42" font-size="9.00" class="sc-notoserifcjkscbold">分数（使用工具与不使用工具）。</text><text x="315.13 322.07 326.72 329.25 334.08 339.45 341.82 346.70 348.91" y="423.42" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="356.18" y="423.42" font-size="9.00" class="sc-notoserifcjksc">没有推理强度设置，在最高</text><text x="466.55" y="423.42" font-size="9.00" class="sc-loraregular">32k</text><text x="483.60" y="423.42" font-size="9.00" class="sc-notoserifcjksc">的固定扩展思</text><text x="72.00" y="435.12" font-size="9.00" class="sc-notoserifcjksc">考预算下运行。所有其他模型均使用自适应思考，在不同推理强度档位下评估，分别在使用工具和不使用工具的条件下</text><text x="72.00" y="446.83" font-size="9.00" class="sc-notoserifcjksc">进行。我们使用</text><text x="137.37 142.24 145.38 148.37 153.64 157.60" y="446.83" font-size="9.00" class="sc-loraregular">effort</text><text x="163.45" y="446.83" font-size="9.00" class="sc-notoserifcjksc">参数来调节所花费的测试时计算量。分数为每个推理强度档位下五次运行的平均值。图中显示</text><text x="72.00" y="458.52" font-size="9.00" class="sc-loraregular">95%</text><text x="92.30" y="458.52" font-size="9.00" class="sc-notoserifcjksc">置信区间。成本按标准定价乘以每次运行的</text><text x="265.67 269.15 274.42 279.19 284.07" y="458.52" font-size="9.00" class="sc-loraregular">token</text><text x="291.90" y="458.52" font-size="9.00" class="sc-notoserifcjksc">用量计算，包括实际的提示缓存读写。</text><text x="444.90 451.19 453.64 458.23 463.60 468.98 473.86 476.23 483.17 487.82 490.35 495.18 500.55 502.92 507.82 510.04" y="458.52" font-size="9.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="517.31" y="458.52" font-size="9.00" class="sc-notoserifcjksc">按每</text><text x="72.00" y="470.23" font-size= ze="11.00" class="sc-notoserifcjksc">成，涵盖</text><text x="118.89" y="576.54" font-size="11.00" class="sc-loraregular">106</text><text x="138.98" y="576.54" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="328.87" y="576.54" font-size="11.00" class="sc-loraregular">ISO</text><text x="347.53" y="576.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="358.53 366.61 370.30" y="576.54" font-size="11.00" class="sc-loraregular">DIN</text><text x="378.68" y="576.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="389.68" y="576.54" font-size="11.00" class="sc-loraregular">EN</text><text x="404.90" y="576.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="415.90" y="576.54" font-size="11.00" class="sc-loraregular">ASME</text><text x="448.86" y="576.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="462.75" y="576.54" font-size="11.00" class="sc-loraregular">IEC</text><text x="483.86" y="576.54" font-size="11.00" class="sc-notoserifcjksc">规格表为依</text><text x="72.00" y="592.16" font-size="11.00" class="sc-notoserifcjksc">据。该基准将</text><text x="140.89 148.47 155.36" y="592.16" font-size="11.00" class="sc-loraregular">CAD</text><text x="166.45" y="592.16" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务。我们报告</text><text x="378.34 385.36 388.45 393.54 396.63 403.07 409.74 415.65 423.34 429.77 436.35" y="592.16" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="445.21" y="592.16" font-size="11.00" class="sc-notoserifcjksc">任务上的结果，该</text><text x="72.00" y="607.78" font-size="11.00" class="sc-notoserifcjksc">任务要求模型根据多视图渲染图生成</text><text x="250.89 258.58 264.26 270.71 279.47 286.04 292.00 296.95" y="607.78" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="305.65" y="607.78" font-size="11.00" class="sc-notoserifcjksc">代码。</text><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="248.79" y="707.20" width="157.90" height="12.80" fill="transparent"/>
