notoserifcjksc">的得分分别为</text><text x="411.03 417.69 420.39 424.40 430.39" y="212.10" font-size="11.00" class="sc-loraregular">0.155</text><text x="439.28" y="212.10" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="453.17 459.83 462.53 468.44 472.44" y="212.10" font-size="11.00" class="sc-loraregular">0.210</text><text x="479.28" y="212.10" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="490.28 497.96 500.96 506.57 513.13 519.71" y="212.10" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="227.73" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="227.73" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="164.54 171.20 173.55 178.47 184.43" y="227.73" font-size="11.00" class="sc-loraregular">0.747</text><text x="192.39" y="227.73" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="206.29 212.94 215.65 222.01 228.36" y="227.73" font-size="11.00" class="sc-loraregular">0.963</text><text x="234.49" y="227.73" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="567.20" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="567.20" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.02 108.12 113.65 117.13 119.49 125.44 130.28 136.03 140.69 146.16 152.29 158.30 165.13 167.50 173.64 176.58 180.95 183.89 188.98 194.72 199.52 205.71 210.81 216.17" y="567.20" font-size="9.00" class="sc-lorabold">8.9.2.A] BenchCAD Vision2Code</text><text x="223.38" y="567.20" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="268.38 275.33 279.97 282.50 287.33 292.71 295.07 299.95 302.17" y="567.20" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="309.44" y="567.20" font-size="9.00" class="sc-notoserifcjksc">没有推理强度设置，在最高</text><text x="419.80" y="567.20" font-size="9.00" class="sc-loraregular">32k</text><text x="436.85" y="567.20" font-size="9.00" class="sc-notoserifcjksc">的固定扩展思考预算下运</text><text x="72.00" y="578.90" font-size="9.00" class="sc-notoserifcjksc">行。所有其他</text><text x="128.37 134.66 137.11 141.70 147.07 152.45" y="578.90" font-size="9.00" class="sc-loraregular">Claude</text><text x="159.70" y="578.90" font-size="9.00" class="sc-notoserifcjksc">模型均使用自适应思考和</text><text x="261.06" y="578.90" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="279.63" y="578.90" font-size="9.00" class="sc-notoserifcjksc">推理强度，在使用工具和不使用工具两种条件下评估。得分为五次</text><text x="72.00" y="590.60" font-size="9.00" class="sc-notoserifcjksc">运行的平均值，并附</text><text x="155.37" y="590.60" font-size="9.00" class="sc-loraregular">95%</text><text x="175.67" y="590.60" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="619.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="619.93" font-size="11.00" class="sc-notoserifcjksc">在该评估上的表现随测试时计算的增加而大幅提升，尤其是当模型拥有能够对中间输出进</text><text x="72.00" y="635.55" font-size="11.00" class="sc-notoserifcjksc">行视觉验证的工具时。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">127</text><text x="72.00" y="423.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="423.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.02 108.12 113.65 117.13 119.49 125.44 130.28 136.03 140.69 146.16 152.29 158.30 165.13 167.50 173.64 176.58 180.95 183.89 188.98 194.72 199.52 205.71 210.81 216.17" y="423.42" font-size="9.00" class="sc-lorabold">8.9.2.B] BenchCAD Vision2Code</text><text x="223.38" y="423.42" font-size="9.00" class="sc-notoserifcjkscbold">子集得分（使用工具与不使用工具）。</text><text x="376.38 383.33 387.97 390.50 395.33 400.71 403.07 407.95 410.17" y="423.42" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="417.44" y="423.42" font-size="9.00" class="sc-notoserifcjksc">没有推理强度设置，在最高</text><text x="72.00" y="435.12" font-size="9.00" class="sc-loraregular">32k</text><text x="89.05" y="435.12" font-size="9.00" class="sc-notoserifcjksc">的固定扩展思考预算下运行。所有其他模型均使用自适应思考，在不同推理强度档位下评估，分别在使用工具和不</text><text x="72.00" y="446.83" font-size="9.00" class="sc-notoserifcjksc">使用工具的条件下进行。我们使用</text><text x="209.37 214.25 217.38 220.37 225.64 229.60" y="446.83" font-size="9.00" class="sc-loraregular">effort</text><text x="235.45" y="446.83" font-size="9.00" class="sc-notoserifcjksc">参数来调节所花费的测试时计算量。得分为每个推理强度档位下五次运行的</text><text x="72.00" y="458.52" font-size="9.00" class="sc-notoserifcjksc">平均值。图中显示</text><text x="146.37" y="458.52" font-size="9.00" class="sc-loraregular">95%</text><text x="166.67" y="458.52" font-size="9.00" class="sc-notoserifcjksc">置信区间。成本按标准定价乘以每次运行的</text><text x="340.04 343.52 348.79 353.56 358.43" y="458.52" font-size="9.00" class="sc-loraregular">token</text><text x="366.26" y="458.52" font-size="9.00" class="sc-notoserifcjksc">用量计算，包括实际的提示缓存读写。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.28 114.92 117.45 122.28 127.66 130.02 134.93 137.14" y="470.23" font-size="9.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="144.41" y="470.23" font-size="9.00" class="sc-notoserifcjksc">按每个请求的提示长度（高于或低于</text><text x="290.78 294.06 299.65 305.24 311.38 313.75 317.23 322.50 327.27 332.15" y="470.23" font-size="9.00" class="sc-loraregular">100K token</text><text x="337.61" y="470.23" font-size="9.00" class="sc-notoserifcjksc">）所对应的费率逐请求计费。</text><text x="454.61 460.90 463.35 467.94 473.31 478.69 483.57 485.94 491.04 496.30 501.77 507.23 512.05 515.53 517.90 522.80 525.02" y="470.23" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="72.00" y="481.92" font-size="9.00" class="sc-notoserifcjksc">使用自</text><text x="101.37 106.20 111.73 116.56" y="481.92" font-size="9.00" class="sc-loraregular">2026</text><text x="124.13" y="481.92" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="135.49" y="481.92" font-size="9.00" class="sc-loraregular">10</text><text x="146.73" y="481.92" font-size="9.00" class="sc-notoserifcjksc">月</text><text x="158.09" y="481.92" font-size="9.00" class="sc-loraregular">7</text><text x="164.61" y="481.92" font-size="9.00" class="sc-notoserifcjksc">日起更新的缓存读取价格。</text><text x="72.00" y="533.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.9.3 OSWorld 2.1</text><text x="185.28" y="533.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">离线子集</text><text x="72.00 80.73 86.97 97.49 103.92 108.64 111.63 118.21 121.10 127.01 129.72" y="560.92" font-size="11.00" class="sc-loraregular">OSWorld 2.1</text><text x="133.72" y="557.25" font-size="6.60" class="sc-loraregular">20</text><text x="144.26" y="560.92" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="202.15" y="560.92" font-size="11.00" class="sc-loraregular">108</text><text x="222.06" y="560.92" font-size="11.00" class="sc-notoserifcjksc">项长程计算机使用（</text><text x="321.06 326.86 333.29 343.13 349.69 356.26 360.52 366.48 371.24 374.13 380.70 385.79" y="560.92" font-size="11.00" class="sc-loraregular">computer use</text><text x="391.76" y="560.92" font-size="11.00" class="sc-notoserifcjksc">）任务的基准测试，任务中智</text><text x="72.00" y="576.54" font-size="11.00" class="sc-notoserifcjksc">能体通过截图以及鼠标和键盘操作来操控一台运行中的</text><text x="338.89 347.17 353.57 360.13 366.71 370.97" y="576.54" font-size="11.00" class="sc-loraregular">Ubuntu</text><text x="380.43" y="576.54" font-size="11.00" class="sc-notoserifcjksc">虚拟机。与以往的系统卡一样，</text><text x="72.00" y="592.16" font-size="11.00" class="sc-notoserifcjksc">我们报告两项指标：部分得分（各任务在所有检查点上所获分数的平均值）和严格通过率（所有</text><text x="72.00" y="607.78" font-size="11.00" class="sc-notoserifcjksc">检查点均满足的任务所占比例），二者均为每项任务五次独立尝试平均的</text><text x="426.89 433.48 439.16 444.25 449.34 458.10" y="607.78" font-size="11.00" class="sc-loraregular">Pass@1</text><text x="462.10" y="607.78" font-size="11.00" class="sc-notoserifcjksc">。我们使用了该</text><text x="72.00" y="676.17" font-size="6.00" class="sc-loraregular">20</text><text x="212.62 218.52 222.49 226.36 232.33 236.96 239.46 243.15 250.05 255.21 259.54 264.84 267.65 272.31 274.77 280.62 284.90 290.43 297.33 302.49 308.31 312.59 319.49 324.86 330.64 336.85 342.63 345.09 350.46 356.24 361.69 367.02" y="693.70" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2606.29537</text><text x="371.63" y="693.70" font-size="10.00" class="sc-notoserifcjksc">。</text><text x="381.63 389.57 395.24 404.80 410.65 414.94 417.66 423.64 426.27 431.64 434.10" y="693.70" font-size="10.00" class="sc-loraregular">OSWorld 2.1</text><text x="440.37" y="693.70" font-size="10.00" class="sc-notoserifcjksc">是</text><text x="453.00 460.94 466.61 476.17 482.02 486.31 489.03 495.01 497.64 503.01 505.32" y="693.70" font-size="10.00" class="sc-loraregular">OSWorld 2.0</text><text x="514.16" y="693.70" font-size="10.00" class="sc-notoserifcjksc">的最</text><text x="72.00" y="707.90" font-size="10.00" class="sc-notoserifcjksc">新版本，包含了作者后续的修复。</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="212.62" y="685.70" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="250.05" y="685.70" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="250.05" y="685.70" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="297.33" y="685.70" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="297.33" y="685.70" width="74.30" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">128</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">基准测试的默认设置（</text><text x="182.00" y="82.61" font-size="11.00" class="sc-loraregular">1080p</text><text x="215.31" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分辨率，每项任务最多</text><text x="328.20" y="82.61" font-size="11.00" class="sc-loraregular">500</text><text x="350.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个操作步数），推理强度为</text><text x="485.64" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="505.45" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。对于</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">需要评分模型的任务，我们使用</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04 303.00 305.71" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="311.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="131.71" font-size="11.00" class="sc-notoserifcjksc">自</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="131.71" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="171.63" y="131.71" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="185.52 193.21 196.20 201.81 208.38 214.96 220.92 223.81 230.05 236.48 243.16 249.84 255.72 259.98 262.87 268.87 271.57" y="131.71" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Sonnet 5.5</text><text x="280.46" y="131.71" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="313.46" y="131.71" font-size="11.00" class="sc-notoserifcjksc">起，我们改为报告该基准测试的官方离线子</text><text x="72.00" y="147.33" font-size="11.00" class="sc-notoserifcjksc">集：即其</text><text x="118.89" y="147.33" font-size="11.00" class="sc-loraregular">108</text><text x="138.80" y="147.33" font-size="11.00" class="sc-notoserifcjksc">项任务中列入该基准测试离线任务清单的</text><text x="339.70" y="147.33" font-size="11.00" class="sc-loraregular">82</text><text x="354.68" y="147.33" font-size="11.00" class="sc-notoserifcjksc">项，且智能体的虚拟机不提供互联网</text><text x="72.00" y="162.95" font-size="11.00" class="sc-notoserifcjksc">访问。本节中的所有</text><text x="173.89 180.78 187.36 191.61 198.20 202.89 209.32 215.89 218.98" y="162.95" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="227.73" y="162.95" font-size="11.00" class="sc-notoserifcjksc">模型均在相同配置下评估，但</text><text x="373.62 381.31 384.30 389.91 396.48 403.06 409.02 411.91 420.40 426.08 429.17 435.08 441.64 444.54 450.50 453.21" y="162.95" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="462.09" y="162.95" font-size="11.00" class="sc-notoserifcjksc">除外，它以固定</text><text x="72.00" y="178.57" font-size="11.00" class="sc-notoserifcjksc">的思考预算运行，且未使用服务端上下文压缩。</text><text x="303.00 311.37 318.04 324.37 329.75 336.11 338.82 342.82 345.71 351.95 358.39" y="178.57" font-size="11.00" class="sc-loraregular">GPT-6.1 Sol</text><text x="364.27" y="178.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.16 386.53 393.20 399.54 404.92 411.27 414.17 420.52 427.09 433.77" y="178.57" font-size="11.00" class="sc-loraregular">GPT-6 Luna</text><text x="442.34" y="178.57" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="456.23 463.12 469.69 473.95 480.54 485.23 491.66 498.23 501.32" y="178.57" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="510.06" y="178.57" font-size="11.00" class="sc-notoserifcjksc">通过</text><text x="72.00" y="194.19" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="113.40" y="194.19" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="127.30 134.18 140.79" y="194.19" font-size="11.00" class="sc-loraregular">API</text><text x="147.37" y="194.19" font-size="11.00" class="sc-notoserifcjksc">在同样的</text><text x="194.27" y="194.19" font-size="11.00" class="sc-loraregular">82</text><text x="209.25" y="194.19" font-size="11.00" class="sc-notoserifcjksc">项任务上运行，并使用</text><text x="322.14" y="194.19" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="363.54" y="194.19" font-size="11.00" class="sc-notoserifcjksc">自身的上下文压缩。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="261.25" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="261.25" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="229.40" y="261.25" font-size="11.00" class="sc-loraregular">72.4%</text><text x="258.61" y="261.25" font-size="11.00" class="sc-notoserifcjksc">，严格通过率为</text><text x="338.51 344.37 348.96 351.66 355.67" y="261.25" font-size="11.00" class="sc-loraregular">37.1%</text><text x="365.24" y="261.25" font-size="11.00" class="sc-notoserifcjksc">。在相同条件下重新评估后，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="276.87" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="276.87" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="235.83" y="276.87" font-size="11.00" class="sc-loraregular">83.9%</text><text x="266.78" y="276.87" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="346.67" y="276.87" font-size="11.00" class="sc-loraregular">48.8%</text><text x="377.27" y="276.87" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="388.27 395.96 398.95 404.56 411.13 417.71 423.67 426.56 435.30 441.86 448.43 453.52 456.42 462.41 465.12" y="276.87" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="474.01" y=" ifcjksc">荐用于前沿模型。我们以智能体方式进行评估，相关文档已预先选定，并以提取后的文本形式提</text><text x="72.00" y="598.52" font-size="11.00" class="sc-notoserifcjksc">供。</text><text x="72.00" y="632.62" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="632.62" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="108.59" y="632.62" font-size="11.00" class="sc-notoserifcjksc">推理强度下（五次运行的平均值），</text><text x="284.59 292.28 295.27 300.88 307.45 314.03 319.99 322.88 331.37 337.05 340.14 346.05 352.61 355.51 361.50 364.21" y="632.62" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="373.10" y="632.62" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="436.55" y="632.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="472.45" y="632.62" font-size="11.00" class="sc-loraregular">73.5%</text><text x="501.92" y="632.62" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="142.25" y="648.24" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="178.14 184.50 191.15 193.86 199.99" y="648.24" font-size="11.00" class="sc-loraregular">60.3%</text><text x="209.55" y="648.24" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="245.45 253.14 256.13 261.74 268.31 274.88 280.85 283.74 292.23 297.91 301.00 306.91 313.47 316.37 322.33 325.03" y="648.24" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="333.92" y="648.24" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="347.81 354.17 360.30 362.84 369.67" y="648.24" font-size="11.00" class="sc-loraregular">63.0%</text><text x="382.13" y="648.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="396.03 401.99 406.58 409.28 413.29" y="648.24" font-size="11.00" class="sc-loraregular">47.1%</text><text x="422.86" y="648.24" font-size="11.00" class="sc-notoserifcjksc">。它落后于</text><text x="480.75 488.44 491.43 497.04 503.61 510.19" y="648.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="663.86" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="125.76" y="663.86" font-size="11.00" class="sc-notoserifcjksc">，后者得分为</text><text x="194.65" y="663.86" font-size="11.00" class="sc-loraregular">76.9%</text><text x="227.61" y="663.86" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="241.50 247.86 253.85 256.45 262.81" y="663.86" font-size="11.00" class="sc-loraregular">65.6%</text><text x="272.38" y="663.86" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="283.38 291.07 294.06 299.67 306.23 312.81 318.77 321.67 330.16 335.83 338.93 344.83 351.40 354.29 360.26 362.96" y="663.86" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="371.85" y="663.86" font-size="11.00" class="sc-notoserifcjksc">没有推理强度设置，因此改为以</text><text x="72.00 76.00 81.91 88.09 94.00 96.89 101.15 107.58 113.42 119.38" y="679.48" font-size="11.00" class="sc-loraregular">128k token</text><text x="128.95" y="679.48" font-size="11.00" class="sc-notoserifcjksc">的思考预算运行。</text></svg></div>

子表格。模型在智能体循环中获得</text><text x="239.89" y="161.89" font-size="11.00" class="sc-loraregular">shell</text><text x="266.41" y="161.89" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，表现通过</text><text x="500.31" y="161.89" font-size="11.00" class="sc-loraregular">Elo</text><text x="519.47" y="161.89" font-size="11.00" class="sc-notoserifcjksc">评分</text><text x="72.00" y="177.51" font-size="11.00" class="sc-notoserifcjksc">衡量；该评分来自对模型输出的盲评两两比较，并以</text><text x="327.89 336.09 342.00 347.96 354.46 360.70 366.60 372.56 378.47 381.36 388.27 394.23 396.94 400.94 403.84 409.87 412.86 418.53 423.63" y="177.51" font-size="11.00" class="sc-loraregular">DeepSeek V4.1 Flash</text><text x="430.21" y="177.51" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="441.21" y="177.51" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="461.02" y="177.51" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="485.91" y="177.51" font-size="11.00" class="sc-loraregular">1600</text><text x="512.83" y="177.51" font-size="11.00" class="sc-notoserifcjksc">分为</text><text x="72.00" y="193.13" font-size="11.00" class="sc-notoserifcjksc">锚点。</text><text x="72.00" y="255.09" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="255.09" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="108.59" y="255.09" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="174.59 182.28 185.27 190.88 197.45 204.03 209.99 212.88 221.37 227.05 230.14 236.05 242.61 245.51 251.50 254.21" y="255.09" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="263.10" y="255.09" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="276.99" y="255.09" font-size="11.00" class="sc-loraregular">Elo</text><text x="296.15" y="255.09" font-size="11.00" class="sc-notoserifcjksc">评分为</text><text x="332.04" y="255.09" font-size="11.00" class="sc-loraregular">1620</text><text x="355.14" y="255.09" fon nt-size="11.00" class="sc-notoserifcjksc">的</text><text x="276.99" y="465.03" font-size="11.00" class="sc-loraregular">Elo</text><text x="296.15" y="465.03" font-size="11.00" class="sc-notoserifcjksc">评分为</text><text x="332.04" y="465.03" font-size="11.00" class="sc-loraregular">1578</text><text x="353.30" y="465.03" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="389.19 396.88 399.87 405.48 412.05 418.62 424.59 427.48 435.97 441.65 444.74 450.65 457.21 460.11 466.07 468.77" y="465.03" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="477.66" y="465.03" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="491.55" y="465.03" font-size="11.00" class="sc-loraregular">614</text><text x="507.88" y="465.03" font-size="11.00" class="sc-notoserifcjksc">。它落</text><text x="72.00" y="480.65" font-size="11.00" class="sc-notoserifcjksc">后于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 141.42 147.86 154.53 161.21 167.10 171.35 174.24 180.24 182.95" y="480.65" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="188.94" y="480.65" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="199.94 203.95 210.13 215.79" y="480.65" font-size="11.00" class="sc-loraregular">1824</text><text x="221.75" y="480.65" font-size="11.00" class="sc-notoserifcjksc">），领先于</text><text x="279.65 288.02 294.68 301.02 306.40 312.76 315.65 322.01 328.58 335.25" y="480.65" font-size="11.00" class="sc-loraregular">GPT-6 Luna</text><text x="340.93" y="480.65" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="351.93" y="480.65" font-size="11.00" class="sc-loraregular">1336</text><text x="374.54" y="480.65" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="399.44" y="480.65" font-size="11.00" class="sc-loraregular">Gemini 3.8 Flash</text><text x="483.64" y="480.65" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="494.64" y="480.65" font-size="11.00" class="sc-loraregular">1203</tex <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">136</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 131.65 135.14 140.45" y="367.93" font-size="9.00" class="sc-lorabold">8.12.2.A] MILU</text><text x="149.66" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">平均准确率。</text><text x="203.66" y="367.93" font-size="9.00" class="sc-notoserifcjksc">所有</text><text x="224.03 230.32 232.77 237.36 242.73 248.11" y="367.93" font-size="9.00" class="sc-loraregular">Claude</text><text x="255.36" y="367.93" font-size="9.00" class="sc-notoserifcjksc">模型均使用</text><text x="302.72" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="321.29" y="367.93" font-size="9.00" class="sc-notoserifcjksc">推理强度下的自适应思考，并在启用安全分类器的情况</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">下运行；被拦截或未作答的问题（四个模型均不足</text><text x="272.37 277.81 280.03 284.86" y="379.63" font-size="9.00" class="sc-loraregular">0.2%</text><text x="292.69" y="379.63" font-size="9.00" class="sc-notoserifcjksc">）不计入平均值，而非按答错计分。</text><text x="436.69 442.98 445.43 450.02 455.39 460.77 465.65 468.02 475.16 480.54 485.91 490.08 492.44 497.35 499.56" y="379.63" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="504.47" y="379.63" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 107.90 112.54 117.78 120.23 125.11 127.48 132.38 134.60" y="391.33" font-size="9.00" class="sc-loraregular">Claude Fable 5.1</text><text x="140.24" y="391.33" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="151.60 157.90 160.34 164.93 170.31 175.69 180.57 182.93 188.04 193.30 198.76 204.23 209.04 212.53 214.89 219.80 222.01" y="391.33" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="229.28" y="391.33" font-size="9.00" class="sc-notoserifcjksc">的数值取自各自系统卡中的报告。得分为五次试验的平均值。未向任何模型提</text><text x="72.00" y="403.03" font-size="9.00" class="sc-notoserifcjksc">供工具或定制的系统提示词。附</text><text x="200.37" y="403.03" font-size="9.00" class="sc-loraregular">95%</text><text x="220.67" y="403.03" font-size="9.00" class="sc-notoserifcjksc">置信区间（约</text><text x="277.04 281.81 287.25 289.33 294.92" y="403.03" font-size="9.00" class="sc-loraregular">±0.04</text><text x="302.17" y="403.03" font-size="9.00" class="sc-notoserifcjksc">至</text><text x="313.53 318.30 323.75 325.83 331.42" y="403.03" font-size="9.00" class="sc-loraregular">±0.08</text><text x="336.47" y="403.03" font-size="9.00" class="sc-notoserifcjksc">，过小而无法看出）。</text><text x="72.00" y="454.75" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="454.75" font-size="14.00" class="sc-notosanscjkscbold">生命科学能力</text><text x="72.00" y="481.31" font-size="11.00" class="sc-notoserifcjksc">本节报告对支持有益生命科学研究的能力所做的评估，涵盖生物信息学、基于细胞的检测、生物</text><text x="72.00" y="496.93" font-size="11.00" class="sc-notoserifcjksc">医学图像分析、药物化学、蛋白质设计和实验方案。除非另有说明，</text><text x="402.00 409.69 412.68 418.29 424.86 431.44" y="496.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="440.29" y="496.93" font-size="11.00" class="sc-notoserifcjksc">的每项得分均为每道</text><text x="72.00" y="512.55" font-size="11.00" class="sc-notoserifcjksc">题五次尝试的平均值，采样时使用自适应思考，推理强度为</text><text x="360.89" y="512.55" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="380.70" y="512.55" font-size="11.00" class="sc-notoserifcjksc">。我们通过</text><text x="438.59 445.48 452.09" y="512.55" font-size="11.00" class="sc-loraregular">API</text><text x="458.66" y="512.55" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="483.56 492.05 497.73 500.82 506.72" y="512.55" font-size="11.00" class="sc-loraregular">Haiku</text><text x="72.00" y="528.17" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70" y="528.17" font-size="11.00" class="sc-notoserifcjksc">，并关闭了其生物安全防护措施，因此这些结果反映的是底层模型的能力，而非已部署系统的</text><text x="72.00" y="543.79" font-size="11.00" class="sc-notoserifcjksc">能力。在可获得的情况下，我们还报告了</text><text x="272.89" y="543.79" font-size="11.00" class="sc-loraregular">GPT</text><text x="294.97" y="543.79" font-size="11.00" class="sc-notoserifcjksc">‑</text><text x="298.78" y="543.79" font-size="11.00" class="sc-loraregular">6 Luna</text><text x="336.20" y="543.79" font-size="11.00" class="sc-notoserifcjksc">的得分（通过</text><text x="405.09 413.83 420.39 426.35 433.03 439.92 443.60 446.49 453.38 459.99" y="543.79" font-size="11.00" class="sc-loraregular">OpenAI API</text><text x="466.57" y="543.79" font-size="11.00" class="sc-notoserifcjksc">运行，推理强</text><text x="72.00" y="559.41" font-size="11.00" class="sc-notoserifcjksc">度为</text><text x="96.89" y="559.41" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="116.70" y="559.41" font-size="11.00" class="sc-notoserifcjksc">），以及</text><text x="163.59" y="559.41" font-size="11.00" class="sc-loraregular">Gemini 3.8 Flash</text><text x="250.69" y="559.41" font-size="11.00" class="sc-notoserifcjksc">的得分（通过</text><text x="319.58 327.95 334.39 340.82 347.17 350.16" y="559.41" font-size="11.00" class="sc-loraregular">Google</text><text x="359.02" y="559.41" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="372.91 379.66 385.62 390.46 394.72 400.63 406.46 409.35 416.24 419.92 422.82 429.70 436.31" y="559.41" font-size="11.00" class="sc-loraregular">Vertex AI API</text><text x="442.89" y="559.41" font-size="11.00" class="sc-notoserifcjksc">运行，使用最高思</text><text x="72.00" y="575.03" font-size="11.00" class="sc-notoserifcjksc">考档位）。在任一模型上被安全过滤器拦截的尝试均不计入我们的评估结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 103.37 106.75 112.52 121.33 126.17 133.97 142.40 150.59 154.02 162.31 165.69 173.88 177.31 185.60 189.03 197.46 201.78 210.07 215.06 228.56 237.37 242.21 245.64 253.44" y="553.14" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.1 LatchBio Bioinformatics</text><text x="504.00 507.28 512.07" y="751.81" font-size="9.00" class="sc-loraregular">137</text><text x="72.00" y="507.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="507.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 110.41" y="507.75" font-size="9.00" class="sc-lorabold">8.13.A]</text><text x="116.25" y="507.75" font-size="9.00" class="sc-notoserifcjkscbold">生命科学基准测试。</text><text x="197.25 204.20 208.84 211.37 216.21 221.58 223.95 228.85 231.07" y="507.75" font-size="9.00" class="sc-loraregular">Haiku 5.5</text><text x="238.34" y="507.75" font-size="9.00" class="sc-notoserifcjksc">及对比模型在所示各项基准测试上的表现。各基准测试的结果将在以下各节</text><text x="72.00" y="519.45" font-size="9.00" class="sc-notoserifcjksc">中讨论。</text><text x="72.00" y="583.22" font-size="11.00" class="sc-notoserifcjksc">这组评估由</text><text x="129.89 136.49 142.09 146.35 152.20 158.72 165.48 168.57" y="583.22" font-size="11.00" class="sc-loraregular">LatchBio</text><text x="177.90" y="583.22" font-size="11.00" class="sc-notoserifcjksc">开发，用于评估模型解决具有挑战性的真实世界生物信息学问题的能力。</text><text x="183.88" y="598.84" font-size="11.00" class="sc-notoserifcjksc">变体测试对空间转录组学和染色质可及性数据的分析，</text><text x="447.88 454.05 457.14 463.82 470.17 473.16 479.12 486.81 492.77 495.76 498.67 505.51 511.47 518.15 524.00" y="598.84" font-size="11.00" class="sc-loraregular">SingleCellBench</text><text x="72.00" y="614.46" font-size="11.00" class="sc-notoserifcjksc">变体测试对单细胞</text><text x="162.89" y="614.46" font-size="11.00" class="sc-loraregular">RNA</text><text x="187.96" y="614.46" font-size="11.00" class="sc-notoserifcjksc">测序数据的分析。在这两个变体中，</text><text x="363.96 371.65 374.64 380.25 386.82 393.40" y="614.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="402.25" y="614.46" font-size="11.00" class="sc-notoserifcjksc">均可使用用于代码执行的</text><text x="72.00" y="630.08" font-size="11.00" class="sc-loraregular">bash</text><text x="98.65" y="630.08" font-size="11.00" class="sc-notoserifcjksc">工具、一个文件编辑器以及一组预先指定的已安装软件包。</text><text x="384.65 392.34 395.33 400.94 407.51 414.09 420.05 422.94 431.44 437.11 440.20 446.11 452.68 455.57 461.56 464.27" y="630.08" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="473.16" y="630.08" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="183.88" y="645.70" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="219.77 226.05 230.64 233.00 238.07" y="645.70" font-size="11.00" class="sc-loraregular">67.7%</text><text x="247.64" y="645.70" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="272.53 278.70 281.79 288.47 294.82 297.81 303.77 311.46 317.42 320.41 323.32 330.16 336.12 342.80 348.65" y="645.70" font-size="11.00" class="sc-loraregular">SingleCellBench</text><text x="358.13" y="645.70" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="394.03" y="645.70" font-size="11.00" class="sc-loraregular">56.2%</text><text x="424.56" y="645.70" font-size="11.00" class="sc-notoserifcjksc">，表现约与</text><text x="482.45 490.14 493.14 498.75 505.31 511.89" y="645.70" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="661.32" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="117.06" y="661.32" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="128.06" y="661.32" font-size="11.00" class="sc-loraregular">68.9%</text><text x="162.12" y="661.32" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="176.02" y="661.32" font-size="11.00" class="sc-loraregular">56.5%</text><text x="206.64" y="661.32" font-size="11.00" class="sc-notoserifcjksc">）相当。</text><text x="445.00" y="385.30" font-size="6.10" class="sc-notosanscjkscbold" fill="#141413">理解（</text><text x="463.30" y="385.30" font-size="6.10" class="sc-poppinssemibold" fill="#141413">V2</text><text x="471.14" y="385.30" font-size="6.10" class="sc-notosanscjkscbold" fill="#141413">）</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p138.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 138 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">138</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.2</text><text x="110.17" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">形态</text><text x="136.17" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">–</text><text x="145.29" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">分子匹配</text><text x="72.00" y="111.04" font-size="11.00" class="sc-notoserifcjksc">该基准测试与</text><text x="140.89 148.08 153.91 157.00 163.43 173.27 176.16 182.91 186.00" y="111.04" font-size="11.00" class="sc-loraregular">Axiom Bio</text><text x="195.33" y="111.04" font-size="11.00" class="sc-notoserifcjksc">合作开发，评估模型能否将来自</text><text x="352.23 359.41 365.24 368.33 374.76" y="111.04" font-size="11.00" class="sc-loraregular">Axiom</text><text x="387.49" y="111.04" font-size="11.00" class="sc-notoserifcjksc">的人类肝脏体外检测的四组多</text><text x="72.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">通道细胞成像数据，与处理每组图像中各孔的四种顺序被打乱的分子</text><text x="402.00" y="126.66" font-size="11.00" class="sc-loraregular">–</text><text x="408.49" y="126.66" font-size="11.00" class="sc-notoserifcjksc">剂量扰动相匹配。</text><text x="496.49 504.18 507.17 512.78 519.35 525.93" y="126.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="142.28" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.22" y="142.28" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="147.11" y="142.28" font-size="11.00" class="sc-loraregular">25.4%</text><text x="177.25" y="142.28" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="202.14 209.83 212.82 218.43 225.00 231.58 237.54 240.43 246.67 253.10 259.78 266.46 272.34 276.60 279.49 285.49 288.19" y="142.28" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="294.19" y="142.28" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="305.19 311.10 317.09 319.63 326.46" y="142.28" font-size="11.00" class="sc-loraregular">25.0%</text><text x="336.03" y="142.28" font-size="11.00" class="sc-notoserifcjksc">）持平。</text><text x="72.00" y="190.34" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.3</text><text x="110.49" y="190.34" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">药物化学</text><text x="72.00" y="218.24" font-size="11.00" class="sc-notoserifcjksc">该基准测试评估模型能否对类药分子的吸收、分布、代谢和排泄（</text><text x="391.00 397.89 405.97 416.07" y="218.24" font-size="11.00" class="sc-loraregular">ADME</text><text x="422.91" y="218.24" font-size="11.00" class="sc-notoserifcjksc">）相关性质进行推理。</text><text x="72.00" y="233.86" font-size="11.00" class="sc-loraregular">504</text><text x="93.68" y="233.86" font-size="11.00" class="sc-notoserifcjksc">道题中的每一道都以化学结构的形式给出若干来自药物发现项目的真实化合物，并询问哪个</text><text x="72.00" y="249.48" font-size="11.00" class="sc-notoserifcjksc">候选化合物在某一此类性质上的实测值最高或最低。</text><text x="325.00 332.69 335.68 341.29 347.86 354.44 360.40 363.29 371.78 377.46 380.55 386.46 393.02 395.92 401.91 404.62" y="249.48" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="413.51" y="249.48" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="438.40 444.39 450.58 453.12 459.95" y="249.48" font-size="11.00" class="sc-loraregular">58.0%</text><text x="469.52" y="249.48" font-size="11.00" class="sc-notoserifcjksc">，远高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="265.10" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="155.35" y="265.10" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.35" y="265.10" font-size="11.00" class="sc-loraregular">41.3%</text><text x="194.72" y="265.10" font-size="11.00" class="sc-notoserifcjksc">），比</text><text x="230.61 238.30 241.29 246.90 253.47 260.05 266.01 268.90 277.63 284.20 290.77 295.86 298.75 304.75 307.46" y="265.10" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="313.45" y="265.10" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="324.45" y="265.10" font-size="11.00" class="sc-loraregular">63.5%</text><text x="355.21" y="265.10" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="380.10 387.79 390.78 396.39 402.96 409.54 415.50 418.39 424.63 431.06 437.74 444.42 450.30 454.56 457.45 463.45 466.15" y="265.10" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="472.15" y="265.10" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="483.15" y="265.10" font-size="11.00" class="sc-loraregular">65.3%</text><text x="513.90" y="265.10" font-size="11.00" class="sc-notoserifcjksc">）低</text><text x="72.00" y="280.72" font-size="11.00" class="sc-notoserifcjksc">几个百分点。</text><text x="72.00" y="327.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.4</text><text x="111.30" y="327.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">蛋白质设计</text><text x="72.00" y="361.81" font-size="11.00" class="sc-notoserifcjksc">这些基准测试评估</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="361.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18" y="361.81" font-size="11.00" class="sc-notoserifcjksc">的蛋白质设计能力。序列生成任务（</text><text x="377.18 383.42 389.33 395.66 402.23 408.19 414.87 420.67 426.63 429.52 437.89 443.86 450.53 456.49 461.18 466.78 471.04 474.13 480.56 487.24 490.13 494.39 500.07 505.16" y="361.81" font-size="11.00" class="sc-loraregular">Sequence Generation task</text><text x="511.07" y="361.81" font-size="11.00" class="sc-notoserifcjksc">）评</text><text x="72.00" y="377.43" font-size="11.00" class="sc-notoserifcjksc">估</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="377.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18" y="377.43" font-size="11.00" class="sc-notoserifcjksc">在多种设计约束条件下生成新型蛋白质序列的能力。文库排序任务（</text><text x="454.18 460.54 463.63 470.04 474.72 480.40 485.35 491.16 494.05 500.96 506.63 513.31 519.22 522.31 528.98" y="377.43" font-size="11.00" class="sc-loraregular">Library Ranking</text><text x="72.00" y="393.05" font-size="11.00" class="sc-loraregular">task</text><text x="92.93" y="393.05" font-size="11.00" class="sc-notoserifcjksc">）评估</text><text x="128.83 136.51 139.51 145.12 151.68 158.26" y="393.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="167.12" y="393.05" font-size="11.00" class="sc-notoserifcjksc">为实验测试确定蛋白质设计优先顺序的能力。我们在序列生成任务中每道题</text><text x="72.00" y="408.67" font-size="11.00" class="sc-notoserifcjksc">只运行</text><text x="107.89" y="408.67" font-size="11.00" class="sc-loraregular">1</text><text x="114.79" y="408.67" font-size="11.00" class="sc-notoserifcjksc">次尝试，在文库排序任务中每道题运行</text><text x="304.68" y="408.67" font-size="11.00" class="sc-loraregular">3</text><text x="313.70" y="408.67" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="357.70 366.19 371.87 374.96 380.87 387.44 390.33 396.32 399.03" y="408.67" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="407.92" y="408.67" font-size="11.00" class="sc-notoserifcjksc">在序列生成任务上得分</text><text x="72.00" y="424.29" font-size="11.00" class="sc-loraregular">33.1%</text><text x="100.53" y="424.29" font-size="11.00" class="sc-notoserifcjksc">，介于</text><text x="136.43 144.12 147.11 152.72 159.29 165.86 171.83 174.72 180.96 187.39 194.07 200.74 206.63 210.89 213.78" y="424.29" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="219.77" y="424.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="230.77 236.68 243.34 246.04 251.95" y="424.29" font-size="11.00" class="sc-loraregular">20.2%</text><text x="261.52" y="424.29" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="286.41 294.10 297.09 302.70 309.27 315.85 321.81 324.70 330.94 337.38 344.05 350.73 356.61 360.87 363.76 369.76 372.46" y="424.29" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="378.46" y="424.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="389.46 395.45 399.46 402.00 408.83" y="424.29" font-size="11.00" class="sc-loraregular">51.0%</text><text x="418.40" y="424.29" font-size="11.00" class="sc-notoserifcjksc">）之间；在文库排序任务</text><text x="72.00" y="439.91" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="107.89" y="439.91" font-size="11.00" class="sc-loraregular">45.3%</text><text x="138.25" y="439.91" font-size="11.00" class="sc-notoserifcjksc">，约与</text><text x="174.15 181.84 184.83 190.44 197.00 203.58 209.54 212.44 218.67 225.11 231.79 238.46 244.35 248.61 251.50" y="439.91" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="257.49" y="439.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="268.49 274.46 280.42 282.96 289.79" y="439.91" font-size="11.00" class="sc-loraregular">44.0%</text><text x="299.36" y="439.91" font-size="11.00" class="sc-notoserifcjksc">）相当，低于</text><text x="368.25 375.94 378.93 384.54 391.11 397.69 403.65 406.54 412.78 419.21 425.89 432.57 438.45 442.71 445.60 451.60 454.30" y="439.91" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="460.30" y="439.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="471.30" y="439.91" font-size="11.00" class="sc-loraregular">54.8%</text><text x="501.72" y="439.91" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="505.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.5</text><text x="111.08" y="505.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">生物医学图像分析</text><text x="72.00" y="533.77" font-size="11.00" class="sc-notoserifcjksc">该基准测试使用来自公开生物医学图像分析竞赛的数据，评估模型对生物医学图像进行定量分析</text><text x="72.00" y="549.39" font-size="11.00" class="sc-notoserifcjksc">的能力。任务输入涵盖</text><text x="184.89" y="549.39" font-size="11.00" class="sc-loraregular">CT</text><text x="199.62" y="549.39" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="210.62" y="549.39" font-size="11.00" class="sc-loraregular">MRI</text><text x="231.31" y="549.39" font-size="11.00" class="sc-notoserifcjksc">、组织病理、皮肤镜、视网膜、超声、显微及其他成像。我们对</text><text x="72.00" y="565.01" font-size="11.00" class="sc-notoserifcjksc">评分进行了缩放，以反映</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="565.01" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18" y="565.01" font-size="11.00" class="sc-notoserifcjksc">的表现相对于相应竞赛中所取得最佳结果的水平。我们每道题</text><text x="72.00" y="580.63" font-size="11.00" class="sc-notoserifcjksc">运行</text><text x="96.89" y="580.63" font-size="11.00" class="sc-loraregular">1</text><text x="103.79" y="580.63" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="147.79 155.48 158.47 164.08 170.65 177.23 183.19 186.08 194.57 200.25 203.34 209.25 215.81 218.71 224.70 227.41" y="580.63" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="236.30" y="580.63" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="261.19" y="580.63" font-size="11.00" class="sc-loraregular">43.5%</text><text x="291.55" y="580.63" font-size="11.00" class="sc-notoserifcjksc">，约与</text><text x="327.44 335.13 338.12 343.73 350.30 356.88 362.84 365.73 371.97 378.40 385.08 391.76 397.64 401.90 404.79" y="580.63" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="410.79" y="580.63" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="421.79" y="580.63" font-size="11.00" class="sc-loraregular">42.3%</text><text x="452.06" y="580.63" font-size="11.00" class="sc-notoserifcjksc">）相当。</text><text x="72.00" y="643.45" font-size="13.00" class="sc-poppinssemibold" fill="#66
