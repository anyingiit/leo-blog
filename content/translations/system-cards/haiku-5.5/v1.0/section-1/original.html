erifcjksc">）中，我们报告了七个领域的一系列部署前评估结果：负责任</text><text x="72.00 83.00 94.00 105.00 116.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">扩展政策（</text><text x="127.00 133.83 139.79 144.89 151.45 157.89 164.57 169.66 172.75 179.15 182.14 188.11 191.00 197.24 203.07 208.74 211.73 214.82 221.50 227.58 230.48 237.03 243.47 246.46 249.55 255.35" y="147.45" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="261.16 272.16 283.16 294.16 305.16 316.16 327.16 338.16 349.16 360.16 371.16 382.16 393.16 404.16 415.16 426.16 437.16 448.16 459.16 470.16 481.16 492.16 503.16 514.16 525.16" y="147.45" font-size="11.00" class="sc-notoserifcjksc">）评估、网络安全、安全防护与无害性、智能体安全、对</text><text x="72.00 83.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">齐（</text><text x="94.00 99.68 102.67 105.76 111.84 118.52 128.35 134.32 140.89" y="163.07" font-size="11.00" class="sc-loraregular">alignment</text><text x="145.15 156.15 167.15 178.15 189.15 200.15 211.15" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）、模型福祉（</text><text x="222.15 231.98 238.42 245.00 250.96 253.95 256.84 265.52 271.49 274.48 278.20 283.87 288.56" y="163.07" font-size="11.00" class="sc-loraregular">model welfare</text><text x="294.52 305.52 316.52 327.52 338.52 349.52" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）以及能力。</text><text x="72.00 77.07 80.71" y="198.57" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11 103.11 117.11 131.11 145.11 159.11 173.11 187.11 201.11" y="198.57" font-size="14.00" class="sc-notosanscjkscbold">训练数据与训练过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="225.13" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51 380.51 391.51 402.51 413.51 424.51 435.51 446.51 457.51 468.51 479.51 490.51 501.51 512.51 523.51" y="225.13" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的数据组合，包括来自互联网的公开信息、公开与非公</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="240.75" font-size="11.00" class="sc-notoserifcjksc">开数据集、用户在反馈或错误报告中提供的或用户明确允许用于训练的用户数据，以及其他来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="256.37" font-size="11.00" class="sc-notoserifcjksc">源，例如由其他模型生成的合成数据。在训练过程中，我们使用了多种数据清洗和过滤方法，包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="271.99" font-size="11.00" class="sc-notoserifcjksc">括去重和分类。我们使用名为</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.12 259.96 266.39" y="271.99" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="273.54 284.54 295.54 306.54 317.54 328.54 339.54 350.54 361.54 372.54 383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="271.99" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。对于网站运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="287.61" font-size="11.00" class="sc-notoserifcjksc">营者用以表明是否允许抓取其网站内容的</text><text x="270.00 274.40 279.09 285.52 291.92 298.36 302.61 307.71 310.28 314.67 320.50 324.76" y="287.61" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="287.61" font-size="11.00" class="sc-notoserifcjksc">指令，该爬虫遵循行业标准的最佳实践，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="303.23" font-size="11.00" class="sc-notoserifcjksc">且其设计不会访问受密码保护的页面，或需要登录或</text><text x="327.89 335.47 342.36 349.02 356.06 363.75 372.33" y="303.23" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="382.11 393.11 404.11 415.11 426.11 437.11 448.11 459.11 470.11 481.11 492.11 503.11 514.11 525.11" y="303.23" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="318.85" font-size="11.00" class="sc-notoserifcjksc">训练数据开展尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时抓取过其网</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="334.47" font-size="11.00" class="sc-notoserifcjksc">页，并向我们表明其偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="435.62" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00 179.49 185.17 188.26 194.17 200.73 203.63 209.62 212.33" y="435.62" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="221.22 232.22 243.22 254.22 265.22 276.22 287.22 298.22 309.22 320.22 331.22 342.22 353.22 364.22 375.22 386.22 397.22 408.22 419.22 430.22 441.22 452.22 463.22 474.22 485.22 496.22" y="435.62" font-size="11.00" class="sc-notoserifcjksc">经过了严格的后训练和微调，目的是使其成为一个行为符合</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="451.24" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="110.29 121.29 132.29" y="451.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的宪法</text><text x="143.29" y="451.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="154.29 160.09 166.52 173.20 178.29 182.55 185.82 190.07 196.64 200.90 203.99 210.42" y="451.24" font-size="11.00" class="sc-loraregular">constitution</text><text x="217.10 228.10 239.10 250.10 261.10 272.10 283.10 294.10 305.10 316.10 327.10" y="451.24" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="338.10 345.79 348.78 354.39 360.96 367.54" y="451.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="376.39 387.39 398.39 409.39 420.39 431.39 442.39 453.39 464.39 475.39 486.39 497.39 508.39 519.39" y="451.24" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="466.86" font-size="11.00" class="sc-notoserifcjksc">户输入相同的语言进行回应。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="516.58" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21 133.21 144.21 155.21 166.21 177.21 188.21 199.21" y="516.58" font-size="11.00" class="sc-notoserifcjksc">的知识截止日期为</text><text x="213.11 219.01 225.77 231.68" y="516.58" font-size="11.00" class="sc-loraregular">2026</text><text x="240.93" y="516.58" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="254.82" y="516.58" font-size="11.00" class="sc-loraregular">6</text><text x="264.07 275.07" y="516.58" font-size="11.00" class="sc-notoserifcjksc">月。</text><text x="72.00 77.07 80.71" y="550.37" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08 106.08 120.08 134.08 148.08" y="550.37" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="576.93" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="576.93" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00 83.00 94.00 105.00 116.00" y="592.55" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="592.55" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="592.55" font-size="11.00" class="sc-notoserifcjksc">只与认同我们关于向工作者提供公平且合乎道德的报酬这一理念的平台合</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="608.17" font-size="11.00" class="sc-notoserifcjksc">作，并且这些平台须致力于无论身处何地都采用安全的工作场所实践，遵循我们在采购合同中详</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="623.79" font-size="11.00" class="sc-notoserifcjksc">细规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="510.11" y="426.82" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="442.44" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="107.40" y="442.44" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="110.29" y="442.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="121.29" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="121.29" y="442.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="132.29" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="132.29" y="442.44" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

aregular">”</text><text x="413.64 424.64 435.64 446.64 457.64 468.64 479.64 490.64 501.64 512.64 523.64" y="387.60" font-size="11.00" class="sc-notoserifcjksc">。除非某一节另有说明，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="403.22" font-size="11.00" class="sc-notoserifcjksc">本系统卡中的评估均在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.68 237.35 240.44 246.35 252.92 255.81 261.81 264.51" y="403.22" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="273.40 284.40 295.40 306.40 317.40 328.40 339.40 350.40 361.40 372.40 383.40 394.40 405.40 416.40 427.40 438.40 449.40 460.40 471.40 482.40 493.40 504.40 515.40" y="403.22" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。部分章节改用较早的或替代的快</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="418.84" font-size="11.00" class="sc-notoserifcjksc">照，或在关闭生产环境安全防护措施的情况下运行模型，以使结果反映底层模型而非已部署的系</text><text x="72.00 83.00" y="434.46" font-size="11.00" class="sc-notoserifcjksc">统。</text><text x="72.00 77.07 80.71" y="486.15" font-size="14.00" class="sc-poppinssemibold">1.5</text><text x="93.06 107.06 121.06 135.06 149.06 163.06" y="486.15" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="512.71" font-size="11.00" class="sc-notoserifcjksc">我们为全面开放使用的</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.68 237.35 240.44 246.35 252.92 255.81 261.81 264.51" y="512.71" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="273.40 284.40 295.40 306.40 317.40 328.40 339.40 350.40 361.40 372.40 383.40 394.40 405.40" y="512.71" font-size="11.00" class="sc-notoserifcjksc">所应用的安全防护措施如 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p010.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 10 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">10</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">递归自我改进（</text><text x="185.00 189.69 195.59 201.44 208.01 212.77 217.87 220.96 226.46 232.42 235.31 240.41 246.37 249.36 252.97 258.35 261.44 271.27 277.84 282.53 288.91 294.41 300.37 310.20 316.16 322.74" y="82.61" font-size="11.00" class="sc-loraregular">recursive self-improvement</text><text x="327.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="338.00 344.91 351.14" y="82.61" font-size="11.00" class="sc-loraregular">RSI</text><text x="354.83 365.83 376.83 387.83 398.83 409.83 420.83 431.83 442.83 453.83 464.83 475.83 486.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）可能带来的风险。我们已在</text><text x="500.72 508.41 511.40 517.01 523.58 530.16" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 116.49 122.17 125.26 131.17 137.73 140.63 146.62 149.33" y="98.23" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="158.21 169.21 180.21 191.21 202.21 213.21 224.21 235.21 246.21 257.21 268.21 279.21 290.21 301.21" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上针对与开发前沿大语言模型（</text><text x="312.21 318.57 324.93" y="98.23" font-size="11.00" class="sc-loraregular">LLM</text><text x="335.03 346.03 357.03 368.03 379.03 390.03 401.03 412.03 423.03 434.03 445.03 456.03 467.03 478.03 489.03 500.03 511.03 522.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）相关的一小部分能力部署了安全防护措</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">施，例如在某些机器学习加速器上进行内核开发，这与我们在以往模型上的相应安全防护</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">措施类似。这些措施不会影响绝大多数传统</text><text x="319.89 326.78" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">或机器学习开发、研究或一般编程工作。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们针对常规武器和高当量炸药研发活动的拦截分类器，其表现与以往模型（例如</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15 182.14 184.85" y="179.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="190.84 201.84 212.84 223.84 234.84 245.84 256.84 267.84 278.84 289.84 300.84" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）上的同类分类器相似。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">与我们近期一些能力更强的模型不同，在我们的第一方产品和</text><text x="371.89 378.78 385.39" y="212.15" font-size="11.00" class="sc-loraregular">API</text><text x="391.97 402.97 413.97 424.97 435.97 446.97 457.97 468.97 479.97 490.97 501.97 512.97 523.97" y="212.15" font-size="11.00" class="sc-notoserifcjksc">上，这些安全防护措施触发拦</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">截后不会回退到任何其他模型。通过其他平台和提供商访问我们模型的流量可能会出现不同的行</text><text x="72.00 83.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">为。</text><text x="72.00 77.07 80.71" y="278.31" font-size="14.00" class="sc-poppinssemibold">1.6</text><text x="93.00 107.00 121.00 135.00" y="278.31" font-size="14.00" class="sc-notosanscjkscbold">外部测试</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="304.87" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51" y="304.87" font-size="11.00" class="sc-notoserifcjksc">的大多数评估是在</text><text x="251.40 258.29 264.86 269.12 275.71 280.40 286.83 293.40 296.49" y="304.87" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="305.23 316.23 327.23 338.23 349.23 360.23 371.23 382.23 393.23 404.23 415.23 426.23 437.23 448.23 459.23 470.23 481.23 492.23 503.23 514.23 525.23" y="304.87" font-size="11.00" class="sc-notoserifcjksc">内部运行的。不过，我们感谢多位外部测试者对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="320.49" font-size="11.00" class="sc-notoserifcjksc">该模型开展评估并与我们分享结果。他们的具体贡献在本系统卡的相关章节中加以说明。</text></svg></div>
