.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p008.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 8 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">8</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="116.21" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="174.40 181.29 187.86 192.12 198.71 203.40 209.83 216.40 219.49" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="228.23" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="371.23 374.23 379.90 384.61 390.64 396.60 399.49 402.48 408.16 414.84 420.92 427.49 433.16 439.19 445.15 448.05 457.88 464.32 470.89 476.86" y="116.21" font-size="11.00" class="sc-loraregular">large language model</text><text x="479.85" y="116.21" font-size="11.00" class="sc-notoserifcjksc">），已全面</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">开放。在本系统卡（</text><text x="171.00 177.18 182.99 188.08 192.34 198.30 208.14 211.03 218.72 224.39 229.08" y="131.83" font-size="11.00" class="sc-loraregular">System Card</text><text x="235.66" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）中，我们报告了七个领域的一系列部署前评估结果：负责任</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">扩展政策（</text><text x="127.00 133.83 139.79 144.89 151.45 157.89 164.57 169.66 172.75 179.15 182.14 188.11 191.00 197.24 203.07 208.74 211.73 214.82 221.50 227.58 230.48 237.03 243.47 246.46 249.55 255.35" y="147.45" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="261.16" y="147.45" font-size="11.00" class="sc-notoserifcjksc">）评估、网络安全、安全防护与无害性、智能体安全、对</text><text x="72.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">齐（</text><text x="94.00 99.68 102.67 105.76 111.84 118.52 128.35 134.32 140.89" y="163.07" font-size="11.00" class="sc-loraregular">alignment</text><text x="145.15" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）、模型福祉（</text><text x="222.15 231.98 238.42 245.00 250.96 253.95 256.84 265.52 271.49 274.48 278.20 283.87 288.56" y="163.07" font-size="11.00" class="sc-loraregular">model welfare</text><text x="294.52" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）以及能力。</text><text x="72.00" y="198.57" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11" y="198.57" font-size="14.00" class="sc-notosanscjkscbold">训练数据与训练过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="225.13" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="225.13" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的数据组合，包括来自互联网的公开信息、公开与非公</text><text x="72.00" y="240.75" font-size="11.00" class="sc-notoserifcjksc">开数据集、用户在反馈或错误报告中提供的或用户明确允许用于训练的用户数据，以及其他来</text><text x="72.00" y="256.37" font-size="11.00" class="sc-notoserifcjksc">源，例如由其他模型生成的合成数据。在训练过程中，我们使用了多种数据清洗和过滤方法，包</text><text x="72.00" y="271.99" font-size="11.00" class="sc-notoserifcjksc">括去重和分类。我们使用名为</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.12 259.96 266.39" y="271.99" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="273.54" y="271.99" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。对于网站运</text><text x="72.00" y="287.61" font-size="11.00" class="sc-notoserifcjksc">营者用以表明是否允许抓取其网站内容的</text><text x="270.00 274.40 279.09 285.52 291.92 298.36 302.61 307.71 310.28 314.67 320.50 324.76" y="287.61" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="328.60" y="287.61" font-size="11.00" class="sc-notoserifcjksc">指令，该爬虫遵循行业标准的最佳实践，并</text><text x="72.00" y="303.23" font-size="11.00" class="sc-notoserifcjksc">且其设计不会访问受密码保护的页面，或需要登录或</text><text x="327.89 335.47 342.36 349.02 356.06 363.75 372.33" y="303.23" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="382.11" y="303.23" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的</text><text x="72.00" y="318.85" font-size="11.00" class="sc-notoserifcjksc">训练数据开展尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时抓取过其网</text><text x="72.00" y="334.47" font-size="11.00" class="sc-notoserifcjksc">页，并向我们表明其偏好。</text><text x="72.00" y="435.62" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00 179.49 185.17 188.26 194.17 200.73 203.63 209.62 212.33" y="435.62" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="221.22" y="435.62" font-size="11.00" class="sc-notoserifcjksc">经过了严格的后训练和微调，目的是使其成为一个行为符合</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="451.24" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="110.29" y="451.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的宪法</text><text x="143.29" y="451.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="154.29 160.09 166.52 173.20 178.29 182.55 185.82 190.07 196.64 200.90 203.99 210.42" y="451.24" font-size="11.00" class="sc-loraregular">constitution</text><text x="217.10" y="451.24" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="338.10 345.79 348.78 354.39 360.96 367.54" y="451.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="376.39" y="451.24" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用</text><text x="72.00" y="466.86" font-size="11.00" class="sc-notoserifcjksc">户输入相同的语言进行回应。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="516.58" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21" y="516.58" font-size="11.00" class="sc-notoserifcjksc">的知识截止日期为</text><text x="213.11 219.01 225.77 231.68" y="516.58" font-size="11.00" class="sc-loraregular">2026</text><text x="240.93" y="516.58" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="254.82" y="516.58" font-size="11.00" class="sc-loraregular">6</text><text x="264.07" y="516.58" font-size="11.00" class="sc-notoserifcjksc">月。</text><text x="72.00" y="550.37" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08" y="550.37" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="576.93" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="576.93" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00" y="592.55" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="592.55" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83" y="592.55" font-size="11.00" class="sc-notoserifcjksc">只与认同我们关于向工作者提供公平且合乎道德的报酬这一理念的平台合</text><text x="72.00" y="608.17" font-size="11.00" class="sc-notoserifcjksc">作，并且这些平台须致力于无论身处何地都采用安全的工作场所实践，遵循我们在采购合同中详</text><text x="72.00" y="623.79" font-size="11.00" class="sc-notoserifcjksc">细规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="510.11" y="426.82" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="442.44" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="107.40" y="442.44" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="110.29" y="442.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="121.29" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="121.29" y="442.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="132.29" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="132.29" y="442.44" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p009.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 9 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">9</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">1.3</text><text x="92.43" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">使用政策与支持</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="116.76" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83 200.03 205.12 210.80 216.83 222.79 225.68 232.24 238.67 241.66 244.76 250.55" y="116.76" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="256.36" y="116.76" font-size="11.00" class="sc-notoserifcjksc">）详细列出了我们模型的禁止用途，以及我们对高风险场</text><text x="72.00" y="132.38" font-size="11.00" class="sc-notoserifcjksc">景和其他特定场景中使用的要求。</text><text x="72.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">对于受适用监管制度约束的模型，我们已在</text><text x="281.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="347.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.00 363.92 368.60 375.04 381.62 385.87 388.97 394.93 399.69 402.58 410.27 416.71 426.54 433.11 436.10 439.19 444.87 451.54 457.34 463.30 466.20 472.11 476.80 482.48 492.31 498.23 506.91 513.34 518.06" y="165.34" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="523.97" y="165.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 77.95 85.64" y="180.96" font-size="11.00" class="sc-loraregular">FCF</text><text x="91.67" y="180.96" font-size="11.00" class="sc-notoserifcjksc">）中正式规定了我们如何履行此类法规下的义务。</text><text x="333.67 339.62 347.31" y="180.96" font-size="11.00" class="sc-loraregular">FCF</text><text x="356.23" y="180.96" font-size="11.00" class="sc-notoserifcjksc">记录了我们当前在各关键风险类别中</text><text x="72.00" y="196.58" font-size="11.00" class="sc-notoserifcjksc">开展系统性风险评估与缓解的技术和组织规程。</text><text x="303.00 308.95 316.64" y="196.58" font-size="11.00" class="sc-loraregular">FCF</text><text x="325.56" y="196.58" font-size="11.00" class="sc-notoserifcjksc">是我们针对适用监管制度的合规框架，这些</text><text x="72.00" y="212.20" font-size="11.00" class="sc-notoserifcjksc">制度包括加利福尼亚州的《前沿人工智能透明度法案》（</text><text x="347.00 353.88 358.56 364.24 370.91 376.01 382.57 388.25 392.94 398.90 405.57 411.37 417.18 420.07 423.16 429.84 432.73 438.65 443.34 449.77 456.35 460.61 463.70 469.66 474.42 477.32 484.20 487.89 490.78 497.67 503.46" y="212.20" font-size="11.00" class="sc-loraregular">Transparency in Frontier AI Act</text><text x="507.72" y="212.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="518.72" y="212.20" font-size="11.00" class="sc-loraregular">SB</text><text x="72.00" y="227.82" font-size="11.00" class="sc-loraregular">53</text><text x="84.12" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）以及《欧盟人工智能法案》（</text><text x="238.12 244.96 253.24 256.13 263.02 266.70 269.59 276.48 282.28" y="227.82" font-size="11.00" class="sc-loraregular">EU AI Act</text><text x="286.53" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）的《通用人工智能行为准则》（</text><text x="451.53 459.90 465.87 472.54 478.51 483.19 488.87 491.86 497.24 503.90 510.47 515.23 521.80 528.24 533.33" y="227.82" font-size="11.00" class="sc-loraregular">General-Purpose</text><text x="72.00 78.89 82.57 85.46 93.15 99.59 106.17 112.13 115.02 121.40 125.12 128.01 134.68 139.36 145.04 150.84 155.09 158.19 163.98" y="243.44" font-size="11.00" class="sc-loraregular">AI Code of Practice</text><text x="169.94" y="243.44" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="278.68" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="278.68" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76 230.64 237.22 241.48 248.07 252.75 259.19 265.75 268.85" y="278.68" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="277.59" y="278.68" font-size="11.00" class="sc-notoserifcjksc">通用人工智能模型在欧洲经济区（</text><text x="442.59 449.33 455.90 460.59 467.02 473.59 479.53 485.20" y="278.68" font-size="11.00" class="sc-loraregular">European</text><text x="72.00 78.84 84.64 91.07 97.75 104.19 114.02 117.11 122.96 125.86 132.74 137.43 143.37" y="294.30" font-size="11.00" class="sc-loraregular">Economic Area</text><text x="149.04" y="294.30" font-size="11.00" class="sc-notoserifcjksc">）的提供者。</text><text x="72.00" y="327.26" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98" y="327.26" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="169.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持页面</text><text x="290.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="361.04" font-size="14.00" class="sc-poppinssemibold">1.4</text><text x="93.29" y="361.04" font-size="14.00" class="sc-notosanscjkscbold">模型评估</text><text x="72.00" y="387.60" font-size="11.00" class="sc-notoserifcjksc">在训练过程的不同时间点，我们会获取</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.68 314.35 317.44 323.35 329.92 332.81 338.81 341.51" y="387.60" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="350.40" y="387.60" font-size="11.00" class="sc-notoserifcjksc">的不同</text><text x="383.40" y="387.60" font-size="11.00" class="sc-loraregular">“</text><text x="387.80" y="387.60" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="409.80" y="387.60" font-size="11.00" class="sc-loraregular">”</text><text x="413.64" y="387.60" font-size="11.00" class="sc-notoserifcjksc">。除非某一节另有说明，</text><text x="72.00" y="403.22" font-size="11.00" class="sc-notoserifcjksc">本系统卡中的评估均在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.68 237.35 240.44 246.35 252.92 255.81 261.81 264.51" y="403.22" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="273.40" y="403.22" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。部分章节改用较早的或替代的快</text><text x="72.00" y="418.84" font-size="11.00" class="sc-notoserifcjksc">照，或在关闭生产环境安全防护措施的情况下运行模型，以使结果反映底层模型而非已部署的系</text><text x="72.00" y="434.46" font-size="11.00" class="sc-notoserifcjksc">统。</text><text x="72.00" y="486.15" font-size="14.00" class="sc-poppinssemibold">1.5</text><text x="93.06" y="486.15" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施</text><text x="72.00" y="512.71" font-size="11.00" class="sc-notoserifcjksc">我们为全面开放使用的</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.68 237.35 240.44 246.35 252.92 255.81 261.81 264.51" y="512.71" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="273.40" y="512.71" font-size="11.00" class="sc-notoserifcjksc">所应用的安全防护措施如下：</text><text x="108.00" y="545.09" font-size="11.00" class="sc-notoserifcjksc">针对化学和生物（</text><text x="196.00" y="545.09" font-size="11.00" class="sc-loraregular">CB</text><text x="210.53" y="545.09" font-size="11.00" class="sc-notoserifcjksc">）风险，我们部署了与我们部署</text><text x="367.42 375.11 378.11 383.71 390.28 396.86 402.82 405.71 414.45 421.02 427.58 432.68 435.57" y="545.09" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="444.46" y="545.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="458.35 466.04 469.03 474.64 481.21 487.79 493.75 496.64 502.88 509.31 515.99 522.67 528.55" y="545.09" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="108.00" y="560.71" font-size="11.00" class="sc-loraregular">5</text><text x="116.89" y="560.71" font-size="11.00" class="sc-notoserifcjksc">时相同的有害</text><text x="185.78" y="560.71" font-size="11.00" class="sc-loraregular">CB</text><text x="203.20" y="560.71" font-size="11.00" class="sc-notoserifcjksc">滥用分类器，而非</text><text x="294.10 301.79 304.78 310.39 316.96 323.53 329.50 332.39 341.12 347.69 354.26 359.35 362.24 368.24 370.94" y="560.71" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="379.83" y="560.71" font-size="11.00" class="sc-notoserifcjksc">所使用的范围更广的研究生物学</text><text x="108.00" y="576.33" font-size="11.00" class="sc-notoserifcjksc">分类器。这些分类器没有回退（</text><text x="262.00" y="576.33" font-size="11.00" class="sc-loraregular">fallback</text><text x="301.21" y="576.33" font-size="11.00" class="sc-notoserifcjksc">）模型。我们使用这些分类器的理由在第</text><text x="502.11" y="576.33" font-size="11.00" class="sc-loraregular">2.2.4</text><text x="528.19" y="576.33" font-size="11.00" class="sc-notoserifcjksc">节</text><text x="108.00" y="591.95" font-size="11.00" class="sc-notoserifcjksc">中讨论。</text><text x="108.00" y="626.05" font-size="11.00" class="sc-notoserifcjksc">针对网络安全滥用，我们部署了以特定有害网络活动为目标的拦截分类器。这些分类器的</text><text x="108.00" y="641.67" font-size="11.00" class="sc-notoserifcjksc">范围明显窄于我们为能力更强的模型设置的网络安全防护措施。这些分类器没有回退模</text><text x="108.00" y="657.29" font-size="11.00" class="sc-notoserifcjksc">型。我们在第</text><text x="176.89" y="657.29" font-size="11.00" class="sc-loraregular">3.2</text><text x="194.53" y="657.29" font-size="11.00" class="sc-notoserifcjksc">节中进一步讨论这些安全防护措施。</text><text x="108.00" y="690.82" font-size="11.00" class="sc-notoserifcjksc">正如我们在</text><text x="165.89 171.80 178.55 184.46" y="690.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="193.71" y="690.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="207.60" y="690.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="216.68" y="690.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="271.68" y="690.82" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="282.68 289.59 292.68 297.77 303.68 306.57 313.40 319.37 325.93 332.37 337.21" y="690.82" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="341.46" y="690.82" font-size="11.00" class="sc-notoserifcjksc">）第</text><text x="366.36" y="690.82" font-size="11.00" class="sc-loraregular">3</text><text x="375.38" y="690.82" font-size="11.00" class="sc-notoserifcjksc">节中所讨论的，我们担忧加快模型</text><text x="108.00" y="706.44" font-size="11.00" class="sc-notoserifcjksc">开发整体步伐所带来的风险，以及</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://tru <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p010.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 10 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">10</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">递归自我改进（</text><text x="185.00 189.69 195.59 201.44 208.01 212.77 217.87 220.96 226.46 232.42 235.31 240.41 246.37 249.36 252.97 258.35 261.44 271.27 277.84 282.53 288.91 294.41 300.37 310.20 316.16 322.74" y="82.61" font-size="11.00" class="sc-loraregular">recursive self-improvement</text><text x="327.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="338.00" y="82.61" font-size="11.00" class="sc-loraregular">RSI</text><text x="354.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）可能带来的风险。我们已在</text><text x="500.72 508.41 511.40 517.01 523.58 530.16" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 116.49 122.17 125.26 131.17 137.73 140.63 146.62 149.33" y="98.23" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="158.21" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上针对与开发前沿大语言模型（</text><text x="312.21" y="98.23" font-size="11.00" class="sc-loraregular">LLM</text><text x="335.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）相关的一小部分能力部署了安全防护措</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">施，例如在某些机器学习加速器上进行内核开发，这与我们在以往模型上的相应安全防护</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">措施类似。这些措施不会影响绝大多数传统</text><text x="319.89" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="333.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">或机器学习开发、研究或一般编程工作。</text><text x="108.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们针对常规武器和高当量炸药研发活动的拦截分类器，其表现与以往模型（例如</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15 182.14 184.85" y="179.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="190.84" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）上的同类分类器相似。</text><text x="72.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">与我们近期一些能力更强的模型不同，在我们的第一方产品和</text><text x="371.89 378.78 385.39" y="212.15" font-size="11.00" class="sc-loraregular">API</text><text x="391.97" y="212.15" font-size="11.00" class="sc-notoserifcjksc">上，这些安全防护措施触发拦</text><text x="72.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">截后不会回退到任何其他模型。通过其他平台和提供商访问我们模型的流量可能会出现不同的行</text><text x="72.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">为。</text><text x="72.00" y="278.31" font-size="14.00" class="sc-poppinssemibold">1.6</text><text x="93.00" y="278.31" font-size="14.00" class="sc-notosanscjkscbold">外部测试</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="304.87" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="304.87" font-size="11.00" class="sc-notoserifcjksc">的大多数评估是在</text><text x="251.40 258.29 264.86 269.12 275.71 280.40 286.83 293.40 296.49" y="304.87" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="305.23" y="304.87" font-size="11.00" class="sc-notoserifcjksc">内部运行的。不过，我们感谢多位外部测试者对</text><text x="72.00" y="320.49" font-size="11.00" class="sc-notoserifcjksc">该模型开展评估并与我们分享结果。他们的具体贡献在本系统卡的相关章节中加以说明。</text></svg></div>
