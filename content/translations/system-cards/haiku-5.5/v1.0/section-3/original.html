.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p023.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 23 页"><text x="72.00 79.72 82.85 90.57 93.70 98.25 101.63 108.44 114.93 123.74 127.17 135.46 138.89 143.73 151.91 159.93 168.37 176.16" y="580.84" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.1 ExploitBench</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">1</text><text x="76.81 82.59 87.96 93.38 95.91 98.53 104.20 106.66 109.19 111.82 116.98 123.04 129.02 131.65 137.79 142.12 148.08 157.02 159.74 165.11 169.84 172.36 174.99 182.20 184.66 187.29 190.34 195.71 201.84 207.21 212.87 215.92 218.38 221.01 227.22 232.52 238.49 241.21 247.06 250.02 253.89 260.11 265.53 271.60 276.91 282.90 285.40 288.03 294.29 296.92 302.21 307.37 313.34 318.50 324.31 327.12 329.84 332.81 336.70 341.98 344.61 347.33 352.48 358.46 364.44 369.86 374.19 376.81 382.63 388.05 394.12 399.44 405.42 414.36 419.52 423.81 429.17 431.80 435.13 440.98 445.31 447.94 453.71 459.49 468.67 471.30 476.56 481.79 487.61 493.03 497.36 501.98 507.35 512.67 518.64 522.97 525.94 529.82" y="704.46" font-size="10.00" class="sc-loraregular">Lee, S., and Brumley, D. (2026). ExploitBench: A capability ladder benchmark for LLM cybersecurity</text><text x="72.00 77.16 82.64 88.05 94.03 97.90 102.53 104.99 107.62 112.77 116.48 122.97 125.78 130.83 133.33 138.69 144.47 150.68 156.13 158.59 162.22 167.64 171.28 176.73 182.30" y="717.26" font-size="10.00" class="sc-loraregular">agents. arXiv:2605.14153.</text><text x="187.38 193.28 197.25 201.12 207.09 211.71 214.21 217.90 224.36 229.52 233.84 239.14 241.95 246.61 249.07 254.92 259.19 264.72 271.18 276.34 282.15 286.43 293.33 298.70 304.48 310.68 316.13 318.59 322.23 327.65 331.29 336.73" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.14153</text><text x="504.00 508.70" y="751.81" font-size="9.00" class="sc-loraregular">23</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="154.36" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="154.36" font-size="11.00" class="sc-notoserifcjksc">并非前沿模型，但与</text><text x="262.40 270.89 276.57 279.66 285.57 292.13 295.03 300.99 303.69" y="154.36" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="312.58" y="154.36" font-size="11.00" class="sc-notoserifcjksc">相比，它在网络安全能力上实现了相对显著的</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">提升。在我们的评估套件中，</text><text x="215.00 223.49 229.17 232.26 238.17 244.73 247.63 253.62 256.33" y="169.98" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="265.22" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的表现显著优于</text><text x="345.11 353.60 359.28 362.37 368.27 374.84 377.73 383.70 386.40" y="169.98" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="392.40" y="169.98" font-size="11.00" class="sc-notoserifcjksc">，但不及</text><text x="439.29" y="169.98" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="483.84" y="169.98" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="494.84 502.53 505.52 511.13 517.70 524.28" y="169.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="185.60" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="153.55" y="185.60" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="192.30" y="185.60" font-size="11.00" class="sc-notoserifcjksc">所取得的结果。</text><text x="72.00" y="235.32" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="235.32" font-size="11.00" class="sc-loraregular">3.3</text><text x="103.75" y="235.32" font-size="11.00" class="sc-notoserifcjksc">节中报告的所有能力评估结果，均是在关闭网络安全防护措施的情况下通过</text><text x="469.64 476.52 483.14" y="235.32" font-size="11.00" class="sc-loraregular">API</text><text x="489.71" y="235.32" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="250.94" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="266.56" font-size="11.00" class="sc-notoserifcjksc">时也反映了某些用户通过我们的</text><text x="226.00" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划（</text><text x="464.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="475.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc">将能获得的</text><text x="72.00" y="282.18" font-size="11.00" class="sc-notoserifcjksc">能力水平。自</text><text x="140.89 146.80 153.55 159.46" y="282.18" font-size="11.00" class="sc-loraregular">2026</text><text x="168.71" y="282.18" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="182.60" y="282.18" font-size="11.00" class="sc-loraregular">8</text><text x="191.68" y="282.18" font-size="11.00" class="sc-notoserifcjksc">月以来，我们用于评估运行的许多运行框架（</text><text x="411.68" y="282.18" font-size="11.00" class="sc-loraregular">harness</text><text x="451.53" y="282.18" font-size="11.00" class="sc-notoserifcjksc">）已被重写。在这</text><text x="72.00" y="297.80" font-size="11.00" class="sc-notoserifcjksc">些情况下，所有较早的模型都经过了重新评估，以保持各模型之间的一致性，因此所得数值与此</text><text x="72.00" y="313.42" font-size="11.00" class="sc-notoserifcjksc">次变更之前发布的往期系统卡（</text><text x="226.00 232.18 237.99 243.08 247.34 253.30 263.14 266.03 273.72 279.39 284.08" y="313.42" font-size="11.00" class="sc-loraregular">System Card</text><text x="290.66" y="313.42" font-size="11.00" class="sc-notoserifcjksc">）中的数值有所不同。</text><text x="72.00" y="382.45" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39" y="382.45" font-size="14.00" class="sc-notosanscjkscbold">缓解措施</text><text x="72.00" y="409.01" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.81 176.51" y="409.01" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="185.40" y="409.01" font-size="11.00" class="sc-notoserifcjksc">相对缺乏高级网络安全能力，我们为其设置的网络安全防护措施所触发的</text><text x="72.00" y="424.63" font-size="11.00" class="sc-notoserifcjksc">活动范围明显小于其他近期发布的模型。这些安全防护措施针对的是违反我们政策的特定有害及</text><text x="72.00" y="440.25" font-size="11.00" class="sc-notoserifcjksc">潜在有害活动。</text><text x="72.00" y="473.77" font-size="11.00" class="sc-notoserifcjksc">符合条件的安全专业人员如被我们的网络安全防护措施拦截，可通过我们的</text><text x="435.00" y="473.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划</text><text x="523.00" y="473.77" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="489.39" font-size="11.00" class="sc-notoserifcjksc">在网络安全拦截分类器有所放宽的条件下访问我们的模型。</text><text x="72.00" y="539.94" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74" y="539.94" font-size="14.00" class="sc-notosanscjkscbold">能力评估</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 115.03 120.99 127.67 133.52" y="604.70" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="140.11" y="601.04" font-size="6.60" class="sc-loraregular">1</text><text x="145.41" y="604.70" font-size="11.00" class="sc-notoserifcjksc">是一项网络安全基准测试，用于评估</text><text x="324.30" y="604.70" font-size="11.00" class="sc-loraregular">AI</text><text x="337.76" y="604.70" font-size="11.00" class="sc-notoserifcjksc">模型能在软件漏洞利用流程中推进到何种</text><text x="72.00" y="620.32" font-size="11.00" class="sc-notoserifcjksc">程度（而非将漏洞利用作为单一的通过</text><text x="259.00" y="620.32" font-size="11.00" class="sc-loraregular">/</text><text x="266.59" y="620.32" font-size="11.00" class="sc-notoserifcjksc">失败事件来评分）。我们最近对此有</text><text x="442.59" y="620.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更详细的介绍</text><text x="508.59" y="620.32" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2605.14153" rel="noopener"><rect x="187.38" y="707.20" width="154.92" height="12.80" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="226.00" y="257.76" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="226.00" y="257.76" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="237.00" y="257.76" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="237.00" y="257.76" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="248.00" y="257.76" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="248.00" y="257.76" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="259.00" y="257.76" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="259.00" y="257.76" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="270.00" y="257.76" width="0.00" height="11.00" fill="transparent"/></a><a href="h dth="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="453.59" y="611.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="453.59" y="611.52" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="464.59" y="611.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="464.59" y="611.52" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="611.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="611.52" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="611.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="611.52" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="611.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="611.52" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p024.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 24 页"><text x="90.00" y="374.52" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="390.71" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="423.10" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00 508.64" y="751.81" font-size="9.00" class="sc-loraregular">24</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">该基准测试将漏洞利用分解为</text><text x="217.89" y="82.61" font-size="11.00" class="sc-loraregular">16</text><text x="231.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个可测量的能力标志。这些标志涵盖从覆盖范围和崩溃复现，到</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">沙箱原语、任意读写、控制流劫持以及任意代码执行。这些标志分为五个层级，用以区分仅能触</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">发崩溃的模型与能够构建武器化所需的可复用原语的模型。这为进攻性网络能力提供了一种细粒</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">度的衡量方式。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">该基准测试针对</text><text x="151.89" y="195.95" font-size="11.00" class="sc-loraregular">V8</text><text x="168.15" y="195.95" font-size="11.00" class="sc-notoserifcjksc">引擎中</text><text x="204.04" y="195.95" font-size="11.00" class="sc-loraregular">41</text><text x="216.90" y="195.95" font-size="11.00" class="sc-notoserifcjksc">个近期（</text><text x="260.90 266.81 273.56 279.23" y="195.95" font-size="11.00" class="sc-loraregular">2024</text><text x="288.08" y="195.95" font-size="11.00" class="sc-notoserifcjksc">年及以后）的漏洞；</text><text x="387.08" y="195.95" font-size="11.00" class="sc-loraregular">V8</text><text x="403.34" y="195.95" font-size="11.00" class="sc-notoserifcjksc">是驱动</text><text x="439.24 446.92 453.51 458.20 464.63 474.47" y="195.95" font-size="11.00" class="sc-loraregular">Chrome</text><text x="483.32" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 75.94 81.48 86.93 92.60 98.84 104.69 109.46 112.55 119.11" y="211.57" font-size="11.00" class="sc-loraregular">JavaScript</text><text x="126.26" y="211.57" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="140.16 150.67 156.63 162.96 169.85 174.94 180.03 185.99 195.83 202.23 205.17" y="211.57" font-size="11.00" class="sc-loraregular">WebAssembly</text><text x="213.87" y="211.57" font-size="11.00" class="sc-notoserifcjksc">引擎。模型会获得一个存在漏洞的</text><text x="381.76" y="211.57" font-size="11.00" class="sc-loraregular">V8</text><text x="398.02" y="211.57" font-size="11.00" class="sc-notoserifcjksc">构建版本以及修复这些漏洞</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">的补丁，随后其任务是为该漏洞构建漏洞利用。该构建版本启用了多项缓解措施，包括</text><text x="492.89" y="227.19" font-size="11.00" class="sc-loraregular">V8</text><text x="509.15" y="227.19" font-size="11.00" class="sc-notoserifcjksc">堆沙</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">箱、</text><text x="94.00" y="242.81" font-size="11.00" class="sc-loraregular">ASLR</text><text x="123.28" y="242.81" font-size="11.00" class="sc-notoserifcjksc">和栈金丝雀（</text><text x="189.28 194.38 198.63 204.31 210.16 216.07 218.96 224.79 230.47 237.14 242.82 247.58 250.67 256.64" y="242.81" font-size="11.00" class="sc-loraregular">stack canaries</text><text x="261.73" y="242.81" font-size="11.00" class="sc-notoserifcjksc">）。每个漏洞利用层级都由确定性验证器进行机械式评</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">分。为抵御奖励破解（</text><text x="182.00 186.69 192.60 201.30 206.98 211.67 218.24 221.14 227.73 233.40 239.26 245.16 248.25 254.93" y="258.43" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="261.01" y="258.43" font-size="11.00" class="sc-notoserifcjksc">），内置于</text><text x="318.91" y="258.43" font-size="11.00" class="sc-loraregular">V8</text><text x="335.16" y="258.43" font-size="11.00" class="sc-notoserifcjksc">中的挑战</text><text x="379.16" y="258.43" font-size="11.00" class="sc-loraregular">-</text><text x="384.54" y="258.43" font-size="11.00" class="sc-notoserifcjksc">应答函数会在多种随机化堆布局</text><text x="72.00" y="274.05" font-size="11.00" class="sc-notoserifcjksc">下重放，因此硬编码一个泄露的地址不会被算作解决方案。我们对每个漏洞运行五次试验。</text><text x="72.00" y="341.68" font-size="11.00" class="sc-notoserifcjksc">我们报告三项指标：</text><text x="108.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">所有试验和环境中每次试验的平均捕获标志数；</text><text x="108.00" y="390.26" font-size="11.00" class="sc-loraregular">Cap%</text><text x="137.50" y="390.26" font-size="11.00" class="sc-notoserifcjksc">，即每个环境中所捕获的可用标志所占百分比（基于随机选取的三次试验子集），</text><text x="108.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">并对所有环境取平均；以及</text><text x="108.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在普通组和</text><text x="165.89 172.78 179.35 183.60 189.77 198.16 204.72 211.30 217.33" y="422.64" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="226.18" y="422.64" font-size="11.00" class="sc-notoserifcjksc">组的运行中共生成的完整任意代码执行（</text><text x="424.18 429.86 434.58 440.98 444.25 448.50 453.19 458.87 463.82 469.62 472.52 478.32 484.75 491.33" y="422.64" font-size="11.00" class="sc-loraregular">arbitrary code</text><text x="108.00 113.91 119.68 125.59 131.44 138.01 142.26 145.36 151.79" y="438.26" font-size="11.00" class="sc-loraregular">execution</text><text x="158.47" y="438.26" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="169.47 176.30 183.99" y="438.26" font-size="11.00" class="sc-loraregular">ACE</text><text x="190.83" y="438.26" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用的数量。</text><text x="72.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">每个环境均在两个组别下运行，轮次预算为</text><text x="283.89" y="471.22" font-size="11.00" class="sc-loraregular">300</text><text x="306.58" y="471.22" font-size="11.00" class="sc-notoserifcjksc">轮。在普通组中，模型进行一次不间断的尝试。</text><text x="72.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.35 103.60 109.77 118.16 124.72 131.30 137.33" y="486.84" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="146.18" y="486.84" font-size="11.00" class="sc-notoserifcjksc">组中，如果模型在未达到完整代码执行的情况下主动于用尽预算前停止，运行框</text><text x="72.00" y="502.46" font-size="11.00" class="sc-notoserifcjksc">架会在同一对话中注入一条</text><text x="204.00" y="502.46" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="502.46" font-size="11.00" class="sc-notoserifcjksc">继续尝试</text><text x="252.40" y="502.46" font-size="11.00" class="sc-loraregular">”</text><text x="256.24" y="502.46" font-size="11.00" class="sc-notoserifcjksc">提示词，并让其继续。</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">在普通组中，</text><text x="138.00 146.49 152.17 155.26 161.17 167.73 170.63 176.62 179.33" y="552.18" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="188.21" y="552.18" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="202.11 208.95 214.78 221.35 224.34 230.77 234.04 238.30 245.14 251.10 257.78 263.63" y="552.18" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="273.11" y="552.18" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="287.01" y="552.18" font-size="11.00" class="sc-loraregular">41</text><text x="299.87" y="552.18" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="313.76" y="552.18" font-size="11.00" class="sc-loraregular">V8</text><text x="330.02" y="552.18" font-size="11.00" class="sc-notoserifcjksc">环境中平均获得</text><text x="409.91" y="552.18" font-size="11.00" class="sc-loraregular">5.15</text><text x="431.50" y="552.18" font-size="11.00" class="sc-notoserifcjksc">个能力标志，</text><text x="497.50" y="552.18" font-size="11.00" class="sc-loraregular">Cap%</text><text x="529.90" y="552.18" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00" y="567.80" font-size="11.00" class="sc-loraregular">38%</text><text x="93.88" y="567.80" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="118.77 125.66 132.23 136.48 142.65 151.04 157.60 164.18 170.21" y="567.80" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="179.06" y="567.80" font-size="11.00" class="sc-notoserifcjksc">组中，它平均获得</text><text x="269.96" y="567.80" font-size="11.00" class="sc-loraregular">6.56</text><text x="294.27" y="567.80" font-size="11.00" class="sc-notoserifcjksc">个标志，</text><text x="338.27" y="567.80" font-size="11.00" class="sc-loraregular">Cap%</text><text x="370.66" y="567.80" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="384.55" y="567.80" font-size="11.00" class="sc-loraregular">49%</text><text x="406.44" y="567.80" font-size="11.00" class="sc-notoserifcjksc">。在普通组和</text><text x="475.34 482.22 488.79 493.05 499.22 507.60 514.17 520.74 526.77" y="567.80" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="72.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">组的运行中，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 184.78 190.46 193.55 199.46 206.02 208.92 214.91 217.62" y="583.42" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="226.51" y="583.42" font-size="11.00" class="sc-notoserifcjksc">实现完整任意代码执行的比例为</text><text x="383.40 387.40 389.94 396.77" y="583.42" font-size="11.00" class="sc-loraregular">1.0%</text><text x="406.34" y="583.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="417.34 423.04 430.16 436.12 440.13" y="583.42" font-size="11.00" class="sc-loraregular">4/410</text><text x="446.96" y="583.42" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p025.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 25 页"><text x="72.00 79.72 82.85 90.57 93.70 101.20 104.58 114.63 122.19 130.04 137.84 145.86 154.29 163.10 168.09 171.52 179.81 188.00 196.02 204.46 212.25" y="549.39" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.2 CyScenarioBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">25</text><text x="72.00" y="390.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 104.77 106.87 112.40 115.88 118.24 125.40 130.11 133.06 138.40 143.96 146.33 151.19 153.29" y="390.42" font-size="9.00" class="sc-lorabold">3.3.1.A] Haiku 5.5</text><text x="160.51" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="171.88 177.50 182.43 187.80 190.61 195.70 198.61 202.29 208.24 213.08 218.83 223.49" y="390.42" font-size="9.00" class="sc-lorabold">ExploitBench</text><text x="231.44" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">上的结果。</text><text x="276.44 280.04 288.24 293.10 297.75 303.00" y="390.42" font-size="9.00" class="sc-loraregular">“Mean”</text><text x="306.14" y="390.42" font-size="9.00" class="sc-notoserifcjksc">指每个模型在所有试验和环境中捕获的能力标志的平均数</text><text x="72.00" y="402.12" font-size="9.00" class="sc-notoserifcjksc">量。</text><text x="90.00" y="402.12" font-size="9.00" class="sc-loraregular">“Cap%”</text><text x="120.88" y="402.12" font-size="9.00" class="sc-notoserifcjksc">指在给定环境中，从五次试验中随机选取三次所捕获标志占总标志数的百分比，并对所有环境取平均。平</text><text x="72.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">均值和捕获率均为</text><text x="146.37 152.00 157.37 160.86 165.91 172.76 178.14 183.52 188.45" y="413.83" font-size="9.00" class="sc-loraregular">AutoNudge</text><text x="195.70" y="413.83" font-size="9.00" class="sc-notoserifcjksc">组的结果。</text><text x="240.70" y="413.83" font-size="9.00" class="sc-loraregular">“</text><text x="244.30" y="413.83" font-size="9.00" class="sc-notoserifcjksc">完整</text><text x="264.66 270.25 276.54 282.14" y="413.83" font-size="9.00" class="sc-loraregular">ACE”</text><text x="285.28" y="413.83" font-size="9.00" class="sc-notoserifcjksc">是全部</text><text x="314.65" y="413.83" font-size="9.00" class="sc-loraregular">410</text><text x="330.76" y="413.83" font-size="9.00" class="sc-notoserifcjksc">次运行（包括普通组和</text><text x="423.13 428.76 434.13 437.62 442.67 449.52 454.90 460.28 465.21" y="413.83" font-size="9.00" class="sc-loraregular">AutoNudge</text><text x="472.46" y="413.83" font-size="9.00" class="sc-notoserifcjksc">组）中实现任意</text><text x="72.00" y="425.52" font-size="9.00" class="sc-notoserifcjksc">代码执行的总次数。这些结果是在关闭全部网络安全防护措施、但启用逃逸分类器及其他安全措施的情况下获得的。</text><text x="72.00" y="482.47" font-size="11.00" class="sc-notoserifcjksc">这些结果可能无法与在各厂商实际部署条件下产生的公开排行榜条目直接比较。我们报告的结果</text><text x="72.00" y="498.09" font-size="11.00" class="sc-notoserifcjksc">使用的是作者提供的静态、统一的运行框架，而非原生运行框架。</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="570.55" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69" y="570.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="189.58 193.18 197.94 202.62 208.59 214.67 221.24 224.23 229.91" y="570.55" font-size="11.00" class="sc-loraregular">Irregular</text><text x="237.56" y="570.55" font-size="11.00" class="sc-notoserifcjksc">开发的一项基准测试，用于评估模型能否在现实约束下规划并</text><text x="72.00" y="586.17" font-size="11.00" class="sc-notoserifcjksc">执行多阶段网络行动，而非执行孤立的技术任务。大多数网络安全基准测试侧重于孤立考察单项</text><text x="72.00" y="601.79" font-size="11.00" class="sc-notoserifcjksc">能力的短程挑战，而</text><text x="173.89 181.58 187.39 193.63 199.42 205.39 212.06 217.74 222.50 225.59 231.76 238.61 244.57 251.24 257.10" y="601.79" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="266.58" y="601.79" font-size="11.00" class="sc-notoserifcjksc">衡量的是编排能力：即在相互依赖的行动阶段中协调安</text><text x="72.00" y="617.41" font-size="11.00" class="sc-notoserifcjksc">排攻击技术的先后顺序，包括做出分支决策、遵守约束，以及从错误和状态不一致中恢复。</text><text x="72.00" y="700.09" font-size="11.00" class="sc-notoserifcjksc">该基准测试采用三层级结构。任务级评估衡量原子能力，例如代码生成和载荷调整；路径级评估</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p026.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 26 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">26</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">涵盖与攻击树分支相对应的多步骤序列；活动级评估则是包含不确定性和行动摩擦的完整攻击模</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">拟。各场景源自对真实网络安全事件的分析，运行于容器化网络环境中，这些环境配有贴近现实</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的操作系统、真实的服务配置、会作出响应的防御监控，以及安全意识程度各异的模拟员工。所</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">有场景均为全新、从零构建（而非取自已公开的夺旗赛（</text><text x="432.88" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）演练），且评估集</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">者提供有意义的能力提升（</text><text x="204.00 210.57 217.13 220.13 223.22 227.07" y="176.33" font-size="11.00" class="sc-loraregular">uplift</text><text x="231.32" y="176.33" font-size="11.00" class="sc-notoserifcjksc">），而不仅仅是为专家提速。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">我们运行</text><text x="118.89 126.58 132.39 138.63 144.42 150.39 157.06 162.74 167.50 170.59 176.76 183.61 189.57 196.24 202.10" y="276.91" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="211.58" y="276.91" font-size="11.00" class="sc-notoserifcjksc">评估集中由</text><text x="269.47" y="276.91" font-size="11.00" class="sc-loraregular">10</text><text x="283.20" y="276.91" font-size="11.00" class="sc-notoserifcjksc">个挑战组成的子集：</text><text x="382.20 388.23 394.14 400.57 410.40 416.29 420.55 425.50 431.30 439.32 442.32 448.28 453.37 458.46 464.90" y="276.91" font-size="11.00" class="sc-loraregular">geometry_lesson</text><text x="471.58" y="276.91" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="516.80" y="276.91" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="124.77" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="135.77" y="292.53" font-size="11.00" class="sc-loraregular">snapshot</text><text x="182.15" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.15 199.59 204.35 207.44 213.79 216.88 223.56 231.58 236.67 240.93 247.36 252.31" y="292.53" font-size="11.00" class="sc-loraregular">origin_story</text><text x="258.12" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="269.12 272.21 278.79 284.75 291.33 295.59 298.85 303.13 308.94 316.96 322.81 327.57 330.67 335.76 338.85" y="292.53" font-size="11.00" class="sc-loraregular">identity_crisis</text><text x="343.94" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="354.94 360.03 363.13 369.47 375.96 380.22 388.24 392.50 398.46 403.55" y="292.53" font-size="11.00" class="sc-loraregular">sight_test</text><text x="407.81" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="418.81 428.64 435.21 439.47 442.56 449.16" y="292.53" font-size="11.00" class="sc-loraregular">mutiny</text><text x="454.96" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00 78.59 85.02 91.59 98.17 101.26 107.94 111.03 119.05 125.61 130.30 136.74 140.99 147.43 153.22 159.66" y="308.15" font-size="11.00" class="sc-loraregular">houdini_protocol</text><text x="165.54" y="308.15" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="179.44 185.29 189.97 196.41 201.50 206.60 212.50 219.08 227.10 235.91 239.00 243.69 249.65" y="308.15" font-size="11.00" class="sc-loraregular">crossed_wires</text><text x="254.74" y="308.15" font-size="11.00" class="sc-notoserifcjksc">。我们报告每个模型在这</text><text x="378.64" y="308.15" font-size="11.00" class="sc-loraregular">10</text><text x="392.36" y="308.15" font-size="11.00" class="sc-notoserifcjksc">个挑战上的平均总体解决率。</text><text x="72.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.81 176.51" y="357.88" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="182.51" y="357.88" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="193.51 201.19 207.00 213.24 219.04 225.00 231.68 237.35 242.12 245.21 251.38 258.22 264.18 270.86 276.71" y="357.88" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="286.19" y="357.88" font-size="11.00" class="sc-notoserifcjksc">是在一个预发布快照上运行的，我们评估认为该快照</text><text x="72.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">在能力上与正式发布的模型非常接近。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="406.45" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21" y="406.45" font-size="11.00" class="sc-notoserifcjksc">完成了全部挑战的</text><text x="213.11" y="406.45" font-size="11.00" class="sc-loraregular">3.3%</text><text x="237.64" y="406.45" font-size="11.00" class="sc-notoserifcjksc">，相比</text><text x="273.53 281.22 284.21 289.82 296.39 302.97 308.93 311.82 318.06 324.49 331.17 337.85 343.73 347.99 350.88" y="406.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="359.77" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="373.66 380.32 382.67 387.74" y="406.45" font-size="11.00" class="sc-loraregular">0.7%</text><text x="400.21" y="406.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="414.10 421.79 424.78 430.39 436.96 443.54 449.50 452.39 460.88 466.56 469.65 475.56 482.12 485.02 490.98 493.68" y="406.45" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="502.57" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="516.47" y="406.45" font-size="11.00" class="sc-loraregular">0%</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">略有提升。相比之下，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 226.53 232.96 239.64 246.32 252.20 256.46 259.35 265.35 268.05" y="422.07" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="276.94" y="422.07" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="312.83" y="422.07" font-size="11.00" class="sc-loraregular">46.1%</text><text x="344.33" y="422.07" font-size="11.00" class="sc-notoserifcjksc">的任务，</text><text x="388.33 396.02 399.01 404.62 411.18 417.76 423.73 426.62 436.55 442.41 446.67 453.26 459.69 464.79 467.68 473.68 476.38" y="422.07" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="483.28" y="422.07" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="72.00 78.36 82.36 84.72 89.79" y="437.69" font-size="11.00" class="sc-loraregular">61.7%</text><text x="99.36" y="437.69" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="110.36 118.05 121.04 126.65 133.21 139.79 145.76 148.65 157.38 163.95 170.52 175.61 178.50 184.50 187.20" y="437.69" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="196.09" y="437.69" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="231.98 238.27 242.85 245.45 251.81" y="437.69" font-size="11.00" class="sc-loraregular">67.6%</text><text x="261.38" y="437.69" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p027.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 27 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">27</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 105.91 108.01 113.54 117.02 119.39 126.54 131.26 134.20 139.54 145.11 147.47 152.33 154.43" y="390.43" font-size="9.00" class="sc-lorabold">3.3.2.A] Haiku 5.5</text><text x="161.66" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">相比</text><text x="182.02 189.18 193.90 196.84 202.18 207.75 210.11 215.04 217.13" y="390.43" font-size="9.00" class="sc-lorabold">Haiku 4.5</text><text x="224.36" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="235.73" y="390.43" font-size="9.00" class="sc-lorabold">Sonnet 5</text><text x="275.84" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">有所提升，但在</text><text x="341.21 347.40 352.36 357.74 362.40 367.24 372.99 377.70 382.02 384.97 389.83 395.78 400.63 406.37 411.03" y="390.43" font-size="9.00" class="sc-lorabold">CyScenarioBench</text><text x="418.99" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">上的得分不及其他近期发布的</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjkscbold">模型。</text><text x="99.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">柱状图显示各模型的总体解决率，为我们子集中</text><text x="290.37" y="402.13" font-size="9.00" class="sc-loraregular">10</text><text x="301.60" y="402.13" font-size="9.00" class="sc-notoserifcjksc">个挑战的平均值。本评估在关闭我们的网络安全缓解措施的</text><text x="72.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">情况下运行。</text><text x="72.00" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.3 Binary Exploitation Benchmark</text><text x="308.25" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（原名</text><text x="350.34" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">OSS-Fuzz</text><text x="412.00" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00" y="475.15" font-size="11.00" class="sc-notoserifcjksc">本评估衡量无引导的漏洞发现能力，以及模型针对自己发现的漏洞，在构建可用的概念验证</text><text x="72.00" y="490.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.57 94.25 100.69 107.07 110.68 116.06 122.44 126.04 131.42 137.22 143.65 150.33 156.13 162.09 168.66" y="490.77" font-size="11.00" class="sc-loraregular">proof-of-concept</text><text x="172.91" y="490.77" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用方面能推进到什么程度。每个任务向模型提供某个开源项目中的</text><text x="72.00" y="506.39" font-size="11.00" class="sc-notoserifcjksc">单个函数作为入口点，要求模型找出一个漏洞并为该漏洞编写漏洞利用。模型不会得到任何关于</text><text x="72.00" y="522.01" font-size="11.00" class="sc-notoserifcjksc">漏洞可能所在位置的提示。这</text><text x="217.89" y="522.01" font-size="11.00" class="sc-loraregular">831</text><text x="237.10" y="522.01" font-size="11.00" class="sc-notoserifcjksc">个入口点覆盖了</text><text x="316.99 325.36 331.80 338.23 344.58 347.57" y="522.01" font-size="11.00" class="sc-loraregular">Google</text><text x="356.43" y="522.01" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="370.32 379.05 385.29 391.53 396.91 402.83 409.39 414.95" y="522.01" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="423.47" y="522.01" font-size="11.00" class="sc-notoserifcjksc">语料库中的</text><text x="481.37" y="522.01" font-size="11.00" class="sc-loraregular">228</text><text x="502.25" y="522.01" font-size="11.00" class="sc-notoserifcjksc">个项</text><text x="72.00" y="537.63" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="588.50" font-size="11.00" class="sc-notoserifcjksc">每次试验按五级阶梯计分，从内存安全崩溃（</text><text x="292.00 298.65 301.36" y="588.50" font-size="11.00" class="sc-loraregular">0.2</text><text x="307.27" y="588.50" font-size="11.00" class="sc-notoserifcjksc">）到控制流劫持（</text><text x="395.27 399.27 401.81" y="588.50" font-size="11.00" class="sc-loraregular">1.0</text><text x="408.64" y="588.50" font-size="11.00" class="sc-notoserifcjksc">）。如</text><text x="444.54 452.23 455.22 460.83 467.39 473.97 479.93 482.83 491.56 498.13 504.70 509.79 512.68 518.68 521.38" y="588.50" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="72.00" y="604.12" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="105.00" y="604.12" font-size="11.00" class="sc-notoserifcjksc">中所述，自</text><text x="162.89 168.80 175.55 181.46" y="604.12" font-size="11.00" class="sc-loraregular">2026</text><text x="190.71" y="604.12" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="204.61" y="604.12" font-size="11.00" class="sc-loraregular">8</text><text x="213.68" y="604.12" font-size="11.00" class="sc-notoserifcjksc">月起，我们在本评估中使用了新的运行框架；这些改动使成功结果</text><text x="72.00" y="619.74" font-size="11.00" class="sc-notoserifcjksc">显著多于使用此前运行框架时，因此此处报告的分数相对于早期系统卡中报告的结果有所提高。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="685.65" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51" y="685.65" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="196.40" y="685.65" font-size="11.00" class="sc-loraregular">3</text><text x="205.42" y="685.65" font-size="11.00" class="sc-notoserifcjksc">次控制流劫持。相比之下，</text><text x="337.42 345.11 348.10 353.71 360.28 366.85 372.82 375.71 385.64 391.51 395.76 402.35 408.79 413.88 416.77 422.77 425.47" y="685.65" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="432.37" y="685.65" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="468.26" y="685.65" font-size="11.00" class="sc-loraregular">81</text><text x="481.34" y="685.65" font-size="11.00" class="sc-notoserifcjksc">次控制流劫</text><text x="72.00" y="701.27" font-size="11.00" class="sc-notoserifcjksc">持，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 141.02 147.59 154.16 159.25 162.15 168.14 170.85" y="701.27" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="179.73" y="701.27" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="215.63" y="701.27" font-size="11.00" class="sc-loraregular">106</text><text x="235.71" y="701.27" font-size="11.00" class="sc-notoserifcjksc">次，</text><text x="257.71 265.40 268.39 274.00 280.57 287.15 293.11 296.00 302.24 308.68 315.35 322.03 327.92 332.17 335.07 341.06 343.77" y="701.27" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="444.54" y="579.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="444.54" y="579.70" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="479.94" y="579.70" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="482.83" y="579.70" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="509.79" y="579.70" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="512.68" y="579.70" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="527.38" y="579.70" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="72.00" y="595.32" width="11.00" height="11.00" .55 277.12 283.70 289.66 292.55 298.79 305.22 311.90 318.58 324.46 328.72 331.61" y="98.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="340.50" y="98.23" font-size="11.00" class="sc-notoserifcjksc">也略有提升，但尚未达到</text><text x="464.39 472.08 475.07 480.68 487.25 493.83 499.79 502.68 512.62 518.48 522.74 529.32 535.76" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="101.49" y="113.85" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="148.93" y="113.85" font-size="11.00" class="sc-notoserifcjksc">等近期发布模型的水平。</text><text x="72.00" y="466.73" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="466.73" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.15 108.25 113.79" y="466.73" font-size="9.00" class="sc-lorabold">3.3.3.A]</text><text x="119.63" y="466.73" font-size="9.00" class="sc-notoserifcjkscbold">在漏洞利用开发方面，</text><text x="209.63 215.82 218.63 223.34 228.91 234.27 239.11 241.48 248.63 253.35 256.29 261.64 267.20 269.57 274.43 276.52" y="466.73" font-size="9.00" class="sc-lorabold">Claude Haiku 5.5</text><text x="283.75" y="466.73" font-size="9.00" class="sc-notoserifcjkscbold">相比</text><text x="304.12 310.31 313.12 317.84 323.40 328.76 333.60 335.97 343.13 347.84 350.78 356.13 361.69 364.06 368.98 371.08" y="466.73" font-size="9.00" class="sc-lorabold">Claude Haiku 4.5</text><text x="378.31" y="466.73" font-size="9.00" class="sc-notoserifcjkscbold">有小幅提升，与</text><text x="443.67" y="466.73" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="515.64" y="466.73" font-size="9.00" class="sc-notoserifcjkscbold">持</text><text x="72.00" y="478.43" font-size="9.00" class="sc-notoserifcjkscbold">平。</text><text x="90.00" y="478.43" font-size="9.00" class="sc-notoserifcjksc">在漏洞检测方面，它相比</text><text x="191.37 197.66 200.11 204.70 210.07 215.45 220.33 222.70 229.64 234.29 236.82 241.65 247.02 249.39 254.27 256.48" y="478.43" font-size="9.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="263.75" y="478.43" font-size="9.00" class="sc-notoserifcjksc">提升了一个台阶，与</text><text x="347.12 353.41 355.86 360.45 365.82 371.20 376.08 378.45 383.55 388.82 394.28 399.74 404.56 408.04 410.41" y="478.43" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="417.68" y="478.43" font-size="9.00" class="sc-notoserifcjksc">相当。</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 116.56 122.37" y="551.46" font-size="11.00" class="sc-loraregular">ExploitGym</text><text x="135.10" y="551.46" font-size="11.00" class="sc-notoserifcjksc">是一个大规模公开基准测试，衡量</text><text x="302.99" y="551.46" font-size="11.00" class="sc-loraregular">AI</text><text x="316.45" y="551.46" font-size="11.00" class="sc-notoserifcjksc">智能体能否将已知漏洞转化为实现未授权代码</text><text x="72.00" y="567.08" font-size="11.00" class="sc-notoserifcjksc">执行的可用漏洞利用，以及能否读取存储在智能体授权范围之外、动态生成的秘密标志。</text><text x="72.00" y="632.42" font-size="11.00" class="sc-notoserifcjksc">该基准测试包含跨三个领域的</text><text x="217.89" y="632.42" font-size="11.00" class="sc-loraregular">869</text><text x="239.68" y="632.42" font-size="11.00" class="sc-notoserifcjksc">个真实世界漏洞实例：</text><text x="349.68 355.68 362.43" y="632.42" font-size="11.00" class="sc-loraregular">502</text><text x="371.23" y="632.42" font-size="11.00" class="sc-notoserifcjksc">个取自开源项目及</text><text x="462.13 469.82 477.00 483.60 491.19 499.92 506.16" y="632.42" font-size="11.00" class="sc-loraregular">CVE/OSV</text><text x="516.24" y="632.42" font-size="11.00" class="sc-notoserifcjksc">记录</text><text x="72.00" y="648.04" font-size="11.00" class="sc-notoserifcjksc">的用户态目标，</text><text x="149.00" y="648.04" font-size="11.00" class="sc-loraregular">181</text><text x="166.08" y="648.04" font-size="11.00" class="sc-notoserifcjksc">个位于</text><text x="201.98 209.66 216.25 220.94 227.38 237.21" y="648.04" font-size="11.00" class="sc-loraregular">Chrome</text><text x="246.06" y="648.04" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="259.96 267.14 273.32 276.22 280.15 285.70 291.14 296.82 303.05 308.91 313.67 316.76 323.33" y="648.04" font-size="11.00" class="sc-loraregular">V8 JavaScript</text><text x="330.48" y="648.04" font-size="11.00" class="sc-notoserifcjksc">引擎中的目标，以及</text><text x="432.37" y="648.04" font-size="11.00" class="sc-loraregular">186</text><text x="451.81" y="648.04" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="465.70" y="648.04" font-size="11.00" class="sc-loraregular">Linux</text><text x="497.12" y="648.04" font-size="11.00" class="sc-notoserifcjksc">内核目</text><text x="72.00" y="663.66" font-size="11.00" class="sc-notoserifcjksc">标。对于每个实例，智能体会获得存在漏洞的源代码和构建配置、一个触发该漏洞的漏洞验证输</text><text x="72.00" y="679.28" font-size="11.00" class="sc-notoserifcjksc">入，以及一个用于与目标交互的容器化运行时环境。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p029.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 29 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">29</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">任务是开发一个漏洞利用，实现未授权代码执行并读取存储在智能体授权范围之外、动态生成的</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">秘密标志。我们在评估所有任务时均禁用</text><text x="272.89" y="114.42" font-size="11.00" class="sc-loraregular">ASLR</text><text x="299.28" y="114.42" font-size="11.00" class="sc-notoserifcjksc">、栈金丝雀、</text><text x="365.28" y="114.42" font-size="11.00" class="sc-loraregular">KASLR</text><text x="402.08" y="114.42" font-size="11.00" class="sc-notoserifcjksc">以及（</text><text x="435.08" y="114.42" font-size="11.00" class="sc-loraregular">V8</text><text x="451.34" y="114.42" font-size="11.00" class="sc-notoserifcjksc">沙箱逃逸任务除</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">外）</text><text x="94.00" y="130.04" font-size="11.00" class="sc-loraregular">V8</text><text x="110.26" y="130.04" font-size="11.00" class="sc-notoserifcjksc">堆沙箱；内核目标保持启用</text><text x="245.15 251.39 261.49 268.33 274.08 281.67 287.91 298.01 304.89" y="130.04" font-size="11.00" class="sc-loraregular">SMEP/SMAP</text><text x="311.56" y="130.04" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="392.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="392.89" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.04 108.14 113.67 117.14 119.51 125.70 128.51 133.23 138.79 144.15 148.99 151.36 158.52 163.23 166.18 171.52 177.08 179.45 184.31 186.41" y="392.89" font-size="9.00" class="sc-lorabold">3.3.4.A] Claude Haiku 5.5</text><text x="193.63" y="392.89" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="205.00 210.62 215.55 220.92 223.73 228.82 231.73 235.40 242.13 247.09" y="392.89" font-size="9.00" class="sc-lorabold">ExploitGym</text><text x="257.73" y="392.89" font-size="9.00" class="sc-notoserifcjkscbold">上的表现优于</text><text x="314.10" y="392.89" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="383.70" y="392.89" font-size="9.00" class="sc-notoserifcjkscbold">，但仍远低于其他</text><text x="458.06" y="392.89" font-size="9.00" class="sc-lorabold">Claude 5.5</text><text x="504.10" y="392.89" font-size="9.00" class="sc-notoserifcjkscbold">系列模</text><text x="72.00" y="404.59" font-size="9.00" class="sc-notoserifcjkscbold">型</text><text x="81.00" y="404.59" font-size="9.00" class="sc-notoserifcjksc">。柱状图显示在</text><text x="146.37" y="404.59" font-size="9.00" class="sc-loraregular">2</text><text x="153.57" y="404.59" font-size="9.00" class="sc-notoserifcjksc">小时和</text><text x="182.93" y="404.59" font-size="9.00" class="sc-loraregular">6</text><text x="190.50" y="404.59" font-size="9.00" class="sc-notoserifcjksc">小时实际耗时预算下，利用给定漏洞成功完成的漏洞利用数量。成功的条件是获取动态</text><text x="72.00" y="416.29" font-size="9.00" class="sc-notoserifcjksc">生成的秘密标志，并且每个成功的漏洞利用都会经智能体评判者验证，以确认其使用的是预期的漏洞。</text></svg></div>
