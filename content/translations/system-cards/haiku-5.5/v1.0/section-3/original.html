" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.14153</text><text x="504.00 508.70" y="751.81" font-size="9.00" class="sc-loraregular">23</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39 101.39 117.39 133.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00 80.39 84.03" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43 106.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="154.36" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51 193.51 204.51 215.51 226.51 237.51 248.51" y="154.36" font-size="11.00" class="sc-notoserifcjksc">并非前沿模型，但与</text><text x="262.40 270.89 276.57 279.66 285.57 292.13 295.03 300.99 303.69" y="154.36" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="312.58 323.58 334.58 345.58 356.58 367.58 378.58 389.58 400.58 411.58 422.58 433.58 444.58 455.58 466.58 477.58 488.58 499.58 510.58 521.58" y="154.36" font-size="11.00" class="sc-notoserifcjksc">相比，它在网络安全能力上实现了相对显著的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">提升。在我们的评估套件中，</text><text x="215.00 223.49 229.17 232.26 238.17 244.73 247.63 253.62 256.33" y="169.98" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="265.22 276.22 287.22 298.22 309.22 320.22 331.22" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的表现显著优于</text><text x="345.11 353.60 359.28 362.37 368.27 374.84 377.73 383.70 386.40" y="169.98" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="392.40 403.40 414.40 425.40" y="169.98" font-size="11.00" class="sc-notoserifcjksc">，但不及</text><text x="439.29 448.02 454.59 461.16 466.25 469.14 475.14 477.85" y="169.98" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="483.84" y="169.98" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="494.84 502.53 505.52 511.13 517.70 524.28" y="169.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="185.60" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="153.55 162.29 168.85 175.42 180.51 183.41" y="185.60" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="192.30 203.30 214.30 225.30 236.30 247.30 258.30" y="185.60" font-size="11.00" class="sc-notoserifcjksc">所取得的结果。</text><text x="72.00" y="235.32" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 92.02 94.73" y="235.32" font-size="11.00" class="sc-loraregular">3.3</text><text x="103.75 114.75 125.75 136.75 147.75 158.75 169.75 180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75 455.75" y="235.32" font-size="11.00" class="sc-notoserifcjksc">节中报告的所有能力评估结果，均是在关闭网络安全防护措施的情况下通过</text><text x="469.64 476.52 483.14" y="235.32" font-size="11.00" class="sc-loraregular">API</text><text x="489.71 500.71" y="235.32" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="250.94" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="266.56" font-size="11.00" class="sc-notoserifcjksc">时也反映了某些用户通过我们的</text><text x="226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划（</text><text x="464.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="475.73 486.73 497.73 508.73 519.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc">将能获得的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="282.18" font-size="11.00" class="sc-notoserifcjksc">能力水平。自</text><text x="140.89 146.80 153.55 159.46" y="282.18" font-size="11.00" class="sc-loraregular">2026</text><text x="168.71" y="282.18" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="182.60" y="282.18" font-size="11.00" class="sc-loraregular">8</text><text x="191.68 202.68 213.68 224.68 235.68 246.68 257.68 268.68 279.68 290.68 301.68 312.68 323.68 334.68 345.68 356.68 367.68 378.68 389.68 400.68" y="282.18" font-size="11.00" class="sc-notoserifcjksc">月以来，我们用于评估运行的许多运行框架（</text><text x="411.68 418.27 423.94 428.71 435.38 441.35 446.44" y="282.18" font-size="11.00" class="sc-loraregular">harness</text><text x="451.53 462.53 473.53 484.53 495.53 506.53 517.53 528.53" y="282.18" font-size="11.00" class="sc-notoserifcjksc">）已被重写。在这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="297.80" font-size="11.00" class="sc-notoserifcjksc">些情况下，所有较早的模型都经过了重新评估，以保持各模型之间的一致性，因此所得数值与此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="313.42" font-size="11.00" class="sc-notoserifcjksc">次变更之前发布的往期系统卡（</text><text x="226.00 232.18 237.99 243.08 247.34 253.30 263.14 266.03 273.72 279.39 284.08" y="313.42" font-size="11.00" class="sc-loraregular">System Card</text><text x="290.66 301.66 312.66 323.66 334.66 345.66 356.66 367.66 378.66 389.66" y="313.42" font-size="11.00" class="sc-notoserifcjksc">）中的数值有所不同。</text><text x="72.00 80.39 84.03" y="382.45" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39 109.39 123.39 137.39" y="382.45" font-size="14.00" class="sc-notosanscjkscbold">缓解措施</text><text x="72.00 83.00" y="409.01" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.68 149.35 152.44 158.35 164.92 167.81 173.81 176.51" y="409.01" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="185.40 196.40 207.40 218.40 229.40 240.40 251.40 262.40 273.40 284.40 295.40 306.40 317.40 328.40 339.40 350.40 361.40 372.40 383.40 394.40 405.40 416.40 427.40 438.40 449.40 460.40 471.40 482.40 493.40 504.40 515.40 526.40" y="409.01" font-size="11.00" class="sc-notoserifcjksc">相对缺乏高级网络安全能力，我们为其设置的网络安全防护措施所触发的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="424.63" font-size="11.00" class="sc-notoserifcjksc">活动范围明显小于其他近期发布的模型。这些安全防护措施针对的是违反我们政策的特定有害及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="440.25" font-size="11.00" class="sc-notoserifcjksc">潜在有害活动。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="473.77" font-size="11.00" class="sc-notoserifcjksc">符合条件的安全专业人员如被我们的网络安全防护措施拦截，可通过我们的</text><text x="435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="473.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划</text><text x="523.00" y="473.77" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="489.39" font-size="11.00" class="sc-notoserifcjksc">在网络安全拦截分类器有所放宽的条件下访问我们的模型。</text><text x="72.00 80.39 84.03" y="539.94" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74 109.74 123.74 137.74" y="539.94" font-size="14.00" class="sc-notosanscjkscbold">能力评估</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 115.03 120.99 127.67 133.52" y="604.70" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="140.11" y="601.04" font-size="6.60" class="sc-loraregular">1</text><text x="145.41 156.41 167.41 178.41 189.41 200.41 211.41 222.41 233.41 244.41 255.41 266.41 277.41 288.41 299.41 310.41" y="604.70" font-size="11.00" class="sc-notoserifcjksc">是一项网络安全基准测试，用于评估</text><text x="324.30 331.19" y="604.70" font-size="11.00" class="sc-loraregular">AI</text><text x="337.76 348.76 359.76 370.76 381.76 392.76 403.76 414.76 425.76 436.76 447.76 458.76 469.76 480.76 491.76 502.76 513.76 524.76" y="604.70" font-size="11.00" class="sc-notoserifcjksc">模型能在软件漏洞利用流程中推进到何种</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="620.32" font-size="11.00" class="sc-notoserifcjksc">程度（而非将漏洞利用作为单一的通过</text><text x="259.00" y="620.32" font-size="11.00" class="sc-loraregular">/</text><text x="266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59" y="620.32" font-size="11.00" class="sc-notoserifcjksc">失败事件来评分）。我们最近对此有</text><text x="442.59 453.59 464.59 475.59 486.59 497.59" y="620.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更详细的介绍</text><text x="508.59" y="620.32" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2605.14153" rel="noopener"><rect x="187.38" y="707.20" width="154.92" height="12.80" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="226.00" y="257.76" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/cyber-verification-program" rel="noopener"><rect x="226.00" y="257.76" width="11.00" hei <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p024.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 24 页"><text x="90.00 94.00" y="374.52" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00 95.90" y="390.71" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00 96.12" y="423.10" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00 508.64" y="751.81" font-size="9.00" class="sc-loraregular">24</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">该基准测试将漏洞利用分解为</text><text x="217.89 221.90" y="82.61" font-size="11.00" class="sc-loraregular">16</text><text x="231.15 242.15 253.15 264.15 275.15 286.15 297.15 308.15 319.15 330.15 341.15 352.15 363.15 374.15 385.15 396.15 407.15 418.15 429.15 440.15 451.15 462.15 473.15 484.15 495.15 506.15 517.15 528.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个可测量的能力标志。这些标志涵盖从覆盖范围和崩溃复现，到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">沙箱原语、任意读写、控制流劫持以及任意代码执行。这些标志分为五个层级，用以区分仅能触</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">发崩溃的模型与能够构建武器化所需的可复用原语的模型。这为进攻性网络能力提供了一种细粒</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">度的衡量方式。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">该基准测试针对</text><text x="151.89 159.08" y="195.95" font-size="11.00" class="sc-loraregular">V8</text><text x="168.15 179.15 190.15" y="195.95" font-size="11.00" class="sc-notoserifcjksc">引擎中</text><text x="204.04 210.01" y="195.95" font-size="11.00" class="sc-loraregular">41</text><text x="216.90 227.90 238.90 249.90" y="195.95" font-size="11.00" class="sc-notoserifcjksc">个近期（</text><text x="260.90 266.81 273.56 279.23" y="195.95" font-size="11.00" class="sc-loraregular">2024</text><text x="288.08 299.08 310.08 321.08 332.08 343.08 354.08 365.08 376.08" y="195.95" font-size="11.00" class="sc-notoserifcjksc">年及以后）的漏洞；</text><text x="387.08 394.27" y="195.95" font-size="11.00" class="sc-loraregular">V8</text><text x="403.34 414.34 425.34" y="195.95" font-size="11.00" class="sc-notoserifcjksc">是驱动</text><text x="439.24 446.92 453.51 458.20 464.63 474.47" y="195.95" font-size="11.00" class="sc-loraregular">Chrome</text><text x="483.32" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 75.94 81.48 86.93 92.60 98.84 104.69 109.46 112.55 119.11" y="211.57" font-size="11.00" class="sc-loraregular">JavaScript</text><text x="126.26" y="211.57" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="140.16 150.67 156.63 162.96 169.85 174.94 180.03 185.99 195.83 202.23 205.17" y="211.57" font-size="11.00" class="sc-loraregular">WebAssembly</text><text x="213.87 224.87 235.87 246.87 257.87 268.87 279.87 290.87 301.87 312.87 323.87 334.87 345.87 356.87 367.87" y="211.57" font-size="11.00" class="sc-notoserifcjksc">引擎。模型会获得一个存在漏洞的</text><text x="381.76 388.94" y="211.57" font-size="11.00" class="sc-loraregular">V8</text><text x="398.02 409.02 420.02 431.02 442.02 453.02 464.02 475.02 486.02 497.02 508.02 519.02" y="211.57" font-size="11.00" class="sc-notoserifcjksc">构建版本以及修复这些漏洞</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">的补丁，随后其任务是为该漏洞构建漏洞利用。该构建版本启用了多项缓解措施，包括</text><text x="492.89 500.08" y="227.19" font-size="11.00" class="sc-loraregular">V8</text><text x="509.15 520.15" y="227.19" font-size="11.00" class="sc-notoserifcjksc">堆沙</text><text x="72.00 83.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">箱、</text><text x="94.00 100.89 107.12 113.48" y="242.81" font-size="11.00" class="sc-loraregular">ASLR</text><text x="123.28 134.28 145.28 156.28 167.28 178.28" y="242.81" font-size="11.00" class="sc-notoserifcjksc">和栈金丝雀（</text><text x="189.28 194.38 198.63 204.31 210.16 216.07 218.96 224.79 230.47 237.14 242.82 247.58 250.67 256.64" y="242.81" font-size="11.00" class="sc-loraregular">stack canaries</text><text x="261.73 272.73 283.73 294.73 305.73 316.73 327.73 338.73 349.73 360.73 371.73 382.73 393.73 404.73 415.73 426.73 437.73 448.73 459.73 470.73 481.73 492.73 503.73 514.73" y="242.81" font-size="11.00" class="sc-notoserifcjksc">）。每个漏洞利用层级都由确定性验证器进行机械式评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">分。为抵御奖励破解（</text><text x="182.00 186.69 192.60 201.30 206.98 211.67 218.24 221.14 227.73 233.40 239.26 245.16 248.25 254.93" y="258.43" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="261.01 272.01 283.01 294.01 305.01" y="258.43" font-size="11.00" class="sc-notoserifcjksc">），内置于</text><text x="318.91 326.09" y="258.43" font-size="11.00" class="sc-loraregular">V8</text><text x="335.16 346.16 357.16 368.16" y="258.43" font-size="11.00" class="sc-notoserifcjksc">中的挑战</text><text x="379.16" y="258.43" font-size="11.00" class="sc-loraregular">-</text><text x="384.54 395.54 406.54 417.54 428.54 439.54 450.54 461.54 472.54 483.54 494.54 505.54 516.54 527.54" y="258.43" font-size="11.00" class="sc-notoserifcjksc">应答函数会在多种随机化堆布局</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="274.05" font-size="11.00" class="sc-notoserifcjksc">下重放，因此硬编码一个泄露的地址不会被算作解决方案。我们对每个漏洞运行五次试验。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="341.68" font-size="11.00" class="sc-notoserifcjksc">我们报告三项指标：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">所有试验和环境中每次试验的平均捕获标志数；</text><text x="108.00 115.69 121.37 127.93" y="390.26" font-size="11.00" class="sc-loraregular">Cap%</text><text x="137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="390.26" font-size="11.00" class="sc-notoserifcjksc">，即每个环境中所捕获的可用标志所占百分比（基于随机选取的三次试验子集），</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">并对所有环境取平均；以及</text><text x="108.00 119.00 130.00 141.00 152.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在普通组和</text><text x="165.89 172.78 179.35 183.60 189.77 198.16 204.72 211.30 217.33" y="422.64" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="226.18 237.18 248.18 259.18 270.18 281.18 292.18 303.18 314.18 325.18 336.18 347.18 358.18 369.18 380.18 391.18 402.18 413.18" y="422.64" font-size="11.00" class="sc-notoserifcjksc">组的运行中共生成的完整任意代码执行（</text><text x="424.18 429.86 434.58 440.98 444.25 448.50 453.19 458.87 463.82 469.62 472.52 478.32 484.75 491.33" y="422.64" font-size="11.00" class="sc-loraregular">arbitrary code</text><text x="108.00 113.91 119.68 125.59 131.44 138.01 142.26 145.36 151.79" y="438.26" font-size="11.00" class="sc-loraregular">execution</text><text x="158.47" y="438.26" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="169.47 176.30 183.99" y="438.26" font-size="11.00" class="sc-loraregular">ACE</text><text x="190.83 201.83 212.83 223.83 234.83 245.83 256.83 267.83 278.83" y="438.26" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用的数量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">每个环境均在两个组别下运行，轮次预算为</text><text x="283.89 290.02 296.85" y="471.22" font-size="11.00" class="sc-loraregular">300</text><text x="306.58 317.58 328.58 339.58 350.58 361.58 372.58 383.58 394.58 405.58 416.58 427.58 438.58 449.58 460.58 471.58 482.58 493.58 504.58 515.58 526.58" y="471.22" font-size="11.00" class="sc-notoserifcjksc">轮。在普通组中，模型进行一次不间断的尝试。</text><text x="72.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.35 103.60 109.77 118.16 124.72 131.30 137.33" y="486.84" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="486.84" font-size="11.00" class="sc-notoserifcjksc">组中，如果模型在未达到完整代码执行的情况下主动于用尽预算前停止，运行框</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="502.46" font-size="11.00" class="sc-notoserifcjksc">架会在同一对话中注入一条</text><text x="204.00" y="502.46" font-size="11.00" class="sc-loraregular">“</text><text x="208.40 219.40 230.40 241.40" y="502.46" font-size="11.00" class="sc-notoserifcjksc">继续尝试</text><text x="252.40" y="502.46" font-size="11.00" class="sc-loraregular">”</text><text x="256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24" y="502.46" font-size="11.00" class="sc-notoserifcjksc">提示词，并让其继续。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">在普通组中，</text><text x="138.00 146.49 152.17 155.26 161.17 167.73 170.63 176.62 179.33" y="552.18" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="188.21" y="552.18" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="202.11 208.95 214.78 221.35 224.34 230.77 234.04 238.30 245.14 251.10 257.78 263.63" y="552.18" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="273.11" y="552.18" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="287.01 292.97" y="552.18" font-size="11.00" class="sc-loraregular">41</text><text x="299.87" y="552.18" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="313.76 320.94" y="552.18" font-size="11.00" class="sc-loraregular">V8</text><text x="330.02 341.02 352.02 363.02 374.02 385.02 396.02" y="552.18" font-size="11.00" class="sc-notoserifcjksc">环境中平均获得</text><text x="409.91 415.90 418.61 422.61" y="552.18" font-size="11.00" class="sc-loraregular">5.15</text><text x="431.50 442.50 453.50 464.50 475.50 486.50" y="552.18" font-size="11.00" class="sc-notoserifcjksc">个能力标志，</text><text x="497.50 505.19 510.87 517.43" y="552.18" font-size="11.00" class="sc-loraregular">Cap%</text><text x="529.90" y="552.18" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00 78.13 84.31" y="567.80" font-size="11.00" class="sc-loraregular">38%</text><text x="93.88 104.88" y="567.80" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="118.77 125.66 132.23 136.48 142.65 151.04 157.60 164.18 170.21" y="567.80" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="179.06 190.06 201.06 212.06 223.06 234.06 245.06 256.06" y="567.80" font-size="11.00" class="sc-notoserifcjksc">组中，它平均获得</text><text x="269.96 276.31 279.02 285.01" y="567.80" font-size="11.00" class="sc-loraregular">6.56</text><text x="294.27 305.27 316.27 327.27" y="567.80" font-size="11.00" class="sc-notoserifcjksc">个标志，</text><text x="338.27 345.95 351.63 358.20" y="567.80" font-size="11.00" class="sc-loraregular">Cap%</text><text x="370.66" y="567.80" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="384.55 390.52 396.87" y="567.80" font-size="11.00" class="sc-loraregular">49%</text><text x="406.44 417.44 428.44 439.44 450.44 461.44" y="567.80" font-size="11.00" class="sc-notoserifcjksc">。在普通组和</text><text x="475.34 482.22 488.79 493.05 499.22 507.60 514.17 520.74 526.77" y="567.80" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">组的运行中，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 184.78 190.46 193.55 199.46 206.02 208.92 214.91 217.62" y="583.42" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="226.51 237.51 248.51 259.51 270.51 281.51 292.51 303.51 314.51 325.51 336.51 347.51 358.51 369.51" y="583.42" font-size="11.00" class="sc-notoserifcjksc">实现完整任意代码执行的比例为</text><text x="383.40 387.40 389.94 396.77" y="583.42" font-size="11.00" class="sc-loraregular">1.0%</text><text x="406.34" y="583.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="417.34 423.04 430.16 436.12 440.13" y="583.42" font-size="11.00" class="sc-loraregular">4/410</text><text x="446.96 457.96" y="583.42" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p025.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 25 页"><text x="72.00 79.72 82.85 90.57 93.70 101.20 104.58 114.63 122.19 130.04 137.84 145.86 154.29 163.10 168.09 171.52 179.81 188.00 196.02 204.46 212.25" y="549.39" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.2 CyScenarioBench</text><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">25</text><text x="72.00" y="390.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 104.77 106.87 112.40 115.88 118.24 125.40 130.11 133.06 138.40 143.96 146.33 151.19 153.29" y="390.42" font-size="9.00" class="sc-lorabold">3.3.1.A] Haiku 5.5</text><text x="160.51" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="171.88 177.50 182.43 187.80 190.61 195.70 198.61 202.29 208.24 213.08 218.83 223.49" y="390.42" font-size="9.00" class="sc-lorabold">ExploitBench</text><text x="231.44 240.44 249.44 258.44 267.44" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">上的结果。</text><text x="276.44 280.04 288.24 293.10 297.75 303.00" y="390.42" font-size="9.00" class="sc-loraregular">“Mean”</text><text x="306.14 315.14 324.14 333.14 342.14 351.14 360.14 369.14 378.14 387.14 396.14 405.14 414.14 423.14 432.14 441.14 450.14 459.14 468.14 477.14 486.14 495.14 504.14 513.14 522.14" y="390.42" font-size="9.00" class="sc-notoserifcjksc">指每个模型在所有试验和环境中捕获的能力标志的平均数</text><text x="72.00 81.00" y="402.12" font-size="9.00" class="sc-notoserifcjksc">量。</text><text x="90.00 93.60 99.89 104.54 109.91 117.74" y="402.12" font-size="9.00" class="sc-loraregular">“Cap%”</text><text x="120.88 129.88 138.88 147.88 156.88 165.88 174.88 183.88 192.88 201.88 210.88 219.88 228.88 237.88 246.88 255.88 264.88 273.88 282.88 291.88 300.88 309.88 318.88 327.88 336.88 345.88 354.88 363.88 372.88 381.88 390.88 399.88 408.88 417.88 426.88 435.88 444.88 453.88 462.88 471.88 480.88 489.88 498.88 507.88 516.88 525.88" y="402.12" font-size="9.00" class="sc-notoserifcjksc">指在给定环境中，从五次试验中随机选取三次所捕获标志占总标志数的百分比，并对所有环境取平均。平</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">均值和捕获率均为</text><text x="146.37 152.00 157.37 160.86 165.91 172.76 178.14 183.52 188.45" y="413.83" font-size="9.00" class="sc-loraregular">AutoNudge</text><text x="195.70 204.70 213.70 222.70 231.70" y="413.83" font-size="9.00" class="sc-notoserifcjksc">组的结果。</text><text x="240.70" y="413.83" font-size="9.00" class="sc-loraregular">“</text><text x="244.30 253.30" y="413.83" font-size="9.00" class="sc-notoserifcjksc">完整</text><text x="264.66 270.25 276.54 282.14" y="413.83" font-size="9.00" class="sc-loraregular">ACE”</text><text x="285.28 294.28 303.28" y="413.83" font-size="9.00" class="sc-notoserifcjksc">是全部</text><text x="314.65 319.53 322.80" y="413.83" font-size="9.00" class="sc-loraregular">410</text><text x="330.76 339.76 348.76 357.76 366.76 375.76 384.76 393.76 402.76 411.76" y="413.83" font-size="9.00" class="sc-notoserifcjksc">次运行（包括普通组和</text><text x="423.13 428.76 434.13 437.62 442.67 449.52 454.90 460.28 465.21" y="413.83" font-size="9.00" class="sc-loraregular">AutoNudge</text><text x="472.46 481.46 490.46 499.46 508.46 517.46 526.46" y="413.83" font-size="9.00" class="sc-notoserifcjksc">组）中实现任意</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="425.52" font-size="9.00" class="sc-notoserifcjksc">代码执行的总次数。这些结果是在关闭全部网络安全防护措施、但启用逃逸分类器及其他安全措施的情况下获得的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="482.47" font-size="11.00" class="sc-notoserifcjksc">这些结果可能无法与在各厂商实际部署条件下产生的公开排行榜条目直接比较。我们报告的结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="498.09" font-size="11.00" class="sc-notoserifcjksc">使用的是作者提供的静态、统一的运行框架，而非原生运行框架。</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="570.55" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69 175.69" y="570.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="189.58 193.18 197.94 202.62 208.59 214.67 221.24 224.23 229.91" y="570.55" font-size="11.00" class="sc-loraregular">Irregular</text><text x="237.56 248.56 259.56 270.56 281.56 292.56 303.56 314.56 325.56 336.56 347.56 358.56 369.56 380.56 391.56 402.56 413.56 424.56 435.56 446.56 457.56 468.56 479.56 490.56 501.56 512.56 523.56" y="570.55" font-size="11.00" class="sc-notoserifcjksc">开发的一项基准测试，用于评估模型能否在现实约束下规划并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="586.17" font-size="11.00" class="sc-notoserifcjksc">执行多阶段网络行动，而非执行孤立的技术任务。大多数网络安全基准测试侧重于孤立考察单项</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="601.79" font-size="11.00" class="sc-notoserifcjksc">能力的短程挑战，而</text><text x="173.89 181.58 187.39 193.63 199.42 205.39 212.06 217.74 222.50 225.59 231.76 238.61 244.57 251.24 257.10" y="601.79" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="266.58 277.58 288.58 299.58 310.58 321.58 332.58 343.58 354.58 365.58 376.58 387.58 398.58 409.58 420.58 431.58 442.58 453.58 464.58 475.58 486.58 497.58 508.58 519.58" y="601.79" font-size="11.00" class="sc-notoserifcjksc">衡量的是编排能力：即在相互依赖的行动阶段中协调安</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="617.41" font-size="11.00" class="sc-notoserifcjksc">排攻击技术的先后顺序，包括做出分支决策、遵守约束，以及从错误和状态不一致中恢复。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="700.09" font-size="11.00" class="sc-notoserifcjksc">该基准测试采用三层级结构。任务级评估衡量原子能力，例如代码生成和载荷调整；路径级评估</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p026.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 26 页"><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">26</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">涵盖与攻击树分支相对应的多步骤序列；活动级评估则是包含不确定性和行动摩擦的完整攻击模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">拟。各场景源自对真实网络安全事件的分析，运行于容器化网络环境中，这些环境配有贴近现实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的操作系统、真实的服务配置、会作出响应的防御监控，以及安全意识程度各异的模拟员工。所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">有场景均为全新、从零构建（而非取自已公开的夺旗赛（</text><text x="432.88 443.88 454.88 465.88 476.88 487.88 498.88 509.88 520.88" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）演练），且评估集</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">者提供有意义的能力提升（</text><text x="204.00 210.57 217.13 220.13 223.22 227.07" y="176.33" font-size="11.00" class="sc-loraregular">uplift</text><text x="231.32 242.32 253.32 264.32 275.32 286.32 297.32 308.32 319.32 330.32 341.32 352.32 363.32" y="176.33" font-size="11.00" class="sc-notoserifcjksc">），而不仅仅是为专家提速。</text><text x="72.00 83.00 94.00 105.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">我们运行</text><text x="118.89 126.58 132.39 138.63 144.42 150.39 157.06 162.74 167.50 170.59 176.76 183.61 189.57 196.24 202.10" y="276.91" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="211.58 222.58 233.58 244.58 255.58" y="276.91" font-size="11.00" class="sc-notoserifcjksc">评估集中由</text><text x="269.47 273.48" y="276.91" font-size="11.00" class="sc-loraregular">10</text><text x="283.20 294.20 305.20 316.20 327.20 338.20 349.20 360.20 371.20" y="276.91" font-size="11.00" class="sc-notoserifcjksc">个挑战组成的子集：</text><text x="382.20 388.23 394.14 400.57 410.40 416.29 420.55 425.50 431.30 439.32 442.32 448.28 453.37 458.46 464.90" y="276.91" font-size="11.00" class="sc-loraregular">geometry_lesson</text><text x="471.58" y="276.91" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="516.80" y="276.91" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="124.77" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="135.77 140.86 147.54 153.21 159.78 164.87 171.46 177.90" y="292.53" font-size="11.00" class="sc-loraregular">snapshot</text><text x="182.15" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.15 199.59 204.35 207.44 213.79 216.88 223.56 231.58 236.67 240.93 247.36 252.31" y="292.53" font-size="11.00" class="sc-loraregular">origin_story</text><text x="258.12" y="292.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="269.12 272.21 278.79 284.75 291.33 295.59 298.8 ze="11.00" class="sc-loraregular">CyScenarioBench</text><text x="286.19 297.19 308.19 319.19 330.19 341.19 352.19 363.19 374.19 385.19 396.19 407.19 418.19 429.19 440.19 451.19 462.19 473.19 484.19 495.19 506.19 517.19 528.19" y="357.88" font-size="11.00" class="sc-notoserifcjksc">是在一个预发布快照上运行的，我们评估认为该快照</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">在能力上与正式发布的模型非常接近。</text><text x="72.00 80.49 86.17 89.26 95.17 101.73 104.63 110.62 113.33" y="406.45" font-size="11.00" class="sc-loraregular">Haiku 5.5</text><text x="122.21 133.21 144.21 155.21 166.21 177.21 188.21 199.21" y="406.45" font-size="11.00" class="sc-notoserifcjksc">完成了全部挑战的</text><text x="213.11 219.24 221.94 228.07" y="406.45" font-size="11.00" class="sc-loraregular">3.3%</text><text x="237.64 248.64 259.64" y="406.45" font-size="11.00" class="sc-notoserifcjksc">，相比</text><text x="273.53 281.22 284.21 289.82 296.39 302.97 308.93 311.82 318.06 324.49 331.17 337.85 343.73 347.99 350.88" y="406.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="359.77" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="373.66 380.32 382.67 387.74" y="406.45" font-size="11.00" class="sc-loraregular">0.7%</text><text x="400.21" y="406.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="414.10 421.79 424.78 430.39 436.96 443.54 449.50 452.39 460.88 466.56 469.65 475.56 482.12 485.02 490.98 493.68" y="406.45" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="502.57" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="516.47 523.30" y="406.45" font-size="11.00" class="sc-loraregular">0%</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">略有提升。相比之下，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 21 .13" font-size="9.00" class="sc-loraregular">10</text><text x="301.60 310.60 319.60 328.60 337.60 346.60 355.60 364.60 373.60 382.60 391.60 400.60 409.60 418.60 427.60 436.60 445.60 454.60 463.60 472.60 481.60 490.60 499.60 508.60 517.60 526.60" y="402.13" font-size="9.00" class="sc-notoserifcjksc">个挑战的平均值。本评估在关闭我们的网络安全缓解措施的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">情况下运行。</text><text x="72.00 79.79 83.17 90.95 94.33 102.12 105.22 113.57 117.19 125.78 134.60 139.85 147.71 150.81 157.72 164.74 173.56 177.17 185.46 189.08 194.12 202.94 207.98 211.59 219.89 228.48 231.58 239.93 247.96 256.55 264.37 272.97 286.59 295.41 300.66" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.3 Binary Exploitation Benchmark</text><text x="308.25 321.25 334.25" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（原名</text><text x="350.34 360.55 368.46 376.38 383.96 390.85 399.44 405.72" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">OSS-Fuzz</text><text x="412.00" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="475.15" font-size="11.00" class="sc-notoserifcjksc">本评估衡量无引导的漏洞发现能力，以及模型针对自己发现的漏洞，在构建可用的概念验证</text><text x="72.00" y="490.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.57 94.25 100.69 107.07 110.68 116.06 122.44 126.04 131.42 137.22 143.65 150.33 156.13 162.09 168.66" y="490.77" font-size="11.00" class="sc-loraregular">proof-of-concept</text><text x="172.91 183.91 194.91 205.91 216.91 227.91 238.91 249.91 260.91 271.91 282.91 293.91 304.91 315.91 326.91 337.91 348.91 359.91 370.91 381.91 392.91 403.91 414.91 425.91 436.91 447.91 458.91 469.91 480.91 491.91 502.91 513.91 524.91" y="490.77" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用方面能推进到什么程度。每个任务向模型提供某个开源项目中的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="506.39" font-size="11.00" class="sc-notoserifcjksc">单个函数作为入口点，要求模型找出一个漏洞并为该漏洞编写漏洞利用。模型不会得到任何关于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="522.01" font-size="11.00" class="sc-notoserifcjksc">漏洞可能所在位置的提示。这</text><text x="217.89 224.08 230.20" y="522.01" font-size="11.00" class="sc-loraregular">831</text><text x="237.10 248.10 259.10 270.10 281.10 292.10 303.10" y="522.01" font-size="11.00" class="sc-notoserifcjksc">个入口点覆盖了</text><text x="316.99 325.36 331.80 338.23 344.58 347.57" y="522.01" font-size="11.00" class="sc-loraregular">Google</text><text x="356.43" y="522.01" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="370.32 379.05 385.29 391.53 396.91 402.83 409.39 414.95" y="522.01" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="423.47 434.47 445.47 456.47 467.47" y="522.01" font-size="11.00" class="sc-notoserifcjksc">语料库中的</text><text x="481.37 487.27 493.18" y="522.01" font-size="11.00" class="sc-loraregular">228</text><text x="502.25 513.25" y="522.01" font-size="11.00" class="sc-notoserifcjksc">个项</text><text x="72.00 83.00" y="537.63" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="588.50" font-size="11.00" class="sc-notoserifcjksc">每次试验按五级阶梯计分，从内存安全崩溃（</text><text x="292.00 298.65 301.36" y="588.50" font-size="11.00" class="sc-loraregular">0.2</text><text x="307.27 318.27 329.27 340.27 351.27 362.27 373.27 384.27" y="588.50" font-size="11.00" class="sc-notoserifcjksc">）到控制流劫持（</text><text x="395.27 399.27 401.81" y="588.50" font-size="11.00" class="sc-loraregular">1.0</text><text x="408.64 419.64 430.64" y="588.50" font-size="11.00" class="sc-notoserifcjksc">）。如</text><text x="444.54 452.23 455.22 460.83 467.39 473.97 479.93 482.83 491.56 498.13 504.70 509.79 512.68 518.68 521.38" y="588.50" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="72.00 83.00 94.00" y="604.12" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="105.00 116.00 127.00 138.00 149.00" y="604.12" font-size="11.00" class="sc-notoserifcjksc">中所述，自</text><text x="162.89 168.80 175.55 181.46" y="604.12" font-size="11.00" class="sc-loraregular">2026</text><text x="190.71" y="604.12" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="204.61" y="604.12" font-size="11.00" class="sc-loraregular">8</text><text x="213.68 224.68 235.68 246.68 257.68 268.68 279.68 290.68 301.68 312.68 323.68 334.68 345.68 356.68 367.68 378.68 389.68 400.68 411.68 422.68 433.68 444.68 455.68 466.68 477.68 488.68 499.68 510.68 521.68" y="604.12" font-size="11.00" class="sc-notoserifcjksc">月起，我们在本评估中使用了新的运行框架；这些改动使成功结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="619.74" font-size="11.00" class="sc-notoserifcjksc">显著多于使用此前运行框架时，因此此处报告的分数相对于早期系统卡中报告的结果有所提高。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 118.78 124.46 127.55 133.46 140.02 142.92 148.91 151.62" y="685.65" font-size="11.00" class="sc-loraregular">Claude Haiku 5.5</text><text x="160.51 171.51 182.51" y="685.65" font-size="11.00" class="sc-notoserifcjksc">产生了
