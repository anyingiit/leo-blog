space:normal;word-break:break-word;line-break:strict">股息政策</div></div><div style="line-height:7.18pt;position:absolute;text-align:justify;text-align-last:var(--justify);top:105pt;width:612pt"><div class="zh" style="position:absolute;top:-2.11pt;left:72.00pt;width:470.29pt;line-height:11.40pt;font-family:'Georgia','Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC','SimSun',serif;font-size:9.5pt;font-style:normal;font-weight:normal;text-indent:0.00pt;text-align:justify;text-align-last:left;white-space:normal;word-break:break-word;line-break:strict">我们从未就股本宣派或支付任何现金股息。我们目前拟保留所有可用资金及任何未来收益，用于为业务的运营和扩张提供资金，且预计在可预见的未来不会支付任何股息。未来宣派现金股息的任何决定将由董事会酌情作出，受适用法律约束，并将取决于多项因素，包括我们的财务状况、经营业绩、资本需求、合同限制、一般业务状况以及董事会可能认为相关的其他因素。此外，即使信贷融资项下目前并无未偿还金额，A&amp;R信贷协议的条款亦对我们可支付的现金股息金额施加了若干限制。</div></div></div></div>
