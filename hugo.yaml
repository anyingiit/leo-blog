baseURL: https://douseful.eu.org/
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false  # 中文保持根路径，英文在 /en/
timeZone: Asia/Shanghai  # 只写日期的 date 按北京时间解释，避免被当成未来文章跳过
title: Leoblog
theme: PaperMod
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true
summaryLength: 120
ignoreFiles: ['\.i18n\.yaml$']  # 英文配图的描述文件（tools/image-i18n），不进站点
pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON]  # JSON 供 PaperMod 站内搜索

# S-1 译本版本页的「完整 HTML」下载：单文件、图片内嵌（layouts/s1/list.s1full.html），导入工具在版本页 outputs 里启用
outputFormats:
  s1full:
    mediaType: text/html
    baseName: full
    isHTML: true
    notAlternative: true
    permalinkable: false

# 文章文件夹里的原图只在被引用原文件时才发布；正文里的 jpg/png/webp 会缩成 WebP（见 render-image.html），原图不用上线
cascade:
  - build:
      publishResources: false

permalinks:
  page:
    posts: /posts/:slug/
    notes: /notes/:slug/

params:
  displayFullLangName: true   # 文章页的译文链接写「中文」「English」，而不是 Zh / En
  env: production
  # S-1 译本的下架联系方式（声明、版权行、下载文件里都会出现；tools/s1-import/release.py 要求设置）
  s1Contact: leoycwan@gmail.com
  # 首页、归档、上一篇/下一篇只收长文（content/posts）；短文（content/notes）在 /notes/ 单独成栏
  mainSections: [posts]
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowShareButtons: false
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: true
  assets:
    disableHLJS: true  # 用 Hugo 自带的 Chroma 高亮
  fuseOpts:
    keys: [title, permalink, summary, content]

# 译文用同名 .en.md 文件，自动与中文原文互链
languages:
  zh:
    languageCode: zh-CN
    languageName: 中文
    weight: 1
    params:
      description: 记录学习、实践与思考。先写下来，再慢慢完善。
      homeInfoParams:
        Title: Leoblog
        Content: 记录学习、实践与思考。先写下来，再慢慢完善。
    menu:
      main:
        - { name: 短文, url: /notes/, weight: 5 }
        - { name: 译文, url: /translations/, weight: 7 }
        - { name: 归档, url: /archives/, weight: 10 }
        - { name: 标签, url: /tags/, weight: 20 }
        - { name: 搜索, url: /search/, weight: 30 }
  en:
    languageCode: en-US
    languageName: English
    weight: 2
    params:
      description: Notes on learning, practice and thinking. Write it down first, polish it later.
      homeInfoParams:
        Title: Leoblog
        Content: Notes on learning, practice and thinking. Write it down first, polish it later.
    menu:
      main:
        - { name: Notes, url: /en/notes/, weight: 5 }
        - { name: Translations, url: /en/translations/, weight: 7 }
        - { name: Archive, url: /en/archives/, weight: 10 }
        - { name: Tags, url: /en/tags/, weight: 20 }
        - { name: Search, url: /en/search/, weight: 30 }

markup:
  highlight:
    noClasses: false
    codeFences: true
    lineNos: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]

