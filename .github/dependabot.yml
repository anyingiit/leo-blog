# Source: GitHub Dependabot (official) — https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Add an entry for each package manager your project uses (see the link above).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    # Playwright 必须和 CI 镜像（ci.yml 里按 digest 锁定的 mcr.microsoft.com/playwright）同版本，手动一起升级
    ignore:
      - dependency-name: "playwright*"
      - dependency-name: "@playwright/*"
  - package-ecosystem: "npm"
    directory: "/tests/theme"
    schedule:
      interval: "weekly"
    # Playwright 同上；katex、mermaid 必须和站点引用的 CDN 版本一致（site.test.mjs 检查），改 CDN 版本时手动一起升级
    ignore:
      - dependency-name: "@playwright/*"
      - dependency-name: "katex"
      - dependency-name: "mermaid"
  # 仓库自带的 Python 工具（CI 的 Lint and build 任务安装并测试它们），版本用 == 锁定，有新版本或安全修复时提 PR
  - package-ecosystem: "pip"
    directories:
      - "/tools/image-i18n"
      - "/tools/s1-import"
      - "/tools/bilingual-import"
    schedule:
      interval: "weekly"
