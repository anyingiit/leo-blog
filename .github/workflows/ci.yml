# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repeat_each:
        description: "视觉测试每个用例重复次数（验证截图稳定性，docs/testing.md）"
        type: number
        default: 1

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

# 同一个 PR 连续推送时取消还在跑的旧运行（视觉测试要几分钟）。main 上每个提交各自一组，
# 连续合并时排队中的运行也不会被挤掉
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 公开仓库的标准运行机不计分钟，任务按"墙钟时间最短"拆：互不依赖的检查各自一个任务同时跑（docs/testing.md「CI 并行」）。
  # 先用十几秒决定这次要跑哪些浏览器测试（tests/ci-plan.mjs）：只跳过输入没变、已在相同文件上通过过的测试
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # 读 PR 改了哪些文件
      actions: read # 查 PR 提交的 CI 是否已通过
    outputs:
      regression: ${{ steps.plan.outputs.regression }}
      visual: ${{ steps.plan.outputs.visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # main 上的合并提交要和它的两个父提交比较

      # 查询出错一律按全跑处理
      - name: Decide which tests to run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          tested=""
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" || files=""
          elif [ "$EVENT" = push ]; then
            # 一次推送可能带多个提交，要比较推送前后的整个范围。推送前的提交不是祖先（强推）、
            # 新建分支或改动超过 300 个文件（比较接口只列 300 个）时拿不到完整列表，按全跑处理
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
              --jq 'if .status == "ahead" and (.files | length) < 300 then .files[].filename else error("范围不完整") end')" || files=""
            # 合并 PR 的提交：文件树和 PR 分支最后一个提交相同，而那个提交的 PR CI 已经通过 → 这棵树已经测过
            if p2="$(git rev-parse -q --verify 'HEAD^2')" && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$p2^{tree}")" ]; then
              n="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$p2&event=pull_request&status=success" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length')" || n=0
              [ "${n:-0}" -gt 0 ] && tested="--tested" && echo "合并提交的文件树与 $p2 相同，且 $p2 的 PR CI 已通过"
            fi
          else
            files=""
          fi
          printf '%s\n' "$files" | node tests/ci-plan.mjs $tested

  # 任务名不要改：main 的保护规则要求这个检查通过
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

      # Add your project's linters below this line.

      # 每个测试文件都必须在本文件里执行，新加的测试忘了接进 CI 会在这里失败（docs/testing.md）
      - name: Check that CI runs every test file
        if: ${{ !cancelled() }}
        run: node tests/ci-coverage.mjs

  # Python 工具的回归测试，每个工具一个任务：
  # image-i18n 英文配图脚本，并核对 content/ 里提交的英文图和描述文件一致（docs/image-translation.md）；
  # s1-import S-1 译本发布工具，并核对已发布版本的冻结下载文件（PDF 页数、每页「非官方」标记、文字层、sha256；docs/testing.md）；
  # bilingual-import 双语对照译文的导入、发布工具，并核对每篇已发布的冻结下载文件（docs/bilingual-translations.md）
  python:
    name: Python tests (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tool: [tools/image-i18n, tools/s1-import, tools/bilingual-import]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Run unittest
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r "$TOOL/requirements.txt"
          /tmp/venv/bin/python -m unittest discover -s "$TOOL" -v

  # 浏览器测试都在 Playwright 官方镜像里运行（按 digest 锁定）：浏览器和系统依赖已装好，不用每次下载安装，
  # 截图基准也在同一镜像里生成，换机器不会因字体渲染不同而误报。
  #
  # 站点回归测试：tests/ 下所有 *.test.mjs，包括图片处理和短文栏目（tests/README.md）、站点整体检查 site.test.mjs、
  # S-1 译本、双语译文等，分成 5 组同时跑（tests/ci-shards.mjs 按实测耗时分组，新加的文件自动分进去，
  # 每个测试在且只在一组里跑；单元测试 tests/ci-shards.test.mjs 核对组数和这里的 matrix 一致）
  regression:
    name: Regression tests (${{ matrix.shard }}/5)
    needs: plan
    # 拿不到计划时按全跑
    if: ${{ !cancelled() && needs.plan.outputs.regression != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # 容器里的用户和检出目录的属主不同，git 会拒绝操作（ci-coverage.test.mjs 要用 git ls-files）
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Hugo 处理过的图片（resources/_gen）跨运行复用：整站冷构建约 55 秒，其中几乎都是把文章配图转成 WebP，有缓存只要 2 秒。
      # Hugo 按源文件和处理参数给缓存文件命名，内容变了就重新生成；Hugo 版本（build.sh）或图片渲染钩子变了则整份缓存作废。
      # 每组的测试都构建正式站（含全部文章），缓存由第 1 组保存，其他组只读
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: hugo-cache
        with:
          path: resources/_gen
          key: hugo-resources-v2-${{ hashFiles('build.sh', 'layouts/_markup/**') }}-${{ hashFiles('content/**', 'assets/**', 'tests/fixtures/**', 'tests/theme/site-fixture/**') }}
          restore-keys: hugo-resources-v2-${{ hashFiles('build.sh', 'layouts/_markup/**') }}-

      # s1-links.test.mjs 用 pypdf 读冻结 PDF 的书签和页内链接。镜像里没有 pip，apt 装 python3-pip 会卡住，
      # pypdf 是纯 Python，直接下载固定版本的 wheel（校验 sha256）解压到 site-packages
      - name: Install pypdf
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib, io, site, urllib.request, zipfile
          url = "https://files.pythonhosted.org/packages/3f/4b/77e8ad4ac42c9d93600f40541a50e9feb3a61d2bbee2d76f659346072051/pypdf-6.21.4-py3-none-any.whl"
          data = urllib.request.urlopen(url, timeout=60).read()
          assert hashlib.sha256(data).hexdigest() == "33e4fb41ca352810eb4e9838aa0d82d6888a5f8bf682f43e99cce5faa666255c"
          zipfile.ZipFile(io.BytesIO(data)).extractall(site.getsitepackages()[0])
          PY
          python3 -I -c "import pypdf; print('pypdf', pypdf.__version__)"

      - name: Install test dependencies
        run: npm ci

      # 用 tests/fixtures 里的测试短文构建整站，检查图片处理、原位分组、折叠和页头语言切换等（见 tests/README.md）
      - name: Run regression tests
        run: node ci-shards.mjs "${{ matrix.shard }}" 5

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && matrix.shard == 1 && steps.hugo-cache.outputs.cache-hit != 'true' }}
        with:
          path: resources/_gen
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}

  # 主题与样式回归测试（docs/testing.md）：Chromium（≈Chrome）和 WebKit（≈Safari）× 电脑/平板/手机，每种组合一个任务，
  # 各自在浅色/深色、多种网络状态下逐像素比对截图，并检查交互。
  # 非视觉输出快照（文件清单、<head>、RSS、搜索索引）与浏览器无关，只在 chromium-desktop 任务里跑一次
  visual:
    name: Browser tests (${{ matrix.browser }}-${{ matrix.device }})
    needs: plan
    # 拿不到计划时按全跑
    if: ${{ !cancelled() && needs.plan.outputs.visual != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        device: [desktop, tablet, phone]
    env:
      PROJECTS: --project=${{ matrix.browser }}-${{ matrix.device }}${{ matrix.browser == 'chromium' && matrix.device == 'desktop' && ' --project=output' || '' }}
    defaults:
      run:
        working-directory: tests/theme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install test dependencies
        run: npm ci

      # 记录 CPU 型号：零容差截图如果在不同型号的机器上出现差异，可以据此排查
      - name: Run visual and behavior tests
        id: tests
        env:
          REPEAT: ${{ inputs.repeat_each || 1 }}
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          npx playwright test $PROJECTS --workers=4 --repeat-each="$REPEAT"

      # 失败时在同一镜像里重新生成有变化（或缺失）的基准图，连同对比图（期望/实际/差异）一起上传；
      # 同仓库的 PR 还会由下面的 baselines 任务把新基准推到 ci-baselines/pr-<编号> 分支，确认是预期改动后取回提交
      - name: Regenerate baselines for review
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          cp -R test-results test-results-failed || true
          npx playwright test $PROJECTS --workers=4 --last-failed --update-snapshots=changed --reporter=dot || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.tests.outcome == 'failure'
        with:
          name: visual-${{ matrix.browser }}-${{ matrix.device }}
          # 只带本任务自己生成的基准目录（output 只有 chromium-desktop 跑），合并多个任务的产物时不会用旧文件覆盖新文件
          path: |
            tests/theme/test-results-failed/
            tests/theme/playwright-report/
            tests/theme/__snapshots__/${{ matrix.browser }}-${{ matrix.device }}/
            ${{ matrix.browser == 'chromium' && matrix.device == 'desktop' && 'tests/theme/__snapshots__/output/' || '' }}
          retention-days: 14

  # 把各视觉任务重新生成的基准图合并推到 ci-baselines/pr-<编号> 分支（只在同仓库 PR 的视觉任务失败时运行）。
  # 写权限只给这个任务，它不执行仓库里的任何代码，只下载上面的产物、提交并推送。
  baselines:
    name: Publish regenerated baselines
    needs: visual
    if: failure() && needs.visual.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-*
          path: ${{ runner.temp }}/visual
          # 只有一个任务失败时只有一个产物，不合并的话它会直接解压到 path 下（没有 visual-<浏览器>-<设备>/ 子目录），
          # 下面按子目录找就什么也拷不到、误报"没有变化"。各产物的基准目录互不重叠，合并解压不会互相覆盖
          merge-multiple: true

      - name: Push baselines branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ci-baselines/pr-${{ github.event.pull_request.number }}
          VISUAL: ${{ runner.temp }}/visual
        run: |
          set -euo pipefail
          cp -R "$VISUAL/__snapshots__/." tests/theme/__snapshots__/
          git add -A tests/theme/__snapshots__
          if git diff --cached --quiet; then echo "基准图没有变化"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Regenerated screenshot baselines for ${{ github.event.pull_request.head.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          echo "::notice::新基准图已推到 $BRANCH，核对后取回：git fetch origin $BRANCH && git checkout FETCH_HEAD -- tests/theme/__snapshots__"

  # 汇总：上面任何一个任务失败或被取消，这里就失败（被计划跳过的不算）。
  # 想让 main 的保护规则只认一个检查、又覆盖全部测试时，要求这个检查即可（docs/testing.md「CI 并行」）
  all:
    name: All tests passed
    needs: [plan, lint, python, regression, visual]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | grep '"result"' || true
          [ "$FAILED" = false ]
